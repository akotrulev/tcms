# TCMS — local development stack.
#
# Postgres 17 with the real two-role privilege split, plus the backend built from source.
# This is the same shape the Hetzner VM runs (see
# docs/plans/2026-07-30-tcms-hetzner-deployment-runbook.md), with one deliberate
# difference: there, Postgres is host-native and only the backend is containerized.
#
#   cp .env.example .env
#   docker compose up --build
#
# A SECOND, CONCURRENT STACK (two agents/sessions each holding their own browser pass) is
# `cp .env.lane-b.example .env.lane-b && docker compose --env-file .env.lane-b up --build`.
# That file shifts every host port and sets COMPOSE_PROJECT_NAME, which renames the `pgdata`
# volume with it — so lane B gets its own database rather than migrating lane A's. See
# docs/plans/2026-07-31-parallel-execution-rework.md.
#
# The frontend is NOT here. `npm run dev` proxies /api to this stack's backend and therefore
# REQUIRES it — the mock layer that once made the SPA runnable on its own was deleted on
# 2026-08-06 along with VITE_API_MODE, so there is no mode to choose any more.
#
# Passwords are required rather than defaulted (`${VAR:?}`), so this file contains no
# credential and cannot be copied to a server with a password someone forgot to change.

# Overridable so a second lane gets its own project namespace — and therefore its own
# `pgdata` volume, since Compose prefixes volume names with the project. Two lanes sharing
# one volume would have the second one's Flyway run against the first one's schema, which
# is the same class of failure as two agents claiming migration version V13.
name: ${COMPOSE_PROJECT_NAME:-tcms}

services:
  postgres:
    image: postgres:17
    # Pinned to the same tag IntegrationTestBase boots. Drift here is the one that matters:
    # a local database on a different major than the 124-test suite runs against turns
    # "green in CI" into a claim about a version nobody deploys.
    restart: unless-stopped
    environment:
      # The superuser exists only to run initdb and the role script. Nothing connects as
      # it afterwards — not the app, not Flyway.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set it in .env — copy .env.example}
      POSTGRES_DB: postgres
      # Consumed by 10-tcms-roles.sql via psql \getenv, so no password is written into SQL.
      TCMS_OWNER_PASSWORD: ${DB_MIGRATION_PASSWORD:?set it in .env — copy .env.example}
      TCMS_APP_PASSWORD: ${DB_PASSWORD:?set it in .env — copy .env.example}
    volumes:
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      # 127.0.0.1 only. A Postgres bound to 0.0.0.0 on a laptop is reachable from every
      # network that laptop joins.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      # pg_isready is not enough: during initdb the server is already accepting local
      # connections while the tcms database does not yet exist, so the backend would start,
      # fail to connect, and restart-loop through a green dependency. Querying the actual
      # database is what proves the role script finished.
      test: ["CMD-SHELL", "psql -U postgres -d tcms -tAc 'SELECT 1' >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ./backend
      args:
        VERSION: ${TCMS_VERSION:-0.1.0-SNAPSHOT}
        REVISION: ${TCMS_REVISION:-dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: tcms
      # The application pool: unprivileged, RLS in force.
      DB_USER: tcms_app
      DB_PASSWORD: ${DB_PASSWORD:?set it in .env — copy .env.example}
      # Flyway only. Owns the schema; never serves a request.
      DB_MIGRATION_USER: tcms_owner
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?set it in .env — copy .env.example}
      # Session signing. Required with no default in application.yml, deliberately: a
      # signing key committed to the repository is a forged session for anyone who can
      # read it, and it is the class of default that survives to production because
      # nothing ever fails because of it.
      TCMS_JWT_SECRET: ${TCMS_JWT_SECRET:?set it in .env — copy .env.example}
      # Encrypts every notification-channel credential in the instance. Required with no
      # default for TCMS_JWT_SECRET's reason exactly: a webhook URL IS the authentication,
      # so a key committed to this repository is every client's release channel open to
      # anyone who can read it. Base64 of 32 bytes — openssl rand -base64 32.
      TCMS_INTEGRATION_SECRET_KEY: ${TCMS_INTEGRATION_SECRET_KEY:?set it in .env — copy .env.example}
      # Encrypts every OIDC client secret in the instance. A SECOND key rather than the one
      # above because `identity` may not depend on `integration` and so cannot reach it — and
      # separate keys keep a rotation's blast radius to one subsystem. Base64 of 32 bytes.
      TCMS_IDENTITY_SECRET_KEY: ${TCMS_IDENTITY_SECRET_KEY:?set it in .env — copy .env.example}
      # This API's own public origin — what an OIDC redirect_uri is built from, and what a
      # client's administrator registers with their issuer. The SPA's origin is TCMS_BASE_URL
      # below and is a different host in development.
      TCMS_API_BASE_URL: ${TCMS_API_BASE_URL:-http://localhost:8080}
      # Where an invitee's browser can reach the SPA. NOT derivable from the request:
      # behind a reverse proxy the container only ever sees its own address, and a link
      # built from that would send every invitee to localhost:8080.
      TCMS_BASE_URL: ${TCMS_BASE_URL:-http://localhost:5173}
      # Mail is optional locally. With no relay the application logs a warning and the
      # provisioning CLI still prints the activation link, so onboarding works by hand.
      SPRING_MAIL_HOST: ${SMTP_HOST:-}
      SPRING_MAIL_PORT: ${SMTP_PORT:-25}
      TCMS_MAIL_FROM: ${TCMS_MAIL_FROM:-tcms@localhost}
      # Instance-level social sign-in (V58). Optional in the Compose sense too — `:-` is
      # correct HERE and wrong in application*.yml (§108); the Spring side reads `${VAR:}`.
      # Absent means the button does not exist; a provider is live exactly when both halves
      # of its credential are present.
      TCMS_SOCIAL_GITHUB_CLIENT_ID: ${TCMS_SOCIAL_GITHUB_CLIENT_ID:-}
      TCMS_SOCIAL_GITHUB_CLIENT_SECRET: ${TCMS_SOCIAL_GITHUB_CLIENT_SECRET:-}
      TCMS_SOCIAL_GITLAB_CLIENT_ID: ${TCMS_SOCIAL_GITLAB_CLIENT_ID:-}
      TCMS_SOCIAL_GITLAB_CLIENT_SECRET: ${TCMS_SOCIAL_GITLAB_CLIENT_SECRET:-}
      TCMS_SOCIAL_GOOGLE_CLIENT_ID: ${TCMS_SOCIAL_GOOGLE_CLIENT_ID:-}
      TCMS_SOCIAL_GOOGLE_CLIENT_SECRET: ${TCMS_SOCIAL_GOOGLE_CLIENT_SECRET:-}
      TCMS_SOCIAL_GITLAB_BASE_URL: ${TCMS_SOCIAL_GITLAB_BASE_URL:-}
    volumes:
      # The product's state that is NOT in Postgres: evidence, generated reports, and the
      # verbatim CI uploads. `application.yml` defaults all three roots under this directory.
      #
      # WITHOUT THIS, `docker compose up --build` — the command CLAUDE.md gives as the way to
      # run this stack — produced a backend that 500s on the first evidence upload, the first
      # report download and the first CI ingestion, with nothing wrong at boot. Found by a live
      # pass on 2026-08-06 (§110 F10) and AGAIN, on the same stack trace, on 2026-08-12: the
      # first finding fixed compose.prod.yaml and recorded "production is unaffected", which was
      # true and left this file alone.
      #
      # A NAMED VOLUME, not a bind mount, and the difference is load-bearing rather than
      # stylistic: Docker seeds a fresh named volume from the image's content at that path,
      # ownership included, so this comes up owned by 10001 because backend/Dockerfile creates
      # the three directories. A bind mount would take the host's ownership instead and put a
      # `chown` on the developer — which is precisely the step production needs and forgets.
      #
      # It is also why `docker compose down -v` is the documented reset: -v drops this with
      # pgdata, so the blobs and the rows they belong to are discarded together. Plain `down`
      # keeps both, which is the pairing you want.
      - tcmsblobs:/var/lib/tcms
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"

  keycloak:
    # The reference issuer. Resolved question #37 chose Keycloak precisely so this lane's
    # counterparty is a real OIDC provider rather than a mock — §217 ships discovery, an
    # authorization-code+PKCE redirect, a token exchange and id_token verification, and no
    # test in the suite drives any of it over HTTP. Six of the nine mutation rows in
    # docs/verification/backend-mutation-checks.md are expected green for that reason alone.
    image: quay.io/keycloak/keycloak:26.4
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # ONE hostname, and both sides must use it. This fixes the `iss` claim and every
      # endpoint the discovery document advertises. Left to start-dev's per-request
      # resolution, a browser arriving on localhost and the backend arriving on the compose
      # alias would be told two different issuers, and OidcIdTokenVerifier's
      # JwtIssuerValidator would refuse the id_token — after a sign-in that otherwise looked
      # like it worked. See deploy/keycloak/README.md.
      KC_HOSTNAME: http://${KEYCLOAK_HOSTNAME:-keycloak.localtest.me}:${KEYCLOAK_PORT:-8081}
      # Container port and host port are the SAME number, unlike every other service here,
      # because the port is part of the issuer URL and therefore part of the `iss` claim.
      # Publishing 8081 onto a container listening on 8080 would give the browser a working
      # login page whose tokens the backend then rejects.
      KC_HTTP_PORT: ${KEYCLOAK_PORT:-8081}
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:${KEYCLOAK_PORT:-8081}"
    networks:
      default:
        # The alias is what makes one URL work from both sides: the backend resolves it on
        # the compose network, and `keycloak.localtest.me` resolves to 127.0.0.1 in public
        # DNS so the browser reaches the published port with no /etc/hosts edit.
        aliases:
          - ${KEYCLOAK_HOSTNAME:-keycloak.localtest.me}
    # No healthcheck and no `depends_on` from the backend, deliberately: discovery is lazy
    # and per-provider, so nothing in the application touches this at boot. A gate here
    # would only make `docker compose up` slower for the developers who are not testing SSO.

volumes:
  pgdata:
  # Named per the compose project (see `name:` above), so lane B gets its own blobs alongside
  # its own pgdata rather than writing evidence into lane A's tree.
  tcmsblobs:
