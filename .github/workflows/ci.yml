name: ci

# The public copy's CI. GitHub-hosted runners only: this repository is public, so no job may
# target a self-hosted machine — a fork's pull request can propose workflow changes, and on a
# self-hosted runner those would execute on that machine.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: backend — compile (-Werror) + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out
        uses: actions/checkout@v6
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            backend/gradle/libs.versions.toml
            backend/*.gradle.kts
      # Every integration test boots a real Postgres 17 through Testcontainers; the hosted
      # runner's Docker daemon is what makes that possible.
      - name: Build and test
        run: ./gradlew build --no-daemon

  frontend:
    name: frontend — build + lint + smoke tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Test (smoke set)
        run: npm run test:smoke

  packages:
    name: packages — build + lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages
    steps:
      - name: Check out
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: packages/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint --workspaces
      - name: Test
        run: npm run test:run --workspaces
      - name: Pack and install-verify the user-facing tarballs
        run: npm run pack:release -- --version 0.0.0 --out "$RUNNER_TEMP/release"
