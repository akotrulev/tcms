spring:
  application:
    name: tcms

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tcms}
    username: ${DB_USER:tcms_app}
    password: ${DB_PASSWORD:tcms}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 5000
      leak-detection-threshold: 60000

  jpa:
    open-in-view: false          # a view-rendered lazy load holds a connection per request
    hibernate:
      ddl-auto: validate         # non-negotiable: Flyway owns DDL, Hibernate only checks it
    properties:
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
      hibernate.order_updates: true
      hibernate.query.fail_on_pagination_over_collection_fetch: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Baseline deliberately off: V1 must run on an empty database so the RLS policy
    # block executes. A baselined install would skip it and ship without isolation.
    baseline-on-migrate: false

    # Flyway migrates as the SCHEMA OWNER, not as the application pool's role.
    #
    # Without these three lines Flyway inherits spring.datasource above and migrates as
    # tcms_app — a role that by design owns nothing and can create nothing, so V1 fails
    # on its first CREATE TABLE. The two repairs that suggest themselves are both
    # catastrophic: connecting the application as the owner hands it ALTER/DROP POLICY on
    # all 56 tables, and granting the app role ownership or BYPASSRLS voids isolation
    # outright.
    #
    # The URL is a reference rather than a copy so a typo cannot point the migration and
    # the application at two different databases — the failure mode there is a schema
    # that migrates cleanly somewhere nobody reads.
    #
    # deploy/postgres/initdb/10-tcms-roles.sql creates both roles for compose; the Hetzner
    # runbook (docs/plans/2026-07-30-tcms-hetzner-deployment-runbook.md) does the same on
    # a host-native Postgres. IntegrationTestBase overrides all three via
    # @DynamicPropertySource, so the test harness is unaffected.
    url: ${spring.datasource.url}
    user: ${DB_MIGRATION_USER:tcms_owner}
    password: ${DB_MIGRATION_PASSWORD:tcms}

  threads:
    virtual:
      enabled: true

tcms:
  auth:
    jwt:
      # No default, deliberately: a signing key in the repository is a forged session for
      # anyone who can read it, and it is the kind of default that reaches production
      # because nothing ever fails because of it. Compose and the runbook both set it.
      secret: ${TCMS_JWT_SECRET:?a JWT signing secret of at least 32 characters is required}
      issuer: ${TCMS_JWT_ISSUER:tcms}
      ttl: PT8H
      remember-me-ttl: P30D

  invitation:
    # The SPA's public origin — what an invitee's browser can reach, NOT what the container
    # sees. Behind Caddy the app only ever knows localhost:8080, and a link built from the
    # request would send every invitee there. Defaulted for local development only; a
    # deployment sets TCMS_BASE_URL and the Hetzner runbook says so.
    base-url: ${TCMS_BASE_URL:http://localhost:5173}
    accept-path: /accept-invitation
    validity: P7D
    from-address: ${TCMS_MAIL_FROM:tcms@localhost}

  case-health:
    # How stale a case's newest recorded result may be before LONG_UNEXECUTED is raised.
    # §6o's suggested default. INSTANCE-WIDE, and §6o says it should be per project —
    # plan §8 open question #30 is still open and there is no project settings table to
    # hold it, so this is the fallback a project setting will one day override rather
    # than a decision that it never should. See CaseHealthProperties.
    long-unexecuted: ${TCMS_LONG_UNEXECUTED:P90D}

  # spring.mail.host is deliberately NOT defaulted. Boot only auto-configures a
  # JavaMailSender when it is set, and MailConfiguration turns its absence into a loud
  # warning rather than a startup failure — an install with no relay still works, it just
  # cannot email anyone. A default of localhost would instead produce a connection refused
  # on every invitation, which reads as a bug rather than as missing configuration.

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # Mail is NOT a health signal for this application, and leaving it on made every
    # default install report itself DOWN. Three reasons, in order of weight:
    #
    # 1. A mail outage is deliberately survivable here. SmtpInvitationMailer swallows send
    #    failures and InvitationMailTest pins that ("a dead relay does not undo the company
    #    it was announcing"). An indicator that turns a tolerated failure into an aggregate
    #    DOWN contradicts a decision the suite already enforces.
    # 2. DOWN is an instruction, not a note — an orchestrator restarts the container or
    #    depools it. Neither action can reach an SMTP relay, so the signal is wrong rather
    #    than merely noisy.
    # 3. MailHealthIndicator calls testConnection() on EVERY poll, opening a real SMTP
    #    connection each time. At the image's 30s HEALTHCHECK interval that is ~2,900
    #    connections a day to a third-party relay, which is a shape relays rate-limit.
    #
    # Why here and not in compose: Boot's MailSenderAutoConfiguration gates on
    # @ConditionalOnProperty("spring.mail.host"), which matches a property that is PRESENT
    # — and an empty string is present. compose.yaml writes SPRING_MAIL_HOST: ${SMTP_HOST:-},
    # and compose interpolation cannot omit a key conditionally, so "no relay" arrives as
    # an empty host on every install that has not configured one. The JavaMailSender is
    # then built pointing at nowhere, the indicator dials localhost, and the aggregate takes
    # the worst of its components. Any templated deployment produces the same empty value,
    # so the application is the only place that covers all of them.
    #
    # This is MailConfiguration's trap (§18 defect 3) one level up: that fix stopped an
    # empty host selecting THIS project's SMTP mailer. It could not stop Boot's own
    # auto-configuration, and the unused JavaMailSender bean is still there — known, not
    # missed. HealthReportTest asserts all of it, including a canary that fails if a future
    # Boot version rejects a blank host and makes this line dead configuration.
    mail:
      enabled: false

logging:
  level:
    com.tcms: INFO
