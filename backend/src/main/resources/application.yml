spring:
  application:
    name: tcms

  autoconfigure:
    # spring-ldap-core is on the classpath for LdapDirectory, which builds a context source PER
    # PROVIDER ROW at sign-in time. Boot's LdapAutoConfiguration triggers on the class alone and
    # wires ONE application-wide ContextSource from spring.ldap.* — defaulting to localhost:389 —
    # plus an LdapTemplate bean, which the actuator's LDAP health indicator then pings. The result
    # is a health probe that reports the whole instance DOWN because a server this product never
    # talks to is not there. Excluding it removes the bean, and the health indicator's
    # @ConditionalOnBean(LdapOperations) removes the probe with it.
    exclude:
      - org.springframework.boot.autoconfigure.ldap.LdapAutoConfiguration

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tcms}
    username: ${DB_USER:tcms_app}
    password: ${DB_PASSWORD:tcms}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 5000
      leak-detection-threshold: 60000

  jpa:
    open-in-view: false          # a view-rendered lazy load holds a connection per request
    hibernate:
      ddl-auto: validate         # non-negotiable: Flyway owns DDL, Hibernate only checks it
    properties:
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
      hibernate.order_updates: true
      hibernate.query.fail_on_pagination_over_collection_fetch: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Baseline deliberately off: V1 must run on an empty database so the RLS policy
    # block executes. A baselined install would skip it and ship without isolation.
    baseline-on-migrate: false

    # Flyway migrates as the SCHEMA OWNER, not as the application pool's role.
    #
    # Without these three lines Flyway inherits spring.datasource above and migrates as
    # tcms_app — a role that by design owns nothing and can create nothing, so V1 fails
    # on its first CREATE TABLE. The two repairs that suggest themselves are both
    # catastrophic: connecting the application as the owner hands it ALTER/DROP POLICY on
    # all 56 tables, and granting the app role ownership or BYPASSRLS voids isolation
    # outright.
    #
    # The URL is a reference rather than a copy so a typo cannot point the migration and
    # the application at two different databases — the failure mode there is a schema
    # that migrates cleanly somewhere nobody reads.
    #
    # deploy/postgres/initdb/10-tcms-roles.sql creates both roles for compose; the Hetzner
    # runbook (docs/plans/2026-07-30-tcms-hetzner-deployment-runbook.md) does the same on
    # a host-native Postgres. IntegrationTestBase overrides all three via
    # @DynamicPropertySource, so the test harness is unaffected.
    url: ${spring.datasource.url}
    user: ${DB_MIGRATION_USER:tcms_owner}
    password: ${DB_MIGRATION_PASSWORD:tcms}

  servlet:
    multipart:
      # Evidence uploads PROXY THROUGH THE API, because the storage port's filesystem adapter
      # cannot sign a URL (open question #28, §51 — the consequence was stated when the option
      # was chosen). So these two numbers are the only thing standing between one caller and the
      # disk the whole instance shares, and Boot's defaults (1MB file / 10MB request) would
      # refuse an ordinary full-page screenshot — an unset limit here is not "no limit", it is
      # the wrong limit.
      #
      # 10MB holds a screenshot or a log excerpt and refuses a screen recording, which is the
      # line the product wants until per-project quota exists (#28's other half, still open and
      # made MORE pressing by the filesystem adapter, not less: the bound is one disk).
      #
      # max-request-size is deliberately larger than max-file-size rather than equal: the
      # multipart envelope carries the caption and stepId parts and their headers too, so an
      # exactly-10MB file with a caption would otherwise be refused for a reason naming the file.
      max-file-size: 10MB
      max-request-size: 12MB

  threads:
    virtual:
      enabled: true

tcms:
  auth:
    jwt:
      # No default, deliberately: a signing key in the repository is a forged session for
      # anyone who can read it, and it is the kind of default that reaches production
      # because nothing ever fails because of it. Compose and the runbook both set it.
      #
      # ############################################################################
      # THIS LINE READ `${TCMS_JWT_SECRET:?a JWT signing secret of at least 32
      # characters is required}` UNTIL 2026-08-06, AND THAT IS NOT WHAT IT LOOKS LIKE.
      #
      # `${VAR:?message}` is POSIX-shell and Docker-Compose syntax for "fail if unset".
      # **Spring has no such form.** Spring splits on the FIRST `:` and takes everything
      # after it as the DEFAULT VALUE — so the effective signing key, whenever the
      # environment variable was absent, was the literal 59-character string:
      #
      #     ?a JWT signing secret of at least 32 characters is required
      #
      # which clears @NotBlank and @Size(min = 32) in JwtProperties and starts the
      # application without a murmur. The comment directly above was true as an
      # intention and false as a description, the validation was real but satisfied,
      # and the production instance ran on that key — a value committed to this
      # repository — from §18 until it was found. Exactly the failure the comment
      # predicts, delivered by the line meant to prevent it.
      #
      # `${TCMS_JWT_SECRET}` with NO colon is the spelling that actually refuses: an
      # unresolvable placeholder throws at bind time and the context does not start.
      # IntegrationTestBase supplies its own value via @DynamicPropertySource, so the
      # suite is unaffected. Do not "helpfully" add a default back.
      #
      # SINCE §216 THE VALUE ITSELF IS REFUSED, not just this spelling. Fixing the
      # spelling closed the way the string got MINTED and left every way it can still
      # be SUPPLIED — a restored pre-2026-08-06 backup, or an operator resolving a
      # startup failure by pasting the value out of this file. JwtProperties
      # #isSecretUsable rejects it, and rejects any key starting with `?` or `-`,
      # which is what a resolved ${VAR:?…} / ${VAR:-…} leaves behind. The quoted
      # 59-character string above is what that check is compared against, so DO NOT
      # REWORD IT — JwtPropertiesTest#theRefusedKeyIsTheOneThatShipped reads it from
      # this file, indentation and all, so the constant cannot drift into an
      # approximation of the incident.
      # ############################################################################
      secret: ${TCMS_JWT_SECRET}
      issuer: ${TCMS_JWT_ISSUER:tcms}
      ttl: PT8H
      remember-me-ttl: P30D

    # Instance-level social sign-in (GitHub / GitLab / Google) — the 2026-08-16 plan. These are
    # authorities for PEOPLE, not companies, so their relying-party credentials are operator
    # configuration and never identity_provider rows. ABSENT MEANS OFF: a provider is a live
    # sign-in route exactly when both halves are present (SocialProperties.configured), so the
    # empty default `${VAR:}` is correct here — these are optional features, not required
    # secrets, and §108's no-colon rule is about values the app must refuse to start without.
    social:
      github:
        client-id: ${TCMS_SOCIAL_GITHUB_CLIENT_ID:}
        client-secret: ${TCMS_SOCIAL_GITHUB_CLIENT_SECRET:}
      gitlab:
        client-id: ${TCMS_SOCIAL_GITLAB_CLIENT_ID:}
        client-secret: ${TCMS_SOCIAL_GITLAB_CLIENT_SECRET:}
      google:
        client-id: ${TCMS_SOCIAL_GOOGLE_CLIENT_ID:}
        client-secret: ${TCMS_SOCIAL_GOOGLE_CLIENT_SECRET:}
      # Separate so a self-managed GitLab works; blank means gitlab.com.
      gitlab-base-url: ${TCMS_SOCIAL_GITLAB_BASE_URL:}

  identity:
    # The key every OIDC client secret is encrypted with. NO COLON, for §108's reason: `${VAR:?msg}`
    # is shell and Compose syntax that Spring reads as a DEFAULT, and this repository has already
    # shipped a production signing key that was the literal text of its own error message. An
    # unresolvable placeholder throws at bind time and the context does not start.
    #
    # A SECOND key rather than tcms.integration.secret-key, and the reason is the module boundary:
    # `identity` may not depend on `integration`, so it can reach neither that key nor the cipher
    # that uses it. Separate keys are the better answer anyway — a rotation's blast radius is one
    # subsystem, and losing the notification key is not also losing every company's sign-in config.
    #
    # Base64 of exactly 32 bytes: `openssl rand -base64 32`.
    provider-secret-key: ${TCMS_IDENTITY_SECRET_KEY}

  oidc:
    # Both timeouts bound something an external issuer controls and this deployment does not: the
    # URL a request thread blocks on was typed by a client's own administrator. The read timeout is
    # the one that matters — an issuer that accepts the connection and never answers holds a request
    # thread until the container's own limit, which is a denial of service against the whole
    # instance rather than one failed sign-in.
    connect-timeout: PT5S
    read-timeout: PT10S

    # How long a fetched openid-configuration is reused. Not zero, or every callback costs an extra
    # round trip to a third party; not indefinite, or a rotated jwks_uri needs a restart.
    discovery-ttl: PT15M

    # How long an in-flight authorization request stays resolvable. Short: the row exists only for
    # the seconds between the redirect and the callback, and a long window is a long window in which
    # a leaked `state` is still worth replaying.
    attempt-validity: PT10M

    # THIS API's public origin, which the redirect_uri is built from — deliberately NOT
    # tcms.invitation.base-url, which is the SPA's and is a different host in development. Not
    # derived from the request either: `Host` is caller-supplied, and behind Caddy the container
    # only ever sees localhost:8080, so a request-derived value would either send people nowhere or
    # let a forged header nominate where an authorization code is delivered.
    api-base-url: ${TCMS_API_BASE_URL:http://localhost:8080}

    # Where the browser lands on the SPA afterwards, carrying the session in the URL FRAGMENT.
    spa-callback-path: /sso/callback

  ldap:
    # The same argument as oidc above, one protocol over: the directory host was chosen by a
    # client's own administrator. A JNDI context with neither timeout set blocks for ever.
    connect-timeout: PT3S
    read-timeout: PT5S
    # NOT a lockout on this product's own credential — local sign-in deliberately has none. Every
    # failed bind increments the CUSTOMER'S directory counter, so an endpoint with no bound here is
    # a way to lock a company's staff out of Active Directory from the internet, and the harm lands
    # on a system this product does not own and cannot unlock.
    max-bind-attempts: 5
    bind-lockout: PT60S

  api-token:
    # How stale api_token.last_used_at may be before an authenticated request is worth an UPDATE.
    # Coarse on purpose: the naive writer is one row update per request on the hot path, all
    # contending on a busy CI token's single row, to keep a value whose only reader is an
    # administrator deciding whether a credential is still in use. PT0S makes it per-request.
    last-used-resolution: PT1H

  rate-limit:
    # What one API token may ask for (MCP plan phase 9; the AI plan's open question 6 —
    # "per token, generous"). Sessions are not counted and unauthenticated requests cannot be:
    # see RateLimitFilter for both reasons.
    #
    # THE COUNTER IS IN MEMORY, IN ONE PROCESS. TCMS is one deployable, so today these numbers
    # are exact — a second replica multiplies every one of them by the replica count. Putting
    # the counter in Postgres instead would mean a write per request on the hot path against the
    # database this limit exists to protect.
    enabled: ${TCMS_RATE_LIMIT_ENABLED:true}

    # The sustained rate, per token. 10 requests a second is far above anything a working agent
    # or CI job does and far below what a loop does, which is the whole design target: this
    # bounds an accident, it is not a quota anybody is meant to plan against.
    requests-per-minute: ${TCMS_RATE_LIMIT_RPM:600}

    # How many may be spent at once. An agent's first act is a batch of list calls to learn the
    # project's shape (the surface spec's §6.2 summary is built from several), and refusing that
    # would make the first thing every session does fail. Must not exceed the per-minute rate —
    # RateLimitProperties refuses that configuration at startup and says why.
    burst: ${TCMS_RATE_LIMIT_BURST:120}

    # The cap on tracked buckets. Bounded already by live api_token rows, because an unknown
    # credential never authenticates and so never gets a bucket; this keeps that from being an
    # assumption the map silently depends on.
    max-tracked-tokens: ${TCMS_RATE_LIMIT_MAX_TOKENS:10000}

    # The local sign-in lockout (005 S10, decided 2026-08-28 to live here rather than in a table).
    # Per ADDRESS, never per account — keying on the submitted email would let anybody lock a
    # colleague out by mistyping their address — and SILENT: a locked address gets the same bodiless
    # 401 as a wrong password. Ten inside fifteen minutes is far above a person correcting a typo
    # and far below a useful guess rate against a 12-character minimum. Same in-memory,
    # one-process caveat as everything above; a restart forgets every lockout.
    sign-in-attempts: ${TCMS_RATE_LIMIT_SIGN_IN_ATTEMPTS:10}
    sign-in-lockout: ${TCMS_RATE_LIMIT_SIGN_IN_LOCKOUT:15m}

  storage:
    evidence:
      # Where evidence bytes land — the filesystem adapter behind the storage port (open
      # question #28, resolved in §51: filesystem now, S3 later, and the port is what makes the
      # second one additive).
      #
      # STATEFUL AND BACKUP-CRITICAL. Losing this directory loses every screenshot behind every
      # failed result; the evidence rows survive and their bytes do not, so the product renders
      # attachments that all 404 and no migration repairs it. It needs the same treatment in the
      # deployment runbook that the database gets — this is the first thing in the product whose
      # state is not in Postgres.
      #
      # Defaulted rather than required, unlike the JWT secret: a wrong path here fails loudly on
      # the first upload and harms nothing before then, whereas a defaulted signing key is a
      # forged session nothing ever fails on.
      root: ${TCMS_EVIDENCE_ROOT:/var/lib/tcms/evidence}

    reports:
      # Where generated report bytes land (§87). A root of its own rather than a subdirectory of
      # the evidence one: the two have different retention and different loss consequences, and a
      # deployment that wants one volume can point both here.
      #
      # NOT backup-critical, which is the one way it differs from evidence above. Every report is
      # regenerable from execution_fact, and what makes a report interpretable months later —
      # report_artifact.filter_snapshot, §6e's determinism requirement — is in Postgres. Losing
      # this directory costs re-running jobs, not history.
      #
      # NOTHING EVER DELETES FROM IT IN v1. That is a decision on the record (2026-08-04, and
      # V27's header carries it): no expires_at, no sweep, unbounded growth in the number of
      # reports a company generates. §6n is the section that will eventually govern retention.
      root: ${TCMS_REPORTS_ROOT:/var/lib/tcms/reports}

    raw-reports:
      # Where the VERBATIM CI upload lands (§160) — the file a build posted, byte for byte, before
      # this server understood any of it. A third root, under the same rule that split the two
      # above: retention and loss consequences differ from both.
      #
      # NOT the reports root. That one holds reports this product GENERATED and can regenerate;
      # this holds a report it RECEIVED and can never reproduce. Opposite in every property an
      # operator cares about, and one letter apart in the two type names, which is why they are two
      # types rather than one bean with a qualifier.
      #
      # THE HIGHEST WRITE RATE IN THE PRODUCT. Evidence arrives when a person attaches a
      # screenshot and a report when somebody asks; this arrives on every CI run of every project.
      # It is the one root an operator will plausibly want to prune first.
      #
      # Losing it does NOT lose the results. ingestion_job.raw_payload keeps the normalized parse
      # and every match outcome in Postgres, so the history screen and the binder survive intact.
      # What is lost is the answer to "is that what CI actually sent?" — an audit question. So it
      # sits between the two above: worth backing up, not worth blocking a release over.
      #
      # NOTHING EVER DELETES FROM IT IN v1, exactly as with the other two, and deliberately: a
      # retention sweep is a scheduled job with a company-scoped context and a policy nobody has
      # set, and shipping one here would make the product's first retention rule a side effect of
      # adding a download. §6n is where it will eventually be governed.
      root: ${TCMS_RAW_REPORTS_ROOT:/var/lib/tcms/raw-reports}

  invitation:
    # The SPA's public origin — what an invitee's browser can reach, NOT what the container
    # sees. Behind Caddy the app only ever knows localhost:8080, and a link built from the
    # request would send every invitee there. Defaulted for local development only; a
    # deployment sets TCMS_BASE_URL and the Hetzner runbook says so.
    base-url: ${TCMS_BASE_URL:http://localhost:5173}
    accept-path: /accept-invitation
    validity: P7D
    from-address: ${TCMS_MAIL_FROM:tcms@localhost}

  case-health:
    # How stale a case's newest recorded result may be before LONG_UNEXECUTED is raised.
    # §6o's suggested default. INSTANCE-WIDE, and §6o says it should be per project —
    # plan §8 open question #30 is still open and there is no project settings table to
    # hold it, so this is the fallback a project setting will one day override rather
    # than a decision that it never should. See CaseHealthProperties.
    long-unexecuted: ${TCMS_LONG_UNEXECUTED:P90D}

    # How long CI may go without posting a result for a case marked AUTOMATED before
    # STALE_AUTOMATION is raised — and, on the other side of the SAME cutoff, how recent
    # an ingested result must be for UNDECLARED_AUTOMATION to fire on a case that does
    # not claim automation (§6c, both directions).
    #
    # 14 days, which open question #30 resolved on 2026-08-02 rather than this line
    # choosing it. One duration for both signals on purpose: they read one fact — the
    # newest ingested result — on opposite sides of one cutoff, so two thresholds would
    # let the pair overlap or leave a gap. See CaseHealthProperties.
    stale-automation: ${TCMS_STALE_AUTOMATION:P14D}

  reporting:
    # How many of a case's most recent recorded results must ALL be failures before
    # FAILING_REPEATEDLY is raised. §6o words the signal as "failed the last N executions"
    # and names no N.
    #
    # Three, and the bound below it is the one that matters: at 1 the signal restates the
    # newest result, which the case grid, the run page and the dashboard's own counts all
    # already say — a slower second copy of a fact the reader has. At 2 a flake plus a real
    # failure raises it, which is the coincidence §6o's "decaying" severity exists to filter
    # out. Above 3 the signal needs a history a young project does not have, and one that
    # cannot fire in a project's first month is one nobody learns to trust.
    # ReportingProperties refuses to start below 2.
    #
    # A COUNT, not a duration, unlike long-unexecuted above: a case run nightly and a case
    # run quarterly are both failing repeatedly after three failures, and expressing this in
    # time would silently mean something different per project.
    failing-repeatedly-window: ${TCMS_FAILING_REPEATEDLY_WINDOW:3}

    # How far back case_flake's scoring reads (§6l's flakiness rule, M3 slice 6).
    #
    # Bounded for §120's reason arriving from the other direction: an unbounded flake score
    # can NEVER GO FALSE, so a test that flapped badly last spring and has been solid ever
    # since keeps a high score for ever with nothing anybody can do about it. §120 rejected
    # exactly that shape for UNDECLARED_AUTOMATION.
    #
    # A DURATION here, the opposite call to failing-repeatedly-window directly above, and
    # the two are consistent rather than inconsistent: that one is a count because three
    # failures mean the same thing nightly or quarterly, this one is a duration because it
    # answers "is this test flaky NOW" and a fixed count of results would mean a week of
    # history for a nightly suite and two years for a quarterly one.
    flake-window: ${TCMS_FLAKE_WINDOW:P90D}

    # How many adjacent pairs of outcomes INSIDE ONE CELL — (configuration, case version) —
    # are needed before a score is claimed at all. Below this, flake_score is NULL, which is
    # a different claim from 0: null is "not enough evidence to say", 0 is "evidently stable".
    #
    # Four, because two results that went pass then fail score a perfect 1.0 on any ratio
    # definition and that is noise, not a flake — and the number a human would then use to
    # decide whether to quarantine a test. At a floor of 1 a single flip is a perfect score;
    # at 2 a flip and a recovery still is. ReportingProperties refuses to start below 1.
    flake-minimum-transitions: ${TCMS_FLAKE_MINIMUM_TRANSITIONS:4}

    # How long a report job may sit RUNNING before the reaper marks it FAILED.
    #
    # The failure this guards is a worker that died after claiming: the row stays RUNNING for
    # ever, the client polling it watches a spinner with no end and no error, and the reports
    # list shows a job permanently about to finish. It is NOT a retry — the row goes to FAILED
    # with a sentence and a re-request is still a new row, which is what keeps one request per
    # row true.
    #
    # Fifteen minutes, not a number near how long a report takes. These reports are seconds of
    # work, so the duration is not what the value is choosing; what a SHORT timeout buys is the
    # chance of failing a job that was merely slow — under a lock, or on a very large project —
    # and telling the client it could not be produced while the worker is still producing it.
    # A dead process does not come back at minute fourteen. ReportingProperties refuses a
    # non-positive value, which would reap every job at the instant it was claimed.
    stuck-job-timeout: ${TCMS_STUCK_JOB_TIMEOUT:PT15M}

  outbox:
    # The transactional outbox (decision round 3 #52). V1 has carried the table since M0 and
    # CompanyScopedEvent has asserted since M0 that a failed handler lands in it; this is the
    # code behind both claims.

    # How often the company loop runs — the floor on how late a delivery can be. NOT tuned down
    # to make delivery feel instant: an outbox is what makes a delivery certain, and a deployment
    # that needs a shorter tail than this is usually asking for something else.
    interval: ${TCMS_OUTBOX_INTERVAL:PT1M}

    # How many of ONE company's due events are taken per tick. A bound, not a target: it is what
    # stops a company that generated fifty thousand events overnight from holding the loop while
    # every other company waits.
    batch-size: ${TCMS_OUTBOX_BATCH_SIZE:100}

    # How long a claimed delivery may run before the row becomes due again. This is the price of
    # a crash — a process that dies mid-delivery costs one lease, not a lost event — and it is
    # also the window in which a very slow handler is delivered twice, which is why handlers are
    # required to be idempotent. OutboxProperties REFUSES a lease shorter than the interval,
    # because that combination double-delivers everything slower than one tick.
    lease: ${TCMS_OUTBOX_LEASE:PT5M}

    # How many times delivery is STARTED before the row stops being retried. Counted at the
    # claim rather than at the failure, so a payload that kills the process still exhausts
    # instead of being retried for ever.
    max-attempts: ${TCMS_OUTBOX_MAX_ATTEMPTS:8}

    # The wait after each failed attempt; the last entry repeats. Try again almost immediately —
    # most failures are a lock timeout or a service that was restarting — then back right off, so
    # a genuinely broken handler is not hammered for the six hours before somebody notices.
    backoff: PT1M,PT5M,PT15M,PT1H,PT6H

  integration:
    # The key every notification-channel credential in this instance is encrypted with (§6r).
    #
    # NO DEFAULT AND NO COLON, and both halves are the same lesson. A Slack or Teams incoming
    # webhook URL *is* the authentication — anyone holding it can post into that room — and
    # unlike an API token a digest is not available, because the value has to be RECOVERABLE to
    # be used. So it is encrypted at rest, and this is the key.
    #
    # `${VAR:?message}` is shell and Compose syntax that SPRING DOES NOT IMPLEMENT: it splits on
    # the first `:` and takes the rest as the default value. That is how the JWT signing key
    # above came to be the literal text of its own error message, in production, for a year. A
    # required Spring property is `${VAR}` with no colon — an unresolvable placeholder throws at
    # bind time and the context does not start. ConfigConventionTest reads this text rather than
    # the resolved value, because IntegrationTestBase supplies its own key and therefore cannot
    # see a defect in the expression that ships.
    #
    # Base64 of exactly 32 bytes: `openssl rand -base64 32`. IntegrationProperties refuses
    # anything else at startup rather than padding or hashing it, because a short passphrase
    # makes a perfectly valid AES key and an unsafe one, and nothing the running product does
    # would ever reveal that.
    secret-key: ${TCMS_INTEGRATION_SECRET_KEY}

    outbound:
      # Whether OutboundUrlGuard will connect to a destination that RESOLVES to a private,
      # loopback, link-local or unique-local address (plan 004 D10).
      #
      # FALSE by default, and turning it on must be an operator's sentence. A self-hosted Jira
      # Data Center on a private LAN is exactly who sets it; a hostname that resolves to
      # 169.254.169.254 is exactly who it is refused for — and under per-user tracker
      # credentials, a base URL that resolves somewhere unintended exfiltrates EVERY CONNECTED
      # PERSON'S token to whatever answered, not one bot's.
      #
      # Defaulted, unlike secret-key above, and the difference is what each failure costs: a
      # missing key means no credential in the instance can be decrypted, so refusing to start is
      # the only safe behaviour; a missing value here has a correct answer, which is the safe one.
      #
      # ONE COLON. `${VAR:false}` is Spring's default syntax; `${VAR:-false}` is the shell's, and
      # Spring reads that as the literal default "-false". ConfigConventionTest reads this text
      # rather than the resolved value, because a test that supplies its own configuration cannot
      # see a defect in the expression that ships.
      allow-private-hosts: ${TCMS_INTEGRATION_ALLOW_PRIVATE_HOSTS:false}

    mail:
      # Who a notification email comes from — deliberately not tcms.invitation.from-address.
      # That one is what a stranger receives an account activation link from and a deployment
      # usually wants a human to answer it; this is what a release channel receives fifty run
      # notices from, which is the address an operator sends from a no-reply box and filters on.
      #
      # Defaulted, unlike the key above: a wrong from-address is a message that looks odd, and a
      # missing one would be a startup failure on every install that sends no notifications.
      from-address: ${TCMS_NOTIFICATION_MAIL_FROM:tcms@localhost}

  # spring.mail.host is deliberately NOT defaulted. Boot only auto-configures a
  # JavaMailSender when it is set, and MailConfiguration turns its absence into a loud
  # warning rather than a startup failure — an install with no relay still works, it just
  # cannot email anyone. A default of localhost would instead produce a connection refused
  # on every invitation, which reads as a bug rather than as missing configuration.

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # Mail is NOT a health signal for this application, and leaving it on made every
    # default install report itself DOWN. Three reasons, in order of weight:
    #
    # 1. A mail outage is deliberately survivable here. SmtpInvitationMailer swallows send
    #    failures and InvitationMailTest pins that ("a dead relay does not undo the company
    #    it was announcing"). An indicator that turns a tolerated failure into an aggregate
    #    DOWN contradicts a decision the suite already enforces.
    # 2. DOWN is an instruction, not a note — an orchestrator restarts the container or
    #    depools it. Neither action can reach an SMTP relay, so the signal is wrong rather
    #    than merely noisy.
    # 3. MailHealthIndicator calls testConnection() on EVERY poll, opening a real SMTP
    #    connection each time. At the image's 30s HEALTHCHECK interval that is ~2,900
    #    connections a day to a third-party relay, which is a shape relays rate-limit.
    #
    # Why here and not in compose: Boot's MailSenderAutoConfiguration gates on
    # @ConditionalOnProperty("spring.mail.host"), which matches a property that is PRESENT
    # — and an empty string is present. compose.yaml writes SPRING_MAIL_HOST: ${SMTP_HOST:-},
    # and compose interpolation cannot omit a key conditionally, so "no relay" arrives as
    # an empty host on every install that has not configured one. The JavaMailSender is
    # then built pointing at nowhere, the indicator dials localhost, and the aggregate takes
    # the worst of its components. Any templated deployment produces the same empty value,
    # so the application is the only place that covers all of them.
    #
    # This is MailConfiguration's trap (§18 defect 3) one level up: that fix stopped an
    # empty host selecting THIS project's SMTP mailer. It could not stop Boot's own
    # auto-configuration, and the unused JavaMailSender bean is still there — known, not
    # missed. HealthReportTest asserts all of it, including a canary that fails if a future
    # Boot version rejects a blank host and makes this line dead configuration.
    mail:
      enabled: false

logging:
  level:
    com.tcms: INFO
