[versions]
springBoot = "3.5.6"
springDependencyManagement = "1.1.7"
springModulith = "1.4.3"
postgresql = "42.7.7"
testcontainers = "1.21.3"
archunit = "1.4.1"
assertj = "3.27.3"
greenmail = "2.1.9"
gherkin = "42.0.1"
cucumberMessages = "34.2.1"
jspecify = "1.0.1"

[libraries]
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-mail = { module = "org.springframework.boot:spring-boot-starter-mail" }

# Spring LDAP over JNDI, for the directory sign-in flow (§223). Version-managed by the Boot BOM,
# like every other Spring artifact here.
#
# spring-ldap-core RATHER THAN spring-boot-starter-data-ldap, and it is not a style choice: the
# starter drags in Spring Data LDAP, whose auto-configuration builds ONE context source from
# `spring.ldap.urls`. This product has no single directory — it has one per provider per company,
# with the URL, the bind DN and the credential read from an RLS-protected row at sign-in time. The
# starter's shape would be a bean nothing uses and a boot-time property nobody can supply.
# (There is also no `spring-boot-starter-ldap`; the plan named an artifact that does not exist.)
#
# UnboundID is the test-scope in-process directory server: it speaks the protocol and serves LDAPS
# with a generated certificate, so the tests drive the ENCRYPTED path production drives rather than
# a plaintext one production never takes.
spring-ldap-core = { module = "org.springframework.ldap:spring-ldap-core" }
unboundid-ldapsdk = { module = "com.unboundid:unboundid-ldapsdk" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }

# spring-security-crypto is pulled in transitively by the starter; it stays listed here
# because BCrypt is used by the identity module, which must not depend on the web layer.
spring-security-crypto = { module = "org.springframework.security:spring-security-crypto" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }

# The resource-server starter rather than a bare JOSE library. v1 signs its own tokens
# with a symmetric key, but shaping the filter chain as a resource server now means M4's
# external OIDC providers add a second JwtDecoder instead of a second architecture.
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }

# The Gherkin parser, and ONLY the parser — plan §6a rule 3, integrations.md X1.
#
# `io.cucumber:gherkin` is the standalone parser: text in, the Gherkin AST out, no network and no
# runtime. It is NOT `io.cucumber:cucumber-gherkin`, which is the Cucumber-JVM runtime and drags in
# the whole test framework — a test runner inside a product that deliberately is not one.
#
# 42.0.1 rather than the blueprint's 27.0.0, which was inferred at planning time and re-probed here
# against Maven Central: 27 is fifteen majors behind, and the shape this code is written over only
# exists in the later ones. In 42 a syntax error is a `ParseError` ENVELOPE rather than a thrown
# exception (`ParserException` is package-private and cannot be caught by type at all), which is
# what makes "a parser failure is never a 500" a property of the API rather than a catch block
# somebody has to remember.
#
# `messages` and `jspecify` are gherkin's own transitives and are pinned here because it declares
# them as version RANGES (`[34.0.2,35.0.0)`, `[1.0.0,2.0.0)`). A range resolves to whatever is
# newest the day the build runs, so two builds of the same commit are two different artifacts —
# and the failure lands on a dependency nobody in this repo chose.
cucumber-gherkin = { module = "io.cucumber:gherkin", version.ref = "gherkin" }
cucumber-messages = { module = "io.cucumber:messages", version.ref = "cucumberMessages" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }

flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }

modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "springModulith" }
modulith-starter-core = { module = "org.springframework.modulith:spring-modulith-starter-core" }
modulith-starter-test = { module = "org.springframework.modulith:spring-modulith-starter-test" }

testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }

archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

# An in-JVM SMTP server. Not a container: mail needs no Postgres, and a structural
# dependency on Docker for a test that does not need it is a test that gets skipped.
greenmail-junit5 = { module = "com.icegreen:greenmail-junit5", version.ref = "greenmail" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }

[plugins]
springBoot = { id = "org.springframework.boot", version.ref = "springBoot" }
springDependencyManagement = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
