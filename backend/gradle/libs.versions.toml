[versions]
springBoot = "3.5.6"
springDependencyManagement = "1.1.7"
springModulith = "1.4.3"
postgresql = "42.7.7"
testcontainers = "1.21.3"
archunit = "1.4.1"
assertj = "3.27.3"
greenmail = "2.1.9"

[libraries]
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-mail = { module = "org.springframework.boot:spring-boot-starter-mail" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }

# Just the crypto artifact, not the whole security starter: at this point the codebase
# needs BCrypt and nothing else, and the starter's auto-configuration would secure every
# endpoint with a generated password before there is a filter chain to configure.
spring-security-crypto = { module = "org.springframework.security:spring-security-crypto" }

flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }

modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "springModulith" }
modulith-starter-core = { module = "org.springframework.modulith:spring-modulith-starter-core" }
modulith-starter-test = { module = "org.springframework.modulith:spring-modulith-starter-test" }

testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }

archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

# An in-JVM SMTP server. Not a container: mail needs no Postgres, and a structural
# dependency on Docker for a test that does not need it is a test that gets skipped.
greenmail-junit5 = { module = "com.icegreen:greenmail-junit5", version.ref = "greenmail" }

[plugins]
springBoot = { id = "org.springframework.boot", version.ref = "springBoot" }
springDependencyManagement = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
