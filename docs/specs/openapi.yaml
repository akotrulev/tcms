openapi: 3.1.0
info:
  title: TCMS API
  version: 0.1.0-mock
  description: |
    Test Case Management System — REST contract.

    This is the source of truth for the frontend TypeScript types and the MSW mock
    handlers. The backend has not been implemented yet; the shapes here are what the
    UI is being designed against, and will drive the eventual Spring Boot controllers.

    Companion documents:
      * docs/plans/2026-07-30-tcms-high-level-plan.md  (§ references throughout)
      * docs/specs/2026-07-30-tcms-erd.md              (persistence model)
      * docs/specs/2026-07-30-tcms-roles-permissions-naming.md
        (AUTHORITATIVE for the permission catalogue, role grants and naming)

    Conventions
      * All ids are UUIDs — and UUIDs are the only identifiers any path accepts.
      * Display keys (TC-1, TP-1, TS-1, TR-1, DOC-1) are sequential PER COMPANY and
        unique across all of that company's projects (plan §6t). They are display
        only: they never appear as a path identifier, because they are trivially
        guessable where a UUID is not. Paths stay nested under /projects/{projectId}
        because a project is a real navigation boundary — a whole client product —
        not because a key needs disambiguating.
      * A company is a separate CLIENT organisation and the top-level isolation
        boundary (plan §6s). Multi-company routing (/c/{slug}), the company switcher
        and per-company branding land with backend M6 and are deliberately NOT in
        this contract yet. What IS here is the shape those decisions already changed:
        the display-key format, the six built-in roles, and the permission catalogue.
      * List endpoints return { items, page, size, total } and accept composable
        filters. Filter state is expected to live in the URL (plan §6o/§6q).
      * Timestamps are RFC 3339 with offset.
      * Write endpoints that mutate versioned entities accept If-Match with the
        entity's lockVersion for optimistic concurrency (plan §7 resolved: multiple
        testers may work one run concurrently).

servers:
  - url: /api/v1

tags:
  - name: auth
  - name: projects
  - name: repository
  - name: execution
  - name: documentation
  - name: artifacts
  - name: reporting
  - name: admin
  - name: work

# =============================================================================
# PATHS
# =============================================================================
paths:

  # ---------------------------------------------------------------- auth ----
  # v1 is local accounts only. External OIDC providers (Cognito, Entra ID, Google,
  # Okta, Keycloak, generic) land in the integrations phase — plan §6r — and will add
  # /auth/providers, /auth/oidc/{provider}/authorize and /auth/oidc/{provider}/callback
  # alongside this endpoint, not replacing it. Local login is retained permanently as
  # the break-glass path for a self-hosted product.
  /auth/login:
    post:
      tags: [auth]
      summary: Authenticate with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                rememberMe: { type: boolean, default: false }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [auth]
      summary: End the current session
      description: |
        A client-side discard. The session token is stateless, so there is nothing
        server-side to invalidate and this endpoint deliberately does not pretend
        otherwise — a caller who believes a leaked token was revoked here would not
        rotate anything. Prompt revocation is the `pv` epoch (plan §6b), which
        invalidates every session for an account at once. A per-token denylist arrives
        with refresh tokens.
      responses:
        '204': { description: Session discarded by the client }

  # Invitation redemption. Open like /auth/login, and for the same reason: someone
  # accepting an invitation has no account to authenticate with yet.
  #
  # EVERY failure is 404 with no body — unknown token, expired, already redeemed,
  # membership since removed, account since deactivated. Told apart, they would let
  # anyone with a token-shaped string learn whether an address exists on this instance,
  # and email is unique instance-wide, so that spans every client. Same rule as an
  # unreachable display key (plan §6t), on the one surface a stranger can reach.
  /auth/invitations/{token}:
    get:
      tags: [auth]
      summary: What an invitation admits its holder to
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: |
            The single-use secret from the invitation email. In the path, and in the
            query string of the emailed link — a known exposure (browser history,
            Referer headers, proxy logs) bounded by the token being single-use,
            short-lived and inert once redeemed.
          schema: { type: string }
      responses:
        '200':
          description: The invitation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationPreview' }
        '404': { $ref: '#/components/responses/NotFound' }

  /auth/invitations/{token}/accept:
    post:
      tags: [auth]
      summary: Redeem an invitation and activate the account
      description: |
        Answers 204, not a session. The invitee then signs in with the password they
        just chose, which keeps token issuance to a single path and makes the round
        trip prove the password was stored as intended.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  format: password
                  minLength: 12
                  description: |
                    Required when `passwordRequired` was true; omitted otherwise, and
                    REJECTED rather than ignored when the account already has one —
                    holding an invitation to a second company must not confer the
                    ability to overwrite an existing credential. The 72-byte maximum is
                    BCrypt's: anything longer is only partly verified, so it is refused
                    rather than silently truncated.
      responses:
        '204': { description: Accepted; the account and the membership are now ACTIVE }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: The password was not accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /me:
    get:
      tags: [auth]
      summary: The authenticated user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/permissions:
    get:
      tags: [auth]
      summary: Effective permissions for the caller in a project
      description: |
        Drives UI affordances only. Every hidden action is independently rejected
        server-side — hidden is not protected (plan §6b).

        Three different questions, and the answers are deliberately not the same set
        (see MeController): with a projectId, the SYSTEM + COMPANY + PROJECT terms; with
        a company open but no project, SYSTEM + COMPANY only — NOT "whatever this caller
        holds on some project", because a Test Lead on one project must not read as
        holding project:settings company-wide; with no company at all, SYSTEM only.

        An unreachable project and a non-existent one both answer with the empty set,
        identically, so this endpoint cannot be used to probe for projects in other
        companies (plan §6t).
      parameters:
        - name: projectId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Permission keys
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffectivePermissions' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ------------------------------------------------------------ projects ----
  /projects:
    get:
      tags: [projects]
      summary: Projects visible to the caller
      responses:
        '200':
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [projects]
      summary: Create a project
      description: |
        Requires `project:create`, which is a **COMPANY-scope** permission — the only write in
        this contract whose gate is not a grant on the target, because the target does not exist
        yet. Held by Company Admin and Instance Admin only (roles spec §A3); a Test Lead running
        a project is not entitled to start another one.

        `key` is **supplied by the client**, not allocated. Display keys (`TC-n`, `TS-n`) are
        server-allocated from the company's counter because they number rows; a project key is a
        2–10 character label a human chooses, types and reads back in URLs — "OLB" for Online
        Banking — so allocating "P-3" would replace the one identifier in the system that is
        meant to be memorable. It is immutable once set (see `Project.key`) and unique per
        company, so two clients may both key a project `OLB`.

        **A key already used in this company is a `400` keyed on `key`, not a `409`.** The form
        has a field to put the message on, and the caller's next action is to type a different
        key rather than to reload. That also makes the endpoint safe to retry without an
        `Idempotency-Key`: the retry of a create that in fact succeeded cannot make a second
        project, because the key is taken by the first — which is why this endpoint deliberately
        does not accept the header that `POST …/cases` does.

        The created project is seeded exactly as `provision-company` seeds a first project — the
        Feature dimension, the six execution statuses and the Default configuration — so a
        project created here and one created by the operator CLI are the same thing.

        **No project grant is created for the caller.** Every route to `project:create` already
        carries `project:read` over every project in the company (a Company Admin's COMPANY-scope
        grant, an Instance Admin's SYSTEM one), so the new project is immediately in the caller's
        `GET /projects`. Minting a PROJECT-scope grant for them would instead make `myRole` claim
        a per-project role they do not hold.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: The created project's own URL.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /projects/{projectId}:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [projects]
      summary: Project detail
      responses:
        '200':
          description: Project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/classification:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [projects]
      summary: Classification dimensions and their values
      description: Test Type, Test Level, Feature tree, Execution Phase (plan §6d).
      responses:
        '200':
          description: Dimensions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ClassificationDimension' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/classification/values:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    post:
      tags: [projects]
      summary: Add a value to one of this project's classification dimensions
      description: |
        The vocabulary's first writer. `tcms_seed_project_defaults` seeds the Feature dimension
        **empty on purpose** — inventing a client's feature taxonomy for them is how a controlled
        vocabulary gets worked around — so until this endpoint existed a freshly provisioned
        project had a Feature tree that was empty and stayed empty, and the case editor's picker
        had nothing to pick.

        **The permission depends on the dimension, and so does the scope it is held at.** A
        project-level dimension (`locked: false` — Feature) needs `project:settings` on this
        project; a company-level one (`locked: true` — Test Type, Test Level, Execution Phase)
        needs `company:vocabulary`, which is a COMPANY-scope permission held by Company Admin and
        above. A Test Lead may therefore extend their own project's Feature tree and not the
        company's shared axes, which is exactly what the two permissions were separated for.

        A `dimensionId` this project does not have — including another project's Feature
        dimension — is a **404**, not a field error: the caller may not be told which permission
        would have applied to a dimension they cannot address.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClassificationValueInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassificationValue' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/classification/values/{valueId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: valueId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [projects]
      summary: Rename or recolour a classification value
      description: |
        **PUT rather than PATCH, and the reason is `parentId`.** A partial update cannot express
        "make this a root": a record deserialized from JSON reads an absent `parentId` and an
        explicit `null` identically, so a PATCH would have to choose one meaning for both and the
        other would be unreachable. It does not arise here because **this endpoint refuses to
        reparent at all** (below) — but a body that carries every editable field is what keeps it
        from arising later, and it is the same reason `TestCaseInput.classificationValueIds` is a
        complete set rather than a delta.

        **Moving a value is refused, not ignored.** `parentId` must equal the stored one, or the
        request is a field error. Reparenting rewrites the subtree the descendants' `path` column
        records, and — unlike a suite — the values below this one are what authored cases are
        classified by. `SuiteWriteService` refuses a move for the first of those reasons already;
        this endpoint has both. Silently dropping the field is the third answer, the one where the
        client shows the value in its new place, reloads, and finds it back.

        Gated exactly as the create above: `project:settings` on this project for a project-level
        dimension, `company:vocabulary` at company scope for a company-level one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClassificationValueInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassificationValue' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [projects]
      summary: Retire a classification value
      description: |
        A **soft delete**. The value may already be attached to authored cases and to executions
        that ran under it, so the row survives and every read excludes it — which is what lets a
        past run still resolve what it was classified as. The consequence is stated rather than
        discovered: a retired assignment is **immutable through the API**, because a client is
        never served the value and therefore cannot resubmit it (see
        `TestCaseInput.classificationValueIds`).

        **A value with live children is refused, 409**, naming the count. The cascade is
        deliberately not built: retiring a subtree unclassifies every case beneath it at once,
        with no preview of what it is about to touch — `SuiteWriteService`'s refusal of a
        non-empty folder, one vocabulary over. A value that is **in use by cases** is *not*
        refused; being in use is what the soft delete exists for.
      responses:
        '204':
          description: Retired
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The value still has live children. `Problem.errors` carries `children`, so the SPA can
            say how many rather than "it is in use".
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /projects/{projectId}/settings:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [projects]
      operationId: getProjectSettings
      summary: The project's own policy — plan §6g's review settings
      description: |
        **Readable by anyone who can see the project**, deliberately, and not gated on
        `project:settings` like the `PUT` beside it. §6g's first requirement is that "a project
        that never turns review on should see no extra UI at all", which is a decision every
        client has to make on every artifact screen for every reader — a Test Engineer, a
        Viewer — and none of them is an admin. Gating the read on the write key would leave the
        SPA unable to find out whether to render the review panel at all.

        Nothing here is sensitive in the way the key suggests: these are facts about how the
        project behaves, deducible by anybody who presses a button.

        A project nobody has configured answers the **defaults** — review off for all three
        artifact types, `RETAIN`, no required peer reviews, and the
        author-cannot-approve-own-work rule on. `updatedBy` and `updatedAt` are `null` for such
        a project, which is most of them; a client renders "never changed" rather than
        attributing the defaults to whoever created the project.
      responses:
        '200':
          description: The project's settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [projects]
      operationId: updateProjectSettings
      summary: Replace the project's settings
      description: |
        Needs `project:settings` on this project — the key §69's classification vocabulary
        editor already uses.

        A `PUT` rather than a `PATCH`: the form shows every control and submits every control,
        nothing here is a list and nothing here is clearable, so "leave this one alone" has no
        meaning a user of this screen could ask for.

        **`requiredPeerReviews` is copied onto each review as it is submitted**, and the
        approval check reads it from there. Raising the bar therefore governs reviews opened
        afterwards and does not freeze reviews already in flight, whose reviewers were asked
        under the old rule and some of whom have already spoken.

        Switching review **off** does not close reviews that are already open: those rows
        record something that happened, and a project changing its policy has not caused
        everyone to withdraw. It stops new ones being opened.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectSettingsUpdate' }
      responses:
        '200':
          description: The settings as they now stand
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/statuses:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [projects]
      summary: Configurable execution statuses
      responses:
        '200':
          description: Statuses
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CaseStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/members:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [projects]
      summary: People who can be given work in this project
      description: |
        The people a project-scoped assignment may name: **active members of this company
        who hold a grant on this project**. Both halves are load-bearing and each alone
        admits a defect —

        - membership without a grant is a colleague who can sign in and cannot open the
          project, so a task assigned to them is visible on their board and 404s when they
          click it;
        - a grant without active membership is an unaccepted invitation, which conveys
          nothing until it is redeemed.

        **This is the same predicate the write side enforces**, not an approximation of it.
        `POST /work-items` validates `assigneeId` against exactly this set, so a picker
        built from this list can never offer somebody the server will refuse — which is the
        §31 rule (disable-don't-hide) applied to a *set* rather than to a button.

        Grants reach a person directly, through a team, or company-wide, so this cannot be
        answered by reading `role_assignment` for the project: it is resolved through the
        permission evaluator, the one place effective permissions are computed (plan §6b).

        Ordered by display name. The name is the **membership's**, not the account's
        canonical one (§6u) — the same person is "A. Kotrulev" to one client and "Aleksandar
        (Contractor)" to another.
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserRef' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          # The project read gate, and 404 rather than 403 for §6t's reason: an unreachable
          # project and a non-existent one must be indistinguishable. Not the admin surface's
          # "200 with []" — that shape exists because /users and /teams declare only 200, and
          # every project-scoped path in this contract answers 404 instead.
          $ref: '#/components/responses/NotFound'

  # -------------------------------------------------------------- review ----
  # One record for all three reviewable artifacts (plan §6g). The subject is a (type, id)
  # pair in the query rather than a nested path, because a review is not owned by the case-,
  # suite- or plan-shaped part of the URL space — three nested paths would be three routes
  # into one service with nothing different to say.
  /projects/{projectId}/reviews:
    # Only the path variable is shared. The subject filter belongs to the GET: a path item's
    # parameters apply to EVERY operation under it, which is how the case list's filters
    # landed on the POST beside it (§50).
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [projects]
      operationId: listReviews
      summary: The reviews of one case, suite or plan — newest first
      description: |
        Plan §6g's review record: who submitted this version for review, who said what while
        it was open, and who eventually signed it off. A review is **history, not a mirror of
        the artifact's status** — rescinding an approval does not rewrite the review that
        granted it, and re-submitting opens a new record rather than reopening the old one.

        Usually one row, occasionally several, and an **empty array is the ordinary answer**
        for an artifact nobody has ever submitted.

        `subjectVersionNo` is pinned when the artifact is submitted and never re-stamped, so a
        client holding the artifact's current version can tell the reviewer is looking at
        older content — §6g's diff-since-approval, from the side the server can answer.

        Gated by project visibility alone. There is no `review:read` permission in the
        catalogue and inventing one would be a 403 nobody can grant themselves out of: a
        caller who may see the artifact may see who reviewed it, which is the point of keeping
        the record at all.
      parameters:
        - name: subjectType
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ReviewSubjectType' }
        - name: subjectId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Reviews, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Review' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/reviews/{reviewId}/participations:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: reviewId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [projects]
      operationId: recordReviewParticipation
      summary: Record a peer verdict — LGTM or changes requested
      description: |
        §6g's **advisory** tier. Peer review happens *inside* `IN_REVIEW` and accumulates on
        the item **without moving it**: the state machine has exactly one gate, held by
        `*:approve`, and this endpoint is not it. Approving or rejecting an artifact is a move
        on its own ladder (`PUT /suites/{suiteId}/status`, `PUT /plans/{planId}/status`,
        `POST /cases/bulk`), so `APPROVED` and `REJECTED` are refused here as field errors —
        accepting them would be a second, cheaper door to the same sign-off, held by everyone
        with the advisory key.

        **Which permission this costs is decided by the review's subject type**, not by
        anything the request sends: `case:review`, `suite:review` or `plan:review`, at project
        scope. All three are seeded by `V3`, granted since M0, and had no consumer in Java
        until this endpoint.

        Repeat verdicts are allowed and are not an error. Participations are **append-only**:
        somebody who requests changes and later relents leaves both rows, in order, which is
        the fact a review trail is kept for. Readers take the newest row per person as the
        standing verdict.

        `409` once the review has ended — nothing about the request is malformed, and the way
        forward is to submit the artifact for review again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewParticipationInput' }
      responses:
        '201':
          description: |
            The whole review, re-rendered. A verdict is only ever read in the context of the
            trail it joins, so returning the row alone would let the panel show a state the
            server does not have. No `Location`: a participation has no URL of its own, and
            inventing one would promise a `GET` nothing serves.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{projectId}/reviews/{reviewId}/assignees:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: reviewId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [projects]
      operationId: assignReviewer
      summary: Ask a person or a team to review
      description: |
        §6g's *"Reviewers — assign a user **or** a team; any member of the team can action
        it"*, and the last unbuilt half of its apparatus. Until this endpoint the record
        held who **spoke** (`participations`) and never who was **asked**, so the workflow
        had no inbox and §6l's board could not draw a card for a request nothing stored.

        **This costs `*:review`, the subject's own key.** No new key was invented — one
        seeded to nobody is a 403 no administrator can grant their way out of, the standing
        argument against `evidence:read` and `suite:comment` — so the question is which
        existing key this is. Asking somebody to look at an artifact is a statement
        about the review's progress — §79's argument for resolving a thread. Both cheaper
        readings were refused: `case:comment` would let a Viewer, often the client
        themselves, put work on a contributor's queue, which is the one thing the bottom
        tier is defined not to do; `*:approve` would confine the request to the people whose
        sign-off it exists to *prepare*.

        **Re-asking somebody already asked writes nothing and answers 201.** Re-stamping
        would hand `assignedBy` to whoever clicked last, so the field kept to record who
        asked would name the second person to agree — §79's resolution defect, in the one
        place it would recur.

        **An assignment is a worklist entry, not part of the audit record.** That record is
        the review and its participations. Hence the hard delete below, and hence a deleted
        team taking its outstanding requests with it rather than being refused the way a
        team holding role grants is (§71): what cascades is a request, not authority, and
        the review stays visible, reviewable and approvable by exactly the same people.

        `409` once the review has ended, on the same terms as every other write here.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewAssignmentInput' }
      responses:
        '201':
          description: |
            The whole review, re-rendered — the participations endpoint's decision and for its
            reason. No `Location`: the URL it would name serves no `GET`, and one pointing at a
            route that answers 405 is worse than none.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{projectId}/reviews/{reviewId}/assignees/{assignmentId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: reviewId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: assignmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [projects]
      operationId: unassignReviewer
      summary: Withdraw a request to review
      description: |
        A **hard delete**, and that is the decision: an assignment is a worklist entry, so
        asking the wrong person and correcting it should leave nothing behind — a trail of
        retracted requests reads as a history of suspicion. A comment is the same question
        answered the other way for the opposite reason: a remark is something somebody
        *said*, a request is something somebody was *asked*.

        Costs the same `*:review` the assignment did. There is deliberately **no author
        arm** — `evidence:delete`'s "the owner, or the tier" shape — because the only caller
        it would add is somebody withdrawing a request they made while lacking `*:review`,
        and nobody can be in that state: making the request cost the key.

        `404` when `assignmentId` names nothing in this review, bodiless and identical to
        the review's own 404 so the pair cannot be used to probe which ids exist.
      responses:
        '200':
          description: |
            The whole review, re-rendered. Not `204`: the panel renders a review as one thing
            and every other write on it re-serves that whole thing, so a bodiless answer would
            make this the one action after which the client's copy is stale — and it would
            refetch immediately, a second round trip for what this response already knows.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{projectId}/reviews/{reviewId}/comments:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: reviewId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [projects]
      operationId: addReviewComment
      summary: Write a remark on an open review
      description: |
        §6g's threads — *"Review without inline comments degrades into Slack conversations
        that vanish."*

        **This costs `case:comment`, whatever the subject is.** The catalogue has one comment
        key where it has three review keys and three approve keys, and that is deliberate: the
        roles spec's Review table lists commenting as the bottom **tier** — *"read an item in
        full and leave threaded comments"* — held by Viewer and up, built for the case where
        the client reviews test coverage themselves without gaining any write access. Adding
        `suite:comment` and `plan:comment` would seed two keys nobody holds, which on every
        existing instance is a 403 no administrator can grant their way out of. `case:comment`
        is seeded by `V3`, granted since M0, and had **no consumer in Java** until this
        endpoint.

        **Threads are one level deep.** `parentId` names the root being replied to, validated
        against *this review's* comments — a comment from another project's review is a field
        error rather than a stored reference, and so is a reply to a reply. A tree has no
        bottom to render and no natural place to resolve.

        There is deliberately **no `anchorType` / `anchorId`**, though `V1` has the columns and
        §6g asks for anchoring *"where possible"*: the only candidate anchor is a case's step,
        whose ids live in a module the review record may not import, so accepting one today
        would store a reference nothing validates — the defect §64 found four milestones after
        it shipped.

        `409` once the review has ended, on the same terms as the verdict endpoint: a review
        is history once it closes, and the way forward is to submit the artifact again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewCommentInput' }
      responses:
        '201':
          description: |
            The whole review, re-rendered — the participations endpoint's decision and for its
            reason: a comment is only ever read inside the conversation it joins. No
            `Location`; a comment has no URL of its own.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{projectId}/reviews/{reviewId}/comments/{commentId}/resolution:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: reviewId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: commentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [projects]
      operationId: setReviewCommentResolution
      summary: Mark a thread dealt with, or re-open it
      description: |
        §6g's *"resolvable"*.

        **This costs `*:review`, not `case:comment`** — the asymmetry with the endpoint above
        is the decision. Writing a remark is the bottom tier's act; declaring one dealt with is
        a statement about the review's progress, which belongs to the tier running the review.
        "The reviewing tier *or* the comment's own author" was considered and refused: the only
        caller it adds is a Viewer resolving their own feedback, which takes it off the
        reviewer's list without anybody having addressed it.

        **Only a thread root.** Resolution is a property of the thread, so resolving a reply is
        a field error rather than a silent no-op.

        `PUT` with a required boolean, not `PATCH` and not two verbs: for a boolean, absent and
        `false` are the same bytes, so a `PATCH` could never express "re-open this". No
        `If-Match` — the target state is absolute, so there is no stale-read-derived value to
        lose. Setting a thread to the state it is already in writes nothing and answers 200.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewCommentResolutionInput' }
      responses:
        '200':
          description: The whole review, re-rendered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------------------------------------------------- repository ----
  /projects/{projectId}/suites:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [repository]
      summary: Suites
      responses:
        '200':
          description: |
            The project's live suites. **A flat list, and flat all the way down** — a suite is a
            named collection, not a folder in a tree, so there is nothing for a client to assemble
            and no order but the server's.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Suite' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [repository]
      summary: Create a suite
      description: |
        `key` is server-allocated from the company's counter (`TS-n`, sequential per **company**,
        §6t). Requires `suite:manage`.

        ~~`path` is derived from the key — **not** from the name, so a rename never rewrites a
        path.~~ → **superseded (§98): suites are flat and `path` is gone.** It existed to place a
        folder in a tree; with no tree, a per-suite path is a second spelling of the key.

        `lifecycleStatus` is always `DRAFT`, for the reason a created case is: a status an ordinary
        create could set is an approval its author granted themselves (§6g).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuiteInput' }
      responses:
        '201':
          description: Created — key is server-allocated (TS-n, per company)
          headers:
            Location:
              description: The created suite's own URL.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Suite' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/suites/{suiteId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: suiteId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [repository]
      summary: Suite detail
      responses:
        '200':
          description: Suite
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Suite' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [repository]
      summary: Rename a suite
      description: |
        Renames a suite and edits its description. Requires `suite:manage`.

        ~~**Moving is not supported here yet.** `parentId` is accepted only when it matches the
        suite's current parent; a different value is a `400` rather than a silently ignored field,
        because reparenting rewrites every descendant's `path` and needs cycle prevention.~~
        → **superseded (§98): there is nowhere to move a suite to.** A flat suite has no parent, so
        the refusal, the cycle check and the `path` rewrite it was protecting all stop existing.
        What a client wants when it reaches for a move — *this case belongs over there* — is the
        case's own `suiteId`, or a `caseIds` / `tagRules` entry on the target suite.

        Send the suite's `lockVersion` as `If-Match`. Omitting it is last-write-wins, which is right
        for an importer with no prior read; the SPA always sends it, so a concurrent rename is a
        `409` rather than a silent overwrite (§6j).
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuiteInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Suite' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [repository]
      summary: Delete an empty suite
      description: |
        Soft-deletes a suite. Requires `suite:delete`, which is held by leads and above and **not**
        by Test Engineer — deleting is the one repository action a contributor is blocked from, so
        they can organise the tree freely without being able to unmake someone else's work
        (roles spec §6b).

        **The suite must be empty**: a suite holding live *filed* cases answers `409` naming how
        many. A cascade would soft-delete other people's *cases* through a collection action with no
        preview, routing around the `OWN` qualifier that `case:delete` carries for exactly that
        reason. Cascading deletion waits for a slice that can show what it is about to touch.

        **Only the filing arm blocks, and the other two deliberately do not** (§98). A case *added*
        to this suite, or *matched* by one of its `tagRules`, is not held here — it lives elsewhere
        and merely appears in this collection, so deleting the collection loses a claim on it and
        never the case. Filing is different in kind: `test_case.suite_id` is where the case is, and
        deleting its suite would leave it reachable only through the unfiled list.

        ~~Child suites also stand in the way.~~ → **gone with the tree (§98)**; a suite has no
        children to hold.

        Soft, not hard: past runs reference the cases filed under a suite and `suite_run_summary`
        keys on the suite id, so removing the row rewrites what a past run covered.
      responses:
        '204':
          description: Deleted. No body.
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The suite is not empty. `detail` names the live filed-case count standing in the way,
            so the client can say what to clear rather than "could not delete".
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /projects/{projectId}/suites/{suiteId}/status:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: suiteId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [repository]
      operationId: setSuiteStatus
      summary: Submit, approve, withdraw, deprecate or revive a suite
      description: |
        A suite's ladder is plan §6g's, over the same four `LifecycleStatus` values a case uses —
        and it is the **same ladder**, evaluated by one class server-side, because §6g draws one
        diagram and then lists what review *means* per artifact rather than a different set of
        moves.

        **Which permission a move needs is decided by the edge, not by the target:**

        - `suite:manage` (Test Engineer and up) carries a suite *forward* through the states nobody
          has signed off — submitting a draft for review, and withdrawing that submission again.
          §6g: submitting for review "needs only edit rights".
        - `suite:approve` (Lead and up) is needed to **grant** the sign-off, to **deprecate** the
          suite, and to **take either back**. Rescinding a lead's approval is an approval act, and a
          target-only rule would let a Test Engineer do it by asking for `DRAFT`; deprecating is the
          soft form of a delete, and `suite:delete` is withheld from Test Engineer outright.

        Two moves are refused with `409` because the ladder does not have them: `IN_REVIEW` is
        reachable only from `DRAFT` (an approved suite that needs another look must lose its
        approval first, or the trail shows it under review while also signed off), and `APPROVED`
        only from `IN_REVIEW` (§6g: "the state machine has exactly one gate"). A **deprecated** suite
        returns as a `DRAFT` and cannot go straight back to review or approval — the same argument
        §6g makes for a clone of an approved case.

        Idempotent: setting the status a suite already has answers `200` with the suite and writes
        nothing — no timestamp re-stamped and no audit row, so a repeated click cannot bury the
        change that actually happened.

        No `If-Match`: the request names an absolute target state rather than a delta against
        something the client read, so there is no lost update to protect (`PUT /plans/{planId}/status`
        and `PUT /runs/{runId}/status` make the same call). The `PATCH` beside it *does* take one,
        because a name typed over a stale copy really does lose the other author's words.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuiteStatusInput' }
      responses:
        '200':
          description: The suite, as the tree renders it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Suite' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{projectId}/suites/{suiteId}/history:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: suiteId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [repository, reporting]
      summary: Suite execution history — pass % per execution
      # No `versionNo` filter. It was declared here from the first draft, nothing ever sent it, and
      # §50's binding check refuses a parameter no handler binds — an unimplemented filter answers
      # 200 to the wrong question, which is strictly worse than an absent one. Re-adding it is
      # contract-first, alongside the version selector that would send it.
      description: |
        Each entry is one execution of the suite, grouped by (run, suite, configuration),
        summarized as counts. Percentages are derived client-side so the
        "of executed" vs "of total" toggle works without a round trip (plan §6p).

        **Scope is the suite's resolved membership** — filed ∪ added ∪ tagged, the same union
        `Suite.caseCount` reports, so the history covers exactly the cases the suite claims.

        ~~Scope is the suite and its descendants; §6p's rollup rule is to sum leaf counts, so a
        parent's entry covers every case beneath it, and the alternative makes every intermediate
        folder report an empty history.~~ → **superseded (§98)**: there are no intermediate folders
        left to report an empty history, so the argument that forced the rollup has no subject.
        §6p's rollup rule still holds wherever a tree remains (features, classification values).

        **The rows already stored under the old shape are not rewritten**, and neither is what they
        say: `execution_fact.suite_id` / `suite_path` record where a case was filed *when it ran*
        (§86 froze them on conflict for exactly this), so a history from before the flattening may
        name a path that no longer describes anything. That is correct and must not be "fixed".
      responses:
        '200':
          description: History
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuiteHistoryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/cases:
    # Only the path variable is shared. The filter block below belongs to the GET and lived
    # here until the binding check found what that meant: a path item's parameters apply to
    # EVERY operation under it, so the POST beside it declared `?page=2&ownerId=…` on a create
    # — generated into the client's types, and ignored by the server if anyone sent it.
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      tags: [repository]
      summary: Search and filter test cases
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - name: q
          in: query
          description: |
            Free text over title and description. A value matching the case-key
            pattern (TC-n) short-circuits to an exact lookup (plan §6q).
          schema: { type: string }
        - name: suiteId
          in: query
          description: |
            Narrows to the suite's **resolved membership** — filed here, added here individually,
            or carrying one of its `tagRules`. The same union `Suite.caseCount` counts, so the
            number in the rail and the length of this list are two readings of one query.

            ~~Includes descendant suites by default.~~ → **§98**, with the tree.
          schema: { type: string, format: uuid }
        - name: tag
          in: query
          description: |
            Cases carrying **every** tag listed — repeat the parameter to narrow. AND, not OR, and
            deliberately the opposite of `suite_tag_rule`, which unions: a suite claims everything
            tagged `smoke` *or* `payments`, while a person filtering a grid by two tags is looking
            for the intersection and an OR would widen the list they are trying to shorten.

            Tags are free text and matched exactly. An unknown tag is `200 []`, never a 400 —
            there is no vocabulary to check it against, and a typo that refuses the request would
            be indistinguishable from a tag nobody has used yet.
          schema:
            type: array
            items: { type: string }
        - name: unfiled
          in: query
          description: |
            `true` returns **only cases filed in no suite** (`suite_id IS NULL`, possible since the
            suite became a resolvable collection). The grid needs it because an unfiled case is
            filed under no suite, so without this filter the only way to find one is to page
            through every case in the project.

            Ignored when `suiteId` is present — a case cannot be both filed somewhere and filed
            nowhere, and refusing the pair with a 400 would break the suite list's own "clear the
            filter" affordance for no gain.
          schema: { type: boolean }
        - name: featureId
          in: query
          description: Includes descendant features by default (plan §6q).
          schema: { type: string, format: uuid }
        - name: testTypeId
          in: query
          schema: { type: string, format: uuid }
        - name: testLevelId
          in: query
          schema: { type: string, format: uuid }
        - name: ownerId
          in: query
          description: |
            Cases owned by one person. Added for the dashboard's by-owner breakdown, whose
            segments are links carrying this predicate (plan §6o) — without it those links
            dropped the owner and silently opened *everyone's* cases in that status.
          schema: { type: string, format: uuid }
        - name: lifecycleStatus
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/LifecycleStatus' }
        - name: automationStatus
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/AutomationStatus' }
        - name: priority
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/Priority' }
        - name: healthSignal
          in: query
          description: Dashboard tile drill-down (plan §6o).
          schema:
            type: array
            items: { $ref: '#/components/schemas/HealthSignal' }
        - name: releaseVersion
          in: query
          description: Cases executed in this release (filters via executions).
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, example: 'keySeq,asc' }
      responses:
        '200':
          description: Matching cases plus facet counts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    # `required` does not descend through allOf — the PageMeta branch declares its
                    # own and this one needs the same. `facets` is always sent, empty when the page
                    # is: the grid distinguishes "no facets" from "facets not loaded".
                    required: [items, facets]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/TestCaseSummary' }
                      facets:
                        type: array
                        items: { $ref: '#/components/schemas/Facet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [repository]
      summary: Create a test case
      description: |
        `key` is server-allocated from the company's counter (`TC-n`, sequential per **company** and
        therefore shared across its projects — §6t). `lifecycleStatus` is always `DRAFT`: a status an
        ordinary create could set is an approval its author granted themselves, which belongs to the
        review workflow (§6g). The creator becomes the owner — `ownerId` on the input is refused, since
        naming someone else needs a membership check.

        Version **1** is written in the same transaction as the case, so a case created here has a
        gapless history. Cases that predate this endpoint have no v1 and their first edit is v2; see
        `EntityVersion`.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestCaseInput' }
      responses:
        '201':
          description: Created — key is server-allocated (TC-n, per company)
          headers:
            Location:
              description: The created case's own URL.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestCase' }
        '200':
          description: |
            **A replay.** The `Idempotency-Key` had already created this case, so nothing was created
            by this request — which is why it is not a 201 and carries no `Location`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestCase' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/cases/bulk:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    post:
      tags: [repository]
      summary: Bulk operation over a case selection
      description: |
        Preview-then-commit. Always returns what changed, what was already
        compliant, and what was skipped with a reason — mass edits without a
        preview are how people destroy a suite at 5pm (plan §6f).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkOperation' }
      responses:
        '200':
          description: Result (or preview when dryRun is true)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/cases/{caseId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/CaseId' }
    get:
      tags: [repository]
      summary: Full test case
      responses:
        '200':
          description: Case
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestCase' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [repository]
      summary: Update a test case
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestCaseInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestCase' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [repository]
      summary: Soft-delete a test case
      description: |
        Soft-deletes the case. Past runs pinned the version they executed and must keep
        resolving what they covered, so the row survives, no read returns it, and the
        display and automation keys stay reserved.

        Requires `case:delete`, which is **`OWN`-qualified for Test Engineer** (roles spec
        §A5): a lead deletes any case, a test engineer only cases they authored. Both
        refusals are `403` and they carry **different messages** — "you cannot delete cases
        here" is false for an engineer who deletes their own every day, and would send them
        to ask for a permission they hold.

        No `If-Match`: there is no lost-delete for a precondition to prevent, and a stale
        version would refuse the delete over an edit the caller does not care about.

        Nothing cascades. Steps, conditions, tags and attachments stay on the row.
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/cases/{caseId}/quarantine:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/CaseId' }
    put:
      tags: [repository]
      summary: Quarantine a flaky test, or put it back in the gate
      description: |
        M3's quarantine flow (plan §6c, §6l). Records the **decision** to stop gating on a
        test, alongside the flake evidence the decision was made on.

        **PUT with an absolute state, not POST and DELETE.** A client sending the same
        request twice must not be told `404` or `409` about a state it already asked for —
        releasing a case that is not quarantined succeeds, and so does quarantining one that
        already is. It is also the shape a checkbox produces; a toggle that has to become
        two HTTP methods is where "the quarantine turned itself off" comes from.

        `reason` is **required when `quarantined` is true** and ignored when it is false.
        The asymmetry is deliberate: releasing returns the test to the default, and the
        exception is the thing that needs justifying. A quarantine with no reason is debt
        nobody can clear — the board card says a test is excluded and cannot say why or by
        whom, so the only way to evaluate it is to read the test. A missing reason is a
        `400` field error, and `case_flake_quarantine_complete` refuses the row underneath
        regardless of what a caller believes.

        `quarantined` is required too, and its absence is a `400` rather than a default of
        `false` — the one shape of this request that could destroy a decision by omission.

        **Requires `case:edit`, not a new `case:quarantine` key.** The roles spec is
        authoritative and has no such key. The choice also carries §117's property:
        **Automation Service does not hold `case:edit`**, so a leaked CI token can post
        results and cannot quarantine a test to stop its own red results from gating.

        **Nothing downstream reads the flag yet.** Quarantine is recorded and surfaced; it
        does not exclude the case from a run, a report, or a pass rate. Silently moving a
        pass rate's denominator is how a green number stops meaning anything (§6e), so when
        gating reads this column it must say so on the face of the report.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaseQuarantineInput' }
      responses:
        '200':
          # 200 with the row rather than 204: quarantinedAt, quarantinedBy and the derived
          # counts all come from the server, so a 204 would force the screen into a refetch
          # to render the state it just set.
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseFlake' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/cases/{caseId}/clone:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/CaseId' }
    post:
      tags: [repository]
      summary: Clone a test case
      description: |
        Plan §6v, decision round 3 #59. Copies the case's authored content into a **new**
        case in the same project.

        **A clone is a create.** The server reads the source, builds the same input `POST
        /cases` takes, and runs it through the same validation, the same key allocator and
        the same version writer — so a clone can never be a second definition of a legal
        case. Six of §6v's rules hold by construction because of it: a newly allocated
        display key, a status that resets to `DRAFT`, its own version 1, no shared history,
        and an `Idempotency-Key` that behaves exactly as it does on a create.

        **Requires `case:create`**, the same key the create costs, and not `case:edit` —
        nothing about the source changes.

        What is copied: description, objective, expected outcome, step format, Gherkin
        source, priority, severity, automation status, the not-automatable reason, the
        duration estimate, every step, the classification, the condition references, the
        tags, and the attached files.

        What is deliberately **not**:

        - **`automationKey`, and with it the `AUTOMATED` status.** The key is unique per
          company (§6c), so copying it either violates the constraint or makes an ingested
          CI result match two cases. Dropping it **forces the status down**: `AUTOMATED`
          requires a key, so a clone of an automated case is created as
          **`TO_BE_AUTOMATED`**, which is not a compromise but the accurate state — it is
          intended to be automated and has no automation yet. Every other automation status
          is copied unchanged. A client showing the clone should say so; the alternative
          (relaxing the requirement) leaves a case reporting as automated that CI can never
          match, for ever.
        - **Version and execution history.** A clone is a new aggregate, not a version.
        - **Review state.** A clone of an approved case is a draft (§6g): approval attaches
          to content a named person read.
        - **The owner.** The clone is authored by the caller.

        Attachments are **byte-copied** under fresh storage keys, not shared by reference:
        two rows over one key means deleting either one destroys the other's bytes with
        nothing failing. A source file whose bytes are already missing is skipped rather
        than cloned into a second unreadable row.

        `title` is **required**. The server does not invent `Copy of …`: two rows a person
        cannot tell apart in a list is the failure this endpoint would otherwise ship by
        default, and the length limit would have to be decided by whoever wrote the prefix.
        The SPA prefills the suggestion in its dialog, where a human can edit it before it
        becomes a row.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestCaseCloneInput' }
      responses:
        '201':
          description: The new case
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestCase' }
        '200':
          description: |
            A replay — this `Idempotency-Key` already created a case, which is returned
            unchanged. Not `201`, and no `Location`: nothing was created by this request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestCase' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/cases/{caseId}/attachments:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/CaseId' }
    post:
      tags: [repository]
      operationId: attachCaseFile
      summary: Attach a file to a case
      description: |
        Decision round 3's #49 — `attachment.owner_type = 'CASE'`, declared by `V1` and
        writerless for the whole life of the product until this endpoint.

        **Requires `case:edit`, and the delete below requires the same key with no `OWN`
        arm.** That is the decision, and it is deliberately *not* `evidence:delete`'s shape.
        Evidence is a record of something that happened, and unmaking somebody else's record
        is the line the roles spec §A3 draws. A case attachment is part of the **case
        definition**, which `case:edit` already owns wholesale — a Test Engineer holding it
        may rewrite every step, the title and the preconditions of a lead's case. An
        authorship arm would make removing the screenshot *stricter than removing the step
        that references it*, which is incoherent in the direction that reads as security.

        **No new permission was invented.** The roles spec is authoritative and has no
        `attachment:*` key; one seeded to nobody is a `403` no administrator can grant their
        way out of — the standing argument that has kept `evidence:read` out of the
        catalogue since M0.

        **The upload proxies through the API** rather than going browser-direct to a signed
        URL: the storage port's filesystem adapter cannot issue one (plan §8 #28). So the
        instance's `spring.servlet.multipart.max-file-size` is a real limit and a file over
        it is a **413** rather than a `400` — the request is refused before it reaches the
        handler, so there is no field to hang a message on.

        **There is no `GET` here.** The list is `TestCase.attachments` on the detail, which
        is the only screen that shows it; a second read path would be a second answer to
        "what is attached to this case", free to disagree the moment one grew a filter.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    The bytes. Filename and content type travel in the part's own headers, and
                    the filename is stored in a column — it never becomes part of a storage key.
      responses:
        '201':
          description: Attached
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: |
            The file is larger than this instance's upload limit. Refused by the servlet
            container before the handler runs.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /projects/{projectId}/cases/{caseId}/attachments/{attachmentId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/CaseId' }
      - { $ref: '#/components/parameters/AttachmentId' }
    delete:
      tags: [repository]
      operationId: deleteCaseFile
      summary: Remove a file from a case
      description: |
        Costs `case:edit` — the same key the upload does, with **no author arm**. See the
        `POST` above for why, and note the consequence stated plainly: whoever may edit the
        case may remove any of its files, including one somebody else attached.

        **A hard delete, and the bytes go with the row.** A file removed on request has to
        actually leave the disk — a soft-deleted row pointing at retained bytes is a deletion
        that did not delete, which is the wrong answer for the one thing here a customer may
        need removed for privacy rather than tidiness. The row is removed first and the bytes
        second, so a failure between them leaves an unreferenced blob an operator can sweep
        rather than a thumbnail that renders and never opens.

        The audit row carries the filename, and it is the **only** surviving statement that
        the file existed once both the row and the bytes are gone.

        `404` when `attachmentId` names nothing on **this** case — the two-segment gate, so
        `/cases/{a}/attachments/{belongs-to-b}` cannot reach another case's file.
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/cases/{caseId}/attachments/{attachmentId}/content:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/CaseId' }
      - { $ref: '#/components/parameters/AttachmentId' }
    get:
      tags: [repository]
      operationId: downloadCaseFile
      summary: The file's bytes
      description: |
        What `Attachment.url` points at.

        **No permission beyond the case read gate.** Anyone who may read the case may read
        what is attached to it, and the catalogue has no `attachment:read` — inventing one
        would be a permission no role is granted, which is a `403` nobody can fix. It is also
        the only rule that does not make the SPA reason about two permissions per row.

        Served `inline` with the stored content type, so an image renders in place. The
        filename reaches a response **header**, where a carriage return is header injection
        rather than an odd name; it is neutralised on the way out.

        `404` also when the row exists and its blob does not — the orphan the write ordering
        deliberately produces rather than the reverse. An empty `200` would hand the browser
        a corrupt file.
      responses:
        '200':
          description: The bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/cases/{caseId}/versions:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/CaseId' }
    get:
      tags: [repository]
      summary: Version history
      responses:
        '200':
          description: Versions, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EntityVersion' }
        '404':
          # An unreachable project, a case in a sibling project, a soft-deleted case and an
          # absent one all answer 404 — the same concealment the case detail uses, so a
          # caller cannot probe for what exists outside its grants. Distinct from a 200 with
          # an empty array, which means the case is real and has no recorded versions.
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/cases/{caseId}/draft:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/CaseId' }
    get:
      tags: [repository]
      summary: The case's buffered autosave draft
      description: |
        The editor's unsaved state for this case, if any (plan §6j, decision round 3 #57).

        **`204` means "no draft", and it is not the `404` beside it.** Almost every case has
        no draft almost all of the time — an ordinary state of a perfectly readable case,
        not a missing resource. `404` keeps the meaning it has everywhere else on this
        controller: unreachable project, case not in it, deleted case.

        **Gated on `case:edit`, not `project:read`.** The content is the case's own content,
        so a Viewer would learn nothing from it that reading the case does not already
        disclose — but a draft is somebody's unfinished sentence, shown nowhere else in the
        product, and a Viewer is the client's stakeholder invited to read coverage rather
        than to watch it being written.

        **There is one buffer per case, not one per person.** `test_case_draft.case_id` is
        the primary key, so two people editing one case share it and the last keystroke
        wins. `updatedBy` is served for exactly that reason: a returning editor must be told
        whose words they are being offered before adopting them.
      responses:
        '200':
          description: The buffered draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseDraft' }
        '204': { description: The case is readable and has no buffered draft }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [repository]
      summary: Buffer the editor's unsaved state
      description: |
        Autosave. Called on a timer rather than by a person pressing a button, and it
        replaces whatever was buffered rather than merging into it.

        **Nothing in `content` is validated.** A draft is half-written by definition: the
        title may be blank, a step may reference a retired shared step, `automationKey` may
        collide. All three are refused by `PATCH` and must be — validating here would make
        autosave fail while somebody is mid-sentence. The stated consequence is that **a
        draft which restores cleanly can still be refused when the user presses Save**.

        **There is no promote operation, deliberately.** Promotion is the client restoring
        the draft into the form and the user pressing Save, which is the ordinary `PATCH` —
        validated, versioned, audited, `If-Match`ed. A server-side promote would be a second
        write path into `test_case` whose input is by construction unvalidated.

        **A successful `PATCH` clears this buffer**, whoever saved.

        **No `If-Match`.** `lockVersion` is recorded, not enforced: an autosave that answered
        `409` is one the user cannot resolve, because they never asked for it and there is no
        dialog to show them.

        `lockVersion` is **required** and its absence is a `400` rather than a default —
        every value it could default to is a claim about which version the draft was written
        against, and guessing it wrong is how a restore silently overwrites a colleague's
        committed edit. See `CaseDraft.stale`.

        Content over **256 KB** serialized is a `400` field error. Nothing else bounds this
        row: the content is unvalidated, the caller is a timer, and no retention prunes the
        table.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaseDraftInput' }
      responses:
        '200':
          # 200 with the stored draft rather than 204: `updatedAt` comes from the server's
          # clock, and on a screen whose job is telling you when your work was last safe the
          # client's own clock is the wrong source. It also carries `stale`.
          description: Buffered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseDraft' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [repository]
      summary: Discard the buffered draft
      description: |
        Throws the buffer away. **Idempotent**: discarding a draft that is not there
        succeeds, because the caller asked for a state and that is the state it is in. A
        second click, a retry after a timeout, and a concurrent save that already cleared the
        row must none of them read as an error.
      responses:
        '204': { description: Discarded, or there was nothing to discard }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/cases/{caseId}/history:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/CaseId' }
    get:
      tags: [repository, reporting]
      summary: Pass/fail execution history for a case
      description: |
        Timeline of every execution, attributed to the case version executed, plus
        version-change markers so "the edit broke it" is readable at a glance
        (plan §6p).

        Plan §6p also describes narrowing this timeline by **release version** and by
        **configuration**, and both were declared here from §49 until the binding check
        found that neither reaches a handler — `CaseHistoryController` binds `scope` and
        `caseVersionNo` and nothing else, so a caller sending `?configurationId=…` got the
        whole timeline back with a 200 and no indication it had been ignored. Deleted rather
        than implemented, because nothing sends them: an unimplemented filter in the contract
        is worse than an absent one, since `schema.d.ts` generates it and the absence of an
        error reads as success. Re-add contract-first when a screen needs one — the service
        already groups by (version, configuration) for the flakiness figure, so the data is
        there.
      parameters:
        - name: scope
          in: query
          description: |
            Which versions the summary and the timeline cover. `CURRENT_VERSION` is the default and
            the safe one: blending results across versions reports a pass rate for a test whose text
            changed underneath it (plan §6p).

            Deliberately NOT expressible as `caseVersionNo`, though it looks like it should be. The
            UI's chip says "Current version", not "v7" — and "current" is resolved server-side, so a
            case edited between the page load and this request is still summarized against the version
            that is current NOW. A client sending `caseVersionNo=7` has pinned v7 forever and would
            quietly report a stale scope after the next save.
          schema:
            type: string
            enum: [CURRENT_VERSION, ALL_VERSIONS]
            default: CURRENT_VERSION
        - name: caseVersionNo
          in: query
          description: |
            One explicit version — what a click on a version marker asks for. Wins over `scope` when
            both are sent, because it is the more specific of the two requests.
          schema: { type: integer }
      responses:
        '200':
          description: History
          content:
            application/json:
              schema:
                type: object
                # All three always sent. `summary` in particular: a case with no executions still
                # gets a summary of zeros, because the panel's job is to state the counts and an
                # absent summary would render as a failed load rather than as "never executed".
                required: [summary, entries, versionMarkers]
                properties:
                  summary: { $ref: '#/components/schemas/CaseHistorySummary' }
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/ExecutionHistoryEntry' }
                  versionMarkers:
                    type: array
                    items: { $ref: '#/components/schemas/VersionMarker' }
        # 400 is reachable on a READ, which is unusual enough to state: `scope` is a closed set and
        # an unrecognised value is refused by name rather than silently falling back to a default,
        # because a silent fallback is how a client asking the wrong question gets a confident
        # answer to a different one.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/conditions:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      tags: [repository]
      summary: Reusable pre/post condition library
      parameters:
        - name: q
          in: query
          description: Typeahead query. Ranked by relevance blended with usageCount (plan §6h).
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string, enum: [PRE, POST, BOTH] }
      responses:
        '200':
          description: Conditions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Condition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [repository]
      summary: Add an entry to the reusable condition library
      description: |
        **`library:manage`** — the same gate as `POST /shared-steps`, and for the same reason:
        creating an entry propagates nowhere, so the permission is the whole control on this path.

        Until §95 this collection was a read of a table **nothing could write** — the mirror of the
        gap `POST /shared-steps` closed, and the more consequential half, because conditions are the
        product's one genuinely *shared* authoring object: a case attaches one **by id** and an edit
        to it propagates everywhere it is used. See the `PUT`.

        Conditions are **project-scoped**, so an entry is reachable only from the project it was
        created in.

        No `Idempotency-Key`, on `POST /shared-steps`' terms: a duplicate is visible in the picker
        next to its twin the moment the create returns.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConditionInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Condition' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/conditions/{conditionId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: conditionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [repository]
      summary: Edit a library condition — the edit propagates
      description: |
        **`library:manage`.** This is the operation the roles spec's note about library work being
        *"gated by an impact modal, not by permission"* was actually about: the edit lands on every
        case and suite attaching this entry, with **no prompt and no fork**. Attaching a condition
        is a reference, not a copy — that is the whole point of the object, and the deliberate
        opposite of `/step-suggestions`, where picking a suggestion copies text and creates no link.

        **The client is expected to state the impact before submitting**, which is what `usageCount`
        and `suiteUsageCount` are served for. Read both — the suite figure is not a case count and
        must not be rendered as one.

        **No fork-on-edit.** Offering "change everywhere / copy for this case" was considered and
        refused: the fork is what turned `shared_step` into a library of near-duplicates nobody
        could rank. An author who wants different text writes a different condition.

        A `PUT` rather than a `PATCH` because the body is the entry's whole authored content — title,
        type and body together — and there is no field on it a caller would legitimately omit.

        **Retired entries are not editable**: a soft-deleted condition answers 404 here, the same
        answer an id from another project gets, so this endpoint is not an existence oracle for a
        library the caller cannot read.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConditionInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Condition' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{projectId}/shared-steps:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      tags: [repository]
      summary: Reusable step library
      description: |
        Most-used first, narrowed by an optional title fragment — the same shape and the same
        ranking rule as `/conditions` (plan §6h).

        **`usageCount` is derived, not stored.** It counts the *distinct live cases* whose steps
        reference this entry, computed by the query rather than read from `shared_step.usage_count`.
        The stored column exists and stays at its `DEFAULT 0`: a denormalized counter has to be
        maintained by every path that rewrites a case's steps, and a case edit replaces the whole
        step list, so the counter drifts on the first path that forgets and nothing reveals it.
        A number that ranks the picker has to be right to be worth showing.

        Distinct *cases*, not step rows: a case may reference the same entry twice, and counting
        rows would inflate it (the §6e rule about execution count versus distinct-case count).
        This deliberately differs from `Condition.usageCount`, which is still the stored 0 —
        a condition's usage spans `case_condition` **and** `suite_condition`, and the suite side
        propagates by inheritance, so that count is a design question rather than a join.
      parameters:
        - name: q
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Shared steps
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SharedStep' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [repository]
      summary: Add an entry to the reusable step library
      description: |
        **`library:manage`** — Instance Admin, Company Admin, Test Lead and Test Engineer (roles
        spec, Repository table). Viewer and Automation Service do not hold it. The spec's note
        that library work is *"gated by an impact modal, not by permission"* is about **editing**
        an entry, whose change propagates to every case referencing it; creating one propagates
        nowhere, so the permission is the whole control here.

        Until this operation existed the library was a read of a table **nothing could write**,
        while `CaseStep.sharedStepId` had been accepted on case saves since M1 — so the product
        could store a reference to a library it had no way to populate.

        Shared steps are **project-scoped** (roles spec: two client products legitimately have
        different login flows), so an entry is reachable only from the project it was created in.

        No `Idempotency-Key`. A duplicate library entry is visible in the picker next to its twin
        the moment the create returns — the same reasoning that keeps the header off `POST` suites
        and on `POST` cases.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SharedStepInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharedStep' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/step-suggestions:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      tags: [repository]
      summary: What the step editor completes from
      description: |
        Every distinct step the project already uses, most-used first, narrowed by an optional
        fragment of the action — the corpus the case editor's action field autocompletes against,
        the way a Cucumber feature file completes from the step definitions already defined.

        **The corpus is derived, not curated.** It is computed from every step written in the
        project's live cases, so it is populated as soon as the project has a case and needs no
        maintenance to stay that way. That is the correction to `/shared-steps`, whose failure was
        that somebody had to remember to put things in it: a library nobody populates ranks nothing
        and its picker opens empty forever.

        **A suggestion is text to copy, not an entity to reference.** Picking one fills `action`,
        `testData` and `expectedResult` into the author's step and creates **no link** — the step
        belongs to that case, and editing it afterwards changes that case and nothing else. This is
        deliberately the opposite of `/conditions`, where a case attaches a library entry by id and
        an edit to the entry propagates to every case using it. The difference is intended: a shared
        precondition is a fact about the system, a step is a sentence somebody wrote. **No id is
        served here**, so the distinction is enforced by the payload's shape rather than by a
        convention a later consumer can drift away from.

        The whole triple is completed and the whole triple is the grouping key. Completing only the
        action would leave exactly the two fields that differ between two similar steps blank, and
        the author would fill them from memory — which is the divergence this endpoint exists to
        stop. Two steps sharing an action but not an expected result are two suggestions.

        **`useCount` counts distinct live cases**, not step rows — the §6e rule, and the same one
        `SharedStep.usageCount` follows. A case that repeats a step twice is one case using it;
        counting rows would let a single loop-heavy case out-rank a step forty cases share.
        Soft-deleted cases are excluded, so the ranking reflects current practice rather than
        history.

        Capped at 50 server-side. There is no `limit` parameter: a typeahead renders a dozen rows
        and a mature project's corpus is thousands, so an unbounded read is a payload nobody
        displays.
      parameters:
        - name: q
          in: query
          description: |
            A fragment of the step's action, matched case-insensitively as a substring. Absent or
            blank means the whole corpus, most-used first.
          schema: { type: string }
      responses:
        '200':
          description: |
            Step suggestions, most-used first. `[]` means nothing matched — the state of a project
            whose cases have no steps yet, and of any typeahead narrowed past the corpus. It is not
            an error: an author who gets no suggestions can still write the step by hand.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StepSuggestion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/tags:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [repository]
      summary: The tags in use in this project
      description: |
        Every distinct `case_tag` on a live case of this project, with the number of cases carrying
        it, most-used first and then alphabetically.

        **Derived, never curated** — `step-suggestions`' argument at a different altitude, and the
        correction `shared_step` earned by staying empty: a tag list somebody has to populate is a
        tag list nobody populates. A tag exists here because a case carries it, so this endpoint
        cannot disagree with the grid.

        **It is a picker's list and never a validator's.** A tag is free text (§96) and a client may
        send one this endpoint did not return — that is how the first case to carry a new tag gets
        it. Narrowing writes to this list would make the vocabulary closed, which is precisely what
        `case_tag` is not.

        Counts are over **live** cases, so a tag whose every case was soft-deleted disappears from
        the list while remaining legal to write. Zero-count rows are therefore impossible rather
        than filtered.
      responses:
        '200':
          description: |
            The tags in use. An empty array is the ordinary answer for a project nobody has tagged,
            not an error — both tag controls must render an empty list as *"no tags yet"* rather
            than as a failure to load.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TagUsage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------------------------------------- execution ----
  /projects/{projectId}/plans:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [execution]
      summary: Test plans
      responses:
        '200':
          description: |
            The **full** `TestPlan`, not `TestPlanSummary` — the list row and the detail are one
            shape, assembled once (`TestPlanView`'s own note gives the reason: two assemblers are
            how a row and a detail page come to disagree about a plan's status three slices later).

            This line was `TestPlanSummary` until §100 and had been a live three-way divergence:
            `TestPlanView` serves the wide shape, the mock's `present()` serves the wide shape,
            `usePlans` has been typed `TestPlan[]` since Phase 1 — and `TestPlanView`'s javadoc
            already claimed "the contract now declares the wider shape", which was never true. The
            field the gap actually hid is `exitCriteria`: every consumer read it, the contract said
            it was not there, and nothing failed because both implementations sent it anyway.
            Widening the declaration changes no server and no client; it makes the spec say what
            three implementations already do.

            `met` is null on every criterion here. Evaluating a plan's gates means resolving its
            results, which is the statistics endpoint — a list that did it per row would be that
            endpoint run once per plan. So the list can say a criterion EXISTS and never that it
            passed, which is exactly what the compact strip on the plan list renders.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TestPlan' }
        '404':
          # An absent project, one in another company, and one in this company the caller
          # holds no grant on all answer 404 — the read gate every project-scoped list uses.
          # Distinct from a 200 with an empty array, which means the project is reachable
          # and has no plans, the state of every freshly provisioned project.
          $ref: '#/components/responses/NotFound'
    post:
      tags: [execution]
      summary: Create a test plan
      description: |
        `plan:create` — Instance Admin, Company Admin, Test Lead and Test Engineer (roles
        spec §A4). Viewer and Automation Service do not hold it: a plan is authoring, and
        the read gate every role passes must not be the write gate.

        `suiteIds` and `caseIds` become the plan's **scope items**. A suite item means the
        suite's resolved membership — filed ∪ added ∪ tagged, the same union `Suite.caseCount`
        reports — and the plan's `caseCount` expands it, so naming a suite and one of its
        cases is not a mistake: it is two ways of saying the same thing and the count dedupes
        them.

        ~~A suite item means the folder *and everything beneath it*.~~ → **superseded (§98)**,
        when suites stopped being folders. Nothing about scope changes in *effect* for a plan
        that named a leaf; a plan that named a parent to reach its children now reaches only
        what that suite itself resolves, which is the whole point of the flattening.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestPlanInput' }
      responses:
        '201':
          description: Created — key is server-allocated (TP-n, per company)
          headers:
            Location:
              schema: { type: string }
              description: The new plan's canonical URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestPlan' }
        '200':
          # A retry carrying an Idempotency-Key that already created a plan. 200 rather than
          # 201 so a client can tell "I made this" from "I already had this", and so a
          # well-behaved retry is not logged as a second creation. No Location: nothing was
          # created by THIS request.
          description: Replayed — this Idempotency-Key already created a plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestPlan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          # The project read gate, before the payload is looked at — an absent project, one
          # in another company, and one the caller holds no grant on are one answer.
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/plans/{planId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: planId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [execution]
      summary: Plan detail
      responses:
        '200':
          description: Plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestPlan' }
        '404':
          # Four states, one answer: an unreachable project, a plan in a sibling project, a
          # soft-deleted plan and an absent one. Telling them apart makes the path an oracle
          # for plan ids in projects the caller cannot open (§6t).
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [execution]
      operationId: updatePlan
      summary: Edit a test plan's content
      description: |
        `plan:edit` — Instance Admin, Company Admin, Test Lead and Test Engineer (roles spec
        §A4), the same key that carries a plan forward through its ladder.

        Edits what the plan *is*: name, description, milestone, **scope** and the two
        **criteria** lists. `entry_criteria` and `exit_criteria` had no writer at all before
        this operation existed, so `PlanCriteria`'s evaluator and the plan page's exit-criteria
        panel have had nothing to evaluate on any real instance.

        **Not `status`** — that is `PUT .../status`, with its own two gates. A status an
        ordinary save could set is an approval anybody grants themselves.

        ~~**A closed plan is refused with `409`.** `CLOSED` says a release was executed and is
        over, and its scope and criteria are the record of what that release was tested
        against.~~ → **superseded 2026-08-05 (§97, M7):** there is no `CLOSED`, so no plan is
        frozen against editing. What survives is §6g's edit-after-approval rule — editing an
        **approved** plan on a project with review on demotes it to `DRAFT` — so a sign-off
        cannot come to cover criteria nobody signed. What is genuinely lost: a plan whose runs
        are finished stays `APPROVED` and can still be edited.

        **Absent, null and empty are three different instructions**, and the split is by kind
        rather than by field. A **scalar** sent as `null` is cleared. A **list** sent as `null`
        or omitted is *left alone*, and `[]` clears it — a list has an empty spelling of its
        own, so `null` does not have to carry two meanings. That is what keeps a plan whose
        criteria nobody has ever written distinguishable from one whose author deliberately
        removed them all.

        **A version row is written only when the SCOPE moves.** Plan §6j defines a plan version
        as its scope — suites, cases, milestone, criteria — so renaming a plan, rewriting its
        description, or saving it unchanged writes no `test_plan_version` row and leaves
        `currentVersionNo` alone.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestPlanUpdateInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestPlan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          # One 409 left since §97: a stale If-Match, which says "reload and reapply". The other
          # — a closed plan, which said "reopen it", where reloading changes nothing — went with
          # the CLOSED state (M7).
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [execution]
      operationId: deletePlan
      summary: Delete a test plan
      description: |
        `plan:delete` — Instance Admin, Company Admin and Test Lead (roles spec §A4). A Test
        Engineer holds `plan:create` and `plan:edit` and **not** this one: a contributor is never
        blocked from producing, only from unmaking.

        **Refused with `409` while any live run was created from the plan**, naming how many.
        `test_run.plan_id` references the plan and the run list keeps rendering its key, so
        deleting it would leave those runs pointing at a plan the API answers 404 for.

        ~~The way out is `PUT .../status` with `CLOSED`. **Delete a plan nobody executed; close one
        somebody did.**~~ → **superseded 2026-08-05 (§97, M7):** with no `CLOSED` the partition has
        one half. A plan a run names cannot be deleted and **has no terminal state** — it stays
        `APPROVED` for ever, which is correct under M7, where a plan is an outline and its
        execution state lives on its runs. The refusal names the runs, which is the thing actually
        in the way, rather than an act that no longer exists.

        Soft: the row stays, every read drops it, and the scope items and the suites and cases they
        name are untouched.
      responses:
        '204':
          description: Deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          # Including a plan that was already deleted: a second delete is a 404, not a second 204.
          $ref: '#/components/responses/NotFound'
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{projectId}/plans/{planId}/clone:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: planId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [execution]
      summary: Clone a test plan
      description: |
        Plan §6v, decision round 3 #59. Copies the plan into a **new** plan in the same
        project, ready to be renamed for the next release.

        Copied: the description, the milestone, the **whole** scope — the unsectioned
        suites, cases and tags, and every §97 section with its members and its order,
        including a section that is deliberately empty — both scope prose fields, and both
        criteria lists.

        Not copied: the runs, the executions and the results (a plan's scope is what it
        covers, not what happened); the status, which resets to `DRAFT` (§6g — approval
        attaches to content a named person read); and the key, which is allocated fresh.
        The new plan gets its own **version 1** describing itself, not a copy of the
        source's history.

        **This is not `POST /plans` with a source id, and the difference is the point.**
        `TestPlanInput` carries six fields on purpose — a plan is named before anybody has
        subdivided it — so a clone routed through it would drop the sections, the tag arm,
        both prose fields and both criteria lists, and report `201`. This operation shares
        the create's key allocation, starting status and version writer, and supplies the
        rest.

        **Requires `plan:create`.** The criteria and prose it writes normally cost
        `plan:edit`, and every role holding `plan:create` also holds `plan:edit`, so no
        caller gains anything they could not do in a second request. A test derived from the
        seeded catalogue pins that, so a future role separating the two fails the build.

        `name` is **required**; the server invents no `Copy of …`. Criteria are copied as
        stored rather than re-validated: a metric retired since the plan was written would
        otherwise make that plan permanently uncloneable.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestPlanCloneInput' }
      responses:
        '201':
          description: The new plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestPlan' }
        '200':
          description: A replay — this `Idempotency-Key` already created a plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestPlan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/plans/{planId}/status:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: planId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [execution]
      operationId: setPlanStatus
      summary: Submit a plan for review, approve it, or withdraw it
      description: |
        The plan's ladder is DRAFT → IN_REVIEW → APPROVED, and **which permission a move needs is
        decided by the edge, not by the target**:

        - `plan:edit` (Test Engineer and up) carries a plan *forward* through the states nobody has
          signed off — submitting it for review, and returning it from review to draft.
        - `plan:approve` (Lead and up) is needed to **grant** the sign-off and to **take it back** —
          because rescinding a lead's approval is an approval act, and a target-only rule would let
          a Test Engineer do it by asking for `DRAFT`.

        **Two states were removed on 2026-08-05 (§97, M7):** ~~`ACTIVE` and `CLOSED`~~. They
        described a plan being *run*, which is `test_run`'s business — a plan is an outline of what
        must be tested, and whether it is under way is answered by its runs, which have carried
        NOT_STARTED → IN_PROGRESS → COMPLETED → ABORTED since the beginning. §6g's gating rule for
        plans (`requireApprovedPlanToStart`) went with the one edge it bound on and its setting is
        gone; §6g's *case* gate, `requireApprovedCaseForRun`, is untouched. A plan a run names can
        no longer be deleted **and has no terminal state**: it stays `APPROVED`.

        One move is refused with `409` because the ladder does not have it: `APPROVED` is reachable
        only from `IN_REVIEW`, because approval must not be reachable without review — §6g's one
        gate. `APPROVED → IN_REVIEW` is refused for the same reason read forwards: a withdrawn
        sign-off returns the plan to its author, who resubmits it.

        Idempotent: setting the status a plan already has answers `200` with the plan and writes
        nothing — no timestamp re-stamped and no audit row, so a repeated click cannot bury the
        change that actually happened.

        No `If-Match`: the request names an absolute target state rather than a delta against
        something the client read, so there is no lost update to protect (`PUT /runs/{runId}/status`
        makes the same call).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanStatusInput' }
      responses:
        '200':
          description: The plan, as the list renders it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestPlan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{projectId}/plans/{planId}/statistics:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: planId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [execution, reporting]
      summary: Current plan state from the latest execution
      parameters:
        - name: aggregation
          in: query
          description: |
            How to resolve a case executed many times. The chosen policy is echoed
            back and MUST be displayed — two teams reading "94% pass" otherwise mean
            different things (plan §6e).
          schema:
            $ref: '#/components/schemas/AggregationPolicy'
      description: |
        Live since backend M2 slice 3. Computed on read from `test_execution` rather than
        from the `plan_snapshot` rollup plan §6p specifies — that rollup belongs to
        `reporting`, which does not exist, and a figure recomputed per request cannot go
        stale relative to a result recorded a second ago, which is the property a tester
        checks immediately after saving one. The cost is one grouped scan per view, bounded
        by the plan's own scope; revisit when a plan's execution count makes it visible.

        **Two of the five criterion metrics are evaluated** — `pass_rate` and `coverage`,
        the two this endpoint's own numbers support. `open_critical` needs the M4 issue
        tracker, `cases_approved` the review workflow, and `build_available` is modelled
        nowhere; those return `met` and `actual` as null, meaning *not evaluated*, which is
        a different thing from unmet.
      responses:
        '200':
          description: Statistics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanStatistics' }
        '400':
          description: The `aggregation` parameter is not one of the five policies.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          # Same four states as the plan detail above.
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/runs:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      tags: [execution]
      summary: Test runs
      parameters:
        - name: planId
          in: query
          schema: { type: string, format: uuid }
        - name: releaseVersion
          in: query
          schema: { type: string }
      description: |
        `planId` and `releaseVersion` are both **exact-match** filters, and both narrow rather
        than resolve: a `planId` naming a plan in another project narrows the list to nothing
        rather than answering 404, because the filter is a question about this project's runs
        and the honest answer to "which of my runs belong to that plan" is none.
      responses:
        '200':
          description: Runs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TestRun' }
        '404':
          # The project read gate only — see the plans list.
          $ref: '#/components/responses/NotFound'
    post:
      tags: [execution]
      summary: Create a run
      description: |
        `run:create` — every role except Viewer, **including Automation Service** (roles spec
        §A4), which is what lets a CI token open the run it is about to post results into.

        **Creating a run materialises its executions.** One `test_execution` per case in
        scope, each pinned to that case's *current* `case_version_id` at this moment — which
        is what makes the run a record of what was tested rather than of what the cases say
        today (plan §6j). A run that would materialise **nothing** is a 400 on the field,
        not an empty run, because an empty run looks finished.

        **The scope has three arms and they are UNIONED** (§99): `caseIds`, `suiteIds` —
        resolved through the suite's whole membership, filed ∪ added ∪ tag-matched — and
        `tags`, every live case carrying **any** of them. Deduped, and resolved **once**,
        here: the executions are written now, so a suite that grows tomorrow does not grow
        this run and a tag removed tomorrow does not shrink it. That is the opposite of a
        plan's scope, which is a set of references re-resolved on every read, and it is why
        the two can be described in the same words and behave differently.

        `tags` unions rather than intersects, unlike `GET /cases?tag=`. A run is a
        collection being assembled — the same reading `suite_tag_rule` takes — where a grid
        filter is a list being narrowed. Two ways now exist to say "run everything tagged
        smoke" (a suite whose tag rule is `smoke`, or this), which is accepted rather than
        denied: create-time resolution makes the two indistinguishable after the fact.

        **Otherwise the plan's expanded scope**, as before. The arms are a *substitution*
        for it and never an addition to it: a body carrying a plan and any arm means "this
        run is against that plan, and here is the subset we are doing this pass", and
        unioning them would silently add back what somebody explicitly narrowed away. The
        run still records its `planId`, so the narrowing reads as a run shorter than its
        plan rather than as a lost association.

        `configurationId` defaults to the project's default configuration — every project is
        seeded with one, so the field is optional and the column stays `NOT NULL`.

        **§6g's gating rule (§82).** On a project with `requireApprovedCaseForRun` on, a run
        whose resolved case set contains anything that is not `APPROVED` is a `409` naming the
        offending keys — the *resolved* set, so neither naming a plan nor naming a tag is a
        way round it, and the whole run rather than a trimmed one, because a checklist quietly
        shorter than the one that was asked for reports a pass rate over a denominator nobody
        chose. A holder of `case:approve` may pass `overrideApprovalGate`.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestRunInput' }
      responses:
        '201':
          description: Created — key is server-allocated (TR-n, per company)
          headers:
            Location:
              schema: { type: string }
              description: The new run's canonical URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestRun' }
        '200':
          # See POST /plans. It matters more here: a replayed run create that made a second
          # run would also materialise a second set of executions, so the same tester would
          # be shown the same checklist twice with one half of their results on each.
          description: Replayed — this Idempotency-Key already created a run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        # §6g's gating rule. The FIRST 409 on this operation: everything else wrong with a
        # create is a field error, and this one is not — every id names a live case and the
        # permission is held, it is the project's own policy that refuses.
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{projectId}/runs/{runId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/RunId' }
    get:
      tags: [execution]
      summary: Run detail with its executions
      responses:
        '200':
          description: Run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestRunDetail' }
        '404':
          # Unreachable project, run in a sibling project, soft-deleted run, absent run.
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/runs/{runId}/clone:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/RunId' }
    post:
      tags: [execution]
      summary: Clone a test run
      description: |
        Plan §6v, decision round 3 #59 — **the highest-value of the three clones**: re-running
        a regression cycle against a new build is the most repeated action in the product.

        A new run over **the same cases**, with every execution untested. The plan
        reference, the configuration, the release version and the build number are copied
        and any of the last three can be overridden — a clone that could not change the
        build number would make the caller edit the run immediately afterwards.

        Nothing else comes across, and that is structural rather than a list somebody
        maintains: the server builds the same input `POST /runs` takes, and **no result, no
        evidence, no defect link and no timestamp is reachable from it.**

        Two consequences worth reading twice:

        - **The scope is the resolved case set, frozen.** `test_run` stores no scope — §99's
          three arms are resolved once into executions — so cloning a suite-scoped run does
          **not** pick up the cases added since. That is §6v's own clone-versus-template
          distinction, decided here by the schema rather than by the design.
        - **§6g's approval gate is re-evaluated, and an override is never inherited.** The
          override is a statement about a request and nothing stores it, so a clone of a run
          that was started under a documented override answers **409** unless the cases are
          approved now or `overrideApprovalGate` is sent again — on the record, by this
          caller.

        The assignee does **not** fall back to the source. A run has no assignee: the column
        is on `test_execution`, one per case, so there is nothing to copy and picking one
        would be inventing a fact. Omitted means an unassigned checklist; supplied assigns
        the whole one, exactly as on a create.

        **Requires `run:create`**, which Automation Service holds — a CI credential may
        already open a run, and a clone of a run is a run. Recording verdicts still costs
        `run:execute` (§124); cloning records nothing.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestRunCloneInput' }
      responses:
        '201':
          description: The new run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestRun' }
        '200':
          description: A replay — this `Idempotency-Key` already created a run, and no second checklist was materialised.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            §6g's approval gate refuses the cases this run would cover. Not a `400`: every id
            is live and the permission is held — it is the project's own policy that refuses.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /projects/{projectId}/runs/{runId}/status:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/RunId' }
    put:
      tags: [execution]
      operationId: setRunStatus
      summary: Complete, abort or reopen a run
      description: |
        Requires `run:close`, which is **Lead and up** — a Test Engineer holds `run:execute` and
        `result:submit` and does *not* hold this one (roles spec §A4: a contributor is never blocked
        from producing, only from unmaking).

        **A run starts by itself and ends deliberately.** `NOT_STARTED → IN_PROGRESS` happens when
        the first result is recorded, with no permission of its own. A run never completes itself
        when the last result lands, because "we are done" is a judgement — and auto-completion would
        let a Test Engineer close a run by finishing it, which is the boundary this permission draws.

        **`COMPLETED` and `ABORTED` are both "closed".** There is no fifth status: `V1`'s
        *"immutable once the run closes"* names the act, and a run that has ended refuses further
        results and evidence with `409` until it is reopened.

        Sending `NOT_STARTED` or `IN_PROGRESS` **reopens** the run, and the two spellings mean the
        same thing: the server derives the live state from whether the run ever started, so a run
        aborted before anybody touched its checklist cannot come back claiming to have run.

        Idempotent: setting the status a run already has answers `200` with the run and writes
        nothing — no timestamp re-stamped and no audit row, so a repeated click cannot bury the
        change that actually happened.

        `409` is the refusal of a transition this lifecycle does not have: completing a run in which
        nothing has been recorded (abort it instead), or moving straight from one ended state to the
        other (reopen it first).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunStatusInput' }
      responses:
        '200':
          description: The run, as the list renders it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{projectId}/runs/{runId}/executions/{executionId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/RunId' }
      - name: executionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [execution]
      summary: One execution, with the pinned case version's steps
      description: |
        **The steps, preconditions and postconditions are the ones the pinned case version
        carried, not the ones the case carries now** (plan §6j). `test_execution.case_version_id`
        is the pin, and this response resolves through it — so editing a case never rewrites
        what a tester was told to do in a run that already happened.

        `caseTitle` is pinned for the same reason and `caseKey` is not pinned because it cannot
        move: a display key is immutable (§6t).
      responses:
        '200':
          description: Execution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestExecution' }
        '404':
          # Unreachable project, a run or execution in a sibling project, an execution that
          # belongs to a different run than the path names, and an absent one.
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [execution]
      summary: Record a result
      description: |
        Optimistic locking via If-Match — several testers may work one run at once.

        **Three permissions, not one.** Every call here needs `run:execute` — *"execute test
        cases in a run"*, which V3 grants to Test Engineer and up and **withholds from Automation
        Service alone**. On top of that, recording a verdict where none was recorded needs
        `result:submit`, and changing a verdict that is already there needs `result:amend`, which
        is **Lead-only** (roles spec §A4 — `result:amend` is listed beside `suite:delete` as
        destructive rather than creative).

        **What `run:execute` buys, since it looks redundant beside `result:submit`:** every other
        execution permission separates a lead from an engineer, and this one separates a *person*
        from a *credential*. Automation Service holds `result:submit` because ingesting a CI
        report is its entire purpose; without this gate the same credential could also PATCH
        executions here one at a time, with an `If-Match` and evidence, indistinguishable in the
        audit trail from a tester working a checklist. A CI token posts to `POST /ingestions` and
        nowhere else. Wired 2026-08-07 (plan §8 #53) — the key was seeded in M0 and had no
        consumer until then.

        The three 403s carry different sentences: telling a tester who records results every day
        that they may not record results sends them to ask for a permission they already hold,
        and telling a CI job it lacks permission hides that the thing it wants is supported at a
        different address.

        A `statusId` naming a status outside this project's vocabulary is a **400 on the field**,
        not a 404 — the target resolved and the picker is where the message belongs.

        **Recording the first result starts the run** — `NOT_STARTED → IN_PROGRESS`, stamping
        `startedAt` from the same instant as the result. No extra permission: the caller has
        already passed the gates above, and a second one here would mean a tester records a
        result the run then declines to acknowledge.

        **`409` now has two causes.** A stale `If-Match` is one. The other is a run that has
        ended: `V1`'s "immutable once the run closes", which freezes the verdict and its evidence
        together. Reopening the run is the way forward and needs `run:close`.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecutionResultInput' }
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestExecution' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{projectId}/runs/{runId}/executions/{executionId}/evidence:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/RunId' }
      - { $ref: '#/components/parameters/ExecutionId' }
    post:
      tags: [execution]
      operationId: attachEvidence
      summary: Attach a screenshot or log to a result
      description: |
        Needs `evidence:attach` — held by every role but Viewer (roles spec §A5).

        **The upload proxies through the API** rather than going browser-direct to a signed URL:
        the storage port's filesystem adapter cannot issue one (plan §8 open question #28,
        resolved in §51, which stated this consequence when the option was chosen). So the
        instance's `spring.servlet.multipart.max-file-size` is a real limit, and a file over it
        is a **413** rather than a 400 — the request is refused before it reaches the handler,
        so there is no field to hang the message on.

        `stepId` attaches to one step's result instead of to the execution as a whole. The two
        are different claims: a file on the execution documents the verdict, a file on a step
        documents where it went wrong.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    The bytes. Filename and content type travel in the part's own headers, and
                    the filename is stored in a column — it never becomes part of a storage key.
                caption:
                  type: string
                  nullable: true
                  description: Optional one-line description shown beside the thumbnail.
                stepId:
                  type: string
                  format: uuid
                  nullable: true
                  description: |
                    A step of the **pinned** version that already has a recorded result. A step
                    nobody has marked has no `step_result` row to attach to, and inventing one
                    would record a verdict nobody gave — so that is a 400 on this field.
      responses:
        '201':
          description: Attached
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Evidence' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          # The run has ended, so its evidence is frozen — V1's "immutable once the run closes",
          # applied to the verdict and its proof at once (§72). Not a 403: the permission is held
          # and the payload is fine, it is the run's state that refuses.
          $ref: '#/components/responses/Conflict'
        '413':
          description: |
            The file is larger than this instance's upload limit. Refused by the servlet
            container before the handler runs.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /projects/{projectId}/runs/{runId}/executions/{executionId}/evidence/{evidenceId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/RunId' }
      - { $ref: '#/components/parameters/ExecutionId' }
      - { $ref: '#/components/parameters/EvidenceId' }
    delete:
      tags: [execution]
      operationId: deleteEvidence
      summary: Remove evidence
      description: |
        Needs `evidence:delete`, which is **`OWN`-qualified for Test Engineer** (roles spec §A5):
        they may remove evidence they attached and not a colleague's.

        **The two refusals carry different sentences**, because they are different facts about
        the caller. "You do not have permission to remove evidence" is false for someone who
        removes their own attachments all day, and false in the direction that sends them to ask
        an administrator for a permission they already hold.

        Evidence with **no recorded author** is not covered by an `OWN` grant — a grant over
        "your own work" must not stretch to work nobody can attribute.

        The delete is **hard**, unlike a case's. A screenshot removed on request has to actually
        leave the disk; a soft-deleted row pointing at retained bytes is a deletion that did not
        delete, which is the wrong answer for the one thing here a customer may need removed for
        privacy reasons.
      responses:
        '204':
          description: Removed
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          # A closed run refuses EVERYBODY, the author included — checked before authorship, so the
          # answer is not "this is not yours", which would imply that being the author would help.
          $ref: '#/components/responses/Conflict'

  /projects/{projectId}/runs/{runId}/executions/{executionId}/evidence/{evidenceId}/content:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/RunId' }
      - { $ref: '#/components/parameters/ExecutionId' }
      - { $ref: '#/components/parameters/EvidenceId' }
    get:
      tags: [execution]
      operationId: downloadEvidence
      summary: The evidence bytes
      description: |
        What `Evidence.url` points at — **without this route that field would be a lie**.

        An ordinary session-authenticated API route rather than a public link, because the
        filesystem adapter cannot issue an expiring signed URL and a guessable permanent one
        would be an unauthenticated read of a customer's screenshots.

        No separate permission: anyone who may see the execution may see its evidence, and the
        catalogue has no `evidence:read`. Served `inline` with the stored content type so the SPA
        can render an image in place rather than downloading it.
      responses:
        '200':
          description: The bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404':
          # Also the answer when the row exists and its blob does not — the orphan the write
          # ordering deliberately produces instead of the reverse. See EvidenceStore.
          $ref: '#/components/responses/NotFound'

  # ------------------------------------------------------- documentation ----
  /projects/{projectId}/doc-pages:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [documentation]
      summary: Documentation page tree
      responses:
        '200':
          description: Pages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocPageSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [documentation]
      summary: Create a documentation page
      description: |
        `key` is server-allocated from the company's counter (`DOC-n`, sequential per **company**,
        §6t) and `path` is derived from it, never from the title — a retitled page must not move.
        Requires `doc:edit`.

        `status` is always `DRAFT` and is not an input, for the reason a created case's status is
        not: a state an ordinary create could set is an approval its author granted themselves
        (§6g). Publishing is `PUT .../status` and a different permission.

        Blocks may be sent with the page or left for a later `PATCH`. **Block ids are
        server-generated here and never derived from the text** — see `DocBlockInput`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocPageInput' }
      responses:
        '201':
          description: Created — key is server-allocated (DOC-n, per company)
          headers:
            Location:
              description: The created page's own URL.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/doc-pages/{pageId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: pageId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [documentation]
      summary: Page with blocks and per-block coverage
      description: |
        Each block carries the cases linked to it — plan §6i's inline traceability marker.

        ~~`coverage` is **absent** until something can create a `doc_link`. Nothing can yet~~ →
        **superseded**: `POST .../blocks/{blockId}/links` creates them, and each block now serves
        `links`. `coverage` is still absent, for a different reason that is stated on the field
        itself: this module can see *which* cases claim a statement but not how they are **doing**.
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [documentation]
      summary: Retitle a page and replace its blocks
      description: |
        Requires `doc:edit`. Send the page's `lockVersion` as `If-Match`; the SPA always does, so a
        concurrent edit is a `409` rather than a silent overwrite (§6j).

        **`blocks` is the whole page, in order — and identity survives it.** A block sent with its
        `id` keeps that id however much its text changed, so a fixed typo does not break the links
        pointing at it (§6i/§6m). A block sent without an `id` is new. A block *omitted* is
        deleted, and a deleted block that something links to is refused with `409` rather than
        cascaded away — the link is somebody's traceability record, not this request's business.

        An `id` that is not a block of this page is a `400`, never a silent create: a client that
        believes it edited a block must not have created a different one.

        `status` is not editable here — see `PUT .../status`.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocPageInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Either the `If-Match` did not match the stored `lockVersion`, or the edit removes a
            block that a case still links to. `detail` says which, and the second names how many.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [documentation]
      summary: Delete a page
      description: |
        Soft-deletes a page and its blocks. Requires `doc:edit` — deleting is not split off into a
        permission of its own the way `suite:delete` is, because deleting a page cannot reach other
        people's *cases*; the destructive-collection-action reasoning that split those two does not
        apply here. (Since §98 a suite has no subtree either — what `suite:delete` still guards is
        the filed cases standing behind it.)

        **The page must have no child pages**, which answer `409` naming the count. A cascade would
        remove pages the request never mentioned.

        Refused with `409` when a case links to one of its blocks, for the reason the `PATCH` is:
        traceability is not collateral.
      responses:
        '204':
          description: Deleted. No body.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The page has child pages, or a case links to one of its blocks. `detail` names which
            and how many.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /projects/{projectId}/doc-pages/{pageId}/blocks/{blockId}/links:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: pageId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: blockId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [documentation]
      summary: Link a case or suite to a block
      description: |
        Records that a test case (or a whole suite) verifies this statement. Requires `doc:edit` —
        the link is a property of the documentation, and its holder is everyone who writes docs.

        **This is the first writer `doc_link` has ever had.** Two read paths have been specified and
        unserved since the mock era waiting for it: `TestCase.relatedDocuments` and `DocBlock.links`.
        A third, `DocBlock.coverage`, stays absent — see its own description for why building this
        did not unblock it.

        Two protections that already existed become reachable on the same day: the page `PATCH` and
        the page `DELETE` both answer `409` rather than cascading a link away, because a link is
        somebody's traceability record and not the request's business.

        **Linking the same source to the same block twice writes nothing and answers `200`** with
        the existing link, rather than a second row or a conflict. Re-asserting a fact that is
        already recorded is not an error, and a duplicate would double every count drawn off this
        table.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BlockLinkInput' }
      responses:
        '200':
          description: The link already existed. Nothing was written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlockLink' }
        '201':
          description: Linked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlockLink' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: |
            The project, the page, the block, or the source is not visible here. One response for
            all four (§6t) — the source check is against **this project**, not merely this company,
            so a sibling project's case lands here rather than being accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /projects/{projectId}/doc-pages/{pageId}/links/{linkId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: pageId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: linkId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [documentation]
      summary: Remove a link from a block
      description: |
        Requires `doc:edit`. **A hard delete**, unlike a page's: the link is an assertion somebody
        made and has now withdrawn, and a tombstoned assertion still reads as one to every count
        drawn off this table. `ReviewAssignment` made the same call for the same reason, against
        `ReviewComment`'s opposite one.

        Deleting a link that does not exist is a `404`, not an idempotent `204`: unlike the `POST`,
        there is no fact here that is already true — the caller named a row, and naming one that is
        not there is a mistake worth reporting.
      responses:
        '204':
          description: Removed. No body.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/plans/{planId}/document:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: planId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [documentation]
      summary: The plan's business-requirements page
      description: |
        The document a plan's requirements are written in — **a page somebody already wrote**, which
        the plan adopts. The plan row holds the *executable* half: the milestone, the entry and exit
        criteria, and the suites, cases, tags and sections in scope; `scopeText` and
        `outOfScopeText` hold the prose that used to be two of this document's headings.

        **It is an ordinary `DocPage`**, living in the project's documentation space and reachable at
        `/doc-pages/{pageId}` like any other, with `subjectType: TEST_PLAN` naming the plan it is
        about. That is why editing it is `PATCH /doc-pages/{pageId}` and costs `doc:edit`, not
        `plan:edit`: it is documentation, it versions as documentation, and it is found by everyone
        who searches the documentation. This endpoint only *resolves* the plan to it.

        `404` when the plan has no document yet — a plan is created long before anybody links one,
        so this is the ordinary first answer and not an error state. `PUT` links one.

        > **Retired 2026-08-05 (§97):** `POST` — *start the plan's document from the five-section
        > template* — is gone, and with it `PlanDocumentTemplate`. Four of that template's five
        > headings now have real homes (business requirements is *this* linked page, test artefacts
        > is the `artifact` register, scope and out of scope are `scopeText` / `outOfScopeText` on
        > the plan, and the test-case outline is the plan's own sectioned scope items), which leaves
        > the template seeding a document whose every section is authored somewhere else — a second
        > place to write each one, and §6n's "graveyard of outdated copies" written by the product
        > itself. What replaces it is `PUT`: a plan adopts the specification somebody wrote before
        > the release was scheduled, keeping its history, its `doc_link`s and its place in the
        > search index. **Existing documents are untouched** — retiring the template changes what a
        > new plan gets, never what an old one holds.
      responses:
        '200':
          description: The document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: The project or plan is not visible, or the plan has no document yet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
    put:
      tags: [documentation]
      summary: Link an existing page as the plan's document
      description: |
        Adopts a page that already exists in the project's documentation space. Since the template
        `POST` was retired (§97) this is **the only way a plan gets a document**. Requires
        `doc:edit`, the same key as editing the page, because it is the same act seen from the other
        end: it writes the page's `subjectType`/`subjectId` and nothing on the plan.

        **A plan's document is often written before the plan row exists** — a specification drafted
        in the documentation section, then adopted once the release it describes is scheduled. Until
        this operation existed the only way there was to copy the prose into a fresh template page,
        which loses the page's history, its `doc_link`s, and its place in the search index.

        Three refusals, and they are three different things:

        - The page is **already another plan's document** → `409`, `detail` naming that plan. One
          page cannot be two plans' document; the partial unique index says so and this says why.
        - **This plan already has one** → `409`. Relinking is `DELETE` then `PUT`, deliberately two
          steps: a silent reassignment is how a plan comes to document a different release than its
          reader believes, with nothing in either page's history recording the swap.
        - The page belongs to a **sibling project** → `404`, never `409` or `400`. RLS scopes to the
          *company*, so the row is reachable and only an explicit project predicate refuses it —
          answering anything else tells a caller that a page they cannot see exists elsewhere.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanDocumentLinkInput' }
      responses:
        '200':
          description: The linked page, as `GET` would now answer it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: The project, plan or page is not visible.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            The page is already another plan's document, or this plan already has one. `detail`
            names which, and the two sentences are different.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [documentation]
      summary: Unlink the plan's document
      description: |
        Clears the page's `subjectType`/`subjectId` and **keeps the page**. This unlinks
        documentation; it does not delete it — the page stays in the project's documentation space,
        keeps its blocks, its history and its links, and can be linked to another plan or left as an
        ordinary page. Deleting it is `DELETE /doc-pages/{pageId}`, a different act with a different
        blast radius.

        Requires `doc:edit`. Idempotent in the direction that matters: a plan with no document
        answers `404`, the same answer `GET` gives, rather than a `204` that would tell a caller
        their unlink succeeded when there was nothing to unlink.
      responses:
        '204': { description: Unlinked. The page still exists. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: The project or plan is not visible, or the plan has no document.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /projects/{projectId}/doc-pages/{pageId}/status:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: pageId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [documentation]
      summary: Publish, unpublish or archive a page
      description: |
        Requires `doc:publish`, which Test Engineer does **not** hold while `doc:edit` is held by
        everyone who writes (roles spec §A2).

        **A separate endpoint rather than a `status` field on the `PATCH`, because it is a separate
        permission.** One endpoint whose gate depends on which fields the body happened to carry is
        one whose `403` no client can predict, and whose disabled-state the SPA cannot render — the
        two things §31 exists to prevent.

        Idempotent: setting the status a page already has answers `200`, not a conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocPageStatusInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/doc-pages/{pageId}/attachments:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: pageId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [documentation]
      operationId: attachDocPageFile
      summary: Attach a file to a documentation page
      description: |
        Decision round 3's #49, phase 2 — `attachment.owner_type = 'DOC_PAGE'`, declared by
        `V1` and writerless for the whole life of the product until this endpoint. A
        specification is not only prose: it is the wireframe, the signed-off mock-up and the
        data sheet the paragraphs describe, and until this the product could hold the
        paragraph and not the picture it was written about.

        **Requires `doc:edit`, not `doc:publish`.** This module's defining split is that
        `doc:edit` writes content and `doc:publish` moves the publication state, with Test
        Engineer holding the first and not the second (roles spec §A2). An attachment is
        **content** — somebody who may rewrite every paragraph may attach the diagram those
        paragraphs describe, and the other choice would leave a Test Engineer able to author a
        specification they could not illustrate.

        The delete below costs the same key with **no author arm**, which is the same call
        `case:edit` makes one module over and for the same reason: `doc:edit` already lets its
        holder delete a lead's paragraph, so refusing them the image beside it would make the
        attachment stricter than the text referencing it.

        **No new permission was invented.** The catalogue has no `attachment:*` key and one
        seeded to nobody is a `403` no administrator can grant their way out of.

        **No `If-Match` and no version row**, unlike the page's own `PATCH`. Blocks are
        reconciled by id so a stale client carries stale ids; an attachment is addressed by
        its own id and never reconciled, so two people attaching two files are not in
        conflict — they are both attaching. And `doc_page_version` snapshots the blocks, so a
        version row here would be a history entry whose diff says nothing changed.

        **An archived page still accepts files.** `ARCHIVED` takes a page out of circulation
        while keeping its links resolvable; making it a retention control is a different
        decision, and the page's own `PATCH` has no status arm either.

        **The upload proxies through the API** rather than going browser-direct to a signed
        URL: the storage port's filesystem adapter cannot issue one (plan §8 #28). So the
        instance's `spring.servlet.multipart.max-file-size` is a real limit and a file over it
        is a **413** rather than a `400` — the request is refused before it reaches the
        handler, so there is no field to hang a message on.

        **There is no `GET` here.** The list is `DocPage.attachments` on the page detail,
        which is the only screen that shows it; a second read path would be a second answer to
        "what is attached to this page", free to disagree the moment one grew a filter.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    The bytes. Filename and content type travel in the part's own headers, and
                    the filename is stored in a column — it never becomes part of a storage key.
      responses:
        '201':
          description: Attached
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: |
            The file is larger than this instance's upload limit. Refused by the servlet
            container before the handler runs.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /projects/{projectId}/doc-pages/{pageId}/attachments/{attachmentId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: pageId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - { $ref: '#/components/parameters/AttachmentId' }
    delete:
      tags: [documentation]
      operationId: deleteDocPageFile
      summary: Remove a file from a documentation page
      description: |
        Costs `doc:edit` — the same key the upload does, with **no author arm**. See the
        `POST` above for why, and note the consequence stated plainly: whoever may edit the
        page may remove any of its files, including one somebody else attached.

        **A hard delete, and the bytes go with the row** — unlike the page itself, which is
        soft-deleted. A file removed on request has to actually leave the disk: a soft-deleted
        row pointing at retained bytes is a deletion that did not delete, which is the wrong
        answer for the one thing here a customer may need removed for privacy rather than
        tidiness. The row is removed first and the bytes second, so a failure between them
        leaves an unreferenced blob an operator can sweep rather than a thumbnail that renders
        and never opens.

        The audit row carries the filename, and it is the **only** surviving statement that
        the file existed once both the row and the bytes are gone.

        `404` when `attachmentId` names nothing on **this** page — the two-segment gate, so
        `/doc-pages/{a}/attachments/{belongs-to-b}` cannot reach another page's file.

        `409` when an `image` block on the page names this file. The block would otherwise
        keep a `attachmentId` pointing at nothing and render as a hole — the same refusal, and
        the same reason, as removing a block a case links to: the reference is somebody's
        authored content and not collateral of a tidy-up. Remove the block first.
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: An `image` block on this page references the file.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /projects/{projectId}/doc-pages/{pageId}/attachments/{attachmentId}/content:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: pageId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - { $ref: '#/components/parameters/AttachmentId' }
    get:
      tags: [documentation]
      operationId: downloadDocPageFile
      summary: The file's bytes
      description: |
        What `Attachment.url` points at.

        **No permission beyond the page read gate.** Anyone who may read the page may read
        what is attached to it, and the catalogue has no `attachment:read` — inventing one
        would be a permission no role is granted, which is a `403` nobody can fix. It is also
        the only rule that does not make the SPA reason about two permissions per thumbnail.

        Served `inline` with the stored content type, so a diagram renders in place beside the
        paragraphs it belongs to. The filename reaches a response **header**, where a carriage
        return is header injection rather than an odd name; it is neutralised on the way out.

        `404` also when the row exists and its blob does not — the orphan the write ordering
        deliberately produces rather than the reverse. An empty `200` would hand the browser
        a corrupt file.
      responses:
        '200':
          description: The bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/artifacts:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      tags: [artifacts]
      summary: Artifact register
      parameters:
        - name: scope
          in: query
          description: |
            Omitted means `PROJECT` — the project's own register, which is the whole register on a
            project that runs no cycles.
          schema: { type: string, enum: [PROJECT, PLAN], default: PROJECT }
        - name: planId
          in: query
          description: |
            Required when `scope=PLAN`, and a `400` without it: a plan register with no plan names
            no rows, and answering the project's register instead would silently show one thing
            under a heading promising another.

            When present, project-scope artifacts are returned **as well**, flagged `inherited`
            (plan §6n) — a tester opening a cycle should find the environment guide without hunting
            for it. Rejected when `scope=PROJECT`, because nothing about a project's own register
            depends on a plan.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Artifacts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Artifact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [artifacts]
      summary: Register an artifact
      description: |
        Registers a **reference** — a documentation page or an external URL — at project or plan
        scope.

        `FILE` and `GENERATED_REPORT` are declared on `Artifact` because the register renders them,
        and are deliberately **not** accepted here. ~~An upload needs the storage port (open
        question #28…)~~ → **superseded: `FILE` is registrable since 2026-08-07, at
        `POST /projects/{projectId}/artifacts/files`**, because the bytes have to travel with the
        registration — a `FILE` row created here and filled in later is a register entry claiming a
        document it cannot produce. Sending `kind: FILE` to *this* operation is a `400` naming that
        endpoint, and the advice is safe to give because the caller holds the same permission for
        it. A pinned report still needs a writer: nothing in `reporting` produces one.

        Steering people toward references is the design, not a limitation of this slice — plan §6n
        calls the register's failure mode "a graveyard of outdated copies", and a strategy document
        *authored* as a doc page and *registered* here cannot go stale the way an uploaded copy of
        it does.

        `status` is absent from the input on purpose (plan §6g): `SUPERSEDED` is the outcome of
        superseding something, and a create that could set it would be an author approving their
        own record.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtifactInput' }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artifact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/artifacts/files:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    post:
      tags: [artifacts]
      operationId: registerArtifactFile
      summary: Register an uploaded file as an artifact
      description: |
        Decision round 3's #49 — `ArtifactKind.FILE` and `attachment.owner_type = 'ARTIFACT'`, both
        declared by `V1` and writerless for the life of the product. The blocker was the storage
        port (open question #28), resolved in §67 and finished in §125; the "not registrable yet"
        note outlived it by two milestones.

        **The file arrives with the registration and cannot arrive after it.** There is no
        "create the artifact, then attach the bytes" — a `FILE` row with no file is a register
        entry that says a document is held and cannot produce it, which is the register's whole
        claim, false, in the module where plan §6n makes the audit trail the point. One request
        removes that state rather than making it a window somebody has to close.

        **There is no re-upload and no detach, and no `PUT` here.** Replacing the document is
        *superseding* it (plan §6n) — a second artifact naming the first — so the bytes are fixed
        at registration. An artifact that swapped its bytes would keep the author, the timestamp
        and the audit trail of the file it replaced.

        **Requires `artifact:edit`, scope-qualified exactly as the reference create is.** A Test
        Engineer may upload a cycle's sign-off and may not upload the project's test strategy, for
        the same reason they may not *link* one: a project-scope artifact is inherited read-only by
        every plan. A `PROJECT` scope from that caller is a `403` with `errors.scope`; the same
        caller with `PLAN` gets a `201`. No stricter key was invented for uploads — the roles spec
        has no such rule, and one seeded to nobody is a `403` no administrator can grant their way
        out of.

        **A separate path rather than a multipart variant of `POST /artifacts`.** Adding a second
        media type to that operation means narrowing it to `application/json`, which turns every
        client posting a reference without a `Content-Type` into a `415` — a behaviour change on an
        endpoint this has no business touching.

        **The upload proxies through the API**, so the instance's
        `spring.servlet.multipart.max-file-size` is a real limit and a file over it is a `413`,
        refused before the handler runs.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [artifact, file]
              properties:
                artifact: { $ref: '#/components/schemas/ArtifactFileInput' }
                file:
                  type: string
                  format: binary
                  description: |
                    The bytes. Filename and content type travel in the part's own headers, and the
                    filename is stored in a column — it never becomes part of a storage key, which
                    is built from server-generated UUIDs.
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artifact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: |
            The file is larger than this instance's upload limit. Refused by the servlet container
            before the handler runs, so there is no field to hang a message on.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /projects/{projectId}/artifacts/{artifactId}/content:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: artifactId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [artifacts]
      operationId: downloadArtifactFile
      summary: A file artifact's bytes
      description: |
        What `Artifact.url` points at when `kind` is `FILE`.

        **No permission beyond the register's read gate.** Anyone who may see that the document is
        registered may open it, and the catalogue has no `attachment:read` — inventing one would be
        a permission no role is granted, which is a `403` nobody can fix.

        Addressed by the **artifact's** id, not the attachment's: the attachment is an
        implementation of the artifact rather than a thing the register has a route to, and a URL
        naming it would put a second identifier on screen for one document.

        Served as `attachment` with the uploaded filename — **the one attachment response in the
        product that is not `inline`**. A page's image and a case's screenshot render beside the
        text they illustrate; an artifact is a held document reached from a list that names it, and
        what somebody clicking it wants is the file.

        One `404` for four things (§6t): an unreachable project, an artifact of another project, an
        artifact that is a link rather than an upload, and a row whose blob is missing — the orphan
        the write ordering deliberately produces rather than the reverse. An empty `200` would hand
        the browser a corrupt file.
      responses:
        '200':
          description: The bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/artifacts/{artifactId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: artifactId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [artifacts]
      summary: Remove an artifact from the register
      description: |
        Requires **`artifact:delete`** — Lead and up, and deliberately **not** held by a Test
        Engineer, who may register a plan-scope artifact (`artifact:edit`, plan-scope-qualified)
        and may not unregister one. That is the same creative-versus-destructive line the roles
        spec draws for `result:submit` against `result:amend`. Wired 2026-08-07 (plan §8 #53); the
        key had been in the catalogue since M0 with no consumer, so deletion did not exist at all.

        **This is for a mis-registration, not for an artifact that has served its purpose.** Plan
        §6n is explicit that the register's value is the audit trail: an artifact that is no longer
        current is `SUPERSEDED` (a newer one names it) or `ARCHIVED` ("no longer relevant, kept for
        the record"), and both stay readable. Deletion is the answer to *"that link should never
        have been in here"* — a wrong URL, a page pointing at another team's document — where
        keeping the row would leave the register asserting something untrue.

        There is no `deleted_at` on `artifact`, unlike cases, suites and runs. That is the schema's
        own answer and it is honoured here: **the row is gone**, not hidden.

        **For a `FILE`, the bytes go with it** — the attachment row and the blob, in that order,
        after the artifact row. This is the first kind whose unregistration destroys something
        rather than removing a pointer to a document that goes on existing elsewhere, and it is why
        `artifact:delete` being a separate key from `artifact:edit` matters more than it did when
        the key was wired: the two `409`s below now protect the last copy of a file, not only a
        record of one.

        Two refusals, both `409`, and both about the record rather than about the caller:

        - **A write-once artifact cannot be deleted.** `artifact.write_once` marks a sign-off
          record, whose whole point is that corrections supersede and never overwrite. The column
          has had no enforcement since `V1` and nothing sets it `true` yet — it is honoured now
          rather than when a writer appears, because enforcement that arrives *after* the control
          it protects is the `Company.suspend()` shape: a guarantee that is believed and does
          nothing.
        - **An artifact another one supersedes cannot be deleted.** `superseded_by_id` would be
          left dangling, and a correction pointing at a record that no longer exists is worse than
          either row alone.
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ----------------------------------------------------------- reporting ----
  /projects/{projectId}/dashboard:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [reporting]
      summary: Repository status dashboard
      description: |
        Lifecycle counts crossed with derived health signals. Every count carries
        the filter that reproduces it, so tiles are links, not decoration (plan §6o).
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepositoryDashboard' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/reports:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [reporting]
      operationId: listReportDefinitions
      summary: Saved report definitions
      description: |
        **Yours, not the project's.** A definition is owned by the person who saved it
        (`report_definition.owner_id`) and v1 has no way to share one, so two people asking for the
        same project's saved reports receive different lists — the same design `GET /work-items`
        states for the team board, and the reason it is stated here too is that a list endpoint
        which quietly means "mine" is otherwise indistinguishable from one that means "everyone's"
        on a project where only one person has ever saved anything.

        `report_definition.shared_with_team_id` is `V1`'s answer to sharing and is **deliberately
        unimplemented**: it is the only part of this surface that would want a permission key the
        catalogue does not have, and a key `V3` seeds to nobody is a 403 no administrator can grant
        their way out of.

        Needs `report:view` — see `POST` below for why saving costs the *view* key and not
        `report:export`.
      responses:
        '200':
          description: |
            The caller's own saved reports for this project, newest first. An empty array is the
            ordinary answer: nothing seeds a definition, and a project where nobody has saved one
            has none.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReportDefinition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [reporting]
      operationId: createReportDefinition
      summary: Save a report so it can be regenerated
      description: |
        §6e's *"saved as part of the `ReportDefinition` so the same cycle report regenerates next
        release with one click"* — which is most of why the table exists. What is saved is **what to
        compute** (`type` + `parameters`), never how to render it: `report_definition` has no format
        column, because the format is chosen per download and a saved report is not the file it
        produced.

        **Needs `report:view`, not `report:export`, and that is a decision rather than an
        oversight.** The row belongs to its creator and is visible to nobody else, so saving one
        writes to the caller's own workspace and not to project content — while requiring the
        export key would mean the persona §6e's two-key split exists for, *may read reports on
        screen but may not carry them off*, could not save the report it is allowed to read.

        A `type` this server cannot compute is a 400 naming what it can, in the same words
        `generate` uses: a saved report for a type nothing can produce is a button that always
        fails, and it fails at the moment it is *used* rather than at the moment it is wrong.

        **Names are not unique.** Two definitions may share a name — the rows are one person's own,
        a collision is theirs to notice, and a uniqueness constraint would be a migration adding a
        rule §6e does not ask for.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportDefinitionInput' }
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportDefinition' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/reports/{definitionId}:
    # No query parameters on the path item, per §50.
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/DefinitionId' }
    delete:
      tags: [reporting]
      operationId: deleteReportDefinition
      summary: Delete a saved report
      description: |
        A **hard** delete. A definition authors nothing — it is a saved question — so there is
        nothing for a soft delete to preserve.

        **The reports it produced survive it.** `report_job.definition_id` and
        `report_artifact.definition_id` are both `ON DELETE SET NULL`, so deleting a saved report
        never deletes the history of what it generated: those jobs become indistinguishable from
        ad-hoc ones, which is what they now are.

        **A definition somebody else owns answers 404, not 403.** The caller cannot list it, so
        telling them it exists would make this route an oracle over other people's saved reports —
        §6t's argument at row level.

        Needs `report:view`, for the reason `POST` above gives.
      responses:
        '204':
          description: Deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/reports/generate:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    post:
      tags: [reporting]
      operationId: generateReport
      summary: Generate a report
      description: |
        Async by contract — returns 202 with a job to poll (plan §6e). The work outlives the
        request that asked for it, which is why there is a job row at all: an in-request dispatch
        is lost on a restart, leaving a client polling an id that resolves to nothing with no
        symptom anywhere but a spinner.

        Needs `report:export` — held by every role but Automation Service (roles spec §A5).
        Generating *is* exporting: the artifact is a file somebody downloads. There is deliberately
        no `report:generate` key, because a key `V3` seeds to nobody is a 403 no administrator can
        grant their way out of.

        **What is refused at request time, and what is not.** An unknown `type` and a `format` this
        deployment cannot render are both 400s here, decided by asking the server what it actually
        has rather than by a list beside the check. A report's *own* parameters — a `runId` that is
        absent, or names a run in another project — are checked inside the worker and surface as a
        FAILED job carrying that sentence, because validating them here would mean either a second
        copy of every report's rules or a database read on the request path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format]
              properties:
                definitionId:
                  type: string
                  format: uuid
                  description: |
                    Regenerate a saved report (§89's *"one click"*). The definition supplies the
                    `type` and a **base** for `parameters`; anything sent in this request overrides
                    it **key by key at the top level**, so "the same cycle report, but for last
                    week" is one field rather than a re-sent copy of the whole selection.

                    The merge is deliberately **shallow**. `parameters` is untyped by design, so a
                    deep merge would have no schema to decide whether a nested object should be
                    combined or replaced, and half-overriding a saved selection is the kind of
                    difference nobody sees in the output.

                    A definition **the caller does not own** is a field error rather than a 403,
                    for the reason `DELETE` gives. `type` may be omitted when this is sent, and if
                    both are sent they must agree — a request that names one report and a saved
                    definition of another is a mistake in the client, and picking either one
                    silently generates a report somebody did not ask for.
                type:
                  type: string
                  example: run_summary
                  description: |
                    Which report. This is an open string rather than an enum because §6e's
                    catalogue names ten and the set a deployment can produce grows slice by slice —
                    an enum here would have to be edited in lockstep with the server, and a client
                    generated from a stale one could not ask for a report that exists.

                    A type this server cannot compute is a 400 naming what it can.
                    **Three today**, and the refusal is generated from what is registered rather
                    than from this list, so a deployment is the authority on its own catalogue:

                    - `run_summary` (§87) — one run's results, its pass rate and its outstanding
                      work. Scoped to a single run, so it can say what was *not* run.
                    - `aggregate_execution` (R6) — executions **across** a selection of plans,
                      suites, features, configurations and dates, resolved under a stated
                      aggregation policy. It is computed from the `execution_fact` log rather
                      than from live rows, which has two consequences worth knowing before
                      comparing it with a screen: **a result recorded in the last few minutes may
                      not be in it yet** (the projection runs every 15 minutes), and **a case with
                      no recorded result is not in it at all** — a star schema holds facts, not
                      scope, so there is no "not run" here the way a plan page has one.

                      Since R7 it carries four further sections, and **all four deliberately
                      ignore the `policy` parameter** — they are about the executions a policy
                      collapses, so applying one would leave them empty under the default:

                      - **Inconsistent results** — cases with at least one pass *and* at least
                        one failure in the selection, each row saying whether the disagreement is
                        inside one configuration and version (instability) or across one of those
                        axes (a difference, not a flake). A case that was blocked and later passed
                        is **not** listed: nothing failed.
                      - **Version divergence** (R8) — cases the selection executed at more than
                        one version of their own text, one row per case and version, because
                        results recorded against two versions are results for two different tests
                        and one figure over both describes neither. **Wider than the callout's
                        *Across versions* rows**, which are a strict subset: a case that failed at
                        both versions disagrees with nothing and is still two tests. Each row also
                        says whether that version's results reached the report's totals, which is
                        the only part of the section the policy moves — under `ALL` every version
                        is counted and the totals genuinely average across versions, while under
                        `LATEST` one version is counted per case and the rest appear in no total
                        in the report. The header block carries the count as
                        `Cases executed at more than one version`, printed **even when it is
                        zero** so that two reports from one project line up.
                      - **Manual and automated** — a cross-tab of the case's `automationStatus`
                        as it stood when the result was recorded against the run's `source`, not
                        one column relabelled. The two disagree in both directions, and such a row
                        is a signal about the repository rather than a kind of testing.
                      - **First attempt and retries** — passed first time / passed only after a
                        retry / never passed, counted per (case, configuration, case version),
                        which is the only unit under which a retry means anything. One case can
                        appear in several groups, so these do **not** sum to the distinct-case
                        count in the headline.

                    - `coverage_matrix` (§115) — §6e's *requirement → cases → last result*, with a
                      **documentation page as its spine**: the document's own headings in order,
                      and under each the statements it makes with the cases that claim to verify
                      them and those cases' latest results. Two things about it are decisions
                      rather than details, and both change what the numbers mean:

                      - **A statement is a list item, or any block somebody has already linked.**
                        Not every block. A specification's prose is context, and marking each
                        paragraph of it "Not covered" would put a specific, alarming and usually
                        false claim on every page of the document — which is the same reason
                        `DocBlock.coverage` is absent rather than zeroed. So a page of prose alone
                        reports **no statements**, which is not the same as 0% coverage.
                      - **Only a `VERIFIES` link is coverage.** A `REFERENCES` or `DERIVED_FROM`
                        link is a relationship somebody deliberately chose *not* to state as
                        proof, and counting it would be exactly the false claim the relationship
                        field exists to prevent. A block whose only links are those reads as
                        **Not covered**.

                      A statement's own state is the pessimistic roll-up of its cases — one case
                      last failing makes the statement **Failing** however many others pass — and
                      **Not run** (covered, nothing executed) is kept distinct from **Not
                      covered** (nothing linked), because they are different problems with
                      different owners. Results are resolved **LATEST** and the policy is not a
                      parameter: this report asks whether a statement is verified *now*, and there
                      is one answer to that. `openDefects` from §6e's catalogue line is **not**
                      built — there is no defect anywhere in the product until M4 — and is named
                      as absent rather than rendered as an empty column, which would read as "no
                      defects are open".

                    **Required unless `definitionId` is sent** — which `required` cannot express
                    here without splitting the body into a `oneOf` whose two arms differ by one
                    optional field. Sending neither is a field error on `type`.
                format:
                  type: string
                  enum: [PDF, MD, HTML]
                  description: |
                    The set a person downloads. **Not the set this server can render** — the two
                    are deliberately different, and asking for one it cannot produce is a 400 at
                    request time rather than a job that goes FAILED an hour later, because a client
                    cannot tell an unsupported format from a broken server by watching a job die.

                    Today `MD` and `HTML` render (§88). `HTML` is one self-contained file — no CDN,
                    no script, charts drawn in CSS — because the reader is often a client opening an
                    attachment with no network. `PDF` needs a headless browser that is not in the
                    image and says so in the refusal. The enum is *not*
                    narrowed to what is installed: what a deployment can render is a property of
                    that deployment, and the refusal names it.
                parameters:
                  type: object
                  additionalProperties: true
                  description: |
                    What the report is computed over, stored verbatim and frozen onto the artifact
                    — `V1`'s reason, in one line: "a report you cannot reproduce is a report nobody
                    trusts" (§6e).

                    Untyped because each report takes different ones. `run_summary` takes a single
                    required `runId` (uuid), and `coverage_matrix` a single required `docPageId`
                    (uuid) — the page whose structure becomes the report's spine. It is **one
                    page and not its subtree**: a page's descendants are a different document in
                    every space this product seeds, and a scope that silently swept in three
                    sibling specifications would be wrong in the direction nobody checks.

                    `aggregate_execution` takes a **selection**, every field of it optional — a
                    request with none is the whole project, which is what "I did not narrow on
                    anything" means:

                    - `policy` — one of `LATEST` (the default), `LATEST_PER_CONFIG`, `WORST`,
                      `ALL`; the same four values, with the same meanings, that
                      `GET /plans/{planId}/statistics` takes. The report prints the policy it
                      used and prints **both** the execution count and the distinct-case count,
                      because those two are equal under `LATEST` and differ under the others,
                      and reporting one of them as "the number" inflates it.
                    - `planIds`, `configurationIds`, `featureIds` — arrays of uuid.
                      `featureIds` **unions**: a case classified under Payments *or* Refunds. The
                      intersection reading would answer nothing for the ordinary two-feature
                      request, which reads as a quiet project rather than as a misunderstanding.
                    - `suitePaths` — array of strings, matched **descendant-or-self** against the
                      suite path each result was recorded under. That path is frozen history: it
                      is what the tree said when the execution happened, so a report spanning the
                      §98 flattening matches deep paths for old runs and single labels for new
                      ones.
                    - `automationStatuses`, `sources` — arrays of strings, matched exactly.
                    - `from`, `to` — RFC 3339 instants, **half-open**: `from` inclusive, `to`
                      exclusive, so asking for August means `to` = `2026-09-01T00:00:00Z` and two
                      adjacent monthly reports neither double-count nor drop whatever landed on
                      midnight. `to` before `from` is a field error and is never swapped for you.
                      A result recorded with **no** timestamp is outside every range — that is
                      what a date range means, and the alternative puts one execution in two
                      months.

                    An **empty array is read as absent**, not as "match nothing": the other
                    reading turns `{"planIds": []}` into a clean, plausible report of nothing
                    (§99, from the SQL side).

                    With `definitionId`, this is the **override** and the saved definition is the
                    base — the stored `parameters` on the job (and therefore the artifact's
                    `filter_snapshot`) is the merged result, because what a report was computed
                    over is what has to be reproducible, not what the caller typed.
      responses:
        '202':
          description: |
            Queued. The job is PENDING and `downloadUrl` is null; poll the job to find out when it
            is not.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/reports/jobs/{jobId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/JobId' }
    get:
      tags: [reporting]
      operationId: readReportJob
      summary: Poll a generation job
      description: |
        Where a request got to. **Without this route the 202 above would hand back an id nothing
        can resolve** — the client would have no way to learn that its report was ready, or that it
        had failed and why.

        Needs `report:view`, not `report:export`: reading whether your own request finished is not
        exporting anything, and a role that may see reports but not take them away must still be
        able to watch one being made. It is that key's first consumer since `V3` seeded it in M0.

        The job is scoped by the project in the path as well as by its id, so a job id from a
        sibling project answers 404 rather than being served through a gate that was evaluated
        against a different project.
      responses:
        '200':
          description: The job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/reports/artifacts/{artifactId}/content:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/ArtifactId' }
    get:
      tags: [reporting]
      operationId: downloadReportArtifact
      summary: The report bytes
      description: |
        What `ReportJob.downloadUrl` and `ReportJob.modelUrl` point at — **without this route both
        fields would be a lie**, and a generate endpoint shipped alone would have had to invent the
        URL, with every client taking the invention for the contract (§67, verbatim).

        An ordinary session-authenticated route rather than a public link, for `downloadEvidence`'s
        reason: the filesystem adapter cannot issue an expiring signed URL, and a guessable
        permanent one would be an unauthenticated read of a customer's results.

        Needs `report:export` — this is the download, which is what that key names.

        **The project in the path is proved through the job, not through the artifact.**
        `report_artifact` carries no `project_id` (`V1` scoped it by company and definition), so
        the row that scopes it is the `report_job` naming it. That is total in the designed system;
        the day something produces an artifact without a job, this route needs a second answer.
      responses:
        '200':
          description: |
            The bytes, `attachment` — a report is a file somebody keeps, unlike evidence, which is
            served `inline` so a screenshot renders in place.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          # Also the answer when the row exists and its blob does not. Unlike evidence, that
          # orphan is not a designed outcome here: the worker writes bytes BEFORE the row, so a
          # COMPLETED job whose download 404s means the store lost the file.
          $ref: '#/components/responses/NotFound'

  # ------------------------------------------------------------ ingestion ----
  /projects/{projectId}/ingestions:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      tags: [execution]
      operationId: listIngestions
      summary: What CI has posted to this project
      description: |
        The ingestion history, newest first. **Project membership, and no permission key** — this
        is gated exactly as `GET /runs` is, because a member may read this project's runs and their
        verdicts, and a job is the record of how some of those verdicts got there. A new
        `ingestion:read` key would be one seeded to nobody.

        Reading the history is **not** confirming a mapping: the binder reads here and writes
        through `POST /automation-mappings`, which costs `case:edit`.

        **The rows are `IngestionJobSummary`, which has no `unmatched` array.** The names are not a
        column — they live inside the job's stored payload, which for a 5,000-test build is
        megabytes — so serving them here would read every blob in the project's history to render
        one screen. `GET /ingestions/{jobId}` serves them, one request away. A row carrying `[]`
        beside a count of 12 was the alternative, and it reads as "the list was cut" when the truth
        is "not served on this endpoint".
      responses:
        '200':
          description: Jobs, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IngestionJobSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [execution]
      operationId: ingestResults
      summary: Post a CI report
      description: |
        **The one endpoint in this API whose expected caller is not a browser.** A CI job posts
        the report its runner emitted; the server parses it, joins each test to a case through
        §6c's four-step ladder, opens a run and records the verdicts.

        **Two permissions, and neither is new**: `result:submit` for the results and
        `run:create` for the run, both asked exactly where they are asked for a person. Both are
        in Automation Service's five (roles spec §A6), which is what that role exists for. A
        third `results:ingest` key was refused — a key seeded to nobody is a 403 nobody can
        grant their way out of.

        **`Idempotency-Key` is REQUIRED here**, where `POST /runs` makes it optional. CI is the
        one caller that retries automatically, and its retry re-posts a whole report rather than
        one row: a replay answers **200** with the original job and writes nothing. Absent, this
        is a 400 with the field named `Idempotency-Key`.

        **The report travels as a string in `report`, not as `multipart/form-data`.** Two of the
        four dialects are XML and two are JSON, so a `Content-Type` would distinguish neither
        JUnit from TestNG nor Allure from Cucumber. `format` says which, and it is never
        inferred — sniffing would make a malformed report of one dialect read as a valid report
        of another.

        **A report that matches no case creates NO run** and answers 201 with `runId: null` and
        every test in `unmatched`. A run of zero cases would report 0 of 0, 100%, complete —
        and the report that most often matches nothing is the first one a team posts, while they
        are still deciding whether the integration works.

        **Nothing is auto-created for an unmatched test.** §6c offers a case stub; it is
        declined, because a CI job that can mint cases turns every test *rename* into a permanent
        duplicate of a case that already exists. The names come back in `unmatched` with the
        exact `normalizedName` that `POST /automation-mappings` takes, which is the supported way
        to bind them.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            Required — see above. At most 200 characters.
          schema: { type: string, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngestionInput' }
      responses:
        '201':
          description: Ingested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestionJob' }
        '200':
          description: |
            A replay of an `Idempotency-Key` already used — the original job, and no second set
            of results.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestionJob' }
        '400':
          # A malformed or unreadable report (`report`), a missing key (`Idempotency-Key`), an
          # unknown format (`format`), or a project with no result status of a kind the report
          # needs (`report`). The last is refused rather than substituted: recording a skip as a
          # failure would be a verdict nobody's runner reported.
          $ref: '#/components/responses/BadRequest'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          # The run named by `runId` has ended, so its results are frozen. Reopen it to post more.
          # A state refusal rather than the lost-update Conflict's usual sense — ExecutionService's
          # RunClosed, reached by the same rule.
          $ref: '#/components/responses/Conflict'

  /projects/{projectId}/ingestions/{jobId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: jobId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [execution]
      operationId: getIngestion
      summary: One posted report, and the tests it could not place
      description: |
        **The resource `POST /ingestions` has been naming in its `Location` header since it
        shipped** — and until this endpoint existed, that header pointed at a 404.

        Project membership, as for the list. This is what the unmatched-test binder reads: each
        name comes back with the `normalizedName` that `POST /automation-mappings` takes, and with
        the outcome that says how urgent it is — an unmatched **failure** is a red test nobody is
        being told about, where an unmatched pass is only unrecorded coverage.

        `unmatched` is capped at 50, by the same constant the post's own response uses. The names
        are re-derived from the job's stored payload rather than kept in a column; `normalizedName`
        is recomputed server-side for the reason `AutomationMappingInput.testName` gives.
      responses:
        '200':
          description: The job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestionJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          # One bodiless 404 for an unreachable project, another project's job id, and an id that
          # is nothing at all — §6t, so the endpoint is not an existence oracle.
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/automation-mappings:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      tags: [execution]
      operationId: listAutomationMappings
      summary: Learned test-name mappings
      description: |
        §6c's third ladder step — *"once a human confirms 'this test name means this case', the
        mapping survives renames of everything except the test itself"*. `case:read`.
      responses:
        '200':
          description: Mappings, by test name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AutomationMapping' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [execution]
      operationId: confirmAutomationMapping
      summary: Confirm that a test name means a case
      description: |
        **`case:edit`, and Automation Service deliberately does not hold it.** Confirming a
        mapping is the same statement as writing the case's `automationKey`: it decides where
        that test's results land. So a leaked CI token can post results and **cannot re-point
        where anybody's results land** — without the split it could bind every failing test to a
        throwaway case and launder a red suite into a green one.

        **200, not 201, and re-confirming MOVES the row.** The key is
        `(company_id, normalized_test_name)`, so a second post of the same name is the same
        resource re-pointed rather than a new one. A 409 would make correcting a mis-binding a
        delete-then-create, with a window in the middle during which the CI job silently stops
        matching.

        `testName` is sent **raw** and normalized server-side. The client must not normalize:
        the rule has to agree exactly with the one the parser applies, and a second
        implementation of it is how every mapping silently stops matching.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AutomationMappingInput' }
      responses:
        '200':
          description: Confirmed — created, or re-pointed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutomationMapping' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/automation-mappings/{mappingId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: mappingId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [execution]
      operationId: deleteAutomationMapping
      summary: Remove a mapping
      description: |
        `case:edit`. 204 whether the mapping was there or not — delete is idempotent.
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --------------------------------------------------------------- admin ----
  /users:
    get:
      tags: [admin]
      summary: Users
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [admin]
      summary: Invite a person into this company
      description: |
        The way a colleague gets into the company at all. Until this endpoint existed, the only
        account a provisioned company had was the Company Admin the operator CLI created, and a
        second person could be added **only by hand-written SQL** — which is what every fixture
        in the suite had to do (handoff §54).

        Gated on **`company:members`** at COMPANY scope — Company Admin and Instance Admin only.
        That permission is defined as "invite, remove, set membership display names" (roles spec
        §A3), so this is the read of it the catalogue always intended.

        The person is created as an **`INVITED` membership** and receives an activation link,
        the same `POST /auth/invitations/{token}/accept` flow the CLI's first admin uses.
        Membership conveys authentication and **zero project visibility** (roles spec §A1), so
        an invited colleague signs in to an empty project list until somebody grants them a role
        with `POST /role-assignments`. That is two deliberate steps, not an oversight.

        **The response cannot be used to discover whether an address already has an account on
        this instance.** `app_user` is instance-level and its email is unique instance-wide, so
        one person may belong to several companies (§6s). Inviting an address that already has
        an account reuses it and answers **exactly as inviting a brand-new address does** — same
        status, same body shape, same `displayName` (the one the inviter typed, per §6u; never
        the account's own name, which belongs to another client). Without that, this endpoint
        would be a membership oracle for every other company on the instance.

        **Re-inviting is idempotent and carries no `Idempotency-Key`.** The identity of the
        request is the email address, so a retry finds the membership it already created:

        - a membership that is already `ACTIVE` → `200` with that person, nothing sent;
        - an outstanding, unexpired invitation → `200`, and the existing link is **left alone**
          rather than replaced, because a fresh token would invalidate the one already in the
          invitee's inbox;
        - no membership, or one whose invitation has lapsed → `201` and a new link.

        `emailed` is `false` when the instance has **no SMTP relay configured**. The invitation
        is still valid — an operator must carry the link across by hand, exactly as they do for
        `provision-company` — and saying so is what stops the invitee from waiting for a message
        that is never coming.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserInvitationInput' }
      responses:
        '200':
          description: |
            Already a member, or an unexpired invitation was already outstanding. Nothing sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserInvitation' }
        '201':
          description: Invited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserInvitation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users/{userId}:
    # No query parameters on the path item, per §50.
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [admin]
      summary: Remove a person from this company
      description: |
        Offboarding — the second third of **`company:members`** ("invite, remove, set membership
        display names", roles spec §A3), gated exactly as `POST /users` is: COMPANY scope, so
        Company Admin and Instance Admin only.

        **It removes the membership, not the account.** `app_user` is instance-level and one
        person may belong to several client companies (§6s), so deleting the account would offboard
        them from every other client on the instance — and would orphan the authorship this
        company's own history depends on. The membership goes to `REMOVED`, which zeroes their
        permissions here (`CompanyMembership`: membership is a precondition, so every grant they
        hold in this company becomes inert without being deleted). They disappear from `GET /users`
        immediately.

        **Their session is revoked, not left to expire.** A signed token stays valid until it
        lapses, so without this the person keeps an authenticated session inside the company they
        were just removed from — for hours. The `pv` epoch bump signs them out on their next
        request. It is account-wide, so it signs them out of their *other* companies too; they
        sign in again and nothing there has changed.

        **Any outstanding invitation is cancelled.** Removing somebody who has not accepted yet
        must not leave a live activation link behind — a later re-invite would find it outstanding,
        report that a link is already on its way, and re-admit them on a token minted before the
        offboarding.

        **A caller may not remove themselves** — `400` keyed on `userId`. It is also what keeps a
        company administrable without counting administrators: the only person who can run this
        endpoint is one who holds `company:members`, and they cannot be the one who leaves.

        **`204` whether they were a member or not.** A repeated request, a double-click and an id
        that names nobody here all end in the state the caller asked for — and a member of another
        company is *also* not here, so isolation and idempotence give the same answer (§6t).

        **Re-inviting them later restores their previous project access**, because their grants
        were made inert rather than deleted. That follows from the model rather than from this
        endpoint, and it surprises people at an admin screen.
      responses:
        '204': { description: Removed, or was not a member here }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api-tokens:
    get:
      tags: [admin]
      summary: This company's API and CI tokens
      description: |
        Gated on **`token:issue`** at COMPANY scope — Company Admin and Instance Admin only, per
        roles spec §A3 ("API / CI tokens"). This is that permission's first consumer: it has been
        seeded and granted since `V3` with nothing ever asking it.

        **The list is refused rather than filtered** for a caller who does not hold it, unlike
        `GET /role-assignments`. There is no partial-visibility story for a credential — a token
        belongs to the company rather than to a project — so an empty array would be a claim
        that this company has no tokens, told to somebody who may simply not ask.

        **Revoked tokens stay in the list**, carrying `revokedAt`. A credential that was live in
        a pipeline yesterday is evidence, and dropping the row reads as though it never existed.

        The secret is **not here and cannot be recovered**. `tokenPrefix` — the first 12
        characters — is what identifies a row against a CI configuration.
      responses:
        '200':
          description: The company's tokens, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApiToken' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      summary: Issue an API token
      description: |
        Mints a non-human credential — **the way a CI job reaches this instance**, and the
        precondition for everything else in M3. `test_execution.executed_by_token` and
        `audit_event.actor_token_id` have been columns since `V1` with nothing able to fill them.

        **The secret is in this response and nowhere else, ever.** Only its SHA-256 is stored.
        A caller who loses it revokes the token and issues another; there is no recovery path
        and adding one would mean storing the credential.

        **A token carries a ROLE, never the rights of the person who issued it.** `roleId` is
        the grant; Automation Service is the intended answer and roles spec §A6 states what that
        costs an attacker who steals one ("can post results and add quarantine stubs; cannot
        edit or delete a real case, close a run, or read reports"). The server does not require
        that particular role — code checks permissions, never role names.

        **The effective permission set is the intersection of the role and the owner's own
        grants**, so a token can never exceed either, and demoting the issuer shrinks the tokens
        they issued. `projectId`, when present, is a hard scope: the token is inert everywhere
        else.

        **There is no `ownerId` field.** The owner is the caller. A nominated owner would be a
        way to mint a credential more powerful than yourself by naming somebody more powerful —
        the exact escalation the intersection exists to prevent.

        SYSTEM-scope roles are refused (`400` on `roleId`): those grants live in
        `instance_role_assignment` and a company-bound credential carrying one would be a tier
        the model does not have.

        `expiresAt` may be omitted, and that is deliberate: a credential that dies mid-release
        without anybody deciding to withdraw it is an outage. The withdrawal that *is* a
        decision is `DELETE`.

        **Except for `Agent`, where it is required** (`400` on `expiresAt`). An agent token
        lives on somebody's machine rather than in a pipeline, so the failure the paragraph
        above avoids is not the one that happens — the one that happens is that nobody revokes
        it because nobody remembers it. This is the only per-role rule in this operation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiTokenInput' }
      responses:
        '201':
          description: Issued. The only response in this API carrying a secret.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedApiToken' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: |
            `projectId` names a project that does not exist, or that this session cannot reach.
            One status for both, per §6t — the response must not be usable as an oracle.

  /api-tokens/{tokenId}:
    # No query parameters on the path item, per §50.
    parameters:
      - name: tokenId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [admin]
      summary: Revoke an API token
      description: |
        Withdraws the credential. Gated on **`token:issue`**, the same permission that issued it.

        **Idempotent, and the first revocation is the one that counts.** Revoking an
        already-revoked token answers `204` and does *not* move `revokedAt` — the trail must
        report when the token stopped working, not when somebody clicked a second time.

        The row is **kept**, revoked. Deleting it would remove the evidence and orphan every
        `executed_by_token` reference pointing at it.
      responses:
        '204': { description: Revoked, or already revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No such token in this company }

  /teams:
    get:
      tags: [admin]
      summary: Teams, with parent links for the org chart
      responses:
        '200':
          description: Teams
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Team' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [admin]
      summary: Create a team
      description: |
        **The org chart's first writer.** `team` has been in the schema from the beginning with
        readers (`GET /teams`, the org chart, a grant's subject column) and no writer anywhere:
        `provision-company` seeds no team, so every real company's org chart was empty and stayed
        empty, and `POST /role-assignments`' team branch — validated, tested, documented — could
        never be reached with a real `teamId`.

        Gated on **`company:teams`** at COMPANY scope (roles spec §A3: "teams, nesting, leads,
        org-chart structure"), so Company Admin and Instance Admin only. This is that permission's
        first consumer: it has been seeded and correctly granted since M0 and never once asked.

        **A team confers nothing until it is granted something.** Creating one is org-chart
        structure, not access — it is `POST /role-assignments` naming the team that gives it reach.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamInput' }
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: The new team's URL.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /teams/{teamId}:
    # No query parameters on the path item, per §50.
    parameters:
      - name: teamId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [admin]
      summary: Rename, re-describe or move a team
      description: |
        **PUT rather than PATCH, for `parentTeamId` — the same reason
        `PUT /projects/{projectId}/classification/values/{valueId}` gives.** A record deserialized
        from JSON reads an absent field and an explicit `null` identically, so under PATCH one of
        "leave the parent alone" and "make this a root team" would be unreachable. A body carrying
        every editable field has no such ambiguity.

        **Unlike a classification value, a team may actually be moved, and the difference is the
        point.** Reparenting a classification value rewrites the subtree that authored cases are
        classified by, so it is refused; a team's parent edge is **org-chart structure and never a
        permission edge** — grants do not cascade through it (plan §6k) — so moving a team changes
        a picture and confers nothing on anybody. The field that had to be refused there is the
        field this endpoint exists for.

        A `parentTeamId` that would create a **cycle**, that names the team itself, or that names
        no team in this company is a field error on `parentTeamId`. A database trigger enforces the
        same three rules as a backstop; it raises SQL states, which are not a product answer.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [admin]
      summary: Delete a team
      description: |
        A **hard** delete — a team carries no authored content of its own, so there is nothing for a
        soft delete to preserve. Its memberships go with it.

        **A team that holds grants is refused, 409**, naming the count. `role_assignment.team_id`
        is `ON DELETE CASCADE`, so deleting the team would silently revoke every grant made through
        it — and those grants are the entire reason a team is a grant subject. Mass-revoking access
        as a side effect of tidying the org chart is precisely the write an administrator must make
        deliberately: revoke the grants, then delete the team. Same shape as the refusal of a
        classification value with live children.

        **A team with child teams is refused, 409** for the same reason in the other direction:
        `parent_team_id` has no cascade, so the alternative to refusing is either a foreign-key
        error or silently promoting somebody else's sub-teams to the root.

        **A team with members is not refused.** Membership confers nothing on its own — see
        `POST /teams` — so there is nothing to revoke and nothing to warn about.
      responses:
        '204':
          description: Deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The team still holds grants, or still has child teams. `Problem.errors` carries
            `grants` and/or `children` with the counts, so the SPA can say what to clear first
            rather than "it is in use".
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /teams/{teamId}/members/{userId}:
    # No query parameters on the path item, per §50.
    parameters:
      - name: teamId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [admin]
      summary: Put a person in a team, or change whether they lead it
      description: |
        Idempotent by construction, which is why it is a PUT on the membership's own URL rather
        than a POST to a collection: "this person is in this team, leading it or not" is a state,
        and repeating the request is the same state.

        **The person must be a member of this company**, `ACTIVE` or `INVITED`. That check is the
        substance of this endpoint. `team_membership.user_id` references `app_user`, which is
        **instance-level with no RLS**, while `company_id` is taken from the session — so a *sibling
        company's* user id satisfies the foreign key, the company column, the RLS policy and every
        constraint on the table, and the row is stored. After that the permission evaluator, which
        resolves a user's teams through `team_membership` alone and never joins
        `company_membership`, hands them this team's grants — while the org chart renders them
        **nowhere**, because the directory resolves names through company membership and drops an
        id it cannot place. An invisible grant is worse than a leaked name. A `userId` who is not a
        member here is therefore a **404**, not a field error: the caller may not use this endpoint
        to learn who exists on the instance.

        A `REMOVED` membership is refused the same way — re-inviting them is what makes them
        staffable again, and it deliberately restores the access they had.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamMemberInput' }
      responses:
        '200':
          description: The team, with its membership as it now stands
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [admin]
      summary: Take a person out of a team
      description: |
        `204` whether they were in it or not, for the reason `DELETE /role-assignments/{id}` gives:
        a repeated request, a double-click and an id that names nobody here all end in the state
        the caller asked for.

        **This revokes whatever the team conferred on them**, immediately — the evaluator reads
        team membership on every request and no token carries grant claims. Unlike removing a
        person from the company, their session is *not* revoked: their permissions are re-resolved
        from the database on their next request anyway, and signing somebody out for an org-chart
        change they may not even be affected by is a cost with nothing behind it.
      responses:
        '204':
          description: Removed, or was not in this team
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /roles:
    get:
      tags: [admin]
      summary: Roles and their permissions
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /role-assignments:
    get:
      tags: [admin]
      summary: Role grants to users and teams
      parameters:
        - name: projectId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Assignments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RoleAssignment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [admin]
      summary: Grant a role to a user or a team
      description: |
        The only way a company member gains sight of a project. Company membership grants
        authentication and **zero project visibility** (roles spec §A1), so without this
        endpoint a provisioned company has exactly one usable account — the Company Admin
        the CLI created — and every colleague signs in to an empty project list.

        **The gate depends on the scope of the grant being made, not on one permission:**

        - `projectId` present → a PROJECT-scope grant, gated on **`project:members` on that
          project**. A Test Lead staffs their own project without being able to staff another.
        - `projectId` null → a COMPANY-scope grant, gated on **`company:members`**, which only
          Company Admin and Instance Admin hold. This is the same shape as `project:create`
          (§6 of that endpoint's description): a grant that spans every project cannot be
          authorised by a permission held on one project.

        Exactly one of `userId` and `teamId` is supplied; both or neither is a `400` keyed on
        `userId`. A role whose own `scope` disagrees with the grant being made — a COMPANY-scope
        role pinned to one project, or the reverse — is a `400` keyed on `roleId` rather than a
        silent coercion, because the two mean materially different access.

        **Re-granting an identical assignment returns the existing one with `200`**, not a
        duplicate and not a `409`. The caller's intent is "this person holds this role here",
        which is already true; a second row would give the same user two grants to revoke.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleAssignmentInput' }
      responses:
        '200':
          description: The grant already existed and is returned unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleAssignment' }
        '201':
          description: Granted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleAssignment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /role-assignments/{assignmentId}:
    parameters:
      - name: assignmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [admin]
      summary: Revoke a grant
      description: |
        Gated exactly as the grant was: `project:members` on the assignment's project for a
        PROJECT-scope grant, `company:members` for a COMPANY-scope one.

        **Revoking a grant that does not exist is a `204`**, so a double-click and a retried
        request both end in the state the caller asked for.

        A caller may not revoke the grant that is carrying their own ability to revoke —
        removing your own last `company:members` grant is a `400` keyed on `assignmentId`,
        because the alternative is a company with no administrator and no way back in
        without the operator CLI.
      responses:
        '204': { description: Revoked }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- work ----
  /work-items:
    # No parameters block on the path item, per §50: query parameters written here are
    # inherited by every operation beneath, so the board's filters would land on the POST.
    get:
      tags: [work]
      summary: Kanban board contents
      description: |
        Returns real tasks AND derived items in one list. Derived items carry
        sourceType/sourceId and are NOT stored — their status is computed from the
        source on every read, so a card can never diverge from its execution (plan §6l).

        **Four of §6l's generators are implemented.** `EXECUTION` cards come from
        assigned, unrecorded executions in live runs; `CASE_MAINTENANCE` cards come from
        `case_health`; `REVIEW` cards come from outstanding review requests (§81);
        `QUARANTINE` cards come from `case_flake`'s authored half (§121). `DOC_UPDATE` and
        `DEFECT` require features nothing computes or writes yet and are absent rather than
        empty — the `kind` enum keeps them so the SPA's labels stay complete.

        **With no `projectId` this is §6l's personal "My Work" board (§83)** — every card
        assigned to the caller across every project they can see, in one company. It is
        the same operation because it is the same list; a card carries `projectId` and
        `projectKey`, which is how the SPA groups an aggregate it did not have before.

        **With a `teamId` this is §6l's team board (§84)** — the same list kept for the
        team's members instead of for the caller. All three of §6l's boards are this one
        operation, because they differ only in which cards are kept: `projectId` narrows
        *where*, `teamId` and `mine` narrow *whose*, and the response shape and sort are
        identical in every case.

        **A team board is bounded by the CALLER's project visibility, never by the team's.**
        Two people asking for the same team's board can legitimately receive different
        boards. That is the design, not a defect: a board built from "everything assigned
        to this team" would render the case keys, titles and project names of every project
        any member was granted, to a reader granted none of them.
      parameters:
        # projectId is OPTIONAL since §83, and its absence is a DIFFERENT BOARD rather than
        # an unfiltered one — see the 400. It was declared required until then, deliberately,
        # because an optional parameter promising an aggregation no handler performed is
        # §50's defect in its worse direction. The aggregation now exists.
        - name: projectId
          in: query
          required: false
          schema: { type: string, format: uuid }
        # teamId arrives in §84, and it needed no migration, no table and no permission key —
        # the gate is the project visibility the caller already had, and every card it can
        # return is one they could already see on a project board. A key invented for it would
        # be seeded to nobody and so a 403 no administrator could grant their way out of
        # (§67/§79/§80).
        - name: teamId
          in: query
          description: |
            §6l's **team board** — items assigned to any member of this team.

            Membership is expanded **on every read**, never stored: somebody who joins the
            team today finds the team's work today, and somebody who leaves stops seeing it.
            Direct members only — a parent team does not inherit its children's members.

            **Bounded by the caller's own project visibility.** Cards from projects the
            caller holds no grant on are absent, whatever the team was assigned.

            **Combinable with `projectId`** (the team's work within one project — §6l's
            "swimlanes by member"), and **refused together with `mine=true`**: they select
            two different boards.
          required: false
          schema: { type: string, format: uuid }
        - name: mine
          in: query
          description: |
            Restrict to items assigned to the caller — the personal board.

            **Required when `projectId` is omitted** and no `teamId` is given. §6l's
            cross-project board is the *personal* one; there is no board that is every
            project's work unfiltered, and silently forcing this on would answer a request
            nobody made with a list the client cannot tell apart from a company that only
            has the caller's work in it.
          schema: { type: boolean }
      responses:
        '200':
          description: |
            Work items. **An empty array is a reachable board with nothing on it** — for a
            team board that means either a team with no members or members with no work the
            caller can see, and the two are deliberately indistinguishable on the wire: both
            are "this team has nothing for you", and a client able to tell them apart would
            be reading team membership out of a board.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WorkItem' }
        '400':
          # Two shapes, one status, and both are refusals to GUESS which board was meant:
          #  - neither a project nor a person: no projectId, no teamId, mine=false;
          #  - two boards at once: teamId together with mine=true.
          # Not a 404 — nothing failed to resolve, and the caller may make any of the requests
          # the message names. The personal board itself never 404s: it names nothing that
          # could be missing, and a member with no grants at all gets an empty array.
          $ref: '#/components/responses/BadRequest'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          # Two gates, one answer. The project read gate: an absent project, one in another
          # company, and one in this company the caller holds no grant on are indistinguishable
          # — and distinct from a 200 with an empty array, which means the board is reachable
          # and has nothing on it. And the team: an absent teamId and one belonging to another
          # company are the same 404, or this operation becomes a company-wide team-existence
          # oracle answerable by anybody with a session and a guessed UUID (§6t).
          $ref: '#/components/responses/NotFound'
    post:
      tags: [work]
      summary: Create a task
      description: |
        `workitem:manage` — Instance Admin, Company Admin, Test Lead and Test Engineer
        (roles spec §A6). Viewer and Automation Service do not hold it.

        **`kind` is not a field on the request.** Every row this creates is a `TASK`.
        A client able to POST `kind: EXECUTION` could materialise a derived item, which
        is the one thing §6l's design exists to prevent: the moment a card's status is
        stored separately from its execution's, the two diverge and the board stops being
        trusted. Derived items have no create endpoint because they are not stored.
      # Idempotency-Key arrives in §54, TOGETHER WITH THE COLUMN THAT HONOURS IT (V17) —
      # which is the whole point of how it was left. §53 refused to declare it while
      # `work_item` had no created_idempotency_key column, because that is §50's defect in
      # its worse direction: the header would sit in the reviewed spec, in schema.d.ts and
      # in autocomplete while the server ignored it, so a client would believe its retries
      # were deduplicated when every one of them created another card. The scope here is
      # (company_id, project_id, key) as it is everywhere else — and the project comes from
      # the BODY on this operation rather than from a path segment, which changes nothing
      # about the constraint and everything about where the handler reads it from.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkItemInput' }
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
              description: The new work item's canonical URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkItem' }
        '200':
          description: |
            **A replay.** The `Idempotency-Key` had already created this task, so nothing was
            created by this request — which is why it is not a 201 and carries no `Location`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /work-items/{workItemId}:
    parameters:
      - name: workItemId
        in: path
        required: true
        description: |
          A stored task's UUID. Derived items carry a synthetic, non-UUID id
          (`execution:{uuid}`), which is deliberately not addressable here — see the 409.
        schema: { type: string }
    patch:
      tags: [work]
      summary: Move a card to another column
      description: |
        `workitem:manage`. The only mutable field is `status`, because the board is the
        only screen that writes here; editing a task's title or due date is a separate
        slice with no affordance yet.

        **A derived item's id is refused with a `409`, not a `404`.** The card exists and
        the caller can see it; what is impossible is *storing* a status for it. Answering
        404 would read as "that card is gone" and invite a reload that brings it straight
        back. The message names the action that does work — move the execution.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkItemStatusUpdate' }
      responses:
        '200':
          description: Moved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            This card mirrors a source and its status is not stored. Also the answer when
            the requested column is not in the card's `allowedTransitions`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

# =============================================================================
# COMPONENTS
# =============================================================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      description: |
        An `attachment` row's id. Scoped by its owner as well as by its id everywhere it is
        used — the two-segment gate — so a caller cannot reach another owner's file by
        guessing this one.
      schema: { type: string, format: uuid }
    CaseId:
      name: caseId
      in: path
      required: true
      description: |
        UUID only. Display keys (TC-1) are deliberately NOT accepted here: they are
        sequential per company and therefore trivially guessable, so allowing one as a
        path identifier hands out an enumeration oracle (plan §6t). Resolve a key the
        user typed or pasted through the search endpoint, which returns not-found —
        never forbidden — for a key in a project the caller cannot reach.
      schema: { type: string, format: uuid }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExecutionId:
      name: executionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DefinitionId:
      name: definitionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, default: 50, maximum: 200 }
    IfMatch:
      name: If-Match
      in: header
      description: |
        The `lockVersion` the client read, as a decimal string. Mismatch yields 409.

        **The precondition travels in the header, never in the body.** A PATCH body states the
        desired state; the version the client happened to read is an assertion about the state it
        started from, and mixing the two means a field on the input schema that must never be
        persisted. Omitting the header skips the check — a last-write-wins save, which is correct
        for a caller that genuinely has no prior read (an importer) and wrong for an editor, so
        the SPA always sends it.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        A key identifying one **user intent**, not one attempt. A create carrying a key that has
        already succeeded answers **200** with the case that intent created, instead of creating a
        second one — so pressing Save again after a timeout is safe.

        The client generates it once per intent (the SPA does so when the editor mounts) and reuses
        it across retries. A key generated per attempt is the mistake that makes the header look
        right and do nothing.

        Scoped to the project the request is addressed to, which is the scope the uniqueness
        constraint behind it uses. Optional: omitted, every call creates. At most 200 characters.
      schema: { type: string, maxLength: 200 }

  responses:
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    BadRequest:
      description: |
        The request was understood and will not be stored. `Problem.errors` is keyed by the field
        name **as spelled on the input schema**, so a form can land each message on the input that
        caused it.

        Two things arrive as a 400 that a reader might expect elsewhere. A value that is legal in
        isolation but not offered by this project — a `suiteId` from another project — is a field
        error rather than a 404, because the target resolved fine and the picker is where the message
        belongs. And a field the endpoint does not yet implement is **refused rather than ignored**:
        accepting it would be a save that reports success and discards what the user typed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: |
        Authenticated, and the target is one the caller may READ, but the action needs a
        permission they do not hold.

        This does not weaken the 404-not-403 rule (§6t): that rule conceals whether an id names
        anything real from a caller who cannot see it, and it still governs every read and every
        unreachable target. Once a caller has passed the read gate they already know the thing
        exists, so answering 404 on the write would conceal nothing and would instead tell an
        editor their case had vanished. An unreachable project or case stays 404 here too — 403
        is reached only after the read gate has passed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Concurrent modification — reload and retry
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:

    # ------------------------------------------------------------ common ---
    Problem:
      type: object
      # `errors` is the one optional member: `ApiProblem` is serialized NON_NULL, so a 404 or a
      # 409 omits the key entirely rather than sending an empty object a client could read as
      # "no fields were wrong". The other four are on every problem this API emits.
      required: [type, title, status, detail]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: object
          nullable: true
          description: |
            RFC-7807 `errors` — field name to the messages that field failed on, present only on a
            validation rejection. The key is the field's name **as it appears on the input schema**
            (`gherkinSource`, not `gherkin_source` or `caseInput.gherkinSource`), because the SPA
            maps it straight onto a form input: a key that does not match a field name lands the
            message nowhere and the form reports a failure with nothing highlighted.

            Undeclared until 2026-07-31 while both sides already implemented it — the client has
            read `body.errors` since Phase 1 and the mock has emitted it since. Documented here so
            the first real write agrees with the contract rather than with the mock.
          additionalProperties:
            type: array
            items: { type: string }

    PageMeta:
      type: object
      # Every list endpoint sends all three on every response, including an empty page — which is
      # the case that matters, since `total: 0` is what tells a grid to render "no results" rather
      # than to keep its spinner up.
      required: [page, size, total]
      properties:
        page: { type: integer }
        size: { type: integer }
        total: { type: integer }

    Facet:
      description: Returned alongside results so filter counts render without a second request.
      type: object
      required: [key, label, values]
      properties:
        key: { type: string, example: automationStatus }
        label: { type: string }
        values:
          type: array
          items:
            type: object
            # `required` does not descend into `items` — without this the facet chips could not
            # read their own label or count without a null check on values the server always sends.
            required: [id, label, count]
            properties:
              id: { type: string }
              label: { type: string }
              count: { type: integer }

    UserRef:
      type: object
      required: [id, displayName, email]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: string }
        avatarUrl: { type: string, nullable: true }

    # ------------------------------------------------------------- review ---
    Review:
      type: object
      # Every field a panel needs to render the record without a second call. `participations`
      # is required and may be empty: a review nobody has commented on yet is an ordinary
      # state, and an absent array would make "no verdicts" indistinguishable from "the server
      # did not send them" (§48's rule about required arrays).
      required:
        [id, subjectType, subjectId, subjectVersionNo, state, createdAt, assignees,
         participations, comments]
      properties:
        id: { type: string, format: uuid }
        subjectType: { $ref: '#/components/schemas/ReviewSubjectType' }
        subjectId: { type: string, format: uuid }
        subjectVersionNo:
          type: integer
          description: |
            The version submitted, pinned once. Compare it against the artifact's current
            version to show that the content has moved on since the reviewer was asked.
        state: { $ref: '#/components/schemas/ReviewState' }
        submittedBy:
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
          description: |
            Null when the account no longer resolves — somebody offboarded since. Nullable
            rather than omitted, because a verdict that was recorded stays recorded and the
            absence is the honest answer (§66).
        createdAt: { type: string, format: date-time }
        approvedBy:
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
        approvedAt: { type: string, format: date-time, nullable: true }
        assignees:
          type: array
          description: |
            §6g's reviewer assignment — who was **asked**, oldest request first. Distinct from
            `participations`, which is who *spoke*: a name in one and not the other is a review
            nobody has got to, which is the comparison a lead reads this panel for. Required and
            may be empty, for the reason `participations` is.
          items: { $ref: '#/components/schemas/ReviewAssignee' }
        participations:
          type: array
          items: { $ref: '#/components/schemas/ReviewParticipation' }
        comments:
          type: array
          description: |
            §6g's threads — **roots only**, each carrying its own replies. Required and may be
            empty, for the reason `participations` is: an absent array would make "nobody has
            commented" indistinguishable from "the server did not send them".
          items: { $ref: '#/components/schemas/ReviewComment' }

    ReviewAssignee:
      type: object
      # `id` is THIS REQUEST's id — what DELETE addresses — and not the assignee's. One person
      # may be asked to review several artifacts, so an assignee-keyed delete would have to send
      # the review id too and could still name a pairing that never existed.
      #
      # Exactly one of `user` and `team` is non-null on a well-formed row (the table's
      # num_nonnulls check). A flattened (kind, id, name) triple was refused: the two carry
      # different affordances — a person's row can say "that's you", a team's cannot — and
      # collapsing them makes the client re-derive from a string which it is holding.
      required: [id, assignedAt]
      properties:
        id: { type: string, format: uuid }
        user:
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
          description: |
            The person asked, or null when `team` names a team instead. Also null — with `team`
            null too — for a request whose account no longer resolves, which the client renders
            as a request nobody can action rather than dropping (§66).
        team:
          allOf: [{ $ref: '#/components/schemas/TeamRef' }]
          nullable: true
          description: |
            The team asked. §6g: *"any member of the team can action it"* — and the members are
            deliberately **not** expanded here. A panel that listed them would freeze the
            membership as it was when the page loaded and invite the reader to treat it as the
            list of people who owe a review.
        assignedBy:
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
          description: Null for an unattributable request, as every actor field here may be (§66).
        assignedAt: { type: string, format: date-time }

    TeamRef:
      type: object
      # Deliberately smaller than `Team`, which carries leads, members and the projects the
      # team's grants reach — the last of those filtered by what the CALLER may see, so serving
      # it from a review panel would mean the review record reasoning about an org-chart
      # disclosure rule.
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    ReviewAssignmentInput:
      type: object
      # Two nullable fields with an exactly-one rule, the shape `RoleAssignmentInput` already
      # uses for the identical "a user or a team" question. A (kind, id) pair would need its own
      # enum, its own parse failure, and its own error for "kind says TEAM and the id names a
      # person" — all to express what two typed fields express by existing.
      #
      # BOTH are `required` and both are nullable, which reads oddly until the alternative is
      # written out. Leaving them optional says "sometimes absent", and the server cannot tell an
      # absent field from an explicit null — so "ask this person, nobody else" would be expressible
      # only by omission, and a client that dropped a field by accident would be indistinguishable
      # from one making a choice. `RoleAssignmentInput.projectId` is required-and-nullable for
      # exactly this reason one module over. Required also makes the exactly-one rule legible in the
      # generated type: the caller states both terms, and one of them is null.
      #
      # Sending neither and sending both are both field errors, reported on `userId` with one
      # sentence, because the field a client fixes is the same either way.
      required: [userId, teamId]
      properties:
        userId:
          type: string
          format: uuid
          nullable: true
          description: |
            One person, who must be able to **see this project** — not merely be a member of the
            company. A colleague with no grant here cannot open the artifact, so asking them
            produces a request that sits on their list for ever; the bar is the same
            `project:read` question the gate asks of the caller, so the set of people who can be
            asked is exactly the set the picker lists.

            **The submitter is refused.** Their own peer review does not count towards
            `requiredPeerReviews` — the server already skips it, on the ground that a review by
            the person who asked for it is not a second opinion — so the request could never be
            discharged. This is who *submitted* it, not who wrote the artifact: on a case written
            by an engineer and put forward by their lead, the engineer is a fine reviewer.
        teamId:
          type: string
          format: uuid
          nullable: true
          description: One team in this company, any member of which may action the request (§6g).

    ReviewComment:
      type: object
      # `replies` is required and always present, exactly one level deep: a reply's own
      # `replies` is always empty, and the server refuses a reply to a reply. Nesting is the
      # contract's job rather than every client's — assembling roots from a flat parentId list
      # is one rule, and §68's buildValueTree found two implementations of one such rule
      # disagreeing about orphans.
      required: [id, body, createdAt, replies]
      properties:
        id: { type: string, format: uuid }
        author:
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
          description: Null when the account no longer resolves — `ReviewParticipation.user`'s rule.
        body: { type: string }
        createdAt: { type: string, format: date-time }
        resolvedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Null while the thread is open, and **always null on a reply**: resolution is a
            property of the thread, so half a conversation cannot be marked dealt with.
        resolvedBy:
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
          description: |
            Who marked it dealt with — `V24`'s column. `V1` gave the table a `resolved_at` and
            no actor, which is enough to grey a thread out and not enough for the one thing the
            record exists for: proving to an auditor who did what.
        replies:
          type: array
          items: { $ref: '#/components/schemas/ReviewComment' }

    ReviewCommentInput:
      type: object
      required: [body]
      properties:
        body:
          type: string
          maxLength: 5000
          description: |
            The remark. Blank is a field error rather than a silently-dropped write: answering
            201 to one would put an empty entry in the trail.
        parentId:
          type: string
          format: uuid
          nullable: true
          description: |
            The thread root this replies to, or absent to start a thread. Validated against
            *this review's* comments — a comment on another review, and a reply to a reply, are
            both field errors carrying the same sentence, because telling them apart tells a
            caller that the id they guessed names a real comment somewhere they cannot see.

    ReviewCommentResolutionInput:
      type: object
      required: [resolved]
      properties:
        resolved:
          type: boolean
          description: |
            Required. Null is a field error rather than "leave it alone" — a body that names no
            state has not asked for anything.

    ReviewParticipation:
      type: object
      required: [id, kind, verdict, createdAt]
      properties:
        id: { type: string, format: uuid }
        user:
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
        kind:
          type: string
          enum: [PEER_REVIEW, APPROVAL]
          description: |
            `PEER_REVIEW` is advisory and moves nothing. `APPROVAL` rows are written by the
            server when the artifact's own ladder ends the review, and can never be created
            through the participations endpoint.
        verdict: { $ref: '#/components/schemas/ReviewVerdict' }
        comment: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    ReviewParticipationInput:
      type: object
      required: [verdict]
      properties:
        verdict:
          type: string
          enum: [LGTM, CHANGES_REQUESTED]
          description: |
            The two advisory verdicts, and deliberately a narrower set than `ReviewVerdict`:
            `APPROVED` and `REJECTED` end a review and belong to the artifact's status ladder.
        comment: { type: string, nullable: true }

    ReviewSubjectType:
      type: string
      enum: [CASE, SUITE, PLAN]

    ReviewState:
      type: string
      # WITHDRAWN is V22's addition and the distinction it makes is the point: the submitter
      # taking their own submission back is not a rejection, and writing one into the record a
      # team keeps to show who said what would name a reviewer who never spoke.
      enum: [IN_REVIEW, APPROVED, REJECTED, WITHDRAWN]

    ReviewVerdict:
      type: string
      enum: [LGTM, CHANGES_REQUESTED, REJECTED, APPROVED]

    EditAfterApproval:
      type: string
      # Plan §6g: "Recommend Retain + stale marker as the default, and Re-review as the opt-in
      # for teams that need it. Forcing full re-approval on a typo fix is how review processes
      # get abandoned." RETAIN is what the product has always done without it being a choice.
      enum: [RETAIN, RE_REVIEW]

    ProjectSettings:
      type: object
      description: |
        One project's §6g policy. **Flat rather than a nested `settings` object**, because a
        contract's `required` array does not descend into an inline nested object — every
        property under one comes out optional and no consumer can rely on it.
      required:
        - projectId
        - reviewEnabledCase
        - reviewEnabledSuite
        - reviewEnabledPlan
        - requiredPeerReviews
        - authorMayApproveOwnWork
        - editAfterApproval
        - requireApprovedCaseForRun
      properties:
        projectId: { type: string, format: uuid }
        reviewEnabledCase:
          type: boolean
          description: |
            §6g's opt-in for cases. **Off by default.** When false the reviewer apparatus does
            not exist for cases in this project — no review is opened, no peer verdict can be
            recorded, and the client renders no panel. The **status ladder is unaffected**:
            turning review off must not withdraw `IN_REVIEW` and `APPROVED` from a four-value
            status the team has used since M1.
        reviewEnabledSuite: { type: boolean, description: §6g's opt-in for suites. Off by default. }
        reviewEnabledPlan: { type: boolean, description: §6g's opt-in for plans. Off by default. }
        requiredPeerReviews:
          type: integer
          minimum: 0
          maximum: 20
          description: |
            §6g's "configurable minimum peer reviews before approval is offered (default 0)".
            Counted as **distinct people other than the submitter whose latest verdict is
            LGTM** — the trail is append-only precisely so that relenting in either direction
            is visible, so somebody who said LGTM and then requested changes is not standing
            behind it.

            Copied onto each review at submission and read from there, never live.
        authorMayApproveOwnWork:
          type: boolean
          description: |
            `false` — the default — means §6g's author-cannot-approve-own-work rule is **on**.
            Stored in the positive so no consumer reads a double negative. "Author" is whoever
            **submitted** the review, not whoever created the artifact.

            A review whose submitter is unattributable does not bind the rule, or the artifact
            could never be approved by anyone.
        editAfterApproval: { $ref: '#/components/schemas/EditAfterApproval' }
        requireApprovedCaseForRun:
          type: boolean
          description: |
            §6g's gating rule for cases — "a project may require APPROVED status before a case
            can be added to a run". **Opt-in and off by default**; §6g calls gating "powerful
            and genuinely obstructive".

            Enforced on the run's **resolved** case set, whether it came from an explicit
            `caseIds` list or from the expansion of a plan's scope — otherwise creating the run
            from the plan is a bypass that costs no permission. The whole run is refused with
            409 naming the offending keys, never trimmed to the approved ones: a checklist
            quietly shorter than the one that was asked for reports a pass rate over a
            denominator nobody chose.

            **Independent of `reviewEnabledCase`.** Switching review off suppresses the
            reviewer apparatus and not the status ladder, so a project can want approved-only
            runs without ever running a peer review — and ANDing the two would disable the gate
            on exactly the projects that enabled it.

            Overridable per request (`TestRunInput.overrideApprovalGate`) by a holder of
            `case:approve`, who could reach the same state by approving the cases first.
        # `requireApprovedPlanToStart` — §6g's gating rule for plans, binding on the DRAFT → ACTIVE
        # edge — was REMOVED on 2026-08-05 (§97, M7) with that edge. Its column is dropped, not left
        # unread: a policy toggle whose rule no longer exists is worse than an absent one, because
        # an administrator turns it on to stop unapproved releases and nothing happens.
        updatedBy:
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
          description: Null for a project nobody has configured — which is most of them.
        updatedAt: { type: string, format: date-time, nullable: true }

    ProjectSettingsUpdate:
      type: object
      description: |
        A full replacement. Every boolean defaults to **false** when omitted — an absent switch
        is "off", which is both §6g's default and the safe reading, and for the gating switch it
        is the only safe reading, since a dropped field that turned a gate ON could stop a
        release. `requiredPeerReviews` and `editAfterApproval` are **required**, because
        0 and RETAIN are meaningful values a dropped field would silently assert.
      required:
        - requiredPeerReviews
        - editAfterApproval
      properties:
        reviewEnabledCase: { type: boolean, default: false }
        reviewEnabledSuite: { type: boolean, default: false }
        reviewEnabledPlan: { type: boolean, default: false }
        requiredPeerReviews: { type: integer, minimum: 0, maximum: 20 }
        authorMayApproveOwnWork: { type: boolean, default: false }
        editAfterApproval: { $ref: '#/components/schemas/EditAfterApproval' }
        requireApprovedCaseForRun: { type: boolean, default: false }

    # -------------------------------------------------------------- enums ---
    LifecycleStatus:
      type: string
      enum: [DRAFT, IN_REVIEW, APPROVED, DEPRECATED]

    AutomationStatus:
      type: string
      enum: [MANUAL, TO_BE_AUTOMATED, AUTOMATED, NOT_AUTOMATABLE]

    Priority:
      type: string
      enum: [CRITICAL, HIGH, MEDIUM, LOW]

    StepFormat:
      type: string
      enum: [STRUCTURED, GHERKIN]

    StatusKind:
      type: string
      description: |
        The fixed aggregation class behind a project's own status names, so a report can roll up a
        project that renamed "Blocked" to "Environment down" without knowing any of their names.

        `WIP` joined the seeded defaults on 2026-08-05 (§97, M9): somebody is running this case
        right now. It is **not final and not a pass**, like `RETEST`, so every rollup groups it
        with `UNTESTED` as *still owed a verdict* — a case somebody picked up has no result, and
        counting it otherwise would move a pass rate on the strength of opening a screen. Existing
        projects take it on by re-running `provision-company`, which is idempotent.
      enum: [PASSED, FAILED, BLOCKED, SKIPPED, UNTESTED, RETEST, WIP]

    HealthSignal:
      type: string
      description: |
        Derived, never authored — self-heals when the cause is fixed (plan §6o). No endpoint sets
        one and none ever will: a "mark as not stale" button is a button for lying.

        **Five of these have a writer.** `NEVER_EXECUTED` and `LONG_UNEXECUTED` (§53),
        `FAILING_REPEATEDLY`, and — since M3 slice 5 — the §6c automation-drift pair,
        `STALE_AUTOMATION` and `UNDECLARED_AUTOMATION`. The rest are computed by nothing and are
        therefore never sent; a client must treat an absent signal as *"nobody has looked"* rather
        than as *"not raised"*, which is what `DashboardSummary.healthComputedAt` exists to
        distinguish.

        `INCOMPLETE` is a special case in the other direction: it is a column in the schema, it is
        in this enum, and there is **no server constant for it**, so it cannot appear on the wire
        today. Kept so a client's labels stay complete.
      enum:
        - OUTDATED_SPEC_CHANGED
        - STALE_APPROVAL
        - CONDITION_DRIFT
        - STALE_AUTOMATION
        - NEVER_EXECUTED
        - LONG_UNEXECUTED
        - UNLINKED
        - FAILING_REPEATEDLY
        - ORPHANED
        - INCOMPLETE
        - UNDECLARED_AUTOMATION

    AggregationPolicy:
      type: string
      description: |
        How a case executed many times resolves to one result (plan §6e).

        **`BEST` was removed on 2026-08-07** (plan §8 #17, applied as #47). "A case that passed
        anywhere counts as passed" is how a red suite gets reported green, and the reading it would
        have been argued against — `WORST` — is still here. It was offered on the theory that "it
        passed on the re-run" is better made in the open under a label than smuggled into a default;
        what the theory missed is that a label makes the argument *easier to win*, and the product
        has since grown the honest way to make it: flake detection (§121) says a case is unreliable
        without calling it green, and the aggregate report's variability section (§112) shows the
        retries a policy would have collapsed.

        A caller that still sends `BEST` gets a 400 naming the four that remain — not a silent
        fallback to `LATEST`, which would answer a question nobody asked with a number they would
        read as theirs.
      enum: [LATEST, LATEST_PER_CONFIG, WORST, ALL]
      default: LATEST

    # -------------------------------------------------------------- auth ---
    InvitationPreview:
      type: object
      required: [email, displayName, passwordRequired]
      properties:
        email:
          type: string
          description: The address the invitation was sent to.
        displayName:
          type: string
          description: |
            The name this company will know them by — per-membership, not global
            (plan §6u).
        passwordRequired:
          type: boolean
          description: |
            False when the address already has an account, i.e. this invitation only
            adds a membership. The accept call must then omit the password.

    AuthResult:
      type: object
      required: [token, expiresAt, user]
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/CurrentUser' }

    CurrentUser:
      allOf:
        - $ref: '#/components/schemas/UserRef'
        # required on BOTH levels, deliberately: `required` does not descend, so without
        # the inner array every property of a team entry generates as optional and no
        # consumer can use one without null-checking fields that are always present.
        # This is the handoff's recurring lesson, and it recurred here.
        - type: object
          required: [isSystemAdmin, teams]
          properties:
            isSystemAdmin:
              type: boolean
              description: |
                Holds a SYSTEM-scope grant. Drives affordances only — every action is
                independently checked server-side, and code checks permissions rather
                than role names (plan §6b).
            teams:
              type: array
              description: The caller's teams IN THE ACTIVE COMPANY. Never across companies.
              items:
                type: object
                required: [id, name, isLead]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  isLead: { type: boolean }

    # ----------------------------------------------------------- project ---
    Project:
      type: object
      required: [id, key, name, archived, caseCount, myRole]
      properties:
        id: { type: string, format: uuid }
        key:
          type: string
          pattern: '^[A-Z0-9]{2,10}$'
          example: OLB
          description: |
            2-10 uppercase alphanumerics, immutable, unique per company. Used in URLs
            and labels. NOT part of a display key — those are company-scoped (§6t).
        name:
          type: string
          description: |
            A project is a FULL CLIENT PROJECT — an entire product or engagement
            ("Acme Online Banking"), not a feature area. Feature-level structure lives
            in the Feature classification dimension and the suite tree (plan §1, §6b).
          example: Acme Online Banking
        description: { type: string, nullable: true }
        archived: { type: boolean }
        caseCount: { type: integer }
        myRole:
          type: string
          nullable: true
          description: |
            The caller's role on this project, or null when they hold no project grant.
            Company membership conveys authentication and ZERO project visibility, so a
            listed project always carries a grant — but Viewer is the default, never
            Test Engineer (plan §6b).
          example: Viewer

    ProjectInput:
      type: object
      required: [key, name]
      description: |
        The body of `POST /projects`. Deliberately three fields: `archived`, `caseCount` and
        `myRole` are server-owned or computed per caller, and a field on an input schema is a
        field somebody eventually binds — a create that could set `archived` would let a project
        be born retired.
      properties:
        key:
          type: string
          pattern: '^[A-Z0-9]{2,10}$'
          example: OLB
          description: |
            Client-supplied and immutable, unique per company. Rejected with a field error on
            `key` when the company already uses it — see the endpoint description for why that is
            a 400 rather than a 409.
        name:
          type: string
          maxLength: 200
          example: Acme Online Banking
          description: |
            A whole client product or engagement, not a feature area. "Payments" is a Feature
            value or a suite folder, never a project (plan §1).
        description: { type: string, nullable: true, maxLength: 2000 }

    ClassificationDimension:
      type: object
      required: [id, key, name, cardinality, hierarchical, locked, values]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: feature }
        name: { type: string }
        cardinality: { type: string, enum: [SINGLE, MULTI] }
        hierarchical: { type: boolean }
        locked:
          type: boolean
          description: |
            The dimension belongs to the **company** rather than to this project and cannot be
            overridden per project — true for Test Type, Test Level and Execution Phase, false for
            the project's own Feature tree.

            It is **not** "read-only". It decides *which* permission may edit the dimension's
            values and at which scope: `company:vocabulary` (COMPANY scope, Company Admin and
            above) when true, `project:settings` on this project when false. A client rendering a
            vocabulary editor gates on this flag; a client rendering a picker ignores it.
        values:
          type: array
          items: { $ref: '#/components/schemas/ClassificationValue' }

    ClassificationValue:
      type: object
      # parentId and color joined `required` when the vocabulary got a writer. They were optional
      # while the only consumer was a flat list of seeded roots, where both are always null and
      # nothing reads either; a tree picker reads `parentId` on every value to place it, and an
      # optional key is one a consumer cannot rely on being sent at all. Nullable, not absent —
      # `ClassificationValueView` has served all five members since it existed, so this tightens
      # the declaration to match what the server already does (§48's repair, one schema more).
      required: [id, parentId, name, path, color]
      properties:
        id: { type: string, format: uuid }
        parentId: { type: string, format: uuid, nullable: true }
        name: { type: string }
        path: { type: string, example: 'Payments.Refunds' }
        color: { type: string, nullable: true }

    ClassificationValueInput:
      type: object
      required: [dimensionId, name, parentId, color]
      description: |
        The body of both writes. `dimensionId` is read only on the create — on the PUT the value
        already knows its dimension and a differing one is a field error rather than a move, for
        the same reason `parentId` is.

        **Every member is required, including the two nullable ones.** A write that carries the
        complete editable shape is what makes "make this a root" and "clear the colour"
        expressible; an optional `parentId` would have exactly one meaning for absent and null and
        the other would be unreachable. `required` here is about the key being *present*, not
        about the value being non-null.
      properties:
        dimensionId:
          type: string
          format: uuid
          description: |
            Which axis this value belongs to. Must be a dimension that applies to this project —
            one of the company's own plus this project's Feature. Anything else is a 404.
        name:
          type: string
          maxLength: 150
          description: |
            What a human reads. **Not** the `path`: `ltree` labels admit only `[A-Za-z0-9_]`, so
            the stored path never spells a name like "UI / E2E" and does not try to.
        parentId:
          type: string
          format: uuid
          nullable: true
          description: |
            Null for a root value — every value of a flat dimension, and a Feature tree's top
            level. Must name a **live value of the same dimension**: the foreign key alone is
            satisfied by a value of another axis, and by one belonging to another project's
            Feature tree, both of which store cleanly and resolve a taxonomy through a project the
            reader holds no grant on.
        color:
          type: string
          nullable: true
          pattern: '^#[0-9a-fA-F]{6}$'
          description: Null for everything the seed creates. `#rrggbb`, six digits, or null.

    CaseStatus:
      type: object
      required: [id, name, kind, color, countsAsPass, isFinal]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: '#/components/schemas/StatusKind' }
        color: { type: string }
        countsAsPass: { type: boolean }
        isFinal: { type: boolean }

    # -------------------------------------------------------- repository ---
    Suite:
      # ~~parentId and path~~ → REMOVED in §98. A suite is a flat named collection; there is no
      # tree to place it in, so a client neither assembles one nor renders a path. Their absence
      # from a response a client already parses is the point at which a stale build finds out.
      type: object
      required: [id, key, name, caseCount, tagRules, caseIds, lifecycleStatus, conditions, lockVersion]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: TS-1 }
        name: { type: string }
        description: { type: string, nullable: true }
        caseCount:
          type: integer
          description: |
            The suite's resolved membership — the cases filed in it, plus the cases added to it
            individually, plus every live case carrying any of its `tagRules`, unioned and deduped.
            Since §98 there is no subtree for it to be confused with.

            **These counts do not sum to the project's case count, and that is the design.** A case
            can belong to three suites — filed in one, added to another, tagged into a third — so
            the totals genuinely overlap. A client showing both must say so rather than leave a
            reader to discover it by subtraction.
        tagRules:
          type: array
          items: { type: string }
          description: |
            The tags this suite claims, **unioned**: a suite with `smoke` and `payments` holds every
            case carrying *either*. Deliberately the opposite of the case grid's `tag` filter, which
            ANDs — a collection is being assembled here and a list is being narrowed there.

            Matched against a case's `tags` exactly, and never against `automationTags` (plan §6c).
        caseIds:
          type: array
          items: { type: string, format: uuid }
          description: |
            The cases added to this suite **individually** — the second membership arm, for a case
            that belongs here because somebody decided so rather than because of where it is filed
            or what it is labelled. A set: order carries nothing.

            Cases that are merely *filed* here or matched by a tag rule are **not** in this list;
            it is what was explicitly added, which is what an editor has to render and reconcile.
        lifecycleStatus: { $ref: '#/components/schemas/LifecycleStatus' }
        conditions:
          description: |
            Suite-level conditions, inherited by the cases **filed** in this suite (plan §6f).

            ~~and by every case beneath it~~ → **§98**: with no subtree there is no chain to walk,
            so a suite's conditions reach exactly its own filed cases. Inheritance deliberately did
            **not** widen to the other two membership arms — a case *added* to a suite, or matched
            by one of its `tagRules`, does not pick up its preconditions. Filing says where a case
            lives and the standing rules of that place apply to it; a tag rule says a collection
            wants to see it, which is not a claim about how it is run. Widening is a decision with a
            slice behind it, not a side effect of flattening.
          type: array
          items: { $ref: '#/components/schemas/CaseConditionRef' }
        lockVersion: { type: integer }

    SuiteInput:
      # ~~parentId~~ → REMOVED in §98, with the tree it placed the suite in.
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        tagRules:
          type: array
          items: { type: string }
          description: |
            The suite's tag rules, as a **complete set** — every tag it should claim after this
            save. Omitting the field leaves them alone; sending `[]` clears them. Same rule as
            `TestCaseInput.tags`, and it matters for the same reason: a rename that never mentioned
            the rules must not empty a collection.

            Free text, trimmed and de-duplicated. A tag nothing carries is accepted, not refused —
            there is no vocabulary to check against, and a rule written before the cases are
            tagged is an ordinary way to work.
        caseIds:
          type: array
          items: { type: string, format: uuid }
          description: |
            The cases added to this suite individually, as a **complete set**. Absent leaves them
            alone; `[]` removes them all — which removes only the *added* arm and never unfiles a
            case or drops a tag rule.

            Each id must name a **live case of this project**. A sibling project's case is refused
            with a field error rather than stored: it satisfies the foreign key and the company
            check, and every later read of this suite would resolve a case through a project the
            reader was never granted.

    SuiteStatusInput:
      type: object
      required: [status]
      properties:
        # All four values, not only the ones a given suite can reach: which moves are legal is a
        # property of the suite's current state, which the server holds and the client's copy of may
        # be one save behind. A client that filtered this list would be holding a second copy of the
        # ladder — and reviving a deprecated suite is spelled DRAFT, not APPROVED, which is exactly
        # the kind of rule that does not survive being written down twice. `PlanStatusInput` says
        # the same thing about the same shape.
        status: { $ref: '#/components/schemas/LifecycleStatus' }

    TestCaseSummary:
      type: object
      required: [id, key, keySeq, title, suiteId, suiteName, priority, lifecycleStatus, automationStatus, stepFormat, owner, createdBy, features, tags, healthSignals, updatedAt]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: TC-1 }
        keySeq: { type: integer, description: Sort by this — text keys do not order correctly. }
        title: { type: string }
        # Both nullable since a suite became a resolvable collection: a case may be filed in no
        # folder at all. Still REQUIRED — an explicit null is what tells the grid to render the
        # "unfiled" affordance, where an absent key would read as a field the server forgot. They
        # are null together or set together; a case with a suite id and no name is not a state the
        # server can produce.
        suiteId: { type: string, format: uuid, nullable: true }
        suiteName: { type: string, nullable: true }
        priority: { $ref: '#/components/schemas/Priority' }
        lifecycleStatus: { $ref: '#/components/schemas/LifecycleStatus' }
        automationStatus: { $ref: '#/components/schemas/AutomationStatus' }
        stepFormat: { $ref: '#/components/schemas/StepFormat' }
        owner:
          # Nullable because test_case.owner_id is. A case can exist with no owner (an
          # import, or an owner offboarded from the company), and the three ways to answer
          # that are: omit the row from the list, invent an owner, or say so. Only the last
          # is true — and the first loses a case from its own project's list.
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
        createdBy:
          # WHO WROTE THE CASE — and it is NOT `owner`, which is who is responsible for it now.
          # The two diverge routinely (a case is authored once and reassigned), and only this one
          # decides authorization: `case:delete` is OWN-qualified for a Test Engineer (roles spec
          # §A5), and the server compares `test_case.created_by`. Until this field existed the
          # client had no way to ask the same question, so the Delete button enabled for every
          # case and a Test Engineer learned which ones were theirs by being refused.
          #
          # Nullable because `test_case.created_by` is: rows written before authorship was
          # recorded have none. That is the arm that matters — the server answers a null author
          # with `false` for an OWN grant ("your own work" must not stretch to work nobody can
          # attribute), so the client must render those disabled rather than treating an absent
          # author as a match.
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
        testType: { type: string, nullable: true }
        testLevel: { type: string, nullable: true }
        features:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
        healthSignals:
          type: array
          items: { $ref: '#/components/schemas/HealthSignal' }
        lastResult:
          type: object
          nullable: true
          # The whole object is null for a case that has never been executed; when it IS present
          # every member is, `releaseVersion` as an explicit null for a run outside a release.
          # Nullability belongs on the object, not on its members — a half-populated last result
          # is not a state the server can produce.
          required: [statusKind, executedAt, releaseVersion]
          properties:
            statusKind: { $ref: '#/components/schemas/StatusKind' }
            executedAt: { type: string, format: date-time }
            releaseVersion: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time }

    TestCase:
      allOf:
        - $ref: '#/components/schemas/TestCaseSummary'
        - type: object
          # `required` does NOT descend from the parent schema, and an allOf branch needs its own —
          # without this every field below generated as optional and `lockVersion` could not be sent
          # as If-Match without a null check on a value the server always emits. Handoff §6 lesson 3,
          # found by `tsc` the moment a consumer relied on one of them.
          #
          # The nullable scalars are listed too, because the server emits the KEY with a null value
          # rather than omitting it — "always present, sometimes null" is what nullable+required says,
          # and leaving them out would mean a consumer cannot tell an unset objective from a field
          # this endpoint does not serve.
          #
          # relatedDocuments is deliberately ABSENT: it is sourced from the `documentation` module,
          # which does not exist, so the server omits the key entirely rather than serving [] and
          # claiming a case has no linked documents (§27).
          required:
            - description
            - objective
            - expectedOutcome
            - severity
            - estimatedDurationSec
            - automationTags
            - automationKey
            - notAutomatableReason
            - gherkinSource
            - steps
            - preconditions
            - postconditions
            - currentVersionNo
            - lockVersion
            - classificationValueIds
            - flake
            - attachments
          properties:
            attachments:
              type: array
              items: { $ref: '#/components/schemas/Attachment' }
              description: |
                Files on the case's **definition** — a spec extract, a reference screenshot, a
                data sheet the steps read from. `attachment.owner_type = 'CASE'`, which `V1`
                declared and nothing wrote until decision round 3's #49.

                **Not evidence**, and the distinction is the whole of why `STEP` left the
                `CHECK` in `V39`: what a step looked like when somebody ran it on Tuesday is a
                `STEP_RESULT` attachment, written since §67 and served under
                `/runs/{runId}/executions/…/evidence`. A file here is authored content, versioned
                with the case and copied by a clone.

                **Never null and never absent** — empty is the ordinary state. Unlike `flake`
                one field up there is no third state to distinguish: no `case_flake` row means
                "nobody has looked", while no `attachment` row simply means nothing is attached.
                A nullable list would hand the SPA two spellings of nothing to tell apart, which
                is the defect §121 phase 4 found on the field above.

                Detail only, for `flake`'s reason: a paperclip count is not worth a per-row join
                on the hottest list read in the product.
            flake:
              # The detail carries it and the summary does not, for `classificationValueIds`'
              # reason one field down: the grid draws a case's *state*, and flake evidence is
              # read while deciding what to do about one case. A per-row join on the hottest
              # list read in the product would buy a column nobody asked for.
              #
              # Nullable, and the null is load-bearing: it means NO `case_flake` ROW EXISTS —
              # the recompute has never reached this case. That is a third state, distinct from
              # both `flakeScore: null` (a row exists, below the evidence floor, "not enough
              # evidence to say") and `flakeScore: 0` ("evidently stable"). Rendering any two of
              # the three alike is the defect this field ships counts to prevent.
              allOf: [{ $ref: '#/components/schemas/CaseFlake' }]
              nullable: true
            classificationValueIds:
              type: array
              items: { type: string, format: uuid }
              description: |
                Every classification value this case carries, as ids — the same assignments
                `testType`, `testLevel` and `features` render by name.

                **The detail carries ids and the summary does not**, deliberately. Names are for
                display and the grid needs nothing else; ids are what an *editor* needs, because
                a name cannot be turned back into a value. The Feature dimension is hierarchical,
                so two leaves under different parents may legitimately share a name, and the three
                company-level vocabularies are renameable per company. Without this field the
                editor would have to guess which value a name meant, and its first save would
                silently rewrite the case's classification.

                **Filtered exactly as the names are**: a value retired since it was assigned is
                absent here and absent from `features`/`testType`/`testLevel`, so the two can
                never disagree about what this case is classified as. The assignment itself
                survives in the database — retiring a value is a soft delete precisely because
                cases and executions already reference it — and a save leaves it alone rather
                than deleting it, since a client cannot preserve a value it was never shown. See
                `TestCaseInput.classificationValueIds` for the write side of that rule.
            description: { type: string, nullable: true }
            objective: { type: string, nullable: true }
            expectedOutcome:
              type: string
              nullable: true
              description: Case-level, alongside per-step expected results (plan §6m).
            severity:
              # Nullable because test_case.severity is — priority is NOT NULL DEFAULT 'MEDIUM'
              # and this column has no default at all, which is the schema saying the two are
              # different fields. A team that does not distinguish "how bad is a failure" from
              # "how soon should it run" leaves it unset rather than being made to repeat itself,
              # and inventing MEDIUM here would put a judgement on the wire that nobody made.
              # Same divergence, resolved the same way, as TestCaseSummary.owner.
              allOf: [{ $ref: '#/components/schemas/Priority' }]
              nullable: true
            estimatedDurationSec: { type: integer, nullable: true }
            automationTags:
              type: array
              items: { type: string }
            automationKey:
              type: string
              nullable: true
              description: |
                The single stable identifier a CI result carries back — FQCN#method, a Cucumber
                scenario URI, or an explicit annotation value. Unique per COMPANY (plan §6c), so
                a CI job posts results without knowing which project owns the case, and a case
                moved between projects does not change where its key resolves. Distinct from
                automationTags, which are for *selection* (@smoke), not matching.
            notAutomatableReason: { type: string, nullable: true }
            gherkinSource: { type: string, nullable: true }
            steps:
              type: array
              items: { $ref: '#/components/schemas/TestStep' }
            preconditions:
              type: array
              items: { $ref: '#/components/schemas/CaseConditionRef' }
            postconditions:
              type: array
              items: { $ref: '#/components/schemas/CaseConditionRef' }
            relatedDocuments:
              type: array
              items: { $ref: '#/components/schemas/DocLink' }
            currentVersionNo: { type: integer }
            lockVersion: { type: integer }

    TestCaseInput:
      type: object
      required: [title]
      properties:
        title: { type: string }
        suiteId:
          type: string
          format: uuid
          nullable: true
          description: |
            The folder to **file** this case in, or null for an unfiled case. No longer required:
            a suite is a resolvable collection — its members are the cases filed in it, the cases
            added to it individually, and every case carrying any of its tags — so filing is one
            way of belonging rather than a precondition for existing. A case may be written before
            anybody has decided where it goes.

            Must name a **live suite of this project**. A sibling project's suite is refused with a
            field error: it belongs to the same company, so it satisfies the foreign key and the
            company check, and every later read would resolve it through a project the reader was
            never granted.

            **Absent and null mean different things on `PATCH`**, as everywhere else on this shape:
            omitting the key leaves the case where it is, sending null unfiles it.
        description: { type: string, nullable: true }
        objective: { type: string, nullable: true }
        expectedOutcome: { type: string, nullable: true }
        stepFormat: { $ref: '#/components/schemas/StepFormat' }
        gherkinSource: { type: string, nullable: true }
        priority: { $ref: '#/components/schemas/Priority' }
        severity: { $ref: '#/components/schemas/Priority' }
        automationStatus: { $ref: '#/components/schemas/AutomationStatus' }
        automationKey: { type: string, nullable: true }
        automationTags:
          type: array
          items: { type: string }
        notAutomatableReason: { type: string, nullable: true }
        estimatedDurationSec: { type: integer, nullable: true }
        ownerId: { type: string, format: uuid, nullable: true }
        classificationValueIds:
          type: array
          items: { type: string, format: uuid }
          description: |
            The case's classification, as a **complete set** — every value it should carry after
            this save. Omitting the field leaves the classification alone; sending `[]` clears it.

            Each id must name a **live value of a dimension this project offers** — the company's
            Test Type / Test Level / Execution Phase, or this project's own Feature tree. A value
            from a *sibling project's* Feature dimension is refused with a field error rather than
            stored: it belongs to the same company, so it satisfies the foreign key and the
            company check, and every later read would resolve it through a project the reader was
            never granted. The same argument `suiteId` and `TestStepInput.sharedStepId` each make,
            on the third column that needed it.

            **At most one value per SINGLE-cardinality dimension** (Test Type and Test Level; plan
            §6d). A second is a `400` keyed on this field, not the `23505` the V2 trigger would
            raise — the trigger is the backstop that holds when this check is wrong, and a
            constraint violation reaching the client is a 500 where a form error belongs.

            A **parent** value in the Feature tree is assignable, not only a leaf. Nothing in the
            product forbids it, and §6q's rule that a feature filter includes its descendants is
            about reading, not about what may be assigned.

            **The reconcile is bounded by the vocabulary the caller was served.** Assignments to
            values retired since they were made are neither returned by `GET` nor removed by a
            save that omits them — a client cannot resubmit a value it was never shown, so
            treating its absence as an instruction to delete would make every save silently
            discard classifications nobody chose to drop.
        tags:
          type: array
          items: { type: string }
          description: |
            The case's tags, as a **complete set** — every tag it should carry after this save.
            Omitting the field leaves them alone; sending `[]` clears them. The same absent-versus-
            empty rule as `classificationValueIds`, and it matters more here: a bulk action
            reconstructs a request without mentioning tags, so reading absent as "clear" would have
            every move quietly strip a case out of every tag-resolved suite it was in.

            Free text, trimmed, deduplicated, and **matched exactly** where a suite's tag rules are
            resolved — same spelling, same case. Duplicates after trimming are collapsed rather than
            refused; `case_tag`'s primary key says a tag list is a set.

            **Not `automationTags`**, which are the selection tags a CI runner filters on (plan
            §6c). These are the organisational labels the grid shows and the ones a suite's tag
            rules resolve against; merging the two would make "run the smoke suite" and "cases the
            release manager flagged" the same query.
        steps:
          type: array
          items: { $ref: '#/components/schemas/TestStepInput' }
        preconditions:
          type: array
          items: { $ref: '#/components/schemas/CaseConditionInput' }
        postconditions:
          type: array
          items: { $ref: '#/components/schemas/CaseConditionInput' }
        changeComment:
          type: string
          nullable: true
          description: Optional by design — mandatory comments produce a thousand "update"s.

    TestStep:
      type: object
      required: [id, position, action]
      properties:
        id:
          type: string
          format: uuid
          description: Stable — results and evidence anchor here, so reordering is safe (plan §6m).
        position: { type: integer }
        keyword:
          type: string
          nullable: true
          enum: [GIVEN, WHEN, THEN, AND, BUT, null]
        action: { type: string }
        testData: { type: string, nullable: true }
        expectedResult: { type: string, nullable: true }
        sharedStepId:
          type: string
          format: uuid
          nullable: true
          description: |
            Set ⇒ this step is a reference to a `/shared-steps` entry, and the UI marks it as
            shared. Served unresolved: the id, not the block. `action` still carries the text,
            so a reader never depends on a second fetch to see what the step says.

    TestStepInput:
      type: object
      required: [action]
      properties:
        id: { type: string, format: uuid, nullable: true }
        keyword: { type: string, nullable: true }
        action: { type: string }
        testData: { type: string, nullable: true }
        expectedResult: { type: string, nullable: true }
        sharedStepId:
          type: string
          format: uuid
          nullable: true
          description: |
            A `/shared-steps` entry **of this project**. Accepted when the entry is live here, or
            when this case's stored steps already reference it.

            Both halves are load-bearing. Without the first, an id from a sibling project is
            stored unchecked — it satisfies the foreign key, so nothing fails, and every reader of
            the case then resolves a library entry through a project they were never granted; an
            id naming nothing at all fails the foreign key and answers 500 where a field error
            belongs. Without the second, **retiring a library entry makes every case using it
            unsaveable**, which is worse than the defect the check closes: references survive a
            retirement by design (the same rule `Condition` states for attachments), so a save
            that merely leaves an existing reference alone must not be re-litigated against a
            library that has moved on.

            Refused as a field error rather than a 404 — the case and the project both resolved,
            and the value came from a picker the message can land on.

    StepSuggestion:
      type: object
      required: [action, testData, expectedResult, useCount]
      properties:
        action: { type: string }
        testData:
          type: string
          nullable: true
          description: |
            Required in the schema sense — the property is always present — but nullable, because a
            step legitimately has no test data. Listed in `required` so a consumer can rely on the
            key existing and fill the field with `null` rather than skipping it; a pick must clear
            the author's field when the suggestion has no value, not leave the previous one behind.
        expectedResult:
          type: string
          nullable: true
          description: As `testData` — always present, sometimes null, and a pick clears the field.
        useCount:
          type: integer
          description: |
            Distinct live cases using this exact triple. The ranking signal; also shown next to the
            suggestion, because "used by 412 cases" is what tells an author they are about to write
            the project's twenty-first wording of a step it already has.

    Condition:
      type: object
      required: [id, title, type, body, usageCount, suiteUsageCount, lockVersion]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        type: { type: string, enum: [PRE, POST, BOTH] }
        body:
          type: array
          items: { type: string }
        usageCount:
          type: integer
          description: |
            Distinct **live cases** attaching this entry **directly** (`case_condition`). Derived by
            the query since §95, never read from `condition.usage_count` — that column stays at its
            `DEFAULT 0` for `SharedStep.usageCount`'s reason: a denormalized counter has to be
            maintained by every path that rewrites a case's condition list, a case edit replaces the
            list wholesale, and a counter that drifts silently is worse than one computed.

            Distinct *cases*, not attachment rows — a case may legitimately attach the same entry as
            both a pre- and a postcondition.
        suiteUsageCount:
          type: integer
          description: |
            Suites attaching this entry (`suite_condition`). **A second number rather than a bigger
            first one**, and that is the resolution of the design question `/shared-steps` posed:
            a condition's usage spans two tables, and blending them would be a guess.

            ~~The suite side propagates by inheritance down the whole ancestor chain, so a suite
            attachment reaches every case beneath it — a figure no join here can produce, since the
            walk is over `suite.path` (`ltree`).~~ → **§98: the reason changed and the shape did
            not.** A flat suite's conditions reach exactly the cases **filed** in it, which *is* a
            plain join — so the figure that was impossible is now merely unwritten. It stays
            unwritten deliberately: the two numbers still do not add up (a case can be filed under
            an attaching suite *and* attach the entry itself), so one blended count would be the
            same guess it always was, just a cheaper one to compute.

            Blending the two into one count would be a **guess presented as a measurement**, and it
            would understate: the direction that matters, because this is what the pre-edit impact
            warning is computed from (plan §6f) and an edit warned as touching 3 cases while touching
            300 is the failure the warning exists to prevent. Two honest numbers instead, and the
            client says "attached to N suites — every case filed in one inherits it" rather than
            inventing a case count for them.
        lockVersion:
          type: integer
          format: int64
          description: |
            Send as `If-Match` on the `PUT`. Mapped with `@Version` from the writer's first day —
            §74 found `lock_version` mapped *without* it on three entities, where the column reads
            `0` for ever and the precondition therefore **cannot fail**, there being no such thing
            as a stale `0`.

    ConditionInput:
      type: object
      required: [title, type, body]
      description: |
        `usageCount`, `suiteUsageCount` and `lockVersion` are absent by construction: the first two
        are derived from the references to the entry, and the third is the server's. Offering any of
        them would invite a value the server discards.
      properties:
        title:
          type: string
          description: Max 150 characters — one line of a picker row.
        type: { type: string, enum: [PRE, POST, BOTH] }
        body:
          type: array
          description: |
            The ordered actions. Blank lines are dropped and an all-blank body is refused, on
            `SharedStepInput`'s terms: a trailing empty row is what the editor appends, and storing
            it puts a blank line into every case that attaches the entry.
          items: { type: string }

    CaseConditionRef:
      type: object
      required: [id, position, title, body, inline, inherited]
      properties:
        id: { type: string, format: uuid }
        position: { type: integer }
        conditionId: { type: string, format: uuid, nullable: true }
        title: { type: string }
        body:
          type: array
          items: { type: string }
        inline: { type: boolean }
        inherited: { type: boolean }
        inheritedFrom: { type: string, nullable: true, example: 'Billing' }

    CaseConditionInput:
      type: object
      required: [conditionId]
      description: |
        One condition attached to a case. **Only the reference form is accepted** as of §95:
        `conditionId` names a live entry of this project's library and the attachment resolves
        through it, so editing that entry propagates here with no prompt — the whole point of the
        object, and the deliberate opposite of a step, which is text copied from `/step-suggestions`.

        `inlineBody` is declared so it can be **refused with a field error** rather than silently
        swallowed, which would be indistinguishable from a typo. It is not implemented because
        **nothing can render one**: every `CaseConditionRef` requires a `title`, an inline row has no
        column one could come from, and both readers exclude such rows at the query. Accepting it
        would be a save that succeeds and a condition the author can never see again.

        **Order is the content.** Position is assigned from the array's order and is never sent — a
        client-supplied position can duplicate or skip and the table has no constraint that would
        refuse it. The same rule `TestStepInput` follows.

        The same entry may appear in **both** lists (setup that is also cleanup) but only once
        within one list; a repeat inside one list is de-duplicated rather than refused.
      properties:
        conditionId: { type: string, format: uuid }
        inlineBody:
          type: array
          description: Refused with a 400 when present — see above.
          items: { type: string }

    SharedStep:
      type: object
      required: [id, title, body, usageCount]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        body:
          type: array
          items: { type: string }
        usageCount:
          type: integer
          description: |
            Distinct **live** cases whose steps reference this entry. Derived by the query, never
            read from the stored column — see the `GET` description for why a denormalized counter
            was refused. A retired case stops counting; retiring the entry itself does not
            renumber anything, because the references survive it.

    SharedStepInput:
      type: object
      required: [title, body]
      description: |
        `usageCount` is absent by construction: it is derived from the references to the entry, so
        a client cannot state it, and offering the field would invite a value the server discards.
      properties:
        title:
          type: string
          description: |
            What the picker lists and what a referencing step shows as its action. The summary of
            the block, not the first line of it.
        body:
          type: array
          minItems: 1
          items: { type: string }
          description: |
            The ordered actions. A list rather than a paragraph for `Condition.body`'s reason —
            "sign in" is realistically three actions (ERD §4). At least one, and blank entries are
            dropped: an empty library block is a picker row that inserts nothing.

    BulkOperation:
      type: object
      required: [action, caseIds]
      description: |
        One action, one argument, over a selection of cases.

        **The permission depends on the argument, not only on the action.** `SET_STATUS` targeting
        `APPROVED` needs `case:approve` — Lead and up, and explicitly *not* Test Engineer (roles
        spec, Review table; plan §6g: *"the state machine has exactly one gate, held by
        `*:approve`"*). Every other action and every other target needs `case:edit`. A caller who
        holds `case:edit` and not `case:approve` therefore gets a 403 on one value of one field and
        a 200 on the rest, which is why the SPA gates the APPROVED option separately rather than
        gating the dialog.
      properties:
        action:
          type: string
          enum: [ATTACH_CONDITIONS, DETACH_CONDITIONS, SET_STATUS, SET_AUTOMATION_STATUS, SET_OWNER, ADD_TAGS, SUBMIT_FOR_REVIEW, MOVE_TO_SUITE]
          description: |
            `SUBMIT_FOR_REVIEW` is `SET_STATUS` with `lifecycleStatus: IN_REVIEW` and is kept
            because plan §6g uses the vocabulary ("bulk-submit"). The server aliases it at the
            parse boundary, so there is one implementation of the state change rather than two
            spellings that drift apart.
        caseIds:
          type: array
          minItems: 1
          maxItems: 500
          description: |
            The selection, in the caller's own order. Duplicates are collapsed and the result
            reports each distinct id exactly once.

            Capped because the whole operation is one transaction and one audit event, so an
            unbounded selection is an unbounded lock. 500 is comfortably above the case grid's
            largest page, so no selection a user can actually make in the product hits it.
          items: { type: string, format: uuid }
        dryRun:
          type: boolean
          default: true
          description: Preview first. The UI must show the preview before committing.
        payload:
          $ref: '#/components/schemas/BulkPayload'

    BulkPayload:
      type: object
      description: |
        The argument, typed. Every property is optional here and **exactly the ones its action
        needs are required by the server**, which answers 400 with the field name when one is
        missing — the same shape a form validation error takes, so the message lands on the control.

        Deliberately a flat object with optional members rather than a `oneOf` discriminated on
        `action`. A `oneOf` states the per-action requirement in the schema itself, which is
        genuinely better, and generates a TypeScript union the SPA would have to narrow at every
        call site to build a payload it constructs one field at a time. The server has to validate
        the combination either way — it is the only side that knows the action — so the `oneOf`
        would buy a compile-time check the client cannot use while costing every consumer a narrow.
      properties:
        lifecycleStatus:
          allOf: [{ $ref: '#/components/schemas/LifecycleStatus' }]
          description: Required by `SET_STATUS`. Refused for every other action.
        automationStatus:
          allOf: [{ $ref: '#/components/schemas/AutomationStatus' }]
          description: Required by `SET_AUTOMATION_STATUS`.
        notAutomatableReason:
          type: string
          nullable: true
          description: |
            Required by `SET_AUTOMATION_STATUS` when the target is `NOT_AUTOMATABLE`, by the same
            `V1` check constraint the single-case editor obeys — which is what keeps automation
            coverage honestly denominated rather than letting anything inconvenient be filed as
            impossible.
        ownerId:
          type: string
          format: uuid
          nullable: true
          description: |
            Required by `SET_OWNER`; `null` clears the owner. Validated against the project's
            member list — the same *active member ∧ project grant* predicate `GET /members` and
            `POST /work-items` use (§54), so the picker offers exactly the set the server accepts.
        suiteId:
          type: string
          format: uuid
          description: Required by `MOVE_TO_SUITE`. Must be a live suite in this project.
        tags:
          type: array
          items: { type: string }
          description: |
            Required by `ADD_TAGS`. Additive and set-valued: a tag a case already carries leaves it
            `unchanged` rather than failing, and nothing is removed. There is no bulk tag *removal*
            in this slice.
        conditionId:
          type: string
          format: uuid
          description: Required by `ATTACH_CONDITIONS` and `DETACH_CONDITIONS`.
        conditionKind:
          type: string
          enum: [PRE, POST]
          description: |
            Which list the attachment lands in, for `ATTACH_CONDITIONS`; the server defaults it to
            `PRE` when absent. Deliberately no `default:` here — openapi-typescript renders a
            defaulted property as **required**, which would force every caller to send a value the
            server is perfectly happy to choose. `BOTH` is not offered:
            it describes what a *library* condition may be used as, while an attachment is always
            one position in one of the two lists (see the `ConditionKind` javadoc).

    BulkResult:
      type: object
      description: |
        Every outcome is reported as a LIST OF KEYS, not a count. The UI has to name what
        it touched — "38 changed, 4 already matched, 2 skipped" with the two skipped cases
        named and their reason given. A bare `affected: 38` cannot be rendered as a preview,
        and a blanket success toast over a partial failure is the worse half of the defect,
        because the user believes all 44 went through (plan §6f).
      required: [dryRun, total, changed, unchanged, skipped]
      properties:
        dryRun:
          type: boolean
          description: True when this is a preview. The UI must preview before committing.
        total:
          type: integer
          description: Size of the requested selection.
        changed:
          type: array
          description: Case keys that changed (or would change, when dryRun).
          items: { type: string, example: TC-42 }
        unchanged:
          type: array
          description: Case keys already in the requested state — compliant, not failed.
          items: { type: string, example: TC-43 }
        skipped:
          type: array
          description: Case keys that could not be changed, each with a displayable reason.
          items:
            type: object
            required: [key, reason]
            properties:
              key: { type: string, example: TC-44 }
              reason: { type: string, example: 'A draft must be reviewed before it can be approved.' }
        auditEventId: { type: string, format: uuid, nullable: true }

    CaseQuarantineInput:
      type: object
      required: [quarantined]
      properties:
        quarantined:
          type: boolean
          description: |
            The state to move to. Required — an absent field is a `400`, never a silent
            `false`, because that is the one shape of this request that could release a
            quarantine the caller never mentioned.
        reason:
          type: string
          maxLength: 1000
          description: |
            Why the test is being quarantined. **Required when `quarantined` is true**,
            ignored when it is false. Not expressible as a schema-level `required`, since
            it is conditional on the sibling field — the server raises it as a field error
            the form can land on.

    TestCaseCloneInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
          description: |
            The new case's title. **Required**, and validated by the same rule the create
            path applies — see the operation for why the server does not default it to
            `Copy of <title>`.
        suiteId:
          type: string
          format: uuid
          nullable: true
          description: |
            Where the clone lands. Omitted or `null` means **the source's suite**, which is
            what "clone this" means without further instruction. A suite in another project
            is a `400`, not a cross-project clone: that needs the classification revalidated
            against the target project's vocabularies (§6d) and is its own slice.

    CaseDraftInput:
      type: object
      required: [lockVersion, content]
      properties:
        lockVersion:
          type: integer
          format: int64
          description: |
            The `lockVersion` of the case the editor was holding when it started typing —
            the same value it would send as `If-Match` were it saving.

            **Required, and it is the field that stops a restore eating a committed edit.**
            Ana opens `TC-9` at `lockVersion 3` and types; the draft is buffered. Bob saves
            `TC-9`, which becomes `lockVersion 4`. Ana returns, the editor loads the case
            fresh at `4` and offers to restore her draft, she accepts and saves. That save's
            `If-Match` is `4` — it came from the fresh read — so the stale-editor check
            passes and Bob's change is overwritten by text written before it existed. The
            check cannot see this: it compares what the client read against what is stored,
            and the client did read the current version. What nothing asked is what the
            **draft** was written against.

            Recorded, not enforced. A draft written against a stale version is still the
            author's work; the decision is the returning editor's, informed by
            `CaseDraft.stale`.
        content:
          allOf: [{ $ref: '#/components/schemas/TestCaseInput' }]
          description: |
            The editor's current form state — exactly the shape `PATCH` takes, which is what
            makes "restore" mean "put this back in the form".

            **Not validated.** See the operation description.

    CaseDraft:
      type: object
      required: [lockVersion, stale, updatedAt, content]
      description: |
        A buffered draft, and everything a returning editor needs in order to decide whether
        to adopt it.
      properties:
        lockVersion:
          type: integer
          format: int64
          description: The case's `lockVersion` when this draft was written.
        stale:
          type: boolean
          description: |
            `true` when the case has moved since the draft was written.

            **Computed by the server, not left to the client.** The client holds both
            numbers and could compare them, and that is precisely how two screens end up
            disagreeing about whether the same draft is safe.

            **Advisory, never enforcing.** A stale draft is served in full — the words are
            the author's and are often exactly what they want, particularly when the
            intervening save touched a different field. Dropping it would be the product
            deciding that somebody else's edit invalidates your sentence.
        updatedAt:
          type: string
          format: date-time
          description: |
            When it was last buffered, from the server's clock. "Restore unsaved changes"
            means something different for work from four minutes ago and work from four
            weeks ago.
        updatedBy:
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
          description: |
            Who typed it. **This field carries the cost of the 1:1 primary key**: there is
            one buffer per case, so the draft on offer may be a colleague's, and restoring it
            silently would publish their half-finished sentence under your name.

            Null when the account no longer resolves — "somebody, no longer in this
            company", which is the honest answer and the reason it is not defaulted to the
            caller.
        content:
          allOf: [{ $ref: '#/components/schemas/TestCaseInput' }]
          description: The buffered form state, unvalidated.

    Attachment:
      type: object
      description: |
        One file attached to something that is **authored content** — a test case's
        definition (`attachment.owner_type = 'CASE'`), a documentation page (`DOC_PAGE`), or
        an artifact's bytes (`ARTIFACT`).

        **One schema for all three, and that is a decision.** The shapes are identical field
        for field *and* meaning for meaning — only the value of `url` differs, and the server
        builds that — so three structurally-identical types would make the SPA's one
        attachment list generic over nothing, and would re-create by hand, on the outside,
        the polymorphism-by-duplication the `storage` module removed on the inside:
        `storage.Attachment` is one entity for five owner types. It was `CaseAttachment`
        until #49's phase 2, when a second owner made the case-specific name wrong.

        **Not `Evidence`, which stays its own schema.** Evidence has a **caption** —
        somebody saying what a screenshot *shows*, a claim about a moment that has passed —
        and it is a record of something that happened rather than authored content. That
        difference is what decides the delete gate everywhere: an authorship arm on evidence,
        none here. A caption on this schema would be a second free-text name for a file that
        already has one, which two people will fill in differently.
      required: [id, filename, contentType, sizeBytes, url, uploadedAt]
      properties:
        id: { type: string, format: uuid }
        filename:
          type: string
          description: |
            What the caller called the file, reduced to its last path segment on the way in.
            It is a **column** and never part of a storage key — the key is three
            server-generated UUIDs — so a traversal name was already harmless; it is reduced
            anyway, because a string that looks like a path invites the next reader to use it
            as one.
        contentType:
          type: string
          description: |
            As the upload declared it, echoed back. `application/octet-stream` when the client
            sent none — guessing from the extension would state a type nobody claimed, and the
            browser trusts this header when rendering.
        sizeBytes:
          type: integer
          format: int64
          description: |
            Raw bytes. Formatted by `lib/format.ts` and never here: the server has no business
            deciding whether 1024 reads as "1 KB" or "1 KiB", and the SPA already has exactly
            one place that decides.
        url:
          type: string
          description: |
            Where the bytes are, absolute from the API root. Built by the server rather than
            composed by the client, so the route is spelled in one place — a client that
            composes it is a second spelling, and a route change then breaks the download with
            a 404 that reads as a missing file rather than as a missing endpoint.

            Served `inline` with the stored content type, so a reference screenshot renders
            beside the steps instead of landing in the downloads folder.
        uploadedAt: { type: string, format: date-time }
        uploadedBy:
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
          description: |
            Who attached it. A `UserRef` and **not a bare uuid** — §100's convention, and §121's
            finding that `quarantinedBy` was the only field on this API breaking it, under a
            javadoc asserting it did not. Null only when `attachment.created_by` is null, which
            `V1` permits and a future system actor would use.

    CaseFlake:
      type: object
      description: |
        A case's flake evidence (derived, plan §6l) and its quarantine decision (authored,
        plan §6c). One row, two halves, written by two different things that can never
        overwrite each other's columns.

        Flakiness is **pass/fail alternation within a single version and configuration** —
        §6l's rule, and the only scoping under which it means anything. Alternation across
        versions is just change: a test that passed, was edited, and now fails caught a
        regression, and reporting that as flake sends somebody to quarantine the test that
        found the bug.
      required:
        [caseId, executions, transitions, alternations, cells, computedAt, quarantined]
      properties:
        caseId: { type: string, format: uuid }
        executions:
          type: integer
          description: |
            Recorded outcomes inside the scoring window that were a pass or a failure.
            Blocked, skipped, retest and untested results are **removed before the sequence
            is formed**, which is not the same as ignoring them: a blocked run between two
            passes would otherwise read as two alternations and score a stable test at 1.0.
        transitions:
          type: integer
          description: |
            Adjacent pairs of outcomes **inside one cell** — the denominator of
            `flakeScore`, and never `executions`. A case with six results spread across six
            cells has six executions and zero transitions, because nothing in it ever ran
            twice under the same conditions.
        alternations:
          type: integer
          description: How many of those pairs changed between a pass and a failure.
        cells:
          type: integer
          description: |
            How many `(configuration, case version)` cells contributed — what tells a test
            that flaps on one browser from one that flaps on five.
        flakeScore:
          type: number
          format: double
          minimum: 0
          maximum: 1
          nullable: true
          description: |
            `alternations ÷ transitions`, or **null below the evidence floor**, which is a
            different claim from `0`. Two results that went pass then fail score a perfect
            `1.0` on any ratio definition and that is noise — and it is the number a human
            would then use to decide whether to quarantine. `0` means *evidently stable*;
            `null` means *not enough evidence to say*. The counts above ship precisely so a
            client can render the second as "3 results, not enough to score" rather than as
            an unexplained blank.
        lastAlternationAt:
          type: string
          format: date-time
          nullable: true
        computedAt:
          type: string
          format: date-time
          description: |
            When the derived half was last recomputed. On the wire for the same reason
            `Dashboard.healthComputedAt` is: it is the only thing that tells "this test is
            not flaky" from "nobody has looked at this test yet".
        quarantined: { type: boolean }
        quarantinedAt:
          type: string
          format: date-time
          nullable: true
        quarantinedBy:
          # A `UserRef`, not the bare uuid this field shipped as in §121 phase 1 — it was the
          # ONLY actor field on this API that was one, against ~25 that are not, and
          # `CaseFlakeView`'s own javadoc asserted it followed the convention it broke
          # ("resolved to a name by the caller like every other actor field on this API").
          # A comment claiming a fact about another file is not a check (§100).
          #
          # It matters at exactly one screen: the flake panel names who took the test out of the
          # gate, and a bare id leaves it rendering a uuid or silently dropping the decider — the
          # half of the record that makes a quarantine reviewable rather than just present.
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
          description: |
            Who decided. Null exactly when `quarantined` is false — the database refuses any
            other combination.
        quarantineReason:
          type: string
          nullable: true

    EntityVersion:
      type: object
      required: [versionNo, createdBy, createdAt, pinned]
      properties:
        versionNo: { type: integer }
        createdBy:
          # Nullable because test_case_version.created_by is, and carries no FK to
          # app_user (§28 finding 1). Two real states reach this field: nobody was
          # recorded (rows predating the first write path), and the recorded id names
          # no surviving account. Declaring it non-nullable made every consumer's
          # generated type lie, and the SPA carried a hand-widened alias to compensate
          # — §35 found it. Same treatment as TestCaseSummary.owner above.
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
        createdAt: { type: string, format: date-time }
        changeComment: { type: string, nullable: true }
        pinned: { type: boolean }

    VersionMarker:
      description: Rendered on history timelines so causation is visible (plan §6p).
      type: object
      required: [versionNo, occurredAt, author]
      properties:
        versionNo: { type: integer }
        occurredAt: { type: string, format: date-time }
        author:
          # Nullable because test_case_version.created_by is a nullable column with NO foreign key
          # to app_user (handoff §28, finding 1), so both "nobody was recorded" and "the recorded id
          # names no account" are states of a real row. Inventing a name for either would put an
          # author on the one table whose entire purpose is that past claims stay true.
          #
          # `repository`'s EntityVersion already ships null here and diverged from this contract
          # silently to do it (§35). Declared rather than left as a second undeclared divergence.
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
        changeComment: { type: string, nullable: true }

    # --------------------------------------------------------- execution ---
    TestPlanSummary:
      type: object
      required: [id, key, name, status, milestoneName, milestoneDate, caseCount, passRate, coverage]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: TP-1 }
        name: { type: string }
        status: { type: string, enum: [DRAFT, IN_REVIEW, APPROVED] }
        milestoneName: { type: string, nullable: true }
        milestoneDate: { type: string, format: date, nullable: true }
        caseCount: { type: integer }
        passRate: { type: number, nullable: true }
        coverage: { type: number, nullable: true }

    TestPlan:
      allOf:
        - $ref: '#/components/schemas/TestPlanSummary'
        - type: object
          # `required` does not descend through allOf, so the second member declares its own —
          # without it every property here is optional and no consumer can use one.
          required: [description, entryCriteria, exitCriteria, configurations, suiteIds, caseIds, tags, sections, scopeText, outOfScopeText, currentVersionNo, lockVersion]
          properties:
            description: { type: string, nullable: true }
            entryCriteria:
              type: array
              items: { $ref: '#/components/schemas/Criterion' }
            exitCriteria:
              type: array
              items: { $ref: '#/components/schemas/Criterion' }
            configurations:
              type: array
              items: { $ref: '#/components/schemas/Configuration' }
            # The plan's scope as STORED, which nothing served before the editor existed:
            # caseCount is an expansion of these ids and cannot be edited, so a client had no
            # way to write back the scope it was shown. §68 found the identical gap on a
            # case's classification — the detail served names, the writer took ids — and the
            # rule it produced is that a field a PATCH accepts must be readable from the GET
            # that precedes it. Sorted, because plan_scope_item has no ordinal column.
            suiteIds:
              type: array
              items: { type: string, format: uuid }
            caseIds:
              type: array
              items: { type: string, format: uuid }
            # The unsectioned tag arm. `suiteIds`/`caseIds`/`tags` together ARE the unsectioned
            # group — every plan created before §97 has only this — and `sections` carries the rest.
            # One place for each item, so there is no overlap to reconcile and no second way to
            # write the same membership.
            tags:
              type: array
              items: { type: string }
            sections:
              type: array
              items: { $ref: '#/components/schemas/PlanSection' }
            scopeText: { type: string, nullable: true }
            outOfScopeText: { type: string, nullable: true }
            currentVersionNo: { type: integer }
            lockVersion: { type: integer }

    TestPlanInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        milestoneName: { type: string, nullable: true }
        milestoneDate: { type: string, format: date, nullable: true }
        suiteIds:
          type: array
          items: { type: string, format: uuid }
        caseIds:
          type: array
          items: { type: string, format: uuid }

    TestPlanUpdateInput:
      type: object
      # Only the name. Every other field is optional because a list left out means "leave it
      # alone" — see the operation's description for the absent/null/empty split.
      required: [name]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        milestoneName: { type: string, nullable: true }
        milestoneDate: { type: string, format: date, nullable: true }
        suiteIds:
          type: array
          items: { type: string, format: uuid }
        caseIds:
          type: array
          items: { type: string, format: uuid }
        # The unsectioned tag arm and the named sections. Absent means "leave alone", `[]` clears —
        # the convention every list on this input already follows.
        tags:
          type: array
          items: { type: string }
        sections:
          type: array
          items: { $ref: '#/components/schemas/PlanSectionInput' }
        # Free prose about what will and will not be tested. NOT to be confused with the plan's
        # SCOPE ITEMS (`suiteIds`/`caseIds`/`tags`/`sections`), which are the cases the plan covers:
        # two meanings of the word "scope" live on this one schema, and only this pair is prose.
        # `null` clears the text; absent leaves it alone.
        scopeText: { type: string, nullable: true }
        outOfScopeText: { type: string, nullable: true }
        # The two fields TestPlanInput deliberately does not have. A plan is named before
        # anybody knows what would make it releasable, so criteria arrive on the edit and
        # nowhere else. The scope prose above joins them for the same reason: a plan is named
        # before anybody can say what is out of scope for it.
        entryCriteria:
          type: array
          items: { $ref: '#/components/schemas/CriterionInput' }
        exitCriteria:
          type: array
          items: { $ref: '#/components/schemas/CriterionInput' }

    CriterionInput:
      type: object
      description: |
        One authored gate. `Criterion` minus `met` and `actual`, and dropping those two is the
        point: both are **derived** — computed from the statistics endpoint's own numbers on
        every response — so accepting them would let a client assert that a release gate was
        met, which is the one claim on this object nobody should be able to make by typing it.

        A client that echoes back the `Criterion` it was served is fine; the two extra fields
        are ignored rather than refused, because they are this server's own computed answer
        and discarding them loses nobody's work.

        `metric` and `op` are **closed vocabularies**, validated on the way in. Unchecked, a
        plan gated on `pass_rte` renders exactly like one gated on `open_critical`: a criterion
        with no verdict. One of those means "we cannot check this yet" and the other is a typo
        that will never be checked at all, and a release meeting cannot tell them apart.
      required: [metric, op, value]
      properties:
        metric:
          type: string
          enum: [pass_rate, coverage, open_critical, cases_approved, build_available]
          example: pass_rate
        # Six canonical spellings. The server also tolerates `==` and `<>` because its
        # evaluator has always applied them and rows seeded by hand carry them — stated here
        # rather than left for somebody to discover, since a client has no reason to send one.
        op:
          type: string
          enum: ['>=', '>', '<=', '<', '=', '!=']
          example: '>='
        value: { type: number }
        # Optional: the server derives "pass_rate >= 95" when it is absent. It exists for the
        # gates whose name the predicate does not carry — "Sign-off from Support".
        label: { type: string, nullable: true }

    PlanSection:
      type: object
      description: |
        A **sub-feature** subdivision of the plan's cases — "Create an object", "Edit",
        "Navigation" — holding the same three kinds of reference the unsectioned group holds.

        **A section is a live selector, not a snapshot.** Its members are resolved on every read, so
        adding a case to a referenced suite, or tagging a case with a referenced tag, changes what
        this section holds without anything writing to the plan. TestNG's `<test>` block is the
        shape: a named subdivision carrying its own class list and its own group filter,
        re-resolved on every run.

        **A section is plan-local and is not a suite.** It has no key, no lifecycle, no versions and
        no existence outside this plan — a suite is reusable project content, a section is this
        plan's narrative structure.

        **The counts do not sum.** A case can be referenced directly in one section and arrive
        through a suite or a tag in another, so the sections' counts exceed the plan's deduped
        `caseCount`. That is the design, and a client that lets a reader subtract will have them
        report a bug in a correct number.
      required: [name, position, caseIds, suiteIds, tags, caseCount]
      properties:
        name: { type: string }
        position:
          type: integer
          description: Author order. Contiguous from 0 as served; a client sends the order it wants.
        caseIds:
          type: array
          items: { type: string, format: uuid }
        suiteIds:
          type: array
          items: { type: string, format: uuid }
        tags:
          type: array
          items: { type: string }
        caseCount:
          type: integer
          description: |
            The live cases this section resolves to right now, deduped across its three arms.

            Served beside the references rather than instead of them: the references are what the
            author wrote and are what a `PATCH` sends back, and the count is what they currently
            catch. A section defined by the tag `smoke` and reporting 12 says both halves of the
            live-selector design on one row.

            **These do not sum to the plan's `caseCount`** — see this schema's own description. A
            section with no references at all reports `0`, which is legal and is not an error.

    PlanSectionInput:
      type: object
      description: |
        **The whole section list is replaced when `sections` is present** — sections have no ids, so
        there is nothing to match a partial update against. Absent means "leave the sections alone";
        `[]` removes them all and leaves their references unsectioned nowhere, i.e. removes them
        from the plan.

        A section with no references at all is legal and is kept: an author names the sub-feature
        before filling it, and dropping empty ones on save would delete the heading they just typed.
      required: [name]
      properties:
        name: { type: string }
        caseIds:
          type: array
          items: { type: string, format: uuid }
        suiteIds:
          type: array
          items: { type: string, format: uuid }
        tags:
          type: array
          items: { type: string }

    TagUsage:
      type: object
      required: [tag, caseCount]
      properties:
        tag: { type: string }
        caseCount:
          type: integer
          description: |
            Live cases carrying this tag in this project. Never zero — a tag with no live case is
            absent from the list rather than present with a zero.

    PlanStatusInput:
      type: object
      required: [status]
      properties:
        # All three values, not only the ones a given plan can reach: which moves are legal is a
        # property of the plan's current state, which the server holds and the client's copy of may
        # be one save behind. A client that filtered this list would be holding a second copy of the
        # ladder.
        #
        # `overrideApprovalGate` was here and was REMOVED on 2026-08-05 (§97, M7): its one
        # meaningful move, DRAFT → ACTIVE, no longer exists, and a boolean that is always ignored is
        # worse than an absent one — a client keeps sending it and the next reader has to prove it
        # does nothing. §6g's override survives on `TestRunInput.overrideApprovalGate`, where its
        # rule does.
        status: { type: string, enum: [DRAFT, IN_REVIEW, APPROVED] }

    Criterion:
      type: object
      description: Machine-evaluable so the plan page is a gate, not prose (plan §6p).
      required: [metric, op, value, label]
      properties:
        metric: { type: string, example: pass_rate }
        op: { type: string, example: '>=' }
        value: { type: number }
        label: { type: string }
        met: { type: boolean, nullable: true }
        actual: { type: number, nullable: true }

    Configuration:
      type: object
      required: [id, name, isDefault, attributes]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: 'Chrome / Windows' }
        isDefault: { type: boolean }
        attributes:
          type: object
          additionalProperties: { type: string }

    # --------------------------------------------------------- ingestion ---
    ReportFormat:
      type: string
      description: |
        Which CI dialect `report` is. **Never inferred** — `application/xml` is true of both
        JUNIT and TESTNG and distinguishes neither, and sniffing the payload would make a
        malformed report of one dialect read as a valid report of another. These four are
        `ingestion_job.format`'s own CHECK, so the set cannot grow without a migration.
      enum: [JUNIT, TESTNG, ALLURE, CUCUMBER]

    IngestedOutcome:
      type: string
      description: |
        What the runner said about one test, before it becomes one of the project's own result
        statuses. Four values mapping to three `StatusKind`s: `ERRORED` is `FAILED`'s kind and is
        kept distinct in the parse because JUnit and TestNG separate `<failure>` (an assertion the
        test made and lost) from `<error>` (the test throwing before it could assert), and the
        messages differ. It is **not** a fifth bucket in a vocabulary the project owns.
      enum: [PASSED, FAILED, ERRORED, SKIPPED]

    IngestionStatus:
      type: string
      description: |
        Where the job got to. **The synchronous lane writes only `COMPLETED`.** A report that
        cannot be parsed leaves no row at all — a `FAILED` row would consume the idempotency key,
        so the *corrected* retry under the key CI generated once would replay the failure. The
        other three belong to an asynchronous lane that does not exist yet.
      enum: [PENDING, PROCESSING, COMPLETED, FAILED]

    IngestionInput:
      type: object
      required: [format, report]
      properties:
        format: { $ref: '#/components/schemas/ReportFormat' }
        report:
          type: string
          description: |
            The report file, verbatim. Capped at 1 MiB of UTF-8 — this is the only endpoint that
            takes an arbitrary blob into a `JSONB` column, and unbounded it is an out-of-memory
            fault rather than a refusal, taking the instance down for every other company on it.
            The cap is named in the 400 so a caller can split the report.
          maxLength: 1048576
        runId:
          type: string
          format: uuid
          nullable: true
          description: |
            Post into this existing run instead of opening one. When given, the other run fields
            are **ignored rather than refused**: a CI configuration that sets `releaseVersion` on
            every post should not start failing the day somebody adds `runId`, and none of them
            could change a run that already exists.

            A matched case that is **not in that run's checklist** is reported in `unmatched`
            rather than added: silently growing a checklist somebody is working through, and its
            denominator, from a CI job is not this endpoint's to do.
        runName:
          type: string
          nullable: true
          description: |
            The opened run's name. Defaulted rather than required — a CI job has a build number
            and rarely a name, and requiring one produces "run" on every row. Absent, the run is
            named after `buildNumber`.
        configurationId:
          type: string
          format: uuid
          nullable: true
          description: Which environment. The project's default when absent, as for `POST /runs`.
        releaseVersion: { type: string, nullable: true }
        buildNumber:
          type: string
          nullable: true
          description: |
            The CI build. The one field that makes an ingested run traceable back to the job that
            posted it, which is why it is a field rather than left to the name.

    UnmatchedTest:
      type: object
      required: [name, normalizedName, outcome]
      description: |
        A test the ladder could not place. **This is what makes declining §6c's auto-created case
        stubs workable**: a person reads this list, decides which case each name means, and posts
        it to `POST /automation-mappings`.
      properties:
        name:
          type: string
          description: The test as the report named it, `className#name`.
        normalizedName:
          type: string
          description: |
            The exact key `POST /automation-mappings` stores. Served rather than left for the
            client to recompute — the normalization rule lives in one place on purpose, and a
            client re-deriving it is a second implementation of the one thing that must agree
            exactly or every mapping silently stops matching.
        outcome:
          allOf: [{ $ref: '#/components/schemas/IngestedOutcome' }]
          description: |
            Present because it changes the urgency: an unmatched **failure** is a red test nobody
            is being told about, where an unmatched pass is only unrecorded coverage.

    IngestionJob:
      type: object
      required: [id, status, format, runId, runKey, matchedCount, unmatchedCount, unmatched, createdAt]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/IngestionStatus' }
        format: { $ref: '#/components/schemas/ReportFormat' }
        runId:
          type: string
          format: uuid
          nullable: true
          description: |
            The run the results landed in. **Null exactly when nothing matched** — see the
            endpoint on why a report matching nothing opens no run.
        runKey:
          type: string
          nullable: true
          example: TR-4
          description: Beside the id, so a CI log line is something a person can search for.
        matchedCount: { type: integer }
        unmatchedCount:
          type: integer
          description: The true total, so a caller can always tell that `unmatched` was cut.
        unmatched:
          type: array
          description: |
            Capped at 50. A first integration attempt matches nothing, so the unbounded list is
            the *common* case at exactly the moment the response is largest.
          items: { $ref: '#/components/schemas/UnmatchedTest' }
        createdAt: { type: string, format: date-time }

    IngestionJobSummary:
      type: object
      required: [id, status, format, runId, runKey, matchedCount, unmatchedCount, createdAt]
      description: |
        One row of the ingestion history. **`IngestionJob` without `unmatched`** — see
        `GET /ingestions` on why the names are absent rather than empty here.
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/IngestionStatus' }
        format: { $ref: '#/components/schemas/ReportFormat' }
        runId:
          type: string
          format: uuid
          nullable: true
          description: Null exactly when the report matched nothing, so no run was opened.
        runKey:
          type: string
          nullable: true
          example: TR-4
          description: |
            Null in **two** cases, told apart by `runId`: no run was opened (`runId` null too), or
            the run it opened has since been deleted (`runId` present). The key of a deleted run is
            withheld rather than served, because it would offer a link to a screen that 404s.
        matchedCount: { type: integer }
        unmatchedCount:
          type: integer
          description: |
            The true total. On this shape it is the *only* thing said about the unmatched tests —
            open the job to see which they were.
        createdAt: { type: string, format: date-time }

    AutomationMappingInput:
      type: object
      required: [testName, caseId]
      properties:
        testName:
          type: string
          maxLength: 500
          description: |
            The test as a report names it. Sent **raw** — the server normalizes, because the rule
            has to agree exactly with the one the parser applies. Pasting an `UnmatchedTest`'s
            `normalizedName` back works too; it is already in the canonical form.
        caseId: { type: string, format: uuid }

    AutomationMapping:
      type: object
      required: [id, testName, caseId, caseKey, confirmedBy, confirmedAt]
      properties:
        id: { type: string, format: uuid }
        testName:
          type: string
          description: |
            The normalized key the match is made on. Named `testName` rather than
            `normalizedTestName` because it is the only name a client ever sees or sends — the raw
            form a report used is not stored, and a second field would invite one.
        caseId: { type: string, format: uuid }
        caseKey:
          type: string
          nullable: true
          example: TC-42
          description: |
            Beside the id — a mapping list is read to answer "which case does this point at", and
            an id is not an answer a person can check. Null when the case has since been deleted,
            which is a row somebody has to see in order to remove it.
        confirmedBy:
          type: string
          format: uuid
          nullable: true
          description: Who vouched for it — the whole value of the row.
        confirmedAt: { type: string, format: date-time }

    TestRun:
      type: object
      required: [id, key, name, planId, planKey, configuration, status, releaseVersion, buildNumber, source, startedAt, completedAt, counts]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: TR-1 }
        name: { type: string }
        planId: { type: string, format: uuid, nullable: true }
        planKey: { type: string, nullable: true }
        configuration: { $ref: '#/components/schemas/Configuration' }
        status: { type: string, enum: [NOT_STARTED, IN_PROGRESS, COMPLETED, ABORTED] }
        releaseVersion: { type: string, nullable: true }
        buildNumber: { type: string, nullable: true }
        source: { type: string, enum: [MANUAL, INGESTED] }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        counts: { $ref: '#/components/schemas/ResultCounts' }

    TestPlanCloneInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            The new plan's name. **Required** — see the operation for why the server does not
            default it to `Copy of <name>`.

    TestRunCloneInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: The new run's name. **Required**, and not defaulted server-side.
        configurationId:
          type: string
          format: uuid
          nullable: true
          description: Overrides the source's configuration. Omitted keeps it.
        releaseVersion:
          type: string
          nullable: true
          description: |
            Overrides the source's release version — the field this operation mostly exists
            for. Omitted keeps the source's, which is rarely what a re-run wants.
        buildNumber:
          type: string
          nullable: true
          description: Overrides the source's build number. Omitted keeps it.
        assigneeId:
          type: string
          format: uuid
          nullable: true
          description: |
            Assigns the whole new checklist. **There is no fallback to the source**: a run has
            no assignee — the column is on `test_execution`, one per case — so omitting this
            produces an unassigned checklist rather than a copy of somebody's.
        overrideApprovalGate:
          type: boolean
          nullable: true
          description: |
            §6g's documented lead override, for **this** request. It is never inherited from
            the source run: nothing stores it there, and a clone that carried it forward
            would turn a documented one-off into a permanent exemption.

    TestRunInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        planId: { type: string, format: uuid, nullable: true }
        configurationId: { type: string, format: uuid, nullable: true }
        releaseVersion: { type: string, nullable: true }
        buildNumber: { type: string, nullable: true }
        caseIds:
          type: array
          items: { type: string, format: uuid }
          description: |
            Named cases. Every id must be a live case *in this project* — one from a sibling
            project satisfies the foreign key, the company column and RLS alike, so only this
            check refuses it, and it is a field error rather than a silent drop.
        suiteIds:
          type: array
          items: { type: string, format: uuid }
          description: |
            Whole suites, resolved through the membership `GET /suites` describes — filed,
            added individually, and matched by the suite's own tag rules. Not "the cases filed
            under it": a suite defined entirely by a tag rule would otherwise resolve to
            nothing and create a run of zero cases, reported as a success.

            Live suites in this project, on `caseIds`' terms and for its reason.
        tags:
          type: array
          items: { type: string, maxLength: 60 }
          description: |
            Every live case carrying **any** of these — union, not intersection; see the
            operation's own description for why this points the opposite way from
            `GET /cases?tag=`.

            Matched exactly, and an unknown tag is not an error: there is no vocabulary to
            check it against, and a run that also names a suite is not wrong because one of
            its tags is unused. What *is* refused is the run resolving to nothing at all.
        assigneeId: { type: string, format: uuid, nullable: true }
        overrideApprovalGate:
          type: boolean
          default: false
          description: |
            §6g's "documented lead override for the 2am release" (§82) — the one property here
            that is not a property of the run. It is a statement about this request, so nothing
            on the run stores it and the audit row does.

            Consulted only where `requireApprovedCaseForRun` would otherwise refuse the create,
            and only for a caller already holding `case:approve` — who could reach this exact
            run today by approving the cases first, which is why no new permission key was
            invented for it. It can never widen reach and never turns an acceptable request
            into a refused one; a caller who sets it without the key gets the same 409.

    TestRunDetail:
      allOf:
        - $ref: '#/components/schemas/TestRun'
        - type: object
          required: [executions]
          properties:
            executions:
              type: array
              items: { $ref: '#/components/schemas/TestExecutionSummary' }

    ResultCounts:
      type: object
      description: Counts, never percentages — the denominator toggle needs both (plan §6p).
      required: [passed, failed, blocked, skipped, notRun, total]
      properties:
        passed: { type: integer }
        failed: { type: integer }
        blocked: { type: integer }
        skipped: { type: integer }
        notRun: { type: integer }
        total: { type: integer }

    TestExecutionSummary:
      type: object
      description: |
        The case x run instance. Deliberately has NO display key (plan §6t): an execution is
        always reached through its run or its case, nobody says "TE-4038" out loud, and a
        per-execution counter would be the highest-volume contention point in the schema for no
        benefit. Identified by its UUID, or by (runId, caseId).
      required: [id, caseId, caseKey, caseTitle, caseVersionNo, status, assignee, executedBy, executedAt, durationMs, defects]
      properties:
        id: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        caseKey: { type: string }
        caseTitle: { type: string }
        caseVersionNo: { type: integer }
        status:
          allOf: [{ $ref: '#/components/schemas/CaseStatus' }]
          nullable: true
        # Both nullable, and both were declared as a bare $ref — which openapi-typescript
        # renders non-nullable, so the generated type claimed every execution has an assignee
        # and an executor. `test_execution.assignee_id` and `executed_by` are both nullable
        # columns and both states are ordinary: an unassigned execution, and one ingested from
        # CI where `executed_by_token` is set instead. Same correction §37 made to
        # `EntityVersion.createdBy`, and the same `allOf` + `nullable: true` idiom.
        assignee:
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
        executedBy:
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
        executedAt: { type: string, format: date-time, nullable: true }
        durationMs: { type: integer, nullable: true }
        defects:
          type: array
          items: { $ref: '#/components/schemas/DefectLink' }

    TestExecution:
      allOf:
        - $ref: '#/components/schemas/TestExecutionSummary'
        - type: object
          required: [comment, releaseVersion, stepFormat, preconditions, postconditions, steps, evidence, lockVersion]
          properties:
            comment: { type: string, nullable: true }
            releaseVersion: { type: string, nullable: true }
            stepFormat: { $ref: '#/components/schemas/StepFormat' }
            preconditions:
              type: array
              items: { $ref: '#/components/schemas/CaseConditionRef' }
            postconditions:
              type: array
              items: { $ref: '#/components/schemas/CaseConditionRef' }
            steps:
              type: array
              items: { $ref: '#/components/schemas/StepResult' }
            evidence:
              type: array
              items: { $ref: '#/components/schemas/Evidence' }
            lockVersion: { type: integer }

    StepResult:
      type: object
      description: |
        One step of the **pinned** case version, with whatever result has been recorded against
        it. The step fields are history and the result fields are current — which is why they
        share a shape rather than being two lists the client has to join by `stepId`.
      required: [stepId, position, keyword, action, testData, expectedResult, statusId, comment, evidence]
      properties:
        stepId: { type: string, format: uuid }
        position: { type: integer }
        keyword: { type: string, nullable: true }
        action: { type: string }
        testData: { type: string, nullable: true }
        expectedResult: { type: string, nullable: true }
        statusId: { type: string, format: uuid, nullable: true }
        comment: { type: string, nullable: true }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/Evidence' }

    Evidence:
      type: object
      required: [id, filename, contentType, sizeBytes, url, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer }
        url: { type: string }
        thumbnailUrl: { type: string, nullable: true }
        caption: { type: string, nullable: true }
        createdBy:
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
          description: |
            **Nullable, and that is load-bearing.** `evidence.created_by` has no `NOT NULL` and no
            foreign key, so a row written before authorship was recorded has no author — and
            `evidence:delete`'s `OWN` qualifier answers such a row **false**: a grant covering
            "your own work" must not stretch to work nobody can attribute.

            The client must therefore be able to see the *absence* rather than infer it. A
            non-nullable declaration here would make the SPA collapse "no author" into "some
            author", which is the arm the whole qualifier turns on. Same shape as
            `TestCaseSummary.createdBy` (§66).
        createdAt: { type: string, format: date-time }

    ExecutionResultInput:
      type: object
      description: |
        **No `lockVersion` field.** The version the client read is a precondition, and it
        travels as `If-Match` — see that parameter for why a body field would be a value on an
        input schema that must never be persisted. The SPA sent one in the body for as long as
        no server read it, which is the divergence class this schema exists not to repeat.
      required: [statusId]
      properties:
        statusId:
          type: string
          format: uuid
          description: |
            Required: this endpoint records a verdict. A status outside the project's own
            vocabulary is a 400 on this field.
        comment: { type: string, nullable: true }
        stepResults:
          type: array
          description: |
            Optional and partial — a step absent from the list keeps whatever it had. A
            `stepId` that is not a step of the **pinned** case version is a 400 on the field
            rather than an ignored entry: silently dropping it is a save that reports success
            and discards what the tester marked.
          items:
            type: object
            required: [stepId, statusId]
            properties:
              stepId: { type: string, format: uuid }
              statusId: { type: string, format: uuid }
              comment: { type: string, nullable: true }

    DefectLink:
      type: object
      required: [id, externalKey, provider, url]
      properties:
        id: { type: string, format: uuid }
        externalKey: { type: string, example: 'PAY-991' }
        provider: { type: string, example: JIRA }
        url: { type: string }
        statusCache: { type: string, nullable: true }

    # ----------------------------------------------------------- history ---
    CaseHistorySummary:
      type: object
      description: |
        Defaults to the CURRENT version only, and says so — blending results across
        versions reports a number nobody should act on (plan §6p).
      required: [scope, currentVersionNo, executions, passed, failed]
      properties:
        scope: { type: string, example: 'Current version (v7)' }
        currentVersionNo: { type: integer }
        executions: { type: integer }
        passed: { type: integer }
        failed: { type: integer }
        lastExecutedAt: { type: string, format: date-time, nullable: true }
        flakinessScore:
          type: number
          nullable: true
          description: Alternation WITHIN one version and configuration only (plan §6p).
        firstFailedAt: { type: string, format: date-time, nullable: true }
        firstFailedInRelease: { type: string, nullable: true }

    ExecutionHistoryEntry:
      type: object
      required: [executionId, statusKind, statusName, statusColor, caseVersionNo, runId, runKey, runName, runDeleted, configuration, executedBy, source, executedAt, evidenceCount, defects]
      properties:
        executionId: { type: string, format: uuid }
        statusKind: { $ref: '#/components/schemas/StatusKind' }
        statusName: { type: string }
        statusColor: { type: string }
        caseVersionNo: { type: integer }
        releaseVersion: { type: string, nullable: true }
        buildNumber: { type: string, nullable: true }
        runId: { type: string, format: uuid }
        runKey: { type: string }
        runName: { type: string }
        runDeleted:
          type: boolean
          description: |
            The run holding this result has been withdrawn. The entry stays — plan §6p: "deleted
            runs must not orphan history … with the entry marked rather than vanishing", and
            history that quietly loses rows is worse than no history.

            This is the field that makes that rule expressible, and it is required because the
            alternative reading of an absent flag is "not deleted", which is the dangerous default:
            a withdrawn failure would read as a live one. A client MUST mark the entry and MUST NOT
            offer navigation into the run, which answers 404.

            Note the contrast with the plan-statistics endpoint, which EXCLUDES deleted runs
            entirely: that one reports current state, where counting a retracted result would
            restore it. A timeline is the other case.
          example: false
        planKey: { type: string, nullable: true }
        configuration: { type: string }
        executedBy:
          # Nullable for two independent reasons, both reachable: test_execution.executed_by is a
          # nullable column (an execution row nobody has recorded yet has none), and the id has no
          # cascade, so "the account that recorded this has since been removed" is a state real rows
          # reach. The SPA has always guarded this with `entry.executedBy?.displayName` — the type
          # said it could not be null while the only consumer assumed it could.
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
        executedByToken: { type: string, nullable: true }
        source: { type: string, enum: [MANUAL, INGESTED] }
        executedAt: { type: string, format: date-time }
        durationMs: { type: integer, nullable: true }
        evidenceCount: { type: integer }
        defects:
          type: array
          items: { $ref: '#/components/schemas/DefectLink' }

    SuiteHistoryResponse:
      description: |
        A NAMED schema rather than an inline object on the operation, and that is the point of it.
        Inline, the SPA typed its own `{ runs, versionMarkers }` literal at the call site — and
        called the array `runs` while this contract called it `entries`. Nothing compared the two
        spellings, because a hand-written type argument is not generated from anything. Named, the
        SPA imports `SuiteHistoryResponse` and the compiler is the comparison (§52).
      type: object
      # Both arrays are always sent; empty is the answer for a suite with no history, and an
      # absent array would make the page unable to tell "none" from "not loaded".
      required: [entries, versionMarkers, computedAt]
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/SuiteRunSummary' }
        versionMarkers:
          type: array
          items: { $ref: '#/components/schemas/VersionMarker' }
        computedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            When the pre-aggregated `suite_run_summary` rollup these figures come from was last
            written (§6p, §101). **Null means the answer was computed live**, from the executions
            themselves, and is therefore current as of this request — a positive statement, not a
            missing value. A suite whose runs are all newer than the last rollup tick answers null.

            Required rather than optional precisely because the two readings must be
            distinguishable: an absent field would be indistinguishable from a live answer by a
            client that has not been updated, which is the wrong direction to fail in.

    SuiteRunSummary:
      type: object
      required: [runId, runKey, runName, suiteVersionNo, configuration, executedAt, counts, runDeleted]
      properties:
        runId: { type: string, format: uuid }
        runKey: { type: string }
        runName: { type: string }
        suiteVersionNo: { type: integer }
        configuration: { type: string }
        releaseVersion: { type: string, nullable: true }
        executedAt:
          type: string
          format: date-time
          description: |
            The most recent result recorded against this suite in this run, falling back to the
            run's own start when nothing in the suite has been executed yet — a run that has
            opened but recorded nothing is still history ("this suite is in flight"), and the
            page sorts by this field, so it cannot be null.
        counts: { $ref: '#/components/schemas/ResultCounts' }
        runDeleted:
          type: boolean
          description: |
            The run was soft-deleted. §6p: deleted runs must not orphan history — the entry stays
            and is marked, because history that quietly loses rows is worse than no history. Same
            field, same reason, as `ExecutionHistoryEntry.runDeleted` (§49).

    # --------------------------------------------------------- reporting ---
    RepositoryDashboard:
      type: object
      required:
        [generatedAt, lifecycle, health, healthComputedAt, byFeature, byOwner,
         automationCoverage, recentActivity]
      properties:
        generatedAt: { type: string, format: date-time }
        lifecycle:
          type: array
          items: { $ref: '#/components/schemas/DashboardTile' }
        health:
          type: array
          items: { $ref: '#/components/schemas/DashboardTile' }
        healthComputedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            When these signals were last derived, or **null when they never have been**.
            The two are not the same and must not render the same: an empty `health` array
            with a timestamp means "nothing is wrong", while one with `null` means "nobody
            has looked". `case_health` is a read model with no writer yet (plan §6o), so
            this is null in every deployment today — and a "Needs attention" panel that
            renders empty without saying so is the reassuring-but-false screen §6p exists
            to prevent.
        byFeature:
          type: array
          items: { $ref: '#/components/schemas/DashboardBreakdown' }
        byOwner:
          type: array
          items: { $ref: '#/components/schemas/DashboardBreakdown' }
        automationCoverage:
          type: object
          required: [automated, toBeAutomated, manual, notAutomatable, coveragePercent]
          properties:
            automated: { type: integer }
            toBeAutomated: { type: integer }
            manual: { type: integer }
            notAutomatable: { type: integer }
            coveragePercent:
              type: number
              description: automated / (total - notAutomatable) — honestly denominated (plan §6c).
        recentActivity:
          description: |
            Thirty days ending today, UTC, one point per day including days with no
            activity. **There is deliberately no `approved` series.** Nothing in the schema
            records *when* a case was approved — `test_case.lifecycle_status` is current
            state, and `audit_event.changes` carries the version number rather than a field
            diff by design — so the series could only ever be zero, and a flat zero line
            states "nobody approved anything this month" about a client's work rather than
            "this is not measured". It returns when the review workflow (§6g) gives
            approval a timestamp to count.
          type: array
          items:
            type: object
            required: [date, created, modified]
            properties:
              date: { type: string, format: date }
              created: { type: integer }
              modified: { type: integer }

    DashboardTile:
      type: object
      description: |
        `filter` is the query that reproduces this count — the tile is a link into
        a pre-filtered, bulk-actionable case list, not decoration (plan §6o).
      required: [key, label, count, severity, filter]
      properties:
        key: { type: string }
        label: { type: string }
        count: { type: integer }
        severity: { type: string, enum: [NEUTRAL, INFO, WARNING, ERROR] }
        filter:
          type: object
          additionalProperties: true

    DashboardBreakdown:
      type: object
      required: [id, label, segments]
      properties:
        id: { type: string }
        label: { type: string }
        segments:
          type: array
          items:
            type: object
            required: [key, label, count, color, filter]
            properties:
              key: { type: string }
              label: { type: string }
              count: { type: integer }
              color: { type: string }
              filter:
                type: object
                additionalProperties: true

    PlanStatistics:
      type: object
      required: [planId, planKey, planName, planVersionNo, aggregationPolicy, counts, coveragePercent, stale, computedAt, byConfiguration, bySuite, blockers, notRun, exitCriteria, trend]
      properties:
        planId: { type: string, format: uuid }
        planKey: { type: string }
        planName: { type: string }
        planVersionNo: { type: integer }
        aggregationPolicy: { $ref: '#/components/schemas/AggregationPolicy' }
        counts: { $ref: '#/components/schemas/ResultCounts' }
        coveragePercent:
          type: number
          description: |
            Distinct in-scope cases carrying any result, over every case in scope, times 100.
            A headline figure, not a footnote — 89% pass over 40% coverage is not green
            (plan §6p). Independent of `aggregation`: a case is covered or it is not,
            whichever way its several results resolve to one.
        latestExecutionAt: { type: string, format: date-time, nullable: true }
        stale:
          type: boolean
          description: |
            **Nothing has been executed against this plan in 14 days.** Plan §6p: "a plan page
            showing 94% from three weeks ago, presented as current, is the most dangerous screen
            in the product". False for a plan with no results at all, which is un-started rather
            than stale, and the `counts.total == counts.notRun` branch already says so in
            plainer words.

            ~~Not a freshness warning about the figures themselves, which are computed per
            request.~~ → **superseded 2026-08-06 (§101)**: the figures are no longer always
            computed per request, so the clause that distinguished the two is now `computedAt`
            rather than that sentence. The distinction it drew still holds and is now the reason
            there are two fields — `stale` is about the **executions**, `computedAt` is about the
            **arithmetic**. A plan executed an hour ago and rolled up ten minutes ago is fresh by
            one measure and ten minutes behind by the other, and a client that renders them as one
            signal has reintroduced the ambiguity §6p wrote the sentence to remove.
        computedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            When the pre-aggregated `plan_snapshot` rollup these figures come from was last
            written (§6p, §101). **Null means the answer was computed live** and is current as of
            this request — a positive statement, not a missing value.

            Live is the answer for the `WORST` and `ALL` aggregation policies, which a
            latest-result-per-case rollup **structurally cannot serve**: each needs every
            execution, and this table keeps one row per case per configuration. `LATEST` and
            `LATEST_PER_CONFIG` are served from the rollup. It is also the answer for a plan whose
            rollup has not been written yet, which is every plan for up to one scheduler tick
            after its first result.

            That the same screen answers from two sources depending on a dropdown is exactly why
            this field is required and not inferred: two staleness behaviours with no way to tell
            them apart is §65's two-contradictory-percentages defect with the contradiction hidden.
        byConfiguration:
          type: array
          items:
            type: object
            required: [configuration, counts]
            properties:
              configuration: { type: string }
              counts: { $ref: '#/components/schemas/ResultCounts' }
        bySuite:
          type: array
          items:
            type: object
            required: [suiteId, suiteKey, suiteName, counts]
            # All three are nullable together: one row groups the in-scope cases filed in NO
            # suite. Omitting that row instead would make this breakdown stop summing to the
            # headline counts above it — two numbers on one screen with nothing to identify the
            # wrong one, which is the defect this file already records on the suite tree.
            properties:
              suiteId: { type: string, format: uuid, nullable: true }
              suiteKey: { type: string, nullable: true }
              suiteName: { type: string, nullable: true }
              counts: { $ref: '#/components/schemas/ResultCounts' }
        blockers:
          type: array
          items: { $ref: '#/components/schemas/TestExecutionSummary' }
        notRun:
          # Was TestCaseSummary until M2 slice 3, and narrowing it was the price of keeping
          # the `execution` -> `repository` seam one class wide. TestCaseSummary requires
          # features, tags, healthSignals, automationStatus, owner and updatedAt — none of
          # which this panel renders, and every one of which would have to be re-derived
          # here from case_classification, case_tag, case_health and app_user, duplicating
          # repository.CaseSummaries inside a module forbidden to import it.
          type: array
          items: { $ref: '#/components/schemas/PlanCaseRef' }
        exitCriteria:
          type: array
          items: { $ref: '#/components/schemas/Criterion' }
        trend:
          type: array
          items:
            type: object
            required: [runKey, executedAt, passRate]
            properties:
              runKey: { type: string }
              executedAt: { type: string, format: date-time }
              passRate: { type: number }

    PlanCaseRef:
      type: object
      description: |
        A case named in a plan's scope, carrying only what a plan-level list renders.
        Deliberately not TestCaseSummary: the `execution` module may not read the
        repository's tables except through one seam class (ERD §0.2), and every field
        beyond these six would widen that seam to serve a panel that shows a key, a
        title and a suite name.
      required: [id, key, keySeq, title, suiteId, suiteName]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: TC-1 }
        keySeq:
          type: integer
          description: Sort by this — text keys do not order correctly (TC-10000 < TC-9999).
        title: { type: string }
        # Nullable together — an in-scope case filed in no suite. Required still, because the
        # panel renders a "not filed" label rather than a blank column.
        suiteId: { type: string, format: uuid, nullable: true }
        suiteName: { type: string, nullable: true }

    ReportDefinition:
      type: object
      required: [id, type, name, parameters, owner]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        name: { type: string }
        parameters:
          type: object
          additionalProperties: true
        owner: { $ref: '#/components/schemas/UserRef' }

    ReportDefinitionInput:
      type: object
      required: [type, name]
      properties:
        type:
          type: string
          example: run_summary
          description: |
            One of the types this server can compute — the same open set `generate` takes, checked
            the same way and refused in the same words.
        name:
          type: string
          description: What the person will recognise it by. Required, non-blank; not unique.
        parameters:
          type: object
          additionalProperties: true
          description: |
            The saved selection, defaulting to `{}` when absent. **Not validated against the report
            type**, deliberately: a definition is edited over several releases and a parameter that
            becomes required later would make an existing saved report unsaveable, while the
            *generate* it feeds refuses a bad selection with the report's own sentence at the
            moment it is used.

    ReportJob:
      type: object
      # Every field is required, and three of them are nullable — always present, sometimes null.
      # A poller reads `status` to decide whether to keep polling and must not have to null-check
      # the field it polls on, nor guess whether an absent `error` means "no error" or "this server
      # does not send one".
      required: [jobId, type, status, format, downloadUrl, modelUrl, error]
      properties:
        jobId: { type: string, format: uuid }
        type:
          type: string
          description: The report that was asked for, echoed back. See the generate operation.
        status: { type: string, enum: [PENDING, RUNNING, COMPLETED, FAILED] }
        format: { type: string }
        downloadUrl:
          type: string
          nullable: true
          description: |
            Where the rendered artifact is, in the format that was asked for. Null until the job
            reaches COMPLETED, and null for ever on a FAILED one.

            **Server-supplied, never composed by the client.** The route it points at is
            `GET /projects/{projectId}/reports/artifacts/{artifactId}/content`, and a client that
            built that string itself would be holding a second copy of the server's routing —
            which is what makes moving the route a breaking change nothing detects (§67, on
            `Evidence.url`).
        modelUrl:
          type: string
          nullable: true
          description: |
            Where the serialized report **model** is — the same JSON the on-screen view renders,
            written for every job alongside whatever format was asked for.

            This is what makes the screen and the export provably one model rather than two
            computations that can disagree (plan §6e: "the on-screen report view consumes the same
            model via JSON, so what you see is what exports"). When `format` is itself JSON both
            fields point at the same artifact.

            **Shape (§88):** `{ header, report }`. `header` is the provenance block §6e makes
            mandatory — report type, company, project scope and what that scope means for the
            numbers, who generated it, when, and the complete selection as it was sent. `report` is
            `{ title, metadata, sections }`. The on-screen view must render the header it finds here
            rather than assembling one from the job row: two assemblies of one header is the drift
            the single-model design exists to prevent.
        error:
          type: string
          nullable: true
          description: |
            Why a FAILED job failed, in a sentence written to be shown to the person who asked.
            Null in every other state.

            Report-specific parameter faults surface here rather than as a 400 — a `runId` naming
            a run in another project cannot be checked without reading the database, and doing so
            on the request path would mean a second copy of every report's parameter rules. What
            the request *can* refuse, it refuses with a 400: see the generate operation.

    # ----------------------------------------------------- documentation ---
    DocPageSummary:
      type: object
      required: [id, key, title, slug, status, updatedAt]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: DOC-1 }
        parentId: { type: string, format: uuid, nullable: true }
        title: { type: string }
        slug: { type: string }
        status: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] }
        updatedAt: { type: string, format: date-time }
        # The page's subject, when it is *about* another artifact rather than free-standing.
        #
        # An opaque pair — no foreign key, and the server joins on it nowhere. That is what lets one
        # page type serve several artifact kinds, and it is the only shape available here: a test
        # plan lives in `execution`, which `documentation` may not depend on and which may not
        # depend on `documentation` either, so neither side can hold a column pointing at the other.
        # `Review`'s subject triple is the same decision for the same reason.
        #
        # Null on an ordinary page, which is nearly all of them.
        subjectType: { type: string, enum: [TEST_PLAN], nullable: true }
        subjectId: { type: string, format: uuid, nullable: true }

    DocPage:
      allOf:
        - $ref: '#/components/schemas/DocPageSummary'
        - type: object
          # `required` does not descend through allOf, so this branch declares its own — the same
          # repair TestCase and TestPlan already carry. Without it `lockVersion` cannot be sent as
          # If-Match without a null check on a value every response has.
          required: [blocks, attachments, currentVersionNo, lockVersion]
          properties:
            blocks:
              type: array
              items: { $ref: '#/components/schemas/DocBlock' }
            attachments:
              type: array
              items: { $ref: '#/components/schemas/Attachment' }
              description: |
                Files on the page — the wireframe, the signed-off mock-up, the data sheet the
                paragraphs describe. `attachment.owner_type = 'DOC_PAGE'`, which `V1` declared
                and nothing wrote until decision round 3's #49.

                **Detail-only**, like `TestCase.attachments`: `DocPageSummary` has no such
                field, because the tree renders every page in the project and none of those
                rows show a file.

                Never null. A page with no files and a page nobody has attached to are the
                same page, so unlike the `flake` on a case there is no third state to express
                and a nullable list would be two spellings of nothing.

                Written and removed through the endpoints below, both costing **`doc:edit`** —
                an attachment is *content*, so whoever may rewrite the paragraphs may attach
                the diagram they describe. Not `doc:publish`, which would leave a Test
                Engineer able to author a specification they could not illustrate.
            currentVersionNo: { type: integer }
            lockVersion: { type: integer }

    DocBlock:
      type: object
      required: [id, position, blockType, text]
      properties:
        id:
          type: string
          format: uuid
          description: |
            Immutable, generated at creation, never derived from text. Links target
            this — heading-text anchors break silently when a typo is fixed (plan §6i).
        position: { type: integer }
        blockType: { type: string, enum: [heading, paragraph, list, code, table, image] }
        level:
          type: integer
          nullable: true
          description: |
            Heading depth on a `heading`; **indent depth on a `list`**; null on every other type.
        text: { type: string }
        rows:
          description: |
            A `table` block's cells, row-major. Null on every other type.

            **The first row is the header, always, and there is no flag saying so.** A boolean
            would have two states that look identical in an editor and differ only in what a
            screen reader announces for every cell below — so it gets set wrong and nothing
            reports it. A table in a specification whose columns are unnamed is one where a
            reader cannot tell what a cell means; if a table genuinely has no header, its first
            row names the columns anyway.

            Every row has the same length — the server refuses a ragged one rather than padding
            it, because a padded table cannot say which cell was missing.

            `text` on a `table` is the **caption**, and it is what the coverage matrix reads as
            the block's statement. The cells are data, not requirements.
          type: array
          nullable: true
          items:
            type: array
            items: { type: string }
        attachmentId:
          description: |
            An `image` block's file — an attachment **on this page** (`DocPage.attachments`).
            Null on every other type.

            A block does not carry the bytes or the URL: it names a file the page already
            holds, so the image has one owner, one delete path and one 10 MB ceiling. Removing
            that attachment while a block names it is a `409`, not a broken image.

            `text` on an `image` is its **alt text** and may not be blank — an image in a
            specification is never decorative, and the words are what a reader who cannot see it
            gets.
          type: string
          format: uuid
          nullable: true
        links:
          description: |
            What is linked to this block — the reverse of `TestCase.relatedDocuments`, read from the
            same `doc_link` rows.

            Present and possibly empty, unlike `coverage`. The distinction is deliberate: this array
            says *which cases claim to verify this statement*, which the server knows exactly, and an
            empty one truthfully means nobody has claimed it. `coverage` would say how those cases
            are **doing**, which the server cannot answer here — see below.
          type: array
          items: { $ref: '#/components/schemas/BlockLink' }
        coverage:
          description: |
            Inline coverage marker — what makes people maintain links (plan §6i).

            **Still absent, and the reason has moved.** Until links could be created, no block had
            one to price. Now they can be, and the obstacle is the other half: `passed` / `failed` /
            `notRun` are `test_execution` joined to `test_case` — two modules `documentation` may not
            name — while `linkedCases` and `caseKeys` are answerable and are served on `links`
            instead. All five fields are required here, so a partial object is not available, and a
            zeroed one would print "Not tested" against a statement whose cases may all be green.
          type: object
          nullable: true
          required: [linkedCases, passed, failed, notRun, caseKeys]
          properties:
            linkedCases: { type: integer }
            passed: { type: integer }
            failed: { type: integer }
            notRun: { type: integer }
            caseKeys:
              type: array
              items: { type: string }

    DocPageInput:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 200 }
        parentId:
          type: string
          format: uuid
          nullable: true
          description: |
            The page this one nests under, or null for a root page. Accepted on create; on a
            `PATCH` it must match the page's current parent — a different value is a `400` rather
            than a silently ignored field, because reparenting rewrites every descendant's `path`
            and a client must not be able to believe a move happened. Same rule, and the same
            reason, as `ClassificationValueInput.parentId`. (It was `SuiteInput.parentId`'s twin
            until §98 flattened suites; the doc tree and the classification tree are unaffected —
            §98 is about suites and nothing else, and a page genuinely nests.)
        blocks:
          type: array
          description: |
            The page's whole content, in array order — `position` is not sent, because two clients
            disagreeing about the numbers is a reordering nobody asked for.

            Omitted on a create means an empty page, which is a real and useful state. Omitted on a
            `PATCH` leaves the blocks alone: that is a retitle, and it must not be a way to empty a
            page by forgetting a field.
          items: { $ref: '#/components/schemas/DocBlockInput' }

    DocBlockInput:
      type: object
      required: [blockType, text]
      properties:
        id:
          type: string
          format: uuid
          nullable: true
          description: |
            The id of an existing block on this page, to edit it **in place**. Absent means a new
            block, whose id the server generates.

            This field is what makes traceability survive editing: a block keeps its id however
            much its text changes, so a link to it does not break when somebody fixes a typo
            (plan §6i/§6m). Sending an id belonging to another page — or to no block — is a `400`.
        blockType: { type: string, enum: [heading, paragraph, list, code, table, image] }
        level:
          type: integer
          nullable: true
          minimum: 1
          maximum: 6
          description: |
            Depth. **Three arms, not two** — required for `heading`, where it is the heading level;
            optional for `list`, where it is the bullet's indent depth and defaults to `1`; refused
            on every other type, because a level on a paragraph means the client believes it is
            sending something else.

            A list's depth is a field rather than markers typed into `text` (`1.` / `a.` / `i.`)
            because a nested test-scenario outline is the shape a test plan is mostly made of, and
            an outline encoded in prose cannot be indented, renumbered, or — the reason that
            settles it — **linked**: a `doc_link` targets a block, so a scenario a case can verify
            has to be its own block rather than a line inside one.
        text: { type: string }
        rows:
          description: |
            Required on a `table` and refused on every other type, for `level`'s reason: rows on
            a paragraph mean the client believes it is sending a table.

            At least one row, at most 100, at most 12 columns, every row the same length, every
            cell present and at most 500 characters. The bounds are product rules rather than
            schema ones — a table wider than a dozen columns is a data extract rather than a
            specification, and a cell longer than a sentence is a paragraph that should have
            been its own block so a case could link to it.

            The first row is the header. See `DocBlock.rows`.
          type: array
          nullable: true
          maxItems: 100
          items:
            type: array
            maxItems: 12
            items: { type: string, maxLength: 500 }
        attachmentId:
          description: |
            Required on an `image` and refused on every other type.

            Must name a file already attached to **this** page. A `400` otherwise, for
            `parentId`'s reason: an unchecked id would let a block reference another page's
            file, which every read then fails to resolve — a block created successfully and
            immediately broken.

            **A create can never carry one.** A page has no attachments until it exists, so an
            image block is added by a second save: create the page, attach the file, reference
            it. The refusal says that rather than reporting the id as unknown.
          type: string
          format: uuid
          nullable: true

    PlanDocumentLinkInput:
      type: object
      required: [pageId]
      properties:
        pageId:
          type: string
          format: uuid
          description: |
            A page **of this project**. One belonging to a sibling project is a `404` for
            `BlockLinkInput.sourceId`'s reason — RLS reaches across the company, so the project
            predicate is what refuses it, and a distinguishing error would confirm the page exists.

    DocPageStatusInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] }

    RunStatusInput:
      type: object
      required: [status]
      properties:
        # All four values, not only the two terminal ones: the live pair is how a run is reopened,
        # and the server normalizes between them rather than trusting which one the client sent.
        status: { type: string, enum: [NOT_STARTED, IN_PROGRESS, COMPLETED, ABORTED] }

    BlockLink:
      type: object
      description: |
        One `doc_link` seen from the **block** end: what claims to verify this statement.

        `DocLink` is the same row seen from the case end, and the two are not merged. Each names the
        thing at the *other* end and omits the thing the reader already has — a case's view carries
        the page and block, a block's view carries the case — so a merged schema would be half-null
        in both directions and would let a client read the field that happens to be populated
        without noticing which end it is standing at.
      required: [id, sourceType, sourceId, sourceKey, sourceTitle, relationship]
      properties:
        id: { type: string, format: uuid }
        # DEFECT and DOC_PAGE are legal in the column and are not offered here: neither has a writer,
        # and enumerating a value nothing can produce makes a client branch on a case it will never
        # see. The column's CHECK stays wider than this enum on purpose.
        sourceType: { type: string, enum: [TEST_CASE, SUITE] }
        sourceId: { type: string, format: uuid }
        sourceKey: { type: string, example: TC-42 }
        sourceTitle: { type: string }
        relationship: { type: string, enum: [VERIFIES, DERIVED_FROM, REFERENCES] }

    BlockLinkInput:
      type: object
      required: [sourceType, sourceId]
      properties:
        sourceType: { type: string, enum: [TEST_CASE, SUITE] }
        sourceId:
          type: string
          format: uuid
          description: |
            A case or suite **of this project**. One belonging to a sibling project is a `404`, not a
            `400`: the row is reachable within the company, so a distinguishing error would answer
            "that case exists, elsewhere" to somebody who cannot see it.
        relationship:
          type: string
          enum: [VERIFIES, DERIVED_FROM, REFERENCES]
          default: VERIFIES
          description: |
            Defaults to `VERIFIES`, which is what a test case linked to a scenario means and what
            the column already defaults to.

    DocLink:
      type: object
      required: [id, targetKind, relationship, stale]
      properties:
        id: { type: string, format: uuid }
        targetKind: { type: string, enum: [DOC_BLOCK, EXTERNAL_GIT, EXTERNAL_URL] }
        relationship: { type: string, enum: [VERIFIES, DERIVED_FROM, REFERENCES] }
        pageId: { type: string, format: uuid, nullable: true }
        pageKey: { type: string, nullable: true }
        pageTitle: { type: string, nullable: true }
        blockId: { type: string, format: uuid, nullable: true }
        blockExcerpt: { type: string, nullable: true }
        externalRepo: { type: string, nullable: true }
        externalPath: { type: string, nullable: true }
        externalLineStart: { type: integer, nullable: true }
        externalLineEnd: { type: integer, nullable: true }
        externalCommitSha:
          type: string
          nullable: true
          description: Mandatory for EXTERNAL_GIT — a line number without it is meaningless later.
        externalUrl: { type: string, nullable: true }
        stale:
          type: boolean
          description: True when the target changed after the case was last touched (plan §6i).

    Artifact:
      type: object
      required: [id, scope, category, kind, title, status, inherited, updatedBy, updatedAt]
      properties:
        id: { type: string, format: uuid }
        scope: { type: string, enum: [PROJECT, PLAN] }
        category: { type: string }
        kind: { type: string, enum: [FILE, DOC_PAGE_REF, EXTERNAL_URL, GENERATED_REPORT] }
        title: { type: string }
        description: { type: string, nullable: true }
        status: { type: string, enum: [ACTIVE, SUPERSEDED, ARCHIVED] }
        inherited:
          type: boolean
          description: Project-scope artifact shown read-only inside a plan (plan §6n).
        url:
          type: string
          nullable: true
          description: |
            **Where this artifact points, whatever its kind.** The external link for
            `EXTERNAL_URL`, and — since the `FILE` kind got a writer — the download path for
            `FILE`. `null` for `DOC_PAGE_REF` (reached by `docPageId`) and `GENERATED_REPORT`.

            The server builds it rather than the client composing
            `/projects/{projectId}/artifacts/{artifactId}/content`: a composed path is a second
            place the route is spelled, and a route change then breaks the download with a `404`
            that reads as a missing file.

            **Read `kind` before following it.** One of these two values leaves the product for
            somebody else's site and the other does not, and nothing about the string says which.
        docPageId:
          type: string
          format: uuid
          nullable: true
          description: |
            Set when `kind` is `DOC_PAGE_REF`, so the register can link through to the page.

            Without it the kind plan §6n steers people toward is the one kind the reader cannot
            open — a row that says "Documentation page" and goes nowhere, while an `EXTERNAL_URL`
            beside it is clickable. That asymmetry would push people back to pasting links.
        filename:
          type: string
          nullable: true
          description: |
            The uploaded name, for `FILE` and `null` for every other kind. It was declared here
            with no writer behind it for three slices — the register renders a name and a size
            column for uploads — so nothing on either side changed shape when
            `POST /projects/{projectId}/artifacts/files` arrived.
        sizeBytes:
          type: integer
          format: int64
          nullable: true
          description: The stored size in bytes, for `FILE` and `null` otherwise.
        updatedBy: { $ref: '#/components/schemas/UserRef' }
        updatedAt: { type: string, format: date-time }

    ArtifactFileInput:
      type: object
      required: [scope, category, title]
      description: |
        The register fields beside an uploaded file — the `artifact` part of
        `POST /projects/{projectId}/artifacts/files`.

        **It carries no `kind`, no `url` and no `docPageId`**, and each omission removes a request
        that could otherwise be sent and would have to be refused. The kind is `FILE` by
        construction: there is no field to disagree with the endpoint the payload was sent to. That
        is `ArtifactInput.kind`'s own narrowing argument taken one step further — a client
        generating types from this contract cannot express the contradiction at all.

        Everything the two inputs share is validated by one server-side path, so a rule about
        titles or scopes cannot come out differently depending on which endpoint you reached it
        through.
      properties:
        scope:
          type: string
          enum: [PROJECT, PLAN]
          description: |
            As `ArtifactInput.scope`, including the qualifier: a Test Engineer may upload a cycle's
            sign-off (`PLAN`) and may not upload the project's test strategy (`PROJECT`). Bytes
            change nothing about who may write a row.
        planId:
          type: string
          format: uuid
          nullable: true
          description: Required when `scope` is `PLAN`, and rejected otherwise.
        category:
          type: string
          maxLength: 60
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000, nullable: true }

    ArtifactInput:
      type: object
      required: [scope, category, kind, title]
      description: |
        A registration. Which of `docPageId` / `url` is required is decided by `kind`, and which of
        `planId` is required is decided by `scope` — both are validated server-side and answered as
        a `400` naming the field, because a schema that expressed them as `oneOf` would generate a
        union the SPA has to discriminate before it can render one form.
      properties:
        scope:
          type: string
          enum: [PROJECT, PLAN]
          description: |
            `PLAN` requires `planId`. `PROJECT` requires it to be absent — a project-scope artifact
            is inherited by *every* plan (plan §6n), so a plan id on one would name a relationship
            that does not exist.

            This is also the field the permission qualifier reads: `artifact:edit` is held outright
            by a Test Lead and **plan-scope-only** by a Test Engineer, so a `PROJECT` here can be a
            `403` where a `PLAN` from the same caller is a `201`.
        planId:
          type: string
          format: uuid
          nullable: true
          description: Required when `scope` is `PLAN`, and rejected otherwise.
        category:
          type: string
          maxLength: 60
          description: |
            Strategy · TestData · Environment · SignOff · Compliance · Tooling · Template · Other
            (plan §6n). A free string rather than an enum because the list is described as
            project-configurable, and the register groups by it rather than switching on it.
        kind:
          type: string
          enum: [DOC_PAGE_REF, EXTERNAL_URL]
          description: |
            The two **reference** kinds. Narrower than `Artifact.kind` on purpose — see the
            operation description for why `FILE` and `GENERATED_REPORT` are not accepted here.
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000, nullable: true }
        docPageId:
          type: string
          format: uuid
          nullable: true
          description: |
            Required when `kind` is `DOC_PAGE_REF`. Must name a live page **in this project** — a
            page in another project of the same company is a `400`, and one in another company is
            the same `400` rather than a `404`, because distinguishing them would confirm the id
            names something real (§6t).
        url:
          type: string
          maxLength: 2000
          nullable: true
          description: |
            Required when `kind` is `EXTERNAL_URL`. Must be `http` or `https`: the register renders
            this as a link, and a `javascript:` or `data:` URL rendered as one is stored XSS with
            the product's own markup around it.

    # --------------------------------------------------------------- admin ---
    User:
      allOf:
        - $ref: '#/components/schemas/UserRef'
        - type: object
          required: [status, teams]
          properties:
            status: { type: string, enum: [ACTIVE, INVITED, DEACTIVATED] }
            lastLoginAt: { type: string, format: date-time, nullable: true }
            teams:
              type: array
              items: { type: string }

    UserInvitationInput:
      type: object
      required: [email, displayName]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          description: |
            Case-insensitive (`citext`). Matching an account that already exists on the instance
            reuses it silently — see the operation's description for why the answer must not
            differ.
        displayName:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            **This company's** name for the person (§6u), stored on the membership rather than on
            the account. A contractor is legitimately "A. Kotrulev" to one client and
            "Aleks (Vendor)" to another, and neither may see or overwrite the other's.
      description: |
        There is no `companyId` and no role. The company comes from the session's context (ERD
        §0.1 point 2), and what the person may *do* is a separate grant — `POST /role-assignments`
        — so that inviting somebody can never be the act that also gives them access.

    UserInvitation:
      type: object
      required: [user, issued, emailed, expiresAt]
      properties:
        user: { $ref: '#/components/schemas/User' }
        issued:
          type: boolean
          description: |
            Whether **this call minted a fresh activation link**. `false` means there was nothing
            to mint — the person is already an active member, or an unexpired invitation was
            outstanding and was deliberately left alone.

            It carries the same fact as `201` vs `200`, and it is on the body because the two
            reasons a link was not *sent* are not otherwise distinguishable: `emailed: false` with
            `issued: true` is "no relay on this install", and with `issued: false` it is "nothing
            needed sending". A client that infers the first from `emailed` alone tells an
            administrator with a perfectly good relay that their mail is broken, every time they
            click twice.
        emailed:
          type: boolean
          description: |
            Whether the activation link was handed to a configured SMTP relay. `false` means either
            that the instance has none and an operator must deliver the link by hand, or that
            nothing was minted to send — see `issued`. Never that the invitation failed.
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: |
            When the outstanding invitation lapses. **Null when there is nothing to accept** —
            the person is already an active member.
      description: |
        The activation link itself is deliberately **absent**. It is a live single-use secret with
        exactly one legitimate destination (the invitee's inbox); putting it in an API response
        publishes it to devtools, to any proxy log, and to whatever the SPA caches.

    ApiToken:
      type: object
      required:
        [id, name, tokenPrefix, ownerId, roleId, roleName, projectId, expiresAt, lastUsedAt,
         revokedAt, createdAt]
      description: |
        A non-human credential — **everything about it except the credential**. The secret appears
        exactly once, in the response to `POST /api-tokens`, and is unrecoverable afterwards.
      properties:
        id: { type: string, format: uuid }
        name:
          type: string
          description: |
            Unique among the company's **live** tokens. A revoked name is reusable, because the
            name is written into somebody's CI configuration and rotation is issue-then-revoke.
        tokenPrefix:
          type: string
          description: |
            The first 12 characters of the secret, so a row can be matched against a CI
            configuration. A deliberate partial disclosure of a 256-bit secret, and not a
            credential: nothing accepts it.
        ownerId:
          type: string
          format: uuid
          description: |
            The person answerable for it, and a **permission input** rather than provenance —
            their own grants cap what the token can do.
        roleId: { type: string, format: uuid }
        roleName:
          type: string
          description: |
            Expanded because a uuid tells an administrator nothing about what a leaked token could
            do. A label: nothing checks it, and the grant is resolved from `roleId`.
        projectId:
          type: string
          format: uuid
          nullable: true
          description: |
            One project, or null for every project the owner can reach. When set it is a **hard
            scope** — the token is inert on every other project.
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Null for a token that does not expire.
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            **Always null today.** The column exists and has no writer: a write on every
            authenticated request is a write-amplification decision that wants a batching answer,
            not an `UPDATE` inside a filter. On the wire so a client is built against the shape.
        revokedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            When the credential was withdrawn, or null while it is live. Revoked tokens stay in
            the list — see `GET /api-tokens`.
        createdAt: { type: string, format: date-time }

    ApiTokenInput:
      type: object
      required: [name, roleId, projectId, expiresAt]
      description: |
        **There is no `ownerId`.** The owner is the caller — see `POST /api-tokens` for why a
        nominated owner would be an escalation path rather than a convenience.
      properties:
        name:
          type: string
          maxLength: 120
          description: |
            What this token is for, in the issuer's words. A clash with another live token is a
            field error on `name`: two rows called "CI" are two rows nobody can tell apart when
            one has to be revoked in a hurry.
        roleId:
          type: string
          format: uuid
          description: |
            The role the token carries — **not the caller's own**. SYSTEM-scope roles are refused,
            and so is the membership baseline, which is a consequence of membership rather than a
            role anybody chooses.
        projectId:
          type: string
          format: uuid
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Must be in the future when present. Null means it does not expire — **except for an
            `Agent` token, where null is refused**: see the operation description.

    IssuedApiToken:
      type: object
      required: [token, secret]
      description: |
        The creation response, and **the only shape in this API that carries a secret**. Kept as
        its own type rather than a nullable field on `ApiToken`, so that no read path is one
        forgotten null away from serving a credential.
      properties:
        token: { $ref: '#/components/schemas/ApiToken' }
        secret:
          type: string
          description: |
            The plaintext, shown once. Store it in the CI system's secret store immediately; it
            cannot be recovered, and nothing here can show it again.

    Team:
      type: object
      required: [id, name, leads, members, projects]
      properties:
        id: { type: string, format: uuid }
        parentTeamId:
          type: string
          format: uuid
          nullable: true
          description: Org-chart structure only — permissions never cascade (plan §6k).
        name: { type: string }
        description: { type: string, nullable: true }
        leads:
          type: array
          items: { $ref: '#/components/schemas/UserRef' }
        members:
          type: array
          items: { $ref: '#/components/schemas/UserRef' }
        projects:
          type: array
          items:
            type: object
            # Same descent rule as CurrentUser.teams, which carries this comment already: a team's
            # project row exists BECAUSE it has a grant, so all three are always populated.
            required: [projectId, projectName, roleName]
            properties:
              projectId: { type: string, format: uuid }
              projectName: { type: string }
              roleName: { type: string }

    TeamInput:
      type: object
      description: |
        The editable half of a `Team` — everything `POST /teams` and `PUT /teams/{teamId}` decide.

        **The people are deliberately not in here.** Membership has its own URL per person
        (`PUT /teams/{teamId}/members/{userId}`), because the two writes answer to different
        failures: a name clash is about the team, and "that person is not in this company" is about
        one member. Folding a member list in would make a create partially succeed — the team
        exists, one of the five people named did not — with one status code to report it.
      required: [name, description, parentTeamId]
      properties:
        name:
          type: string
          maxLength: 200
          description: |
            Unique within the company, **compared case-insensitively** — "QA" and "qa" are the same
            team to everyone who reads the org chart. A clash is a field error on `name`.
        description:
          type: string
          nullable: true
          maxLength: 2000
        parentTeamId:
          type: string
          format: uuid
          nullable: true
          description: |
            `null` makes this a root team. Org-chart structure only — permissions never cascade
            through it (plan §6k), so this decides where the team is drawn and nothing about what
            anyone can do.

    TeamMemberInput:
      type: object
      description: The membership state being asserted for one person in one team.
      required: [lead]
      properties:
        lead:
          type: boolean
          description: |
            Whether they lead the team. A lead is a member with a flag, not a separate role — it is
            org-chart information, and it grants nothing. Somebody's capability in this product
            comes from a role assignment, never from leading a team.

    Role:
      type: object
      description: |
        A built-in role. There are no custom roles in v1 — not even clone-and-edit
        (plan §6b) — so `builtIn` is always true and there is no create or update
        endpoint. Enforcement is permission-based throughout: nothing in the code
        checks a role NAME, which is what keeps adding a role designer additive.

        A COMPANY-scope grant covers every project in that company, present and future.
        That is what makes Company Admin work, and why nothing else is granted there.

        **Seven names, and only five of them may be granted to a person.** Two are
        capability ceilings a *credential* carries: `Agent` (roles spec §A6a), and
        `Automation Service` (§A6), which has been documented as "attached to API
        tokens, never people" since M0 and was made non-assignable by `V41`. Both are
        listed here because the token-issue form is the only place either is ever
        chosen, and both are refused by `POST /role-assignments`. Filter this list by
        `assignable` when rendering a grant picker — see that field. The eighth seeded
        row, the `Company Member` membership baseline, is filtered out server-side and
        never appears here at all.
      required: [id, name, scope, builtIn, assignable, description, permissions]
      properties:
        id: { type: string, format: uuid }
        name:
          type: string
          enum:
            - Instance Admin
            - Company Admin
            - Test Lead
            - Test Engineer
            - Automation Service
            - Viewer
            - Agent
        scope: { type: string, enum: [SYSTEM, COMPANY, PROJECT] }
        builtIn: { type: boolean }
        assignable:
          type: boolean
          description: |
            Whether `POST /role-assignments` may grant this role to a person or a team.
            False for `Agent` and, since `V41`, for `Automation Service` — both carried by
            a token, neither held by anybody.

            It answers **one** question, and four that used to have the same answer have
            come apart: may a person hold it (this field), may a token carry it (both:
            yes), is it listed (both: yes, which is why you are reading this), and may an
            existing grant be revoked (**yes** — a grant made before the role became
            non-assignable is exactly what an administrator must be able to clean up, so
            those rows stay on `GET /role-assignments` and `DELETE` accepts them). A client
            that hides a role because it is non-assignable must do so in the grant pickers
            only — hiding it in the token form makes it unobtainable, and hiding it in the
            assignment list hides a Revoke somebody needs.

            Client-side filtering here is **affordance, not security**: the server refuses
            the grant regardless.
        description: { type: string }
        permissions:
          type: array
          description: |
            Permission keys, `resource:action`. The authoritative catalogue and the
            per-role grants live in docs/specs/2026-07-30-tcms-roles-permissions-naming.md.
            `OWN`-qualified entries (case:delete, evidence:delete for Test Engineer) are
            resolved server-side against createdBy — they are NOT separate keys.
          items: { $ref: '#/components/schemas/PermissionKey' }

    EffectivePermissions:
      type: object
      # `required` on BOTH fields, deliberately. The server always sends both — projectId
      # echoes the query parameter and is null when there wasn't one — and without the array
      # every generated property is optional, so a consumer must null-check a field that is
      # never absent and cannot tell "no permissions" from "no answer". That distinction is
      # the whole basis of the SPA's disable-don't-hide gate.
      required: [projectId, permissions]
      properties:
        projectId:
          type: string
          format: uuid
          nullable: true
          description: Echoes the query parameter. Null when the caller asked company-wide.
        permissions:
          type: array
          description: |
            Sorted by `key`, and possibly empty — an empty array is a real answer (a company
            member with no grant on this project), not a missing one.

            Entries carry a `qualifier` as well as a key. Until §65 this was an array of bare
            keys, and the omission had a cost the SPA could not work around: a Test Engineer
            holds `artifact:edit` at `PLAN_SCOPE`, so a keys-only answer says "held", the
            project-scope control enables, and the server refuses the submit. Disable-don't-hide
            (handoff §31) is not expressible against an answer that cannot say "held, but not
            here".
          items: { $ref: '#/components/schemas/HeldPermission' }

    HeldPermission:
      type: object
      # Both required. A held key ALWAYS has a qualifier — `ALL` is what an unqualified grant
      # stores, not an absence — so an optional `qualifier` would invite every consumer to
      # invent a default, and the two plausible defaults grant different things.
      required: [key, qualifier]
      properties:
        key: { $ref: '#/components/schemas/PermissionKey' }
        qualifier: { $ref: '#/components/schemas/PermissionQualifier' }

    PermissionQualifier:
      type: string
      description: |
        WHICH ROWS a held permission covers — roles spec §A5. The key says what the caller may
        do; this says what they may do it to.

        `NONE` is deliberately absent from this enum. A permission the caller does not hold is
        an absent entry in `permissions`, never a present one qualified to nothing — the same
        rule the database follows, where a grant of nothing is an absent row.

        The two restrictive values are NOT comparable: `OWN` restricts by who wrote the row,
        `PLAN_SCOPE` by what scope the row sits at, and neither contains the other. A caller
        cannot receive both for one key — no permission is granted with two different
        restrictive qualifiers, which the server asserts over its own catalogue.
      enum:
        # Every row in scope. What an unqualified grant means, and the great majority.
        - 'ALL'
        # Only rows the caller authored, in any state. Compared against the row's createdBy;
        # a row with no recorded author is NOT the caller's.
        - 'OWN'
        # Only rows belonging to one plan, whoever wrote them. A project-scope row is
        # inherited read-only by every plan, so editing one edits every cycle at once.
        - 'PLAN_SCOPE'

    PermissionKey:
      type: string
      description: |
        The full v1 catalogue. Grouped by area, in the order the spec lists them.
        Six of these are newer than the first UI pass — suite:delete, project:audit,
        case:comment, defect:create, workitem:manage, library:manage — and three split
        a boundary that was previously wrong (suite:delete out of suite:manage,
        project:audit out of audit:view, case:comment below the review tier).
      enum:
        # repository
        - 'suite:manage'
        - 'suite:delete'
        - 'case:read'
        - 'case:create'
        - 'case:edit'
        - 'case:delete'
        - 'library:manage'
        # review — three tiers: comment < review < approve
        - 'case:comment'
        - 'case:review'
        - 'suite:review'
        - 'plan:review'
        - 'case:approve'
        - 'suite:approve'
        - 'plan:approve'
        # execution
        - 'plan:create'
        - 'plan:edit'
        - 'plan:delete'
        - 'run:create'
        - 'run:execute'
        - 'run:close'
        - 'result:submit'
        - 'result:amend'
        - 'evidence:attach'
        - 'evidence:delete'
        # defects & work
        - 'defect:create'
        - 'workitem:manage'
        # reporting
        - 'report:view'
        - 'report:export'
        # documentation
        - 'doc:read'
        - 'doc:edit'
        - 'doc:publish'
        # artifacts
        - 'artifact:read'
        - 'artifact:edit'
        - 'artifact:delete'
        # project
        - 'project:read'
        - 'project:audit'
        - 'project:settings'
        - 'project:members'
        - 'integration:manage'
        # company (COMPANY scope)
        - 'company:read'
        - 'company:settings'
        - 'company:members'
        - 'company:teams'
        - 'company:vocabulary'
        - 'company:idp'
        - 'project:create'
        - 'token:issue'
        - 'audit:view'
        # system (SYSTEM scope)
        - 'company:create'
        - 'company:delete'
        - 'company:suspend'
        - 'user:manage'
        - 'role:manage'
        - 'system:settings'
        - 'instance:audit'

    RoleAssignment:
      type: object
      required: [id, role, user, grantedAt]
      properties:
        id: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/Role' }
        user:
          description: |
            **Null on a team grant.** `ck_role_assignment_subject` is user *xor* team, and
            `POST /role-assignments` takes exactly one of `userId` and `teamId` — so a grant
            made to a team names no user, and the previous non-nullable `$ref` made the
            generated type claim otherwise. Third time this idiom has been needed for the same
            reason: see `EntityVersion.createdBy` and `TestExecutionSummary.executedBy`.
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
        team:
          type: object
          nullable: true
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        projectId: { type: string, format: uuid, nullable: true }
        projectName: { type: string, nullable: true }
        grantedAt: { type: string, format: date-time }

    RoleAssignmentInput:
      type: object
      description: |
        `projectId` is what selects the scope of the grant, and therefore which permission
        gates it — see `POST /role-assignments`. It is nullable rather than optional so that
        "grant across the whole company" is something the caller states, not something they
        fall into by omitting a field.
      required: [roleId, projectId]
      properties:
        roleId: { type: string, format: uuid }
        userId: { type: string, format: uuid, nullable: true }
        teamId: { type: string, format: uuid, nullable: true }
        projectId:
          type: string
          format: uuid
          nullable: true
          description: Null grants the role across every project in the company, present and future.

    # ---------------------------------------------------------------- work ---
    WorkItem:
      type: object
      required: [id, derived, kind, title, status, priority, overdue, projectId, projectKey, allowedTransitions]
      properties:
        id: { type: string }
        derived:
          type: boolean
          description: |
            True for projections of an execution, review, or stale case. Derived items
            are NOT stored and their status comes from the source, so a card can never
            diverge from its execution (plan §6l).
        sourceType: { type: string, nullable: true, example: EXECUTION }
        sourceId: { type: string, format: uuid, nullable: true }
        kind:
          type: string
          description: |
            What the card is, which is what the SPA labels and groups by. Six of these
            were declared in §53 ahead of their generators so a new one would need no
            contract change; `QUARANTINE` is the seventh and it needed one, because §6l's
            "quarantined flaky test" is not any of the six.

            **It is deliberately not `CASE_MAINTENANCE`, and that is a rendering fact
            rather than a taxonomy preference.** A `CASE_MAINTENANCE` card's `description`
            is a comma-separated list of raw `HealthSignal` codes that the SPA labels from
            the contract's own enum (`BoardPage.describeCard`). A quarantine card's
            description is a sentence a person wrote. Filed under the same kind it would be
            split on commas and label-looked-up word by word, so "Quarantined by Ana —
            flaky on Firefox, sometimes" renders as its own fragments joined by a middot,
            with nothing failing anywhere.
          enum: [TASK, EXECUTION, REVIEW, DOC_UPDATE, CASE_MAINTENANCE, DEFECT, QUARANTINE]
        title: { type: string }
        description: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/WorkItemStatus' }
        priority: { $ref: '#/components/schemas/Priority' }
        dueDate: { type: string, format: date, nullable: true }
        overdue: { type: boolean }
        assignee: { $ref: '#/components/schemas/UserRef' }
        projectId: { type: string, format: uuid }
        projectKey: { type: string }
        linkedKey: { type: string, nullable: true, example: TC-42 }
        allowedTransitions:
          type: array
          description: |
            Columns this card may legally move to; others reject the drop. Empty for a
            derived card whose source offers no board-driven action.
          items: { $ref: '#/components/schemas/WorkItemStatus' }

    WorkItemStatus:
      type: string
      description: |
        A board column, as a stable code rather than its English label.

        **It was an unconstrained `string` until §53, and that was the defect.** The SPA
        compared it against display text (`'To do'`), the mock served the same display
        text, and mock mode therefore agreed with itself perfectly — while any server that
        chose `TODO` would have filed every card into no column at all and rendered an
        empty board with no error. Same family as §52's `runs`/`entries`, one level down:
        not a field the two sides spelled differently, but a field whose *vocabulary* the
        contract never fixed, so neither side could be wrong.

        The label lives in `frontend/src/lib/labels.ts`, where a new member is a compile
        error until it is labelled. §6l's per-board configurable columns therefore become
        configuration over this enum rather than a contract change per column.

        **`BLOCKED` arrived in §54 and it is the fifth column, not merely a fifth value.**
        §53 left it out on purpose and said why: the board renders exactly the columns this
        enum names, so a status with no column would be a card that exists, is returned by
        this API, and appears **nowhere on screen** — invisible rather than misplaced, which
        is the worse of the two failures. That made adding it a contract change *plus* a
        label *plus* a grid column, and shipping only the first is how the invisible card
        gets there. All three land together, and `boardColumns.test.ts` now derives the
        board's columns from this enum so the next member cannot arrive without one.

        Ordered as §6l lists them, and the order on the wire is not the display order —
        `BoardPage`'s `COLUMNS` owns that. The enum's job is the vocabulary.
      enum: [TODO, IN_PROGRESS, BLOCKED, IN_REVIEW, DONE]

    WorkItemInput:
      type: object
      required: [projectId, title]
      properties:
        projectId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string, nullable: true }
        priority: { $ref: '#/components/schemas/Priority' }
        dueDate: { type: string, format: date, nullable: true }
        assigneeId:
          type: string
          format: uuid
          nullable: true
          description: |
            Omit to leave the task unassigned. **Unassigned, not "assigned to me"** — a
            board where every task silently belongs to whoever typed it cannot express the
            unclaimed pool §6l calls for, and the correction is invisible once made.
      description: |
        A new task. `status` is absent on purpose: a task starts in `TODO`, and letting a
        create choose its column would allow "create it in Done", which is a move without
        a move ever being recorded.

    WorkItemStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/WorkItemStatus' }

security:
  - bearerAuth: []
