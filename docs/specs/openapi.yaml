openapi: 3.1.0
info:
  title: TCMS API
  version: 0.1.0-mock
  description: |
    Test Case Management System — REST contract.

    This is the source of truth for the frontend TypeScript types and the MSW mock
    handlers. The backend has not been implemented yet; the shapes here are what the
    UI is being designed against, and will drive the eventual Spring Boot controllers.

    Companion documents:
      * docs/plans/2026-07-30-tcms-high-level-plan.md  (§ references throughout)
      * docs/specs/2026-07-30-tcms-erd.md              (persistence model)
      * docs/specs/2026-07-30-tcms-roles-permissions-naming.md
        (AUTHORITATIVE for the permission catalogue, role grants and naming)

    Conventions
      * All ids are UUIDs — and UUIDs are the only identifiers any path accepts.
      * Display keys (TC-1, TP-1, TS-1, TR-1, DOC-1) are sequential PER COMPANY and
        unique across all of that company's projects (plan §6t). They are display
        only: they never appear as a path identifier, because they are trivially
        guessable where a UUID is not. Paths stay nested under /projects/{projectId}
        because a project is a real navigation boundary — a whole client product —
        not because a key needs disambiguating.
      * A company is a separate CLIENT organisation and the top-level isolation
        boundary (plan §6s). Multi-company routing (/c/{slug}), the company switcher
        and per-company branding land with backend M6 and are deliberately NOT in
        this contract yet. What IS here is the shape those decisions already changed:
        the display-key format, the six built-in roles, and the permission catalogue.
      * List endpoints return { items, page, size, total } and accept composable
        filters. Filter state is expected to live in the URL (plan §6o/§6q).
      * Timestamps are RFC 3339 with offset.
      * Write endpoints that mutate versioned entities accept If-Match with the
        entity's lockVersion for optimistic concurrency (plan §7 resolved: multiple
        testers may work one run concurrently).

servers:
  - url: /api/v1

tags:
  - name: auth
  - name: projects
  - name: repository
  - name: execution
  - name: documentation
  - name: artifacts
  - name: reporting
  - name: admin
  - name: work

# =============================================================================
# PATHS
# =============================================================================
paths:

  # ---------------------------------------------------------------- auth ----
  # v1 is local accounts only. External OIDC providers (Cognito, Entra ID, Google,
  # Okta, Keycloak, generic) land in the integrations phase — plan §6r — and will add
  # /auth/providers, /auth/oidc/{provider}/authorize and /auth/oidc/{provider}/callback
  # alongside this endpoint, not replacing it. Local login is retained permanently as
  # the break-glass path for a self-hosted product.
  /auth/login:
    post:
      tags: [auth]
      summary: Authenticate with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                rememberMe: { type: boolean, default: false }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [auth]
      summary: End the current session
      description: |
        A client-side discard. The session token is stateless, so there is nothing
        server-side to invalidate and this endpoint deliberately does not pretend
        otherwise — a caller who believes a leaked token was revoked here would not
        rotate anything. Prompt revocation is the `pv` epoch (plan §6b), which
        invalidates every session for an account at once. A per-token denylist arrives
        with refresh tokens.
      responses:
        '204': { description: Session discarded by the client }

  # Invitation redemption. Open like /auth/login, and for the same reason: someone
  # accepting an invitation has no account to authenticate with yet.
  #
  # EVERY failure is 404 with no body — unknown token, expired, already redeemed,
  # membership since removed, account since deactivated. Told apart, they would let
  # anyone with a token-shaped string learn whether an address exists on this instance,
  # and email is unique instance-wide, so that spans every client. Same rule as an
  # unreachable display key (plan §6t), on the one surface a stranger can reach.
  /auth/invitations/{token}:
    get:
      tags: [auth]
      summary: What an invitation admits its holder to
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: |
            The single-use secret from the invitation email. In the path, and in the
            query string of the emailed link — a known exposure (browser history,
            Referer headers, proxy logs) bounded by the token being single-use,
            short-lived and inert once redeemed.
          schema: { type: string }
      responses:
        '200':
          description: The invitation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationPreview' }
        '404': { $ref: '#/components/responses/NotFound' }

  /auth/invitations/{token}/accept:
    post:
      tags: [auth]
      summary: Redeem an invitation and activate the account
      description: |
        Answers 204, not a session. The invitee then signs in with the password they
        just chose, which keeps token issuance to a single path and makes the round
        trip prove the password was stored as intended.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  format: password
                  minLength: 12
                  description: |
                    Required when `passwordRequired` was true; omitted otherwise, and
                    REJECTED rather than ignored when the account already has one —
                    holding an invitation to a second company must not confer the
                    ability to overwrite an existing credential. The 72-byte maximum is
                    BCrypt's: anything longer is only partly verified, so it is refused
                    rather than silently truncated.
      responses:
        '204': { description: Accepted; the account and the membership are now ACTIVE }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: The password was not accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /me:
    get:
      tags: [auth]
      summary: The authenticated user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/permissions:
    get:
      tags: [auth]
      summary: Effective permissions for the caller in a project
      description: |
        Drives UI affordances only. Every hidden action is independently rejected
        server-side — hidden is not protected (plan §6b).

        Three different questions, and the answers are deliberately not the same set
        (see MeController): with a projectId, the SYSTEM + COMPANY + PROJECT terms; with
        a company open but no project, SYSTEM + COMPANY only — NOT "whatever this caller
        holds on some project", because a Test Lead on one project must not read as
        holding project:settings company-wide; with no company at all, SYSTEM only.

        An unreachable project and a non-existent one both answer with the empty set,
        identically, so this endpoint cannot be used to probe for projects in other
        companies (plan §6t).
      parameters:
        - name: projectId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Permission keys
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffectivePermissions' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ------------------------------------------------------------ projects ----
  /projects:
    get:
      tags: [projects]
      summary: Projects visible to the caller
      responses:
        '200':
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [projects]
      summary: Create a project
      description: |
        Requires `project:create`, which is a **COMPANY-scope** permission — the only write in
        this contract whose gate is not a grant on the target, because the target does not exist
        yet. Held by Company Admin and Instance Admin only (roles spec §A3); a Test Lead running
        a project is not entitled to start another one.

        `key` is **supplied by the client**, not allocated. Display keys (`TC-n`, `TS-n`) are
        server-allocated from the company's counter because they number rows; a project key is a
        2–10 character label a human chooses, types and reads back in URLs — "OLB" for Online
        Banking — so allocating "P-3" would replace the one identifier in the system that is
        meant to be memorable. It is immutable once set (see `Project.key`) and unique per
        company, so two clients may both key a project `OLB`.

        **A key already used in this company is a `400` keyed on `key`, not a `409`.** The form
        has a field to put the message on, and the caller's next action is to type a different
        key rather than to reload. That also makes the endpoint safe to retry without an
        `Idempotency-Key`: the retry of a create that in fact succeeded cannot make a second
        project, because the key is taken by the first — which is why this endpoint deliberately
        does not accept the header that `POST …/cases` does.

        The created project is seeded exactly as `provision-company` seeds a first project — the
        Feature dimension, the six execution statuses and the Default configuration — so a
        project created here and one created by the operator CLI are the same thing.

        **No project grant is created for the caller.** Every route to `project:create` already
        carries `project:read` over every project in the company (a Company Admin's COMPANY-scope
        grant, an Instance Admin's SYSTEM one), so the new project is immediately in the caller's
        `GET /projects`. Minting a PROJECT-scope grant for them would instead make `myRole` claim
        a per-project role they do not hold.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: The created project's own URL.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /projects/{projectId}:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [projects]
      summary: Project detail
      responses:
        '200':
          description: Project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/classification:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [projects]
      summary: Classification dimensions and their values
      description: Test Type, Test Level, Feature tree, Execution Phase (plan §6d).
      responses:
        '200':
          description: Dimensions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ClassificationDimension' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/statuses:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [projects]
      summary: Configurable execution statuses
      responses:
        '200':
          description: Statuses
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CaseStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/members:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [projects]
      summary: People who can be given work in this project
      description: |
        The people a project-scoped assignment may name: **active members of this company
        who hold a grant on this project**. Both halves are load-bearing and each alone
        admits a defect —

        - membership without a grant is a colleague who can sign in and cannot open the
          project, so a task assigned to them is visible on their board and 404s when they
          click it;
        - a grant without active membership is an unaccepted invitation, which conveys
          nothing until it is redeemed.

        **This is the same predicate the write side enforces**, not an approximation of it.
        `POST /work-items` validates `assigneeId` against exactly this set, so a picker
        built from this list can never offer somebody the server will refuse — which is the
        §31 rule (disable-don't-hide) applied to a *set* rather than to a button.

        Grants reach a person directly, through a team, or company-wide, so this cannot be
        answered by reading `role_assignment` for the project: it is resolved through the
        permission evaluator, the one place effective permissions are computed (plan §6b).

        Ordered by display name. The name is the **membership's**, not the account's
        canonical one (§6u) — the same person is "A. Kotrulev" to one client and "Aleksandar
        (Contractor)" to another.
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserRef' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          # The project read gate, and 404 rather than 403 for §6t's reason: an unreachable
          # project and a non-existent one must be indistinguishable. Not the admin surface's
          # "200 with []" — that shape exists because /users and /teams declare only 200, and
          # every project-scoped path in this contract answers 404 instead.
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------- repository ----
  /projects/{projectId}/suites:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [repository]
      summary: Suite tree
      responses:
        '200':
          description: Suites, as a flat list with parentId (client builds the tree)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Suite' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [repository]
      summary: Create a suite
      description: |
        `key` is server-allocated from the company's counter (`TS-n`, sequential per **company**,
        §6t), and `path` is derived from it — **not** from the name, so a rename never rewrites a
        path. Requires `suite:manage`.

        `lifecycleStatus` is always `DRAFT`, for the reason a created case is: a status an ordinary
        create could set is an approval its author granted themselves (§6g).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuiteInput' }
      responses:
        '201':
          description: Created — key is server-allocated (TS-n, per company)
          headers:
            Location:
              description: The created suite's own URL.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Suite' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/suites/{suiteId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: suiteId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [repository]
      summary: Suite detail
      responses:
        '200':
          description: Suite
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Suite' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [repository]
      summary: Rename a suite
      description: |
        Renames a suite and edits its description. Requires `suite:manage`.

        **Moving is not supported here yet.** `parentId` is accepted only when it matches the
        suite's current parent; a different value is a `400` rather than a silently ignored field,
        because reparenting rewrites every descendant's `path` and needs cycle prevention — see
        `Suite.path`. A client must not be able to believe a move happened.

        Send the suite's `lockVersion` as `If-Match`. Omitting it is last-write-wins, which is right
        for an importer with no prior read; the SPA always sends it, so a concurrent rename is a
        `409` rather than a silent overwrite (§6j).
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuiteInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Suite' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [repository]
      summary: Delete an empty suite
      description: |
        Soft-deletes a suite. Requires `suite:delete`, which is held by leads and above and **not**
        by Test Engineer — deleting is the one repository action a contributor is blocked from, so
        they can organise the tree freely without being able to unmake someone else's work
        (roles spec §6b).

        **The suite must be empty**, subtree included: a suite holding live cases, or having live
        child suites, answers `409` naming what is in the way. A cascade would soft-delete other
        people's *cases* through a folder action with no preview, routing around the `OWN` qualifier
        that `case:delete` carries for exactly that reason. Cascading deletion waits for a slice that
        can show what it is about to touch.

        Soft, not hard: past runs reference the cases beneath a suite and `suite_run_summary` keys on
        the suite id, so removing the row rewrites what a past run covered.
      responses:
        '204':
          description: Deleted. No body.
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The suite is not empty. `detail` names the live case and child-suite counts standing in
            the way, so the client can say what to clear rather than "could not delete".
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /projects/{projectId}/suites/{suiteId}/history:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: suiteId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [repository, reporting]
      summary: Suite execution history — pass % per execution
      # No `versionNo` filter. It was declared here from the first draft, nothing ever sent it, and
      # §50's binding check refuses a parameter no handler binds — an unimplemented filter answers
      # 200 to the wrong question, which is strictly worse than an absent one. Re-adding it is
      # contract-first, alongside the version selector that would send it.
      description: |
        Each entry is one execution of the suite, grouped by (run, suite, configuration),
        summarized as counts. Percentages are derived client-side so the
        "of executed" vs "of total" toggle works without a round trip (plan §6p).

        **Scope is the suite and its descendants.** A folder's history means the folder's, and
        §6p's rollup rule is to sum leaf counts — so a parent's entry covers every case beneath
        it. The alternative (own cases only) makes every intermediate folder report an empty
        history, which reads as "never executed" for a subtree that runs nightly.
      responses:
        '200':
          description: History
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuiteHistoryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/cases:
    # Only the path variable is shared. The filter block below belongs to the GET and lived
    # here until the binding check found what that meant: a path item's parameters apply to
    # EVERY operation under it, so the POST beside it declared `?page=2&ownerId=…` on a create
    # — generated into the client's types, and ignored by the server if anyone sent it.
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      tags: [repository]
      summary: Search and filter test cases
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - name: q
          in: query
          description: |
            Free text over title and description. A value matching the case-key
            pattern (TC-n) short-circuits to an exact lookup (plan §6q).
          schema: { type: string }
        - name: suiteId
          in: query
          description: Includes descendant suites by default.
          schema: { type: string, format: uuid }
        - name: featureId
          in: query
          description: Includes descendant features by default (plan §6q).
          schema: { type: string, format: uuid }
        - name: testTypeId
          in: query
          schema: { type: string, format: uuid }
        - name: testLevelId
          in: query
          schema: { type: string, format: uuid }
        - name: ownerId
          in: query
          description: |
            Cases owned by one person. Added for the dashboard's by-owner breakdown, whose
            segments are links carrying this predicate (plan §6o) — without it those links
            dropped the owner and silently opened *everyone's* cases in that status.
          schema: { type: string, format: uuid }
        - name: lifecycleStatus
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/LifecycleStatus' }
        - name: automationStatus
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/AutomationStatus' }
        - name: priority
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/Priority' }
        - name: healthSignal
          in: query
          description: Dashboard tile drill-down (plan §6o).
          schema:
            type: array
            items: { $ref: '#/components/schemas/HealthSignal' }
        - name: releaseVersion
          in: query
          description: Cases executed in this release (filters via executions).
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, example: 'keySeq,asc' }
      responses:
        '200':
          description: Matching cases plus facet counts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    # `required` does not descend through allOf — the PageMeta branch declares its
                    # own and this one needs the same. `facets` is always sent, empty when the page
                    # is: the grid distinguishes "no facets" from "facets not loaded".
                    required: [items, facets]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/TestCaseSummary' }
                      facets:
                        type: array
                        items: { $ref: '#/components/schemas/Facet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [repository]
      summary: Create a test case
      description: |
        `key` is server-allocated from the company's counter (`TC-n`, sequential per **company** and
        therefore shared across its projects — §6t). `lifecycleStatus` is always `DRAFT`: a status an
        ordinary create could set is an approval its author granted themselves, which belongs to the
        review workflow (§6g). The creator becomes the owner — `ownerId` on the input is refused, since
        naming someone else needs a membership check.

        Version **1** is written in the same transaction as the case, so a case created here has a
        gapless history. Cases that predate this endpoint have no v1 and their first edit is v2; see
        `EntityVersion`.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestCaseInput' }
      responses:
        '201':
          description: Created — key is server-allocated (TC-n, per company)
          headers:
            Location:
              description: The created case's own URL.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestCase' }
        '200':
          description: |
            **A replay.** The `Idempotency-Key` had already created this case, so nothing was created
            by this request — which is why it is not a 201 and carries no `Location`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestCase' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/cases/bulk:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    post:
      tags: [repository]
      summary: Bulk operation over a case selection
      description: |
        Preview-then-commit. Always returns what changed, what was already
        compliant, and what was skipped with a reason — mass edits without a
        preview are how people destroy a suite at 5pm (plan §6f).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkOperation' }
      responses:
        '200':
          description: Result (or preview when dryRun is true)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/cases/{caseId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/CaseId' }
    get:
      tags: [repository]
      summary: Full test case
      responses:
        '200':
          description: Case
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestCase' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [repository]
      summary: Update a test case
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestCaseInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestCase' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [repository]
      summary: Soft-delete a test case
      description: |
        Soft-deletes the case. Past runs pinned the version they executed and must keep
        resolving what they covered, so the row survives, no read returns it, and the
        display and automation keys stay reserved.

        Requires `case:delete`, which is **`OWN`-qualified for Test Engineer** (roles spec
        §A5): a lead deletes any case, a test engineer only cases they authored. Both
        refusals are `403` and they carry **different messages** — "you cannot delete cases
        here" is false for an engineer who deletes their own every day, and would send them
        to ask for a permission they hold.

        No `If-Match`: there is no lost-delete for a precondition to prevent, and a stale
        version would refuse the delete over an edit the caller does not care about.

        Nothing cascades. Steps, conditions, tags and attachments stay on the row.
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/cases/{caseId}/versions:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/CaseId' }
    get:
      tags: [repository]
      summary: Version history
      responses:
        '200':
          description: Versions, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EntityVersion' }
        '404':
          # An unreachable project, a case in a sibling project, a soft-deleted case and an
          # absent one all answer 404 — the same concealment the case detail uses, so a
          # caller cannot probe for what exists outside its grants. Distinct from a 200 with
          # an empty array, which means the case is real and has no recorded versions.
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/cases/{caseId}/history:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/CaseId' }
    get:
      tags: [repository, reporting]
      summary: Pass/fail execution history for a case
      description: |
        Timeline of every execution, attributed to the case version executed, plus
        version-change markers so "the edit broke it" is readable at a glance
        (plan §6p).

        Plan §6p also describes narrowing this timeline by **release version** and by
        **configuration**, and both were declared here from §49 until the binding check
        found that neither reaches a handler — `CaseHistoryController` binds `scope` and
        `caseVersionNo` and nothing else, so a caller sending `?configurationId=…` got the
        whole timeline back with a 200 and no indication it had been ignored. Deleted rather
        than implemented, because nothing sends them: an unimplemented filter in the contract
        is worse than an absent one, since `schema.d.ts` generates it and the absence of an
        error reads as success. Re-add contract-first when a screen needs one — the service
        already groups by (version, configuration) for the flakiness figure, so the data is
        there.
      parameters:
        - name: scope
          in: query
          description: |
            Which versions the summary and the timeline cover. `CURRENT_VERSION` is the default and
            the safe one: blending results across versions reports a pass rate for a test whose text
            changed underneath it (plan §6p).

            Deliberately NOT expressible as `caseVersionNo`, though it looks like it should be. The
            UI's chip says "Current version", not "v7" — and "current" is resolved server-side, so a
            case edited between the page load and this request is still summarized against the version
            that is current NOW. A client sending `caseVersionNo=7` has pinned v7 forever and would
            quietly report a stale scope after the next save.
          schema:
            type: string
            enum: [CURRENT_VERSION, ALL_VERSIONS]
            default: CURRENT_VERSION
        - name: caseVersionNo
          in: query
          description: |
            One explicit version — what a click on a version marker asks for. Wins over `scope` when
            both are sent, because it is the more specific of the two requests.
          schema: { type: integer }
      responses:
        '200':
          description: History
          content:
            application/json:
              schema:
                type: object
                # All three always sent. `summary` in particular: a case with no executions still
                # gets a summary of zeros, because the panel's job is to state the counts and an
                # absent summary would render as a failed load rather than as "never executed".
                required: [summary, entries, versionMarkers]
                properties:
                  summary: { $ref: '#/components/schemas/CaseHistorySummary' }
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/ExecutionHistoryEntry' }
                  versionMarkers:
                    type: array
                    items: { $ref: '#/components/schemas/VersionMarker' }
        # 400 is reachable on a READ, which is unusual enough to state: `scope` is a closed set and
        # an unrecognised value is refused by name rather than silently falling back to a default,
        # because a silent fallback is how a client asking the wrong question gets a confident
        # answer to a different one.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/conditions:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      tags: [repository]
      summary: Reusable pre/post condition library
      parameters:
        - name: q
          in: query
          description: Typeahead query. Ranked by relevance blended with usageCount (plan §6h).
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string, enum: [PRE, POST, BOTH] }
      responses:
        '200':
          description: Conditions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Condition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/shared-steps:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      tags: [repository]
      summary: Reusable step library
      description: |
        Most-used first, narrowed by an optional title fragment — the same shape and the same
        ranking rule as `/conditions` (plan §6h).

        **`usageCount` is derived, not stored.** It counts the *distinct live cases* whose steps
        reference this entry, computed by the query rather than read from `shared_step.usage_count`.
        The stored column exists and stays at its `DEFAULT 0`: a denormalized counter has to be
        maintained by every path that rewrites a case's steps, and a case edit replaces the whole
        step list, so the counter drifts on the first path that forgets and nothing reveals it.
        A number that ranks the picker has to be right to be worth showing.

        Distinct *cases*, not step rows: a case may reference the same entry twice, and counting
        rows would inflate it (the §6e rule about execution count versus distinct-case count).
        This deliberately differs from `Condition.usageCount`, which is still the stored 0 —
        a condition's usage spans `case_condition` **and** `suite_condition`, and the suite side
        propagates by inheritance, so that count is a design question rather than a join.
      parameters:
        - name: q
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Shared steps
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SharedStep' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [repository]
      summary: Add an entry to the reusable step library
      description: |
        **`library:manage`** — Instance Admin, Company Admin, Test Lead and Test Engineer (roles
        spec, Repository table). Viewer and Automation Service do not hold it. The spec's note
        that library work is *"gated by an impact modal, not by permission"* is about **editing**
        an entry, whose change propagates to every case referencing it; creating one propagates
        nowhere, so the permission is the whole control here.

        Until this operation existed the library was a read of a table **nothing could write**,
        while `CaseStep.sharedStepId` had been accepted on case saves since M1 — so the product
        could store a reference to a library it had no way to populate.

        Shared steps are **project-scoped** (roles spec: two client products legitimately have
        different login flows), so an entry is reachable only from the project it was created in.

        No `Idempotency-Key`. A duplicate library entry is visible in the picker next to its twin
        the moment the create returns — the same reasoning that keeps the header off `POST` suites
        and on `POST` cases.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SharedStepInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharedStep' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------------------------------------- execution ----
  /projects/{projectId}/plans:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [execution]
      summary: Test plans
      responses:
        '200':
          description: Plans
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TestPlanSummary' }
        '404':
          # An absent project, one in another company, and one in this company the caller
          # holds no grant on all answer 404 — the read gate every project-scoped list uses.
          # Distinct from a 200 with an empty array, which means the project is reachable
          # and has no plans, the state of every freshly provisioned project.
          $ref: '#/components/responses/NotFound'
    post:
      tags: [execution]
      summary: Create a test plan
      description: |
        `plan:create` — Instance Admin, Company Admin, Test Lead and Test Engineer (roles
        spec §A4). Viewer and Automation Service do not hold it: a plan is authoring, and
        the read gate every role passes must not be the write gate.

        `suiteIds` and `caseIds` become the plan's **scope items**. A suite item means the
        folder *and everything beneath it* — the plan's `caseCount` expands it — so adding
        a folder and one of its cases is not a mistake, it is two ways of saying the same
        thing and the count dedupes them.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestPlanInput' }
      responses:
        '201':
          description: Created — key is server-allocated (TP-n, per company)
          headers:
            Location:
              schema: { type: string }
              description: The new plan's canonical URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestPlan' }
        '200':
          # A retry carrying an Idempotency-Key that already created a plan. 200 rather than
          # 201 so a client can tell "I made this" from "I already had this", and so a
          # well-behaved retry is not logged as a second creation. No Location: nothing was
          # created by THIS request.
          description: Replayed — this Idempotency-Key already created a plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestPlan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          # The project read gate, before the payload is looked at — an absent project, one
          # in another company, and one the caller holds no grant on are one answer.
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/plans/{planId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: planId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [execution]
      summary: Plan detail
      responses:
        '200':
          description: Plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestPlan' }
        '404':
          # Four states, one answer: an unreachable project, a plan in a sibling project, a
          # soft-deleted plan and an absent one. Telling them apart makes the path an oracle
          # for plan ids in projects the caller cannot open (§6t).
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/plans/{planId}/statistics:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: planId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [execution, reporting]
      summary: Current plan state from the latest execution
      parameters:
        - name: aggregation
          in: query
          description: |
            How to resolve a case executed many times. The chosen policy is echoed
            back and MUST be displayed — two teams reading "94% pass" otherwise mean
            different things (plan §6e).
          schema:
            $ref: '#/components/schemas/AggregationPolicy'
      description: |
        Live since backend M2 slice 3. Computed on read from `test_execution` rather than
        from the `plan_snapshot` rollup plan §6p specifies — that rollup belongs to
        `reporting`, which does not exist, and a figure recomputed per request cannot go
        stale relative to a result recorded a second ago, which is the property a tester
        checks immediately after saving one. The cost is one grouped scan per view, bounded
        by the plan's own scope; revisit when a plan's execution count makes it visible.

        **Two of the five criterion metrics are evaluated** — `pass_rate` and `coverage`,
        the two this endpoint's own numbers support. `open_critical` needs the M4 issue
        tracker, `cases_approved` the review workflow, and `build_available` is modelled
        nowhere; those return `met` and `actual` as null, meaning *not evaluated*, which is
        a different thing from unmet.
      responses:
        '200':
          description: Statistics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanStatistics' }
        '400':
          description: The `aggregation` parameter is not one of the five policies.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          # Same four states as the plan detail above.
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/runs:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      tags: [execution]
      summary: Test runs
      parameters:
        - name: planId
          in: query
          schema: { type: string, format: uuid }
        - name: releaseVersion
          in: query
          schema: { type: string }
      description: |
        `planId` and `releaseVersion` are both **exact-match** filters, and both narrow rather
        than resolve: a `planId` naming a plan in another project narrows the list to nothing
        rather than answering 404, because the filter is a question about this project's runs
        and the honest answer to "which of my runs belong to that plan" is none.
      responses:
        '200':
          description: Runs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TestRun' }
        '404':
          # The project read gate only — see the plans list.
          $ref: '#/components/responses/NotFound'
    post:
      tags: [execution]
      summary: Create a run
      description: |
        `run:create` — every role except Viewer, **including Automation Service** (roles spec
        §A4), which is what lets a CI token open the run it is about to post results into.

        **Creating a run materialises its executions.** One `test_execution` per case in
        scope, each pinned to that case's *current* `case_version_id` at this moment — which
        is what makes the run a record of what was tested rather than of what the cases say
        today (plan §6j). The scope is `caseIds` when the body carries them, otherwise the
        plan's expanded scope; a run that would materialise **nothing** is a 400 on the
        field, not an empty run, because an empty run looks finished.

        `configurationId` defaults to the project's default configuration — every project is
        seeded with one, so the field is optional and the column stays `NOT NULL`.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestRunInput' }
      responses:
        '201':
          description: Created — key is server-allocated (TR-n, per company)
          headers:
            Location:
              schema: { type: string }
              description: The new run's canonical URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestRun' }
        '200':
          # See POST /plans. It matters more here: a replayed run create that made a second
          # run would also materialise a second set of executions, so the same tester would
          # be shown the same checklist twice with one half of their results on each.
          description: Replayed — this Idempotency-Key already created a run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/runs/{runId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/RunId' }
    get:
      tags: [execution]
      summary: Run detail with its executions
      responses:
        '200':
          description: Run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestRunDetail' }
        '404':
          # Unreachable project, run in a sibling project, soft-deleted run, absent run.
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/runs/{runId}/executions/{executionId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/RunId' }
      - name: executionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [execution]
      summary: One execution, with the pinned case version's steps
      description: |
        **The steps, preconditions and postconditions are the ones the pinned case version
        carried, not the ones the case carries now** (plan §6j). `test_execution.case_version_id`
        is the pin, and this response resolves through it — so editing a case never rewrites
        what a tester was told to do in a run that already happened.

        `caseTitle` is pinned for the same reason and `caseKey` is not pinned because it cannot
        move: a display key is immutable (§6t).
      responses:
        '200':
          description: Execution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestExecution' }
        '404':
          # Unreachable project, a run or execution in a sibling project, an execution that
          # belongs to a different run than the path names, and an absent one.
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [execution]
      summary: Record a result
      description: |
        Optimistic locking via If-Match — several testers may work one run at once.

        **Two permissions, not one.** Recording a verdict where none was recorded needs
        `result:submit` (Test Engineer and Automation Service upward). Changing a verdict that
        is already there needs `result:amend`, which is **Lead-only** (roles spec §A4 —
        `result:amend` is listed beside `suite:delete` as destructive rather than creative). The
        two 403s carry different sentences: telling a tester who records results every day that
        they may not record results sends them to ask for a permission they already hold.

        A `statusId` naming a status outside this project's vocabulary is a **400 on the field**,
        not a 404 — the target resolved and the picker is where the message belongs.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecutionResultInput' }
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestExecution' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{projectId}/runs/{runId}/executions/{executionId}/evidence:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/RunId' }
      - { $ref: '#/components/parameters/ExecutionId' }
    post:
      tags: [execution]
      operationId: attachEvidence
      summary: Attach a screenshot or log to a result
      description: |
        Needs `evidence:attach` — held by every role but Viewer (roles spec §A5).

        **The upload proxies through the API** rather than going browser-direct to a signed URL:
        the storage port's filesystem adapter cannot issue one (plan §8 open question #28,
        resolved in §51, which stated this consequence when the option was chosen). So the
        instance's `spring.servlet.multipart.max-file-size` is a real limit, and a file over it
        is a **413** rather than a 400 — the request is refused before it reaches the handler,
        so there is no field to hang the message on.

        `stepId` attaches to one step's result instead of to the execution as a whole. The two
        are different claims: a file on the execution documents the verdict, a file on a step
        documents where it went wrong.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    The bytes. Filename and content type travel in the part's own headers, and
                    the filename is stored in a column — it never becomes part of a storage key.
                caption:
                  type: string
                  nullable: true
                  description: Optional one-line description shown beside the thumbnail.
                stepId:
                  type: string
                  format: uuid
                  nullable: true
                  description: |
                    A step of the **pinned** version that already has a recorded result. A step
                    nobody has marked has no `step_result` row to attach to, and inventing one
                    would record a verdict nobody gave — so that is a 400 on this field.
      responses:
        '201':
          description: Attached
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Evidence' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: |
            The file is larger than this instance's upload limit. Refused by the servlet
            container before the handler runs.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /projects/{projectId}/runs/{runId}/executions/{executionId}/evidence/{evidenceId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/RunId' }
      - { $ref: '#/components/parameters/ExecutionId' }
      - { $ref: '#/components/parameters/EvidenceId' }
    delete:
      tags: [execution]
      operationId: deleteEvidence
      summary: Remove evidence
      description: |
        Needs `evidence:delete`, which is **`OWN`-qualified for Test Engineer** (roles spec §A5):
        they may remove evidence they attached and not a colleague's.

        **The two refusals carry different sentences**, because they are different facts about
        the caller. "You do not have permission to remove evidence" is false for someone who
        removes their own attachments all day, and false in the direction that sends them to ask
        an administrator for a permission they already hold.

        Evidence with **no recorded author** is not covered by an `OWN` grant — a grant over
        "your own work" must not stretch to work nobody can attribute.

        The delete is **hard**, unlike a case's. A screenshot removed on request has to actually
        leave the disk; a soft-deleted row pointing at retained bytes is a deletion that did not
        delete, which is the wrong answer for the one thing here a customer may need removed for
        privacy reasons.
      responses:
        '204':
          description: Removed
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/runs/{runId}/executions/{executionId}/evidence/{evidenceId}/content:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/RunId' }
      - { $ref: '#/components/parameters/ExecutionId' }
      - { $ref: '#/components/parameters/EvidenceId' }
    get:
      tags: [execution]
      operationId: downloadEvidence
      summary: The evidence bytes
      description: |
        What `Evidence.url` points at — **without this route that field would be a lie**.

        An ordinary session-authenticated API route rather than a public link, because the
        filesystem adapter cannot issue an expiring signed URL and a guessable permanent one
        would be an unauthenticated read of a customer's screenshots.

        No separate permission: anyone who may see the execution may see its evidence, and the
        catalogue has no `evidence:read`. Served `inline` with the stored content type so the SPA
        can render an image in place rather than downloading it.
      responses:
        '200':
          description: The bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404':
          # Also the answer when the row exists and its blob does not — the orphan the write
          # ordering deliberately produces instead of the reverse. See EvidenceStore.
          $ref: '#/components/responses/NotFound'

  # ------------------------------------------------------- documentation ----
  /projects/{projectId}/doc-pages:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [documentation]
      summary: Documentation page tree
      responses:
        '200':
          description: Pages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocPageSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [documentation]
      summary: Create a documentation page
      description: |
        `key` is server-allocated from the company's counter (`DOC-n`, sequential per **company**,
        §6t) and `path` is derived from it, never from the title — a retitled page must not move.
        Requires `doc:edit`.

        `status` is always `DRAFT` and is not an input, for the reason a created case's status is
        not: a state an ordinary create could set is an approval its author granted themselves
        (§6g). Publishing is `PUT .../status` and a different permission.

        Blocks may be sent with the page or left for a later `PATCH`. **Block ids are
        server-generated here and never derived from the text** — see `DocBlockInput`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocPageInput' }
      responses:
        '201':
          description: Created — key is server-allocated (DOC-n, per company)
          headers:
            Location:
              description: The created page's own URL.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/doc-pages/{pageId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: pageId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [documentation]
      summary: Page with blocks and per-block coverage
      description: |
        Each block carries the cases linked to it and their latest results — the
        inline coverage marker that makes people maintain links (plan §6i).

        `coverage` is **absent** until something can create a `doc_link`. Nothing can yet, so no
        block has one, and serializing a zeroed marker would say "nothing verifies this" when the
        truthful statement is that the question has not been asked. Same call, for the same reason,
        as `TestCase.relatedDocuments`.
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [documentation]
      summary: Retitle a page and replace its blocks
      description: |
        Requires `doc:edit`. Send the page's `lockVersion` as `If-Match`; the SPA always does, so a
        concurrent edit is a `409` rather than a silent overwrite (§6j).

        **`blocks` is the whole page, in order — and identity survives it.** A block sent with its
        `id` keeps that id however much its text changed, so a fixed typo does not break the links
        pointing at it (§6i/§6m). A block sent without an `id` is new. A block *omitted* is
        deleted, and a deleted block that something links to is refused with `409` rather than
        cascaded away — the link is somebody's traceability record, not this request's business.

        An `id` that is not a block of this page is a `400`, never a silent create: a client that
        believes it edited a block must not have created a different one.

        `status` is not editable here — see `PUT .../status`.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocPageInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Either the `If-Match` did not match the stored `lockVersion`, or the edit removes a
            block that a case still links to. `detail` says which, and the second names how many.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [documentation]
      summary: Delete a page
      description: |
        Soft-deletes a page and its blocks. Requires `doc:edit` — deleting is not split off into a
        permission of its own the way `suite:delete` is, because a page has no subtree of other
        people's work beneath it; the destructive-folder-action reasoning that split those two does
        not apply here.

        **The page must have no child pages**, which answer `409` naming the count. A cascade would
        remove pages the request never mentioned.

        Refused with `409` when a case links to one of its blocks, for the reason the `PATCH` is:
        traceability is not collateral.
      responses:
        '204':
          description: Deleted. No body.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The page has child pages, or a case links to one of its blocks. `detail` names which
            and how many.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /projects/{projectId}/doc-pages/{pageId}/status:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: pageId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [documentation]
      summary: Publish, unpublish or archive a page
      description: |
        Requires `doc:publish`, which Test Engineer does **not** hold while `doc:edit` is held by
        everyone who writes (roles spec §A2).

        **A separate endpoint rather than a `status` field on the `PATCH`, because it is a separate
        permission.** One endpoint whose gate depends on which fields the body happened to carry is
        one whose `403` no client can predict, and whose disabled-state the SPA cannot render — the
        two things §31 exists to prevent.

        Idempotent: setting the status a page already has answers `200`, not a conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocPageStatusInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/artifacts:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      tags: [artifacts]
      summary: Artifact register
      parameters:
        - name: scope
          in: query
          description: |
            Omitted means `PROJECT` — the project's own register, which is the whole register on a
            project that runs no cycles.
          schema: { type: string, enum: [PROJECT, PLAN], default: PROJECT }
        - name: planId
          in: query
          description: |
            Required when `scope=PLAN`, and a `400` without it: a plan register with no plan names
            no rows, and answering the project's register instead would silently show one thing
            under a heading promising another.

            When present, project-scope artifacts are returned **as well**, flagged `inherited`
            (plan §6n) — a tester opening a cycle should find the environment guide without hunting
            for it. Rejected when `scope=PROJECT`, because nothing about a project's own register
            depends on a plan.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Artifacts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Artifact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [artifacts]
      summary: Register an artifact
      description: |
        Registers a **reference** — a documentation page or an external URL — at project or plan
        scope.

        `FILE` and `GENERATED_REPORT` are declared on `Artifact` because the register renders them,
        and are deliberately **not** accepted here. An upload needs the storage port (open question
        #28: a filesystem adapter, so the bytes proxy through the API and a request-size limit has
        to exist first), and a pinned report needs the `reporting` module, which does not exist. A
        `kind` this endpoint cannot honour is a `400` rather than a silently different artifact.

        Steering people toward references is the design, not a limitation of this slice — plan §6n
        calls the register's failure mode "a graveyard of outdated copies", and a strategy document
        *authored* as a doc page and *registered* here cannot go stale the way an uploaded copy of
        it does.

        `status` is absent from the input on purpose (plan §6g): `SUPERSEDED` is the outcome of
        superseding something, and a create that could set it would be an author approving their
        own record.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtifactInput' }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artifact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------------------------------------- reporting ----
  /projects/{projectId}/dashboard:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [reporting]
      summary: Repository status dashboard
      description: |
        Lifecycle counts crossed with derived health signals. Every count carries
        the filter that reproduces it, so tiles are links, not decoration (plan §6o).
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepositoryDashboard' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/reports:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [reporting]
      summary: Saved report definitions
      responses:
        '200':
          description: Definitions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReportDefinition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/reports/generate:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    post:
      tags: [reporting]
      summary: Generate a report
      description: Async by contract — returns 202 with a job to poll (plan §6e).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, format]
              properties:
                type: { type: string, example: aggregate_execution }
                format: { type: string, enum: [PDF, MD, HTML] }
                parameters: { type: object, additionalProperties: true }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --------------------------------------------------------------- admin ----
  /users:
    get:
      tags: [admin]
      summary: Users
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [admin]
      summary: Invite a person into this company
      description: |
        The way a colleague gets into the company at all. Until this endpoint existed, the only
        account a provisioned company had was the Company Admin the operator CLI created, and a
        second person could be added **only by hand-written SQL** — which is what every fixture
        in the suite had to do (handoff §54).

        Gated on **`company:members`** at COMPANY scope — Company Admin and Instance Admin only.
        That permission is defined as "invite, remove, set membership display names" (roles spec
        §A3), so this is the read of it the catalogue always intended.

        The person is created as an **`INVITED` membership** and receives an activation link,
        the same `POST /auth/invitations/{token}/accept` flow the CLI's first admin uses.
        Membership conveys authentication and **zero project visibility** (roles spec §A1), so
        an invited colleague signs in to an empty project list until somebody grants them a role
        with `POST /role-assignments`. That is two deliberate steps, not an oversight.

        **The response cannot be used to discover whether an address already has an account on
        this instance.** `app_user` is instance-level and its email is unique instance-wide, so
        one person may belong to several companies (§6s). Inviting an address that already has
        an account reuses it and answers **exactly as inviting a brand-new address does** — same
        status, same body shape, same `displayName` (the one the inviter typed, per §6u; never
        the account's own name, which belongs to another client). Without that, this endpoint
        would be a membership oracle for every other company on the instance.

        **Re-inviting is idempotent and carries no `Idempotency-Key`.** The identity of the
        request is the email address, so a retry finds the membership it already created:

        - a membership that is already `ACTIVE` → `200` with that person, nothing sent;
        - an outstanding, unexpired invitation → `200`, and the existing link is **left alone**
          rather than replaced, because a fresh token would invalidate the one already in the
          invitee's inbox;
        - no membership, or one whose invitation has lapsed → `201` and a new link.

        `emailed` is `false` when the instance has **no SMTP relay configured**. The invitation
        is still valid — an operator must carry the link across by hand, exactly as they do for
        `provision-company` — and saying so is what stops the invitee from waiting for a message
        that is never coming.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserInvitationInput' }
      responses:
        '200':
          description: |
            Already a member, or an unexpired invitation was already outstanding. Nothing sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserInvitation' }
        '201':
          description: Invited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserInvitation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users/{userId}:
    # No query parameters on the path item, per §50.
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [admin]
      summary: Remove a person from this company
      description: |
        Offboarding — the second third of **`company:members`** ("invite, remove, set membership
        display names", roles spec §A3), gated exactly as `POST /users` is: COMPANY scope, so
        Company Admin and Instance Admin only.

        **It removes the membership, not the account.** `app_user` is instance-level and one
        person may belong to several client companies (§6s), so deleting the account would offboard
        them from every other client on the instance — and would orphan the authorship this
        company's own history depends on. The membership goes to `REMOVED`, which zeroes their
        permissions here (`CompanyMembership`: membership is a precondition, so every grant they
        hold in this company becomes inert without being deleted). They disappear from `GET /users`
        immediately.

        **Their session is revoked, not left to expire.** A signed token stays valid until it
        lapses, so without this the person keeps an authenticated session inside the company they
        were just removed from — for hours. The `pv` epoch bump signs them out on their next
        request. It is account-wide, so it signs them out of their *other* companies too; they
        sign in again and nothing there has changed.

        **Any outstanding invitation is cancelled.** Removing somebody who has not accepted yet
        must not leave a live activation link behind — a later re-invite would find it outstanding,
        report that a link is already on its way, and re-admit them on a token minted before the
        offboarding.

        **A caller may not remove themselves** — `400` keyed on `userId`. It is also what keeps a
        company administrable without counting administrators: the only person who can run this
        endpoint is one who holds `company:members`, and they cannot be the one who leaves.

        **`204` whether they were a member or not.** A repeated request, a double-click and an id
        that names nobody here all end in the state the caller asked for — and a member of another
        company is *also* not here, so isolation and idempotence give the same answer (§6t).

        **Re-inviting them later restores their previous project access**, because their grants
        were made inert rather than deleted. That follows from the model rather than from this
        endpoint, and it surprises people at an admin screen.
      responses:
        '204': { description: Removed, or was not a member here }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /teams:
    get:
      tags: [admin]
      summary: Teams, with parent links for the org chart
      responses:
        '200':
          description: Teams
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Team' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /roles:
    get:
      tags: [admin]
      summary: Roles and their permissions
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /role-assignments:
    get:
      tags: [admin]
      summary: Role grants to users and teams
      parameters:
        - name: projectId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Assignments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RoleAssignment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [admin]
      summary: Grant a role to a user or a team
      description: |
        The only way a company member gains sight of a project. Company membership grants
        authentication and **zero project visibility** (roles spec §A1), so without this
        endpoint a provisioned company has exactly one usable account — the Company Admin
        the CLI created — and every colleague signs in to an empty project list.

        **The gate depends on the scope of the grant being made, not on one permission:**

        - `projectId` present → a PROJECT-scope grant, gated on **`project:members` on that
          project**. A Test Lead staffs their own project without being able to staff another.
        - `projectId` null → a COMPANY-scope grant, gated on **`company:members`**, which only
          Company Admin and Instance Admin hold. This is the same shape as `project:create`
          (§6 of that endpoint's description): a grant that spans every project cannot be
          authorised by a permission held on one project.

        Exactly one of `userId` and `teamId` is supplied; both or neither is a `400` keyed on
        `userId`. A role whose own `scope` disagrees with the grant being made — a COMPANY-scope
        role pinned to one project, or the reverse — is a `400` keyed on `roleId` rather than a
        silent coercion, because the two mean materially different access.

        **Re-granting an identical assignment returns the existing one with `200`**, not a
        duplicate and not a `409`. The caller's intent is "this person holds this role here",
        which is already true; a second row would give the same user two grants to revoke.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleAssignmentInput' }
      responses:
        '200':
          description: The grant already existed and is returned unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleAssignment' }
        '201':
          description: Granted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleAssignment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /role-assignments/{assignmentId}:
    parameters:
      - name: assignmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [admin]
      summary: Revoke a grant
      description: |
        Gated exactly as the grant was: `project:members` on the assignment's project for a
        PROJECT-scope grant, `company:members` for a COMPANY-scope one.

        **Revoking a grant that does not exist is a `204`**, so a double-click and a retried
        request both end in the state the caller asked for.

        A caller may not revoke the grant that is carrying their own ability to revoke —
        removing your own last `company:members` grant is a `400` keyed on `assignmentId`,
        because the alternative is a company with no administrator and no way back in
        without the operator CLI.
      responses:
        '204': { description: Revoked }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- work ----
  /work-items:
    # No parameters block on the path item, per §50: query parameters written here are
    # inherited by every operation beneath, so the board's filters would land on the POST.
    get:
      tags: [work]
      summary: Kanban board contents
      description: |
        Returns real tasks AND derived items in one list. Derived items carry
        sourceType/sourceId and are NOT stored — their status is computed from the
        source on every read, so a card can never diverge from its execution (plan §6l).

        **Two of the five §6l generators are implemented.** `EXECUTION` cards come from
        assigned, unrecorded executions in live runs; `CASE_MAINTENANCE` cards come from
        `case_health`. `REVIEW`, `DOC_UPDATE` and `DEFECT` require modules that do not
        exist yet and are absent rather than empty — the `kind` enum keeps them so the
        SPA's labels stay complete.
      parameters:
        # projectId is REQUIRED, and that is a narrowing. §6l's cross-project "My Work"
        # board is not built — the only caller is the project-scoped board route, which
        # always sends it. Declaring it optional would promise an aggregation no handler
        # performs, which is §50's defect in its worse direction.
        - name: projectId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: mine
          in: query
          description: Restrict to items assigned to the caller — the personal board.
          schema: { type: boolean }
      responses:
        '200':
          description: Work items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WorkItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          # The project read gate. An absent project, one in another company, and one in
          # this company the caller holds no grant on are one answer — distinct from a 200
          # with an empty array, which means the board is reachable and has nothing on it.
          $ref: '#/components/responses/NotFound'
    post:
      tags: [work]
      summary: Create a task
      description: |
        `workitem:manage` — Instance Admin, Company Admin, Test Lead and Test Engineer
        (roles spec §A6). Viewer and Automation Service do not hold it.

        **`kind` is not a field on the request.** Every row this creates is a `TASK`.
        A client able to POST `kind: EXECUTION` could materialise a derived item, which
        is the one thing §6l's design exists to prevent: the moment a card's status is
        stored separately from its execution's, the two diverge and the board stops being
        trusted. Derived items have no create endpoint because they are not stored.
      # Idempotency-Key arrives in §54, TOGETHER WITH THE COLUMN THAT HONOURS IT (V17) —
      # which is the whole point of how it was left. §53 refused to declare it while
      # `work_item` had no created_idempotency_key column, because that is §50's defect in
      # its worse direction: the header would sit in the reviewed spec, in schema.d.ts and
      # in autocomplete while the server ignored it, so a client would believe its retries
      # were deduplicated when every one of them created another card. The scope here is
      # (company_id, project_id, key) as it is everywhere else — and the project comes from
      # the BODY on this operation rather than from a path segment, which changes nothing
      # about the constraint and everything about where the handler reads it from.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkItemInput' }
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
              description: The new work item's canonical URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkItem' }
        '200':
          description: |
            **A replay.** The `Idempotency-Key` had already created this task, so nothing was
            created by this request — which is why it is not a 201 and carries no `Location`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /work-items/{workItemId}:
    parameters:
      - name: workItemId
        in: path
        required: true
        description: |
          A stored task's UUID. Derived items carry a synthetic, non-UUID id
          (`execution:{uuid}`), which is deliberately not addressable here — see the 409.
        schema: { type: string }
    patch:
      tags: [work]
      summary: Move a card to another column
      description: |
        `workitem:manage`. The only mutable field is `status`, because the board is the
        only screen that writes here; editing a task's title or due date is a separate
        slice with no affordance yet.

        **A derived item's id is refused with a `409`, not a `404`.** The card exists and
        the caller can see it; what is impossible is *storing* a status for it. Answering
        404 would read as "that card is gone" and invite a reload that brings it straight
        back. The message names the action that does work — move the execution.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkItemStatusUpdate' }
      responses:
        '200':
          description: Moved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            This card mirrors a source and its status is not stored. Also the answer when
            the requested column is not in the card's `allowedTransitions`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

# =============================================================================
# COMPONENTS
# =============================================================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CaseId:
      name: caseId
      in: path
      required: true
      description: |
        UUID only. Display keys (TC-1) are deliberately NOT accepted here: they are
        sequential per company and therefore trivially guessable, so allowing one as a
        path identifier hands out an enumeration oracle (plan §6t). Resolve a key the
        user typed or pasted through the search endpoint, which returns not-found —
        never forbidden — for a key in a project the caller cannot reach.
      schema: { type: string, format: uuid }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExecutionId:
      name: executionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, default: 50, maximum: 200 }
    IfMatch:
      name: If-Match
      in: header
      description: |
        The `lockVersion` the client read, as a decimal string. Mismatch yields 409.

        **The precondition travels in the header, never in the body.** A PATCH body states the
        desired state; the version the client happened to read is an assertion about the state it
        started from, and mixing the two means a field on the input schema that must never be
        persisted. Omitting the header skips the check — a last-write-wins save, which is correct
        for a caller that genuinely has no prior read (an importer) and wrong for an editor, so
        the SPA always sends it.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        A key identifying one **user intent**, not one attempt. A create carrying a key that has
        already succeeded answers **200** with the case that intent created, instead of creating a
        second one — so pressing Save again after a timeout is safe.

        The client generates it once per intent (the SPA does so when the editor mounts) and reuses
        it across retries. A key generated per attempt is the mistake that makes the header look
        right and do nothing.

        Scoped to the project the request is addressed to, which is the scope the uniqueness
        constraint behind it uses. Optional: omitted, every call creates. At most 200 characters.
      schema: { type: string, maxLength: 200 }

  responses:
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    BadRequest:
      description: |
        The request was understood and will not be stored. `Problem.errors` is keyed by the field
        name **as spelled on the input schema**, so a form can land each message on the input that
        caused it.

        Two things arrive as a 400 that a reader might expect elsewhere. A value that is legal in
        isolation but not offered by this project — a `suiteId` from another project — is a field
        error rather than a 404, because the target resolved fine and the picker is where the message
        belongs. And a field the endpoint does not yet implement is **refused rather than ignored**:
        accepting it would be a save that reports success and discards what the user typed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: |
        Authenticated, and the target is one the caller may READ, but the action needs a
        permission they do not hold.

        This does not weaken the 404-not-403 rule (§6t): that rule conceals whether an id names
        anything real from a caller who cannot see it, and it still governs every read and every
        unreachable target. Once a caller has passed the read gate they already know the thing
        exists, so answering 404 on the write would conceal nothing and would instead tell an
        editor their case had vanished. An unreachable project or case stays 404 here too — 403
        is reached only after the read gate has passed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Concurrent modification — reload and retry
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:

    # ------------------------------------------------------------ common ---
    Problem:
      type: object
      # `errors` is the one optional member: `ApiProblem` is serialized NON_NULL, so a 404 or a
      # 409 omits the key entirely rather than sending an empty object a client could read as
      # "no fields were wrong". The other four are on every problem this API emits.
      required: [type, title, status, detail]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: object
          nullable: true
          description: |
            RFC-7807 `errors` — field name to the messages that field failed on, present only on a
            validation rejection. The key is the field's name **as it appears on the input schema**
            (`gherkinSource`, not `gherkin_source` or `caseInput.gherkinSource`), because the SPA
            maps it straight onto a form input: a key that does not match a field name lands the
            message nowhere and the form reports a failure with nothing highlighted.

            Undeclared until 2026-07-31 while both sides already implemented it — the client has
            read `body.errors` since Phase 1 and the mock has emitted it since. Documented here so
            the first real write agrees with the contract rather than with the mock.
          additionalProperties:
            type: array
            items: { type: string }

    PageMeta:
      type: object
      # Every list endpoint sends all three on every response, including an empty page — which is
      # the case that matters, since `total: 0` is what tells a grid to render "no results" rather
      # than to keep its spinner up.
      required: [page, size, total]
      properties:
        page: { type: integer }
        size: { type: integer }
        total: { type: integer }

    Facet:
      description: Returned alongside results so filter counts render without a second request.
      type: object
      required: [key, label, values]
      properties:
        key: { type: string, example: automationStatus }
        label: { type: string }
        values:
          type: array
          items:
            type: object
            # `required` does not descend into `items` — without this the facet chips could not
            # read their own label or count without a null check on values the server always sends.
            required: [id, label, count]
            properties:
              id: { type: string }
              label: { type: string }
              count: { type: integer }

    UserRef:
      type: object
      required: [id, displayName, email]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: string }
        avatarUrl: { type: string, nullable: true }

    # -------------------------------------------------------------- enums ---
    LifecycleStatus:
      type: string
      enum: [DRAFT, IN_REVIEW, APPROVED, DEPRECATED]

    AutomationStatus:
      type: string
      enum: [MANUAL, TO_BE_AUTOMATED, AUTOMATED, NOT_AUTOMATABLE]

    Priority:
      type: string
      enum: [CRITICAL, HIGH, MEDIUM, LOW]

    StepFormat:
      type: string
      enum: [STRUCTURED, GHERKIN]

    StatusKind:
      type: string
      enum: [PASSED, FAILED, BLOCKED, SKIPPED, UNTESTED, RETEST]

    HealthSignal:
      type: string
      description: Derived, never authored — self-heals when the cause is fixed (plan §6o).
      enum:
        - OUTDATED_SPEC_CHANGED
        - STALE_APPROVAL
        - CONDITION_DRIFT
        - STALE_AUTOMATION
        - NEVER_EXECUTED
        - LONG_UNEXECUTED
        - UNLINKED
        - FAILING_REPEATEDLY
        - ORPHANED
        - INCOMPLETE

    AggregationPolicy:
      type: string
      description: How a case executed many times resolves to one result (plan §6e).
      enum: [LATEST, LATEST_PER_CONFIG, WORST, BEST, ALL]
      default: LATEST

    # -------------------------------------------------------------- auth ---
    InvitationPreview:
      type: object
      required: [email, displayName, passwordRequired]
      properties:
        email:
          type: string
          description: The address the invitation was sent to.
        displayName:
          type: string
          description: |
            The name this company will know them by — per-membership, not global
            (plan §6u).
        passwordRequired:
          type: boolean
          description: |
            False when the address already has an account, i.e. this invitation only
            adds a membership. The accept call must then omit the password.

    AuthResult:
      type: object
      required: [token, expiresAt, user]
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/CurrentUser' }

    CurrentUser:
      allOf:
        - $ref: '#/components/schemas/UserRef'
        # required on BOTH levels, deliberately: `required` does not descend, so without
        # the inner array every property of a team entry generates as optional and no
        # consumer can use one without null-checking fields that are always present.
        # This is the handoff's recurring lesson, and it recurred here.
        - type: object
          required: [isSystemAdmin, teams]
          properties:
            isSystemAdmin:
              type: boolean
              description: |
                Holds a SYSTEM-scope grant. Drives affordances only — every action is
                independently checked server-side, and code checks permissions rather
                than role names (plan §6b).
            teams:
              type: array
              description: The caller's teams IN THE ACTIVE COMPANY. Never across companies.
              items:
                type: object
                required: [id, name, isLead]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  isLead: { type: boolean }

    # ----------------------------------------------------------- project ---
    Project:
      type: object
      required: [id, key, name, archived, caseCount, myRole]
      properties:
        id: { type: string, format: uuid }
        key:
          type: string
          pattern: '^[A-Z0-9]{2,10}$'
          example: OLB
          description: |
            2-10 uppercase alphanumerics, immutable, unique per company. Used in URLs
            and labels. NOT part of a display key — those are company-scoped (§6t).
        name:
          type: string
          description: |
            A project is a FULL CLIENT PROJECT — an entire product or engagement
            ("Acme Online Banking"), not a feature area. Feature-level structure lives
            in the Feature classification dimension and the suite tree (plan §1, §6b).
          example: Acme Online Banking
        description: { type: string, nullable: true }
        archived: { type: boolean }
        caseCount: { type: integer }
        myRole:
          type: string
          nullable: true
          description: |
            The caller's role on this project, or null when they hold no project grant.
            Company membership conveys authentication and ZERO project visibility, so a
            listed project always carries a grant — but Viewer is the default, never
            Test Engineer (plan §6b).
          example: Viewer

    ProjectInput:
      type: object
      required: [key, name]
      description: |
        The body of `POST /projects`. Deliberately three fields: `archived`, `caseCount` and
        `myRole` are server-owned or computed per caller, and a field on an input schema is a
        field somebody eventually binds — a create that could set `archived` would let a project
        be born retired.
      properties:
        key:
          type: string
          pattern: '^[A-Z0-9]{2,10}$'
          example: OLB
          description: |
            Client-supplied and immutable, unique per company. Rejected with a field error on
            `key` when the company already uses it — see the endpoint description for why that is
            a 400 rather than a 409.
        name:
          type: string
          maxLength: 200
          example: Acme Online Banking
          description: |
            A whole client product or engagement, not a feature area. "Payments" is a Feature
            value or a suite folder, never a project (plan §1).
        description: { type: string, nullable: true, maxLength: 2000 }

    ClassificationDimension:
      type: object
      required: [id, key, name, cardinality, hierarchical, locked, values]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: feature }
        name: { type: string }
        cardinality: { type: string, enum: [SINGLE, MULTI] }
        hierarchical: { type: boolean }
        locked: { type: boolean }
        values:
          type: array
          items: { $ref: '#/components/schemas/ClassificationValue' }

    ClassificationValue:
      type: object
      required: [id, name, path]
      properties:
        id: { type: string, format: uuid }
        parentId: { type: string, format: uuid, nullable: true }
        name: { type: string }
        path: { type: string, example: 'Payments.Refunds' }
        color: { type: string, nullable: true }

    CaseStatus:
      type: object
      required: [id, name, kind, color, countsAsPass, isFinal]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: '#/components/schemas/StatusKind' }
        color: { type: string }
        countsAsPass: { type: boolean }
        isFinal: { type: boolean }

    # -------------------------------------------------------- repository ---
    Suite:
      type: object
      required: [id, key, name, path, caseCount, lifecycleStatus, conditions, lockVersion]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: TS-1 }
        parentId: { type: string, format: uuid, nullable: true }
        name: { type: string }
        description: { type: string, nullable: true }
        path: { type: string }
        caseCount: { type: integer }
        lifecycleStatus: { $ref: '#/components/schemas/LifecycleStatus' }
        conditions:
          description: Suite-level conditions inherited by every case beneath (plan §6f).
          type: array
          items: { $ref: '#/components/schemas/CaseConditionRef' }
        lockVersion: { type: integer }

    SuiteInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        parentId:
          type: string
          format: uuid
          nullable: true
          description: |
            The parent folder, or null for a root. **Set on create; on `PATCH` it may only repeat
            the suite's current parent** — a different value is refused rather than ignored, because
            moving is not implemented yet (see the `PATCH` description).
        description: { type: string, nullable: true }

    TestCaseSummary:
      type: object
      required: [id, key, keySeq, title, suiteId, suiteName, priority, lifecycleStatus, automationStatus, stepFormat, owner, createdBy, features, tags, healthSignals, updatedAt]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: TC-1 }
        keySeq: { type: integer, description: Sort by this — text keys do not order correctly. }
        title: { type: string }
        suiteId: { type: string, format: uuid }
        suiteName: { type: string }
        priority: { $ref: '#/components/schemas/Priority' }
        lifecycleStatus: { $ref: '#/components/schemas/LifecycleStatus' }
        automationStatus: { $ref: '#/components/schemas/AutomationStatus' }
        stepFormat: { $ref: '#/components/schemas/StepFormat' }
        owner:
          # Nullable because test_case.owner_id is. A case can exist with no owner (an
          # import, or an owner offboarded from the company), and the three ways to answer
          # that are: omit the row from the list, invent an owner, or say so. Only the last
          # is true — and the first loses a case from its own project's list.
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
        createdBy:
          # WHO WROTE THE CASE — and it is NOT `owner`, which is who is responsible for it now.
          # The two diverge routinely (a case is authored once and reassigned), and only this one
          # decides authorization: `case:delete` is OWN-qualified for a Test Engineer (roles spec
          # §A5), and the server compares `test_case.created_by`. Until this field existed the
          # client had no way to ask the same question, so the Delete button enabled for every
          # case and a Test Engineer learned which ones were theirs by being refused.
          #
          # Nullable because `test_case.created_by` is: rows written before authorship was
          # recorded have none. That is the arm that matters — the server answers a null author
          # with `false` for an OWN grant ("your own work" must not stretch to work nobody can
          # attribute), so the client must render those disabled rather than treating an absent
          # author as a match.
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
        testType: { type: string, nullable: true }
        testLevel: { type: string, nullable: true }
        features:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
        healthSignals:
          type: array
          items: { $ref: '#/components/schemas/HealthSignal' }
        lastResult:
          type: object
          nullable: true
          # The whole object is null for a case that has never been executed; when it IS present
          # every member is, `releaseVersion` as an explicit null for a run outside a release.
          # Nullability belongs on the object, not on its members — a half-populated last result
          # is not a state the server can produce.
          required: [statusKind, executedAt, releaseVersion]
          properties:
            statusKind: { $ref: '#/components/schemas/StatusKind' }
            executedAt: { type: string, format: date-time }
            releaseVersion: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time }

    TestCase:
      allOf:
        - $ref: '#/components/schemas/TestCaseSummary'
        - type: object
          # `required` does NOT descend from the parent schema, and an allOf branch needs its own —
          # without this every field below generated as optional and `lockVersion` could not be sent
          # as If-Match without a null check on a value the server always emits. Handoff §6 lesson 3,
          # found by `tsc` the moment a consumer relied on one of them.
          #
          # The nullable scalars are listed too, because the server emits the KEY with a null value
          # rather than omitting it — "always present, sometimes null" is what nullable+required says,
          # and leaving them out would mean a consumer cannot tell an unset objective from a field
          # this endpoint does not serve.
          #
          # relatedDocuments is deliberately ABSENT: it is sourced from the `documentation` module,
          # which does not exist, so the server omits the key entirely rather than serving [] and
          # claiming a case has no linked documents (§27).
          required:
            - description
            - objective
            - expectedOutcome
            - severity
            - estimatedDurationSec
            - automationTags
            - automationKey
            - notAutomatableReason
            - gherkinSource
            - steps
            - preconditions
            - postconditions
            - currentVersionNo
            - lockVersion
          properties:
            description: { type: string, nullable: true }
            objective: { type: string, nullable: true }
            expectedOutcome:
              type: string
              nullable: true
              description: Case-level, alongside per-step expected results (plan §6m).
            severity:
              # Nullable because test_case.severity is — priority is NOT NULL DEFAULT 'MEDIUM'
              # and this column has no default at all, which is the schema saying the two are
              # different fields. A team that does not distinguish "how bad is a failure" from
              # "how soon should it run" leaves it unset rather than being made to repeat itself,
              # and inventing MEDIUM here would put a judgement on the wire that nobody made.
              # Same divergence, resolved the same way, as TestCaseSummary.owner.
              allOf: [{ $ref: '#/components/schemas/Priority' }]
              nullable: true
            estimatedDurationSec: { type: integer, nullable: true }
            automationTags:
              type: array
              items: { type: string }
            automationKey:
              type: string
              nullable: true
              description: |
                The single stable identifier a CI result carries back — FQCN#method, a Cucumber
                scenario URI, or an explicit annotation value. Unique per COMPANY (plan §6c), so
                a CI job posts results without knowing which project owns the case, and a case
                moved between projects does not change where its key resolves. Distinct from
                automationTags, which are for *selection* (@smoke), not matching.
            notAutomatableReason: { type: string, nullable: true }
            gherkinSource: { type: string, nullable: true }
            steps:
              type: array
              items: { $ref: '#/components/schemas/TestStep' }
            preconditions:
              type: array
              items: { $ref: '#/components/schemas/CaseConditionRef' }
            postconditions:
              type: array
              items: { $ref: '#/components/schemas/CaseConditionRef' }
            relatedDocuments:
              type: array
              items: { $ref: '#/components/schemas/DocLink' }
            currentVersionNo: { type: integer }
            lockVersion: { type: integer }

    TestCaseInput:
      type: object
      required: [title, suiteId]
      properties:
        title: { type: string }
        suiteId: { type: string, format: uuid }
        description: { type: string, nullable: true }
        objective: { type: string, nullable: true }
        expectedOutcome: { type: string, nullable: true }
        stepFormat: { $ref: '#/components/schemas/StepFormat' }
        gherkinSource: { type: string, nullable: true }
        priority: { $ref: '#/components/schemas/Priority' }
        severity: { $ref: '#/components/schemas/Priority' }
        automationStatus: { $ref: '#/components/schemas/AutomationStatus' }
        automationKey: { type: string, nullable: true }
        automationTags:
          type: array
          items: { type: string }
        notAutomatableReason: { type: string, nullable: true }
        estimatedDurationSec: { type: integer, nullable: true }
        ownerId: { type: string, format: uuid, nullable: true }
        classificationValueIds:
          type: array
          items: { type: string, format: uuid }
        tags:
          type: array
          items: { type: string }
        steps:
          type: array
          items: { $ref: '#/components/schemas/TestStepInput' }
        preconditions:
          type: array
          items: { $ref: '#/components/schemas/CaseConditionInput' }
        postconditions:
          type: array
          items: { $ref: '#/components/schemas/CaseConditionInput' }
        changeComment:
          type: string
          nullable: true
          description: Optional by design — mandatory comments produce a thousand "update"s.

    TestStep:
      type: object
      required: [id, position, action]
      properties:
        id:
          type: string
          format: uuid
          description: Stable — results and evidence anchor here, so reordering is safe (plan §6m).
        position: { type: integer }
        keyword:
          type: string
          nullable: true
          enum: [GIVEN, WHEN, THEN, AND, BUT, null]
        action: { type: string }
        testData: { type: string, nullable: true }
        expectedResult: { type: string, nullable: true }
        sharedStepId:
          type: string
          format: uuid
          nullable: true
          description: |
            Set ⇒ this step is a reference to a `/shared-steps` entry, and the UI marks it as
            shared. Served unresolved: the id, not the block. `action` still carries the text,
            so a reader never depends on a second fetch to see what the step says.

    TestStepInput:
      type: object
      required: [action]
      properties:
        id: { type: string, format: uuid, nullable: true }
        keyword: { type: string, nullable: true }
        action: { type: string }
        testData: { type: string, nullable: true }
        expectedResult: { type: string, nullable: true }
        sharedStepId:
          type: string
          format: uuid
          nullable: true
          description: |
            A `/shared-steps` entry **of this project**. Accepted when the entry is live here, or
            when this case's stored steps already reference it.

            Both halves are load-bearing. Without the first, an id from a sibling project is
            stored unchecked — it satisfies the foreign key, so nothing fails, and every reader of
            the case then resolves a library entry through a project they were never granted; an
            id naming nothing at all fails the foreign key and answers 500 where a field error
            belongs. Without the second, **retiring a library entry makes every case using it
            unsaveable**, which is worse than the defect the check closes: references survive a
            retirement by design (the same rule `Condition` states for attachments), so a save
            that merely leaves an existing reference alone must not be re-litigated against a
            library that has moved on.

            Refused as a field error rather than a 404 — the case and the project both resolved,
            and the value came from a picker the message can land on.

    Condition:
      type: object
      required: [id, title, type, body, usageCount]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        type: { type: string, enum: [PRE, POST, BOTH] }
        body:
          type: array
          items: { type: string }
        usageCount:
          type: integer
          description: Drives typeahead ranking and the pre-edit impact warning (plan §6f/§6h).

    CaseConditionRef:
      type: object
      required: [id, position, title, body, inline, inherited]
      properties:
        id: { type: string, format: uuid }
        position: { type: integer }
        conditionId: { type: string, format: uuid, nullable: true }
        title: { type: string }
        body:
          type: array
          items: { type: string }
        inline: { type: boolean }
        inherited: { type: boolean }
        inheritedFrom: { type: string, nullable: true, example: 'Billing' }

    CaseConditionInput:
      type: object
      properties:
        conditionId: { type: string, format: uuid, nullable: true }
        inlineBody:
          type: array
          items: { type: string }

    SharedStep:
      type: object
      required: [id, title, body, usageCount]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        body:
          type: array
          items: { type: string }
        usageCount:
          type: integer
          description: |
            Distinct **live** cases whose steps reference this entry. Derived by the query, never
            read from the stored column — see the `GET` description for why a denormalized counter
            was refused. A retired case stops counting; retiring the entry itself does not
            renumber anything, because the references survive it.

    SharedStepInput:
      type: object
      required: [title, body]
      description: |
        `usageCount` is absent by construction: it is derived from the references to the entry, so
        a client cannot state it, and offering the field would invite a value the server discards.
      properties:
        title:
          type: string
          description: |
            What the picker lists and what a referencing step shows as its action. The summary of
            the block, not the first line of it.
        body:
          type: array
          minItems: 1
          items: { type: string }
          description: |
            The ordered actions. A list rather than a paragraph for `Condition.body`'s reason —
            "sign in" is realistically three actions (ERD §4). At least one, and blank entries are
            dropped: an empty library block is a picker row that inserts nothing.

    BulkOperation:
      type: object
      required: [action, caseIds]
      description: |
        One action, one argument, over a selection of cases.

        **The permission depends on the argument, not only on the action.** `SET_STATUS` targeting
        `APPROVED` needs `case:approve` — Lead and up, and explicitly *not* Test Engineer (roles
        spec, Review table; plan §6g: *"the state machine has exactly one gate, held by
        `*:approve`"*). Every other action and every other target needs `case:edit`. A caller who
        holds `case:edit` and not `case:approve` therefore gets a 403 on one value of one field and
        a 200 on the rest, which is why the SPA gates the APPROVED option separately rather than
        gating the dialog.
      properties:
        action:
          type: string
          enum: [ATTACH_CONDITIONS, DETACH_CONDITIONS, SET_STATUS, SET_AUTOMATION_STATUS, SET_OWNER, ADD_TAGS, SUBMIT_FOR_REVIEW, MOVE_TO_SUITE]
          description: |
            `SUBMIT_FOR_REVIEW` is `SET_STATUS` with `lifecycleStatus: IN_REVIEW` and is kept
            because plan §6g uses the vocabulary ("bulk-submit"). The server aliases it at the
            parse boundary, so there is one implementation of the state change rather than two
            spellings that drift apart.
        caseIds:
          type: array
          minItems: 1
          maxItems: 500
          description: |
            The selection, in the caller's own order. Duplicates are collapsed and the result
            reports each distinct id exactly once.

            Capped because the whole operation is one transaction and one audit event, so an
            unbounded selection is an unbounded lock. 500 is comfortably above the case grid's
            largest page, so no selection a user can actually make in the product hits it.
          items: { type: string, format: uuid }
        dryRun:
          type: boolean
          default: true
          description: Preview first. The UI must show the preview before committing.
        payload:
          $ref: '#/components/schemas/BulkPayload'

    BulkPayload:
      type: object
      description: |
        The argument, typed. Every property is optional here and **exactly the ones its action
        needs are required by the server**, which answers 400 with the field name when one is
        missing — the same shape a form validation error takes, so the message lands on the control.

        Deliberately a flat object with optional members rather than a `oneOf` discriminated on
        `action`. A `oneOf` states the per-action requirement in the schema itself, which is
        genuinely better, and generates a TypeScript union the SPA would have to narrow at every
        call site to build a payload it constructs one field at a time. The server has to validate
        the combination either way — it is the only side that knows the action — so the `oneOf`
        would buy a compile-time check the client cannot use while costing every consumer a narrow.
      properties:
        lifecycleStatus:
          allOf: [{ $ref: '#/components/schemas/LifecycleStatus' }]
          description: Required by `SET_STATUS`. Refused for every other action.
        automationStatus:
          allOf: [{ $ref: '#/components/schemas/AutomationStatus' }]
          description: Required by `SET_AUTOMATION_STATUS`.
        notAutomatableReason:
          type: string
          nullable: true
          description: |
            Required by `SET_AUTOMATION_STATUS` when the target is `NOT_AUTOMATABLE`, by the same
            `V1` check constraint the single-case editor obeys — which is what keeps automation
            coverage honestly denominated rather than letting anything inconvenient be filed as
            impossible.
        ownerId:
          type: string
          format: uuid
          nullable: true
          description: |
            Required by `SET_OWNER`; `null` clears the owner. Validated against the project's
            member list — the same *active member ∧ project grant* predicate `GET /members` and
            `POST /work-items` use (§54), so the picker offers exactly the set the server accepts.
        suiteId:
          type: string
          format: uuid
          description: Required by `MOVE_TO_SUITE`. Must be a live suite in this project.
        tags:
          type: array
          items: { type: string }
          description: |
            Required by `ADD_TAGS`. Additive and set-valued: a tag a case already carries leaves it
            `unchanged` rather than failing, and nothing is removed. There is no bulk tag *removal*
            in this slice.
        conditionId:
          type: string
          format: uuid
          description: Required by `ATTACH_CONDITIONS` and `DETACH_CONDITIONS`.
        conditionKind:
          type: string
          enum: [PRE, POST]
          description: |
            Which list the attachment lands in, for `ATTACH_CONDITIONS`; the server defaults it to
            `PRE` when absent. Deliberately no `default:` here — openapi-typescript renders a
            defaulted property as **required**, which would force every caller to send a value the
            server is perfectly happy to choose. `BOTH` is not offered:
            it describes what a *library* condition may be used as, while an attachment is always
            one position in one of the two lists (see the `ConditionKind` javadoc).

    BulkResult:
      type: object
      description: |
        Every outcome is reported as a LIST OF KEYS, not a count. The UI has to name what
        it touched — "38 changed, 4 already matched, 2 skipped" with the two skipped cases
        named and their reason given. A bare `affected: 38` cannot be rendered as a preview,
        and a blanket success toast over a partial failure is the worse half of the defect,
        because the user believes all 44 went through (plan §6f).
      required: [dryRun, total, changed, unchanged, skipped]
      properties:
        dryRun:
          type: boolean
          description: True when this is a preview. The UI must preview before committing.
        total:
          type: integer
          description: Size of the requested selection.
        changed:
          type: array
          description: Case keys that changed (or would change, when dryRun).
          items: { type: string, example: TC-42 }
        unchanged:
          type: array
          description: Case keys already in the requested state — compliant, not failed.
          items: { type: string, example: TC-43 }
        skipped:
          type: array
          description: Case keys that could not be changed, each with a displayable reason.
          items:
            type: object
            required: [key, reason]
            properties:
              key: { type: string, example: TC-44 }
              reason: { type: string, example: 'A draft must be reviewed before it can be approved.' }
        auditEventId: { type: string, format: uuid, nullable: true }

    EntityVersion:
      type: object
      required: [versionNo, createdBy, createdAt, pinned]
      properties:
        versionNo: { type: integer }
        createdBy:
          # Nullable because test_case_version.created_by is, and carries no FK to
          # app_user (§28 finding 1). Two real states reach this field: nobody was
          # recorded (rows predating the first write path), and the recorded id names
          # no surviving account. Declaring it non-nullable made every consumer's
          # generated type lie, and the SPA carried a hand-widened alias to compensate
          # — §35 found it. Same treatment as TestCaseSummary.owner above.
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
        createdAt: { type: string, format: date-time }
        changeComment: { type: string, nullable: true }
        pinned: { type: boolean }

    VersionMarker:
      description: Rendered on history timelines so causation is visible (plan §6p).
      type: object
      required: [versionNo, occurredAt, author]
      properties:
        versionNo: { type: integer }
        occurredAt: { type: string, format: date-time }
        author:
          # Nullable because test_case_version.created_by is a nullable column with NO foreign key
          # to app_user (handoff §28, finding 1), so both "nobody was recorded" and "the recorded id
          # names no account" are states of a real row. Inventing a name for either would put an
          # author on the one table whose entire purpose is that past claims stay true.
          #
          # `repository`'s EntityVersion already ships null here and diverged from this contract
          # silently to do it (§35). Declared rather than left as a second undeclared divergence.
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
        changeComment: { type: string, nullable: true }

    # --------------------------------------------------------- execution ---
    TestPlanSummary:
      type: object
      required: [id, key, name, status, milestoneName, milestoneDate, caseCount, passRate, coverage]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: TP-1 }
        name: { type: string }
        status: { type: string, enum: [DRAFT, IN_REVIEW, APPROVED, ACTIVE, CLOSED] }
        milestoneName: { type: string, nullable: true }
        milestoneDate: { type: string, format: date, nullable: true }
        caseCount: { type: integer }
        passRate: { type: number, nullable: true }
        coverage: { type: number, nullable: true }

    TestPlan:
      allOf:
        - $ref: '#/components/schemas/TestPlanSummary'
        - type: object
          # `required` does not descend through allOf, so the second member declares its own —
          # without it every property here is optional and no consumer can use one.
          required: [description, entryCriteria, exitCriteria, configurations, currentVersionNo, lockVersion]
          properties:
            description: { type: string, nullable: true }
            entryCriteria:
              type: array
              items: { $ref: '#/components/schemas/Criterion' }
            exitCriteria:
              type: array
              items: { $ref: '#/components/schemas/Criterion' }
            configurations:
              type: array
              items: { $ref: '#/components/schemas/Configuration' }
            currentVersionNo: { type: integer }
            lockVersion: { type: integer }

    TestPlanInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        milestoneName: { type: string, nullable: true }
        milestoneDate: { type: string, format: date, nullable: true }
        suiteIds:
          type: array
          items: { type: string, format: uuid }
        caseIds:
          type: array
          items: { type: string, format: uuid }

    Criterion:
      type: object
      description: Machine-evaluable so the plan page is a gate, not prose (plan §6p).
      required: [metric, op, value, label]
      properties:
        metric: { type: string, example: pass_rate }
        op: { type: string, example: '>=' }
        value: { type: number }
        label: { type: string }
        met: { type: boolean, nullable: true }
        actual: { type: number, nullable: true }

    Configuration:
      type: object
      required: [id, name, isDefault, attributes]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: 'Chrome / Windows' }
        isDefault: { type: boolean }
        attributes:
          type: object
          additionalProperties: { type: string }

    TestRun:
      type: object
      required: [id, key, name, planId, planKey, configuration, status, releaseVersion, buildNumber, source, startedAt, completedAt, counts]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: TR-1 }
        name: { type: string }
        planId: { type: string, format: uuid, nullable: true }
        planKey: { type: string, nullable: true }
        configuration: { $ref: '#/components/schemas/Configuration' }
        status: { type: string, enum: [NOT_STARTED, IN_PROGRESS, COMPLETED, ABORTED] }
        releaseVersion: { type: string, nullable: true }
        buildNumber: { type: string, nullable: true }
        source: { type: string, enum: [MANUAL, INGESTED] }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        counts: { $ref: '#/components/schemas/ResultCounts' }

    TestRunInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        planId: { type: string, format: uuid, nullable: true }
        configurationId: { type: string, format: uuid, nullable: true }
        releaseVersion: { type: string, nullable: true }
        buildNumber: { type: string, nullable: true }
        caseIds:
          type: array
          items: { type: string, format: uuid }
        assigneeId: { type: string, format: uuid, nullable: true }

    TestRunDetail:
      allOf:
        - $ref: '#/components/schemas/TestRun'
        - type: object
          required: [executions]
          properties:
            executions:
              type: array
              items: { $ref: '#/components/schemas/TestExecutionSummary' }

    ResultCounts:
      type: object
      description: Counts, never percentages — the denominator toggle needs both (plan §6p).
      required: [passed, failed, blocked, skipped, notRun, total]
      properties:
        passed: { type: integer }
        failed: { type: integer }
        blocked: { type: integer }
        skipped: { type: integer }
        notRun: { type: integer }
        total: { type: integer }

    TestExecutionSummary:
      type: object
      description: |
        The case x run instance. Deliberately has NO display key (plan §6t): an execution is
        always reached through its run or its case, nobody says "TE-4038" out loud, and a
        per-execution counter would be the highest-volume contention point in the schema for no
        benefit. Identified by its UUID, or by (runId, caseId).
      required: [id, caseId, caseKey, caseTitle, caseVersionNo, status, assignee, executedBy, executedAt, durationMs, defects]
      properties:
        id: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        caseKey: { type: string }
        caseTitle: { type: string }
        caseVersionNo: { type: integer }
        status:
          allOf: [{ $ref: '#/components/schemas/CaseStatus' }]
          nullable: true
        # Both nullable, and both were declared as a bare $ref — which openapi-typescript
        # renders non-nullable, so the generated type claimed every execution has an assignee
        # and an executor. `test_execution.assignee_id` and `executed_by` are both nullable
        # columns and both states are ordinary: an unassigned execution, and one ingested from
        # CI where `executed_by_token` is set instead. Same correction §37 made to
        # `EntityVersion.createdBy`, and the same `allOf` + `nullable: true` idiom.
        assignee:
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
        executedBy:
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
        executedAt: { type: string, format: date-time, nullable: true }
        durationMs: { type: integer, nullable: true }
        defects:
          type: array
          items: { $ref: '#/components/schemas/DefectLink' }

    TestExecution:
      allOf:
        - $ref: '#/components/schemas/TestExecutionSummary'
        - type: object
          required: [comment, releaseVersion, stepFormat, preconditions, postconditions, steps, evidence, lockVersion]
          properties:
            comment: { type: string, nullable: true }
            releaseVersion: { type: string, nullable: true }
            stepFormat: { $ref: '#/components/schemas/StepFormat' }
            preconditions:
              type: array
              items: { $ref: '#/components/schemas/CaseConditionRef' }
            postconditions:
              type: array
              items: { $ref: '#/components/schemas/CaseConditionRef' }
            steps:
              type: array
              items: { $ref: '#/components/schemas/StepResult' }
            evidence:
              type: array
              items: { $ref: '#/components/schemas/Evidence' }
            lockVersion: { type: integer }

    StepResult:
      type: object
      description: |
        One step of the **pinned** case version, with whatever result has been recorded against
        it. The step fields are history and the result fields are current — which is why they
        share a shape rather than being two lists the client has to join by `stepId`.
      required: [stepId, position, keyword, action, testData, expectedResult, statusId, comment, evidence]
      properties:
        stepId: { type: string, format: uuid }
        position: { type: integer }
        keyword: { type: string, nullable: true }
        action: { type: string }
        testData: { type: string, nullable: true }
        expectedResult: { type: string, nullable: true }
        statusId: { type: string, format: uuid, nullable: true }
        comment: { type: string, nullable: true }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/Evidence' }

    Evidence:
      type: object
      required: [id, filename, contentType, sizeBytes, url, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer }
        url: { type: string }
        thumbnailUrl: { type: string, nullable: true }
        caption: { type: string, nullable: true }
        createdBy:
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
          description: |
            **Nullable, and that is load-bearing.** `evidence.created_by` has no `NOT NULL` and no
            foreign key, so a row written before authorship was recorded has no author — and
            `evidence:delete`'s `OWN` qualifier answers such a row **false**: a grant covering
            "your own work" must not stretch to work nobody can attribute.

            The client must therefore be able to see the *absence* rather than infer it. A
            non-nullable declaration here would make the SPA collapse "no author" into "some
            author", which is the arm the whole qualifier turns on. Same shape as
            `TestCaseSummary.createdBy` (§66).
        createdAt: { type: string, format: date-time }

    ExecutionResultInput:
      type: object
      description: |
        **No `lockVersion` field.** The version the client read is a precondition, and it
        travels as `If-Match` — see that parameter for why a body field would be a value on an
        input schema that must never be persisted. The SPA sent one in the body for as long as
        no server read it, which is the divergence class this schema exists not to repeat.
      required: [statusId]
      properties:
        statusId:
          type: string
          format: uuid
          description: |
            Required: this endpoint records a verdict. A status outside the project's own
            vocabulary is a 400 on this field.
        comment: { type: string, nullable: true }
        stepResults:
          type: array
          description: |
            Optional and partial — a step absent from the list keeps whatever it had. A
            `stepId` that is not a step of the **pinned** case version is a 400 on the field
            rather than an ignored entry: silently dropping it is a save that reports success
            and discards what the tester marked.
          items:
            type: object
            required: [stepId, statusId]
            properties:
              stepId: { type: string, format: uuid }
              statusId: { type: string, format: uuid }
              comment: { type: string, nullable: true }

    DefectLink:
      type: object
      required: [id, externalKey, provider, url]
      properties:
        id: { type: string, format: uuid }
        externalKey: { type: string, example: 'PAY-991' }
        provider: { type: string, example: JIRA }
        url: { type: string }
        statusCache: { type: string, nullable: true }

    # ----------------------------------------------------------- history ---
    CaseHistorySummary:
      type: object
      description: |
        Defaults to the CURRENT version only, and says so — blending results across
        versions reports a number nobody should act on (plan §6p).
      required: [scope, currentVersionNo, executions, passed, failed]
      properties:
        scope: { type: string, example: 'Current version (v7)' }
        currentVersionNo: { type: integer }
        executions: { type: integer }
        passed: { type: integer }
        failed: { type: integer }
        lastExecutedAt: { type: string, format: date-time, nullable: true }
        flakinessScore:
          type: number
          nullable: true
          description: Alternation WITHIN one version and configuration only (plan §6p).
        firstFailedAt: { type: string, format: date-time, nullable: true }
        firstFailedInRelease: { type: string, nullable: true }

    ExecutionHistoryEntry:
      type: object
      required: [executionId, statusKind, statusName, statusColor, caseVersionNo, runId, runKey, runName, runDeleted, configuration, executedBy, source, executedAt, evidenceCount, defects]
      properties:
        executionId: { type: string, format: uuid }
        statusKind: { $ref: '#/components/schemas/StatusKind' }
        statusName: { type: string }
        statusColor: { type: string }
        caseVersionNo: { type: integer }
        releaseVersion: { type: string, nullable: true }
        buildNumber: { type: string, nullable: true }
        runId: { type: string, format: uuid }
        runKey: { type: string }
        runName: { type: string }
        runDeleted:
          type: boolean
          description: |
            The run holding this result has been withdrawn. The entry stays — plan §6p: "deleted
            runs must not orphan history … with the entry marked rather than vanishing", and
            history that quietly loses rows is worse than no history.

            This is the field that makes that rule expressible, and it is required because the
            alternative reading of an absent flag is "not deleted", which is the dangerous default:
            a withdrawn failure would read as a live one. A client MUST mark the entry and MUST NOT
            offer navigation into the run, which answers 404.

            Note the contrast with the plan-statistics endpoint, which EXCLUDES deleted runs
            entirely: that one reports current state, where counting a retracted result would
            restore it. A timeline is the other case.
          example: false
        planKey: { type: string, nullable: true }
        configuration: { type: string }
        executedBy:
          # Nullable for two independent reasons, both reachable: test_execution.executed_by is a
          # nullable column (an execution row nobody has recorded yet has none), and the id has no
          # cascade, so "the account that recorded this has since been removed" is a state real rows
          # reach. The SPA has always guarded this with `entry.executedBy?.displayName` — the type
          # said it could not be null while the only consumer assumed it could.
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
        executedByToken: { type: string, nullable: true }
        source: { type: string, enum: [MANUAL, INGESTED] }
        executedAt: { type: string, format: date-time }
        durationMs: { type: integer, nullable: true }
        evidenceCount: { type: integer }
        defects:
          type: array
          items: { $ref: '#/components/schemas/DefectLink' }

    SuiteHistoryResponse:
      description: |
        A NAMED schema rather than an inline object on the operation, and that is the point of it.
        Inline, the SPA typed its own `{ runs, versionMarkers }` literal at the call site — and
        called the array `runs` while this contract called it `entries`. Nothing compared the two
        spellings, because a hand-written type argument is not generated from anything. Named, the
        SPA imports `SuiteHistoryResponse` and the compiler is the comparison (§52).
      type: object
      # Both arrays are always sent; empty is the answer for a suite with no history, and an
      # absent array would make the page unable to tell "none" from "not loaded".
      required: [entries, versionMarkers]
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/SuiteRunSummary' }
        versionMarkers:
          type: array
          items: { $ref: '#/components/schemas/VersionMarker' }

    SuiteRunSummary:
      type: object
      required: [runId, runKey, runName, suiteVersionNo, configuration, executedAt, counts, runDeleted]
      properties:
        runId: { type: string, format: uuid }
        runKey: { type: string }
        runName: { type: string }
        suiteVersionNo: { type: integer }
        configuration: { type: string }
        releaseVersion: { type: string, nullable: true }
        executedAt:
          type: string
          format: date-time
          description: |
            The most recent result recorded against this suite in this run, falling back to the
            run's own start when nothing in the suite has been executed yet — a run that has
            opened but recorded nothing is still history ("this suite is in flight"), and the
            page sorts by this field, so it cannot be null.
        counts: { $ref: '#/components/schemas/ResultCounts' }
        runDeleted:
          type: boolean
          description: |
            The run was soft-deleted. §6p: deleted runs must not orphan history — the entry stays
            and is marked, because history that quietly loses rows is worse than no history. Same
            field, same reason, as `ExecutionHistoryEntry.runDeleted` (§49).

    # --------------------------------------------------------- reporting ---
    RepositoryDashboard:
      type: object
      required:
        [generatedAt, lifecycle, health, healthComputedAt, byFeature, byOwner,
         automationCoverage, recentActivity]
      properties:
        generatedAt: { type: string, format: date-time }
        lifecycle:
          type: array
          items: { $ref: '#/components/schemas/DashboardTile' }
        health:
          type: array
          items: { $ref: '#/components/schemas/DashboardTile' }
        healthComputedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            When these signals were last derived, or **null when they never have been**.
            The two are not the same and must not render the same: an empty `health` array
            with a timestamp means "nothing is wrong", while one with `null` means "nobody
            has looked". `case_health` is a read model with no writer yet (plan §6o), so
            this is null in every deployment today — and a "Needs attention" panel that
            renders empty without saying so is the reassuring-but-false screen §6p exists
            to prevent.
        byFeature:
          type: array
          items: { $ref: '#/components/schemas/DashboardBreakdown' }
        byOwner:
          type: array
          items: { $ref: '#/components/schemas/DashboardBreakdown' }
        automationCoverage:
          type: object
          required: [automated, toBeAutomated, manual, notAutomatable, coveragePercent]
          properties:
            automated: { type: integer }
            toBeAutomated: { type: integer }
            manual: { type: integer }
            notAutomatable: { type: integer }
            coveragePercent:
              type: number
              description: automated / (total - notAutomatable) — honestly denominated (plan §6c).
        recentActivity:
          description: |
            Thirty days ending today, UTC, one point per day including days with no
            activity. **There is deliberately no `approved` series.** Nothing in the schema
            records *when* a case was approved — `test_case.lifecycle_status` is current
            state, and `audit_event.changes` carries the version number rather than a field
            diff by design — so the series could only ever be zero, and a flat zero line
            states "nobody approved anything this month" about a client's work rather than
            "this is not measured". It returns when the review workflow (§6g) gives
            approval a timestamp to count.
          type: array
          items:
            type: object
            required: [date, created, modified]
            properties:
              date: { type: string, format: date }
              created: { type: integer }
              modified: { type: integer }

    DashboardTile:
      type: object
      description: |
        `filter` is the query that reproduces this count — the tile is a link into
        a pre-filtered, bulk-actionable case list, not decoration (plan §6o).
      required: [key, label, count, severity, filter]
      properties:
        key: { type: string }
        label: { type: string }
        count: { type: integer }
        severity: { type: string, enum: [NEUTRAL, INFO, WARNING, ERROR] }
        filter:
          type: object
          additionalProperties: true

    DashboardBreakdown:
      type: object
      required: [id, label, segments]
      properties:
        id: { type: string }
        label: { type: string }
        segments:
          type: array
          items:
            type: object
            required: [key, label, count, color, filter]
            properties:
              key: { type: string }
              label: { type: string }
              count: { type: integer }
              color: { type: string }
              filter:
                type: object
                additionalProperties: true

    PlanStatistics:
      type: object
      required: [planId, planKey, planName, planVersionNo, aggregationPolicy, counts, coveragePercent, stale, byConfiguration, bySuite, blockers, notRun, exitCriteria, trend]
      properties:
        planId: { type: string, format: uuid }
        planKey: { type: string }
        planName: { type: string }
        planVersionNo: { type: integer }
        aggregationPolicy: { $ref: '#/components/schemas/AggregationPolicy' }
        counts: { $ref: '#/components/schemas/ResultCounts' }
        coveragePercent:
          type: number
          description: |
            Distinct in-scope cases carrying any result, over every case in scope, times 100.
            A headline figure, not a footnote — 89% pass over 40% coverage is not green
            (plan §6p). Independent of `aggregation`: a case is covered or it is not,
            whichever way its several results resolve to one.
        latestExecutionAt: { type: string, format: date-time, nullable: true }
        stale:
          type: boolean
          description: |
            **Nothing has been executed against this plan in 14 days** — not a freshness
            warning about the figures themselves, which are computed per request. Plan §6p:
            "a plan page showing 94% from three weeks ago, presented as current, is the most
            dangerous screen in the product". False for a plan with no results at all, which
            is un-started rather than stale, and the `counts.total == counts.notRun` branch
            already says so in plainer words.
        byConfiguration:
          type: array
          items:
            type: object
            required: [configuration, counts]
            properties:
              configuration: { type: string }
              counts: { $ref: '#/components/schemas/ResultCounts' }
        bySuite:
          type: array
          items:
            type: object
            required: [suiteId, suiteKey, suiteName, counts]
            properties:
              suiteId: { type: string, format: uuid }
              suiteKey: { type: string }
              suiteName: { type: string }
              counts: { $ref: '#/components/schemas/ResultCounts' }
        blockers:
          type: array
          items: { $ref: '#/components/schemas/TestExecutionSummary' }
        notRun:
          # Was TestCaseSummary until M2 slice 3, and narrowing it was the price of keeping
          # the `execution` -> `repository` seam one class wide. TestCaseSummary requires
          # features, tags, healthSignals, automationStatus, owner and updatedAt — none of
          # which this panel renders, and every one of which would have to be re-derived
          # here from case_classification, case_tag, case_health and app_user, duplicating
          # repository.CaseSummaries inside a module forbidden to import it.
          type: array
          items: { $ref: '#/components/schemas/PlanCaseRef' }
        exitCriteria:
          type: array
          items: { $ref: '#/components/schemas/Criterion' }
        trend:
          type: array
          items:
            type: object
            required: [runKey, executedAt, passRate]
            properties:
              runKey: { type: string }
              executedAt: { type: string, format: date-time }
              passRate: { type: number }

    PlanCaseRef:
      type: object
      description: |
        A case named in a plan's scope, carrying only what a plan-level list renders.
        Deliberately not TestCaseSummary: the `execution` module may not read the
        repository's tables except through one seam class (ERD §0.2), and every field
        beyond these six would widen that seam to serve a panel that shows a key, a
        title and a suite name.
      required: [id, key, keySeq, title, suiteId, suiteName]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: TC-1 }
        keySeq:
          type: integer
          description: Sort by this — text keys do not order correctly (TC-10000 < TC-9999).
        title: { type: string }
        suiteId: { type: string, format: uuid }
        suiteName: { type: string }

    ReportDefinition:
      type: object
      required: [id, type, name, parameters, owner]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        name: { type: string }
        parameters:
          type: object
          additionalProperties: true
        owner: { $ref: '#/components/schemas/UserRef' }

    ReportJob:
      type: object
      # `downloadUrl` is null until the job reaches COMPLETED — always present, sometimes null, so
      # it is required AND nullable. A poller reads `status` to decide whether to keep polling and
      # must not have to null-check the field it polls on.
      required: [jobId, status, format, downloadUrl]
      properties:
        jobId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, RUNNING, COMPLETED, FAILED] }
        format: { type: string }
        downloadUrl: { type: string, nullable: true }

    # ----------------------------------------------------- documentation ---
    DocPageSummary:
      type: object
      required: [id, key, title, slug, status, updatedAt]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: DOC-1 }
        parentId: { type: string, format: uuid, nullable: true }
        title: { type: string }
        slug: { type: string }
        status: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] }
        updatedAt: { type: string, format: date-time }

    DocPage:
      allOf:
        - $ref: '#/components/schemas/DocPageSummary'
        - type: object
          # `required` does not descend through allOf, so this branch declares its own — the same
          # repair TestCase and TestPlan already carry. Without it `lockVersion` cannot be sent as
          # If-Match without a null check on a value every response has.
          required: [blocks, currentVersionNo, lockVersion]
          properties:
            blocks:
              type: array
              items: { $ref: '#/components/schemas/DocBlock' }
            currentVersionNo: { type: integer }
            lockVersion: { type: integer }

    DocBlock:
      type: object
      required: [id, position, blockType, text]
      properties:
        id:
          type: string
          format: uuid
          description: |
            Immutable, generated at creation, never derived from text. Links target
            this — heading-text anchors break silently when a typo is fixed (plan §6i).
        position: { type: integer }
        blockType: { type: string, enum: [heading, paragraph, list, code, table, image] }
        level: { type: integer, nullable: true }
        text: { type: string }
        coverage:
          description: Inline coverage marker — what makes people maintain links (plan §6i).
          type: object
          nullable: true
          required: [linkedCases, passed, failed, notRun, caseKeys]
          properties:
            linkedCases: { type: integer }
            passed: { type: integer }
            failed: { type: integer }
            notRun: { type: integer }
            caseKeys:
              type: array
              items: { type: string }

    DocPageInput:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 200 }
        parentId:
          type: string
          format: uuid
          nullable: true
          description: |
            The page this one nests under, or null for a root page. Accepted on create; on a
            `PATCH` it must match the page's current parent — a different value is a `400` rather
            than a silently ignored field, because reparenting rewrites every descendant's `path`
            and a client must not be able to believe a move happened. Same rule, and the same
            reason, as `SuiteInput.parentId`.
        blocks:
          type: array
          description: |
            The page's whole content, in array order — `position` is not sent, because two clients
            disagreeing about the numbers is a reordering nobody asked for.

            Omitted on a create means an empty page, which is a real and useful state. Omitted on a
            `PATCH` leaves the blocks alone: that is a retitle, and it must not be a way to empty a
            page by forgetting a field.
          items: { $ref: '#/components/schemas/DocBlockInput' }

    DocBlockInput:
      type: object
      required: [blockType, text]
      properties:
        id:
          type: string
          format: uuid
          nullable: true
          description: |
            The id of an existing block on this page, to edit it **in place**. Absent means a new
            block, whose id the server generates.

            This field is what makes traceability survive editing: a block keeps its id however
            much its text changes, so a link to it does not break when somebody fixes a typo
            (plan §6i/§6m). Sending an id belonging to another page — or to no block — is a `400`.
        blockType: { type: string, enum: [heading, paragraph, list, code, table, image] }
        level:
          type: integer
          nullable: true
          minimum: 1
          maximum: 6
          description: Heading depth. Required for `heading`, refused on every other type.
        text: { type: string }

    DocPageStatusInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] }

    DocLink:
      type: object
      required: [id, targetKind, relationship, stale]
      properties:
        id: { type: string, format: uuid }
        targetKind: { type: string, enum: [DOC_BLOCK, EXTERNAL_GIT, EXTERNAL_URL] }
        relationship: { type: string, enum: [VERIFIES, DERIVED_FROM, REFERENCES] }
        pageId: { type: string, format: uuid, nullable: true }
        pageKey: { type: string, nullable: true }
        pageTitle: { type: string, nullable: true }
        blockId: { type: string, format: uuid, nullable: true }
        blockExcerpt: { type: string, nullable: true }
        externalRepo: { type: string, nullable: true }
        externalPath: { type: string, nullable: true }
        externalLineStart: { type: integer, nullable: true }
        externalLineEnd: { type: integer, nullable: true }
        externalCommitSha:
          type: string
          nullable: true
          description: Mandatory for EXTERNAL_GIT — a line number without it is meaningless later.
        externalUrl: { type: string, nullable: true }
        stale:
          type: boolean
          description: True when the target changed after the case was last touched (plan §6i).

    Artifact:
      type: object
      required: [id, scope, category, kind, title, status, inherited, updatedBy, updatedAt]
      properties:
        id: { type: string, format: uuid }
        scope: { type: string, enum: [PROJECT, PLAN] }
        category: { type: string }
        kind: { type: string, enum: [FILE, DOC_PAGE_REF, EXTERNAL_URL, GENERATED_REPORT] }
        title: { type: string }
        description: { type: string, nullable: true }
        status: { type: string, enum: [ACTIVE, SUPERSEDED, ARCHIVED] }
        inherited:
          type: boolean
          description: Project-scope artifact shown read-only inside a plan (plan §6n).
        url: { type: string, nullable: true }
        docPageId:
          type: string
          format: uuid
          nullable: true
          description: |
            Set when `kind` is `DOC_PAGE_REF`, so the register can link through to the page.

            Without it the kind plan §6n steers people toward is the one kind the reader cannot
            open — a row that says "Documentation page" and goes nowhere, while an `EXTERNAL_URL`
            beside it is clickable. That asymmetry would push people back to pasting links.
        filename: { type: string, nullable: true }
        sizeBytes: { type: integer, nullable: true }
        updatedBy: { $ref: '#/components/schemas/UserRef' }
        updatedAt: { type: string, format: date-time }

    ArtifactInput:
      type: object
      required: [scope, category, kind, title]
      description: |
        A registration. Which of `docPageId` / `url` is required is decided by `kind`, and which of
        `planId` is required is decided by `scope` — both are validated server-side and answered as
        a `400` naming the field, because a schema that expressed them as `oneOf` would generate a
        union the SPA has to discriminate before it can render one form.
      properties:
        scope:
          type: string
          enum: [PROJECT, PLAN]
          description: |
            `PLAN` requires `planId`. `PROJECT` requires it to be absent — a project-scope artifact
            is inherited by *every* plan (plan §6n), so a plan id on one would name a relationship
            that does not exist.

            This is also the field the permission qualifier reads: `artifact:edit` is held outright
            by a Test Lead and **plan-scope-only** by a Test Engineer, so a `PROJECT` here can be a
            `403` where a `PLAN` from the same caller is a `201`.
        planId:
          type: string
          format: uuid
          nullable: true
          description: Required when `scope` is `PLAN`, and rejected otherwise.
        category:
          type: string
          maxLength: 60
          description: |
            Strategy · TestData · Environment · SignOff · Compliance · Tooling · Template · Other
            (plan §6n). A free string rather than an enum because the list is described as
            project-configurable, and the register groups by it rather than switching on it.
        kind:
          type: string
          enum: [DOC_PAGE_REF, EXTERNAL_URL]
          description: |
            The two **reference** kinds. Narrower than `Artifact.kind` on purpose — see the
            operation description for why `FILE` and `GENERATED_REPORT` are not accepted here.
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000, nullable: true }
        docPageId:
          type: string
          format: uuid
          nullable: true
          description: |
            Required when `kind` is `DOC_PAGE_REF`. Must name a live page **in this project** — a
            page in another project of the same company is a `400`, and one in another company is
            the same `400` rather than a `404`, because distinguishing them would confirm the id
            names something real (§6t).
        url:
          type: string
          maxLength: 2000
          nullable: true
          description: |
            Required when `kind` is `EXTERNAL_URL`. Must be `http` or `https`: the register renders
            this as a link, and a `javascript:` or `data:` URL rendered as one is stored XSS with
            the product's own markup around it.

    # --------------------------------------------------------------- admin ---
    User:
      allOf:
        - $ref: '#/components/schemas/UserRef'
        - type: object
          required: [status, teams]
          properties:
            status: { type: string, enum: [ACTIVE, INVITED, DEACTIVATED] }
            lastLoginAt: { type: string, format: date-time, nullable: true }
            teams:
              type: array
              items: { type: string }

    UserInvitationInput:
      type: object
      required: [email, displayName]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          description: |
            Case-insensitive (`citext`). Matching an account that already exists on the instance
            reuses it silently — see the operation's description for why the answer must not
            differ.
        displayName:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            **This company's** name for the person (§6u), stored on the membership rather than on
            the account. A contractor is legitimately "A. Kotrulev" to one client and
            "Aleks (Vendor)" to another, and neither may see or overwrite the other's.
      description: |
        There is no `companyId` and no role. The company comes from the session's context (ERD
        §0.1 point 2), and what the person may *do* is a separate grant — `POST /role-assignments`
        — so that inviting somebody can never be the act that also gives them access.

    UserInvitation:
      type: object
      required: [user, issued, emailed, expiresAt]
      properties:
        user: { $ref: '#/components/schemas/User' }
        issued:
          type: boolean
          description: |
            Whether **this call minted a fresh activation link**. `false` means there was nothing
            to mint — the person is already an active member, or an unexpired invitation was
            outstanding and was deliberately left alone.

            It carries the same fact as `201` vs `200`, and it is on the body because the two
            reasons a link was not *sent* are not otherwise distinguishable: `emailed: false` with
            `issued: true` is "no relay on this install", and with `issued: false` it is "nothing
            needed sending". A client that infers the first from `emailed` alone tells an
            administrator with a perfectly good relay that their mail is broken, every time they
            click twice.
        emailed:
          type: boolean
          description: |
            Whether the activation link was handed to a configured SMTP relay. `false` means either
            that the instance has none and an operator must deliver the link by hand, or that
            nothing was minted to send — see `issued`. Never that the invitation failed.
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: |
            When the outstanding invitation lapses. **Null when there is nothing to accept** —
            the person is already an active member.
      description: |
        The activation link itself is deliberately **absent**. It is a live single-use secret with
        exactly one legitimate destination (the invitee's inbox); putting it in an API response
        publishes it to devtools, to any proxy log, and to whatever the SPA caches.

    Team:
      type: object
      required: [id, name, leads, members, projects]
      properties:
        id: { type: string, format: uuid }
        parentTeamId:
          type: string
          format: uuid
          nullable: true
          description: Org-chart structure only — permissions never cascade (plan §6k).
        name: { type: string }
        description: { type: string, nullable: true }
        leads:
          type: array
          items: { $ref: '#/components/schemas/UserRef' }
        members:
          type: array
          items: { $ref: '#/components/schemas/UserRef' }
        projects:
          type: array
          items:
            type: object
            # Same descent rule as CurrentUser.teams, which carries this comment already: a team's
            # project row exists BECAUSE it has a grant, so all three are always populated.
            required: [projectId, projectName, roleName]
            properties:
              projectId: { type: string, format: uuid }
              projectName: { type: string }
              roleName: { type: string }

    Role:
      type: object
      description: |
        One of exactly six built-in roles. There are no custom roles in v1 — not even
        clone-and-edit (plan §6b) — so `builtIn` is always true and there is no create
        or update endpoint. Enforcement is permission-based throughout: nothing in the
        code checks a role NAME, which is what keeps adding a role designer additive.

        A COMPANY-scope grant covers every project in that company, present and future.
        That is what makes Company Admin work, and why nothing else is granted there.
      required: [id, name, scope, builtIn, description, permissions]
      properties:
        id: { type: string, format: uuid }
        name:
          type: string
          enum:
            - Instance Admin
            - Company Admin
            - Test Lead
            - Test Engineer
            - Automation Service
            - Viewer
        scope: { type: string, enum: [SYSTEM, COMPANY, PROJECT] }
        builtIn: { type: boolean }
        description: { type: string }
        permissions:
          type: array
          description: |
            Permission keys, `resource:action`. The authoritative catalogue and the
            per-role grants live in docs/specs/2026-07-30-tcms-roles-permissions-naming.md.
            `OWN`-qualified entries (case:delete, evidence:delete for Test Engineer) are
            resolved server-side against createdBy — they are NOT separate keys.
          items: { $ref: '#/components/schemas/PermissionKey' }

    EffectivePermissions:
      type: object
      # `required` on BOTH fields, deliberately. The server always sends both — projectId
      # echoes the query parameter and is null when there wasn't one — and without the array
      # every generated property is optional, so a consumer must null-check a field that is
      # never absent and cannot tell "no permissions" from "no answer". That distinction is
      # the whole basis of the SPA's disable-don't-hide gate.
      required: [projectId, permissions]
      properties:
        projectId:
          type: string
          format: uuid
          nullable: true
          description: Echoes the query parameter. Null when the caller asked company-wide.
        permissions:
          type: array
          description: |
            Sorted by `key`, and possibly empty — an empty array is a real answer (a company
            member with no grant on this project), not a missing one.

            Entries carry a `qualifier` as well as a key. Until §65 this was an array of bare
            keys, and the omission had a cost the SPA could not work around: a Test Engineer
            holds `artifact:edit` at `PLAN_SCOPE`, so a keys-only answer says "held", the
            project-scope control enables, and the server refuses the submit. Disable-don't-hide
            (handoff §31) is not expressible against an answer that cannot say "held, but not
            here".
          items: { $ref: '#/components/schemas/HeldPermission' }

    HeldPermission:
      type: object
      # Both required. A held key ALWAYS has a qualifier — `ALL` is what an unqualified grant
      # stores, not an absence — so an optional `qualifier` would invite every consumer to
      # invent a default, and the two plausible defaults grant different things.
      required: [key, qualifier]
      properties:
        key: { $ref: '#/components/schemas/PermissionKey' }
        qualifier: { $ref: '#/components/schemas/PermissionQualifier' }

    PermissionQualifier:
      type: string
      description: |
        WHICH ROWS a held permission covers — roles spec §A5. The key says what the caller may
        do; this says what they may do it to.

        `NONE` is deliberately absent from this enum. A permission the caller does not hold is
        an absent entry in `permissions`, never a present one qualified to nothing — the same
        rule the database follows, where a grant of nothing is an absent row.

        The two restrictive values are NOT comparable: `OWN` restricts by who wrote the row,
        `PLAN_SCOPE` by what scope the row sits at, and neither contains the other. A caller
        cannot receive both for one key — no permission is granted with two different
        restrictive qualifiers, which the server asserts over its own catalogue.
      enum:
        # Every row in scope. What an unqualified grant means, and the great majority.
        - 'ALL'
        # Only rows the caller authored, in any state. Compared against the row's createdBy;
        # a row with no recorded author is NOT the caller's.
        - 'OWN'
        # Only rows belonging to one plan, whoever wrote them. A project-scope row is
        # inherited read-only by every plan, so editing one edits every cycle at once.
        - 'PLAN_SCOPE'

    PermissionKey:
      type: string
      description: |
        The full v1 catalogue. Grouped by area, in the order the spec lists them.
        Six of these are newer than the first UI pass — suite:delete, project:audit,
        case:comment, defect:create, workitem:manage, library:manage — and three split
        a boundary that was previously wrong (suite:delete out of suite:manage,
        project:audit out of audit:view, case:comment below the review tier).
      enum:
        # repository
        - 'suite:manage'
        - 'suite:delete'
        - 'case:read'
        - 'case:create'
        - 'case:edit'
        - 'case:delete'
        - 'library:manage'
        # review — three tiers: comment < review < approve
        - 'case:comment'
        - 'case:review'
        - 'suite:review'
        - 'plan:review'
        - 'case:approve'
        - 'suite:approve'
        - 'plan:approve'
        # execution
        - 'plan:create'
        - 'plan:edit'
        - 'plan:delete'
        - 'run:create'
        - 'run:execute'
        - 'run:close'
        - 'result:submit'
        - 'result:amend'
        - 'evidence:attach'
        - 'evidence:delete'
        # defects & work
        - 'defect:create'
        - 'workitem:manage'
        # reporting
        - 'report:view'
        - 'report:export'
        # documentation
        - 'doc:read'
        - 'doc:edit'
        - 'doc:publish'
        # artifacts
        - 'artifact:read'
        - 'artifact:edit'
        - 'artifact:delete'
        # project
        - 'project:read'
        - 'project:audit'
        - 'project:settings'
        - 'project:members'
        - 'integration:manage'
        # company (COMPANY scope)
        - 'company:read'
        - 'company:settings'
        - 'company:members'
        - 'company:teams'
        - 'company:vocabulary'
        - 'company:idp'
        - 'project:create'
        - 'token:issue'
        - 'audit:view'
        # system (SYSTEM scope)
        - 'company:create'
        - 'company:delete'
        - 'company:suspend'
        - 'user:manage'
        - 'role:manage'
        - 'system:settings'
        - 'instance:audit'

    RoleAssignment:
      type: object
      required: [id, role, user, grantedAt]
      properties:
        id: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/Role' }
        user:
          description: |
            **Null on a team grant.** `ck_role_assignment_subject` is user *xor* team, and
            `POST /role-assignments` takes exactly one of `userId` and `teamId` — so a grant
            made to a team names no user, and the previous non-nullable `$ref` made the
            generated type claim otherwise. Third time this idiom has been needed for the same
            reason: see `EntityVersion.createdBy` and `TestExecutionSummary.executedBy`.
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
        team:
          type: object
          nullable: true
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        projectId: { type: string, format: uuid, nullable: true }
        projectName: { type: string, nullable: true }
        grantedAt: { type: string, format: date-time }

    RoleAssignmentInput:
      type: object
      description: |
        `projectId` is what selects the scope of the grant, and therefore which permission
        gates it — see `POST /role-assignments`. It is nullable rather than optional so that
        "grant across the whole company" is something the caller states, not something they
        fall into by omitting a field.
      required: [roleId, projectId]
      properties:
        roleId: { type: string, format: uuid }
        userId: { type: string, format: uuid, nullable: true }
        teamId: { type: string, format: uuid, nullable: true }
        projectId:
          type: string
          format: uuid
          nullable: true
          description: Null grants the role across every project in the company, present and future.

    # ---------------------------------------------------------------- work ---
    WorkItem:
      type: object
      required: [id, derived, kind, title, status, priority, overdue, projectId, projectKey, allowedTransitions]
      properties:
        id: { type: string }
        derived:
          type: boolean
          description: |
            True for projections of an execution, review, or stale case. Derived items
            are NOT stored and their status comes from the source, so a card can never
            diverge from its execution (plan §6l).
        sourceType: { type: string, nullable: true, example: EXECUTION }
        sourceId: { type: string, format: uuid, nullable: true }
        kind:
          type: string
          enum: [TASK, EXECUTION, REVIEW, DOC_UPDATE, CASE_MAINTENANCE, DEFECT]
        title: { type: string }
        description: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/WorkItemStatus' }
        priority: { $ref: '#/components/schemas/Priority' }
        dueDate: { type: string, format: date, nullable: true }
        overdue: { type: boolean }
        assignee: { $ref: '#/components/schemas/UserRef' }
        projectId: { type: string, format: uuid }
        projectKey: { type: string }
        linkedKey: { type: string, nullable: true, example: TC-42 }
        allowedTransitions:
          type: array
          description: |
            Columns this card may legally move to; others reject the drop. Empty for a
            derived card whose source offers no board-driven action.
          items: { $ref: '#/components/schemas/WorkItemStatus' }

    WorkItemStatus:
      type: string
      description: |
        A board column, as a stable code rather than its English label.

        **It was an unconstrained `string` until §53, and that was the defect.** The SPA
        compared it against display text (`'To do'`), the mock served the same display
        text, and mock mode therefore agreed with itself perfectly — while any server that
        chose `TODO` would have filed every card into no column at all and rendered an
        empty board with no error. Same family as §52's `runs`/`entries`, one level down:
        not a field the two sides spelled differently, but a field whose *vocabulary* the
        contract never fixed, so neither side could be wrong.

        The label lives in `frontend/src/lib/labels.ts`, where a new member is a compile
        error until it is labelled. §6l's per-board configurable columns therefore become
        configuration over this enum rather than a contract change per column.

        **`BLOCKED` arrived in §54 and it is the fifth column, not merely a fifth value.**
        §53 left it out on purpose and said why: the board renders exactly the columns this
        enum names, so a status with no column would be a card that exists, is returned by
        this API, and appears **nowhere on screen** — invisible rather than misplaced, which
        is the worse of the two failures. That made adding it a contract change *plus* a
        label *plus* a grid column, and shipping only the first is how the invisible card
        gets there. All three land together, and `boardColumns.test.ts` now derives the
        board's columns from this enum so the next member cannot arrive without one.

        Ordered as §6l lists them, and the order on the wire is not the display order —
        `BoardPage`'s `COLUMNS` owns that. The enum's job is the vocabulary.
      enum: [TODO, IN_PROGRESS, BLOCKED, IN_REVIEW, DONE]

    WorkItemInput:
      type: object
      required: [projectId, title]
      properties:
        projectId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string, nullable: true }
        priority: { $ref: '#/components/schemas/Priority' }
        dueDate: { type: string, format: date, nullable: true }
        assigneeId:
          type: string
          format: uuid
          nullable: true
          description: |
            Omit to leave the task unassigned. **Unassigned, not "assigned to me"** — a
            board where every task silently belongs to whoever typed it cannot express the
            unclaimed pool §6l calls for, and the correction is invisible once made.
      description: |
        A new task. `status` is absent on purpose: a task starts in `TODO`, and letting a
        create choose its column would allow "create it in Done", which is a move without
        a move ever being recorded.

    WorkItemStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/WorkItemStatus' }

security:
  - bearerAuth: []
