openapi: 3.1.0
info:
  title: TCMS API
  version: 0.1.0-mock
  description: |
    Test Case Management System — REST contract.

    This is the source of truth for the frontend TypeScript types and the MSW mock
    handlers. The backend has not been implemented yet; the shapes here are what the
    UI is being designed against, and will drive the eventual Spring Boot controllers.

    Companion documents:
      * docs/plans/2026-07-30-tcms-high-level-plan.md  (§ references throughout)
      * docs/specs/2026-07-30-tcms-erd.md              (persistence model)
      * docs/specs/2026-07-30-tcms-roles-permissions-naming.md
        (AUTHORITATIVE for the permission catalogue, role grants and naming)

    Conventions
      * All ids are UUIDs — and UUIDs are the only identifiers any path accepts.
      * Display keys (TC-1, TP-1, TS-1, TR-1, DOC-1) are sequential PER COMPANY and
        unique across all of that company's projects (plan §6t). They are display
        only: they never appear as a path identifier, because they are trivially
        guessable where a UUID is not. Paths stay nested under /projects/{projectId}
        because a project is a real navigation boundary — a whole client product —
        not because a key needs disambiguating.
      * A company is a separate CLIENT organisation and the top-level isolation
        boundary (plan §6s). Multi-company routing (/c/{slug}), the company switcher
        and per-company branding land with backend M6 and are deliberately NOT in
        this contract yet. What IS here is the shape those decisions already changed:
        the display-key format, the six built-in roles, and the permission catalogue.
      * List endpoints return { items, page, size, total } and accept composable
        filters. Filter state is expected to live in the URL (plan §6o/§6q).
      * Timestamps are RFC 3339 with offset.
      * ANY call authenticated by an API token may answer 429 — see
        components.responses.TooManyRequests. It is written before routing, so it is not
        declared per operation; it carries Retry-After in whole seconds and changed nothing.
        A session is never rate limited.
      * Write endpoints that mutate versioned entities accept If-Match with the
        entity's lockVersion for optimistic concurrency (plan §7 resolved: multiple
        testers may work one run concurrently).

servers:
  - url: /api/v1

tags:
  - name: auth
  - name: projects
  - name: repository
  - name: execution
  - name: documentation
  - name: artifacts
  - name: reporting
  - name: integration
  - name: admin
  - name: audit
  - name: work

# =============================================================================
# PATHS
# =============================================================================
paths:

  # ---------------------------------------------------------------- auth ----
  # v1 is local accounts only. External OIDC providers (Cognito, Entra ID, Google,
  # Okta, Keycloak, generic) land in the integrations phase — plan §6r — and will add
  # /auth/providers, /auth/oidc/{provider}/authorize and /auth/oidc/{provider}/callback
  # alongside this endpoint, not replacing it. Local login is retained permanently as
  # the break-glass path for a self-hosted product.
  /auth/login:
    post:
      tags: [auth]
      summary: Authenticate with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                rememberMe: { type: boolean, default: false }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [auth]
      summary: End the current session
      description: |
        A client-side discard. The session token is stateless, so there is nothing
        server-side to invalidate and this endpoint deliberately does not pretend
        otherwise — a caller who believes a leaked token was revoked here would not
        rotate anything. Prompt revocation is the `pv` epoch (plan §6b), which
        invalidates every session for an account at once. A per-token denylist arrives
        with refresh tokens.
      responses:
        '204': { description: Session discarded by the client }

  # Invitation redemption. Open like /auth/login, and for the same reason: someone
  # accepting an invitation has no account to authenticate with yet.
  #
  # EVERY failure is 404 with no body — unknown token, expired, already redeemed,
  # membership since removed, account since deactivated. Told apart, they would let
  # anyone with a token-shaped string learn whether an address exists on this instance,
  # and email is unique instance-wide, so that spans every client. Same rule as an
  # unreachable display key (plan §6t), on the one surface a stranger can reach.
  /auth/providers:
    post:
      tags: [auth]
      summary: Which sign-in providers an email address reaches
      description: |
        External sign-in is discovered by **email domain** (§6r). There is deliberately no
        pre-authentication company picker: one would publish this instance's client roster to
        anyone who loaded the login page (§6s).

        **This operation answers `200` with a list in every case, and never anything else.**
        The list is empty for a domain no company claims, for a domain whose providers are all
        disabled, and for something that is not an address at all — and it is the union across
        every company claiming the domain, carrying no company id and no company name. A `404`,
        an error, or a different shape for any of those would turn this endpoint into an oracle
        for which client organisations exist here, which is exactly what the shared refusal on
        `POST /auth/login` exists to prevent.

        A domain may legitimately be claimed by several companies, so a caller cannot read
        "one provider" as "one company" either.

        `POST` rather than `GET` although it reads nothing: an email address in a query string
        lands in access logs, browser history and `Referer` headers, and this one is typed by
        somebody who has not signed in and may never do so.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 320
      responses:
        '200':
          description: The providers to offer. Often empty; never an error.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SsoProviderDiscovery' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/sso/{providerId}/authorize:
    get:
      tags: [auth]
      summary: Begin external sign-in
      description: |
        Records an in-flight attempt and redirects the browser to the issuer's authorization
        endpoint with `state`, `nonce` and an S256 `code_challenge`.

        **`302` in every case, success and failure alike.** The caller is a browser mid-redirect
        and has no client to read a status code, so an unknown provider, a disabled one and an
        unreachable issuer all land on the SPA's callback route with one opaque marker. The
        provider's `enabled` flag is *returned* by the pre-authentication lookup rather than
        filtered on, precisely so that refusal happens on the same code path as every other.

        The PKCE verifier is held **server-side** for the life of the attempt. The rejected
        alternative was a signed cookie, which puts a confidential client's PKCE secret in the
        browser and moves the replay check to where it is not a check.
      security: []
      parameters:
        - name: providerId
          in: path
          required: true
          description: |
            Opaque, and it leaks nothing: it is a UUID, and the lookup behind it reads a company
            and an issuer and nothing about any person.
          schema: { type: string, format: uuid }
      responses:
        '302':
          description: To the issuer, or to the SPA's failure landing.
          headers:
            Location:
              schema: { type: string }

  /auth/sso/callback:
    get:
      tags: [auth]
      summary: Complete external sign-in
      description: |
        Exchanges the authorization code, verifies the `id_token` (signature, `iss`, `aud`,
        `nonce`, `exp`), resolves the assertion to an account, and redirects to the SPA with a
        **TCMS session** — the same token `POST /auth/login` issues, from the same claim set.
        **The issuer's own token never reaches the SPA** (§6r): the IdP proves who somebody is,
        once, and never becomes a credential for this API.

        The session travels in the URL **fragment**, not the query string. A fragment is never
        sent to a server, so the token does not land in this instance's access log, the reverse
        proxy's, or the `Referer` header of the first outbound link the SPA renders.

        **The attempt is single-use and is claimed before the code is exchanged**, by a
        conditional update — two callbacks carrying one `state` cannot both proceed.

        **There is no `providerId` in this path**, unlike the authorize leg. The `state` already
        fixes which attempt, and therefore which provider and which company, this callback
        belongs to, and that binding is server-side. A second caller-supplied copy of the same
        fact could only be ignored or trusted, and trusting it is how a callback gets pointed at
        somebody else's provider.

        `302` in every case, for the reason the authorize leg gives.
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: false
          schema: { type: string }
      responses:
        '302':
          description: To the SPA, carrying the session in the fragment, or the failure marker.
          headers:
            Location:
              schema: { type: string }

  /auth/ldap/{providerId}/login:
    post:
      tags: [auth]
      summary: Sign in against a directory
      description: |
        Binds to the provider's directory as the person signing in, and — exactly as
        `POST /auth/login` does — answers with a **TCMS** session. The directory credential is used
        for one bind and is never stored, never logged, and never returned.

        This is a `POST` with a body rather than a redirect because `LDAP` is a **credential** flow:
        there is no third party to send a browser to, which is the whole difference between this
        operation and `/auth/sso/{providerId}/authorize`.

        **`401` with no body for every failure** — unknown provider, disabled provider, unreachable
        directory, no such entry, wrong password, an entry matched more than once, no TCMS account,
        JIT off, deactivated account, membership since removed. `POST /auth/login`'s rule, on a
        surface a stranger can reach.

        Repeated failures are refused **without contacting the directory** after a small number of
        attempts for one identifier at one provider. That bound exists to protect the *customer's*
        directory: every failed bind increments its lockout counter, so an unthrottled endpoint here
        is a way to lock out a company's staff from the internet.
      security: []
      parameters:
        - name: providerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 320 }
                password: { type: string, format: password, maxLength: 400 }
                rememberMe: { type: boolean, default: false }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: |
            Refused, with no body and no cause — see this operation's description for the nine
            conditions that reach it and why they are one answer.

  /auth/invitations/{token}:
    get:
      tags: [auth]
      summary: What an invitation admits its holder to
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: |
            The single-use secret from the invitation email. In the path, and in the
            query string of the emailed link — a known exposure (browser history,
            Referer headers, proxy logs) bounded by the token being single-use,
            short-lived and inert once redeemed.
          schema: { type: string }
      responses:
        '200':
          description: The invitation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationPreview' }
        '404': { $ref: '#/components/responses/NotFound' }

  /auth/invitations/{token}/accept:
    post:
      tags: [auth]
      summary: Redeem an invitation and activate the account
      description: |
        Answers 204, not a session. The invitee then signs in with the password they
        just chose, which keeps token issuance to a single path and makes the round
        trip prove the password was stored as intended.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  format: password
                  minLength: 12
                  description: |
                    Required when `passwordRequired` was true; omitted otherwise, and
                    REJECTED rather than ignored when the account already has one —
                    holding an invitation to a second company must not confer the
                    ability to overwrite an existing credential. The 72-byte maximum is
                    BCrypt's: anything longer is only partly verified, so it is refused
                    rather than silently truncated.
      responses:
        '204': { description: Accepted; the account and the membership are now ACTIVE }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: The password was not accepted
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/social/providers:
    get:
      operationId: listSocialProviders
      tags: [auth]
      summary: Which social sign-in providers this instance has configured
      description: |
        Instance-level configuration, identical for every caller — it names no company and no
        account, so answering it publicly discloses nothing (§6r's oracle rule does not bite).
        GitHub, GitLab and Google are authorities for people, not companies; they are configured
        by the operator, never as `identity_provider` rows.
      security: []
      responses:
        '200':
          description: The configured providers, possibly none.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocialProviderList' }

  /auth/social/{provider}/authorize:
    get:
      operationId: socialAuthorize
      tags: [auth]
      summary: Begin a social sign-in (browser navigation, not an XHR)
      description: |
        Records an in-flight attempt and redirects the browser to the provider's authorization
        endpoint. **`302` in every case, success and failure alike** — an unconfigured provider
        and an unreachable issuer both land on the SPA's failure landing with one opaque marker,
        for the reason `GET /auth/sso/{providerId}/authorize` gives.

        Never creates an account: the callback resolves an already-linked identity or refuses.
      security: []
      parameters:
        - $ref: '#/components/parameters/SocialProviderKey'
      responses:
        '302':
          description: To the provider, or to the SPA's failure landing.
          headers:
            Location:
              schema: { type: string }

  /auth/social/callback:
    get:
      operationId: socialCallback
      tags: [auth]
      summary: Complete a social round-trip (browser navigation, not an XHR)
      description: |
        One callback for both intents — signing in and linking — told apart by the attempt row
        the `state` resolves, never by the URL (`GET /auth/sso/callback`'s reasoning, applied to
        intents). The attempt is single-use and claimed before the code is exchanged.

        `302` in every case. Success carries the outcome in the URL **fragment** (a session for
        a sign-in, a `linked` marker for a completed link); every failure carries the same
        opaque error marker. The provider's own token never reaches the SPA.
      security: []
      parameters:
        - name: state
          in: query
          required: false
          schema: { type: string }
        - name: code
          in: query
          required: false
          schema: { type: string }
      responses:
        '302':
          description: To the SPA, carrying the outcome in the fragment.
          headers:
            Location:
              schema: { type: string }

  /me:
    get:
      tags: [auth]
      summary: The authenticated user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/permissions:
    get:
      tags: [auth]
      summary: Effective permissions for the caller in a project
      description: |
        Drives UI affordances only. Every hidden action is independently rejected
        server-side — hidden is not protected (plan §6b).

        Three different questions, and the answers are deliberately not the same set
        (see MeController): with a projectId, the SYSTEM + COMPANY + PROJECT terms; with
        a company open but no project, SYSTEM + COMPANY only — NOT "whatever this caller
        holds on some project", because a Test Lead on one project must not read as
        holding project:settings company-wide; with no company at all, SYSTEM only.

        An unreachable project and a non-existent one both answer with the empty set,
        identically, so this endpoint cannot be used to probe for projects in other
        companies (plan §6t).
      parameters:
        - name: projectId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Permission keys
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffectivePermissions' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/social-identities:
    get:
      operationId: listMySocialIdentities
      tags: [auth]
      summary: The social identities linked to the calling account
      description: |
        Under `/me`, not `/auth`: `/api/v1/auth/**` is public and everything here requires the
        session it manages. No permission key gates any of it — managing your own sign-in
        identities is self-service on your own account, like changing a password.
      responses:
        '200':
          description: All linked identities, possibly none.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocialIdentityList' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/social-identities/{provider}:
    post:
      operationId: startSocialLink
      tags: [auth]
      summary: Begin linking a social identity to the calling account
      description: |
        Answers `{ url }` for the SPA to navigate to rather than a `302`: a top-level browser
        navigation cannot carry the Authorization header, so the authenticated leg must be an
        API call that returns the redirect, and the navigation that follows holds only the
        single-use `state`.
      parameters:
        - $ref: '#/components/parameters/SocialProviderKey'
      responses:
        '200':
          description: Where to send the browser.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocialRedirect' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: unlinkSocialIdentity
      tags: [auth]
      summary: Remove a linked social identity from the calling account
      parameters:
        - $ref: '#/components/parameters/SocialProviderKey'
      responses:
        '204':
          description: Unlinked (or was never linked — the end state is the same).
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: |
            Refused: this identity is the account's only way to sign in (no password and no
            other linked identity). Set a password or link another provider first.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ------------------------------------------------------------ projects ----
  /projects:
    get:
      tags: [projects]
      summary: Projects visible to the caller
      responses:
        '200':
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [projects]
      summary: Create a project
      description: |
        Requires `project:create`, which is a **COMPANY-scope** permission — the only write in
        this contract whose gate is not a grant on the target, because the target does not exist
        yet. Held by Company Admin and Instance Admin only (roles spec §A3); a Test Lead running
        a project is not entitled to start another one.

        `key` is **supplied by the client**, not allocated. Display keys (`TC-n`, `TS-n`) are
        server-allocated from the company's counter because they number rows; a project key is a
        2–10 character label a human chooses, types and reads back in URLs — "OLB" for Online
        Banking — so allocating "P-3" would replace the one identifier in the system that is
        meant to be memorable. It is immutable once set (see `Project.key`) and unique per
        company, so two clients may both key a project `OLB`.

        **A key already used in this company is a `400` keyed on `key`, not a `409`.** The form
        has a field to put the message on, and the caller's next action is to type a different
        key rather than to reload. That also makes the endpoint safe to retry without an
        `Idempotency-Key`: the retry of a create that in fact succeeded cannot make a second
        project, because the key is taken by the first — which is why this endpoint deliberately
        does not accept the header that `POST …/cases` does.

        The created project is seeded exactly as `provision-company` seeds a first project — the
        Feature dimension, the six execution statuses and the Default configuration — so a
        project created here and one created by the operator CLI are the same thing.

        **No project grant is created for the caller.** Every route to `project:create` already
        carries `project:read` over every project in the company (a Company Admin's COMPANY-scope
        grant, an Instance Admin's SYSTEM one), so the new project is immediately in the caller's
        `GET /projects`. Minting a PROJECT-scope grant for them would instead make `myRole` claim
        a per-project role they do not hold.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: The created project's own URL.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /projects/{projectId}:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [projects]
      summary: Project detail
      responses:
        '200':
          description: Project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/archive:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    put:
      tags: [projects]
      operationId: setProjectArchived
      summary: Retire a project, or bring it back
      description: |
        Requires `project:settings` — a **PROJECT-scope** permission, held by Test Lead and up on
        the project itself (roles spec §A3). It is deliberately not the COMPANY-scope
        `project:create` that the create beside it needs: archiving is reversible, destroys
        nothing, and is the lead of a finished engagement tidying up their own project. Company
        Admin and Instance Admin hold `project:settings` on every project anyway, so nothing they
        could do before is withheld. It also matters that both token-only roles are denied it
        (roles spec §A6a): **no CI credential and no agent can retire a project.**

        **Archiving marks a project; it does not lock it.** An archived project is still listed by
        `GET /projects`, still readable, and every write in this contract still succeeds against
        it. That is `doc_page`'s `ARCHIVED` one level up — a state that takes something out of
        circulation while keeping it and everything pointing at it resolvable — and not a soft
        delete. A rule that *refuses* writes to an archived project is a separate decision with a
        much larger blast radius (every project-scoped write shares one gate), and it must be taken
        as a product rule rather than inherited as a side effect of this endpoint.

        One endpoint for both directions, and idempotent: archiving an archived project answers
        `200` with the project and writes nothing — no timestamp re-stamped and no audit row, so a
        repeated click cannot bury the change that actually happened. `SuiteStatusInput`'s
        argument, and for the same reason there is no `If-Match`: the request names an absolute
        target state rather than a delta against something the client read.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectArchiveInput' }
      responses:
        '200':
          description: The project, as the picker renders it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/classification:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [projects]
      summary: Classification dimensions and their values
      description: Test Type, Test Level, Feature tree, Execution Phase (plan §6d).
      responses:
        '200':
          description: Dimensions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ClassificationDimension' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/classification/values:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    post:
      tags: [projects]
      summary: Add a value to one of this project's classification dimensions
      description: |
        The vocabulary's first writer. `tcms_seed_project_defaults` seeds the Feature dimension
        **empty on purpose** — inventing a client's feature taxonomy for them is how a controlled
        vocabulary gets worked around — so until this endpoint existed a freshly provisioned
        project had a Feature tree that was empty and stayed empty, and the case editor's picker
        had nothing to pick.

        **The permission depends on the dimension, and so does the scope it is held at.** A
        project-level dimension (`locked: false` — Feature) needs `project:settings` on this
        project; a company-level one (`locked: true` — Test Type, Test Level, Execution Phase)
        needs `company:vocabulary`, which is a COMPANY-scope permission held by Company Admin and
        above. A Test Lead may therefore extend their own project's Feature tree and not the
        company's shared axes, which is exactly what the two permissions were separated for.

        A `dimensionId` this project does not have — including another project's Feature
        dimension — is a **404**, not a field error: the caller may not be told which permission
        would have applied to a dimension they cannot address.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClassificationValueInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassificationValue' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/classification/values/{valueId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: valueId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [projects]
      summary: Rename or recolour a classification value
      description: |
        **PUT rather than PATCH, and the reason is `parentId`.** A partial update cannot express
        "make this a root": a record deserialized from JSON reads an absent `parentId` and an
        explicit `null` identically, so a PATCH would have to choose one meaning for both and the
        other would be unreachable. It does not arise here because **this endpoint refuses to
        reparent at all** (below) — but a body that carries every editable field is what keeps it
        from arising later, and it is the same reason `TestCaseInput.classificationValueIds` is a
        complete set rather than a delta.

        **Moving a value is refused, not ignored.** `parentId` must equal the stored one, or the
        request is a field error. Reparenting rewrites the subtree the descendants' `path` column
        records, and — unlike a suite — the values below this one are what authored cases are
        classified by. `SuiteWriteService` refuses a move for the first of those reasons already;
        this endpoint has both. Silently dropping the field is the third answer, the one where the
        client shows the value in its new place, reloads, and finds it back.

        Gated exactly as the create above: `project:settings` on this project for a project-level
        dimension, `company:vocabulary` at company scope for a company-level one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClassificationValueInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassificationValue' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [projects]
      summary: Retire a classification value
      description: |
        A **soft delete**. The value may already be attached to authored cases and to executions
        that ran under it, so the row survives and every read excludes it — which is what lets a
        past run still resolve what it was classified as. The consequence is stated rather than
        discovered: a retired assignment is **immutable through the API**, because a client is
        never served the value and therefore cannot resubmit it (see
        `TestCaseInput.classificationValueIds`).

        **A value with live children is refused, 409**, naming the count. The cascade is
        deliberately not built: retiring a subtree unclassifies every case beneath it at once,
        with no preview of what it is about to touch — `SuiteWriteService`'s refusal of a
        non-empty folder, one vocabulary over. A value that is **in use by cases** is *not*
        refused; being in use is what the soft delete exists for.
      responses:
        '204':
          description: Retired
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The value still has live children. `Problem.errors` carries `children` — one sentence
            naming the count and what to do first, printable as it arrives, rather than "it is in
            use". ~~It carries the bare count and the SPA composes the sentence.~~ → **corrected
            §149**: that made this the one site on the API whose `errors` value was a datum, and the
            two clients that print `errors` verbatim were showing a model `children: 3`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /projects/{projectId}/settings:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [projects]
      operationId: getProjectSettings
      summary: The project's own policy — plan §6g's review settings
      description: |
        **Readable by anyone who can see the project**, deliberately, and not gated on
        `project:settings` like the `PUT` beside it. §6g's first requirement is that "a project
        that never turns review on should see no extra UI at all", which is a decision every
        client has to make on every artifact screen for every reader — a Test Engineer, a
        Viewer — and none of them is an admin. Gating the read on the write key would leave the
        SPA unable to find out whether to render the review panel at all.

        Nothing here is sensitive in the way the key suggests: these are facts about how the
        project behaves, deducible by anybody who presses a button.

        A project nobody has configured answers the **defaults** — review off for all three
        artifact types, `RETAIN`, no required peer reviews, and the
        author-cannot-approve-own-work rule on. `updatedBy` and `updatedAt` are `null` for such
        a project, which is most of them; a client renders "never changed" rather than
        attributing the defaults to whoever created the project.
      responses:
        '200':
          description: The project's settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [projects]
      operationId: updateProjectSettings
      summary: Replace the project's settings
      description: |
        Needs `project:settings` on this project — the key §69's classification vocabulary
        editor already uses.

        A `PUT` rather than a `PATCH`: the form shows every control and submits every control,
        nothing here is a list and nothing here is clearable, so "leave this one alone" has no
        meaning a user of this screen could ask for.

        **`requiredPeerReviews` is copied onto each review as it is submitted**, and the
        approval check reads it from there. Raising the bar therefore governs reviews opened
        afterwards and does not freeze reviews already in flight, whose reviewers were asked
        under the old rule and some of whom have already spoken.

        Switching review **off** does not close reviews that are already open: those rows
        record something that happened, and a project changing its policy has not caused
        everyone to withdraw. It stops new ones being opened.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectSettingsUpdate' }
      responses:
        '200':
          description: The settings as they now stand
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/statuses:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [projects]
      summary: Configurable execution statuses
      responses:
        '200':
          description: Statuses
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CaseStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/members:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [projects]
      summary: People who can be given work in this project
      description: |
        The people a project-scoped assignment may name: **active members of this company
        who hold a grant on this project**. Both halves are load-bearing and each alone
        admits a defect —

        - membership without a grant is a colleague who can sign in and cannot open the
          project, so a task assigned to them is visible on their board and 404s when they
          click it;
        - a grant without active membership is an unaccepted invitation, which conveys
          nothing until it is redeemed.

        **This is the same predicate the write side enforces**, not an approximation of it.
        `POST /work-items` validates `assigneeId` against exactly this set, so a picker
        built from this list can never offer somebody the server will refuse — which is the
        §31 rule (disable-don't-hide) applied to a *set* rather than to a button.

        Grants reach a person directly, through a team, or company-wide, so this cannot be
        answered by reading `role_assignment` for the project: it is resolved through the
        permission evaluator, the one place effective permissions are computed (plan §6b).

        Ordered by display name. The name is the **membership's**, not the account's
        canonical one (§6u) — the same person is "A. Kotrulev" to one client and "Aleksandar
        (Contractor)" to another.
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserRef' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          # The project read gate, and 404 rather than 403 for §6t's reason: an unreachable
          # project and a non-existent one must be indistinguishable. Not the admin surface's
          # "200 with []" — that shape exists because /users and /teams declare only 200, and
          # every project-scoped path in this contract answers 404 instead.
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/audit-events:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [audit]
      summary: This project's audit trail, newest first
      description: |
        **Costs `project:audit`** — Lead-only, per roles spec §A3, where the trail sits beside
        `project:members` and `project:settings` as *administering* the project rather than
        working in it. Every act in the product has written a row here since M0; this is the
        first thing that reads one.

        **A company-scope act carries no `projectId` and is NOT returned here.** Widening the
        filter to "this project or none" would fold a member invitation and a vocabulary change
        into every project's log. Ask `GET /audit-events` for those.

        **Both actor columns may be set on one row, and that is the normal token-driven shape** —
        not an either/or. The caller identity on a token-authenticated request is the token's
        *owner*, so an act from a CI runner names the person answerable for the credential
        (`actorUserId`) **and** the credential (`actorTokenId`). `actorUserId` is null only for an
        unattended job that no person requested. A client that renders one and hides the other
        loses half of who did it.

        **Refuses with 403, not an empty page.** An empty page reads as "nothing happened", which
        about an audit trail is a lie a reader cannot detect. Project *visibility* still answers
        404 (§6t) — the permission is a second question asked of a caller already looking at the
        project, which is `readGranted`'s shape.

        Newest first, and the sort key is `(occurredAt DESC, id DESC)`. The secondary key is not
        decoration: acts written in one transaction share a timestamp to the microsecond, and an
        unstable sort makes page 2 repeat or skip rows.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - name: actorUserId
          in: query
          description: Acts by one person. Matches `actorUserId`, so it also finds their token's acts.
          schema: { type: string, format: uuid }
        - name: action
          in: query
          description: |
            One exact dotted verb, e.g. `case.updated`. Matched exactly and never as a prefix:
            `case.` is not a family in this table, it is a naming convention, and a prefix match
            would quietly promote it to one.
          schema: { type: string }
        - name: occurredAfter
          in: query
          description: Inclusive lower bound on `occurredAt`.
          schema: { type: string, format: date-time }
        - name: occurredBefore
          in: query
          description: Inclusive upper bound on `occurredAt`.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: The page of audit events.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    # `required` does not descend through allOf — the PageMeta branch declares its
                    # own and this one needs the same.
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AuditEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # -------------------------------------------------------------- review ----
  # One record for all three reviewable artifacts (plan §6g). The subject is a (type, id)
  # pair in the query rather than a nested path, because a review is not owned by the case-,
  # suite- or plan-shaped part of the URL space — three nested paths would be three routes
  # into one service with nothing different to say.
  /projects/{projectId}/reviews:
    # Only the path variable is shared. The subject filter belongs to the GET: a path item's
    # parameters apply to EVERY operation under it, which is how the case list's filters
    # landed on the POST beside it (§50).
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [projects]
      operationId: listReviews
      summary: The reviews of one case, suite or plan — newest first
      description: |
        Plan §6g's review record: who submitted this version for review, who said what while
        it was open, and who eventually signed it off. A review is **history, not a mirror of
        the artifact's status** — rescinding an approval does not rewrite the review that
        granted it, and re-submitting opens a new record rather than reopening the old one.

        Usually one row, occasionally several, and an **empty array is the ordinary answer**
        for an artifact nobody has ever submitted.

        `subjectVersionNo` is pinned when the artifact is submitted and never re-stamped, so a
        client holding the artifact's current version can tell the reviewer is looking at
        older content — §6g's diff-since-approval, from the side the server can answer.

        Gated by project visibility alone. There is no `review:read` permission in the
        catalogue and inventing one would be a 403 nobody can grant themselves out of: a
        caller who may see the artifact may see who reviewed it, which is the point of keeping
        the record at all.
      parameters:
        - name: subjectType
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ReviewSubjectType' }
        - name: subjectId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Reviews, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Review' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/reviews/{reviewId}/participations:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: reviewId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [projects]
      operationId: recordReviewParticipation
      summary: Record a peer verdict — LGTM or changes requested
      description: |
        §6g's **advisory** tier. Peer review happens *inside* `IN_REVIEW` and accumulates on
        the item **without moving it**: the state machine has exactly one gate, held by
        `*:approve`, and this endpoint is not it. Approving or rejecting an artifact is a move
        on its own ladder (`PUT /suites/{suiteId}/status`, `PUT /plans/{planId}/status`,
        `POST /cases/bulk`), so `APPROVED` and `REJECTED` are refused here as field errors —
        accepting them would be a second, cheaper door to the same sign-off, held by everyone
        with the advisory key.

        **Which permission this costs is decided by the review's subject type**, not by
        anything the request sends: `case:review`, `suite:review` or `plan:review`, at project
        scope. All three are seeded by `V3`, granted since M0, and had no consumer in Java
        until this endpoint.

        Repeat verdicts are allowed and are not an error. Participations are **append-only**:
        somebody who requests changes and later relents leaves both rows, in order, which is
        the fact a review trail is kept for. Readers take the newest row per person as the
        standing verdict.

        `409` once the review has ended — nothing about the request is malformed, and the way
        forward is to submit the artifact for review again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewParticipationInput' }
      responses:
        '201':
          description: |
            The whole review, re-rendered. A verdict is only ever read in the context of the
            trail it joins, so returning the row alone would let the panel show a state the
            server does not have. No `Location`: a participation has no URL of its own, and
            inventing one would promise a `GET` nothing serves.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{projectId}/reviews/{reviewId}/assignees:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: reviewId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [projects]
      operationId: assignReviewer
      summary: Ask a person or a team to review
      description: |
        §6g's *"Reviewers — assign a user **or** a team; any member of the team can action
        it"*, and the last unbuilt half of its apparatus. Until this endpoint the record
        held who **spoke** (`participations`) and never who was **asked**, so the workflow
        had no inbox and §6l's board could not draw a card for a request nothing stored.

        **This costs `*:review`, the subject's own key.** No new key was invented — one
        seeded to nobody is a 403 no administrator can grant their way out of, the standing
        argument against `evidence:read` and `suite:comment` — so the question is which
        existing key this is. Asking somebody to look at an artifact is a statement
        about the review's progress — §79's argument for resolving a thread. Both cheaper
        readings were refused: `case:comment` would let a Viewer, often the client
        themselves, put work on a contributor's queue, which is the one thing the bottom
        tier is defined not to do; `*:approve` would confine the request to the people whose
        sign-off it exists to *prepare*.

        **Re-asking somebody already asked writes nothing and answers 201.** Re-stamping
        would hand `assignedBy` to whoever clicked last, so the field kept to record who
        asked would name the second person to agree — §79's resolution defect, in the one
        place it would recur.

        **An assignment is a worklist entry, not part of the audit record.** That record is
        the review and its participations. Hence the hard delete below, and hence a deleted
        team taking its outstanding requests with it rather than being refused the way a
        team holding role grants is (§71): what cascades is a request, not authority, and
        the review stays visible, reviewable and approvable by exactly the same people.

        `409` once the review has ended, on the same terms as every other write here.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewAssignmentInput' }
      responses:
        '201':
          description: |
            The whole review, re-rendered — the participations endpoint's decision and for its
            reason. No `Location`: the URL it would name serves no `GET`, and one pointing at a
            route that answers 405 is worse than none.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{projectId}/reviews/{reviewId}/assignees/{assignmentId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: reviewId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: assignmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [projects]
      operationId: unassignReviewer
      summary: Withdraw a request to review
      description: |
        A **hard delete**, and that is the decision: an assignment is a worklist entry, so
        asking the wrong person and correcting it should leave nothing behind — a trail of
        retracted requests reads as a history of suspicion. A comment is the same question
        answered the other way for the opposite reason: a remark is something somebody
        *said*, a request is something somebody was *asked*.

        Costs the same `*:review` the assignment did. There is deliberately **no author
        arm** — `evidence:delete`'s "the owner, or the tier" shape — because the only caller
        it would add is somebody withdrawing a request they made while lacking `*:review`,
        and nobody can be in that state: making the request cost the key.

        `404` when `assignmentId` names nothing in this review, bodiless and identical to
        the review's own 404 so the pair cannot be used to probe which ids exist.
      responses:
        '200':
          description: |
            The whole review, re-rendered. Not `204`: the panel renders a review as one thing
            and every other write on it re-serves that whole thing, so a bodiless answer would
            make this the one action after which the client's copy is stale — and it would
            refetch immediately, a second round trip for what this response already knows.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{projectId}/reviews/{reviewId}/comments:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: reviewId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [projects]
      operationId: addReviewComment
      summary: Write a remark on an open review
      description: |
        §6g's threads — *"Review without inline comments degrades into Slack conversations
        that vanish."*

        **This costs `case:comment`, whatever the subject is.** The catalogue has one comment
        key where it has three review keys and three approve keys, and that is deliberate: the
        roles spec's Review table lists commenting as the bottom **tier** — *"read an item in
        full and leave threaded comments"* — held by Viewer and up, built for the case where
        the client reviews test coverage themselves without gaining any write access. Adding
        `suite:comment` and `plan:comment` would seed two keys nobody holds, which on every
        existing instance is a 403 no administrator can grant their way out of. `case:comment`
        is seeded by `V3`, granted since M0, and had **no consumer in Java** until this
        endpoint.

        **Threads are one level deep.** `parentId` names the root being replied to, validated
        against *this review's* comments — a comment from another project's review is a field
        error rather than a stored reference, and so is a reply to a reply. A tree has no
        bottom to render and no natural place to resolve.

        There is deliberately **no `anchorType` / `anchorId`**, though `V1` has the columns and
        §6g asks for anchoring *"where possible"*: the only candidate anchor is a case's step,
        whose ids live in a module the review record may not import, so accepting one today
        would store a reference nothing validates — the defect §64 found four milestones after
        it shipped.

        `409` once the review has ended, on the same terms as the verdict endpoint: a review
        is history once it closes, and the way forward is to submit the artifact again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewCommentInput' }
      responses:
        '201':
          description: |
            The whole review, re-rendered — the participations endpoint's decision and for its
            reason: a comment is only ever read inside the conversation it joins. No
            `Location`; a comment has no URL of its own.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{projectId}/reviews/{reviewId}/comments/{commentId}/resolution:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: reviewId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: commentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [projects]
      operationId: setReviewCommentResolution
      summary: Mark a thread dealt with, or re-open it
      description: |
        §6g's *"resolvable"*.

        **This costs `*:review`, not `case:comment`** — the asymmetry with the endpoint above
        is the decision. Writing a remark is the bottom tier's act; declaring one dealt with is
        a statement about the review's progress, which belongs to the tier running the review.
        "The reviewing tier *or* the comment's own author" was considered and refused: the only
        caller it adds is a Viewer resolving their own feedback, which takes it off the
        reviewer's list without anybody having addressed it.

        **Only a thread root.** Resolution is a property of the thread, so resolving a reply is
        a field error rather than a silent no-op.

        `PUT` with a required boolean, not `PATCH` and not two verbs: for a boolean, absent and
        `false` are the same bytes, so a `PATCH` could never express "re-open this". No
        `If-Match` — the target state is absolute, so there is no stale-read-derived value to
        lose. Setting a thread to the state it is already in writes nothing and answers 200.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewCommentResolutionInput' }
      responses:
        '200':
          description: The whole review, re-rendered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------------------------------------------------- repository ----
  /projects/{projectId}/suites:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [repository]
      summary: Suites
      responses:
        '200':
          description: |
            The project's live suites. **A flat list, and flat all the way down** — a suite is a
            named collection, not a folder in a tree, so there is nothing for a client to assemble
            and no order but the server's.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Suite' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [repository]
      summary: Create a suite
      description: |
        `key` is server-allocated from the company's counter (`TS-n`, sequential per **company**,
        §6t). Requires `suite:manage`.

        ~~`path` is derived from the key — **not** from the name, so a rename never rewrites a
        path.~~ → **superseded (§98): suites are flat and `path` is gone.** It existed to place a
        folder in a tree; with no tree, a per-suite path is a second spelling of the key.

        `lifecycleStatus` is always `DRAFT`, for the reason a created case is: a status an ordinary
        create could set is an approval its author granted themselves (§6g).

        ~~No `Idempotency-Key`: a duplicate folder is visible in the tree the moment the create
        returns, next to its twin.~~ → **superseded (§136, `V42`): the header is accepted here.**
        The old reason argued entirely from a person looking at a screen, and §98 removed the tree
        it named while §135's tool surface added a caller that has no screen and no way to notice a
        twin. A replay answers **200** with the suite the original intent created.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuiteInput' }
      responses:
        '201':
          description: Created — key is server-allocated (TS-n, per company)
          headers:
            Location:
              description: The created suite's own URL.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Suite' }
        '200':
          description: |
            A replay — this `Idempotency-Key` already created a suite, which is returned unchanged.
            No `Location`: this request created nothing, and a client following one would read it
            as having made something.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Suite' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/suites/{suiteId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: suiteId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [repository]
      summary: Suite detail
      responses:
        '200':
          description: Suite
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Suite' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [repository]
      summary: Rename a suite
      description: |
        Renames a suite and edits its description. Requires `suite:manage`.

        ~~**Moving is not supported here yet.** `parentId` is accepted only when it matches the
        suite's current parent; a different value is a `400` rather than a silently ignored field,
        because reparenting rewrites every descendant's `path` and needs cycle prevention.~~
        → **superseded (§98): there is nowhere to move a suite to.** A flat suite has no parent, so
        the refusal, the cycle check and the `path` rewrite it was protecting all stop existing.
        What a client wants when it reaches for a move — *this case belongs over there* — is the
        case's own `suiteId`, or a `caseIds` / `tagRules` entry on the target suite.

        Send the suite's `lockVersion` as `If-Match`. Omitting it is last-write-wins, which is right
        for an importer with no prior read; the SPA always sends it, so a concurrent rename is a
        `409` rather than a silent overwrite (§6j).

        **Detaching a condition here discards every case's opt-out against it**, and that is the
        cascade rather than a rule this endpoint applies: `case_condition_optout` keys on
        `suite_condition.id` with `ON DELETE CASCADE`, so the row that recorded "this case declines
        that inherited condition" goes when the thing it declined does. Re-attaching the same entry
        afterwards is a **new** attachment, which every case then inherits afresh. It is also why
        the server rewrites the attachment rows *in place* — a save that reordered the list by
        deleting and reinserting would silently clear opt-outs nobody touched.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuiteInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Suite' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [repository]
      summary: Delete an empty suite
      description: |
        Soft-deletes a suite. Requires `suite:delete`, which **every non-Viewer contributor holds
        since `V52`** (roles spec §A4). Two superseded readings, kept because each was the stated
        reason at the time: ~~deleting is the one repository action a contributor is blocked from,
        so they can organise the tree freely without being able to unmake someone else's work~~ →
        `V51` made a contributor delete cases freely, whoever authored them, after which the line
        was said to be not "deleting" but ~~**shared structure**: a suite is the collection many
        people file into, and removing it changes something other people's work hangs off~~ →
        `V52` deleted that principle rather than narrowing it a third time (§210). The Test Lead
        line is now approvals and project configuration, and nothing else.

        **The suite must be empty**: a suite holding live *filed* cases answers `409` naming how
        many. A cascade would soft-delete an unbounded set of *cases* through a collection action
        with no preview of what it is about to touch — which is the objection, and it is not about
        whose cases they are. (Until `V51` this read "routing around the `OWN` qualifier that
        `case:delete` carries"; that qualifier is gone, and a per-case delete the caller names one
        row at a time was never the problem.) Cascading deletion waits for a slice that can show
        its work.

        **Only the filing arm blocks, and the other two deliberately do not** (§98). A case *added*
        to this suite, or *matched* by one of its `tagRules`, is not held here — it lives elsewhere
        and merely appears in this collection, so deleting the collection loses a claim on it and
        never the case. Filing is different in kind: `test_case.suite_id` is where the case is, and
        deleting its suite would leave it reachable only through the unfiled list.

        ~~Child suites also stand in the way.~~ → **gone with the tree (§98)**; a suite has no
        children to hold.

        Soft, not hard: past runs reference the cases filed under a suite and `suite_run_summary`
        keys on the suite id, so removing the row rewrites what a past run covered.
      responses:
        '204':
          description: Deleted. No body.
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The suite is not empty. `detail` names the live filed-case count standing in the way,
            so the client can say what to clear rather than "could not delete".
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /projects/{projectId}/suites/{suiteId}/status:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: suiteId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [repository]
      operationId: setSuiteStatus
      summary: Submit, approve, withdraw, deprecate or revive a suite
      description: |
        A suite's ladder is plan §6g's, over the same four `LifecycleStatus` values a case uses —
        and it is the **same ladder**, evaluated by one class server-side, because §6g draws one
        diagram and then lists what review *means* per artifact rather than a different set of
        moves.

        **Which permission a move needs is decided by the edge, not by the target:**

        - `suite:manage` (Test Engineer and up) moves a suite **nobody has signed off** — submitting
          a draft for review, withdrawing that submission, deprecating a suite that was never
          approved, and reviving a deprecated one back to `DRAFT`. §6g: submitting for review "needs
          only edit rights".
        - `suite:approve` (Lead and up) is needed to **grant** the sign-off and to move a suite that
          **currently has one**, wherever it is going — back to `DRAFT`, back to `IN_REVIEW`, or out
          to `DEPRECATED`. Every one of those ends a lead's approval, and the target it happens to
          name says nothing about that: a target-only rule would let a Test Engineer rescind an
          approval by asking for `DRAFT`.

        Deprecating used to cost `suite:approve` from *every* state, on the argument that retiring is
        the soft form of a delete and `suite:delete` was Lead-only. That argument does not survive
        being stated precisely — and since `V52` (2026-08-15) it has no premise either, because
        `suite:delete` is granted to Test Engineer: `suite:delete` **removes** the folder, while
        deprecating keeps it,
        keeps its members, and can be undone — and it is the only way out of a folder that cannot be
        deleted while it holds cases. Retiring a draft folder is the same kind of act as renaming
        one, which is already `suite:manage`.

        Two moves are refused with `409` because the ladder does not have them: `IN_REVIEW` is
        reachable only from `DRAFT` (an approved suite that needs another look must lose its
        approval first, or the trail shows it under review while also signed off), and `APPROVED`
        only from `IN_REVIEW` (§6g: "the state machine has exactly one gate"). A **deprecated** suite
        returns as a `DRAFT` and cannot go straight back to review or approval — the same argument
        §6g makes for a clone of an approved case.

        Idempotent: setting the status a suite already has answers `200` with the suite and writes
        nothing — no timestamp re-stamped and no audit row, so a repeated click cannot bury the
        change that actually happened.

        No `If-Match`: the request names an absolute target state rather than a delta against
        something the client read, so there is no lost update to protect (`PUT /plans/{planId}/status`
        and `PUT /runs/{runId}/status` make the same call). The `PATCH` beside it *does* take one,
        because a name typed over a stale copy really does lose the other author's words.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuiteStatusInput' }
      responses:
        '200':
          description: The suite, as the tree renders it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Suite' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{projectId}/suites/{suiteId}/history:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: suiteId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [repository, reporting]
      summary: Suite execution history — pass % per execution
      # No `versionNo` filter. It was declared here from the first draft, nothing ever sent it, and
      # §50's binding check refuses a parameter no handler binds — an unimplemented filter answers
      # 200 to the wrong question, which is strictly worse than an absent one. Re-adding it is
      # contract-first, alongside the version selector that would send it.
      description: |
        Each entry is one execution of the suite, grouped by (run, suite, configuration),
        summarized as counts. Percentages are derived client-side so the
        "of executed" vs "of total" toggle works without a round trip (plan §6p).

        **Scope is the suite's resolved membership** — filed ∪ added ∪ tagged, the same union
        `Suite.caseCount` reports, so the history covers exactly the cases the suite claims.

        ~~Scope is the suite and its descendants; §6p's rollup rule is to sum leaf counts, so a
        parent's entry covers every case beneath it, and the alternative makes every intermediate
        folder report an empty history.~~ → **superseded (§98)**: there are no intermediate folders
        left to report an empty history, so the argument that forced the rollup has no subject.
        §6p's rollup rule still holds wherever a tree remains (features, classification values).

        **The rows already stored under the old shape are not rewritten**, and neither is what they
        say: `execution_fact.suite_id` / `suite_path` record where a case was filed *when it ran*
        (§86 froze them on conflict for exactly this), so a history from before the flattening may
        name a path that no longer describes anything. That is correct and must not be "fixed".
      responses:
        '200':
          description: History
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuiteHistoryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/cases:
    # Only the path variable is shared. The filter block below belongs to the GET and lived
    # here until the binding check found what that meant: a path item's parameters apply to
    # EVERY operation under it, so the POST beside it declared `?page=2&ownerId=…` on a create
    # — generated into the client's types, and ignored by the server if anyone sent it.
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      tags: [repository]
      summary: Search and filter test cases
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - name: q
          in: query
          description: |
            Free text over title and description. A value matching the case-key
            pattern (TC-n) short-circuits to an exact lookup (plan §6q).
          schema: { type: string }
        - name: id
          in: query
          description: |
            **The by-ids read (B8).** Repeat the parameter to name several
            (`?id=…&id=…`); the answer is those cases, as ordinary summaries, in this endpoint's
            ordinary order and paging.

            It exists because resolving a *known set* of cases had no operation at all. A plan's
            Test cases tab holds ids and had to join them client-side against the first 200 cases
            of the project — so a plan naming a case outside that window rendered an unresolved
            chip, and the only way to widen it was to fetch more of a list nobody wanted.

            **A filter, not a mode.** It is intersected with everything else on this operation, so
            `?id=…&lifecycleStatus=APPROVED` answers *which of these are approved*. An id from
            another project matches nothing rather than 400ing or leaking: the query is bounded by
            the project either way.

            **At most 200 ids** — the page maximum, since more than a page of ids cannot be
            answered in one response anyway. Excess ids are dropped rather than refused, exactly as
            `size` is clamped rather than rejected; a client with more than 200 pages its chips.
          schema:
            type: array
            items: { type: string, format: uuid }
        - name: suiteId
          in: query
          description: |
            Narrows to the suite's **resolved membership** — filed here, added here individually,
            or carrying one of its `tagRules`. The same union `Suite.caseCount` counts, so the
            number in the rail and the length of this list are two readings of one query.

            ~~Includes descendant suites by default.~~ → **§98**, with the tree.
          schema: { type: string, format: uuid }
        - name: tag
          in: query
          description: |
            Cases carrying **every** tag listed — repeat the parameter to narrow. AND, not OR, and
            deliberately the opposite of `suite_tag_rule`, which unions: a suite claims everything
            tagged `smoke` *or* `payments`, while a person filtering a grid by two tags is looking
            for the intersection and an OR would widen the list they are trying to shorten.

            Tags are free text and matched exactly. An unknown tag is `200 []`, never a 400 —
            there is no vocabulary to check it against, and a typo that refuses the request would
            be indistinguishable from a tag nobody has used yet.
          schema:
            type: array
            items: { type: string }
        - name: unfiled
          in: query
          description: |
            `true` returns **only cases filed in no suite** (`suite_id IS NULL`, possible since the
            suite became a resolvable collection). The grid needs it because an unfiled case is
            filed under no suite, so without this filter the only way to find one is to page
            through every case in the project.

            Ignored when `suiteId` is present — a case cannot be both filed somewhere and filed
            nowhere, and refusing the pair with a 400 would break the suite list's own "clear the
            filter" affordance for no gain.
          schema: { type: boolean }
        - name: featureId
          in: query
          description: Includes descendant features by default (plan §6q).
          schema: { type: string, format: uuid }
        - name: testTypeId
          in: query
          schema: { type: string, format: uuid }
        - name: testLevelId
          in: query
          schema: { type: string, format: uuid }
        - name: ownerId
          in: query
          description: |
            Cases owned by one person. Added for the dashboard's by-owner breakdown, whose
            segments are links carrying this predicate (plan §6o) — without it those links
            dropped the owner and silently opened *everyone's* cases in that status.
          schema: { type: string, format: uuid }
        - name: lifecycleStatus
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/LifecycleStatus' }
        - name: automationStatus
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/AutomationStatus' }
        - name: priority
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/Priority' }
        - name: healthSignal
          in: query
          description: Dashboard tile drill-down (plan §6o).
          schema:
            type: array
            items: { $ref: '#/components/schemas/HealthSignal' }
        - name: releaseVersion
          in: query
          description: Cases executed in this release (filters via executions).
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, example: 'keySeq,asc' }
      responses:
        '200':
          description: Matching cases plus facet counts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    # `required` does not descend through allOf — the PageMeta branch declares its
                    # own and this one needs the same. `facets` is always sent, empty when the page
                    # is: the grid distinguishes "no facets" from "facets not loaded".
                    required: [items, facets]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/TestCaseSummary' }
                      facets:
                        type: array
                        items: { $ref: '#/components/schemas/Facet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [repository]
      summary: Create a test case
      description: |
        `key` is server-allocated from the company's counter (`TC-n`, sequential per **company** and
        therefore shared across its projects — §6t). `lifecycleStatus` is always `DRAFT`: a status an
        ordinary create could set is an approval its author granted themselves, which belongs to the
        review workflow (§6g). The creator becomes the owner — `ownerId` on the input is refused, since
        naming someone else needs a membership check.

        Version **1** is written in the same transaction as the case, so a case created here has a
        gapless history. Cases that predate this endpoint have no v1 and their first edit is v2; see
        `EntityVersion`.

        **A case may be created before its procedure is written.** `steps` for a `STRUCTURED` case
        and `gherkinSource` for a `GHERKIN` one are required by `PATCH` and **not** by this
        operation, which is the one rule where creating is more permissive than editing. It exists
        because a plan's Test cases tab authors a case from a title alone, where the alternatives
        were refusing the save or inventing a step nobody wrote. What you get back is a `DRAFT`
        stub; `caseHealth.signals` reports `INCOMPLETE` only once such a case is **approved**, since
        a draft that is not finished yet is not a fault. ~~Note the asymmetry when round-tripping: a
        stub read back and `PATCH`ed unchanged is refused until its procedure is filled in.~~ →
        **closed by B2**: the `PATCH` requires a procedure of a case that has one, so a stub
        round-trips as a no-op and only *emptying* a written procedure is refused.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestCaseInput' }
      responses:
        '201':
          description: Created — key is server-allocated (TC-n, per company)
          headers:
            Location:
              description: The created case's own URL.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestCase' }
        '200':
          description: |
            **A replay.** The `Idempotency-Key` had already created this case, so nothing was created
            by this request — which is why it is not a 201 and carries no `Location`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestCase' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/cases/bulk:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    post:
      tags: [repository]
      summary: Bulk operation over a case selection
      description: |
        Preview-then-commit. Always returns what changed, what was already
        compliant, and what was skipped with a reason — mass edits without a
        preview are how people destroy a suite at 5pm (plan §6f).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkOperation' }
      responses:
        '200':
          description: Result (or preview when dryRun is true)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/cases/{caseId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/CaseId' }
    get:
      tags: [repository]
      summary: Full test case
      responses:
        '200':
          description: Case
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestCase' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [repository]
      summary: Update a test case
      description: |
        ~~**`PATCH` by verb only: the body is the whole editable set, not a delta.** Jackson gives
        absent and null the same Java value, so this endpoint cannot tell "leave `objective` alone"
        from "clear it" and resolves both as *clear it* — sending `{"title": "x"}` renames the case
        and empties every nullable scalar beside it. `@tcms/client`'s `core/rewrite.ts` is the
        read-modify-write every non-form client needs because of it.~~ → **superseded by B1: this
        is a partial `PATCH`.**

        **An absent field is left alone; an explicit `null` clears it.** `{"title": "x"}` renames
        the case and touches nothing else. The server can tell the two apart because it keeps the
        body beside the binding (`api.PatchBody`) and lays what was sent over the case as it stands
        — no `JsonNullable`, no shape change here, and the same reading the verb has always
        implied. What it fixes is not a nicety: a delta edit used to answer `200` having emptied
        four columns nobody mentioned, and the only client that never hit it was the one that
        submits every field on every save.

        **List** fields are unchanged, because a list always had an empty spelling of its own:
        `tags`, `classificationValueIds`, `preconditions`, `postconditions` and
        `declinedConditionIds` are left alone when absent and cleared by `[]`. `steps` now follows
        the same rule — absent keeps the stored procedure, `[]` asks to delete it.

        `title`, `stepFormat`, `priority` and `automationStatus` **stay required**, exactly as the
        schema says: this is the same arrangement `TestPlanUpdateInput` has, where `name` is
        required and everything else is left alone. So the smallest legal edit is those four plus
        whatever is being changed — `@tcms/client`'s `core/rewrite.ts` still composes the whole set,
        and it is now a convenience rather than the thing standing between a delta and data loss.

        A fully partial body — the four resolved from the stored case too — needs `TestCaseInput`
        split in two, because one schema serves this operation and `POST /cases`, where all four
        genuinely are required. That split is named as not done rather than approximated by a
        server that quietly stops enforcing what the schema declares.

        `ownerId` and `automationTags` are on `TestCaseInput` and neither has a write path. They are
        **refused with a 400 when they would change something** and accepted when they echo what the
        `GET` served (B2), so a round-trip no longer has to know to drop the two fields it just read.

        **This is where the procedure is required**, with the exception B2 added: a `STRUCTURED` case
        that *has* steps must keep at least one, and a `GHERKIN` one must keep its `gherkinSource` —
        so `steps: []` on a written case is refused, which is the body that was ever really a
        mistake. A **stub** created by `POST` with no procedure at all can be saved as it is, so
        reading one back and `PATCH`ing it unchanged is a no-op rather than a `400` about steps
        nobody has written yet. The SPA's editor still requires a procedure before it will save, in
        its own schema, where the author is looking at the field.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestCaseInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestCase' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [repository]
      summary: Soft-delete a test case
      description: |
        Soft-deletes the case. Past runs pinned the version they executed and must keep
        resolving what they covered, so the row survives, no read returns it, and the
        display and automation keys stay reserved.

        Requires `case:delete`, and **authorship does not narrow it**: any caller holding the
        key deletes any case in the project, whoever wrote it. It was `OWN`-qualified for Test
        Engineer until `V51` (roles spec §A5) — reversed because this product's subject is a
        *shared* test repository, and the duplicate a colleague left behind is exactly the row
        somebody else has to remove. Soft delete is what keeps that recoverable.

        One `403`, therefore: the caller does not hold `case:delete` here. A second, narrower
        refusal exists in the code for a future `OWN` grant and is unreachable from the
        shipped role catalogue.

        No `If-Match`: there is no lost-delete for a precondition to prevent, and a stale
        version would refuse the delete over an edit the caller does not care about.

        Nothing cascades. Steps, conditions, tags and attachments stay on the row.
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/cases/{caseId}/status:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/CaseId' }
    put:
      tags: [repository]
      operationId: setCaseStatus
      summary: Submit, approve, withdraw, deprecate or revive one case
      description: |
        The same §6g ladder `PUT …/suites/{suiteId}/status` moves a suite along, evaluated by the
        same class (`LifecycleLadder`) over the same four `LifecycleStatus` values — because §6g
        draws one diagram and then lists what review *means* per artifact, never a different set of
        moves.

        **Which permission a move needs is decided by the edge, not by the target**, exactly as on
        a suite: `case:edit` carries a case through the states nobody has signed off — submitting a
        draft, withdrawing that submission, retiring an unapproved case, reviving a retired one —
        and `case:approve` is needed to **grant** the sign-off and to move a case that **currently
        has one**, wherever it is going. A target-only rule would let a Test Engineer rescind a
        lead's approval by asking for `DRAFT`.

        **Why this exists, given `POST /cases/bulk` already moves cases.** It did, and it was the
        *only* way: moving one case meant leaving the case, finding its row in the list, selecting
        it and opening the bulk dialog — four steps and a different screen to do the thing the
        case's own page is about. Suites and plans have had this endpoint since §73/§74; the case,
        which §6g calls the common artifact, did not.

        **The bulk endpoint is unchanged and is not a special case of this one.** It stays because
        it answers a different question — *move these four hundred* — and its partial-failure
        contract is the reason: a selection is a filter's output and may hold rows of several
        statuses, so a row whose edge costs more than the caller holds is **skipped with a reason**
        there and answered **403** here. One row is not a selection, and a 403 about the one case
        somebody is looking at is exactly the answer they can act on.

        The audit trail says which of the two moved a case: this endpoint writes `case.submitted`,
        `case.approved`, `case.unapproved`, `case.withdrawn`, `case.revived` and `case.deprecated`
        — the per-act vocabulary the suite and plan endpoints already use — where the bulk path
        writes `case.bulk.*`. Plan §7's audit vocabulary lists the acts by name, and a reader asking
        *"what did we sign off last quarter"* should be able to answer it by filtering the action
        column.

        Two moves are refused with `409` because the ladder does not have them: `IN_REVIEW` is
        reachable only from `DRAFT`, and `APPROVED` only from `IN_REVIEW` (§6g: *"the state machine
        has exactly one gate"*). A **deprecated** case returns as a `DRAFT` and cannot go straight
        back to review or approval — §6g's clone rule, which makes the same argument about carrying
        a sign-off to content nobody read.

        §6g's review preconditions — author-cannot-approve-own-work and the minimum peer LGTM —
        apply on the `→ APPROVED` edge when the project has review enabled and a review is open.
        They are evaluated **after** the permission and produce a `409`, so a caller who may not
        approve at all is told that rather than being told they are the author of a review they
        could not have signed off either way.

        Idempotent: setting the status a case already has answers `200` with the case and writes
        nothing — no timestamp re-stamped, no audit row, and **no review record**, so a repeated
        click cannot bury the change that actually happened.

        **A status move is not authored content**, so it writes no `test_case_version` row. That is
        the bulk path's rule too, and the reason is `CaseVersions.hash`: a version whose digest is
        unchanged would attribute the *next* person's save to this move.

        No `If-Match`: the request names an absolute target state rather than a delta against
        something the client read, so there is no lost update to protect. The `PATCH` beside it
        *does* take one, because words typed over a stale copy really do lose the other author's.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaseStatusInput' }
      responses:
        '200':
          description: |
            The case, whole — the same `TestCase` shape `GET …/cases/{caseId}` serves. A 204 would force the
            screen into a refetch to render the state it just set, and the move changes more than
            the status field: `updatedAt`, `updatedBy` and the case's review standing all move with
            it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestCase' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{projectId}/cases/{caseId}/quarantine:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/CaseId' }
    put:
      tags: [repository]
      summary: Quarantine a flaky test, or put it back in the gate
      description: |
        M3's quarantine flow (plan §6c, §6l). Records the **decision** to stop gating on a
        test, alongside the flake evidence the decision was made on.

        **PUT with an absolute state, not POST and DELETE.** A client sending the same
        request twice must not be told `404` or `409` about a state it already asked for —
        releasing a case that is not quarantined succeeds, and so does quarantining one that
        already is. It is also the shape a checkbox produces; a toggle that has to become
        two HTTP methods is where "the quarantine turned itself off" comes from.

        `reason` is **required when `quarantined` is true** and ignored when it is false.
        The asymmetry is deliberate: releasing returns the test to the default, and the
        exception is the thing that needs justifying. A quarantine with no reason is debt
        nobody can clear — the board card says a test is excluded and cannot say why or by
        whom, so the only way to evaluate it is to read the test. A missing reason is a
        `400` field error, and `case_flake_quarantine_complete` refuses the row underneath
        regardless of what a caller believes.

        `quarantined` is required too, and its absence is a `400` rather than a default of
        `false` — the one shape of this request that could destroy a decision by omission.

        **Requires `case:edit`, not a new `case:quarantine` key.** The roles spec is
        authoritative and has no such key. The choice also carries §117's property:
        **Automation Service does not hold `case:edit`**, so a leaked CI token can post
        results and cannot quarantine a test to stop its own red results from gating.

        **Nothing downstream reads the flag yet.** Quarantine is recorded and surfaced; it
        does not exclude the case from a run, a report, or a pass rate. Silently moving a
        pass rate's denominator is how a green number stops meaning anything (§6e), so when
        gating reads this column it must say so on the face of the report.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaseQuarantineInput' }
      responses:
        '200':
          # 200 with the row rather than 204: quarantinedAt, quarantinedBy and the derived
          # counts all come from the server, so a 204 would force the screen into a refetch
          # to render the state it just set.
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseFlake' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/cases/{caseId}/clone:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/CaseId' }
    post:
      tags: [repository]
      summary: Clone a test case
      description: |
        Plan §6v, decision round 3 #59. Copies the case's authored content into a **new**
        case in the same project.

        **A clone is a create.** The server reads the source, builds the same input `POST
        /cases` takes, and runs it through the same validation, the same key allocator and
        the same version writer — so a clone can never be a second definition of a legal
        case. Six of §6v's rules hold by construction because of it: a newly allocated
        display key, a status that resets to `DRAFT`, its own version 1, no shared history,
        and an `Idempotency-Key` that behaves exactly as it does on a create.

        **Requires `case:create`**, the same key the create costs, and not `case:edit` —
        nothing about the source changes.

        What is copied: description, objective, expected outcome, step format, Gherkin
        source, priority, severity, automation status, the not-automatable reason, the
        duration estimate, every step, the classification, the condition references, the
        tags, and the attached files.

        What is deliberately **not**:

        - **`automationKey`, and with it the `AUTOMATED` status.** The key is unique per
          company (§6c), so copying it either violates the constraint or makes an ingested
          CI result match two cases. Dropping it **forces the status down**: `AUTOMATED`
          requires a key, so a clone of an automated case is created as
          **`TO_BE_AUTOMATED`**, which is not a compromise but the accurate state — it is
          intended to be automated and has no automation yet. Every other automation status
          is copied unchanged. A client showing the clone should say so; the alternative
          (relaxing the requirement) leaves a case reporting as automated that CI can never
          match, for ever.
        - **Version and execution history.** A clone is a new aggregate, not a version.
        - **Review state.** A clone of an approved case is a draft (§6g): approval attaches
          to content a named person read.
        - **The owner.** The clone is authored by the caller.

        Attachments are **byte-copied** under fresh storage keys, not shared by reference:
        two rows over one key means deleting either one destroys the other's bytes with
        nothing failing. A source file whose bytes are already missing is skipped rather
        than cloned into a second unreadable row.

        `title` is **required**. The server does not invent `Copy of …`: two rows a person
        cannot tell apart in a list is the failure this endpoint would otherwise ship by
        default, and the length limit would have to be decided by whoever wrote the prefix.
        The SPA prefills the suggestion in its dialog, where a human can edit it before it
        becomes a row.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestCaseCloneInput' }
      responses:
        '201':
          description: The new case
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestCase' }
        '200':
          description: |
            A replay — this `Idempotency-Key` already created a case, which is returned
            unchanged. Not `201`, and no `Location`: nothing was created by this request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestCase' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/cases/{caseId}/attachments:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/CaseId' }
    post:
      tags: [repository]
      operationId: attachCaseFile
      summary: Attach a file to a case
      description: |
        Decision round 3's #49 — `attachment.owner_type = 'CASE'`, declared by `V1` and
        writerless for the whole life of the product until this endpoint.

        **Requires `case:edit`, and the delete below requires the same key with no authorship
        arm.** Settled by `V51`, which removed the last `OWN` grant in the catalogue — including
        `evidence:delete`'s, the shape this endpoint declined to copy. The conclusion was simply
        reached early, and the reasoning is the one that generalises: a case attachment is part
        of the **case definition**, which `case:edit` already owns wholesale — a Test Engineer
        holding it may rewrite every step, the title and the preconditions of a lead's case. An
        authorship arm would make removing the screenshot *stricter than removing the step that
        references it*, which is incoherent in the direction that reads as security.

        **No new permission was invented.** The roles spec is authoritative and has no
        `attachment:*` key; one seeded to nobody is a `403` no administrator can grant their
        way out of — the standing argument that has kept `evidence:read` out of the
        catalogue since M0.

        **The upload proxies through the API** rather than going browser-direct to a signed
        URL: the storage port's filesystem adapter cannot issue one (plan §8 #28). So the
        instance's `spring.servlet.multipart.max-file-size` is a real limit and a file over
        it is a **413** rather than a `400` — the request is refused before it reaches the
        handler, so there is no field to hang a message on.

        **There is no `GET` here.** The list is `TestCase.attachments` on the detail, which
        is the only screen that shows it; a second read path would be a second answer to
        "what is attached to this case", free to disagree the moment one grew a filter.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    The bytes. Filename and content type travel in the part's own headers, and
                    the filename is stored in a column — it never becomes part of a storage key.
      responses:
        '201':
          description: Attached
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: |
            The file is larger than this instance's upload limit. Refused by the servlet
            container before the handler runs.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /projects/{projectId}/cases/{caseId}/attachments/{attachmentId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/CaseId' }
      - { $ref: '#/components/parameters/AttachmentId' }
    delete:
      tags: [repository]
      operationId: deleteCaseFile
      summary: Remove a file from a case
      description: |
        Costs `case:edit` — the same key the upload does, with **no author arm**. See the
        `POST` above for why, and note the consequence stated plainly: whoever may edit the
        case may remove any of its files, including one somebody else attached.

        **A hard delete, and the bytes go with the row.** A file removed on request has to
        actually leave the disk — a soft-deleted row pointing at retained bytes is a deletion
        that did not delete, which is the wrong answer for the one thing here a customer may
        need removed for privacy rather than tidiness. The row is removed first and the bytes
        second, so a failure between them leaves an unreferenced blob an operator can sweep
        rather than a thumbnail that renders and never opens.

        The audit row carries the filename, and it is the **only** surviving statement that
        the file existed once both the row and the bytes are gone.

        `404` when `attachmentId` names nothing on **this** case — the two-segment gate, so
        `/cases/{a}/attachments/{belongs-to-b}` cannot reach another case's file.
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/cases/{caseId}/attachments/{attachmentId}/content:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/CaseId' }
      - { $ref: '#/components/parameters/AttachmentId' }
    get:
      tags: [repository]
      operationId: downloadCaseFile
      summary: The file's bytes
      description: |
        What `Attachment.url` points at.

        **No permission beyond the case read gate.** Anyone who may read the case may read
        what is attached to it, and the catalogue has no `attachment:read` — inventing one
        would be a permission no role is granted, which is a `403` nobody can fix. It is also
        the only rule that does not make the SPA reason about two permissions per row.

        Served `inline` with the stored content type, so an image renders in place. The
        filename reaches a response **header**, where a carriage return is header injection
        rather than an odd name; it is neutralised on the way out.

        `404` also when the row exists and its blob does not — the orphan the write ordering
        deliberately produces rather than the reverse. An empty `200` would hand the browser
        a corrupt file.
      responses:
        '200':
          description: The bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/cases/{caseId}/versions:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/CaseId' }
    get:
      tags: [repository]
      summary: Version history
      responses:
        '200':
          description: Versions, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EntityVersion' }
        '404':
          # An unreachable project, a case in a sibling project, a soft-deleted case and an
          # absent one all answer 404 — the same concealment the case detail uses, so a
          # caller cannot probe for what exists outside its grants. Distinct from a 200 with
          # an empty array, which means the case is real and has no recorded versions.
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/cases/{caseId}/draft:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/CaseId' }
    get:
      tags: [repository]
      summary: The case's buffered autosave draft
      description: |
        The editor's unsaved state for this case, if any (plan §6j, decision round 3 #57).

        **`204` means "no draft", and it is not the `404` beside it.** Almost every case has
        no draft almost all of the time — an ordinary state of a perfectly readable case,
        not a missing resource. `404` keeps the meaning it has everywhere else on this
        controller: unreachable project, case not in it, deleted case.

        **Gated on `case:edit`, not `project:read`.** The content is the case's own content,
        so a Viewer would learn nothing from it that reading the case does not already
        disclose — but a draft is somebody's unfinished sentence, shown nowhere else in the
        product, and a Viewer is the client's stakeholder invited to read coverage rather
        than to watch it being written.

        **There is one buffer per person per case** (`test_case_draft (case_id, user_id)`,
        `V64`). This serves the caller's own draft and never a colleague's. Until `V64` the
        row was keyed on the case alone, two editors shared it, and `updatedBy` was served
        so a returning editor could be told whose words they were being offered — that
        field is gone with the hazard it disclosed, because under this key it could only
        answer "you".

        What a colleague's save does to your draft now is make it **stale**, not delete it.
      responses:
        '200':
          description: The buffered draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseDraft' }
        '204': { description: The case is readable and has no buffered draft }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [repository]
      summary: Buffer the editor's unsaved state
      description: |
        Autosave. Called on a timer rather than by a person pressing a button, and it
        replaces whatever was buffered rather than merging into it.

        **Nothing in `content` is validated.** A draft is half-written by definition: the
        title may be blank, a step may reference a retired shared step, `automationKey` may
        collide. All three are refused by `PATCH` and must be — validating here would make
        autosave fail while somebody is mid-sentence. The stated consequence is that **a
        draft which restores cleanly can still be refused when the user presses Save**.

        **There is no promote operation, deliberately.** Promotion is the client restoring
        the draft into the form and the user pressing Save, which is the ordinary `PATCH` —
        validated, versioned, audited, `If-Match`ed. A server-side promote would be a second
        write path into `test_case` whose input is by construction unvalidated.

        **A successful `PATCH` clears the saver's own buffer**, and only theirs (`V64`).
        A colleague's draft on the same case survives and is reported `stale` on their next
        read.

        **No `If-Match`.** `lockVersion` is recorded, not enforced: an autosave that answered
        `409` is one the user cannot resolve, because they never asked for it and there is no
        dialog to show them.

        `lockVersion` is **required** and its absence is a `400` rather than a default —
        every value it could default to is a claim about which version the draft was written
        against, and guessing it wrong is how a restore silently overwrites a colleague's
        committed edit. See `CaseDraft.stale`.

        Content over **256 KB** serialized is a `400` field error. Nothing else bounds this
        row: the content is unvalidated, the caller is a timer, and no retention prunes the
        table.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaseDraftInput' }
      responses:
        '200':
          # 200 with the stored draft rather than 204: `updatedAt` comes from the server's
          # clock, and on a screen whose job is telling you when your work was last safe the
          # client's own clock is the wrong source. It also carries `stale`.
          description: Buffered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseDraft' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [repository]
      summary: Discard the buffered draft
      description: |
        Throws the caller's own buffer away. **Idempotent**: discarding a draft that is not there
        succeeds, because the caller asked for a state and that is the state it is in. A
        second click, a retry after a timeout, and a concurrent save that already cleared the
        row must none of them read as an error.
      responses:
        '204': { description: Discarded, or there was nothing to discard }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/cases/{caseId}/history:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/CaseId' }
    get:
      tags: [repository, reporting]
      summary: Pass/fail execution history for a case
      description: |
        Timeline of every execution, attributed to the case version executed, plus
        version-change markers so "the edit broke it" is readable at a glance
        (plan §6p).

        Plan §6p also describes narrowing this timeline by **release version** and by
        **configuration**, and both were declared here from §49 until the binding check
        found that neither reaches a handler — `CaseHistoryController` binds `scope` and
        `caseVersionNo` and nothing else, so a caller sending `?configurationId=…` got the
        whole timeline back with a 200 and no indication it had been ignored. Deleted rather
        than implemented, because nothing sends them: an unimplemented filter in the contract
        is worse than an absent one, since `schema.d.ts` generates it and the absence of an
        error reads as success. Re-add contract-first when a screen needs one — the service
        already groups by (version, configuration) for the flakiness figure, so the data is
        there.
      parameters:
        - name: scope
          in: query
          description: |
            Which versions the summary and the timeline cover. `CURRENT_VERSION` is the default and
            the safe one: blending results across versions reports a pass rate for a test whose text
            changed underneath it (plan §6p).

            Deliberately NOT expressible as `caseVersionNo`, though it looks like it should be. The
            UI's chip says "Current version", not "v7" — and "current" is resolved server-side, so a
            case edited between the page load and this request is still summarized against the version
            that is current NOW. A client sending `caseVersionNo=7` has pinned v7 forever and would
            quietly report a stale scope after the next save.
          schema:
            type: string
            enum: [CURRENT_VERSION, ALL_VERSIONS]
            default: CURRENT_VERSION
        - name: caseVersionNo
          in: query
          description: |
            One explicit version — what a click on a version marker asks for. Wins over `scope` when
            both are sent, because it is the more specific of the two requests.
          schema: { type: integer }
      responses:
        '200':
          description: History
          content:
            application/json:
              schema:
                type: object
                # All three always sent. `summary` in particular: a case with no executions still
                # gets a summary of zeros, because the panel's job is to state the counts and an
                # absent summary would render as a failed load rather than as "never executed".
                required: [summary, entries, versionMarkers]
                properties:
                  summary: { $ref: '#/components/schemas/CaseHistorySummary' }
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/ExecutionHistoryEntry' }
                  versionMarkers:
                    type: array
                    items: { $ref: '#/components/schemas/VersionMarker' }
        # 400 is reachable on a READ, which is unusual enough to state: `scope` is a closed set and
        # an unrecognised value is refused by name rather than silently falling back to a default,
        # because a silent fallback is how a client asking the wrong question gets a confident
        # answer to a different one.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/cases/{caseId}/external-links:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/CaseId' }
    post:
      # Served by `documentation`, under `repository`'s aggregate — the row is a doc_link. Same
      # split as /plans/{planId}/document, and ExternalLinkController's header carries it.
      tags: [repository, documentation]
      summary: Link this case to code or to a URL
      description: |
        Records that this case verifies a range of lines in a repository, or a document published
        somewhere else — the two `targetKind`s `V1` designed and nothing wrote until §169 (plan
        §6m; open question #26, resolved *build it* on 2026-08-02).

        **Requires `case:edit`, not `doc:edit`** — which is the opposite of the block link one path
        over, and deliberately. That one gates on documentation rights because the link renders on
        a documentation page. An external link renders in exactly one place, the case's
        Traceability panel, so the act writes into a case and nothing else: charging documentation
        rights for it would let a docs author annotate a case they may not edit, and would make
        this impossible in a project that keeps no documentation at all.

        **The commit sha is mandatory for `EXTERNAL_GIT`.** Not optional metadata: an unpinned line
        range silently points at different code after the next push, which is a link that lies
        rather than a link that breaks. A branch or tag name is refused for the same reason.

        **The line range is optional as a whole** — a link to a whole file is a legitimate claim —
        **and ordered when present.** An end without a start is refused rather than rendered as
        `Checkout.java:null–120`.

        **`EXTERNAL_URL` accepts `http` and `https` only.** The SPA renders the value as an
        anchor's `href`, so this is a security bound: a `javascript:` URL executes in the reader's
        session and a `data:` URL renders attacker-authored HTML on this product's origin. It is
        refused at the write because that is the one place it can be refused once — four renderers
        read this value back.

        **Linking the same target twice writes nothing and answers `200`** with the link already
        there, exactly as the block link does, and for the same reason: re-asserting a recorded
        fact is agreement, not conflict. Identity includes the line range, so two ranges in one
        file at one commit are two links.

        The created link reaches `TestCase.relatedDocuments` through the `case_doc_link` mirror,
        which refreshes on the `documentation.links_changed` event this write raises — so the
        case's panel updates on the next fetch rather than within this response. There is no `GET`
        here on purpose; the case is where a case's links are read.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExternalLinkInput' }
      responses:
        '200':
          description: The identical target was already linked. Nothing was written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalLink' }
        '201':
          description: |
            Linked. **No `Location` header** — there is no operation that would serve it, and §119
            is the standing account of what answering 201 with a `Location` that 404s costs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalLink' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: |
            The project or the case is not visible here. One bodiless response for both (§6t), and
            the case check is against **this project** rather than merely this company — a sibling
            project's case lands here rather than being linked.

  /projects/{projectId}/cases/{caseId}/external-links/{linkId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/CaseId' }
      - name: linkId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [repository, documentation]
      summary: Correct what one of this case's external links claims
      description: |
        Requires `case:edit` — this endpoint's own gate, not the documentation one. The split is
        `POST .../external-links`'s: a link to a file belongs to the case, a link to a paragraph
        belongs to the documentation, and each end is gated by whoever owns the thing the link is a
        property of.

        **Both ends of this act exist because §173 is what happens when only one does.** That
        section spent a slice removing an asymmetry in the *withdrawal* of these same rows, on the
        grounds that one act must not behave two ways depending on which screen reached it. Shipping
        the correction on the documentation end alone would have re-created it the same week.

        Everything else — only `relationship` is mutable, `200` whether or not the value moved, no
        audit row and no event for a no-op — is the sibling's, and stated there.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkRelabelInput' }
      responses:
        '200':
          description: The link, with the relationship it now claims.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalLink' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [repository, documentation]
      summary: Remove one of this case's external links
      description: |
        Requires `case:edit`. **A hard delete** — a withdrawn claim left in the table still reads as
        one to every count over it, which is the call `BlockLinkService` makes for the same table.

        A link id belonging to another case is a `404` rather than a delete, and so is one that
        does not exist: unlike the `POST`, there is no fact here that is already true.
      responses:
        '204':
          description: Removed. No body.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/ai-proposals:
    # Only the path variable is shared — the paging and status filter belong to the GET. See the
    # comment on /projects/{projectId}/cases for what a filter declared here would have done to the
    # POST beside it.
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      tags: [repository]
      summary: The review queue — generated cases awaiting a decision
      description: |
        Proposals in one status, newest first, defaulting to `PENDING` (plan §6w.6).

        The default is a status rather than "all": a queue is a list of things waiting, and a first
        page mixing in every decided proposal from the project's history is a list nobody can work
        from. A client measuring the rejection rate asks for the status it wants.

        Rows carry **both** `verdict` and `verdictSource`. A client that renders the first without
        the second shows a claim as a finding, which is the inflation §6w.1a exists to prevent one
        layer up.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ProposalStatus' }
      responses:
        '200':
          description: A page of the queue
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    # `required` does not descend through allOf — the PageMeta branch declares its
                    # own and this one needs the same.
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AiProposalSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [repository]
      summary: File a generated test case as a proposal
      description: |
        **The one arm a generation agent calls.** §6w.6: *nothing generated writes to `test_case`
        without a human accepting it*, so this endpoint files a case for review and creates nothing.

        The proposed case travels as a `TestCaseInput` — the same body `POST /cases` takes — because
        accepting a proposal hands exactly this body to the create path. A second shape would be a
        second answer to *what is a case*, and the one that diverges is whichever was edited second.

        **The payload is stored unvalidated**, deliberately. Whether it is a legal case is a
        question about the project's suites and vocabularies *at accept time*, which may be a week
        later, and answering it twice gives two answers. This endpoint refuses only what it can
        judge without the project's state: a missing case, a blank title, a payload over the
        ceiling. A proposal that cannot be accepted is therefore possible, and the reviewer finds
        out with the field errors in hand — a legible failure, against an agent's whole batch being
        thrown away because one suite was renamed.

        **There is no `verdictSource` field and there must never be one.** It is derived from
        whether `verdict` was sent: absent gives `NONE`, present gives `EXTERNAL`. An asserted
        verdict is recorded, shown and attributed, and never counted as verified (§6w.1a).

        Gated on `case:create`, which is the key the `Agent` role carries for this.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiProposalInput' }
      responses:
        '201':
          description: Filed, and waiting for a person
          headers:
            Location:
              description: The proposal's own URL.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiProposal' }
        '200':
          description: |
            **A replay.** The `Idempotency-Key` had already filed this proposal, so nothing was
            filed by this request — which is why it is not a 201 and carries no `Location`. This
            matters more here than on the other create endpoints: the caller is a program deciding
            whether to retry the rest of a batch, and a duplicate is paid for by the reviewer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiProposal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/ai-proposals/{proposalId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: proposalId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [repository]
      summary: One proposal, with its payload and its grounding evidence
      description: |
        The reviewer's screen. Carries the proposed case as a `TestCaseInput` rather than as a
        `TestCase`: there is no case, so there is no key, no owner, no lifecycle status and no
        version, and serving the stored input is the honest shape — as well as the one the editor
        already renders.

        `grounding` is free-form and is **displayed, never interpreted**. It is evidence produced by
        somebody else's critic, so a schema here would refuse the parts this product has not thought
        of.
      responses:
        '200':
          description: The proposal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiProposal' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/ai-proposals/{proposalId}/accept:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: proposalId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [repository]
      summary: Accept a proposal — the case is created through the ordinary create path
      description: |
        §6w.6: the accepted case is created by **the same path `POST /cases` uses**, so it is
        indistinguishable from a case authored any other way — same validation, same `TC-n`
        allocation, version 1 written with it, same audit row. It enters at `DRAFT` and travels the
        review workflow like any other case; **there is no path from a model to `Approved`.**

        **The author of the case is the accepting person.** §6j's attribution guarantee is untouched.

        **A credential cannot accept.** The gate is `case:create` *and* the caller not being an API
        token — 403 with a body that says so. This is not expressible as a permission: a token's
        effective set is its owner's set intersected with its role's, so every permission a token
        holds is one its owner holds, and `case:create` is in the `Agent` grant precisely because
        this path needs it. Without the second half, an agent could file a proposal and accept it in
        two calls.

        **400 is reachable and is the interesting one.** The payload was stored unvalidated, so a
        suite that has since been deleted, a retired shared step, or a vocabulary value that no
        longer exists lands here as ordinary field errors on `TestCaseInput`'s own field names — the
        reviewer sees exactly what an author would see, and can reject instead.

        Accepting an already-accepted proposal answers **200 with the case**, not a conflict: the
        state asked for is the state it is in. Accepting a rejected one is a 409.
      responses:
        '201':
          description: Accepted — and this is the case it became
          headers:
            Location:
              description: The created case's own URL.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestCase' }
        '200':
          description: |
            Already accepted. The case is returned again and **nothing was created by this
            request**, which is why there is no `Location`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestCase' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            This proposal was rejected, or was accepted into a case that has since been deleted.
            Either way the decision has been made and cannot be made again.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /projects/{projectId}/ai-proposals/{proposalId}/reject:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: proposalId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [repository]
      summary: Reject a proposal — recorded, not deleted
      description: |
        §6w.6: *"a generation profile whose proposals are rejected 80% of the time is a measurable
        fact, and the alternative — proposals that vanish when dismissed — makes that unknowable."*
        So the row stays, with who decided and when.

        The `note` is **optional**, unlike a quarantine's reason: a quarantine is live debt somebody
        must eventually clear and cannot without knowing why, while a rejected proposal is finished
        and the note improves a signal rather than unblocking a person.

        Rejecting an already-rejected proposal succeeds and **keeps the first note** — a second
        click must not erase the reason the decision was made for. Rejecting an accepted one is a
        409.

        Gated exactly as accept is, credential refusal included: a token that could clear the queue
        could hide its own bad proposals.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProposalRejection' }
      responses:
        '200':
          description: Rejected, and the proposal as it now stands
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiProposal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: This proposal was already accepted.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /projects/{projectId}/conditions:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      tags: [repository]
      summary: Reusable pre/post condition library
      parameters:
        - name: q
          in: query
          description: Typeahead query. Ranked by relevance blended with usageCount (plan §6h).
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string, enum: [PRE, POST, BOTH] }
      responses:
        '200':
          description: Conditions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Condition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [repository]
      summary: Add an entry to the reusable condition library
      description: |
        **`library:manage`** — creating an entry propagates nowhere, so the permission is the
        whole control on this path.

        Until §95 this collection was a read of a table **nothing could write**. `/shared-steps`
        had the same gap and closed it the same way; this is the half that mattered, because
        **conditions are now the product's only genuinely shared authoring object**. A case
        attaches one **by id**, and an edit to it propagates everywhere it is used — see the `PUT`,
        which is the one mutation in the API whose blast radius is not the thing being edited.
        ~~Shared steps were the sibling mechanism.~~ → **retired in §239**: the library was
        half-built, its picker copied an entry's *title* into the step's `action`, and the
        reference it set beside it was resolved by no read path in the product, so an edit to a
        shared step propagated to precisely nothing. What replaced it is `/step-suggestions`,
        which is copy-not-reference by construction. **Do not read this endpoint as one of a
        pair.**

        Conditions are **project-scoped**, so an entry is reachable only from the project it was
        created in.

        No `Idempotency-Key`: a duplicate is visible in the picker next to its twin the moment the
        create returns.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConditionInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Condition' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/conditions/{conditionId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: conditionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [repository]
      summary: Edit a library condition — the edit propagates
      description: |
        **`library:manage`.** This is the operation the roles spec's note about library work being
        *"gated by an impact modal, not by permission"* was actually about: the edit lands on every
        case and suite attaching this entry, with **no prompt and no fork**. Attaching a condition
        is a reference, not a copy — that is the whole point of the object, and the deliberate
        opposite of `/step-suggestions`, where picking a suggestion copies text and creates no link.

        **The client is expected to state the impact before submitting**, which is what `usageCount`
        and `suiteUsageCount` are served for. Read both — the suite figure is not a case count and
        must not be rendered as one.

        **No fork-on-edit.** Offering "change everywhere / copy for this case" was considered and
        refused: the fork is what turned `shared_step` into a library of near-duplicates nobody
        could rank. An author who wants different text writes a different condition.

        A `PUT` rather than a `PATCH` because the body is the entry's whole authored content — title,
        type and body together — and there is no field on it a caller would legitimately omit.

        **Retired entries are not editable**: a soft-deleted condition answers 404 here, the same
        answer an id from another project gets, so this endpoint is not an existence oracle for a
        library the caller cannot read.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConditionInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Condition' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{projectId}/step-suggestions:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      tags: [repository]
      summary: What the step editor completes from
      description: |
        Every distinct step the project already uses, most-used first, narrowed by an optional
        fragment of the action — the corpus the case editor's action field autocompletes against,
        the way a Cucumber feature file completes from the step definitions already defined.

        **The corpus is derived, not curated.** It is computed from every step written in the
        project's live cases, so it is populated as soon as the project has a case and needs no
        maintenance to stay that way. That was the correction to `/shared-steps`, whose failure
        was that somebody had to remember to put things in it: a library nobody populates ranks
        nothing and its picker opens empty forever. **§239 finished the argument and retired that
        endpoint**, so this is not one option of two — it is how step reuse works.

        **A suggestion is text to copy, not an entity to reference.** Picking one fills `action`,
        `testData` and `expectedResult` into the author's step and creates **no link** — the step
        belongs to that case, and editing it afterwards changes that case and nothing else. This is
        deliberately the opposite of `/conditions`, where a case attaches a library entry by id and
        an edit to the entry propagates to every case using it. The difference is intended: a shared
        precondition is a fact about the system, a step is a sentence somebody wrote. **No id is
        served here**, so the distinction is enforced by the payload's shape rather than by a
        convention a later consumer can drift away from.

        The whole triple is completed and the whole triple is the grouping key. Completing only the
        action would leave exactly the two fields that differ between two similar steps blank, and
        the author would fill them from memory — which is the divergence this endpoint exists to
        stop. Two steps sharing an action but not an expected result are two suggestions.

        **`useCount` counts distinct live cases**, not step rows — the §6e rule, and the rule the
        retired `SharedStep.usageCount` followed too. A case that repeats a step twice is one
        case using it;
        counting rows would let a single loop-heavy case out-rank a step forty cases share.
        Soft-deleted cases are excluded, so the ranking reflects current practice rather than
        history.

        Capped at 50 server-side. There is no `limit` parameter: a typeahead renders a dozen rows
        and a mature project's corpus is thousands, so an unbounded read is a payload nobody
        displays.
      parameters:
        - name: q
          in: query
          description: |
            A fragment of the step's action, matched case-insensitively as a substring. Absent or
            blank means the whole corpus, most-used first.
          schema: { type: string }
      responses:
        '200':
          description: |
            Step suggestions, most-used first. `[]` means nothing matched — the state of a project
            whose cases have no steps yet, and of any typeahead narrowed past the corpus. It is not
            an error: an author who gets no suggestions can still write the step by hand.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StepSuggestion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/tags:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [repository]
      summary: The tags in use in this project
      description: |
        Every distinct `case_tag` on a live case of this project, with the number of cases carrying
        it, most-used first and then alphabetically.

        **Derived, never curated** — `step-suggestions`' argument at a different altitude, and the
        correction `shared_step` earned by staying empty: a tag list somebody has to populate is a
        tag list nobody populates. A tag exists here because a case carries it, so this endpoint
        cannot disagree with the grid.

        **It is a picker's list and never a validator's.** A tag is free text (§96) and a client may
        send one this endpoint did not return — that is how the first case to carry a new tag gets
        it. Narrowing writes to this list would make the vocabulary closed, which is precisely what
        `case_tag` is not.

        Counts are over **live** cases, so a tag whose every case was soft-deleted disappears from
        the list while remaining legal to write. Zero-count rows are therefore impossible rather
        than filtered.
      responses:
        '200':
          description: |
            The tags in use. An empty array is the ordinary answer for a project nobody has tagged,
            not an error — both tag controls must render an empty list as *"no tags yet"* rather
            than as a failure to load.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TagUsage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------------------------------------- execution ----
  /projects/{projectId}/plans:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [execution]
      summary: Test plans
      description: |
        The project's **working list**, newest key first: plans that are not deleted and not
        archived.

        `archived=true` widens it to include archived plans — it does not narrow it to them.
        Somebody ticking "show archived" is asking which plans exist, and answering with the
        archive alone would make them read two screens to find out. Archived rows carry a
        non-null `archivedAt`, which is how a client marks them.
      parameters:
        - name: archived
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: |
            `true` to include archived plans as well as the working ones (`V65`).
      responses:
        '200':
          description: |
            The **full** `TestPlan`, not `TestPlanSummary` — the list row and the detail are one
            shape, assembled once (`TestPlanView`'s own note gives the reason: two assemblers are
            how a row and a detail page come to disagree about a plan's status three slices later).

            This line was `TestPlanSummary` until §100 and had been a live three-way divergence:
            `TestPlanView` serves the wide shape, the mock's `present()` serves the wide shape,
            `usePlans` has been typed `TestPlan[]` since Phase 1 — and `TestPlanView`'s javadoc
            already claimed "the contract now declares the wider shape", which was never true. The
            field the gap actually hid is `exitCriteria`: every consumer read it, the contract said
            it was not there, and nothing failed because both implementations sent it anyway.
            Widening the declaration changes no server and no client; it makes the spec say what
            three implementations already do.

            `met` is null on every criterion here. Evaluating a plan's gates means resolving its
            results, which is the statistics endpoint — a list that did it per row would be that
            endpoint run once per plan. So the list can say a criterion EXISTS and never that it
            passed, which is exactly what the compact strip on the plan list renders.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TestPlan' }
        '404':
          # An absent project, one in another company, and one in this company the caller
          # holds no grant on all answer 404 — the read gate every project-scoped list uses.
          # Distinct from a 200 with an empty array, which means the project is reachable
          # and has no plans, the state of every freshly provisioned project.
          $ref: '#/components/responses/NotFound'
    post:
      tags: [execution]
      summary: Create a test plan
      description: |
        `plan:create` — Instance Admin, Company Admin, Test Lead and Test Engineer (roles
        spec §A4). Viewer and Automation Service do not hold it: a plan is authoring, and
        the read gate every role passes must not be the write gate.

        `suiteIds` and `caseIds` become the plan's **scope items**. A suite item means the
        suite's resolved membership — filed ∪ added ∪ tagged, the same union `Suite.caseCount`
        reports — and the plan's `caseCount` expands it, so naming a suite and one of its
        cases is not a mistake: it is two ways of saying the same thing and the count dedupes
        them.

        ~~A suite item means the folder *and everything beneath it*.~~ → **superseded (§98)**,
        when suites stopped being folders. Nothing about scope changes in *effect* for a plan
        that named a leaf; a plan that named a parent to reach its children now reaches only
        what that suite itself resolves, which is the whole point of the flattening.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestPlanInput' }
      responses:
        '201':
          description: Created — key is server-allocated (TP-n, per company)
          headers:
            Location:
              schema: { type: string }
              description: The new plan's canonical URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestPlan' }
        '200':
          # A retry carrying an Idempotency-Key that already created a plan. 200 rather than
          # 201 so a client can tell "I made this" from "I already had this", and so a
          # well-behaved retry is not logged as a second creation. No Location: nothing was
          # created by THIS request.
          description: Replayed — this Idempotency-Key already created a plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestPlan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          # The project read gate, before the payload is looked at — an absent project, one
          # in another company, and one the caller holds no grant on are one answer.
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/plans/{planId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: planId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [execution]
      summary: Plan detail
      responses:
        '200':
          description: Plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestPlan' }
        '404':
          # Four states, one answer: an unreachable project, a plan in a sibling project, a
          # soft-deleted plan and an absent one. Telling them apart makes the path an oracle
          # for plan ids in projects the caller cannot open (§6t).
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [execution]
      operationId: updatePlan
      summary: Edit a test plan's content
      description: |
        `plan:edit` — Instance Admin, Company Admin, Test Lead and Test Engineer (roles spec
        §A4), the same key that carries a plan forward through its ladder.

        Edits what the plan *is*: name, description, milestone, **scope** and the two
        **criteria** lists. `entry_criteria` and `exit_criteria` had no writer at all before
        this operation existed, so `PlanCriteria`'s evaluator and the plan page's exit-criteria
        panel have had nothing to evaluate on any real instance.

        **Not `status`** — that is `PUT .../status`, with its own two gates. A status an
        ordinary save could set is an approval anybody grants themselves.

        ~~**A closed plan is refused with `409`.** `CLOSED` says a release was executed and is
        over, and its scope and criteria are the record of what that release was tested
        against.~~ → **superseded 2026-08-05 (§97, M7):** there is no `CLOSED`, so no plan is
        frozen against editing. What survives is §6g's edit-after-approval rule — editing an
        **approved** plan on a project with review on demotes it to `DRAFT` — so a sign-off
        cannot come to cover criteria nobody signed. What is genuinely lost: a plan whose runs
        are finished stays `APPROVED` and can still be edited.

        **Absent, null and empty are three different instructions**, and the split is by kind
        rather than by field. A **scalar** sent as `null` is cleared. A **list** sent as `null`
        or omitted is *left alone*, and `[]` clears it — a list has an empty spelling of its
        own, so `null` does not have to carry two meanings. That is what keeps a plan whose
        criteria nobody has ever written distinguishable from one whose author deliberately
        removed them all.

        **A version row is written only when the SCOPE moves.** Plan §6j defines a plan version
        as its scope — suites, cases, milestone, criteria — so renaming a plan, rewriting its
        description, or saving it unchanged writes no `test_plan_version` row and leaves
        `currentVersionNo` alone.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestPlanUpdateInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestPlan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          # One 409 left since §97: a stale If-Match, which says "reload and reapply". The other
          # — a closed plan, which said "reopen it", where reloading changes nothing — went with
          # the CLOSED state (M7).
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [execution]
      operationId: deletePlan
      summary: Delete a test plan
      description: |
        `plan:delete` — Instance Admin, Company Admin, Test Lead **and, since `V51`, Test
        Engineer** (roles spec §A4). ~~A Test Engineer holds `plan:create` and `plan:edit` and
        **not** this one: a contributor is never blocked from producing, only from unmaking.~~
        Reversed: a contributor who may author a plan and edit it may retire one, whoever wrote
        it. ~~The lead line now sits at shared *structure* (`suite:delete`, `artifact:delete`) and
        at judgements about the work (`run:close`, `result:amend`), not at deletion as such.~~ →
        **that line lasted one day.** `V52` (2026-08-15, §210) granted all four to Test Engineer
        and retired the principle rather than narrowing it a third time: the tier is approvals and
        project configuration, and **no delete key is on it**.

        **Refused with `409` while any live run was created from the plan**, naming how many.
        `test_run.plan_id` references the plan and the run list keeps rendering its key, so
        deleting it would leave those runs pointing at a plan the API answers 404 for.

        ~~The way out is `PUT .../status` with `CLOSED`. **Delete a plan nobody executed; close one
        somebody did.**~~ → **superseded 2026-08-05 (§97, M7):** with no `CLOSED` the partition has
        one half. A plan a run names cannot be deleted and **has no terminal state** — it stays
        `APPROVED` for ever, which is correct under M7, where a plan is an outline and its
        execution state lives on its runs. The refusal names the runs, which is the thing actually
        in the way, rather than an act that no longer exists.

        Soft: the row stays, every read drops it, and the scope items and the suites and cases they
        name are untouched.
      responses:
        '204':
          description: Deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          # Including a plan that was already deleted: a second delete is a 404, not a second 204.
          $ref: '#/components/responses/NotFound'
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{projectId}/plans/{planId}/clone:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: planId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [execution]
      summary: Clone a test plan
      description: |
        Plan §6v, decision round 3 #59. Copies the plan into a **new** plan in the same
        project, ready to be renamed for the next release.

        Copied: the description, the milestone, the **whole** scope — the unsectioned
        suites, cases and tags, and every §97 section with its members and its order,
        including a section that is deliberately empty — both scope prose fields, and both
        criteria lists.

        Not copied: the runs, the executions and the results (a plan's scope is what it
        covers, not what happened); the status, which resets to `DRAFT` (§6g — approval
        attaches to content a named person read); and the key, which is allocated fresh.
        The new plan gets its own **version 1** describing itself, not a copy of the
        source's history.

        **This is not `POST /plans` with a source id, and the difference is the point.**
        `TestPlanInput` carries six fields on purpose — a plan is named before anybody has
        subdivided it — so a clone routed through it would drop the sections, the tag arm,
        both prose fields and both criteria lists, and report `201`. This operation shares
        the create's key allocation, starting status and version writer, and supplies the
        rest.

        **Requires `plan:create`.** The criteria and prose it writes normally cost
        `plan:edit`, and every role holding `plan:create` also holds `plan:edit`, so no
        caller gains anything they could not do in a second request. A test derived from the
        seeded catalogue pins that, so a future role separating the two fails the build.

        `name` is **required**; the server invents no `Copy of …`. Criteria are copied as
        stored rather than re-validated: a metric retired since the plan was written would
        otherwise make that plan permanently uncloneable.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestPlanCloneInput' }
      responses:
        '201':
          description: The new plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestPlan' }
        '200':
          description: A replay — this `Idempotency-Key` already created a plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestPlan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/plans/{planId}/status:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: planId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [execution]
      operationId: setPlanStatus
      summary: Submit a plan for review, approve it, or withdraw it
      description: |
        The plan's ladder is DRAFT → IN_REVIEW → APPROVED, and **which permission a move needs is
        decided by the edge, not by the target**:

        - `plan:edit` (Test Engineer and up) carries a plan *forward* through the states nobody has
          signed off — submitting it for review, and returning it from review to draft.
        - `plan:approve` (Lead and up) is needed to **grant** the sign-off and to **take it back** —
          because rescinding a lead's approval is an approval act, and a target-only rule would let
          a Test Engineer do it by asking for `DRAFT`.

        **Two states were removed on 2026-08-05 (§97, M7):** ~~`ACTIVE` and `CLOSED`~~. They
        described a plan being *run*, which is `test_run`'s business — a plan is an outline of what
        must be tested, and whether it is under way is answered by its runs, which have carried
        NOT_STARTED → IN_PROGRESS → COMPLETED → ABORTED since the beginning. §6g's gating rule for
        plans (`requireApprovedPlanToStart`) went with the one edge it bound on and its setting is
        gone; §6g's *case* gate, `requireApprovedCaseForRun`, is untouched. A plan a run names can
        no longer be deleted **and has no terminal state**: it stays `APPROVED`.

        One move is refused with `409` because the ladder does not have it: `APPROVED` is reachable
        only from `IN_REVIEW`, because approval must not be reachable without review — §6g's one
        gate. `APPROVED → IN_REVIEW` is refused for the same reason read forwards: a withdrawn
        sign-off returns the plan to its author, who resubmits it.

        Idempotent: setting the status a plan already has answers `200` with the plan and writes
        nothing — no timestamp re-stamped and no audit row, so a repeated click cannot bury the
        change that actually happened.

        No `If-Match`: the request names an absolute target state rather than a delta against
        something the client read, so there is no lost update to protect (`PUT /runs/{runId}/status`
        makes the same call).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanStatusInput' }
      responses:
        '200':
          description: The plan, as the list renders it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestPlan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{projectId}/plans/{planId}/archive:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: planId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [execution]
      operationId: setPlanArchived
      summary: Put a plan away, or bring it back
      description: |
        `plan:edit`. **A visibility act, and nothing else** (`V65`, audit D2).

        The same shape as `PUT /projects/{projectId}/archive` one level up, deliberately: one
        endpoint for both directions, naming the target state rather than a verb.

        `V32` removed `CLOSED` from the plan ladder because it described a plan being *run*,
        which is `test_run`'s business. What went with it was any way for a finished plan to
        leave the list: `DELETE` refuses a plan that runs were executed against — correctly,
        since those runs would be left naming a plan that 404s — so the plan for last
        spring's release stayed `APPROVED` at the top of the working list for ever.

        What archiving does **not** do is most of it:

        - it does not touch `status`, because an approved plan is the one you most want to
          archive when the release ships and archiving must not unsay the approval;
        - it does not freeze the plan — an archived plan can still be read, edited, approved,
          cloned, run against and reported on, under every gate that applied before;
        - it does not make `DELETE` succeed. Archiving is what to do *instead of* deleting
          such a plan, and that `409` still names the runs in the way.

        A flag that also froze the plan would be `CLOSED` under another name. This is charged
        `plan:edit` rather than `plan:delete` for the same reason: it destroys nothing and is
        reversible by the same act that set it.

        Idempotent: asking for the state the plan is already in answers `200` with the plan
        and writes nothing — no timestamp re-stamped, no audit row. No `If-Match`, for
        `PUT …/status`'s reason: the request names an absolute target rather than a delta
        against something the client read.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanArchiveInput' }
      responses:
        '200':
          description: The plan, as the list renders it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestPlan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/plans/{planId}/statistics:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: planId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [execution, reporting]
      summary: Current plan state from the latest execution
      parameters:
        - name: aggregation
          in: query
          description: |
            How to resolve a case executed many times. The chosen policy is echoed
            back and MUST be displayed — two teams reading "94% pass" otherwise mean
            different things (plan §6e).
          schema:
            $ref: '#/components/schemas/AggregationPolicy'
      description: |
        Live since backend M2 slice 3. Computed on read from `test_execution` rather than
        from the `plan_snapshot` rollup plan §6p specifies — that rollup belongs to
        `reporting`, which does not exist, and a figure recomputed per request cannot go
        stale relative to a result recorded a second ago, which is the property a tester
        checks immediately after saving one. The cost is one grouped scan per view, bounded
        by the plan's own scope; revisit when a plan's execution count makes it visible.

        **Two of the five criterion metrics are evaluated** — `pass_rate` and `coverage`,
        the two this endpoint's own numbers support. `open_critical` needs the M4 issue
        tracker, `cases_approved` the review workflow, and `build_available` is modelled
        nowhere; those return `met` and `actual` as null, meaning *not evaluated*, which is
        a different thing from unmet.
      responses:
        '200':
          description: Statistics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanStatistics' }
        '400':
          description: The `aggregation` parameter is not one of the five policies.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          # Same four states as the plan detail above.
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/configurations:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [execution]
      summary: The environments a run can be executed in
      description: |
        The project's `configuration` rows — *"Chrome / Windows"*, *"staging"*, a device
        matrix cell. Every project is seeded with a `Default` by `tcms_seed_project_defaults`,
        so this list is **never empty**, which is what lets `test_run.configuration_id` be
        `NOT NULL` and `TestRunInput.configurationId` be optional.

        **Gated on the project read alone**, like `GET /statuses` beside it and for the same
        reason: this is a project vocabulary, every client with a run form needs it, and none
        of those readers is an administrator. There is no configuration *write* on this
        contract — the set is seeded and edited by an operator — so this is a read with no
        writer rather than half of a CRUD pair.

        Ordered **default first, then by name** — the order a picker wants, and the order a
        plan's `configurations` array already comes back in.
      responses:
        '200':
          description: Configurations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Configuration' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          # The project read gate only — see the members list.
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/runs:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      tags: [execution]
      summary: Test runs
      parameters:
        - name: planId
          in: query
          schema: { type: string, format: uuid }
        - name: releaseVersion
          in: query
          schema: { type: string }
      description: |
        `planId` and `releaseVersion` are both **exact-match** filters, and both narrow rather
        than resolve: a `planId` naming a plan in another project narrows the list to nothing
        rather than answering 404, because the filter is a question about this project's runs
        and the honest answer to "which of my runs belong to that plan" is none.
      responses:
        '200':
          description: Runs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TestRun' }
        '404':
          # The project read gate only — see the plans list.
          $ref: '#/components/responses/NotFound'
    post:
      tags: [execution]
      summary: Create a run
      description: |
        `run:create` — every role except Viewer, **including Automation Service** (roles spec
        §A4), which is what lets a CI token open the run it is about to post results into.

        **Creating a run materialises its executions.** One `test_execution` per case in
        scope, each pinned to that case's *current* `case_version_id` at this moment — which
        is what makes the run a record of what was tested rather than of what the cases say
        today (plan §6j). A run that would materialise **nothing** is a 400 on the field,
        not an empty run, because an empty run looks finished.

        **The scope has three arms and they are UNIONED** (§99): `caseIds`, `suiteIds` —
        resolved through the suite's whole membership, filed ∪ added ∪ tag-matched — and
        `tags`, every live case carrying **any** of them. Deduped, and resolved **once**,
        here: the executions are written now, so a suite that grows tomorrow does not grow
        this run and a tag removed tomorrow does not shrink it. That is the opposite of a
        plan's scope, which is a set of references re-resolved on every read, and it is why
        the two can be described in the same words and behave differently.

        `tags` unions rather than intersects, unlike `GET /cases?tag=`. A run is a
        collection being assembled — the same reading `suite_tag_rule` takes — where a grid
        filter is a list being narrowed. Two ways now exist to say "run everything tagged
        smoke" (a suite whose tag rule is `smoke`, or this), which is accepted rather than
        denied: create-time resolution makes the two indistinguishable after the fact.

        **Otherwise the plan's expanded scope**, as before. The arms are a *substitution*
        for it and never an addition to it: a body carrying a plan and any arm means "this
        run is against that plan, and here is the subset we are doing this pass", and
        unioning them would silently add back what somebody explicitly narrowed away. The
        run still records its `planId`, so the narrowing reads as a run shorter than its
        plan rather than as a lost association.

        `configurationId` defaults to the project's default configuration — every project is
        seeded with one, so the field is optional and the column stays `NOT NULL`.

        **§6g's gating rule (§82).** On a project with `requireApprovedCaseForRun` on, a run
        whose resolved case set contains anything that is not `APPROVED` is a `409` naming the
        offending keys — the *resolved* set, so neither naming a plan nor naming a tag is a
        way round it, and the whole run rather than a trimmed one, because a checklist quietly
        shorter than the one that was asked for reports a pass rate over a denominator nobody
        chose. A holder of `case:approve` may pass `overrideApprovalGate`.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestRunInput' }
      responses:
        '201':
          description: Created — key is server-allocated (TR-n, per company)
          headers:
            Location:
              schema: { type: string }
              description: The new run's canonical URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestRun' }
        '200':
          # See POST /plans. It matters more here: a replayed run create that made a second
          # run would also materialise a second set of executions, so the same tester would
          # be shown the same checklist twice with one half of their results on each.
          description: Replayed — this Idempotency-Key already created a run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        # §6g's gating rule. The FIRST 409 on this operation: everything else wrong with a
        # create is a field error, and this one is not — every id names a live case and the
        # permission is held, it is the project's own policy that refuses.
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{projectId}/runs/{runId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/RunId' }
    get:
      tags: [execution]
      summary: Run detail with its executions
      description: |
        **There is no `PATCH` here, and adding one is paired work (audit D3).** A run's name,
        release and build are fixed at create, which is the premise `TestRun` relies on to leave
        `test_run.lock_version` unmapped: no field is written from a value a client read, so there
        is no discarded edit for a version counter to refuse.

        An edit endpoint ends that premise. Whichever slice adds one **maps the version, serves
        `lockVersion` on `TestRunDetail`, and takes an `If-Match` — in that same slice**, because
        the failure between the two is silent: two people renaming a run from forms opened minutes
        apart, and the later write wins with nothing to say it happened. `TestRun`'s header carries
        the full argument, including what the counter would cost the result writers if it were
        allowed to reach them.
      responses:
        '200':
          description: Run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestRunDetail' }
        '404':
          # Unreachable project, run in a sibling project, soft-deleted run, absent run.
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/runs/{runId}/clone:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/RunId' }
    post:
      tags: [execution]
      summary: Clone a test run
      description: |
        Plan §6v, decision round 3 #59 — **the highest-value of the three clones**: re-running
        a regression cycle against a new build is the most repeated action in the product.

        A new run over **the same cases**, with every execution untested. The plan
        reference, the configuration, the release version and the build number are copied
        and any of the last three can be overridden — a clone that could not change the
        build number would make the caller edit the run immediately afterwards.

        Nothing else comes across, and that is structural rather than a list somebody
        maintains: the server builds the same input `POST /runs` takes, and **no result, no
        evidence, no defect link and no timestamp is reachable from it.**

        Two consequences worth reading twice:

        - **The scope is the resolved case set, frozen.** `test_run` stores no scope — §99's
          three arms are resolved once into executions — so cloning a suite-scoped run does
          **not** pick up the cases added since. That is §6v's own clone-versus-template
          distinction, decided here by the schema rather than by the design.
        - **§6g's approval gate is re-evaluated, and an override is never inherited.** The
          override is a statement about a request and nothing stores it, so a clone of a run
          that was started under a documented override answers **409** unless the cases are
          approved now or `overrideApprovalGate` is sent again — on the record, by this
          caller.

        The assignee does **not** fall back to the source. A run has no assignee: the column
        is on `test_execution`, one per case, so there is nothing to copy and picking one
        would be inventing a fact. Omitted means an unassigned checklist; supplied assigns
        the whole one, exactly as on a create.

        **Requires `run:create`**, which Automation Service holds — a CI credential may
        already open a run, and a clone of a run is a run. Recording verdicts still costs
        `run:execute` (§124); cloning records nothing.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestRunCloneInput' }
      responses:
        '201':
          description: The new run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestRun' }
        '200':
          description: A replay — this `Idempotency-Key` already created a run, and no second checklist was materialised.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            §6g's approval gate refuses the cases this run would cover. Not a `400`: every id
            is live and the permission is held — it is the project's own policy that refuses.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /projects/{projectId}/runs/{runId}/status:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/RunId' }
    put:
      tags: [execution]
      operationId: setRunStatus
      summary: Complete, abort or reopen a run
      description: |
        Requires `run:close`. ~~which is **Lead and up** — a Test Engineer holds `run:execute` and
        `result:submit` and does *not* hold this one (roles spec §A4: a contributor is never blocked
        from producing, only from unmaking)~~ → **superseded 2026-08-15 (`V52`, §210): a Test
        Engineer holds it.** Closing a cycle you ran is neither an approval nor project
        configuration, which is the whole of the tier now. The key stays **separate** from
        `run:execute`, so ending a run is still its own gate and its own audit row; what changed is
        who may do it.

        **A run starts by itself and ends deliberately.** `NOT_STARTED → IN_PROGRESS` happens when
        the first result is recorded, with no permission of its own. A run never completes itself
        when the last result lands, because "we are done" is a judgement somebody makes — ~~and
        auto-completion would let a Test Engineer close a run by finishing it, which is the boundary
        this permission draws~~ → that boundary is gone and the behaviour is not. Auto-completion
        would make the last person to record a result the person who ended the cycle, silently and
        without deciding to, which is a reason of its own and the one that survives `V52`.

        **`COMPLETED` and `ABORTED` are both "closed".** There is no fifth status: `V1`'s
        *"immutable once the run closes"* names the act, and a run that has ended refuses further
        results and evidence with `409` until it is reopened.

        Sending `NOT_STARTED` or `IN_PROGRESS` **reopens** the run, and the two spellings mean the
        same thing: the server derives the live state from whether the run ever started, so a run
        aborted before anybody touched its checklist cannot come back claiming to have run.

        Idempotent: setting the status a run already has answers `200` with the run and writes
        nothing — no timestamp re-stamped and no audit row, so a repeated click cannot bury the
        change that actually happened.

        `409` is the refusal of a transition this lifecycle does not have: completing a run in which
        nothing has been recorded (abort it instead), or moving straight from one ended state to the
        other (reopen it first).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunStatusInput' }
      responses:
        '200':
          description: The run, as the list renders it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{projectId}/runs/{runId}/executions/{executionId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/RunId' }
      - name: executionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [execution]
      summary: One execution, with the pinned case version's steps
      description: |
        **The steps, preconditions and postconditions are the ones the pinned case version
        carried, not the ones the case carries now** (plan §6j). `test_execution.case_version_id`
        is the pin, and this response resolves through it — so editing a case never rewrites
        what a tester was told to do in a run that already happened.

        `caseTitle` is pinned for the same reason and `caseKey` is not pinned because it cannot
        move: a display key is immutable (§6t).
      responses:
        '200':
          description: Execution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestExecution' }
        '404':
          # Unreachable project, a run or execution in a sibling project, an execution that
          # belongs to a different run than the path names, and an absent one.
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [execution]
      summary: Record a result
      description: |
        Optimistic locking via If-Match — several testers may work one run at once.

        **Three permissions, not one.** Every call here needs `run:execute` — *"execute test
        cases in a run"*, which V3 grants to Test Engineer and up and **withholds from Automation
        Service alone**. On top of that, recording a verdict where none was recorded needs
        `result:submit`, and changing a verdict that is already there needs `result:amend` — a
        **separate key**, so overwriting a recorded outcome stays a distinct and separately
        auditable act. ~~which is **Lead-only** (roles spec §A4 — `result:amend` is listed beside
        `suite:delete` as destructive rather than creative)~~ → **superseded 2026-08-15 (`V52`):
        Test Engineer holds it.** The tier line is approvals and project configuration, and
        amending a result you recorded is neither. Who may amend changed; that it is its own key
        did not.

        **What `run:execute` buys, since it looks redundant beside `result:submit`:** every other
        execution permission separates a lead from an engineer, and this one separates a *person*
        from a *credential*. Automation Service holds `result:submit` because ingesting a CI
        report is its entire purpose; without this gate the same credential could also PATCH
        executions here one at a time, with an `If-Match` and evidence, indistinguishable in the
        audit trail from a tester working a checklist. A CI token posts to `POST /ingestions` and
        nowhere else. Wired 2026-08-07 (plan §8 #53) — the key was seeded in M0 and had no
        consumer until then.

        The three 403s carry different sentences: telling a tester who records results every day
        that they may not record results sends them to ask for a permission they already hold,
        and telling a CI job it lacks permission hides that the thing it wants is supported at a
        different address.

        A `statusId` naming a status outside this project's vocabulary is a **400 on the field**,
        not a 404 — the target resolved and the picker is where the message belongs.

        **Recording the first result starts the run** — `NOT_STARTED → IN_PROGRESS`, stamping
        `startedAt` from the same instant as the result. No extra permission: the caller has
        already passed the gates above, and a second one here would mean a tester records a
        result the run then declines to acknowledge.

        **`409` now has two causes.** A stale `If-Match` is one. The other is a run that has
        ended: `V1`'s "immutable once the run closes", which freezes the verdict and its evidence
        together. Reopening the run is the way forward and needs `run:close`.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecutionResultInput' }
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestExecution' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{projectId}/runs/{runId}/executions/{executionId}/assignee:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/RunId' }
      - { $ref: '#/components/parameters/ExecutionId' }
    put:
      tags: [execution]
      summary: Give one row of the checklist to somebody, or take it back
      description: |
        `test_execution.assignee_id` has been served on every execution read since M2 and had
        **exactly one writer** until this operation: `POST /runs`'s whole-checklist
        `assigneeId`, which assigns two hundred rows to one person or leaves all of them
        unassigned. So in the shipped product an execution's assignee could be set once, for
        every case at once, and never afterwards.

        `PUT`, not `PATCH`, and the same reasoning the two status endpoints use: the body is
        the state the caller wants rather than the move they want, so sending it twice lands
        in the same place. **`null` unassigns** — the field is required and nullable, so
        "nobody" is a thing this operation can say, which is what makes it a toggle rather
        than a one-way door.

        **The permission is `run:execute`, not `run:create` and not `result:submit`.** Handing
        a case to a tester is part of working a run by hand, and `run:execute` is the one key
        in the catalogue that separates a *person* from a *credential* (see the result PATCH):
        `Automation Service` holds `run:create` and `result:submit` and not this, so a leaked
        CI token cannot reorganise a team's workload. It is deliberately **not** its own new
        key — the catalogue has taken no new permission since `V3`, and a key seeded to nobody
        is a 403 no administrator can grant their way out of.

        **`assigneeId` must be an ACTIVE member of this company**, which is the predicate
        `POST /runs` already applies to the same column — read from the same place rather than
        re-spelled, so the two writers of one column cannot disagree about who may hold it.
        Note that it is *company* membership and not the narrower "holds a grant on this
        project" that `GET /members` answers: a picker built from that list can therefore only
        offer people this operation accepts, never the reverse.

        **No `If-Match`.** The result PATCH takes one because two testers recording verdicts on
        one row is the ordinary case and a lost verdict is unrecoverable. An assignment is a
        scheduling fact whose last writer is the one that meant it, and requiring the header
        here would fail a coordinator's reassignment because somebody recorded a result in
        between — a refusal about a field neither call touched. The write still bumps
        `lockVersion`, so a tester holding a stale read gets the ordinary 409 and reloads.

        **A closed run refuses with 409**, the same freeze the verdict and its evidence are
        under (`V1`: *"immutable once the run closes"*). A finished checklist has no work left
        to hand out, and reopening the run is the way forward.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecutionAssigneeInput' }
      responses:
        '200':
          description: Assigned — the whole execution, as the read serves it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestExecution' }
        '400':
          # `assigneeId` naming somebody who is not an active member of this company. A field
          # error rather than a 404: the execution resolved and the picker is where the
          # message belongs.
          $ref: '#/components/responses/BadRequest'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{projectId}/runs/{runId}/executions/bulk:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/RunId' }
    post:
      tags: [execution]
      operationId: bulkAssignExecutions
      summary: Hand many rows of the checklist out at once, to one person or across several
      description: |
        Preview-then-commit over a selection of executions, the shape
        `POST /projects/{projectId}/cases/bulk` established for cases (plan §6f): always returns
        what changed, what was already compliant, and what was skipped with a reason, as LISTS
        rather than counts. A blanket success toast over a partial outcome is the worse half of
        the defect, because the caller believes all 300 went through.

        **Why this exists.** `PUT …/executions/{executionId}/assignee` says it in its own
        description: an execution's assignee *"could be set once, for all two hundred rows, or not
        at all"*. Splitting a 300-case run across five testers was 300 requests.

        **`DISTRIBUTE` is the request this endpoint was actually built for.** It round-robins the
        selection across a list of people, and the mapping is a pure function of the run's own row
        order and the caller's assignee order — so the same act sent twice produces the same split,
        and the replay finds every row already in that state. **That determinism is this
        operation's idempotency, and it is why there is no `Idempotency-Key` here.** The header
        elsewhere in this API answers a *create* by returning the resource that intent already
        created; nothing is created here, so there would be nothing to answer with. The cases-bulk
        endpoint declares no such header either, for the same reason.

        **Assignment states the desired state of every named row**, exactly as the single-row `PUT`
        does — a row already assigned to somebody else is reassigned rather than left alone. A
        caller who wants to fill only the gaps selects only the unassigned rows; the run detail's
        filter makes that a click, and a server-side "only if empty" rule would make the outcome
        depend on state the preview cannot show.

        **The permission is `run:execute`**, the same key the single-row endpoint takes and for the
        same reason: it is the one key in the catalogue that separates a person from a credential,
        so a leaked CI token cannot reorganise a team's workload. No new permission is seeded — the
        catalogue has taken none since `V3`, and a key granted to nobody is a 403 no administrator
        can grant their way out of (roles spec §A6).

        **A closed run refuses with 409**, the freeze the verdict and its evidence are already
        under: a finished checklist has no work left to hand out, and reopening the run is the way
        forward.

        **What refuses the whole act and what skips one row** follows the cases-bulk rule exactly.
        A bad assignee is knowable before a single row is read, so it is a **400** with the error
        on the field. An execution id that names nothing in this run is a property of that row, so
        it comes back in `skipped` and the other 299 proceed: a selection is a filter's output and
        may have gone stale, and refusing everything over one row is worse than the problem.

        **This operation writes one `audit_event` row per target, all sharing one
        `bulkOperationId`** — the first thing in the product to write that column. One row with 300
        `targetIds` would be the shape every other bulk service uses and it cannot state what
        `DISTRIBUTE` did, because one row carries one `changes` document and this act moves rows to
        several different people. `bulkOperationId` is returned so a client can join the two, and
        the audit trail groups on it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecutionBulkOperation' }
      responses:
        '200':
          description: The result, or the preview when `dryRun` is true.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionBulkResult' }
        '400':
          # An assignee who is not an active member of this company, an argument the action does
          # not take, or a selection that is empty or over the cap. Field errors, so the dialog
          # lands each message on its own control.
          $ref: '#/components/responses/BadRequest'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{projectId}/runs/{runId}/executions/{executionId}/evidence:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/RunId' }
      - { $ref: '#/components/parameters/ExecutionId' }
    post:
      tags: [execution]
      operationId: attachEvidence
      summary: Attach a screenshot or log to a result
      description: |
        Needs `evidence:attach` — held by every role but Viewer (roles spec §A5).

        **The upload proxies through the API** rather than going browser-direct to a signed URL:
        the storage port's filesystem adapter cannot issue one (plan §8 open question #28,
        resolved in §51, which stated this consequence when the option was chosen). So the
        instance's `spring.servlet.multipart.max-file-size` is a real limit, and a file over it
        is a **413** rather than a 400 — the request is refused before it reaches the handler,
        so there is no field to hang the message on.

        `stepId` attaches to one step's result instead of to the execution as a whole. The two
        are different claims: a file on the execution documents the verdict, a file on a step
        documents where it went wrong.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    The bytes. Filename and content type travel in the part's own headers, and
                    the filename is stored in a column — it never becomes part of a storage key.
                caption:
                  type: string
                  nullable: true
                  description: Optional one-line description shown beside the thumbnail.
                stepId:
                  type: string
                  format: uuid
                  nullable: true
                  description: |
                    A step of the **pinned** version that already has a recorded result. A step
                    nobody has marked has no `step_result` row to attach to, and inventing one
                    would record a verdict nobody gave — so that is a 400 on this field.
      responses:
        '201':
          description: Attached
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Evidence' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          # The run has ended, so its evidence is frozen — V1's "immutable once the run closes",
          # applied to the verdict and its proof at once (§72). Not a 403: the permission is held
          # and the payload is fine, it is the run's state that refuses.
          $ref: '#/components/responses/Conflict'
        '413':
          description: |
            The file is larger than this instance's upload limit. Refused by the servlet
            container before the handler runs.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /projects/{projectId}/runs/{runId}/executions/{executionId}/evidence/{evidenceId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/RunId' }
      - { $ref: '#/components/parameters/ExecutionId' }
      - { $ref: '#/components/parameters/EvidenceId' }
    delete:
      tags: [execution]
      operationId: deleteEvidence
      summary: Remove evidence
      description: |
        Needs `evidence:delete`, and **authorship does not narrow it**: any caller holding the key
        removes any evidence on the run, whoever attached it. It was `OWN`-qualified for Test
        Engineer until `V51` (roles spec §A5), and moved with `case:delete` — see that endpoint
        for the argument.

        One `403`, therefore: the caller does not hold `evidence:delete` here. Evidence with **no
        recorded author** is deleted like any other; under the old grant those rows were the
        hardest case, because a grant over "your own work" must not stretch to work nobody can
        attribute.

        The delete is **hard**, unlike a case's. A screenshot removed on request has to actually
        leave the disk; a soft-deleted row pointing at retained bytes is a deletion that did not
        delete, which is the wrong answer for the one thing here a customer may need removed for
        privacy reasons.
      responses:
        '204':
          description: Removed
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          # A closed run refuses EVERYBODY, the author included — checked before authorship, so the
          # answer is not "this is not yours", which would imply that being the author would help.
          $ref: '#/components/responses/Conflict'

  /projects/{projectId}/runs/{runId}/executions/{executionId}/evidence/{evidenceId}/content:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/RunId' }
      - { $ref: '#/components/parameters/ExecutionId' }
      - { $ref: '#/components/parameters/EvidenceId' }
    get:
      tags: [execution]
      operationId: downloadEvidence
      summary: The evidence bytes
      description: |
        What `Evidence.url` points at — **without this route that field would be a lie**.

        An ordinary session-authenticated API route rather than a public link, because the
        filesystem adapter cannot issue an expiring signed URL and a guessable permanent one
        would be an unauthenticated read of a customer's screenshots.

        No separate permission: anyone who may see the execution may see its evidence, and the
        catalogue has no `evidence:read`. Served `inline` with the stored content type so the SPA
        can render an image in place rather than downloading it.
      responses:
        '200':
          description: The bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404':
          # Also the answer when the row exists and its blob does not — the orphan the write
          # ordering deliberately produces instead of the reverse. See EvidenceStore.
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/runs/{runId}/executions/{executionId}/defects:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/RunId' }
      - { $ref: '#/components/parameters/ExecutionId' }
    post:
      tags: [execution]
      operationId: linkDefect
      summary: Link this result to a defect
      description: |
        Needs `defect:create` — seeded by `V3` in M0 and, until `V62`, consumed by nothing.

        **This product is not a defect tracker; it links out.** The body is therefore a key and a
        URL and nothing that has to be kept in step with whatever holds them. There is no
        `provider` field: pre-M4 there is no `IssueTracker` port to establish one against, so a
        caller naming `JIRA` would be an unverified claim recorded as a fact — which is exactly
        what `V62` removed from the column's `DEFAULT`. Every row this endpoint writes reports
        `provider: EXTERNAL`, meaning *a link a person made*. There is no `statusCache` field for
        the same reason pointed the other way: it is a tracker's answer, and nobody has asked one.

        **Two success codes.** `201` when a link was written, `200` when this exact defect was
        already linked to this result — the same shape `POST …/cases/{caseId}/external-links`
        answers, and enforced by a unique index rather than only by the lookup, so two concurrent
        retries of one intent cannot both write. A client that treats the two codes alike is
        correct; one that counts creates is not misled.

        **No `Location` header on the `201`** — there is no `GET` here, because a result's defect
        links are already served on the result as `TestExecution.defects`. A header naming a route
        that answers `404` is §119's warning, so the body is the whole answer.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DefectLinkInput' }
      responses:
        '200':
          description: This defect was already linked here; the stored link is returned unchanged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DefectLink' }
        '201':
          description: Linked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DefectLink' }
        '400':
          # `url` is the field that matters here: the three screens that render a defect link put
          # this value in an anchor's `href`, so anything but http/https is refused at the write
          # rather than escaped in three renderers.
          $ref: '#/components/responses/BadRequest'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          # A closed run refuses this exactly as it refuses evidence: a link is part of the record
          # of what happened, and a run that has ended does not acquire new claims about it.
          $ref: '#/components/responses/Conflict'

  /projects/{projectId}/runs/{runId}/executions/{executionId}/defects/{linkId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/RunId' }
      - { $ref: '#/components/parameters/ExecutionId' }
      - name: linkId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [execution]
      operationId: unlinkDefect
      summary: Remove a defect link
      description: |
        **Charged `defect:create`, the key that made the link** — there is no `defect:delete`. The
        catalogue has seeded no new permission since `V3`, and one granted to nobody is a `403` no
        administrator can grant their way out of; the alternative was a create with no correction
        path, which leaves a mistyped key rendering as a broken link on three screens forever.

        **Authorship does not narrow it**, and no qualifier is invented here: nothing in the
        catalogue has carried one since `V51` (roles spec §A5). A link holds no content anybody
        authored and re-linking is one request, so this is narrower than a delete usually is.

        Nothing in the tracker is touched. This removes TCMS's record that the two are related.
      responses:
        '204':
          description: Unlinked
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ------------------------------------------------------- documentation ----
  /projects/{projectId}/doc-pages:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [documentation]
      summary: Documentation page tree
      responses:
        '200':
          description: Pages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocPageSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [documentation]
      summary: Create a documentation page
      description: |
        `key` is server-allocated from the company's counter (`DOC-n`, sequential per **company**,
        §6t) and `path` is derived from it, never from the title — a retitled page must not move.
        Requires `doc:edit`.

        `status` is always `DRAFT` and is not an input, for the reason a created case's status is
        not: a state an ordinary create could set is an approval its author granted themselves
        (§6g). Publishing is `PUT .../status` and a different permission.

        Blocks may be sent with the page or left for a later `PATCH`. **Block ids are
        server-generated here and never derived from the text** — see `DocBlockInput`.

        ~~No `Idempotency-Key`, for the suite endpoint's reason.~~ → **superseded (§136, `V42`): the
        header is accepted here, and it matters more here than anywhere else it is offered.** A page
        is a *link target* — `doc_link` points at `(pageId, blockId)`, and a `doc_block` is this
        product's whole model of a requirement (ERD resolved question #18) — so a duplicate page
        splits traceability across two sets of block ids, and deleting the loser destroys its links
        rather than merging them. A replay answers **200** with the page the original intent created.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocPageInput' }
      responses:
        '201':
          description: Created — key is server-allocated (DOC-n, per company)
          headers:
            Location:
              description: The created page's own URL.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocPage' }
        '200':
          description: |
            A replay — this `Idempotency-Key` already created a page, which is returned with its
            blocks. No `Location`: this request created nothing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/doc-pages/search:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [documentation]
      summary: Search the documentation space
      description: |
        Full text over `doc_page.search_vector` — the page title (weighted `A`) and every string in
        every one of its blocks (weighted `B`), maintained by `V2`'s two triggers. **This is the
        product's first and only reader of a search vector.** Three other tables carry one and
        nothing queries them; the case list's `q` is a substring match over title and description and
        deliberately stays one.

        `q` is parsed by `websearch_to_tsquery`, so a reader gets quoted `"phrase match"`, `or`, and
        `-excluded` for nothing. **Matching is by lexeme, not by substring**, and both halves of that
        are worth knowing: the stemmer runs on the query as well as the document, so `refund` finds
        "refunds" and "refunded" *and* `refundable` finds all three — while a **prefix** matches
        nothing at all, so `refun` answers `[]`. That is the right trade for prose searched by whole
        words on submit and the wrong one for a type-ahead firing on every keystroke, which is why
        this endpoint exists here and the case list's `q` is still a substring match.

        Ranked by `ts_rank_cd` — so a title match outranks one buried in the ninth paragraph, which
        is the whole reason `V2` stored the weights — then by most recently updated. **The rank is
        not on the wire**: the order is the answer, and a number whose scale is a Postgres internal
        is not something a client can do anything with.

        Every live page is searched, `ARCHIVED` included, for the reason the page tree returns them
        too: a search that hid them would make an archived page unfindable from the only screen that
        can un-archive it.

        **One known consequence of the corpus, inherited rather than introduced.** `V2` builds the
        vector with `jsonb_to_tsvector(…, '["string"]')`, which extracts *every* string in a block's
        JSON — so a block's `blockType` is in there beside its prose, and searching `table` or
        `image` matches every page containing one. Narrowing the corpus is a trigger change and a
        migration, and it was deliberately not taken by the slice that only reads the vector; the
        snippet makes the behaviour visible rather than mysterious, which is the argument for
        leaving the two corpora identical in the meantime.

        Capped at 50 hits and there is no paging — a reader who needs page 3 of a documentation
        search needs different words. Costs the **project read gate**, the same one the page tree
        costs, and not `doc:read`; `DocPageService`'s header carries that argument and its one
        `V16` exception.
      parameters:
        - name: q
          in: query
          description: |
            The search text. Absent, blank, or parsing to an empty query — punctuation only, or
            nothing but stop words — answers `[]` rather than 400. There is one behaviour for
            "nothing to look for" instead of a validation surface in front of it, and a reader
            clearing the box is the ordinary way to reach it.
          schema: { type: string }
      responses:
        '200':
          description: Hits, best first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocPageSearchHit' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/doc-pages/{pageId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: pageId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [documentation]
      summary: Page with blocks and per-block coverage
      description: |
        Each block carries the cases linked to it — plan §6i's inline traceability marker.

        ~~`coverage` is **absent** until something can create a `doc_link`. Nothing can yet~~ →
        **superseded**: `POST .../blocks/{blockId}/links` creates them, and each block now serves
        `links`. `coverage` is still absent, for a different reason that is stated on the field
        itself: this module can see *which* cases claim a statement but not how they are **doing**.
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [documentation]
      summary: Retitle a page and replace its blocks
      description: |
        Requires `doc:edit`. Send the page's `lockVersion` as `If-Match`; the SPA always does, so a
        concurrent edit is a `409` rather than a silent overwrite (§6j).

        **`blocks` is the whole page, in order — and identity survives it.** A block sent with its
        `id` keeps that id however much its text changed, so a fixed typo does not break the links
        pointing at it (§6i/§6m). A block sent without an `id` is new. A block *omitted* is
        deleted, and a deleted block that something links to is refused with `409` rather than
        cascaded away — the link is somebody's traceability record, not this request's business.

        An `id` that is not a block of this page is a `400`, never a silent create: a client that
        believes it edited a block must not have created a different one.

        `status` is not editable here — see `PUT .../status`.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocPageInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Either the `If-Match` did not match the stored `lockVersion`, or the edit removes a
            block that a case still links to. `detail` says which, and the second names how many.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [documentation]
      summary: Delete a page
      description: |
        Soft-deletes a page and its blocks. Requires `doc:edit` — deleting is not split off into a
        permission of its own the way `suite:delete` is, because deleting a page cannot reach other
        people's *cases*; the destructive-collection-action reasoning that split those two does not
        apply here. (Since §98 a suite has no subtree either — what `suite:delete` still guards is
        the filed cases standing behind it.)

        **The page must have no child pages**, which answer `409` naming the count. A cascade would
        remove pages the request never mentioned.

        Refused with `409` when a case links to one of its blocks, for the reason the `PATCH` is:
        traceability is not collateral.
      responses:
        '204':
          description: Deleted. No body.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The page has child pages, or a case links to one of its blocks. `detail` names which
            and how many.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /projects/{projectId}/doc-pages/{pageId}/blocks/{blockId}/links:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: pageId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: blockId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [documentation]
      summary: Link a case or suite to a block
      description: |
        Records that a test case (or a whole suite) verifies this statement. Requires `doc:edit` —
        the link is a property of the documentation, and its holder is everyone who writes docs.

        **This is the first writer `doc_link` has ever had.** Two read paths had been specified and
        unserved since the mock era waiting for it: `DocBlock.links`, served the same day, and
        `TestCase.relatedDocuments` — which was **not**, and stayed empty for another seventy-four
        sections because it is in a module that may not read this table. §167 served it through a
        read model (`case_doc_link`), and this endpoint is now a **producer** of
        `documentation.links_changed` so that the case end updates without waiting for the hourly
        recompute. A third path, `DocBlock.coverage`, stays absent — see its own description for why
        building this did not unblock it.

        Two protections that already existed become reachable on the same day: the page `PATCH` and
        the page `DELETE` both answer `409` rather than cascading a link away, because a link is
        somebody's traceability record and not the request's business.

        **Linking the same source to the same block twice writes nothing and answers `200`** with
        the existing link, rather than a second row or a conflict. Re-asserting a fact that is
        already recorded is not an error, and a duplicate would double every count drawn off this
        table.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BlockLinkInput' }
      responses:
        '200':
          description: The link already existed. Nothing was written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlockLink' }
        '201':
          description: Linked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlockLink' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: |
            The project, the page, the block, or the source is not visible here. One response for
            all four (§6t) — the source check is against **this project**, not merely this company,
            so a sibling project's case lands here rather than being accepted.

            No body, like every other 404 here — see `NotFound`. Which of the four failed is
            precisely what must not be published.

  /projects/{projectId}/doc-pages/{pageId}/links/{linkId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: pageId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: linkId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [documentation]
      summary: Correct what a link claims
      description: |
        Requires `doc:edit` — the same key as the create and the delete. Correcting a claim is not a
        lesser act than making one; if anything it is the more consequential, because the link is
        already being counted.

        **Only `relationship` may be changed, and that is the whole design.** The target coordinates
        are immutable: a link that silently changes which block it points at keeps every count over
        `doc_link` agreeing with itself while pointing somewhere new, which is worse than a link that
        is withdrawn and remade. The relationship is not a coordinate — it is the *claim*, it is the
        field a person realistically gets wrong, and getting it wrong is a false coverage number
        rather than a cosmetic error, because the coverage matrix counts `VERIFIES` and ignores the
        other two.

        Until §174 the only way to fix one was to withdraw the link and make another, which silently
        rewrote `created_by` and `created_at` to whoever noticed the mistake. `V48` adds
        `updated_at` / `updated_by` so the correction is recorded rather than disguised as a
        creation.

        **A `PATCH` rather than a second `POST`.** The create is keyed on (block, source) and answers
        `200` with the existing row when that pair is already linked, so re-posting with a different
        relationship would have to either overwrite silently — making a create an update, on the
        endpoint whose documented contract is that a duplicate "writes nothing" — or keep ignoring
        it, which is what it does and is why this endpoint exists.

        **`200` whether the value moved or already said this.** Re-stating a recorded fact is not an
        error here for the same reason it is not on the `POST`; what a no-op skips is the audit row
        and the `documentation.links_changed` notice, because a correction that corrected nothing
        must not be reported as one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkRelabelInput' }
      responses:
        '200':
          description: The link, with the relationship it now claims.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlockLink' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: |
            The project, the page, the link, or the link's source is not visible here. One bodiless
            response for all four (§6t) — the source is in that list because this endpoint returns
            the row, and a row whose case can no longer be named has nothing to return.
    delete:
      tags: [documentation]
      summary: Remove a link from a block
      description: |
        Requires `doc:edit`. **A hard delete**, unlike a page's: the link is an assertion somebody
        made and has now withdrawn, and a tombstoned assertion still reads as one to every count
        drawn off this table. `ReviewAssignment` made the same call for the same reason, against
        `ReviewComment`'s opposite one.

        Deleting a link that does not exist is a `404`, not an idempotent `204`: unlike the `POST`,
        there is no fact here that is already true — the caller named a row, and naming one that is
        not there is a mistake worth reporting.
      responses:
        '204':
          description: Removed. No body.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/plans/{planId}/document:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: planId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [documentation]
      summary: The plan's business-requirements page
      description: |
        The document a plan's requirements are written in — **a page somebody already wrote**, which
        the plan adopts. The plan row holds the *executable* half: the milestone, the entry and exit
        criteria, and the suites, cases, tags and sections in scope; `scopeText` and
        `outOfScopeText` hold the prose that used to be two of this document's headings.

        **It is an ordinary `DocPage`**, living in the project's documentation space and reachable at
        `/doc-pages/{pageId}` like any other, with `subjectType: TEST_PLAN` naming the plan it is
        about. That is why editing it is `PATCH /doc-pages/{pageId}` and costs `doc:edit`, not
        `plan:edit`: it is documentation, it versions as documentation, and it is found by everyone
        who searches the documentation. This endpoint only *resolves* the plan to it.

        `404` when the plan has no document yet — a plan is created long before anybody links one,
        so this is the ordinary first answer and not an error state. `PUT` links one.

        > **Retired 2026-08-05 (§97):** `POST` — *start the plan's document from the five-section
        > template* — is gone, and with it `PlanDocumentTemplate`. Four of that template's five
        > headings now have real homes (business requirements is *this* linked page, test artefacts
        > is the `artifact` register, scope and out of scope are `scopeText` / `outOfScopeText` on
        > the plan, and the test-case outline is the plan's own sectioned scope items), which leaves
        > the template seeding a document whose every section is authored somewhere else — a second
        > place to write each one, and §6n's "graveyard of outdated copies" written by the product
        > itself. What replaces it is `PUT`: a plan adopts the specification somebody wrote before
        > the release was scheduled, keeping its history, its `doc_link`s and its place in the
        > search index. **Existing documents are untouched** — retiring the template changes what a
        > new plan gets, never what an old one holds.
      responses:
        '200':
          description: The document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            The project or plan is not visible, or the plan has no document yet. No body — see
            `NotFound`; the three states are one answer and are not told apart.
    put:
      tags: [documentation]
      summary: Link an existing page as the plan's document
      description: |
        Adopts a page that already exists in the project's documentation space. Since the template
        `POST` was retired (§97) this is **the only way a plan gets a document**. Requires
        `doc:edit`, the same key as editing the page, because it is the same act seen from the other
        end: it writes the page's `subjectType`/`subjectId` and nothing on the plan.

        **A plan's document is often written before the plan row exists** — a specification drafted
        in the documentation section, then adopted once the release it describes is scheduled. Until
        this operation existed the only way there was to copy the prose into a fresh template page,
        which loses the page's history, its `doc_link`s, and its place in the search index.

        Three refusals, and they are three different things:

        - The page is **already another plan's document** → `409`, `detail` naming that plan. One
          page cannot be two plans' document; the partial unique index says so and this says why.
        - **This plan already has one** → `409`. Relinking is `DELETE` then `PUT`, deliberately two
          steps: a silent reassignment is how a plan comes to document a different release than its
          reader believes, with nothing in either page's history recording the swap.
        - The page belongs to a **sibling project** → `404`, never `409` or `400`. RLS scopes to the
          *company*, so the row is reachable and only an explicit project predicate refuses it —
          answering anything else tells a caller that a page they cannot see exists elsewhere.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanDocumentLinkInput' }
      responses:
        '200':
          description: The linked page, as `GET` would now answer it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: The project, plan or page is not visible. No body — see `NotFound`.
        '409':
          description: |
            The page is already another plan's document, or this plan already has one. `detail`
            names which, and the two sentences are different.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [documentation]
      summary: Unlink the plan's document
      description: |
        Clears the page's `subjectType`/`subjectId` and **keeps the page**. This unlinks
        documentation; it does not delete it — the page stays in the project's documentation space,
        keeps its blocks, its history and its links, and can be linked to another plan or left as an
        ordinary page. Deleting it is `DELETE /doc-pages/{pageId}`, a different act with a different
        blast radius.

        Requires `doc:edit`. Idempotent in the direction that matters: a plan with no document
        answers `404`, the same answer `GET` gives, rather than a `204` that would tell a caller
        their unlink succeeded when there was nothing to unlink.
      responses:
        '204': { description: Unlinked. The page still exists. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: |
            The project or plan is not visible, or the plan has no document. No body — see
            `NotFound`.

  /projects/{projectId}/doc-pages/{pageId}/status:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: pageId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [documentation]
      summary: Publish, unpublish or archive a page
      description: |
        Requires `doc:publish`. ~~which Test Engineer does **not** hold while `doc:edit` is held by
        everyone who writes (roles spec §A2)~~ → **superseded 2026-08-15 (`V52`, §210): a Test
        Engineer holds both.** Publishing a page is not an approval, and the tier is approvals and
        project configuration.

        **A separate endpoint rather than a `status` field on the `PATCH`, because it is a separate
        permission.** One endpoint whose gate depends on which fields the body happened to carry is
        one whose `403` no client can predict, and whose disabled-state the SPA cannot render — the
        two things §31 exists to prevent.

        Idempotent: setting the status a page already has answers `200`, not a conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocPageStatusInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/doc-pages/{pageId}/attachments:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: pageId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [documentation]
      operationId: attachDocPageFile
      summary: Attach a file to a documentation page
      description: |
        Decision round 3's #49, phase 2 — `attachment.owner_type = 'DOC_PAGE'`, declared by
        `V1` and writerless for the whole life of the product until this endpoint. A
        specification is not only prose: it is the wireframe, the signed-off mock-up and the
        data sheet the paragraphs describe, and until this the product could hold the
        paragraph and not the picture it was written about.

        **Requires `doc:edit`, not `doc:publish`.** This module's defining split is that
        `doc:edit` writes content and `doc:publish` moves the publication state ~~, with Test
        Engineer holding the first and not the second (roles spec §A2)~~ → **both are a
        contributor's since `V52` (§210)**, so the split is no longer a tier and is still a split:
        two keys, two audit rows, and a company that wants them held by different people has the
        catalogue to do it. An attachment is **content** — somebody who may rewrite every paragraph
        may attach the diagram those paragraphs describe — and it is the *content* key it costs,
        which is now an argument about what the act is rather than about who may perform it.

        The delete below costs the same key with **no author arm**, which is the same call
        `case:edit` makes one module over and for the same reason: `doc:edit` already lets its
        holder delete a lead's paragraph, so refusing them the image beside it would make the
        attachment stricter than the text referencing it.

        **No new permission was invented.** The catalogue has no `attachment:*` key and one
        seeded to nobody is a `403` no administrator can grant their way out of.

        **No `If-Match` and no version row**, unlike the page's own `PATCH`. Blocks are
        reconciled by id so a stale client carries stale ids; an attachment is addressed by
        its own id and never reconciled, so two people attaching two files are not in
        conflict — they are both attaching. And `doc_page_version` snapshots the blocks, so a
        version row here would be a history entry whose diff says nothing changed.

        **An archived page still accepts files.** `ARCHIVED` takes a page out of circulation
        while keeping its links resolvable; making it a retention control is a different
        decision, and the page's own `PATCH` has no status arm either.

        **The upload proxies through the API** rather than going browser-direct to a signed
        URL: the storage port's filesystem adapter cannot issue one (plan §8 #28). So the
        instance's `spring.servlet.multipart.max-file-size` is a real limit and a file over it
        is a **413** rather than a `400` — the request is refused before it reaches the
        handler, so there is no field to hang a message on.

        **There is no `GET` here.** The list is `DocPage.attachments` on the page detail,
        which is the only screen that shows it; a second read path would be a second answer to
        "what is attached to this page", free to disagree the moment one grew a filter.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    The bytes. Filename and content type travel in the part's own headers, and
                    the filename is stored in a column — it never becomes part of a storage key.
      responses:
        '201':
          description: Attached
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: |
            The file is larger than this instance's upload limit. Refused by the servlet
            container before the handler runs.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /projects/{projectId}/doc-pages/{pageId}/attachments/{attachmentId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: pageId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - { $ref: '#/components/parameters/AttachmentId' }
    delete:
      tags: [documentation]
      operationId: deleteDocPageFile
      summary: Remove a file from a documentation page
      description: |
        Costs `doc:edit` — the same key the upload does, with **no author arm**. See the
        `POST` above for why, and note the consequence stated plainly: whoever may edit the
        page may remove any of its files, including one somebody else attached.

        **A hard delete, and the bytes go with the row** — unlike the page itself, which is
        soft-deleted. A file removed on request has to actually leave the disk: a soft-deleted
        row pointing at retained bytes is a deletion that did not delete, which is the wrong
        answer for the one thing here a customer may need removed for privacy rather than
        tidiness. The row is removed first and the bytes second, so a failure between them
        leaves an unreferenced blob an operator can sweep rather than a thumbnail that renders
        and never opens.

        The audit row carries the filename, and it is the **only** surviving statement that
        the file existed once both the row and the bytes are gone.

        `404` when `attachmentId` names nothing on **this** page — the two-segment gate, so
        `/doc-pages/{a}/attachments/{belongs-to-b}` cannot reach another page's file.

        `409` when an `image` block on the page names this file. The block would otherwise
        keep a `attachmentId` pointing at nothing and render as a hole — the same refusal, and
        the same reason, as removing a block a case links to: the reference is somebody's
        authored content and not collateral of a tidy-up. Remove the block first.
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: An `image` block on this page references the file.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /projects/{projectId}/doc-pages/{pageId}/attachments/{attachmentId}/content:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: pageId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - { $ref: '#/components/parameters/AttachmentId' }
    get:
      tags: [documentation]
      operationId: downloadDocPageFile
      summary: The file's bytes
      description: |
        What `Attachment.url` points at.

        **No permission beyond the page read gate.** Anyone who may read the page may read
        what is attached to it, and the catalogue has no `attachment:read` — inventing one
        would be a permission no role is granted, which is a `403` nobody can fix. It is also
        the only rule that does not make the SPA reason about two permissions per thumbnail.

        Served `inline` with the stored content type, so a diagram renders in place beside the
        paragraphs it belongs to. The filename reaches a response **header**, where a carriage
        return is header injection rather than an odd name; it is neutralised on the way out.

        `404` also when the row exists and its blob does not — the orphan the write ordering
        deliberately produces rather than the reverse. An empty `200` would hand the browser
        a corrupt file.
      responses:
        '200':
          description: The bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/artifacts:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      tags: [artifacts]
      summary: Artifact register
      parameters:
        - name: scope
          in: query
          description: |
            Omitted means `PROJECT` — the project's own register, which is the whole register on a
            project that runs no cycles.
          schema: { type: string, enum: [PROJECT, PLAN], default: PROJECT }
        - name: planId
          in: query
          description: |
            Required when `scope=PLAN`, and a `400` without it: a plan register with no plan names
            no rows, and answering the project's register instead would silently show one thing
            under a heading promising another.

            When present, project-scope artifacts are returned **as well**, flagged `inherited`
            (plan §6n) — a tester opening a cycle should find the environment guide without hunting
            for it. Rejected when `scope=PROJECT`, because nothing about a project's own register
            depends on a plan.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Artifacts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Artifact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [artifacts]
      summary: Register an artifact
      description: |
        Registers a **reference** — a documentation page or an external URL — at project or plan
        scope.

        ~~`FILE` and `GENERATED_REPORT` are declared on `Artifact` because the register renders
        them, and are deliberately **not** accepted here.~~ → **`FILE` is registrable since
        2026-08-07 and `GENERATED_REPORT` since 2026-08-16; the kinds this operation refuses are
        down to one.**

        `FILE` goes to `POST /projects/{projectId}/artifacts/files`, because the bytes have to
        travel with the registration — a `FILE` row created here and filled in later is a register
        entry claiming a document it cannot produce. Sending `kind: FILE` to *this* operation is a
        `400` naming that endpoint, and the advice is safe to give because the caller holds the
        same permission for it.

        **`GENERATED_REPORT` is accepted here (audit C6), and it is the one kind whose payload
        this product generated itself.** ~~A pinned report still needs a writer: nothing in
        `reporting` produces one.~~ → the module has produced them since §87 and `V1`'s
        `artifact.report_artifact_id` waited the whole time; `reportJobId` is what fills it. What
        is pinned is the **rendered artifact**, which is immutable by `ReportArtifact`'s own rule,
        so a register entry made today answers with the same bytes a year from now — which is the
        entire reason a cycle's numbers are worth registering at all. Regenerating the report
        produces a different artifact and does not touch this row.

        Steering people toward references is the design, not a limitation of this slice — plan §6n
        calls the register's failure mode "a graveyard of outdated copies", and a strategy document
        *authored* as a doc page and *registered* here cannot go stale the way an uploaded copy of
        it does.

        `status` is absent from the input on purpose (plan §6g): `SUPERSEDED` is the outcome of
        superseding something, and a create that could set it would be an author approving their
        own record. **`supersedes` is how that outcome is produced** — see the field.

        **Registering a replacement is one request, not two.** `supersedes` names the artifact this
        one takes over from; the server flips that row to `SUPERSEDED` and sets its
        `supersededById` in the same transaction, so there is no window in which the newer document
        exists and the register still calls the older one current. A `PUT` on the old row would
        have left that window open and would have needed its own permission check — where this
        needs none beyond the create's, because the replacement must sit at the same scope and in
        the same plan as the row it replaces.

        **`Idempotency-Key` since B4** (`V59`), like every other create in this API: a retry answers
        `200` with the artifact the first request registered, and no second row. Without it a
        timeout on a register was a twin nobody could tell from a deliberate second entry.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtifactInput' }
      responses:
        '200':
          description: |
            Already registered — the artifact a previous request carrying this `Idempotency-Key`
            created, re-rendered from the live row. **No `Location`**: nothing was created by this
            request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artifact' }
        '201':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artifact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/artifacts/files:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    post:
      tags: [artifacts]
      operationId: registerArtifactFile
      summary: Register an uploaded file as an artifact
      description: |
        Decision round 3's #49 — `ArtifactKind.FILE` and `attachment.owner_type = 'ARTIFACT'`, both
        declared by `V1` and writerless for the life of the product. The blocker was the storage
        port (open question #28), resolved in §67 and finished in §125; the "not registrable yet"
        note outlived it by two milestones.

        **The file arrives with the registration and cannot arrive after it.** There is no
        "create the artifact, then attach the bytes" — a `FILE` row with no file is a register
        entry that says a document is held and cannot produce it, which is the register's whole
        claim, false, in the module where plan §6n makes the audit trail the point. One request
        removes that state rather than making it a window somebody has to close.

        **There is no re-upload and no detach, and no `PUT` here.** Replacing the document is
        *superseding* it (plan §6n) — a second artifact naming the first — so the bytes are fixed
        at registration. An artifact that swapped its bytes would keep the author, the timestamp
        and the audit trail of the file it replaced.

        That advice named an act the product could not perform for two milestones. `supersedes` on
        `ArtifactFileInput` is it, and the replaced artifact does not have to be an upload: a
        Confluence link superseded by a signed PDF is the register's own steering, one direction
        at a time.

        **Requires `artifact:edit`, scope-qualified exactly as the reference create is.** A Test
        Engineer may upload a cycle's sign-off and may not upload the project's test strategy, for
        the same reason they may not *link* one: a project-scope artifact is inherited read-only by
        every plan. A `PROJECT` scope from that caller is a `403` with `errors.scope`; the same
        caller with `PLAN` gets a `201`. No stricter key was invented for uploads — the roles spec
        has no such rule, and one seeded to nobody is a `403` no administrator can grant their way
        out of.

        **A separate path rather than a multipart variant of `POST /artifacts`.** Adding a second
        media type to that operation means narrowing it to `application/json`, which turns every
        client posting a reference without a `Content-Type` into a `415` — a behaviour change on an
        endpoint this has no business touching.

        **The upload proxies through the API**, so the instance's
        `spring.servlet.multipart.max-file-size` is a real limit and a file over it is a `413`,
        refused before the handler runs.

        **`Idempotency-Key` since B4** (`V59`), and this is the operation it matters most on. A
        retried upload used to duplicate three things — the register row, the `attachment` row and
        **the blob** — and the blob is the copy nobody sees: the register shows two entries and the
        disk holds two copies of the same signed PDF. It is also the request most likely to be
        retried, being the longest in the product and therefore the one that meets a proxy timeout
        while the server is still writing. A replay answers `200` with the artifact the first
        request registered; the bytes are re-uploaded (a stateless retry cannot avoid that) and
        simply not stored a second time.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [artifact, file]
              properties:
                artifact: { $ref: '#/components/schemas/ArtifactFileInput' }
                file:
                  type: string
                  format: binary
                  description: |
                    The bytes. Filename and content type travel in the part's own headers, and the
                    filename is stored in a column — it never becomes part of a storage key, which
                    is built from server-generated UUIDs.
      responses:
        '200':
          description: |
            Already registered — the artifact a previous request carrying this `Idempotency-Key`
            created. **No second blob was written.**
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artifact' }
        '201':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artifact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: |
            The file is larger than this instance's upload limit. Refused by the servlet container
            before the handler runs, so there is no field to hang a message on.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /projects/{projectId}/artifacts/{artifactId}/content:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: artifactId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [artifacts]
      operationId: downloadArtifactFile
      summary: A file artifact's bytes
      description: |
        What `Artifact.url` points at when `kind` is `FILE`.

        **No permission beyond the register's read gate.** Anyone who may see that the document is
        registered may open it, and the catalogue has no `attachment:read` — inventing one would be
        a permission no role is granted, which is a `403` nobody can fix.

        Addressed by the **artifact's** id, not the attachment's: the attachment is an
        implementation of the artifact rather than a thing the register has a route to, and a URL
        naming it would put a second identifier on screen for one document.

        Served as `attachment` with the uploaded filename — **the one attachment response in the
        product that is not `inline`**. A page's image and a case's screenshot render beside the
        text they illustrate; an artifact is a held document reached from a list that names it, and
        what somebody clicking it wants is the file.

        One `404` for four things (§6t): an unreachable project, an artifact of another project, an
        artifact that is a link rather than an upload, and a row whose blob is missing — the orphan
        the write ordering deliberately produces rather than the reverse. An empty `200` would hand
        the browser a corrupt file.
      responses:
        '200':
          description: The bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/artifacts/{artifactId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: artifactId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [artifacts]
      operationId: updateArtifact
      summary: Correct an artifact's title, category or description
      description: |
        **The register had no edit path at all until this operation**, despite `artifact:edit`
        being a seeded key with two writers (register, and archive/restore). So a typo in a title
        could only be answered by superseding the row — which asserts on the record that a *newer
        document* replaced it — or by deleting and re-registering, which loses the author and the
        date. Both say something untrue about the project in order to fix a spelling.

        **Three fields, and the exclusions are the interesting half.** `scope`, `planId`, `kind`
        and all three payload columns (`docPageId`, `url`, the attachment) are `updatable = false`
        on the entity, each for a reason recorded there: a row that changed scope would move
        between two different permission verdicts, and a row that swapped its payload would keep
        the `created_at`, the author and the audit trail of the document it replaced. Plan §6n's
        answer to *"this points at the wrong thing"* is to supersede it, and that is unchanged.
        `status` has its own operation for §6g's reason.

        **`title` and `category` are required; `description` is nullable and a `null` clears it.**
        This is §68's convention, unchanged and deliberately not extended: Jackson gives an absent
        field and an explicit `null` the same Java value, so no operation in this API can tell them
        apart, and inventing a distinction here would mean a third reading of a `PATCH` body in a
        product that already has two. Requiring the two `NOT NULL` columns is what makes the rule
        safe rather than merely consistent — a partial writer that omitted `title` would otherwise
        be asking to clear a column that cannot be cleared.

        Read as: *this is the editable metadata, stated whole*. The SPA's dialog renders all three
        and submits all three, which is the same shape every other write in this module has. The
        flow review's B1 — unify the case `PATCH`'s absent-clears with something safer — is a
        separate decision over the contract as a whole and is **not** pre-empted here.

        **Requires `artifact:edit`, scope-qualified against the ROW's scope** — the status
        operation's rule, word for word, and for its reason: reading a scope out of the body would
        let a Test Engineer edit the project's test strategy by not mentioning where it lives. The
        refusal is a `403` carrying `errors.scope`.

        **A write-once artifact is refused with `409`.** `artifact.write_once` marks a sign-off
        record whose stated meaning is that corrections supersede and never overwrite — the
        delete's first guard, applied to the other act it was always about. Nothing sets the column
        `true` yet; it is honoured now rather than when a writer appears, for the delete's reason.

        **A `SUPERSEDED` artifact is still editable, and that is a decision.** The status operation
        refuses it because a status is a fact about *another* row; a title is not, and a register
        that cannot correct a typo in what it says was replaced is the same dead end this operation
        exists to close. Being permanent is `write_once`'s job, and that guard is above.

        Idempotent: a body that changes nothing answers `200` with the row and writes no audit
        event — the status operation's call, for the same reason.

        No `If-Match`. `Artifact` carries a `lock_version` and the register does not put it on the
        wire, so there is nothing for a client to send back; this is the same last-write-wins the
        status operation has. Worth knowing rather than assuming: two people correcting one title
        is not the concurrent case this module has (that is two people *registering*), and adding
        the header would mean widening the read schema first.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtifactEditInput' }
      responses:
        '200':
          description: The corrected row
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artifact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [artifacts]
      summary: Remove an artifact from the register
      description: |
        Requires **`artifact:delete`**. ~~— Lead and up, and deliberately **not** held by a Test
        Engineer, who may register a plan-scope artifact (`artifact:edit`, plan-scope-qualified)
        and may not unregister one. That is the same creative-versus-destructive line the roles
        spec draws for `result:submit` against `result:amend`.~~ → **superseded 2026-08-15 (`V52`,
        §210): a Test Engineer holds it, and holds `artifact:edit` unqualified.** The
        creative-versus-destructive line is not narrowed here, it is **retired** — it was stated
        twice in six weeks and both statements are gone, along with `PLAN_SCOPE`, which this key
        was the only one in the catalogue ever to carry. Wired 2026-08-07 (plan §8 #53); the
        key had been in the catalogue since M0 with no consumer, so deletion did not exist at all.

        **This is for a mis-registration, not for an artifact that has served its purpose.** Plan
        §6n is explicit that the register's value is the audit trail: an artifact that is no longer
        current is `SUPERSEDED` (a newer one names it) or `ARCHIVED` ("no longer relevant, kept for
        the record"), and both stay readable. Deletion is the answer to *"that link should never
        have been in here"* — a wrong URL, a page pointing at another team's document — where
        keeping the row would leave the register asserting something untrue.

        There is no `deleted_at` on `artifact`, unlike cases, suites and runs. That is the schema's
        own answer and it is honoured here: **the row is gone**, not hidden.

        **For a `FILE`, the bytes go with it** — the attachment row and the blob, in that order,
        after the artifact row. This is the first kind whose unregistration destroys something
        rather than removing a pointer to a document that goes on existing elsewhere, and it is why
        `artifact:delete` being a separate key from `artifact:edit` matters more than it did when
        the key was wired: the two `409`s below now protect the last copy of a file, not only a
        record of one.

        Two refusals, both `409`, and both about the record rather than about the caller:

        - **A write-once artifact cannot be deleted.** `artifact.write_once` marks a sign-off
          record, whose whole point is that corrections supersede and never overwrite. The column
          has had no enforcement since `V1` and nothing sets it `true` yet — it is honoured now
          rather than when a writer appears, because enforcement that arrives *after* the control
          it protects is the `Company.suspend()` shape: a guarantee that is believed and does
          nothing.
        - **An artifact another one supersedes cannot be deleted.** `superseded_by_id` would be
          left dangling, and a correction pointing at a record that no longer exists is worse than
          either row alone. Reachable by ordinary use since `supersedes` shipped; before that the
          only way to produce the state was `psql`, and the guard was written anyway for the reason
          the write-once one was.

        **A `SUPERSEDED` artifact is still deletable, and that is a decision.** Being replaced is
        not what makes a record permanent — `write_once` is, and it is the column whose stated
        meaning is exactly that. Refusing both ends of the edge would make a *mis-registered* link
        immortal the moment somebody corrected it, since the replacement cannot be deleted either.
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{projectId}/artifacts/{artifactId}/status:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: artifactId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [artifacts]
      operationId: setArtifactStatus
      summary: Archive an artifact, or restore it
      description: |
        Takes an artifact out of circulation, or puts it back. `ArtifactStatus.ARCHIVED` had no
        writer from `V1` until this operation existed, which made "no longer relevant, kept for
        the record" a state the schema described and the product could not reach.

        **Requires `artifact:edit`, scope-qualified against the ROW's scope** — not the request's,
        which is the one word that differs from the create and carries the whole rule. A Test
        Engineer archives their cycle's documents and may not archive the project's test strategy,
        a document plan §6n gives every plan read-only. Reading a scope out of the body instead
        would let that restriction be defeated by an omitted field. The refusal is a `403` with
        `errors.scope`, exactly as the create's is.

        **Not `artifact:delete`.** Archiving keeps the row, keeps it readable and can be undone;
        removal is the Lead's key and this is the contributor's. Same line §208 drew between
        deprecating a suite and deleting one.

        **`SUPERSEDED` is neither a value you may send nor a state you may leave**, and both halves
        follow from what it means: it holds exactly when `supersededById` names a replacement, so
        it is a fact about another row rather than a judgement about this one. Sending it is a
        `400` naming the two values this takes; sending anything at all for a row that already has
        it is a `409` — the caller's permissions are not the problem and an administrator cannot
        help.

        Idempotent: setting the status a row already has answers `200` with the row and writes no
        audit event. Two people archiving the same artifact are agreeing, not conflicting.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtifactStatusInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artifact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ----------------------------------------------------------- reporting ----
  /projects/{projectId}/dashboard:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [reporting]
      summary: Repository status dashboard
      description: |
        Lifecycle counts crossed with derived health signals. Every count carries
        the filter that reproduces it, so tiles are links, not decoration (plan §6o).
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepositoryDashboard' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/reports:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [reporting]
      operationId: listReportDefinitions
      summary: Saved report definitions
      description: |
        **Yours, not the project's.** A definition is owned by the person who saved it
        (`report_definition.owner_id`) and v1 has no way to share one, so two people asking for the
        same project's saved reports receive different lists — the same design `GET /work-items`
        states for the team board, and the reason it is stated here too is that a list endpoint
        which quietly means "mine" is otherwise indistinguishable from one that means "everyone's"
        on a project where only one person has ever saved anything.

        `report_definition.shared_with_team_id` is `V1`'s answer to sharing and is **deliberately
        unimplemented**: it is the only part of this surface that would want a permission key the
        catalogue does not have, and a key `V3` seeds to nobody is a 403 no administrator can grant
        their way out of.

        Needs `report:view` — see `POST` below for why saving costs the *view* key and not
        `report:export`.
      responses:
        '200':
          description: |
            The caller's own saved reports for this project, newest first. An empty array is the
            ordinary answer: nothing seeds a definition, and a project where nobody has saved one
            has none.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReportDefinition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [reporting]
      operationId: createReportDefinition
      summary: Save a report so it can be regenerated
      description: |
        §6e's *"saved as part of the `ReportDefinition` so the same cycle report regenerates next
        release with one click"* — which is most of why the table exists. What is saved is **what to
        compute** (`type` + `parameters`), never how to render it: `report_definition` has no format
        column, because the format is chosen per download and a saved report is not the file it
        produced.

        **Needs `report:view`, not `report:export`, and that is a decision rather than an
        oversight.** The row belongs to its creator and is visible to nobody else, so saving one
        writes to the caller's own workspace and not to project content — while requiring the
        export key would mean the persona §6e's two-key split exists for, *may read reports on
        screen but may not carry them off*, could not save the report it is allowed to read.

        A `type` this server cannot compute is a 400 naming what it can, in the same words
        `generate` uses: a saved report for a type nothing can produce is a button that always
        fails, and it fails at the moment it is *used* rather than at the moment it is wrong.

        **Names are not unique.** Two definitions may share a name — the rows are one person's own,
        a collision is theirs to notice, and a uniqueness constraint would be a migration adding a
        rule §6e does not ask for.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportDefinitionInput' }
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportDefinition' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/reports/{definitionId}:
    # No query parameters on the path item, per §50.
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/DefinitionId' }
    delete:
      tags: [reporting]
      operationId: deleteReportDefinition
      summary: Delete a saved report
      description: |
        A **hard** delete. A definition authors nothing — it is a saved question — so there is
        nothing for a soft delete to preserve.

        **The reports it produced survive it.** `report_job.definition_id` and
        `report_artifact.definition_id` are both `ON DELETE SET NULL`, so deleting a saved report
        never deletes the history of what it generated: those jobs become indistinguishable from
        ad-hoc ones, which is what they now are.

        **A definition somebody else owns answers 404, not 403.** The caller cannot list it, so
        telling them it exists would make this route an oracle over other people's saved reports —
        §6t's argument at row level.

        Needs `report:view`, for the reason `POST` above gives.
      responses:
        '204':
          description: Deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/reports/generate:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    post:
      tags: [reporting]
      operationId: generateReport
      summary: Generate a report
      description: |
        Async by contract — returns 202 with a job to poll (plan §6e). The work outlives the
        request that asked for it, which is why there is a job row at all: an in-request dispatch
        is lost on a restart, leaving a client polling an id that resolves to nothing with no
        symptom anywhere but a spinner.

        Needs `report:export` — held by every role but Automation Service (roles spec §A5).
        Generating *is* exporting: the artifact is a file somebody downloads. There is deliberately
        no `report:generate` key, because a key `V3` seeds to nobody is a 403 no administrator can
        grant their way out of.

        **What is refused at request time, and what is not.** An unknown `type` and a `format` this
        deployment cannot render are both 400s here, decided by asking the server what it actually
        has rather than by a list beside the check. A report's *own* parameters — a `runId` that is
        absent, or names a run in another project — are checked inside the worker and surface as a
        FAILED job carrying that sentence, because validating them here would mean either a second
        copy of every report's rules or a database read on the request path.

        **`Idempotency-Key` is optional and honoured** since `V66` (audit E2): a retry answers
        `200` with the job it already queued rather than `202` with a second one. This was the
        last of the eleven creates in this API to take the header, and the asymmetry was found
        from the other side — `packages/mcp` declared and sent a key this endpoint discarded, so
        every retry it made produced a duplicate. It matters more here than a duplicate row: a
        job refreshes the execution fact projection for the whole company, computes, renders and
        writes two artifacts, so a duplicate is a second full pass.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format]
              properties:
                definitionId:
                  type: string
                  format: uuid
                  description: |
                    Regenerate a saved report (§89's *"one click"*). The definition supplies the
                    `type` and a **base** for `parameters`; anything sent in this request overrides
                    it **key by key at the top level**, so "the same cycle report, but for last
                    week" is one field rather than a re-sent copy of the whole selection.

                    The merge is deliberately **shallow**. `parameters` is untyped by design, so a
                    deep merge would have no schema to decide whether a nested object should be
                    combined or replaced, and half-overriding a saved selection is the kind of
                    difference nobody sees in the output.

                    A definition **the caller does not own** is a field error rather than a 403,
                    for the reason `DELETE` gives. `type` may be omitted when this is sent, and if
                    both are sent they must agree — a request that names one report and a saved
                    definition of another is a mistake in the client, and picking either one
                    silently generates a report somebody did not ask for.
                type:
                  type: string
                  example: run_summary
                  description: |
                    Which report. This is an open string rather than an enum because §6e's
                    catalogue names ten and the set a deployment can produce grows slice by slice —
                    an enum here would have to be edited in lockstep with the server, and a client
                    generated from a stale one could not ask for a report that exists.

                    A type this server cannot compute is a 400 naming what it can.
                    **Three today**, and the refusal is generated from what is registered rather
                    than from this list, so a deployment is the authority on its own catalogue:

                    - `run_summary` (§87) — one run's results, its pass rate and its outstanding
                      work. Scoped to a single run, so it can say what was *not* run.
                    - `aggregate_execution` (R6) — executions **across** a selection of plans,
                      suites, features, configurations and dates, resolved under a stated
                      aggregation policy. It is computed from the `execution_fact` log rather
                      than from live rows, which has two consequences worth knowing before
                      comparing it with a screen: **a result recorded in the last few minutes may
                      not be in it yet** (the projection runs every 15 minutes), and **a case with
                      no recorded result is not in it at all** — a star schema holds facts, not
                      scope, so there is no "not run" here the way a plan page has one.

                      Since R7 it carries four further sections, and **all four deliberately
                      ignore the `policy` parameter** — they are about the executions a policy
                      collapses, so applying one would leave them empty under the default:

                      - **Inconsistent results** — cases with at least one pass *and* at least
                        one failure in the selection, each row saying whether the disagreement is
                        inside one configuration and version (instability) or across one of those
                        axes (a difference, not a flake). A case that was blocked and later passed
                        is **not** listed: nothing failed.
                      - **Version divergence** (R8) — cases the selection executed at more than
                        one version of their own text, one row per case and version, because
                        results recorded against two versions are results for two different tests
                        and one figure over both describes neither. **Wider than the callout's
                        *Across versions* rows**, which are a strict subset: a case that failed at
                        both versions disagrees with nothing and is still two tests. Each row also
                        says whether that version's results reached the report's totals, which is
                        the only part of the section the policy moves — under `ALL` every version
                        is counted and the totals genuinely average across versions, while under
                        `LATEST` one version is counted per case and the rest appear in no total
                        in the report. The header block carries the count as
                        `Cases executed at more than one version`, printed **even when it is
                        zero** so that two reports from one project line up.
                      - **Manual and automated** — a cross-tab of the case's `automationStatus`
                        as it stood when the result was recorded against the run's `source`, not
                        one column relabelled. The two disagree in both directions, and such a row
                        is a signal about the repository rather than a kind of testing.
                      - **First attempt and retries** — passed first time / passed only after a
                        retry / never passed, counted per (case, configuration, case version),
                        which is the only unit under which a retry means anything. One case can
                        appear in several groups, so these do **not** sum to the distinct-case
                        count in the headline.

                    - `coverage_matrix` (§115) — §6e's *requirement → cases → last result*, with a
                      **documentation page as its spine**: the document's own headings in order,
                      and under each the statements it makes with the cases that claim to verify
                      them and those cases' latest results. Two things about it are decisions
                      rather than details, and both change what the numbers mean:

                      - **A statement is a list item, or any block somebody has already linked.**
                        Not every block. A specification's prose is context, and marking each
                        paragraph of it "Not covered" would put a specific, alarming and usually
                        false claim on every page of the document — which is the same reason
                        `DocBlock.coverage` is absent rather than zeroed. So a page of prose alone
                        reports **no statements**, which is not the same as 0% coverage.
                      - **Only a `VERIFIES` link is coverage.** A `REFERENCES` or `DERIVED_FROM`
                        link is a relationship somebody deliberately chose *not* to state as
                        proof, and counting it would be exactly the false claim the relationship
                        field exists to prevent. A block whose only links are those reads as
                        **Not covered**.

                      A statement's own state is the pessimistic roll-up of its cases — one case
                      last failing makes the statement **Failing** however many others pass — and
                      **Not run** (covered, nothing executed) is kept distinct from **Not
                      covered** (nothing linked), because they are different problems with
                      different owners. Results are resolved **LATEST** and the policy is not a
                      parameter: this report asks whether a statement is verified *now*, and there
                      is one answer to that. `openDefects` from §6e's catalogue line is **not**
                      built — there is no defect anywhere in the product until M4 — and is named
                      as absent rather than rendered as an empty column, which would read as "no
                      defects are open".

                    **Required unless `definitionId` is sent** — which `required` cannot express
                    here without splitting the body into a `oneOf` whose two arms differ by one
                    optional field. Sending neither is a field error on `type`.
                format:
                  type: string
                  enum: [PDF, MD, HTML]
                  description: |
                    The set a person downloads. **Not the set this server can render** — the two
                    are deliberately different, and asking for one it cannot produce is a 400 at
                    request time rather than a job that goes FAILED an hour later, because a client
                    cannot tell an unsupported format from a broken server by watching a job die.

                    Today `MD` and `HTML` render (§88). `HTML` is one self-contained file — no CDN,
                    no script, charts drawn in CSS — because the reader is often a client opening an
                    attachment with no network. `PDF` needs a headless browser that is not in the
                    image and says so in the refusal. The enum is *not*
                    narrowed to what is installed: what a deployment can render is a property of
                    that deployment, and the refusal names it.
                parameters:
                  type: object
                  additionalProperties: true
                  description: |
                    What the report is computed over, stored verbatim and frozen onto the artifact
                    — `V1`'s reason, in one line: "a report you cannot reproduce is a report nobody
                    trusts" (§6e).

                    Untyped because each report takes different ones. `run_summary` takes a single
                    required `runId` (uuid), and `coverage_matrix` a single required `docPageId`
                    (uuid) — the page whose structure becomes the report's spine. It is **one
                    page and not its subtree**: a page's descendants are a different document in
                    every space this product seeds, and a scope that silently swept in three
                    sibling specifications would be wrong in the direction nobody checks.

                    `aggregate_execution` takes a **selection**, every field of it optional — a
                    request with none is the whole project, which is what "I did not narrow on
                    anything" means:

                    - `policy` — one of `LATEST` (the default), `LATEST_PER_CONFIG`, `WORST`,
                      `ALL`; the same four values, with the same meanings, that
                      `GET /plans/{planId}/statistics` takes. The report prints the policy it
                      used and prints **both** the execution count and the distinct-case count,
                      because those two are equal under `LATEST` and differ under the others,
                      and reporting one of them as "the number" inflates it.
                    - `planIds`, `configurationIds`, `featureIds` — arrays of uuid.
                      `featureIds` **unions**: a case classified under Payments *or* Refunds. The
                      intersection reading would answer nothing for the ordinary two-feature
                      request, which reads as a quiet project rather than as a misunderstanding.
                    - `suitePaths` — array of strings, matched **descendant-or-self** against the
                      suite path each result was recorded under. That path is frozen history: it
                      is what the tree said when the execution happened, so a report spanning the
                      §98 flattening matches deep paths for old runs and single labels for new
                      ones.
                    - `automationStatuses`, `sources` — arrays of strings, matched exactly.
                    - `from`, `to` — RFC 3339 instants, **half-open**: `from` inclusive, `to`
                      exclusive, so asking for August means `to` = `2026-09-01T00:00:00Z` and two
                      adjacent monthly reports neither double-count nor drop whatever landed on
                      midnight. `to` before `from` is a field error and is never swapped for you.
                      A result recorded with **no** timestamp is outside every range — that is
                      what a date range means, and the alternative puts one execution in two
                      months.

                    An **empty array is read as absent**, not as "match nothing": the other
                    reading turns `{"planIds": []}` into a clean, plausible report of nothing
                    (§99, from the SQL side).

                    With `definitionId`, this is the **override** and the saved definition is the
                    base — the stored `parameters` on the job (and therefore the artifact's
                    `filter_snapshot`) is the merged result, because what a report was computed
                    over is what has to be reproducible, not what the caller typed.
      responses:
        '200':
          description: |
            **Replayed** — this project has already queued a job under this `Idempotency-Key`, and
            that job is the body (`V66`, audit E2). Nothing was queued by this request, which is
            what the status says: `202` here means work was started.

            `Location` points at the same poll either way, because what the caller does next is
            identical.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportJob' }
        '202':
          description: |
            Queued. The job is PENDING and `downloadUrl` is null; poll the job to find out when it
            is not.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/reports/capabilities:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [reporting]
      operationId: getReportCapabilities
      summary: Which report formats this deployment can produce
      description: |
        **The answer to a question `format`'s enum deliberately does not answer.** That enum is the
        set a person may *ask* for and is not narrowed to what is installed — see `generate`, which
        argues it — so a generated client offers `PDF` on every deployment and every deployment
        refuses it. That refusal is correct and it arrives too late to be useful to a picker.

        This operation is the other half: what the *server* can render, read from the renderers on
        its classpath rather than from a list anybody maintains. A client builds its picker from
        this and gets a menu whose every option works; a client that ignores it and asks for
        something absent still gets the 400 naming what this server can produce, because a
        capability read is a courtesy and never the authority.

        **Project-scoped and gated on `report:view`, though the answer is the same for every
        project on the instance.** The scoping is not about the data — it is that the only consumer
        is a picker on a screen already needing that key, and an ungated route would tell an
        unauthenticated stranger which optional renderers this deployment has installed.

        `JSON` is renderable on every deployment and is **not** listed: it is the serialized model
        written for every job (`V27`), not a format a person chooses.
      responses:
        '200':
          description: What this server can render.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportCapabilities' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/reports/jobs:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [reporting]
      operationId: listReportJobs
      summary: Every generation request this project has made
      description: |
        **The project's, not yours** — the opposite call to `GET /projects/{projectId}/reports`
        one path up, and the difference is what the two rows *are*. A saved definition is a
        question somebody keeps in their own workspace (`report_definition.owner_id`, no way to
        share one in v1). A job is a report that was produced *about this project*, and the file
        it produced is project content: two people looking at the same release need the same
        list, and `report_job.requested_by` is nullable since §66, so a "mine" reading would hide
        every report requested by somebody who has since left.

        **Without this route a generated report has no durable handle.** `POST …/generate` hands
        back a job and `GET …/jobs/{jobId}` resolves one by id, and until this operation existed
        that was the whole surface — so the set of reports a person could reach was the set their
        current tab had asked for, and a reload lost every download link permanently while the
        artifacts sat in the store unreferenced by anything a client could name.

        Needs `report:view`, exactly as the single-job poll does: this answers the same rows, and
        a list that cost more than the thing it lists would refuse a caller the ids they can
        already resolve one at a time.

        **Newest first and bounded.** The most recent 100 requests, which is the window anybody
        works in; older jobs are still resolvable by id, and their artifacts are still served.
        There is deliberately no paging — a report queue is not a corpus, and a `page` parameter
        would be a second pagination dialect for a list that is at most a release's worth of rows.
      responses:
        '200':
          description: |
            Jobs, newest requested first — every state, including `PENDING` and `FAILED`. A
            project where nobody has generated anything answers `[]`.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReportJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/reports/jobs/{jobId}/model:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/JobId' }
    get:
      tags: [reporting]
      operationId: readReportModel
      summary: The report on screen
      description: |
        The stored model a completed job produced — the same JSON the export was rendered from,
        which is §6e's *"the on-screen report view consumes the same model via JSON, so what you
        see is what exports"*.

        **Needs `report:view`, and that is the whole reason this route exists.** The model used to
        be reached through `GET …/artifacts/{artifactId}/content`, which is the download and is
        gated on `report:export` — so the persona §6e's two-key split exists for, *may read a
        report on screen but may not carry it off*, could watch a job succeed and then be refused
        the report it had just watched being made. Reading a report is not exporting one; the
        bytes-as-a-file route still costs the export key, and this one does not.

        The body is the model as an object, served `inline` rather than as an attachment: this is
        a document to render, not a file to keep. Its shape is deliberately **not** a declared
        schema — every report type computes different sections, so a contract type here would be a
        second definition of every report's output that has to move whenever the first does
        (`report_job.parameters` carries the identical argument on the way in).

        Answers **404** when the job has no stored model: a job that has not finished, one that
        failed, or one generated by a deployment older than the JSON artifact. `ReportJob.modelUrl`
        is null in exactly those cases, so a client following the field never asks.
      responses:
        '200':
          description: The report model — header plus the computed sections.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/reports/jobs/{jobId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/JobId' }
    get:
      tags: [reporting]
      operationId: readReportJob
      summary: Poll a generation job
      description: |
        Where a request got to. **Without this route the 202 above would hand back an id nothing
        can resolve** — the client would have no way to learn that its report was ready, or that it
        had failed and why.

        Needs `report:view`, not `report:export`: reading whether your own request finished is not
        exporting anything, and a role that may see reports but not take them away must still be
        able to watch one being made. It is that key's first consumer since `V3` seeded it in M0.

        The job is scoped by the project in the path as well as by its id, so a job id from a
        sibling project answers 404 rather than being served through a gate that was evaluated
        against a different project.
      responses:
        '200':
          description: The job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/reports/artifacts/{artifactId}/content:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/ArtifactId' }
    get:
      tags: [reporting]
      operationId: downloadReportArtifact
      summary: The report bytes
      description: |
        What `ReportJob.downloadUrl` points at — **without this route that field would be a lie**,
        and a generate endpoint shipped alone would have had to invent the URL, with every client
        taking the invention for the contract (§67, verbatim).

        ~~And what `ReportJob.modelUrl` points at.~~ → **no longer.** The on-screen model has its
        own route, `GET …/reports/jobs/{jobId}/model`, gated on `report:view`. Serving it through
        here meant reading a report cost the same key as downloading one, which is precisely the
        split §6e describes and the reason the catalogue carries two keys rather than one.

        An ordinary session-authenticated route rather than a public link, for `downloadEvidence`'s
        reason: the filesystem adapter cannot issue an expiring signed URL, and a guessable
        permanent one would be an unauthenticated read of a customer's results.

        Needs `report:export` — this is the download, which is what that key names.

        **The project in the path is proved through the job, not through the artifact.**
        `report_artifact` carries no `project_id` (`V1` scoped it by company and definition), so
        the row that scopes it is the `report_job` naming it. That is total in the designed system;
        the day something produces an artifact without a job, this route needs a second answer.
      responses:
        '200':
          description: |
            The bytes, `attachment` — a report is a file somebody keeps, unlike evidence, which is
            served `inline` so a screenshot renders in place.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          # Also the answer when the row exists and its blob does not. Unlike evidence, that
          # orphan is not a designed outcome here: the worker writes bytes BEFORE the row, so a
          # COMPLETED job whose download 404s means the store lost the file.
          $ref: '#/components/responses/NotFound'

  # ------------------------------------------------------------ ingestion ----
  /projects/{projectId}/ingestions:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      tags: [execution]
      operationId: listIngestions
      summary: What CI has posted to this project
      description: |
        The ingestion history, newest first. **Project membership, and no permission key** — this
        is gated exactly as `GET /runs` is, because a member may read this project's runs and their
        verdicts, and a job is the record of how some of those verdicts got there. A new
        `ingestion:read` key would be one seeded to nobody.

        Reading the history is **not** confirming a mapping: the binder reads here and writes
        through `POST /automation-mappings`, which costs `case:edit`.

        **The rows are `IngestionJobSummary`, which has no `unmatched` array.** The names are not a
        column — they live inside the job's stored payload, which for a 5,000-test build is
        megabytes — so serving them here would read every blob in the project's history to render
        one screen. `GET /ingestions/{jobId}` serves them, one request away. A row carrying `[]`
        beside a count of 12 was the alternative, and it reads as "the list was cut" when the truth
        is "not served on this endpoint".
      responses:
        '200':
          description: Jobs, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IngestionJobSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [execution]
      operationId: ingestResults
      summary: Post a CI report
      description: |
        **The one endpoint in this API whose expected caller is not a browser.** A CI job posts
        the report its runner emitted; the server parses it, joins each test to a case through
        §6c's four-step ladder, opens a run and records the verdicts.

        **Two permissions, and neither is new**: `result:submit` for the results and
        `run:create` for the run, both asked exactly where they are asked for a person. Both are
        in Automation Service's five (roles spec §A6), which is what that role exists for. A
        third `results:ingest` key was refused — a key seeded to nobody is a 403 nobody can
        grant their way out of.

        **`Idempotency-Key` is REQUIRED here**, where `POST /runs` makes it optional. CI is the
        one caller that retries automatically, and its retry re-posts a whole report rather than
        one row: a replay answers **200** with the original job and writes nothing. Absent, this
        is a 400 with the field named `Idempotency-Key`.

        **The report travels as a string in `report`, not as `multipart/form-data`.** Two of the
        four dialects are XML and two are JSON, so a `Content-Type` would distinguish neither
        JUnit from TestNG nor Allure from Cucumber. `format` says which, and it is never
        inferred — sniffing would make a malformed report of one dialect read as a valid report
        of another.

        **A report that matches no case creates NO run** and answers 201 with `runId: null` and
        every test in `unmatched`. A run of zero cases would report 0 of 0, 100%, complete —
        and the report that most often matches nothing is the first one a team posts, while they
        are still deciding whether the integration works.

        **Nothing is auto-created for an unmatched test.** §6c offers a case stub; it is
        declined, because a CI job that can mint cases turns every test *rename* into a permanent
        duplicate of a case that already exists. The names come back in `unmatched` with the
        exact `normalizedName` that `POST /automation-mappings` takes, which is the supported way
        to bind them.

        **A report this server cannot parse is a 400 *and* a `FAILED` job (B6).** The refusal is
        unchanged — a field error on `report`, carrying the parser's own sentence — and it now
        leaves a row, so `GET …/ingestions` shows the rejection instead of showing nothing. That
        row **consumes no key**: the corrected retry under the key CI generated once still ingests,
        because `V60` narrowed the uniqueness to `COMPLETED` rows. See `IngestionStatus`.

        The row is written only for a caller who holds `result:submit`; anybody else gets the same
        400 and writes nothing, which keeps this endpoint from telling a stranger which projects
        exist.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            Required — see above. At most 200 characters.
          schema: { type: string, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngestionInput' }
      responses:
        '201':
          description: Ingested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestionJob' }
        '200':
          description: |
            A replay of an `Idempotency-Key` already used — the original job, and no second set
            of results.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestionJob' }
        '400':
          # A malformed or unreadable report (`report`), a missing key (`Idempotency-Key`), an
          # unknown format (`format`), or a project with no result status of a kind the report
          # needs (`report`). The last is refused rather than substituted: recording a skip as a
          # failure would be a verdict nobody's runner reported.
          $ref: '#/components/responses/BadRequest'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          # The run named by `runId` has ended, so its results are frozen. Reopen it to post more.
          # A state refusal rather than the lost-update Conflict's usual sense — ExecutionService's
          # RunClosed, reached by the same rule.
          $ref: '#/components/responses/Conflict'

  /projects/{projectId}/ingestions/{jobId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: jobId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [execution]
      operationId: getIngestion
      summary: One posted report, and the tests it could not place
      description: |
        **The resource `POST /ingestions` has been naming in its `Location` header since it
        shipped** — and until this endpoint existed, that header pointed at a 404.

        Project membership, as for the list. This is what the unmatched-test binder reads: each
        name comes back with the `normalizedName` that `POST /automation-mappings` takes, and with
        the outcome that says how urgent it is — an unmatched **failure** is a red test nobody is
        being told about, where an unmatched pass is only unrecorded coverage.

        `unmatched` is capped at 50, by the same constant the post's own response uses. The names
        are re-derived from the job's stored payload rather than kept in a column; `normalizedName`
        is recomputed server-side for the reason `AutomationMappingInput.testName` gives.
      responses:
        '200':
          description: The job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestionJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          # One bodiless 404 for an unreachable project, another project's job id, and an id that
          # is nothing at all — §6t, so the endpoint is not an existence oracle.
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/ingestions/{jobId}/report:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: jobId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [execution]
      operationId: downloadIngestionReport
      summary: The verbatim file CI posted
      description: |
        The report exactly as it arrived, byte for byte, before this server parsed any of it.

        **This is not `raw_payload` and the two are not redundant.** `GET /ingestions/{jobId}`
        serves what the server *understood* — the normalized parse and where every test landed,
        which is what the binder screen reads. This serves what CI *sent*, which answers the
        different question of whether the server understood correctly. A test that is missing from
        `unmatched` and missing from the run is the case where only this endpoint can tell you
        whether the report ever mentioned it.

        **Project membership**, as for the list and the job — and no new permission key. The
        catalogue has no `ingestion:read`, and inventing one would be a `403` no administrator can
        grant their way out of. The upload is the evidence behind verdicts a member may already
        read in full, posted by that member's own CI job.

        Served `inline` with the dialect's media type (`application/xml` for JUnit and TestNG,
        `application/json` for Allure and Cucumber) — the opposite of a generated report, which is
        `attachment`. What somebody clicking this from the ingestion history wants is to read forty
        lines of test names against what the binder says, and forcing a download puts a second
        application between the question and the answer. **The `Content-Type` does not identify the
        dialect** — `application/xml` is true of both JUnit and TestNG and distinguishes neither,
        which is `IngestionInput.format`'s opening argument read backwards. The filename carries it.

        One bodiless `404` for four things (§6t): an unreachable project, another project's job id,
        an id that is nothing at all, and **a job posted before the upload was kept** — every row
        written before this endpoint existed has no bytes behind it and no migration can invent
        them. A pruned blob answers the same way, deliberately: the caller's next action is
        identical, so a second spelling would be a distinction with no act behind it.
      responses:
        '200':
          description: The bytes, as posted
          content:
            application/xml:
              schema: { type: string, format: binary }
            application/json:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/automation-mappings:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      tags: [execution]
      operationId: listAutomationMappings
      summary: Learned test-name mappings
      description: |
        §6c's third ladder step — *"once a human confirms 'this test name means this case', the
        mapping survives renames of everything except the test itself"*. `case:read`.
      responses:
        '200':
          description: Mappings, by test name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AutomationMapping' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [execution]
      operationId: confirmAutomationMapping
      summary: Confirm that a test name means a case
      description: |
        **`case:edit`, and Automation Service deliberately does not hold it.** Confirming a
        mapping is the same statement as writing the case's `automationKey`: it decides where
        that test's results land. So a leaked CI token can post results and **cannot re-point
        where anybody's results land** — without the split it could bind every failing test to a
        throwaway case and launder a red suite into a green one.

        **200, not 201, and re-confirming MOVES the row.** The key is
        `(company_id, normalized_test_name)`, so a second post of the same name is the same
        resource re-pointed rather than a new one. A 409 would make correcting a mis-binding a
        delete-then-create, with a window in the middle during which the CI job silently stops
        matching.

        `testName` is sent **raw** and normalized server-side. The client must not normalize:
        the rule has to agree exactly with the one the parser applies, and a second
        implementation of it is how every mapping silently stops matching.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AutomationMappingInput' }
      responses:
        '200':
          description: Confirmed — created, or re-pointed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutomationMapping' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/automation-mappings/{mappingId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: mappingId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [execution]
      operationId: deleteAutomationMapping
      summary: Remove a mapping
      description: |
        `case:edit`. 204 whether the mapping was there or not — delete is idempotent.
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --------------------------------------------------------- integration ----
  # Plan §5's integration module, arriving with notifications (§218). Jira, Git traceability and
  # generic outbound webhooks share the module and nothing else; they are not here.
  /projects/{projectId}/notification-channels:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [integration]
      operationId: listNotificationChannels
      summary: Where this project sends its notices
      description: |
        Needs `integration:manage` on this project — **the read is gated exactly like the
        write, and that is a decision rather than a default.**

        `getProjectSettings` one path family over does the opposite deliberately: it is
        readable by anybody who can see the project, because §6g's "a project that never turns
        review on should see no extra UI at all" is a decision every client makes on every
        artifact screen for every reader, and none of those readers is an administrator.

        Neither half of that argument transfers. **Nothing in this product branches on whether
        a channel exists** — no screen renders differently, so there is no reader who needs the
        answer and cannot have the key. And what a channel carries points the other way: a
        `secretHint` is the tail of a live credential, and `recipients` are people's addresses.
        A settings screen's own gate is therefore the right gate for reading it.

        The refusal splits the way `readGranted` splits everywhere: a project the caller cannot
        see is **404**, and a project they are looking at without the key is **403**. The
        second conceals nothing they do not already know, and answering 404 there would tell an
        administrator the project had no channels rather than that they may not look.

        Ordered by name. `[]` is a valid 200 and is the state of every project nobody has
        configured, which is most of them.
      responses:
        '200':
          description: The project's channels, never their credentials
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NotificationChannel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [integration]
      operationId: createNotificationChannel
      summary: Add a notification channel
      description: |
        Needs `integration:manage` on this project.

        **`secret` is required here and is never returned by anything.** For `SLACK` and
        `TEAMS` the incoming-webhook URL *is* the authentication for the room it posts to, so
        it is encrypted at rest and the read model carries only `secretHint` — enough to
        recognise which webhook is configured, and far short of enough to post to it. `EMAIL`
        has no credential of its own: it authenticates as whatever the deployment's mail
        relay does, which is not a company-owned value, so it takes `recipients` instead.

        `subscriptions` is the complete set of event types this channel wants. An empty array
        is a legal channel that will never fire, which is a state an administrator can
        deliberately want while a webhook is being tested.

        **No `Idempotency-Key`, on `POST /projects/{projectId}/conditions`' terms**: there is
        no idempotency record behind this path, a duplicate channel is visible in the list
        beside its twin the moment this returns, and deleting one costs the same permission
        that made it. Declaring the header without honouring it would be worse than declaring
        nothing — a client that trusted it would replay a timed-out create and get a second
        channel that delivers every notice twice.

        `Location` names the created channel's own path, which serves a `GET`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationChannelInput' }
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: The new channel's path
              required: true
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationChannel' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/notification-channels/{channelId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/ChannelId' }
    get:
      tags: [integration]
      operationId: getNotificationChannel
      summary: One notification channel
      description: |
        Needs `integration:manage` — the list endpoint's gate, and its reasoning.

        A channel belonging to a sibling project answers **404**, the same answer an
        unreachable project gets (§6t): the refusal must not become an oracle for which
        channel ids exist in a project the caller is not asking about.
      responses:
        '200':
          description: The channel, without its credential
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationChannel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [integration]
      operationId: updateNotificationChannel
      summary: Replace a notification channel
      description: |
        Needs `integration:manage` on this project.

        **A `PUT` rather than a `PATCH`, and the subscriptions travel in the body rather than
        as a sub-resource.** `updateProjectSettings` makes the argument and it is the same one:
        the form shows every control and submits every control. A channel's transports, its
        recipients and the event types it wants are configured together on one screen and saved
        with one button, so "leave this one alone" is not something a user of this screen can
        mean — and `subscriptions` is therefore the complete set, reconciled against what is
        stored. Removal is the ordinary case (a channel that stops wanting run completions has
        to be able to say so) and an upsert-only sub-resource can add and change a subscription
        without ever taking one away.

        **`secret` is the one exception, and absent means unchanged.** Everywhere else in this
        API an omitted field on a `PUT` is a clear. It cannot be here: the screen never shows a
        secret, so an edit form has nothing to send back, and treating that emptiness as a clear
        would blank the credential of every channel anybody renamed. The row would still read as
        configured and delivery would start failing hours later, at a time unconnected to the
        edit that caused it. Send a `secret` to rotate one; omit it to keep it.

        **`kind` is ignored.** A channel's transport is not editable — turning a Slack channel
        into an email one would keep the row's name and history while replacing everything they
        were about, and the delivery log beneath it would describe a transport that no longer
        exists. Delete and create says that, and costs one row nobody was reading.

        `If-Match` carries the `lockVersion` the client read. A channel edit is a *field* edit —
        a name and a recipient list typed over what somebody else read — so two administrators
        editing one channel really do lose each other's words, which is the case that earns a
        precondition. Omitting the header is the documented last-write-wins path.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationChannelInput' }
      responses:
        '200':
          description: The channel as it now stands
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationChannel' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [integration]
      operationId: deleteNotificationChannel
      summary: Remove a notification channel
      description: |
        Needs `integration:manage` on this project.

        **A hard delete, and the delivery history goes with it.** The alternative — keeping the
        log of a channel that no longer exists — is a history nothing can be replayed into and a
        row naming a credential nobody can rotate, which is a worse thing to keep than to lose.

        **No `If-Match`.** A delete names an absolute destination: the row is gone whichever
        version the caller last read, so a precondition here could only refuse somebody who
        wanted exactly what happened.
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/notification-channels/{channelId}/deliveries:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/ChannelId' }
    get:
      tags: [integration]
      operationId: listNotificationDeliveries
      summary: What this channel has been sent, and what came back
      description: |
        Needs `integration:manage` — the same gate as the channel itself, and here the reason is
        the plainest of the three: a failed attempt's `error` is whatever the remote endpoint
        said, and that is not a sentence to serve to every reader of a project.

        **It hangs off the channel, not off the project, and that is a decision.** A delivery is
        only ever asked about as one — *is this webhook working* — so a project-level log would
        be a list every reader has to filter before it answers anything. It is also the shape the
        rows can actually keep: deleting a channel takes its history with it, so a project-level
        log would outlive the channels it names and would have to answer for ids that no longer
        resolve. A project-wide view of failures is a reporting question and would be a different
        endpoint with a different argument.

        Newest first, most recent 50. `[]` is a real answer and means nothing has been sent
        through this channel yet — which is not the same as a channel that has never worked,
        because **a row exists as soon as an attempt is made**, including a first attempt that
        failed.

        `error` is stored already redacted: a failed POST's message can quote the webhook URL,
        and a column an operator browses and a backup copies is the wrong place to be relying on
        a rendering step to keep a credential out.
      responses:
        '200':
          description: Delivery attempts, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NotificationDelivery' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --------------------------------------------------------------- admin ----
  /users:
    get:
      tags: [admin]
      summary: Users
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [admin]
      summary: Invite a person into this company
      description: |
        The way a colleague gets into the company at all. Until this endpoint existed, the only
        account a provisioned company had was the Company Admin the operator CLI created, and a
        second person could be added **only by hand-written SQL** — which is what every fixture
        in the suite had to do (handoff §54).

        Gated on **`company:members`** at COMPANY scope — Company Admin and Instance Admin only.
        That permission is defined as "invite, remove, set membership display names" (roles spec
        §A3), so this is the read of it the catalogue always intended.

        The person is created as an **`INVITED` membership** and receives an activation link,
        the same `POST /auth/invitations/{token}/accept` flow the CLI's first admin uses.
        Membership conveys authentication and **zero project visibility** (roles spec §A1), so
        an invited colleague signs in to an empty project list until somebody grants them a role
        with `POST /role-assignments`. That is two deliberate steps, not an oversight.

        **The response cannot be used to discover whether an address already has an account on
        this instance.** `app_user` is instance-level and its email is unique instance-wide, so
        one person may belong to several companies (§6s). Inviting an address that already has
        an account reuses it and answers **exactly as inviting a brand-new address does** — same
        status, same body shape, same `displayName` (the one the inviter typed, per §6u; never
        the account's own name, which belongs to another client). Without that, this endpoint
        would be a membership oracle for every other company on the instance.

        **Re-inviting is idempotent and carries no `Idempotency-Key`.** The identity of the
        request is the email address, so a retry finds the membership it already created:

        - a membership that is already `ACTIVE` → `200` with that person, nothing sent;
        - an outstanding, unexpired invitation → `200`, and the existing link is **left alone**
          rather than replaced, because a fresh token would invalidate the one already in the
          invitee's inbox;
        - no membership, or one whose invitation has lapsed → `201` and a new link.

        `emailed` is `false` when the instance has **no SMTP relay configured**. The invitation
        is still valid — an operator must carry the link across by hand, exactly as they do for
        `provision-company` — and saying so is what stops the invitee from waiting for a message
        that is never coming.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserInvitationInput' }
      responses:
        '200':
          description: |
            Already a member, or an unexpired invitation was already outstanding. Nothing sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserInvitation' }
        '201':
          description: Invited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserInvitation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users/{userId}:
    # No query parameters on the path item, per §50.
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [admin]
      summary: Remove a person from this company
      description: |
        Offboarding — the second third of **`company:members`** ("invite, remove, set membership
        display names", roles spec §A3), gated exactly as `POST /users` is: COMPANY scope, so
        Company Admin and Instance Admin only.

        **It removes the membership, not the account.** `app_user` is instance-level and one
        person may belong to several client companies (§6s), so deleting the account would offboard
        them from every other client on the instance — and would orphan the authorship this
        company's own history depends on. The membership goes to `REMOVED`, which zeroes their
        permissions here (`CompanyMembership`: membership is a precondition, so every grant they
        hold in this company becomes inert without being deleted). They disappear from `GET /users`
        immediately.

        **Their session is revoked, not left to expire.** A signed token stays valid until it
        lapses, so without this the person keeps an authenticated session inside the company they
        were just removed from — for hours. The `pv` epoch bump signs them out on their next
        request. It is account-wide, so it signs them out of their *other* companies too; they
        sign in again and nothing there has changed.

        **Any outstanding invitation is cancelled.** Removing somebody who has not accepted yet
        must not leave a live activation link behind — a later re-invite would find it outstanding,
        report that a link is already on its way, and re-admit them on a token minted before the
        offboarding.

        **A caller may not remove themselves** — `400` keyed on `userId`. It is also what keeps a
        company administrable without counting administrators: the only person who can run this
        endpoint is one who holds `company:members`, and they cannot be the one who leaves.

        **`204` whether they were a member or not.** A repeated request, a double-click and an id
        that names nobody here all end in the state the caller asked for — and a member of another
        company is *also* not here, so isolation and idempotence give the same answer (§6t).

        **Re-inviting them later restores their previous project access**, because their grants
        were made inert rather than deleted. That follows from the model rather than from this
        endpoint, and it surprises people at an admin screen.
      responses:
        '204': { description: Removed, or was not a member here }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api-tokens:
    get:
      tags: [admin]
      summary: This company's API and CI tokens
      description: |
        Gated on **`token:issue`** at COMPANY scope — Company Admin and Instance Admin only, per
        roles spec §A3 ("API / CI tokens"). This is that permission's first consumer: it has been
        seeded and granted since `V3` with nothing ever asking it.

        **The list is refused rather than filtered** for a caller who does not hold it, unlike
        `GET /role-assignments`. There is no partial-visibility story for a credential — a token
        belongs to the company rather than to a project — so an empty array would be a claim
        that this company has no tokens, told to somebody who may simply not ask.

        **Revoked tokens stay in the list**, carrying `revokedAt`. A credential that was live in
        a pipeline yesterday is evidence, and dropping the row reads as though it never existed.

        The secret is **not here and cannot be recovered**. `tokenPrefix` — the first 12
        characters — is what identifies a row against a CI configuration.
      responses:
        '200':
          description: The company's tokens, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApiToken' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      summary: Issue an API token
      description: |
        Mints a non-human credential — **the way a CI job reaches this instance**, and the
        precondition for everything else in M3. `test_execution.executed_by_token` and
        `audit_event.actor_token_id` have been columns since `V1` with nothing able to fill them.

        **The secret is in this response and nowhere else, ever.** Only its SHA-256 is stored.
        A caller who loses it revokes the token and issues another; there is no recovery path
        and adding one would mean storing the credential.

        **A token carries a ROLE, never the rights of the person who issued it.** `roleId` is
        the grant; Automation Service is the intended answer and roles spec §A6 states what that
        costs an attacker who steals one ("can post results and add quarantine stubs; cannot
        edit or delete a real case, close a run, or read reports"). The server does not require
        that particular role — code checks permissions, never role names.

        **The effective permission set is the intersection of the role and the owner's own
        grants**, so a token can never exceed either, and demoting the issuer shrinks the tokens
        they issued. `projectId`, when present, is a hard scope: the token is inert everywhere
        else.

        **There is no `ownerId` field.** The owner is the caller. A nominated owner would be a
        way to mint a credential more powerful than yourself by naming somebody more powerful —
        the exact escalation the intersection exists to prevent.

        SYSTEM-scope roles are refused (`400` on `roleId`): those grants live in
        `instance_role_assignment` and a company-bound credential carrying one would be a tier
        the model does not have.

        `expiresAt` may be omitted, and that is deliberate: a credential that dies mid-release
        without anybody deciding to withdraw it is an outage. The withdrawal that *is* a
        decision is `DELETE`.

        **Except for `Agent`, where it is required** (`400` on `expiresAt`). An agent token
        lives on somebody's machine rather than in a pipeline, so the failure the paragraph
        above avoids is not the one that happens — the one that happens is that nobody revokes
        it because nobody remembers it. This is the only per-role rule in this operation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiTokenInput' }
      responses:
        '201':
          description: Issued. The only response in this API carrying a secret.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedApiToken' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: |
            `projectId` names a project that does not exist, or that this session cannot reach.
            One status for both, per §6t — the response must not be usable as an oracle.

  /api-tokens/{tokenId}:
    # No query parameters on the path item, per §50.
    parameters:
      - name: tokenId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [admin]
      summary: Revoke an API token
      description: |
        Withdraws the credential. Gated on **`token:issue`**, the same permission that issued it.

        **Idempotent, and the first revocation is the one that counts.** Revoking an
        already-revoked token answers `204` and does *not* move `revokedAt` — the trail must
        report when the token stopped working, not when somebody clicked a second time.

        The row is **kept**, revoked. Deleting it would remove the evidence and orphan every
        `executed_by_token` reference pointing at it.
      responses:
        '204': { description: Revoked, or already revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No such token in this company }

  /identity-providers:
    get:
      tags: [admin]
      summary: This company's external identity providers
      description: |
        Gated on **`company:idp`** at COMPANY scope — Company Admin and Instance Admin only, per
        roles spec §A3 ("Configure identity providers and claim-to-role mappings"). This is that
        permission's first consumer: it has been seeded since `V3` with nothing ever asking it.

        **Disabled providers are in the list.** A list that hid them could not be used to enable
        one, and registration always produces a disabled provider.

        The client secret is **not here and is on no read path at all**. `clientSecretSet` is the
        boolean a form needs so it can say "leave blank to keep"; the value itself exists only in
        the database and for the length of one token exchange.
      responses:
        '200':
          description: The company's providers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IdentityProvider' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      summary: Register an identity provider
      description: |
        Gated on **`company:idp`**.

        **The provider is always created disabled**, whatever `enabled` says. Configuring an
        issuer and turning it into a live sign-in route are two acts: an issuer URL typed wrong
        is a route that refuses everybody, and the moment it goes live should be a decision
        somebody made after checking.

        `jitProvisioning` and `autoLinkVerifiedEmail` both default to **off**, and both defaults
        are the safe direction. An IdP authoritative for one organisation is not authoritative
        for who may enter a client's company; and with auto-linking on, the issuer's word about
        an email address is enough to reach an existing account's authorship.

        `issuerUri` must be **`https`**. Not a style rule: the discovery document, and therefore
        the `jwks_uri` every signature is checked against, is fetched from it.

        `key` is set once and is not read by `PUT` — it is what a client's own documentation and
        bookmarks name.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdentityProviderInput' }
      responses:
        '201':
          description: Registered, disabled
          headers:
            Location:
              description: The new provider's URL.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityProvider' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /identity-providers/email-domains:
    get:
      tags: [admin]
      summary: The email domains this company claims
      description: |
        Gated on **`company:idp`**. These are what `POST /auth/providers` resolves an address
        against.

        A claim, not proof of ownership — nothing here verifies that the client controls the
        domain, and nothing needs to: the row only decides which buttons a login form renders,
        and pressing one still ends at an issuer that has to authenticate the person.

        **Not unique across the instance.** Several companies may claim one domain, which §6r
        requires; a rejection on save would leak, by refusal, that somebody else already claimed
        it.
      responses:
        '200':
          description: The claimed domains, alphabetically
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailDomains' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [admin]
      summary: Replace the claimed email domains
      description: |
        Gated on **`company:idp`**. Replaces the whole set — the unit an administrator thinks in,
        and there is no lifecycle on a claim to preserve. Domains already claimed keep their
        original `created_at` rather than being deleted and reinserted.

        Values are lower-cased and must look like a domain (`acme.test`), not an address.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailDomains' }
      responses:
        '200':
          description: The claimed domains, as stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailDomains' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /identity-providers/{providerId}:
    # No query parameters on the path item, per §50.
    parameters:
      - name: providerId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [admin]
      summary: Reconfigure an identity provider
      description: |
        Gated on **`company:idp`**. Applies the whole edit in one write, so a request cannot
        leave a half-applied configuration behind a `200` saying otherwise.

        **`key` and `kind` are ignored** — both are set once at registration.

        **Omitting `clientSecret` keeps the stored one** rather than clearing it. No read path can
        echo the secret back, so a caller editing a display name has nothing to resend; sending an
        empty string is likewise a keep, and a public client simply never had one.

        This is where `enabled` is turned on.

        **There is no delete.** `enabled: false` is the off switch: `user_identity` rows reference
        a provider, so removing it would orphan or cascade away every federated account in the
        company, and a company that turned SSO off for a week must get its people back with their
        authorship intact.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdentityProviderInput' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityProvider' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No such provider in this company }

  /teams:
    get:
      tags: [admin]
      summary: Teams, with parent links for the org chart
      responses:
        '200':
          description: Teams
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Team' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [admin]
      summary: Create a team
      description: |
        **The org chart's first writer.** `team` has been in the schema from the beginning with
        readers (`GET /teams`, the org chart, a grant's subject column) and no writer anywhere:
        `provision-company` seeds no team, so every real company's org chart was empty and stayed
        empty, and `POST /role-assignments`' team branch — validated, tested, documented — could
        never be reached with a real `teamId`.

        Gated on **`company:teams`** at COMPANY scope (roles spec §A3: "teams, nesting, leads,
        org-chart structure"), so Company Admin and Instance Admin only. This is that permission's
        first consumer: it has been seeded and correctly granted since M0 and never once asked.

        **A team confers nothing until it is granted something.** Creating one is org-chart
        structure, not access — it is `POST /role-assignments` naming the team that gives it reach.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamInput' }
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: The new team's URL.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /teams/{teamId}:
    # No query parameters on the path item, per §50.
    parameters:
      - name: teamId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [admin]
      summary: Rename, re-describe or move a team
      description: |
        **PUT rather than PATCH, for `parentTeamId` — the same reason
        `PUT /projects/{projectId}/classification/values/{valueId}` gives.** A record deserialized
        from JSON reads an absent field and an explicit `null` identically, so under PATCH one of
        "leave the parent alone" and "make this a root team" would be unreachable. A body carrying
        every editable field has no such ambiguity.

        **Unlike a classification value, a team may actually be moved, and the difference is the
        point.** Reparenting a classification value rewrites the subtree that authored cases are
        classified by, so it is refused; a team's parent edge is **org-chart structure and never a
        permission edge** — grants do not cascade through it (plan §6k) — so moving a team changes
        a picture and confers nothing on anybody. The field that had to be refused there is the
        field this endpoint exists for.

        A `parentTeamId` that would create a **cycle**, that names the team itself, or that names
        no team in this company is a field error on `parentTeamId`. A database trigger enforces the
        same three rules as a backstop; it raises SQL states, which are not a product answer.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [admin]
      summary: Delete a team
      description: |
        A **hard** delete — a team carries no authored content of its own, so there is nothing for a
        soft delete to preserve. Its memberships go with it.

        **A team that holds grants is refused, 409**, naming the count. `role_assignment.team_id`
        is `ON DELETE CASCADE`, so deleting the team would silently revoke every grant made through
        it — and those grants are the entire reason a team is a grant subject. Mass-revoking access
        as a side effect of tidying the org chart is precisely the write an administrator must make
        deliberately: revoke the grants, then delete the team. Same shape as the refusal of a
        classification value with live children.

        **A team with child teams is refused, 409** for the same reason in the other direction:
        `parent_team_id` has no cascade, so the alternative to refusing is either a foreign-key
        error or silently promoting somebody else's sub-teams to the root.

        **A team with members is not refused.** Membership confers nothing on its own — see
        `POST /teams` — so there is nothing to revoke and nothing to warn about.
      responses:
        '204':
          description: Deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The team still holds grants, or still has child teams. `Problem.errors` carries
            `grants` and/or `children` — each one sentence naming its count and what to clear
            first, printable as it arrives, rather than "it is in use". (It has always sent
            sentences; the description said "the counts" until §149, which is the same divergence
            the classification 409 had in the other direction.)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /teams/{teamId}/members/{userId}:
    # No query parameters on the path item, per §50.
    parameters:
      - name: teamId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [admin]
      summary: Put a person in a team, or change whether they lead it
      description: |
        Idempotent by construction, which is why it is a PUT on the membership's own URL rather
        than a POST to a collection: "this person is in this team, leading it or not" is a state,
        and repeating the request is the same state.

        **The person must be a member of this company**, `ACTIVE` or `INVITED`. That check is the
        substance of this endpoint. `team_membership.user_id` references `app_user`, which is
        **instance-level with no RLS**, while `company_id` is taken from the session — so a *sibling
        company's* user id satisfies the foreign key, the company column, the RLS policy and every
        constraint on the table, and the row is stored. After that the permission evaluator, which
        resolves a user's teams through `team_membership` alone and never joins
        `company_membership`, hands them this team's grants — while the org chart renders them
        **nowhere**, because the directory resolves names through company membership and drops an
        id it cannot place. An invisible grant is worse than a leaked name. A `userId` who is not a
        member here is therefore a **404**, not a field error: the caller may not use this endpoint
        to learn who exists on the instance.

        A `REMOVED` membership is refused the same way — re-inviting them is what makes them
        staffable again, and it deliberately restores the access they had.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamMemberInput' }
      responses:
        '200':
          description: The team, with its membership as it now stands
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [admin]
      summary: Take a person out of a team
      description: |
        `204` whether they were in it or not, for the reason `DELETE /role-assignments/{id}` gives:
        a repeated request, a double-click and an id that names nobody here all end in the state
        the caller asked for.

        **This revokes whatever the team conferred on them**, immediately — the evaluator reads
        team membership on every request and no token carries grant claims. Unlike removing a
        person from the company, their session is *not* revoked: their permissions are re-resolved
        from the database on their next request anyway, and signing somebody out for an org-chart
        change they may not even be affected by is a cost with nothing behind it.
      responses:
        '204':
          description: Removed, or was not in this team
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /roles:
    get:
      tags: [admin]
      summary: Roles and their permissions
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /role-assignments:
    get:
      tags: [admin]
      summary: Role grants to users and teams
      parameters:
        - name: projectId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Assignments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RoleAssignment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [admin]
      summary: Grant a role to a user or a team
      description: |
        The only way a company member gains sight of a project. Company membership grants
        authentication and **zero project visibility** (roles spec §A1), so without this
        endpoint a provisioned company has exactly one usable account — the Company Admin
        the CLI created — and every colleague signs in to an empty project list.

        **The gate depends on the scope of the grant being made, not on one permission:**

        - `projectId` present → a PROJECT-scope grant, gated on **`project:members` on that
          project**. A Test Lead staffs their own project without being able to staff another.
        - `projectId` null → a COMPANY-scope grant, gated on **`company:members`**, which only
          Company Admin and Instance Admin hold. This is the same shape as `project:create`
          (§6 of that endpoint's description): a grant that spans every project cannot be
          authorised by a permission held on one project.

        Exactly one of `userId` and `teamId` is supplied; both or neither is a `400` keyed on
        `userId`. A role whose own `scope` disagrees with the grant being made — a COMPANY-scope
        role pinned to one project, or the reverse — is a `400` keyed on `roleId` rather than a
        silent coercion, because the two mean materially different access.

        **Re-granting an identical assignment returns the existing one with `200`**, not a
        duplicate and not a `409`. The caller's intent is "this person holds this role here",
        which is already true; a second row would give the same user two grants to revoke.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleAssignmentInput' }
      responses:
        '200':
          description: The grant already existed and is returned unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleAssignment' }
        '201':
          description: Granted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleAssignment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /role-assignments/{assignmentId}:
    parameters:
      - name: assignmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [admin]
      summary: Revoke a grant
      description: |
        Gated exactly as the grant was: `project:members` on the assignment's project for a
        PROJECT-scope grant, `company:members` for a COMPANY-scope one.

        **Revoking a grant that does not exist is a `204`**, so a double-click and a retried
        request both end in the state the caller asked for.

        A caller may not revoke the grant that is carrying their own ability to revoke —
        removing your own last `company:members` grant is a `400` keyed on `assignmentId`,
        because the alternative is a company with no administrator and no way back in
        without the operator CLI.
      responses:
        '204': { description: Revoked }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /org-chart:
    get:
      tags: [admin]
      summary: The company's people, teams and each person's effective project roles
      description: |
        One snapshot of three axes — teams, people, and the matrix cells joining them to
        projects. Assembled server-side because **the client cannot compute it, even in
        principle, for the readers this screen is for**: the only company-wide grant list on
        the wire is `GET /role-assignments`, filtered to the grants the caller could *revoke*,
        and a plain member holds `project:members` nowhere and so receives `[]`.

        **Gated on `company:read`**, which every member of a company holds through the
        non-assignable `Company Member` baseline role. Org structure is not sensitive *within*
        a company and hiding it defeats the purpose (plan §6k); inventing a key for it would be
        a 403 no administrator could grant their way out of (§84).

        **The people axis is a company fact; the project axis is the reader's own.** Person
        rows are complete — every non-`REMOVED` member, their teams, their lead flags, their
        status, all of which `GET /users` and `GET /teams` already serve to every member. The
        matrix columns are **exactly** the projects this caller holds `project:read` on. Two
        colleagues open this and see the same people and different matrices; that is the
        design, and the screen says so unconditionally rather than rendering a sparser grid in
        silence.

        A caller who somehow fails the gate gets an **empty document**, not a 403 — the same
        choice the four other identity reads make, and for the same reason: this contract
        declares only `200` on them, and inventing a status a generated client does not know
        about is the costlier divergence.

        **This is not a write surface.** No grant id appears here and nothing on it says
        whether a grant may be revoked; that invariant belongs to `GET /role-assignments` and
        stays there.
      responses:
        '200':
          description: The chart, clipped to what this caller may see
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgChart' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # --------------------------------------------------------------- audit ----
  # The company's own trail. The *instance* trail (instance_audit_event, instance:audit) is a
  # different table with no company on it and is deliberately absent from this contract: it
  # records what the OPERATOR did across companies and belongs to the M6 operator console.
  /audit-events:
    get:
      tags: [audit]
      summary: The company's audit trail, newest first
      description: |
        **Costs `audit:view`, at COMPANY scope** — Company Admin and Instance Admin only, per
        roles spec §A3. Returns acts across the whole company, project-scoped rows included, so
        this is a superset of every project log the caller could read.

        **It is not narrowed to the caller's project grants, and that is the decision.**
        `audit:view` is a company-wide administrative key held by exactly the two roles who
        already staff every project; narrowing the trail to the holder's own grants would make
        the company log unable to answer the question it exists for — *what happened here* —
        while a project they cannot open still shows in `GET /projects` to them anyway. The
        project-scoped log is the surface for readers who hold only a project grant.

        `projectId` filters this list; it does not gate it. Pass it to read one project's slice
        with the same permission, and note the answer differs from
        `GET /projects/{projectId}/audit-events` in nothing but the gate.

        The actor, sort-key and 403-not-empty-page rules are the project log's; see there.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - name: projectId
          in: query
          description: |
            One project's acts. **A filter, not a scope** — an id naming no project in this
            company matches nothing rather than 404ing, exactly as an unknown `id` does on the
            case list: refusing it would make this endpoint an oracle for which project ids exist.
          schema: { type: string, format: uuid }
        - name: actorUserId
          in: query
          description: Acts by one person. Matches `actorUserId`, so it also finds their token's acts.
          schema: { type: string, format: uuid }
        - name: action
          in: query
          description: One exact dotted verb, e.g. `case.updated`. Matched exactly, never as a prefix.
          schema: { type: string }
        - name: occurredAfter
          in: query
          description: Inclusive lower bound on `occurredAt`.
          schema: { type: string, format: date-time }
        - name: occurredBefore
          in: query
          description: Inclusive upper bound on `occurredAt`.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: The page of audit events.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AuditEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- work ----
  /work-items:
    # No parameters block on the path item, per §50: query parameters written here are
    # inherited by every operation beneath, so the board's filters would land on the POST.
    get:
      tags: [work]
      summary: Kanban board contents
      description: |
        Returns real tasks AND derived items in one list. Derived items carry
        sourceType/sourceId and are NOT stored — their status is computed from the
        source on every read, so a card can never diverge from its execution (plan §6l).

        **Four of §6l's generators are implemented.** `EXECUTION` cards come from
        assigned, unrecorded executions in live runs; `CASE_MAINTENANCE` cards come from
        `case_health`; `REVIEW` cards come from outstanding review requests (§81);
        `QUARANTINE` cards come from `case_flake`'s authored half (§121). `DOC_UPDATE` and
        `DEFECT` require features nothing computes or writes yet and are absent rather than
        empty — the `kind` enum keeps them so the SPA's labels stay complete.

        **With no `projectId` this is §6l's personal "My Work" board (§83)** — every card
        assigned to the caller across every project they can see, in one company. It is
        the same operation because it is the same list; a card carries `projectId` and
        `projectKey`, which is how the SPA groups an aggregate it did not have before.

        **With a `teamId` this is §6l's team board (§84)** — the same list kept for the
        team's members instead of for the caller. All three of §6l's boards are this one
        operation, because they differ only in which cards are kept: `projectId` narrows
        *where*, `teamId` and `mine` narrow *whose*, and the response shape and sort are
        identical in every case.

        **A team board is bounded by the CALLER's project visibility, never by the team's.**
        Two people asking for the same team's board can legitimately receive different
        boards. That is the design, not a defect: a board built from "everything assigned
        to this team" would render the case keys, titles and project names of every project
        any member was granted, to a reader granted none of them.
      parameters:
        # projectId is OPTIONAL since §83, and its absence is a DIFFERENT BOARD rather than
        # an unfiltered one — see the 400. It was declared required until then, deliberately,
        # because an optional parameter promising an aggregation no handler performed is
        # §50's defect in its worse direction. The aggregation now exists.
        - name: projectId
          in: query
          required: false
          schema: { type: string, format: uuid }
        # teamId arrives in §84, and it needed no migration, no table and no permission key —
        # the gate is the project visibility the caller already had, and every card it can
        # return is one they could already see on a project board. A key invented for it would
        # be seeded to nobody and so a 403 no administrator could grant their way out of
        # (§67/§79/§80).
        - name: teamId
          in: query
          description: |
            §6l's **team board** — items assigned to any member of this team.

            Membership is expanded **on every read**, never stored: somebody who joins the
            team today finds the team's work today, and somebody who leaves stops seeing it.
            Direct members only — a parent team does not inherit its children's members.

            **Bounded by the caller's own project visibility.** Cards from projects the
            caller holds no grant on are absent, whatever the team was assigned.

            **Combinable with `projectId`** (the team's work within one project — §6l's
            "swimlanes by member"), and **refused together with `mine=true`**: they select
            two different boards.
          required: false
          schema: { type: string, format: uuid }
        - name: mine
          in: query
          description: |
            Restrict to items assigned to the caller — the personal board.

            **Required when `projectId` is omitted** and no `teamId` is given. §6l's
            cross-project board is the *personal* one; there is no board that is every
            project's work unfiltered, and silently forcing this on would answer a request
            nobody made with a list the client cannot tell apart from a company that only
            has the caller's work in it.
          schema: { type: boolean }
      responses:
        '200':
          description: |
            Work items. **An empty array is a reachable board with nothing on it** — for a
            team board that means either a team with no members or members with no work the
            caller can see, and the two are deliberately indistinguishable on the wire: both
            are "this team has nothing for you", and a client able to tell them apart would
            be reading team membership out of a board.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WorkItem' }
        '400':
          # Two shapes, one status, and both are refusals to GUESS which board was meant:
          #  - neither a project nor a person: no projectId, no teamId, mine=false;
          #  - two boards at once: teamId together with mine=true.
          # Not a 404 — nothing failed to resolve, and the caller may make any of the requests
          # the message names. The personal board itself never 404s: it names nothing that
          # could be missing, and a member with no grants at all gets an empty array.
          $ref: '#/components/responses/BadRequest'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          # Two gates, one answer. The project read gate: an absent project, one in another
          # company, and one in this company the caller holds no grant on are indistinguishable
          # — and distinct from a 200 with an empty array, which means the board is reachable
          # and has nothing on it. And the team: an absent teamId and one belonging to another
          # company are the same 404, or this operation becomes a company-wide team-existence
          # oracle answerable by anybody with a session and a guessed UUID (§6t).
          $ref: '#/components/responses/NotFound'
    post:
      tags: [work]
      summary: Create a task
      description: |
        `workitem:manage` — Instance Admin, Company Admin, Test Lead and Test Engineer
        (roles spec §A6). Viewer and Automation Service do not hold it.

        **`kind` is not a field on the request.** Every row this creates is a `TASK`.
        A client able to POST `kind: EXECUTION` could materialise a derived item, which
        is the one thing §6l's design exists to prevent: the moment a card's status is
        stored separately from its execution's, the two diverge and the board stops being
        trusted. Derived items have no create endpoint because they are not stored.
      # Idempotency-Key arrives in §54, TOGETHER WITH THE COLUMN THAT HONOURS IT (V17) —
      # which is the whole point of how it was left. §53 refused to declare it while
      # `work_item` had no created_idempotency_key column, because that is §50's defect in
      # its worse direction: the header would sit in the reviewed spec, in schema.d.ts and
      # in autocomplete while the server ignored it, so a client would believe its retries
      # were deduplicated when every one of them created another card. The scope here is
      # (company_id, project_id, key) as it is everywhere else — and the project comes from
      # the BODY on this operation rather than from a path segment, which changes nothing
      # about the constraint and everything about where the handler reads it from.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkItemInput' }
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
              description: The new work item's canonical URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkItem' }
        '200':
          description: |
            **A replay.** The `Idempotency-Key` had already created this task, so nothing was
            created by this request — which is why it is not a 201 and carries no `Location`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /work-items/{workItemId}:
    parameters:
      - name: workItemId
        in: path
        required: true
        description: |
          A stored task's UUID. Derived items carry a synthetic, non-UUID id
          (`execution:{uuid}`), which is deliberately not addressable here — see the 409.
        schema: { type: string }
    patch:
      tags: [work]
      summary: Move a card to another column
      description: |
        `workitem:manage`. The only mutable field is `status`, because the board is the
        only screen that writes here; editing a task's title or due date is a separate
        slice with no affordance yet.

        **A derived item's id is refused with a `409`, not a `404`.** The card exists and
        the caller can see it; what is impossible is *storing* a status for it. Answering
        404 would read as "that card is gone" and invite a reload that brings it straight
        back. The message names the action that does work — move the execution.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkItemStatusUpdate' }
      responses:
        '200':
          description: Moved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            This card mirrors a source and its status is not stored. Also the answer when
            the requested column is not in the card's `allowedTransitions`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

# =============================================================================
# COMPONENTS
# =============================================================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SocialProviderKey:
      name: provider
      in: path
      required: true
      schema: { $ref: '#/components/schemas/SocialProvider' }
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      description: |
        An `attachment` row's id. Scoped by its owner as well as by its id everywhere it is
        used — the two-segment gate — so a caller cannot reach another owner's file by
        guessing this one.
      schema: { type: string, format: uuid }
    CaseId:
      name: caseId
      in: path
      required: true
      description: |
        UUID only. Display keys (TC-1) are deliberately NOT accepted here: they are
        sequential per company and therefore trivially guessable, so allowing one as a
        path identifier hands out an enumeration oracle (plan §6t). Resolve a key the
        user typed or pasted through the search endpoint, which returns not-found —
        never forbidden — for a key in a project the caller cannot reach.
      schema: { type: string, format: uuid }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExecutionId:
      name: executionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DefinitionId:
      name: definitionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChannelId:
      name: channelId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, default: 50, maximum: 200 }
    IfMatch:
      name: If-Match
      in: header
      description: |
        The `lockVersion` the client read, as a decimal string. Mismatch yields 409.

        **The precondition travels in the header, never in the body.** A PATCH body states the
        desired state; the version the client happened to read is an assertion about the state it
        started from, and mixing the two means a field on the input schema that must never be
        persisted. Omitting the header skips the check — a last-write-wins save, which is correct
        for a caller that genuinely has no prior read (an importer) and wrong for an editor, so
        the SPA always sends it.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        A key identifying one **user intent**, not one attempt. A create carrying a key that has
        already succeeded answers **200** with the resource that intent created, instead of creating
        a second one — so pressing Save again after a timeout is safe. (It said "the case" until
        §136; the parameter has been shared by six other creates since `V14`, and by report generation since `V66`.)

        The client generates it once per intent (the SPA does so when the editor mounts) and reuses
        it across retries. A key generated per attempt is the mistake that makes the header look
        right and do nothing.

        Scoped to the project the request is addressed to, which is the scope the uniqueness
        constraint behind it uses. Optional: omitted, every call creates. At most 200 characters.
      schema: { type: string, maxLength: 200 }

  responses:
    Unauthorized:
      description: |
        Not authenticated — no credential, an unreadable or expired one, or a session token that
        predates a change to what the account may do.

        **There is no body, deliberately, and this response declared one until §148.** The status
        is written by the security chain before any handler is chosen: an `HttpStatusEntryPoint`
        for the unauthenticated case, and `PermissionVersionFilter` for a session the account has
        outlived. Neither writes a document, and neither should — the four conditions that reach
        here are not distinguished on purpose, since which one failed is the answer to a probe
        rather than something the caller can act on. The remedy is the same in every case:
        authenticate again.

        A client must therefore not parse this response. `@tcms/client` already did not, and the
        workaround is what makes the point: its `problemFrom` falls back to `statusText` and its
        own test says *"the API's own 401 is bodiless"* — a consumer had written down the truth
        this contract was contradicting, and compensated for it silently rather than reporting it.

        One header is present and is worth reading: `PermissionVersionFilter`'s refusal carries
        `WWW-Authenticate: Bearer error="invalid_token"`, which names the remedy without naming
        the cause. The entry point's does not, deliberately — a challenge would make a browser
        render its own credential dialog over the SPA.
    BadRequest:
      description: |
        The request was understood and will not be stored. `Problem.errors` is keyed by the field
        name **as spelled on the input schema**, so a form can land each message on the input that
        caused it.

        Two things arrive as a 400 that a reader might expect elsewhere. A value that is legal in
        isolation but not offered by this project — a `suiteId` from another project — is a field
        error rather than a 404, because the target resolved fine and the picker is where the message
        belongs. And a field the endpoint does not yet implement is **refused rather than ignored**:
        accepting it would be a save that reports success and discards what the user typed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: |
        Not found, or not visible to this caller — one status for both, per §6t, because a
        response that distinguished them would be an oracle for ids the caller may not reach.

        **There is no body, deliberately, and this response declared one until §148.** All 94
        sites that write a 404 in this server are `ResponseEntity.notFound().build()`, and the
        emptiness is the point: a `Problem` here has nothing to say that the status has not
        already said, and everything it *could* say — which of `projectId`, `caseId` or the
        target failed to resolve — is the disclosure §6t exists to prevent. Field-level detail
        belongs on the 400, where the value was legal and merely unacceptable.

        The contract carried both spellings before this was settled: two operations declared the
        404 bodiless and 111 declared a `Problem`, and nothing compared them. `ErrorBodyPolicyTest`
        does now, in both directions — the declaration here against the source of every handler.

        **A 404 with a `Problem` body is a different answer and is not this**: that one is the
        container refusing a path with no operation at all, before routing — see
        `PreHandlerRefusal`.
    Forbidden:
      description: |
        Authenticated, and the target is one the caller may READ, but the action needs a
        permission they do not hold.

        This does not weaken the 404-not-403 rule (§6t): that rule conceals whether an id names
        anything real from a caller who cannot see it, and it still governs every read and every
        unreachable target. Once a caller has passed the read gate they already know the thing
        exists, so answering 404 on the write would conceal nothing and would instead tell an
        editor their case had vanished. An unreachable project or case stays 404 here too — 403
        is reached only after the read gate has passed.

        **The body is present on all but three sites, and a client must tolerate its absence.**
        Unlike the 401 and the 404 above, this refusal usually has something actionable to say —
        which permission, and at what scope — so it carries a `Problem` and both non-SPA clients
        print its `detail`. The three exceptions are pinned by `ErrorBodyPolicyTest` and each has
        a reason of its own: a report download is typed to a binary `Resource`, so a JSON document
        under that status is a shape the caller did not ask for; and the two artifact refusals
        (register, unregister) have no field to land a sentence on and nothing the caller can
        change about the request. A fourth cannot appear without editing that list.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Concurrent modification — reload and retry
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreHandlerRefusal:
      description: |
        A failure the **container** resolved, before or instead of any operation — an unreadable
        body, malformed JSON, an unsupported `Content-Type`, a method this path does not offer, or
        a path with no operation at all. `Problem`, exactly as a handler would have answered.

        **Referenced by no operation, deliberately**, for `TooManyRequests`' reason one step later:
        these are properties of the *request*, not of an operation, and three of them happen
        precisely when the API could not decide which operation was meant. Enumerating a 405 on
        every path would document a method that does not exist there.

        **This is recorded because it was not always true.** Spring resolves these through
        `sendError`, which hands the response to the container's own error handling, and the body
        that produced was `{timestamp, status, error, path}` — a shape this contract declares
        nowhere, arriving on the paths a machine caller hits most, where the CLI and the MCP server
        read `detail` and found none. §143 corrected the *status* on all five (each had been `401`
        for an API-token caller); §145's live pass found the *shape* still the container's; §146
        made it `Problem`.

        `detail` is a fixed sentence per status, never the exception's own message: a forwarded
        message names internal types and JSON pointers, which is neither actionable for the caller
        nor safe to publish.

        **A `404` with no body at all is a different answer and is not this.** Those are written by
        an operation that resolved nothing the caller may see (§6t), and the empty body is the
        point — see `NotFound`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    TooManyRequests:
      description: |
        The API-token rate limit. **Referenced by no operation, deliberately** — every other
        response here is declared per operation because it is a property of that operation, and
        this one is not: it is written by a servlet filter BEFORE routing, so the API refuses
        before it has decided which operation the caller meant. Enumerating it on all ~88
        operations would assert an operation-level property that does not exist, and would leave
        the 89th silently undocumented. It is described once, here and in the Conventions section
        of `info.description`, which is where a client author looks for something that can happen
        to any call.

        **Only a request authenticated by an API token can receive it.** A session is never
        counted (the failure being bounded is an agent in a loop, which a person cannot produce),
        and an unauthenticated request cannot be — there is no key to count against that the
        caller does not control.

        `Retry-After` carries whole seconds, is never zero, and is rounded up so that a client
        obeying it exactly is not refused again. `Problem.detail` repeats the same number in
        prose, because the CLI prints `detail` verbatim and an MCP host hands it to a model.

        **Nothing was changed.** The refusal is decided before dispatch, so unlike a timeout
        there is no handler that half-ran: the call may be retried as-is once the wait has
        elapsed.
      headers:
        Retry-After:
          description: Whole seconds to wait before retrying. Always present, always ≥ 1.
          required: true
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:

    # ------------------------------------------------------------ common ---
    Problem:
      type: object
      # `errors` is the one optional member: `ApiProblem` is serialized NON_NULL, so a 409 or a
      # 403 omits the key entirely rather than sending an empty object a client could read as
      # "no fields were wrong". The other four are on every problem this API emits.
      #
      # A 404 used to be this comment's example and is not one any more (§148): the operational
      # 404 has no body at all, so there is no `Problem` on it to omit a key from. The only 404
      # carrying this schema is the container's — a path with no operation, see PreHandlerRefusal.
      #
      # ~~`errors` is the one optional member.~~ → ~~**corrected §162: `instance` is a second**, and
      # it had been arriving undeclared on 123 of the 176 refusals this API can send.~~
      # → **§163: `errors` is the one optional member again, and this time it is checked.**
      # `instance` was real — measured, not reasoned: nothing in this codebase calls `setInstance`,
      # and Spring Framework's `HttpEntityMethodProcessor` / `RequestResponseBodyMethodProcessor`
      # each set it from `request.getRequestURI()` when it is null, so all twenty-one `ProblemDetail`
      # controllers were sending it by way of a default nobody here chose. §163 SUPPRESSES it
      # (`api.ProblemEnvelope`) rather than declaring it, because it is `path` under another name and
      # §146 removed `path` from the container's body: a property present on twenty-one writers and
      # absent on the other three is the asymmetry §162 spent a slice ending, and the caller already
      # has the URL it just sent. **No refusal body in this API carries the path it was sent to** —
      # `ErrorBodyPolicyTest.theProblemSchemaDeclaresNoRequestEcho` bans the name here and
      # `noRefusalBodyEchoesTheRequest` reads it off the server's own serialization, so re-declaring
      # it is a decision rather than an edit.
      #
      # Every refusal is `application/problem+json` (§162). It was declared as `application/json`
      # on 123 of them and as `application/problem+json` on one that sent `application/json` —
      # a document wrong in both directions about the type its own body arrives under, because the
      # server had two envelopes (Spring's `ProblemDetail`, and `api.Problem`) and Jackson gives
      # them different defaults. `api.ProblemEnvelope` makes it one type; this makes it one
      # declaration.
      #
      # **§164: the two envelopes are now compared as serialized keys, and this schema against the
      # record.** §163 removed the one member that differed, which left the two types agreeing with
      # nothing saying so — `ErrorBodyPolicyTest.bothEnvelopesSerializeTheSameKeys` says so, on
      # both the plain and the validation shape, and `theContractsProblemIsThisRecord` pins this
      # property list to `com.tcms.api.Problem`'s components in both directions. Adding a member
      # below without adding it to the record is now a red run rather than a broken client.
      required: [type, title, status, detail]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        # ~~instance — the path the refused request was sent to, present on the twenty-one
        # `ProblemDetail` writers and absent on the record's eight, declared optional in §162 with
        # the reconciliation named as a decision rather than taken.~~
        # → **§163 took it, and the answer is that this API sends no such property.** The decision
        # was between suppressing `instance` and amending §146's reasoning, and three of this
        # repo's own rules point the same way: §162's one-envelope rule (a refusal's shape must not
        # depend on which of four writers produced it), the cost of the other direction (the record
        # gains a component no factory can fill, `ProblemWriter` composes a path by hand in a
        # filter, and `ProblemErrorAttributes` re-adds the exact key §146 deleted — three new
        # writers to publish a value the caller already has), and §141 (a refusal earns its members
        # by what the caller can do with them; `detail` says what to do, `errors` says which field,
        # `instance` says where the caller just was).
        errors:
          type: object
          nullable: true
          description: |
            RFC-7807 `errors` — a name to the messages it failed on. **Every value is a complete
            sentence any client may print verbatim**, and that is the load-bearing half: the SPA
            lands it beside an input, `@tcms/cli` prints `name: message` under the failure, and
            `@tcms/mcp` hands the same lines to a model that cannot see a screen. A value that is
            a datum rather than a sentence — a bare count — is meaningless to two of the three.

            The key is the field's name **as it appears on the input schema** (`gherkinSource`, not
            `gherkin_source` or `caseInput.gherkinSource`) wherever the refusal is about a field the
            caller sent, because the SPA maps it straight onto a form input: a key that does not
            match a field name lands the message nowhere and the form reports a failure with
            nothing highlighted.

            ~~Present only on a validation rejection.~~ → **corrected §149**: it also names the
            *blockers* on a refusal that is not about an input at all, where the key names the
            blocking population rather than a field — `children` and `grants` on the two 409s that
            refuse a delete, `scope` on the artifact 403s. Four sites, each named in the operation
            that writes it. The rule that holds across both is the sentence one above.

            Undeclared until 2026-07-31 while both sides already implemented it — the client has
            read `body.errors` since Phase 1 and the mock has emitted it since. Documented here so
            the first real write agrees with the contract rather than with the mock.
          additionalProperties:
            type: array
            items: { type: string }

    PageMeta:
      type: object
      # Every list endpoint sends all three on every response, including an empty page — which is
      # the case that matters, since `total: 0` is what tells a grid to render "no results" rather
      # than to keep its spinner up.
      required: [page, size, total]
      properties:
        page: { type: integer }
        size: { type: integer }
        total: { type: integer }

    AuditEvent:
      description: |
        One recorded act inside this company. Append-only: nothing in this product edits or
        deletes a row, so a value read here is what was written at the time.
      type: object
      # Every property is required and nullable where the column is. A nullable-and-required
      # property is sent as `null`; an optional one may be absent, and the difference decides
      # whether a client may render "—" or must guard the read. This table's whole point is that
      # the absences are meaningful — no project, no person, no token — so none of them may be
      # spelled as "the server forgot".
      required:
        [id, projectId, actorUserId, actorUserName, actorTokenId, actorTokenName,
         action, targetType, targetIds, changes, bulkOperationId, occurredAt]
      properties:
        id: { type: string, format: uuid }
        projectId:
          type: string
          format: uuid
          nullable: true
          description: Null for a company-scope act — a member invited, a vocabulary changed.
        actorUserId:
          type: string
          format: uuid
          nullable: true
          description: |
            The person answerable for the act. Null only for an unattended job that no person
            requested. **Set alongside `actorTokenId` on a token-driven act, not instead of it.**
        actorUserName:
          type: string
          nullable: true
          description: |
            The actor's display name in this company (§6u — the membership's name, not the
            account's canonical one).

            **Offboarding does not take it away.** Removing someone sets their membership to
            `REMOVED`; it does not delete the row, and the resolver reads memberships without
            filtering on status, so a departed colleague's acts still render under their name.
            That is the behaviour an audit trail wants — "who did this" must not become
            unanswerable the day the person leaves — and it is why the row is served whole rather
            than anonymised.

            Null in exactly two cases: `actorUserId` is null, or it names a membership that no
            longer exists at all (an operator-level deletion, not an offboarding). A null name is
            therefore never evidence about the id — **read `actorUserId`, not this** — and a
            client that treats a null name as a missing row deletes history on the screen.
        actorTokenId:
          type: string
          format: uuid
          nullable: true
          description: |
            The API token the act arrived on, when a CI runner made it rather than a person at a
            keyboard. Null for an ordinary session.
        actorTokenName:
          type: string
          nullable: true
          description: |
            The token's label. **Revocation does not take it away either** — the resolver includes
            revoked tokens deliberately, because an act performed by a credential that has since
            been withdrawn is precisely the row somebody is reading this screen to explain. Null
            when `actorTokenId` is null, or when the token row is gone entirely.
        action:
          type: string
          description: |
            A stable dotted verb, e.g. `case.updated`. **Never a display string** — the server
            sends the key and the client owns the copy, which is the same split the dashboard
            makes with its tiles. There is no enum here on purpose: the set grows with every
            slice that records something, and pinning it in the contract would make adding an
            act a contract change.
          example: case.updated
        targetType:
          type: string
          description: What kind of thing was acted on, e.g. `TestCase`.
          example: TestCase
        targetIds:
          type: array
          description: |
            The things acted on — **an array because one act may cover many**. A bulk operation
            over 143 cases is one row reading "attached 2 conditions to 143 cases" rather than
            143 lines (plan §6f). A single-target act sends a list of one.
          items: { type: string, format: uuid }
        changes:
          type: string
          nullable: true
          description: |
            A JSON document of what changed, as recorded, or null. **Opaque to the client** — it
            is written per act by whichever service recorded it and has no schema across acts.
            It never contains a credential, a token or a password: this table is readable by the
            client's own administrators.
        bulkOperationId:
          type: string
          format: uuid
          nullable: true
          description: |
            Set when this row is one of many from a single bulk act, so a client can group them.
            **Nothing writes it yet** — the column is `V1`'s and the bulk services record one row
            per act rather than one per target. It is on the wire so the grouping does not become
            a contract change the day one does.
        occurredAt: { type: string, format: date-time }

    Facet:
      description: Returned alongside results so filter counts render without a second request.
      type: object
      required: [key, label, values]
      properties:
        key: { type: string, example: automationStatus }
        label: { type: string }
        values:
          type: array
          items:
            type: object
            # `required` does not descend into `items` — without this the facet chips could not
            # read their own label or count without a null check on values the server always sends.
            required: [id, label, count]
            properties:
              id: { type: string }
              label: { type: string }
              count: { type: integer }

    UserRef:
      type: object
      required: [id, displayName, email]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: string }
        avatarUrl: { type: string, nullable: true }

    # ------------------------------------------------------------- review ---
    Review:
      type: object
      # Every field a panel needs to render the record without a second call. `participations`
      # is required and may be empty: a review nobody has commented on yet is an ordinary
      # state, and an absent array would make "no verdicts" indistinguishable from "the server
      # did not send them" (§48's rule about required arrays).
      required:
        [id, subjectType, subjectId, subjectVersionNo, state, createdAt, assignees,
         participations, comments]
      properties:
        id: { type: string, format: uuid }
        subjectType: { $ref: '#/components/schemas/ReviewSubjectType' }
        subjectId: { type: string, format: uuid }
        subjectVersionNo:
          type: integer
          description: |
            The version submitted, pinned once. Compare it against the artifact's current
            version to show that the content has moved on since the reviewer was asked.
        state: { $ref: '#/components/schemas/ReviewState' }
        submittedBy:
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
          description: |
            Null when the account no longer resolves — somebody offboarded since. Nullable
            rather than omitted, because a verdict that was recorded stays recorded and the
            absence is the honest answer (§66).
        createdAt: { type: string, format: date-time }
        approvedBy:
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
        approvedAt: { type: string, format: date-time, nullable: true }
        assignees:
          type: array
          description: |
            §6g's reviewer assignment — who was **asked**, oldest request first. Distinct from
            `participations`, which is who *spoke*: a name in one and not the other is a review
            nobody has got to, which is the comparison a lead reads this panel for. Required and
            may be empty, for the reason `participations` is.
          items: { $ref: '#/components/schemas/ReviewAssignee' }
        participations:
          type: array
          items: { $ref: '#/components/schemas/ReviewParticipation' }
        comments:
          type: array
          description: |
            §6g's threads — **roots only**, each carrying its own replies. Required and may be
            empty, for the reason `participations` is: an absent array would make "nobody has
            commented" indistinguishable from "the server did not send them".
          items: { $ref: '#/components/schemas/ReviewComment' }

    ReviewAssignee:
      type: object
      # `id` is THIS REQUEST's id — what DELETE addresses — and not the assignee's. One person
      # may be asked to review several artifacts, so an assignee-keyed delete would have to send
      # the review id too and could still name a pairing that never existed.
      #
      # Exactly one of `user` and `team` is non-null on a well-formed row (the table's
      # num_nonnulls check). A flattened (kind, id, name) triple was refused: the two carry
      # different affordances — a person's row can say "that's you", a team's cannot — and
      # collapsing them makes the client re-derive from a string which it is holding.
      required: [id, assignedAt]
      properties:
        id: { type: string, format: uuid }
        user:
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
          description: |
            The person asked, or null when `team` names a team instead. Also null — with `team`
            null too — for a request whose account no longer resolves, which the client renders
            as a request nobody can action rather than dropping (§66).
        team:
          allOf: [{ $ref: '#/components/schemas/TeamRef' }]
          nullable: true
          description: |
            The team asked. §6g: *"any member of the team can action it"* — and the members are
            deliberately **not** expanded here. A panel that listed them would freeze the
            membership as it was when the page loaded and invite the reader to treat it as the
            list of people who owe a review.
        assignedBy:
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
          description: Null for an unattributable request, as every actor field here may be (§66).
        assignedAt: { type: string, format: date-time }

    TeamRef:
      type: object
      # Deliberately smaller than `Team`, which carries leads, members and the projects the
      # team's grants reach — the last of those filtered by what the CALLER may see, so serving
      # it from a review panel would mean the review record reasoning about an org-chart
      # disclosure rule.
      #
      # THREE POSITIONS SINCE §175, and it had three before that too — the other two just said
      # so inline. `ReviewAssignee.team`, `RoleAssignment.team` and `CurrentUser.teams[]` all
      # name a team the way something else renders it beside itself, and two of them declared
      # that shape anonymously: identical properties, no correspondence a generated client or a
      # convention test could see, and three Java records behind them that agreed by accident.
      # `CurrentUser.teams[]` also carried `isLead`, which §175 removed — see there.
      #
      # A field added here now reaches all three. That is the cost of the collapse and it is the
      # point of it: "what a screen renders beside something" is one decision, and this API had
      # been taking it in three places.
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    ReviewAssignmentInput:
      type: object
      # Two nullable fields with an exactly-one rule, the shape `RoleAssignmentInput` already
      # uses for the identical "a user or a team" question. A (kind, id) pair would need its own
      # enum, its own parse failure, and its own error for "kind says TEAM and the id names a
      # person" — all to express what two typed fields express by existing.
      #
      # BOTH are `required` and both are nullable, which reads oddly until the alternative is
      # written out. Leaving them optional says "sometimes absent", and the server cannot tell an
      # absent field from an explicit null — so "ask this person, nobody else" would be expressible
      # only by omission, and a client that dropped a field by accident would be indistinguishable
      # from one making a choice. `RoleAssignmentInput.projectId` is required-and-nullable for
      # exactly this reason one module over. Required also makes the exactly-one rule legible in the
      # generated type: the caller states both terms, and one of them is null.
      #
      # Sending neither and sending both are both field errors, reported on `userId` with one
      # sentence, because the field a client fixes is the same either way.
      required: [userId, teamId]
      properties:
        userId:
          type: string
          format: uuid
          nullable: true
          description: |
            One person, who must be able to **see this project** — not merely be a member of the
            company. A colleague with no grant here cannot open the artifact, so asking them
            produces a request that sits on their list for ever; the bar is the same
            `project:read` question the gate asks of the caller, so the set of people who can be
            asked is exactly the set the picker lists.

            **The submitter is refused.** Their own peer review does not count towards
            `requiredPeerReviews` — the server already skips it, on the ground that a review by
            the person who asked for it is not a second opinion — so the request could never be
            discharged. This is who *submitted* it, not who wrote the artifact: on a case written
            by an engineer and put forward by their lead, the engineer is a fine reviewer.
        teamId:
          type: string
          format: uuid
          nullable: true
          description: One team in this company, any member of which may action the request (§6g).

    ReviewComment:
      type: object
      # `replies` is required and always present, exactly one level deep: a reply's own
      # `replies` is always empty, and the server refuses a reply to a reply. Nesting is the
      # contract's job rather than every client's — assembling roots from a flat parentId list
      # is one rule, and §68's buildValueTree found two implementations of one such rule
      # disagreeing about orphans.
      required: [id, body, createdAt, replies]
      properties:
        id: { type: string, format: uuid }
        author:
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
          description: Null when the account no longer resolves — `ReviewParticipation.user`'s rule.
        body: { type: string }
        createdAt: { type: string, format: date-time }
        resolvedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Null while the thread is open, and **always null on a reply**: resolution is a
            property of the thread, so half a conversation cannot be marked dealt with.
        resolvedBy:
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
          description: |
            Who marked it dealt with — `V24`'s column. `V1` gave the table a `resolved_at` and
            no actor, which is enough to grey a thread out and not enough for the one thing the
            record exists for: proving to an auditor who did what.
        replies:
          type: array
          items: { $ref: '#/components/schemas/ReviewComment' }

    ReviewCommentInput:
      type: object
      required: [body]
      properties:
        body:
          type: string
          maxLength: 5000
          description: |
            The remark. Blank is a field error rather than a silently-dropped write: answering
            201 to one would put an empty entry in the trail.
        parentId:
          type: string
          format: uuid
          nullable: true
          description: |
            The thread root this replies to, or absent to start a thread. Validated against
            *this review's* comments — a comment on another review, and a reply to a reply, are
            both field errors carrying the same sentence, because telling them apart tells a
            caller that the id they guessed names a real comment somewhere they cannot see.

    ReviewCommentResolutionInput:
      type: object
      required: [resolved]
      properties:
        resolved:
          type: boolean
          description: |
            Required. Null is a field error rather than "leave it alone" — a body that names no
            state has not asked for anything.

    ReviewParticipation:
      type: object
      required: [id, kind, verdict, createdAt]
      properties:
        id: { type: string, format: uuid }
        user:
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
        kind:
          type: string
          enum: [PEER_REVIEW, APPROVAL]
          description: |
            `PEER_REVIEW` is advisory and moves nothing. `APPROVAL` rows are written by the
            server when the artifact's own ladder ends the review, and can never be created
            through the participations endpoint.
        verdict: { $ref: '#/components/schemas/ReviewVerdict' }
        comment: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    ReviewParticipationInput:
      type: object
      required: [verdict]
      properties:
        verdict:
          type: string
          enum: [LGTM, CHANGES_REQUESTED]
          description: |
            The two advisory verdicts, and deliberately a narrower set than `ReviewVerdict`:
            `APPROVED` and `REJECTED` end a review and belong to the artifact's status ladder.
        comment: { type: string, nullable: true }

    ReviewSubjectType:
      type: string
      enum: [CASE, SUITE, PLAN]

    ReviewState:
      type: string
      # WITHDRAWN is V22's addition and the distinction it makes is the point: the submitter
      # taking their own submission back is not a rejection, and writing one into the record a
      # team keeps to show who said what would name a reviewer who never spoke.
      enum: [IN_REVIEW, APPROVED, REJECTED, WITHDRAWN]

    ReviewVerdict:
      type: string
      enum: [LGTM, CHANGES_REQUESTED, REJECTED, APPROVED]

    EditAfterApproval:
      type: string
      # Plan §6g: "Recommend Retain + stale marker as the default, and Re-review as the opt-in
      # for teams that need it. Forcing full re-approval on a typo fix is how review processes
      # get abandoned." RETAIN is what the product has always done without it being a choice.
      enum: [RETAIN, RE_REVIEW]

    ProjectSettings:
      type: object
      description: |
        One project's §6g policy. **Flat rather than a nested `settings` object**, because a
        contract's `required` array does not descend into an inline nested object — every
        property under one comes out optional and no consumer can rely on it.
      required:
        - projectId
        - reviewEnabledCase
        - reviewEnabledSuite
        - reviewEnabledPlan
        - requiredPeerReviews
        - authorMayApproveOwnWork
        - editAfterApproval
        - requireApprovedCaseForRun
      properties:
        projectId: { type: string, format: uuid }
        reviewEnabledCase:
          type: boolean
          description: |
            §6g's opt-in for cases. **Off by default.** When false the reviewer apparatus does
            not exist for cases in this project — no review is opened, no peer verdict can be
            recorded, and the client renders no panel. The **status ladder is unaffected**:
            turning review off must not withdraw `IN_REVIEW` and `APPROVED` from a four-value
            status the team has used since M1.
        reviewEnabledSuite: { type: boolean, description: §6g's opt-in for suites. Off by default. }
        reviewEnabledPlan: { type: boolean, description: §6g's opt-in for plans. Off by default. }
        requiredPeerReviews:
          type: integer
          minimum: 0
          maximum: 20
          description: |
            §6g's "configurable minimum peer reviews before approval is offered (default 0)".
            Counted as **distinct people other than the submitter whose latest verdict is
            LGTM** — the trail is append-only precisely so that relenting in either direction
            is visible, so somebody who said LGTM and then requested changes is not standing
            behind it.

            Copied onto each review at submission and read from there, never live.
        authorMayApproveOwnWork:
          type: boolean
          description: |
            `false` — the default — means §6g's author-cannot-approve-own-work rule is **on**.
            Stored in the positive so no consumer reads a double negative. "Author" is whoever
            **submitted** the review, not whoever created the artifact.

            A review whose submitter is unattributable does not bind the rule, or the artifact
            could never be approved by anyone.
        editAfterApproval: { $ref: '#/components/schemas/EditAfterApproval' }
        requireApprovedCaseForRun:
          type: boolean
          description: |
            §6g's gating rule for cases — "a project may require APPROVED status before a case
            can be added to a run". **Opt-in and off by default**; §6g calls gating "powerful
            and genuinely obstructive".

            Enforced on the run's **resolved** case set, whether it came from an explicit
            `caseIds` list or from the expansion of a plan's scope — otherwise creating the run
            from the plan is a bypass that costs no permission. The whole run is refused with
            409 naming the offending keys, never trimmed to the approved ones: a checklist
            quietly shorter than the one that was asked for reports a pass rate over a
            denominator nobody chose.

            **Independent of `reviewEnabledCase`.** Switching review off suppresses the
            reviewer apparatus and not the status ladder, so a project can want approved-only
            runs without ever running a peer review — and ANDing the two would disable the gate
            on exactly the projects that enabled it.

            Overridable per request (`TestRunInput.overrideApprovalGate`) by a holder of
            `case:approve`, who could reach the same state by approving the cases first.
        # `requireApprovedPlanToStart` — §6g's gating rule for plans, binding on the DRAFT → ACTIVE
        # edge — was REMOVED on 2026-08-05 (§97, M7) with that edge. Its column is dropped, not left
        # unread: a policy toggle whose rule no longer exists is worse than an absent one, because
        # an administrator turns it on to stop unapproved releases and nothing happens.
        updatedBy:
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
          description: Null for a project nobody has configured — which is most of them.
        updatedAt: { type: string, format: date-time, nullable: true }

    ProjectSettingsUpdate:
      type: object
      description: |
        A full replacement. Every boolean defaults to **false** when omitted — an absent switch
        is "off", which is both §6g's default and the safe reading, and for the gating switch it
        is the only safe reading, since a dropped field that turned a gate ON could stop a
        release. `requiredPeerReviews` and `editAfterApproval` are **required**, because
        0 and RETAIN are meaningful values a dropped field would silently assert.
      required:
        - requiredPeerReviews
        - editAfterApproval
      properties:
        reviewEnabledCase: { type: boolean, default: false }
        reviewEnabledSuite: { type: boolean, default: false }
        reviewEnabledPlan: { type: boolean, default: false }
        requiredPeerReviews: { type: integer, minimum: 0, maximum: 20 }
        authorMayApproveOwnWork: { type: boolean, default: false }
        editAfterApproval: { $ref: '#/components/schemas/EditAfterApproval' }
        requireApprovedCaseForRun: { type: boolean, default: false }

    # -------------------------------------------------------------- enums ---
    LifecycleStatus:
      type: string
      enum: [DRAFT, IN_REVIEW, APPROVED, DEPRECATED]

    AutomationStatus:
      type: string
      enum: [MANUAL, TO_BE_AUTOMATED, AUTOMATED, NOT_AUTOMATABLE]

    Priority:
      type: string
      enum: [CRITICAL, HIGH, MEDIUM, LOW]

    StepFormat:
      type: string
      enum: [STRUCTURED, GHERKIN]

    StatusKind:
      type: string
      description: |
        The fixed aggregation class behind a project's own status names, so a report can roll up a
        project that renamed "Blocked" to "Environment down" without knowing any of their names.

        `WIP` joined the seeded defaults on 2026-08-05 (§97, M9): somebody is running this case
        right now. It is **not final and not a pass**, like `RETEST`, so every rollup groups it
        with `UNTESTED` as *still owed a verdict* — a case somebody picked up has no result, and
        counting it otherwise would move a pass rate on the strength of opening a screen. Existing
        projects take it on by re-running `provision-company`, which is idempotent.
      enum: [PASSED, FAILED, BLOCKED, SKIPPED, UNTESTED, RETEST, WIP]

    HealthSignal:
      type: string
      description: |
        Derived, never authored — self-heals when the cause is fixed (plan §6o). No endpoint sets
        one and none ever will: a "mark as not stale" button is a button for lying.

        **Not every member has a derivation behind it yet**, so a client must treat an absent
        signal as *"nobody has looked"* rather than as *"not raised"* — which is what
        `DashboardSummary.healthComputedAt` exists to distinguish. That rule is the same whichever
        members are derived, and it is the only thing a client has to act on.

        ~~**Five of these have a writer.** `NEVER_EXECUTED` and `LONG_UNEXECUTED` (§53),
        `FAILING_REPEATEDLY`, and — since M3 slice 5 — the §6c automation-drift pair,
        `STALE_AUTOMATION` and `UNDECLARED_AUTOMATION`. The rest are computed by nothing and are
        therefore never sent.~~ → **the enumeration is removed, not updated (§161).** It was
        stale within a day of §157 and stayed stale through §158, so it spent two slices telling
        clients that `STALE_APPROVAL` and `CONDITION_DRIFT` are never sent while the server was
        sending both. It was a second copy of a list the server already keeps — and keeps
        mechanically, in `ArchitectureRulesTest.WRITERLESS_BY_DECISION`, which fails the build when
        a member gains or loses a derivation. A copy of a computed list, in the document nobody
        recompiles, is how it goes wrong.

        `INCOMPLETE` is the one member that genuinely cannot appear: it is a column in the schema,
        it is in this enum, and there is **no server constant for it**. Kept so a client's labels
        stay complete. `ContractEnumTest` is what holds that to a decision rather than an accident,
        and §161 is why — the server-side note about this member argued the opposite, that *this
        contract* lacked the member, for as long as the member had been here.
      enum:
        - OUTDATED_SPEC_CHANGED
        - STALE_APPROVAL
        - CONDITION_DRIFT
        - STALE_AUTOMATION
        - NEVER_EXECUTED
        - LONG_UNEXECUTED
        - UNLINKED
        - FAILING_REPEATEDLY
        - ORPHANED
        - INCOMPLETE
        - UNDECLARED_AUTOMATION

    HealthSignalSeverity:
      type: string
      description: |
        How loudly a health signal reads — the server's judgement about how wrong a case is, not a
        client's.

        **ERROR** is "the case is now wrong": its spec moved, a shared condition changed under it,
        or its automation stopped reporting. **WARNING** is "this is decaying" — an approval or an
        execution old enough to stop meaning anything. **INFO** is "something is missing but nothing
        is broken", which is why `UNLINKED` is INFO and fires on most of a young project.
        **NEUTRAL** is for the tiles that are not signals at all (a lifecycle count).

        **This schema exists because the vocabulary is now declared twice and was declared inline
        once.** It was an anonymous enum on `DashboardTile.severity` alone until §179, so nothing
        compared it to the server's `HealthSignal.Severity` — §170's finding about inline shapes, at
        an enum. `ContractEnumTest` pairs it now.

        A client must not keep its own signal→severity table. That is exactly what §179 deleted:
        the SPA's copy had drifted about two of the ten members, so one case read red on a dashboard
        tile and amber on its own chip, and nothing on either side could see it.
      enum:
        - ERROR
        - WARNING
        - INFO
        - NEUTRAL

    RaisedSignal:
      type: object
      description: |
        One health signal raised on one case, with how loudly it reads.

        **`severity` is on the wire because the alternative was a second copy of it**, and the copy
        drifted (§179). Both members are derived from the same server enum in the same expression,
        so a case cannot arrive with a signal and the wrong severity beside it.

        It is repeated per case rather than sent once as a catalogue on purpose: a chip renders where
        the row is, and a catalogue would make a colour depend on a second request completing.
      required: [signal, severity]
      properties:
        signal: { $ref: '#/components/schemas/HealthSignal' }
        severity: { $ref: '#/components/schemas/HealthSignalSeverity' }

    AggregationPolicy:
      type: string
      description: |
        How a case executed many times resolves to one result (plan §6e).

        **`BEST` was removed on 2026-08-07** (plan §8 #17, applied as #47). "A case that passed
        anywhere counts as passed" is how a red suite gets reported green, and the reading it would
        have been argued against — `WORST` — is still here. It was offered on the theory that "it
        passed on the re-run" is better made in the open under a label than smuggled into a default;
        what the theory missed is that a label makes the argument *easier to win*, and the product
        has since grown the honest way to make it: flake detection (§121) says a case is unreliable
        without calling it green, and the aggregate report's variability section (§112) shows the
        retries a policy would have collapsed.

        A caller that still sends `BEST` gets a 400 naming the four that remain — not a silent
        fallback to `LATEST`, which would answer a question nobody asked with a number they would
        read as theirs.
      enum: [LATEST, LATEST_PER_CONFIG, WORST, ALL]
      default: LATEST

    # -------------------------------------------------------------- auth ---
    InvitationPreview:
      type: object
      required: [email, displayName, passwordRequired]
      properties:
        email:
          type: string
          description: The address the invitation was sent to.
        displayName:
          type: string
          description: |
            The name this company will know them by — per-membership, not global
            (plan §6u).
        passwordRequired:
          type: boolean
          description: |
            False when the address already has an account, i.e. this invitation only
            adds a membership. The accept call must then omit the password.

    AuthResult:
      type: object
      required: [token, expiresAt, user]
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/CurrentUser' }

    CurrentUser:
      allOf:
        - $ref: '#/components/schemas/UserRef'
        # ~~required on BOTH levels, deliberately: `required` does not descend, so without
        # the inner array every property of a team entry generates as optional and no
        # consumer can use one without null-checking fields that are always present.
        # This is the handoff's recurring lesson, and it recurred here.~~
        # → superseded by §175: the team entry is a `$ref` to `TeamRef`, which carries its own
        # `required`. The lesson stands wherever a shape is still written inline — it is this
        # schema's outer level, and the entry it was written for no longer exists here.
        - type: object
          required: [isSystemAdmin, teams]
          properties:
            isSystemAdmin:
              type: boolean
              description: |
                Holds a SYSTEM-scope grant. Drives affordances only — every action is
                independently checked server-side, and code checks permissions rather
                than role names (plan §6b).
            teams:
              type: array
              description: |
                The caller's teams IN THE ACTIVE COMPANY. Never across companies.

                This is the app shell's answer for a member's own teams, and the cheaper one:
                the shell needs one person's team names, and `GET /teams` would make it pay for
                the leads, members and per-caller project chips of every team in the company to
                render them.

                ~~This is the only way a member who is not a Company Admin learns their own
                teams: `GET /teams` is gated on `company:teams`, so the org chart is not
                readable to the person in it.~~ → **false; corrected 2026-08-17.** That read is
                gated on `company:read` — the `listTeams` assembler asks `readsCompany()`, and
                it has since the endpoint shipped — so the org chart has always been readable
                to the person in it, which is the opposite of what this said. Struck rather
                than deleted because it is the sentence most likely to be read by somebody
                deciding what an org chart may show, and it is the class §211/§212 named:
                prose that names a permission is a claim about the seeded catalogue, and
                nothing in this repo checks the "gated on `<key>`" form.

                The field itself survives the repair — see the paragraph above.

                **`isLead` was here until §175 and is not on the wire any more.** It said
                whether the caller leads the team, which `team_membership.is_lead` records and
                that column's own comment describes as conferring no permission — it names the
                default reviewer. Nothing read it: not `frontend/`, not `packages/`, not any
                generated client. `CurrentUser` exists to drive affordances (see
                `isSystemAdmin`), and a flag no affordance turns on is a claim nobody keeps
                correct — while its presence was the one thing making this array's entry a
                different shape from `TeamRef`. A lead is named on `Team.leads`, which is where
                the one screen that renders one reads it.
              items: { $ref: '#/components/schemas/TeamRef' }

    # ----------------------------------------------------------- project ---
    Project:
      type: object
      required: [id, key, name, archived, caseCount, myRole]
      properties:
        id: { type: string, format: uuid }
        key:
          type: string
          pattern: '^[A-Z0-9]{2,10}$'
          example: OLB
          description: |
            2-10 uppercase alphanumerics, immutable, unique per company. Used in URLs
            and labels. NOT part of a display key — those are company-scoped (§6t).
        name:
          type: string
          description: |
            A project is a FULL CLIENT PROJECT — an entire product or engagement
            ("Acme Online Banking"), not a feature area. Feature-level structure lives
            in the Feature classification dimension and the suite tree (plan §1, §6b).
          example: Acme Online Banking
        description: { type: string, nullable: true }
        archived:
          type: boolean
          description: |
            Whether this project has been retired — see `PUT /projects/{projectId}/archive`, which
            is the only thing that sets it. An archived project is **still listed here and still
            fully writable**: the flag is a label for a picker to render, not a lock, and omitting
            such a project from the list would make it unreachable rather than marked.
        caseCount: { type: integer }
        myRole:
          type: string
          nullable: true
          description: |
            The caller's role on this project, or null when they hold no project grant.
            Company membership conveys authentication and ZERO project visibility, so a
            listed project always carries a grant — but Viewer is the default, never
            Test Engineer (plan §6b).
          example: Viewer

    ProjectInput:
      type: object
      required: [key, name]
      description: |
        The body of `POST /projects`. Deliberately three fields: `archived`, `caseCount` and
        `myRole` are server-owned or computed per caller, and a field on an input schema is a
        field somebody eventually binds — a create that could set `archived` would let a project
        be born retired.
      properties:
        key:
          type: string
          pattern: '^[A-Z0-9]{2,10}$'
          example: OLB
          description: |
            Client-supplied and immutable, unique per company. Rejected with a field error on
            `key` when the company already uses it — see the endpoint description for why that is
            a 400 rather than a 409.
        name:
          type: string
          maxLength: 200
          example: Acme Online Banking
          description: |
            A whole client product or engagement, not a feature area. "Payments" is a Feature
            value or a suite folder, never a project (plan §1).
        description: { type: string, nullable: true, maxLength: 2000 }

    ProjectArchiveInput:
      type: object
      required: [archived]
      description: |
        The body of `PUT /projects/{projectId}/archive`. One field, and it is the target state
        rather than a verb: `true` retires the project, `false` brings it back, and sending the
        state the project already has is a no-op that answers `200`. A pair of verb endpoints
        would make the client decide which to call from a copy of the state it may have read
        minutes ago.
      properties:
        archived: { type: boolean }

    ClassificationDimension:
      type: object
      required: [id, key, name, cardinality, hierarchical, locked, values]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: feature }
        name: { type: string }
        cardinality: { type: string, enum: [SINGLE, MULTI] }
        hierarchical: { type: boolean }
        locked:
          type: boolean
          description: |
            The dimension belongs to the **company** rather than to this project and cannot be
            overridden per project — true for Test Type, Test Level and Execution Phase, false for
            the project's own Feature tree.

            It is **not** "read-only". It decides *which* permission may edit the dimension's
            values and at which scope: `company:vocabulary` (COMPANY scope, Company Admin and
            above) when true, `project:settings` on this project when false. A client rendering a
            vocabulary editor gates on this flag; a client rendering a picker ignores it.
        values:
          type: array
          items: { $ref: '#/components/schemas/ClassificationValue' }

    ClassificationValue:
      type: object
      # parentId and color joined `required` when the vocabulary got a writer. They were optional
      # while the only consumer was a flat list of seeded roots, where both are always null and
      # nothing reads either; a tree picker reads `parentId` on every value to place it, and an
      # optional key is one a consumer cannot rely on being sent at all. Nullable, not absent —
      # `ClassificationValueView` has served all five members since it existed, so this tightens
      # the declaration to match what the server already does (§48's repair, one schema more).
      required: [id, parentId, name, path, color]
      properties:
        id: { type: string, format: uuid }
        parentId: { type: string, format: uuid, nullable: true }
        name: { type: string }
        path: { type: string, example: 'Payments.Refunds' }
        color: { type: string, nullable: true }

    ClassificationValueInput:
      type: object
      required: [dimensionId, name, parentId, color]
      description: |
        The body of both writes. `dimensionId` is read only on the create — on the PUT the value
        already knows its dimension and a differing one is a field error rather than a move, for
        the same reason `parentId` is.

        **Every member is required, including the two nullable ones.** A write that carries the
        complete editable shape is what makes "make this a root" and "clear the colour"
        expressible; an optional `parentId` would have exactly one meaning for absent and null and
        the other would be unreachable. `required` here is about the key being *present*, not
        about the value being non-null.
      properties:
        dimensionId:
          type: string
          format: uuid
          description: |
            Which axis this value belongs to. Must be a dimension that applies to this project —
            one of the company's own plus this project's Feature. Anything else is a 404.
        name:
          type: string
          maxLength: 150
          description: |
            What a human reads. **Not** the `path`: `ltree` labels admit only `[A-Za-z0-9_]`, so
            the stored path never spells a name like "UI / E2E" and does not try to.
        parentId:
          type: string
          format: uuid
          nullable: true
          description: |
            Null for a root value — every value of a flat dimension, and a Feature tree's top
            level. Must name a **live value of the same dimension**: the foreign key alone is
            satisfied by a value of another axis, and by one belonging to another project's
            Feature tree, both of which store cleanly and resolve a taxonomy through a project the
            reader holds no grant on.
        color:
          type: string
          nullable: true
          pattern: '^#[0-9a-fA-F]{6}$'
          description: Null for everything the seed creates. `#rrggbb`, six digits, or null.

    CaseStatus:
      type: object
      required: [id, name, kind, color, countsAsPass, isFinal]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: '#/components/schemas/StatusKind' }
        color: { type: string }
        countsAsPass: { type: boolean }
        isFinal: { type: boolean }

    # -------------------------------------------------------- repository ---
    Suite:
      # ~~parentId and path~~ → REMOVED in §98. A suite is a flat named collection; there is no
      # tree to place it in, so a client neither assembles one nor renders a path. Their absence
      # from a response a client already parses is the point at which a stale build finds out.
      type: object
      required: [id, key, name, caseCount, tagRules, caseIds, lifecycleStatus, preconditions, postconditions, lockVersion]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: TS-1 }
        name: { type: string }
        description: { type: string, nullable: true }
        caseCount:
          type: integer
          description: |
            The suite's resolved membership — the cases filed in it, plus the cases added to it
            individually, plus every live case carrying any of its `tagRules`, unioned and deduped.
            Since §98 there is no subtree for it to be confused with.

            **These counts do not sum to the project's case count, and that is the design.** A case
            can belong to three suites — filed in one, added to another, tagged into a third — so
            the totals genuinely overlap. A client showing both must say so rather than leave a
            reader to discover it by subtraction.
        tagRules:
          type: array
          items: { type: string }
          description: |
            The tags this suite claims, **unioned**: a suite with `smoke` and `payments` holds every
            case carrying *either*. Deliberately the opposite of the case grid's `tag` filter, which
            ANDs — a collection is being assembled here and a list is being narrowed there.

            Matched against a case's `tags` exactly, and never against `automationTags` (plan §6c).
        caseIds:
          type: array
          items: { type: string, format: uuid }
          description: |
            The cases added to this suite **individually** — the second membership arm, for a case
            that belongs here because somebody decided so rather than because of where it is filed
            or what it is labelled. A set: order carries nothing.

            Cases that are merely *filed* here or matched by a tag rule are **not** in this list;
            it is what was explicitly added, which is what an editor has to render and reconcile.
        lifecycleStatus: { $ref: '#/components/schemas/LifecycleStatus' }
        # ~~`conditions`, ONE array~~ → **§186: TWO, `preconditions` and `postconditions`.** The
        # single array carried both kinds undifferentiated and `CaseConditionRef` has no `kind`
        # field, so a suite genuinely lost the setup/cleanup distinction that `suite_condition.kind`
        # has stored since M0 — recorded as a contract gap on `SuiteConditionView` rather than
        # worked around. It is closed the way the case endpoint already closes it: with two arrays,
        # where *which array a row is in* says what the field would have. Adding `kind` to
        # `CaseConditionRef` was the alternative and it would have put a redundant field on every
        # case row, where the two arrays already answer it.
        #
        # The rename is deliberate rather than additive. `conditions` had exactly one consumer —
        # a test fixture — so keeping it would have meant serving the same rows twice under two
        # names, which is §184's shape.
        preconditions:
          description: |
            Suite-level setup conditions, inherited by the cases **filed** in this suite (plan §6f).

            ~~and by every case beneath it~~ → **§98**: with no subtree there is no chain to walk,
            so a suite's conditions reach exactly its own filed cases. Inheritance deliberately did
            **not** widen to the other two membership arms — a case *added* to a suite, or matched
            by one of its `tagRules`, does not pick up its preconditions. Filing says where a case
            lives and the standing rules of that place apply to it; a tag rule says a collection
            wants to see it, which is not a claim about how it is run. Widening is a decision with a
            slice behind it, not a side effect of flattening.

            `inherited` is `false` and `inheritedFrom` null on every entry, by construction: read on
            a suite these are the suite's *own* attachments, and the inheritance runs downward.
          type: array
          items: { $ref: '#/components/schemas/CaseConditionRef' }
        postconditions:
          description: |
            Suite-level cleanup conditions, on the same terms as `preconditions` above. A
            postcondition is cleanup and not setup, and the two lists are resolved and deduped
            independently — the same entry may legitimately be in both ("reset the payment data" is
            setup *and* cleanup), which is what a `BOTH` library entry is for.
          type: array
          items: { $ref: '#/components/schemas/CaseConditionRef' }
        lockVersion: { type: integer }

    SuiteInput:
      # ~~parentId~~ → REMOVED in §98, with the tree it placed the suite in.
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        tagRules:
          type: array
          items: { type: string }
          description: |
            The suite's tag rules, as a **complete set** — every tag it should claim after this
            save. Omitting the field leaves them alone; sending `[]` clears them. Same rule as
            `TestCaseInput.tags`, and it matters for the same reason: a rename that never mentioned
            the rules must not empty a collection.

            Free text, trimmed and de-duplicated. A tag nothing carries is accepted, not refused —
            there is no vocabulary to check against, and a rule written before the cases are
            tagged is an ordinary way to work.
        caseIds:
          type: array
          items: { type: string, format: uuid }
          description: |
            The cases added to this suite individually, as a **complete set**. Absent leaves them
            alone; `[]` removes them all — which removes only the *added* arm and never unfiles a
            case or drops a tag rule.

            Each id must name a **live case of this project**. A sibling project's case is refused
            with a field error rather than stored: it satisfies the foreign key and the company
            check, and every later read of this suite would resolve a case through a project the
            reader was never granted.
        preconditions:
          type: array
          items: { $ref: '#/components/schemas/CaseConditionInput' }
          description: |
            The suite's setup conditions, as a **complete set** — absent leaves them alone, `[]`
            detaches them all. `tagRules`' rule, for the same reason: a rename that never mentioned
            the conditions must not empty a standing procedure.

            **This is the first write path `suite_condition` has ever had.** The table, its `kind`
            column and the whole read side shipped in M0; the rows could only be created by hand-
            written SQL, which is what the suite fixtures in the test suite actually did. `§186`.

            Same rules as `TestCaseInput.preconditions`, which this reuses in full: the reference
            form only (`inlineBody` is refused with a field error, not swallowed), each id must name
            a live entry **of this project** or one this suite already attaches, order is the
            content and position is assigned from array order, and a repeat inside one list is
            de-duplicated rather than refused.
        postconditions:
          type: array
          items: { $ref: '#/components/schemas/CaseConditionInput' }
          description: |
            The suite's cleanup conditions, on the terms `preconditions` sets out. The two lists are
            independent — the same entry in both is legitimate and common.

    CaseStatusInput:
      type: object
      required: [status]
      properties:
        # A schema of its own rather than a reuse of `SuiteStatusInput`, and the two are
        # byte-identical today. They are separate because the operations they belong to are, and a
        # shared input would make a future field on one of them either a field on both or a
        # rename — the pairing rule in ContractConventionTest checks each against the record that
        # serves it, and there are two records.
        #
        # All four values, not only the ones a given case can reach: which moves are legal is a
        # property of the case's current state, which the server holds and the client's copy of may
        # be one save behind. Reviving a deprecated case is spelled DRAFT, not APPROVED, which is
        # exactly the kind of rule that does not survive being written down twice.
        status: { $ref: '#/components/schemas/LifecycleStatus' }

    SuiteStatusInput:
      type: object
      required: [status]
      properties:
        # All four values, not only the ones a given suite can reach: which moves are legal is a
        # property of the suite's current state, which the server holds and the client's copy of may
        # be one save behind. A client that filtered this list would be holding a second copy of the
        # ladder — and reviving a deprecated suite is spelled DRAFT, not APPROVED, which is exactly
        # the kind of rule that does not survive being written down twice. `PlanStatusInput` says
        # the same thing about the same shape.
        status: { $ref: '#/components/schemas/LifecycleStatus' }

    TestCaseSummary:
      type: object
      required: [id, key, keySeq, title, suiteId, suiteName, priority, lifecycleStatus, automationStatus, stepFormat, owner, createdBy, features, tags, healthSignals, lastResult, updatedAt]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: TC-1 }
        keySeq: { type: integer, description: Sort by this — text keys do not order correctly. }
        title: { type: string }
        # Both nullable since a suite became a resolvable collection: a case may be filed in no
        # folder at all. Still REQUIRED — an explicit null is what tells the grid to render the
        # "unfiled" affordance, where an absent key would read as a field the server forgot. They
        # are null together or set together; a case with a suite id and no name is not a state the
        # server can produce.
        suiteId: { type: string, format: uuid, nullable: true }
        suiteName: { type: string, nullable: true }
        priority: { $ref: '#/components/schemas/Priority' }
        lifecycleStatus: { $ref: '#/components/schemas/LifecycleStatus' }
        automationStatus: { $ref: '#/components/schemas/AutomationStatus' }
        stepFormat: { $ref: '#/components/schemas/StepFormat' }
        owner:
          # Nullable because test_case.owner_id is. A case can exist with no owner (an
          # import, or an owner offboarded from the company), and the three ways to answer
          # that are: omit the row from the list, invent an owner, or say so. Only the last
          # is true — and the first loses a case from its own project's list.
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
        createdBy:
          # WHO WROTE THE CASE — and it is NOT `owner`, which is who is responsible for it now.
          # The two diverge routinely (a case is authored once and reassigned), and only this one
          # is what the server's OWN arm compares (`test_case.created_by`). No seeded grant has
          # carried OWN since `V51` (§207); the field stays on the wire because the qualifier is
          # data and the client's twin arm (`useCan.canOnAuthored`) is retained with it (roles
          # spec §A5). Until this field existed the
          # client had no way to ask the same question, so the Delete button enabled for every
          # case and a Test Engineer learned which ones were theirs by being refused.
          #
          # Nullable because `test_case.created_by` is: rows written before authorship was
          # recorded have none. That is the arm that matters — the server answers a null author
          # with `false` for an OWN grant ("your own work" must not stretch to work nobody can
          # attribute), so the client must render those disabled rather than treating an absent
          # author as a match.
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
        testType: { type: string, nullable: true }
        testLevel: { type: string, nullable: true }
        features:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
        healthSignals:
          type: array
          # WORST FIRST, and the order is part of the answer rather than a convenience. The grid
          # renders the FIRST signal and an overflow count, so a list in enum-declaration order put
          # `UNLINKED` (INFO, and true of most of a young project since §178) in front of
          # `STALE_AUTOMATION` (ERROR) and showed the missing link while hiding the broken case.
          # `DashboardService.health` sorts its tiles for the same reason and says so in the same
          # words; a client that re-sorted would be holding a second copy of a severity ranking,
          # which is the copy §179 deleted.
          items: { $ref: '#/components/schemas/RaisedSignal' }
        lastResult:
          type: object
          nullable: true
          # The whole object is null for a case that has never been executed; when it IS present
          # every member is, `releaseVersion` as an explicit null for a run outside a release.
          # Nullability belongs on the object, not on its members — a half-populated last result
          # is not a state the server can produce.
          #
          # SERVED SINCE §166, and it was declared here from M0 with nothing behind it. What that
          # cost while it was unserved is worth keeping, because it is not "an empty column": the
          # SPA renders a missing lastResult as "Never run", so EVERY CASE IN THE PRODUCT read
          # "Never run" — including ones with recorded executions, and including one a tester had
          # just recorded a result on. A confident falsehood, since `execution` shipped in §117.
          #
          # It is REQUIRED as of §166, which is a change of declaration and not of shape. The
          # server has one rendering path for it and that path always emits the key (Jackson's
          # default inclusion; there is no @JsonInclude here), so "always present, sometimes null"
          # is what the response actually is — the same sentence the TestCase branch below writes
          # out for its own nullable scalars. Leaving it optional would have meant a consumer
          # cannot tell "this case has never run" from "this endpoint does not serve the field",
          # which is precisely the distinction that was live and unanswerable until this slice.
          #
          # Sourced from case_health, NOT from test_execution: `repository` may not import
          # `execution` (plan §3), so ExecutionFacts derives it into that read model on the
          # execution.results_changed event and on the hourly schedule, and the request path reads
          # a table its own module owns. never_executed, long_unexecuted and this are one fact
          # computed by one statement — see V45's header for why they share a row.
          required: [statusKind, executedAt, releaseVersion]
          properties:
            statusKind: { $ref: '#/components/schemas/StatusKind' }
            executedAt: { type: string, format: date-time }
            releaseVersion: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time }

    TestCase:
      allOf:
        - $ref: '#/components/schemas/TestCaseSummary'
        - type: object
          # `required` does NOT descend from the parent schema, and an allOf branch needs its own —
          # without this every field below generated as optional and `lockVersion` could not be sent
          # as If-Match without a null check on a value the server always emits. Handoff §6 lesson 3,
          # found by `tsc` the moment a consumer relied on one of them.
          #
          # The nullable scalars are listed too, because the server emits the KEY with a null value
          # rather than omitting it — "always present, sometimes null" is what nullable+required says,
          # and leaving them out would mean a consumer cannot tell an unset objective from a field
          # this endpoint does not serve.
          #
          # ~~relatedDocuments is deliberately ABSENT~~ → SERVED SINCE §167, and required, which is
          # what the paragraph this replaces predicted. It said the obstacle was the module boundary
          # — `repository` may not import `documentation` — and that the field therefore had to
          # arrive as a read model fed by events (§3 lesson 4) rather than as a join. It did:
          # DocumentationFacts mirrors doc_link into `case_doc_link` on the
          # documentation.links_changed event and on the hourly recompute, and nothing on the
          # request path names a documentation table. §166 closed the other half of the pair
          # (lastResult) the same way one section earlier.
          #
          # WHAT IT COST WHILE IT WAS ABSENT, kept because it is what the repair was measured
          # against: a link made from a doc block to a case was never shown on the case.
          # `CaseDetailPage` read `data.relatedDocuments ?? []` and rendered a panel saying "Not
          # linked to any specification. Nothing traces this case back to a requirement." — about
          # every case in the product, including ones linked from the doc page minutes earlier.
          # The old reason for the absence was that the `documentation` module "does not exist"; it
          # is 57 files, and §165 is where that stopped being the argument.
          #
          # REQUIRED, and an empty array is the ordinary state. The alternative — omitting the key
          # when a case has no links — would hand a consumer two spellings of nothing to tell apart,
          # which is the defect §121 phase 4 shipped one field up on this same response. What the
          # array CANNOT distinguish is "no links" from "the mirror has never been refreshed", which
          # V46 §5 argues is acceptable because the window is bounded by the next tick — unlike the
          # five signals §156 found, which had no writer at all.
          required:
            - description
            - objective
            - expectedOutcome
            - severity
            - estimatedDurationSec
            - automationTags
            - automationKey
            - notAutomatableReason
            - gherkinSource
            - steps
            - preconditions
            - postconditions
            - currentVersionNo
            - lockVersion
            - classificationValueIds
            - flake
            - attachments
            - relatedDocuments
            - declinedPreconditions
            - declinedPostconditions
          properties:
            attachments:
              type: array
              items: { $ref: '#/components/schemas/Attachment' }
              description: |
                Files on the case's **definition** — a spec extract, a reference screenshot, a
                data sheet the steps read from. `attachment.owner_type = 'CASE'`, which `V1`
                declared and nothing wrote until decision round 3's #49.

                **Not evidence**, and the distinction is the whole of why `STEP` left the
                `CHECK` in `V39`: what a step looked like when somebody ran it on Tuesday is a
                `STEP_RESULT` attachment, written since §67 and served under
                `/runs/{runId}/executions/…/evidence`. A file here is authored content, versioned
                with the case and copied by a clone.

                **Never null and never absent** — empty is the ordinary state. Unlike `flake`
                one field up there is no third state to distinguish: no `case_flake` row means
                "nobody has looked", while no `attachment` row simply means nothing is attached.
                A nullable list would hand the SPA two spellings of nothing to tell apart, which
                is the defect §121 phase 4 found on the field above.

                Detail only, for `flake`'s reason: a paperclip count is not worth a per-row join
                on the hottest list read in the product.
            flake:
              # The detail carries it and the summary does not, for `classificationValueIds`'
              # reason one field down: the grid draws a case's *state*, and flake evidence is
              # read while deciding what to do about one case. A per-row join on the hottest
              # list read in the product would buy a column nobody asked for.
              #
              # Nullable, and the null is load-bearing: it means NO `case_flake` ROW EXISTS —
              # the recompute has never reached this case. That is a third state, distinct from
              # both `flakeScore: null` (a row exists, below the evidence floor, "not enough
              # evidence to say") and `flakeScore: 0` ("evidently stable"). Rendering any two of
              # the three alike is the defect this field ships counts to prevent.
              allOf: [{ $ref: '#/components/schemas/CaseFlake' }]
              nullable: true
            classificationValueIds:
              type: array
              items: { type: string, format: uuid }
              description: |
                Every classification value this case carries, as ids — the same assignments
                `testType`, `testLevel` and `features` render by name.

                **The detail carries ids and the summary does not**, deliberately. Names are for
                display and the grid needs nothing else; ids are what an *editor* needs, because
                a name cannot be turned back into a value. The Feature dimension is hierarchical,
                so two leaves under different parents may legitimately share a name, and the three
                company-level vocabularies are renameable per company. Without this field the
                editor would have to guess which value a name meant, and its first save would
                silently rewrite the case's classification.

                **Filtered exactly as the names are**: a value retired since it was assigned is
                absent here and absent from `features`/`testType`/`testLevel`, so the two can
                never disagree about what this case is classified as. The assignment itself
                survives in the database — retiring a value is a soft delete precisely because
                cases and executions already reference it — and a save leaves it alone rather
                than deleting it, since a client cannot preserve a value it was never shown. See
                `TestCaseInput.classificationValueIds` for the write side of that rule.
            description: { type: string, nullable: true }
            objective: { type: string, nullable: true }
            expectedOutcome:
              type: string
              nullable: true
              description: Case-level, alongside per-step expected results (plan §6m).
            severity:
              # Nullable because test_case.severity is — priority is NOT NULL DEFAULT 'MEDIUM'
              # and this column has no default at all, which is the schema saying the two are
              # different fields. A team that does not distinguish "how bad is a failure" from
              # "how soon should it run" leaves it unset rather than being made to repeat itself,
              # and inventing MEDIUM here would put a judgement on the wire that nobody made.
              # Same divergence, resolved the same way, as TestCaseSummary.owner.
              allOf: [{ $ref: '#/components/schemas/Priority' }]
              nullable: true
            estimatedDurationSec: { type: integer, nullable: true }
            automationTags:
              type: array
              items: { type: string }
            automationKey:
              type: string
              nullable: true
              description: |
                The single stable identifier a CI result carries back — FQCN#method, a Cucumber
                scenario URI, or an explicit annotation value. Unique per COMPANY (plan §6c), so
                a CI job posts results without knowing which project owns the case, and a case
                moved between projects does not change where its key resolves. Distinct from
                automationTags, which are for *selection* (@smoke), not matching.
            notAutomatableReason: { type: string, nullable: true }
            gherkinSource: { type: string, nullable: true }
            steps:
              type: array
              items: { $ref: '#/components/schemas/TestStep' }
            preconditions:
              type: array
              items: { $ref: '#/components/schemas/CaseConditionRef' }
            postconditions:
              type: array
              items: { $ref: '#/components/schemas/CaseConditionRef' }
            declinedPreconditions:
              type: array
              items: { $ref: '#/components/schemas/CaseConditionRef' }
              description: |
                **The inherited setup conditions this case has declined** (§6f's opt-out), and the
                reason it is a separate list rather than a flag on `preconditions`.

                `preconditions` is the *procedure* — what a tester performs before running this
                case. A declined entry is not part of it, and it must not be, because that array is
                what `test_case_version.snapshot` records and what a run pins from: a flag would put
                the row into the execution checklist of every run started after the decline, marked
                by a boolean the pin's reader does not know about. So the resolved lists keep
                meaning exactly what they meant, and the declines are stated beside them.

                Every entry is a `suite_condition` attachment that **currently reaches this case** —
                the same suite chain `preconditions` is resolved over.

                ~~An opt-out whose attachment no longer reaches the case (the case moved folders, or
                the library entry was retired) is **not** listed, and a save that does not mention it
                does not remove it.~~ → **§192 split those two causes**, because only one of them can
                produce a row this list will never show again.

                **Moving the case ENDS the declines its new folder does not impose**, whether the
                move arrives as a `suiteId` on `PATCH /cases/{caseId}` or as a bulk `MOVE_TO_SUITE`,
                and the version the move writes hashes the case without them. A decline is an
                exception to a rule the case's folder imposes; since §98 a case inherits from the
                folder it is *filed* in and from nothing else, so relocating it is the one act that
                decides which standing rules govern it. `POST /cases/{caseId}/clone` has answered the
                same question the same way since §129 — a clone landing outside the source's folder
                carries none. A save may still *restate* a decline it is moving away from: the ids
                are validated against the folder the client was looking at, so a client echoing back
                what this response served is never a 400. It is simply not retained.

                **Retiring the library entry does NOT.** That attachment still belongs to the case's
                own folder, so the row survives a save that cannot mention it — nothing renders a
                withdrawn procedure, so it is on no list while the entry is retired, and restoring
                the entry brings the rule, the decline and its toggle back together.
                `CaseConditions.reconcileOptouts` carries both bounds and the reason for each.

                Detail only. Empty is the ordinary state — a case inherits everything above it
                unless something says otherwise — and it is required rather than omitted for
                `relatedDocuments`' reason: two spellings of nothing is a distinction no consumer
                should have to make.
            declinedPostconditions:
              type: array
              items: { $ref: '#/components/schemas/CaseConditionRef' }
              description: The cleanup half of `declinedPreconditions`, split by kind for the reason
                `CaseConditionRef` has no `kind` field.
            relatedDocuments:
              type: array
              items: { $ref: '#/components/schemas/DocLink' }
              description: |
                **The specification points this case claims to verify** — the case end of the
                same edge `DocBlock.links` renders from the block end (§6i).

                Served from `case_doc_link`, a read model in `repository` mirrored out of
                `doc_link` by `DocumentationFacts`: the request path may not read the
                `documentation` module's tables, so the page's key and title and the block's
                excerpt are **copied** and refresh on the `documentation.links_changed` event and
                on the hourly recompute. Everything here is therefore as of the last refresh,
                which is the ordinary property of a read model and the reason `stale` below is a
                stored comparison rather than a live one.

                **Never null and never absent.** Empty is the ordinary state and means the case
                has no links — it does not mean the question was not asked. Detail only: the grid
                draws what a case *is*, and traceability is read while deciding what to do about
                one case.
            currentVersionNo: { type: integer }
            lockVersion: { type: integer }

    TestCaseInput:
      type: object
      # ~~`required: [title]`~~ → **superseded 2026-08-08 (§144): the server requires four, and has
      # since M0.** `CaseEdit.validate` answers a 400 keyed on `stepFormat`, `priority` and
      # `automationStatus` when any of them is absent, on create *and* on edit, with its reasons
      # written down — so the CONTRACT was the thing that was wrong, in the direction that
      # generates broken clients. Both copies of the generated types made three mandatory fields
      # optional, and `packages/mcp`'s `tcms_write_case` repeated the claim to a model.
      #
      # Its sharpest consequence, driven end to end in §143: `POST …/ai-proposals` stores its
      # payload unvalidated by design and the create-path validation runs at ACCEPT, so a proposal
      # filed against this schema's own required list was filed 201, sat PENDING, and answered the
      # human reviewer's accept with a 400 on three fields that are not on the proposal and cannot
      # be edited there. **Every proposal a model filed was dead on arrival**, and the accept
      # description's word for that 400 — "drift" — described a payload that had never been valid.
      #
      # Four and not more. `steps` is required only when `stepFormat` is STRUCTURED,
      # `gherkinSource` only when it is GHERKIN, `automationKey` only for AUTOMATED and
      # `notAutomatableReason` only for NOT_AUTOMATABLE — conditional requirements this schema
      # cannot state without a `oneOf` that would split the shape in four for four fields. They
      # stay optional here and refused there, which is the honest arrangement rather than a
      # complete one.
      #
      # **This does not make the PATCH partial** — it is not, and `CaseUpdateRequest`'s header
      # declines to make it so (it needs `JsonNullable` or a presence map). An omitted nullable
      # scalar is CLEARED, so an edit sends the whole editable set. `@tcms/client`'s
      # `core/rewrite.ts` is what the two non-SPA clients use to obey that.
      required: [title, stepFormat, priority, automationStatus]
      properties:
        title: { type: string }
        suiteId:
          type: string
          format: uuid
          nullable: true
          description: |
            The folder to **file** this case in, or null for an unfiled case. No longer required:
            a suite is a resolvable collection — its members are the cases filed in it, the cases
            added to it individually, and every case carrying any of its tags — so filing is one
            way of belonging rather than a precondition for existing. A case may be written before
            anybody has decided where it goes.

            Must name a **live suite of this project**. A sibling project's suite is refused with a
            field error: it belongs to the same company, so it satisfies the foreign key and the
            company check, and every later read would resolve it through a project the reader was
            never granted.

            **Absent and null mean different things on `PATCH`**, as everywhere else on this shape:
            omitting the key leaves the case where it is, sending null unfiles it.
        description: { type: string, nullable: true }
        objective: { type: string, nullable: true }
        expectedOutcome: { type: string, nullable: true }
        stepFormat: { $ref: '#/components/schemas/StepFormat' }
        gherkinSource: { type: string, nullable: true }
        priority: { $ref: '#/components/schemas/Priority' }
        severity: { $ref: '#/components/schemas/Priority' }
        automationStatus: { $ref: '#/components/schemas/AutomationStatus' }
        automationKey: { type: string, nullable: true }
        automationTags:
          type: array
          items: { type: string }
        notAutomatableReason: { type: string, nullable: true }
        estimatedDurationSec: { type: integer, nullable: true }
        ownerId: { type: string, format: uuid, nullable: true }
        classificationValueIds:
          type: array
          items: { type: string, format: uuid }
          description: |
            The case's classification, as a **complete set** — every value it should carry after
            this save. Omitting the field leaves the classification alone; sending `[]` clears it.

            Each id must name a **live value of a dimension this project offers** — the company's
            Test Type / Test Level / Execution Phase, or this project's own Feature tree. A value
            from a *sibling project's* Feature dimension is refused with a field error rather than
            stored: it belongs to the same company, so it satisfies the foreign key and the
            company check, and every later read would resolve it through a project the reader was
            never granted. The same argument `suiteId` makes, on the other column that needed it —
            and `TestStepInput.sharedStepId` made until §239 retired it.

            **At most one value per SINGLE-cardinality dimension** (Test Type and Test Level; plan
            §6d). A second is a `400` keyed on this field, not the `23505` the V2 trigger would
            raise — the trigger is the backstop that holds when this check is wrong, and a
            constraint violation reaching the client is a 500 where a form error belongs.

            A **parent** value in the Feature tree is assignable, not only a leaf. Nothing in the
            product forbids it, and §6q's rule that a feature filter includes its descendants is
            about reading, not about what may be assigned.

            **The reconcile is bounded by the vocabulary the caller was served.** Assignments to
            values retired since they were made are neither returned by `GET` nor removed by a
            save that omits them — a client cannot resubmit a value it was never shown, so
            treating its absence as an instruction to delete would make every save silently
            discard classifications nobody chose to drop.
        tags:
          type: array
          items: { type: string }
          description: |
            The case's tags, as a **complete set** — every tag it should carry after this save.
            Omitting the field leaves them alone; sending `[]` clears them. The same absent-versus-
            empty rule as `classificationValueIds`, and it matters more here: a bulk action
            reconstructs a request without mentioning tags, so reading absent as "clear" would have
            every move quietly strip a case out of every tag-resolved suite it was in.

            Free text, trimmed, deduplicated, and **matched exactly** where a suite's tag rules are
            resolved — same spelling, same case. Duplicates after trimming are collapsed rather than
            refused; `case_tag`'s primary key says a tag list is a set.

            **Not `automationTags`**, which are the selection tags a CI runner filters on (plan
            §6c). These are the organisational labels the grid shows and the ones a suite's tag
            rules resolve against; merging the two would make "run the smoke suite" and "cases the
            release manager flagged" the same query.
        steps:
          type: array
          items: { $ref: '#/components/schemas/TestStepInput' }
        preconditions:
          type: array
          items: { $ref: '#/components/schemas/CaseConditionInput' }
        postconditions:
          type: array
          items: { $ref: '#/components/schemas/CaseConditionInput' }
        declinedConditionIds:
          type: array
          items: { type: string, format: uuid }
          description: |
            **The inherited attachments this case declines** — the ids served as
            `TestCase.declinedPreconditions[].id` and `declinedPostconditions[].id`, which are
            `suite_condition` row ids and not library `condition` ids. Keyed on the attachment
            deliberately: "Log in" attached at *Billing* and again at *Billing › Refunds* is two
            attachments, and declining the first must leave the second in force.

            A **complete set** — every attachment this case should decline after this save. Absent
            leaves the declines alone; `[]` clears them all. The same absent-versus-empty rule
            `tags` and `classificationValueIds` use, and it matters here for their reason: a bulk
            action reconstructs a request without mentioning declines, and reading absent as
            "clear" would make the *reason* a decline ended depend on which client sent the save.
            What ends one is stated below, not inferred from an omission.

            Unordered — a set, not a procedure — so it is sorted and de-duplicated before it is
            hashed into the case's content version. Both kinds go in one array because a
            `suite_condition` id already determines its kind; splitting it would let a caller
            file an id under the wrong one.

            Validated against the attachments that **currently reach this case** — the folder the
            case is stored in as this request arrives, which is the one the client was looking at.
            An id that names no such attachment is a field error rather than a stored row nothing
            can ever show. **A `suiteId` on the same request does not move that goalpost**: it is
            legitimate to restate a decline while relocating a case, and the relocation is what ends
            it rather than a refusal. See `TestCase.declinedPreconditions` for which of the two ways
            a decline stops applying ends the row and which does not.
        changeComment:
          type: string
          nullable: true
          description: Optional by design — mandatory comments produce a thousand "update"s.

    TestStep:
      type: object
      required: [id, position, action]
      properties:
        id:
          type: string
          format: uuid
          description: Stable — results and evidence anchor here, so reordering is safe (plan §6m).
        position: { type: integer }
        keyword:
          type: string
          nullable: true
          enum: [GIVEN, WHEN, THEN, AND, BUT, null]
        action: { type: string }
        testData: { type: string, nullable: true }
        expectedResult: { type: string, nullable: true }

    TestStepInput:
      type: object
      required: [action]
      properties:
        id: { type: string, format: uuid, nullable: true }
        keyword: { type: string, nullable: true }
        action: { type: string }
        testData: { type: string, nullable: true }
        expectedResult: { type: string, nullable: true }
    StepSuggestion:
      type: object
      required: [action, testData, expectedResult, useCount]
      properties:
        action: { type: string }
        testData:
          type: string
          nullable: true
          description: |
            Required in the schema sense — the property is always present — but nullable, because a
            step legitimately has no test data. Listed in `required` so a consumer can rely on the
            key existing and fill the field with `null` rather than skipping it; a pick must clear
            the author's field when the suggestion has no value, not leave the previous one behind.
        expectedResult:
          type: string
          nullable: true
          description: As `testData` — always present, sometimes null, and a pick clears the field.
        useCount:
          type: integer
          description: |
            Distinct live cases using this exact triple. The ranking signal; also shown next to the
            suggestion, because "used by 412 cases" is what tells an author they are about to write
            the project's twenty-first wording of a step it already has.

    # ------------------------------------------------- generated proposals ---
    #
    # Plan §6w.6. Three schemas and three enums for one boundary: a generated case waits here
    # instead of landing in `test_case`, and a person decides it.

    ProposalStatus:
      type: string
      description: |
        `SUPERSEDED` is in §6w.6's sketch and is deliberately **not** here: nothing in this product
        displaces a proposal, so it is a status no code can set and a filter option that always
        returns nothing. It arrives with the generation job that can produce a second proposal for
        one subject.
      enum: [PENDING, ACCEPTED, REJECTED]

    ProposalVerdict:
      type: string
      description: |
        What the proposer **claims** about grounding. What that claim is worth is `VerdictSource`'s
        question, and the two are separate on purpose.

        `UNVERIFIED` is a first-class verdict and the honest default, not an error state (§6w.6): it
        is what every proposal carries where there is no critic, and what one falls back to when a
        critic times out. Render it as *"not independently checked — review against the spec"*.
      enum: [GROUNDED, PARTIAL, HALLUCINATED, UNVERIFIED]

    VerdictSource:
      type: string
      description: |
        Who checked (§6w.1a). `NONE` — nobody but the reviewer will. `EXTERNAL` — a connecting agent
        asserted it, which is recorded, shown, attributed, and **never counted as verified**,
        because TCMS cannot see that agent's critic, its isolation or its prompt.

        **Derived by the server**, never sent: there is no request field, and the database's `CHECK`
        does not permit a third value. `TCMS_VERIFIED` — TCMS ran the isolated critic itself — is
        absent until something exists to write it.
      enum: [NONE, EXTERNAL]

    AiProposalInput:
      type: object
      required: [testCase]
      properties:
        testCase:
          allOf: [{ $ref: '#/components/schemas/TestCaseInput' }]
          description: |
            The proposed case, in the shape `POST /cases` takes — because accepting hands exactly
            this to the create path.
        verdict:
          allOf: [{ $ref: '#/components/schemas/ProposalVerdict' }]
          description: |
            Optional. **Absent is not the same as `UNVERIFIED`**: both store the verdict
            `UNVERIFIED`, and they differ in `verdictSource` — nobody claimed anything, against an
            agent claiming it had not checked. The reviewer sees a different sentence for each.
        grounding:
          type: object
          additionalProperties: true
          nullable: true
          description: |
            Per-step findings, including rejections and unverified claims. Free-form on purpose, and
            displayed rather than interpreted — never as HTML.

    ProposalRejection:
      type: object
      # `note` is REQUIRED AND NULLABLE rather than absent-when-unknown, which is the shape the
      # contract convention asks for and the right one here: "always present, sometimes null". A
      # reviewer who gives no reason sends `{"note": null}`, so there is exactly one shape on the
      # wire instead of three (no body, empty body, null field) that the server would have to agree
      # about with every client separately.
      required: [note]
      properties:
        note:
          type: string
          nullable: true
          maxLength: 2000
          description: |
            Why, in the reviewer's words. **Optional in substance, required as a key** — send null
            when there is no reason. Kept: the first note survives a second rejection of the same
            proposal, so a stray second click cannot erase it.

    AiProposalSummary:
      type: object
      required: [id, title, verdict, verdictSource, status, createdAt, filedByAgent, stepCount]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        suiteId: { type: string, format: uuid, nullable: true }
        verdict: { $ref: '#/components/schemas/ProposalVerdict' }
        verdictSource: { $ref: '#/components/schemas/VerdictSource' }
        status: { $ref: '#/components/schemas/ProposalStatus' }
        createdAt: { type: string, format: date-time }
        createdBy:
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
          description: The person answerable — a token's **owner** on an agent-filed proposal.
        filedByAgent:
          type: boolean
          description: |
            Whether a credential filed this, rather than *which* one. The token's name would be
            richer and this module may not fetch it; a raw token id was refused on §100's rule. What
            changes a reviewer's reading is "Ana's agent filed this" against "Ana typed this", and
            which of Ana's tokens it was belongs to the audit trail, which records it.
        stepCount:
          type: integer
          description: |
            Read off the stored payload rather than stored beside it — a count that can disagree
            with the thing it counts is a second fact. A payload that cannot be parsed counts zero,
            because that row is exactly the one a reviewer needs to open and reject.

    AiProposal:
      type: object
      required:
        [id, projectId, title, verdict, verdictSource, status, createdAt, filedByAgent]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        suiteId: { type: string, format: uuid, nullable: true }
        title: { type: string }
        testCase:
          allOf: [{ $ref: '#/components/schemas/TestCaseInput' }]
          nullable: true
          description: |
            The proposed case as it was filed. **Nullable, and null means unreadable** — a payload
            stored before a field left `TestCaseInput`. The proposal still renders and can still be
            rejected, which is a decidable state; an error page is not.
        verdict: { $ref: '#/components/schemas/ProposalVerdict' }
        verdictSource: { $ref: '#/components/schemas/VerdictSource' }
        grounding:
          type: object
          additionalProperties: true
          nullable: true
        status: { $ref: '#/components/schemas/ProposalStatus' }
        createdAt: { type: string, format: date-time }
        createdBy:
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
        filedByAgent: { type: boolean }
        decidedAt: { type: string, format: date-time, nullable: true }
        decidedBy:
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
        decisionNote: { type: string, nullable: true }
        acceptedCase:
          type: object
          nullable: true
          required: [id, key]
          description: |
            The case this became, present only when `status` is `ACCEPTED` — and null if that case
            has since been deleted. The proposal stays accepted: deleting the case is a second
            decision, not an undo of the first.
          properties:
            id: { type: string, format: uuid }
            key:
              type: string
              description: The display key, because that is what a person recognises a case by.

    Condition:
      type: object
      required: [id, title, type, body, usageCount, suiteUsageCount, lockVersion]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        type: { type: string, enum: [PRE, POST, BOTH] }
        body:
          type: array
          items: { type: string }
        usageCount:
          type: integer
          description: |
            Distinct **live cases** attaching this entry **directly** (`case_condition`). Derived by
            the query since §95, never read from `condition.usage_count` — that column stays at its
            `DEFAULT 0` for the reason the retired `SharedStep.usageCount` gave: a denormalized
            counter has to be maintained by every path that rewrites a case's condition list, a case
            edit replaces the list wholesale, and a counter that drifts silently is worse than one
            computed.

            Distinct *cases*, not attachment rows — a case may legitimately attach the same entry as
            both a pre- and a postcondition.
        suiteUsageCount:
          type: integer
          description: |
            Suites attaching this entry (`suite_condition`). **A second number rather than a bigger
            first one**, and that is the resolution of the design question the retired
            `/shared-steps` posed: a condition's usage spans two tables, and blending them would be
            a guess.

            ~~The suite side propagates by inheritance down the whole ancestor chain, so a suite
            attachment reaches every case beneath it — a figure no join here can produce, since the
            walk is over `suite.path` (`ltree`).~~ → **§98: the reason changed and the shape did
            not.** A flat suite's conditions reach exactly the cases **filed** in it, which *is* a
            plain join — so the figure that was impossible is now merely unwritten. It stays
            unwritten deliberately: the two numbers still do not add up (a case can be filed under
            an attaching suite *and* attach the entry itself), so one blended count would be the
            same guess it always was, just a cheaper one to compute.

            Blending the two into one count would be a **guess presented as a measurement**, and it
            would understate: the direction that matters, because this is what the pre-edit impact
            warning is computed from (plan §6f) and an edit warned as touching 3 cases while touching
            300 is the failure the warning exists to prevent. Two honest numbers instead, and the
            client says "attached to N suites — every case filed in one inherits it" rather than
            inventing a case count for them.
        lockVersion:
          type: integer
          format: int64
          description: |
            Send as `If-Match` on the `PUT`. Mapped with `@Version` from the writer's first day —
            §74 found `lock_version` mapped *without* it on three entities, where the column reads
            `0` for ever and the precondition therefore **cannot fail**, there being no such thing
            as a stale `0`.

    ConditionInput:
      type: object
      required: [title, type, body]
      description: |
        `usageCount`, `suiteUsageCount` and `lockVersion` are absent by construction: the first two
        are derived from the references to the entry, and the third is the server's. Offering any of
        them would invite a value the server discards.
      properties:
        title:
          type: string
          description: Max 150 characters — one line of a picker row.
        type: { type: string, enum: [PRE, POST, BOTH] }
        body:
          type: array
          description: |
            The ordered actions. Blank lines are dropped and an all-blank body is refused: a
            trailing empty row is what the editor appends, and storing it puts a blank line into
            every case that attaches the entry.
          items: { type: string }

    CaseConditionRef:
      type: object
      required: [id, position, title, body, inline, inherited, declineCount]
      properties:
        id: { type: string, format: uuid }
        position: { type: integer }
        conditionId: { type: string, format: uuid, nullable: true }
        title: { type: string }
        body:
          type: array
          items: { type: string }
        inline: { type: boolean }
        inherited: { type: boolean }
        inheritedFrom: { type: string, nullable: true, example: 'Billing' }
        declineCount:
          type: integer
          format: int64
          description: |
            **How many cases have declined this attachment (B10)** — the cost of detaching it, and
            a number nothing on the wire could state before.

            `case_condition_optout` is `ON DELETE CASCADE` on `suite_condition`, so removing a
            suite's condition deletes every case's decision to opt out of it — and re-attaching the
            same library entry does **not** bring them back, because the new row has a new id and
            the opt-outs were keyed on the old one. A form that removes one without saying so
            destroys a set of decisions nobody can see being destroyed.

            Zero is the ordinary answer, and it is what a case's OWN condition and an inherited
            row both carry: only a suite's attachment can be declined.

    CaseConditionInput:
      type: object
      required: [conditionId]
      description: |
        One condition attached to a case. **Only the reference form is accepted** as of §95:
        `conditionId` names a live entry of this project's library and the attachment resolves
        through it, so editing that entry propagates here with no prompt — the whole point of the
        object, and the deliberate opposite of a step, which is text copied from `/step-suggestions`.

        `inlineBody` is declared so it can be **refused with a field error** rather than silently
        swallowed, which would be indistinguishable from a typo. It is not implemented because
        **nothing can render one**: every `CaseConditionRef` requires a `title`, an inline row has no
        column one could come from, and both readers exclude such rows at the query. Accepting it
        would be a save that succeeds and a condition the author can never see again.

        **Order is the content.** Position is assigned from the array's order and is never sent — a
        client-supplied position can duplicate or skip and the table has no constraint that would
        refuse it. The same rule `TestStepInput` follows.

        The same entry may appear in **both** lists (setup that is also cleanup) but only once
        within one list; a repeat inside one list is de-duplicated rather than refused.
      properties:
        conditionId: { type: string, format: uuid }
        inlineBody:
          type: array
          description: Refused with a 400 when present — see above.
          items: { type: string }

    BulkOperation:
      type: object
      required: [action, caseIds]
      description: |
        One action, one argument, over a selection of cases.

        **The permission depends on the argument, not only on the action** — and for `SET_STATUS`
        it depends on the *row* as well, which is why a refused row is **skipped with a reason**
        rather than failing the operation.

        `SET_STATUS` needs `case:approve` — Lead and up, and explicitly *not* Test Engineer (roles
        spec, Review table; plan §6g: *"the state machine has exactly one gate, held by
        `*:approve`"*) — in exactly two situations:

        - the target is `APPROVED`, or
        - the case is **currently** `APPROVED`, whatever the target is. Moving it back to `DRAFT`
          or `IN_REVIEW`, or out to `DEPRECATED`, all end a lead's sign-off; a rule reading the
          target alone answers `case:edit` and lets a filtered selection of two hundred approved
          cases be rescinded in one click.

        Every other action and every other edge needs `case:edit`, **including deprecating a case
        nobody signed off** — a Test Engineer has full CRUD over content since `V51`, so retiring a
        colleague's draft cannot cost more than deleting it outright.

        The two situations answer differently, and deliberately. Targeting `APPROVED` is knowable
        before a single row is read, so a caller without `case:approve` gets a **403** on one value
        of one field — which is why the SPA gates the APPROVED option separately rather than gating
        the dialog. The other situation is a property of each row, so the operation answers **200**
        and the approved rows come back in `skipped` with a reason naming the state they are in: a
        selection is a filter's output and mixes statuses, and refusing all four hundred over two of
        them is worse than the problem.
      properties:
        action:
          type: string
          enum: [ATTACH_CONDITIONS, DETACH_CONDITIONS, SET_STATUS, SET_AUTOMATION_STATUS, SET_OWNER, ADD_TAGS, SUBMIT_FOR_REVIEW, MOVE_TO_SUITE]
          description: |
            `SUBMIT_FOR_REVIEW` is `SET_STATUS` with `lifecycleStatus: IN_REVIEW` and is kept
            because plan §6g uses the vocabulary ("bulk-submit"). The server aliases it at the
            parse boundary, so there is one implementation of the state change rather than two
            spellings that drift apart.
        caseIds:
          type: array
          minItems: 1
          maxItems: 500
          description: |
            The selection, in the caller's own order. Duplicates are collapsed and the result
            reports each distinct id exactly once.

            Capped because the whole operation is one transaction and one audit event, so an
            unbounded selection is an unbounded lock. 500 is comfortably above the case grid's
            largest page, so no selection a user can actually make in the product hits it.
          items: { type: string, format: uuid }
        dryRun:
          type: boolean
          default: true
          description: Preview first. The UI must show the preview before committing.
        payload:
          $ref: '#/components/schemas/BulkPayload'

    BulkPayload:
      type: object
      description: |
        The argument, typed. Every property is optional here and **exactly the ones its action
        needs are required by the server**, which answers 400 with the field name when one is
        missing — the same shape a form validation error takes, so the message lands on the control.

        Deliberately a flat object with optional members rather than a `oneOf` discriminated on
        `action`. A `oneOf` states the per-action requirement in the schema itself, which is
        genuinely better, and generates a TypeScript union the SPA would have to narrow at every
        call site to build a payload it constructs one field at a time. The server has to validate
        the combination either way — it is the only side that knows the action — so the `oneOf`
        would buy a compile-time check the client cannot use while costing every consumer a narrow.
      properties:
        lifecycleStatus:
          allOf: [{ $ref: '#/components/schemas/LifecycleStatus' }]
          description: Required by `SET_STATUS`. Refused for every other action.
        automationStatus:
          allOf: [{ $ref: '#/components/schemas/AutomationStatus' }]
          description: Required by `SET_AUTOMATION_STATUS`.
        notAutomatableReason:
          type: string
          nullable: true
          description: |
            Required by `SET_AUTOMATION_STATUS` when the target is `NOT_AUTOMATABLE`, by the same
            `V1` check constraint the single-case editor obeys — which is what keeps automation
            coverage honestly denominated rather than letting anything inconvenient be filed as
            impossible.
        ownerId:
          type: string
          format: uuid
          nullable: true
          description: |
            Required by `SET_OWNER`; `null` clears the owner. Validated against the project's
            member list — the same *active member ∧ project grant* predicate `GET /members` and
            `POST /work-items` use (§54), so the picker offers exactly the set the server accepts.
        suiteId:
          type: string
          format: uuid
          description: |
            Required by `MOVE_TO_SUITE`. Must be a live suite in this project.

            The move changes what each case **inherits**, and therefore what its declines can be
            exceptions to: every `case_condition_optout` the destination does not impose ends here,
            and the version the move writes hashes the case without it (§192). See
            `TestCase.declinedPreconditions`. Nothing else about a case's conditions changes — the
            case's *own* attachments travel with it, as they always have.
        tags:
          type: array
          items: { type: string }
          description: |
            Required by `ADD_TAGS`. Additive and set-valued: a tag a case already carries leaves it
            `unchanged` rather than failing, and nothing is removed. There is no bulk tag *removal*
            in this slice.
        conditionId:
          type: string
          format: uuid
          description: Required by `ATTACH_CONDITIONS` and `DETACH_CONDITIONS`.
        conditionKind:
          type: string
          enum: [PRE, POST]
          description: |
            Which list the attachment lands in, for `ATTACH_CONDITIONS`; the server defaults it to
            `PRE` when absent. Deliberately no `default:` here — openapi-typescript renders a
            defaulted property as **required**, which would force every caller to send a value the
            server is perfectly happy to choose. `BOTH` is not offered:
            it describes what a *library* condition may be used as, while an attachment is always
            one position in one of the two lists (see the `ConditionKind` javadoc).

    BulkResult:
      type: object
      description: |
        Every outcome is reported as a LIST OF KEYS, not a count. The UI has to name what
        it touched — "38 changed, 4 already matched, 2 skipped" with the two skipped cases
        named and their reason given. A bare `affected: 38` cannot be rendered as a preview,
        and a blanket success toast over a partial failure is the worse half of the defect,
        because the user believes all 44 went through (plan §6f).
      required: [dryRun, total, changed, unchanged, skipped, declinesEnded]
      properties:
        dryRun:
          type: boolean
          description: True when this is a preview. The UI must preview before committing.
        total:
          type: integer
          description: Size of the requested selection.
        changed:
          type: array
          description: Case keys that changed (or would change, when dryRun).
          items: { type: string, example: TC-42 }
        unchanged:
          type: array
          description: Case keys already in the requested state — compliant, not failed.
          items: { type: string, example: TC-43 }
        skipped:
          type: array
          description: Case keys that could not be changed, each with a displayable reason.
          items:
            type: object
            required: [key, reason]
            properties:
              key: { type: string, example: TC-44 }
              reason: { type: string, example: 'A draft must be reviewed before it can be approved.' }
        declinesEnded:
          type: array
          description: |
            Case keys that LOSE a condition exception to this operation — **a subset of
            `changed`, not a fourth bucket**. They changed, in exactly the way the caller
            asked; this names what the change additionally cost.

            Only `MOVE_TO_SUITE` can populate it, and the empty array is the answer for the
            other seven actions. A decline is an exception to a rule the case's FOLDER
            imposes (`TestCase.declinedPreconditions`), so relocating a case ends the
            declines its new folder does not impose — the one operation in the product that
            ends a stored decision without mentioning it.

            **Populated on the preview**, which is the whole of why it exists: the person
            selecting four hundred cases is told what the move costs before they confirm it,
            not after. On a commit it reports what was actually deleted.
          items: { type: string, example: TC-6 }
        auditEventId: { type: string, format: uuid, nullable: true }

    CaseQuarantineInput:
      type: object
      required: [quarantined]
      properties:
        quarantined:
          type: boolean
          description: |
            The state to move to. Required — an absent field is a `400`, never a silent
            `false`, because that is the one shape of this request that could release a
            quarantine the caller never mentioned.
        reason:
          type: string
          maxLength: 1000
          description: |
            Why the test is being quarantined. **Required when `quarantined` is true**,
            ignored when it is false. Not expressible as a schema-level `required`, since
            it is conditional on the sibling field — the server raises it as a field error
            the form can land on.

    TestCaseCloneInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
          description: |
            The new case's title. **Required**, and validated by the same rule the create
            path applies — see the operation for why the server does not default it to
            `Copy of <title>`.
        suiteId:
          type: string
          format: uuid
          nullable: true
          description: |
            Where the clone lands. Omitted or `null` means **the source's suite**, which is
            what "clone this" means without further instruction. A suite in another project
            is a `400`, not a cross-project clone: that needs the classification revalidated
            against the target project's vocabularies (§6d) and is its own slice.

    CaseDraftInput:
      type: object
      required: [lockVersion, content]
      properties:
        lockVersion:
          type: integer
          format: int64
          description: |
            The `lockVersion` of the case the editor was holding when it started typing —
            the same value it would send as `If-Match` were it saving.

            **Required, and it is the field that stops a restore eating a committed edit.**
            Ana opens `TC-9` at `lockVersion 3` and types; the draft is buffered. Bob saves
            `TC-9`, which becomes `lockVersion 4`. Ana returns, the editor loads the case
            fresh at `4` and offers to restore her draft, she accepts and saves. That save's
            `If-Match` is `4` — it came from the fresh read — so the stale-editor check
            passes and Bob's change is overwritten by text written before it existed. The
            check cannot see this: it compares what the client read against what is stored,
            and the client did read the current version. What nothing asked is what the
            **draft** was written against.

            Recorded, not enforced. A draft written against a stale version is still the
            author's work; the decision is the returning editor's, informed by
            `CaseDraft.stale`.
        content:
          allOf: [{ $ref: '#/components/schemas/TestCaseInput' }]
          description: |
            The editor's current form state — exactly the shape `PATCH` takes, which is what
            makes "restore" mean "put this back in the form".

            **Not validated.** See the operation description.

    CaseDraft:
      type: object
      required: [lockVersion, stale, updatedAt, content]
      description: |
        A buffered draft, and everything a returning editor needs in order to decide whether
        to adopt it. **The caller's own** — the row is keyed `(case_id, user_id)` since
        `V64`.
      properties:
        lockVersion:
          type: integer
          format: int64
          description: The case's `lockVersion` when this draft was written.
        stale:
          type: boolean
          description: |
            `true` when the case has moved since the draft was written — a colleague saved
            it, or you saved it yourself from another tab. Since `V64` this is the **only**
            thing another person's save does to your buffer; it no longer deletes it.

            **Computed by the server, not left to the client.** The client holds both
            numbers and could compare them, and that is precisely how two screens end up
            disagreeing about whether the same draft is safe.

            **Advisory, never enforcing.** A stale draft is served in full — the words are
            the author's and are often exactly what they want, particularly when the
            intervening save touched a different field. Dropping it would be the product
            deciding that somebody else's edit invalidates your sentence.
        updatedAt:
          type: string
          format: date-time
          description: |
            When it was last buffered, from the server's clock. "Restore unsaved changes"
            means something different for work from four minutes ago and work from four
            weeks ago.
        # ~~updatedBy — who typed it, carrying the cost of the 1:1 primary key: there was one
        # buffer per case, so the draft on offer might be a colleague's and restoring it
        # silently would publish their half-finished sentence under your name.~~
        # → REMOVED with `V64` (audit D1). The row is keyed on the reader, so the field could
        # only ever answer "you" — and a field that discloses a hazard the schema no longer
        # has is worse than no field, because it asks a returning editor to weigh something
        # that cannot happen.
        content:
          allOf: [{ $ref: '#/components/schemas/TestCaseInput' }]
          description: The buffered form state, unvalidated.

    Attachment:
      type: object
      description: |
        One file attached to something that is **authored content** — a test case's
        definition (`attachment.owner_type = 'CASE'`), a documentation page (`DOC_PAGE`), or
        an artifact's bytes (`ARTIFACT`).

        **One schema for all three, and that is a decision.** The shapes are identical field
        for field *and* meaning for meaning — only the value of `url` differs, and the server
        builds that — so three structurally-identical types would make the SPA's one
        attachment list generic over nothing, and would re-create by hand, on the outside,
        the polymorphism-by-duplication the `storage` module removed on the inside:
        `storage.Attachment` is one entity for five owner types. It was `CaseAttachment`
        until #49's phase 2, when a second owner made the case-specific name wrong.

        **Not `Evidence`, which stays its own schema.** Evidence has a **caption** —
        somebody saying what a screenshot *shows*, a claim about a moment that has passed —
        and it is a record of something that happened rather than authored content. That
        difference is what decides the delete gate everywhere: an authorship arm on evidence,
        none here. A caption on this schema would be a second free-text name for a file that
        already has one, which two people will fill in differently.
      required: [id, filename, contentType, sizeBytes, url, uploadedAt]
      properties:
        id: { type: string, format: uuid }
        filename:
          type: string
          description: |
            What the caller called the file, reduced to its last path segment on the way in.
            It is a **column** and never part of a storage key — the key is three
            server-generated UUIDs — so a traversal name was already harmless; it is reduced
            anyway, because a string that looks like a path invites the next reader to use it
            as one.
        contentType:
          type: string
          description: |
            As the upload declared it, echoed back. `application/octet-stream` when the client
            sent none — guessing from the extension would state a type nobody claimed, and the
            browser trusts this header when rendering.
        sizeBytes:
          type: integer
          format: int64
          description: |
            Raw bytes. Formatted by `lib/format.ts` and never here: the server has no business
            deciding whether 1024 reads as "1 KB" or "1 KiB", and the SPA already has exactly
            one place that decides.
        url:
          type: string
          description: |
            Where the bytes are, absolute from the API root. Built by the server rather than
            composed by the client, so the route is spelled in one place — a client that
            composes it is a second spelling, and a route change then breaks the download with
            a 404 that reads as a missing file rather than as a missing endpoint.

            Served `inline` with the stored content type, so a reference screenshot renders
            beside the steps instead of landing in the downloads folder.
        uploadedAt: { type: string, format: date-time }
        uploadedBy:
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
          description: |
            Who attached it. A `UserRef` and **not a bare uuid** — §100's convention, and §121's
            finding that `quarantinedBy` was the only field on this API breaking it, under a
            javadoc asserting it did not. Null only when `attachment.created_by` is null, which
            `V1` permits and a future system actor would use.

    CaseFlake:
      type: object
      description: |
        A case's flake evidence (derived, plan §6l) and its quarantine decision (authored,
        plan §6c). One row, two halves, written by two different things that can never
        overwrite each other's columns.

        Flakiness is **pass/fail alternation within a single version and configuration** —
        §6l's rule, and the only scoping under which it means anything. Alternation across
        versions is just change: a test that passed, was edited, and now fails caught a
        regression, and reporting that as flake sends somebody to quarantine the test that
        found the bug.
      required:
        [caseId, executions, transitions, alternations, cells, computedAt, quarantined]
      properties:
        caseId: { type: string, format: uuid }
        executions:
          type: integer
          description: |
            Recorded outcomes inside the scoring window that were a pass or a failure.
            Blocked, skipped, retest and untested results are **removed before the sequence
            is formed**, which is not the same as ignoring them: a blocked run between two
            passes would otherwise read as two alternations and score a stable test at 1.0.
        transitions:
          type: integer
          description: |
            Adjacent pairs of outcomes **inside one cell** — the denominator of
            `flakeScore`, and never `executions`. A case with six results spread across six
            cells has six executions and zero transitions, because nothing in it ever ran
            twice under the same conditions.
        alternations:
          type: integer
          description: How many of those pairs changed between a pass and a failure.
        cells:
          type: integer
          description: |
            How many `(configuration, case version)` cells contributed — what tells a test
            that flaps on one browser from one that flaps on five.
        flakeScore:
          type: number
          format: double
          minimum: 0
          maximum: 1
          nullable: true
          description: |
            `alternations ÷ transitions`, or **null below the evidence floor**, which is a
            different claim from `0`. Two results that went pass then fail score a perfect
            `1.0` on any ratio definition and that is noise — and it is the number a human
            would then use to decide whether to quarantine. `0` means *evidently stable*;
            `null` means *not enough evidence to say*. The counts above ship precisely so a
            client can render the second as "3 results, not enough to score" rather than as
            an unexplained blank.
        lastAlternationAt:
          type: string
          format: date-time
          nullable: true
        computedAt:
          type: string
          format: date-time
          description: |
            When the derived half was last recomputed. On the wire for the same reason
            `Dashboard.healthComputedAt` is: it is the only thing that tells "this test is
            not flaky" from "nobody has looked at this test yet".
        quarantined: { type: boolean }
        quarantinedAt:
          type: string
          format: date-time
          nullable: true
        quarantinedBy:
          # A `UserRef`, not the bare uuid this field shipped as in §121 phase 1 — it was the
          # ONLY actor field on this API that was one, against ~25 that are not, and
          # `CaseFlakeView`'s own javadoc asserted it followed the convention it broke
          # ("resolved to a name by the caller like every other actor field on this API").
          # A comment claiming a fact about another file is not a check (§100).
          #
          # It matters at exactly one screen: the flake panel names who took the test out of the
          # gate, and a bare id leaves it rendering a uuid or silently dropping the decider — the
          # half of the record that makes a quarantine reviewable rather than just present.
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
          description: |
            Who decided. Null exactly when `quarantined` is false — the database refuses any
            other combination.
        quarantineReason:
          type: string
          nullable: true

    EntityVersion:
      type: object
      required: [versionNo, createdBy, createdAt, pinned]
      properties:
        versionNo: { type: integer }
        createdBy:
          # Nullable because test_case_version.created_by is, and carries no FK to
          # app_user (§28 finding 1). Two real states reach this field: nobody was
          # recorded (rows predating the first write path), and the recorded id names
          # no surviving account. Declaring it non-nullable made every consumer's
          # generated type lie, and the SPA carried a hand-widened alias to compensate
          # — §35 found it. Same treatment as TestCaseSummary.owner above.
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
        createdAt: { type: string, format: date-time }
        changeComment: { type: string, nullable: true }
        pinned: { type: boolean }

    VersionMarker:
      description: Rendered on history timelines so causation is visible (plan §6p).
      type: object
      required: [versionNo, occurredAt, author]
      properties:
        versionNo: { type: integer }
        occurredAt: { type: string, format: date-time }
        author:
          # Nullable because test_case_version.created_by is a nullable column with NO foreign key
          # to app_user (handoff §28, finding 1), so both "nobody was recorded" and "the recorded id
          # names no account" are states of a real row. Inventing a name for either would put an
          # author on the one table whose entire purpose is that past claims stay true.
          #
          # `repository`'s EntityVersion already ships null here and diverged from this contract
          # silently to do it (§35). Declared rather than left as a second undeclared divergence.
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
        changeComment: { type: string, nullable: true }

    # --------------------------------------------------------- execution ---
    TestPlanSummary:
      type: object
      required: [id, key, keySeq, name, status, milestoneName, milestoneDate, caseCount, passRate, coverage]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: TP-1 }
        # Declared by §165, and it was ALREADY ON THE WIRE: `TestPlanView` has had a `keySeq`
        # component since §74 and every one of the seven operations returning a `TestPlan` has been
        # sending the key, while no generated client could name it. §100 widened this exact schema
        # by hand — from `TestPlanSummary` to the full `TestPlan` — and missed it, because a
        # hand-comparison looks for the field somebody is arguing about (`exitCriteria`) and a
        # both-ways rule looks at all of them. `TestCaseSummary.keySeq` is the same value with the
        # same reason and has been declared since M0.
        #
        # The plan list is ordered `keySeq DESC` server-side (`TestPlanRepository`), so no client
        # has to sort by it — declaring it is what makes the body honest, not what makes it useful.
        keySeq: { type: integer, description: Stable insertion ordinal — text keys do not order correctly. }
        name: { type: string }
        status: { type: string, enum: [DRAFT, IN_REVIEW, APPROVED] }
        milestoneName: { type: string, nullable: true }
        milestoneDate: { type: string, format: date, nullable: true }
        caseCount: { type: integer }
        passRate: { type: number, nullable: true }
        coverage: { type: number, nullable: true }

    TestPlan:
      allOf:
        - $ref: '#/components/schemas/TestPlanSummary'
        - type: object
          # `required` does not descend through allOf, so the second member declares its own —
          # without it every property here is optional and no consumer can use one.
          required: [description, entryCriteria, exitCriteria, configurations, suiteIds, caseIds, tags, sections, scopeText, outOfScopeText, currentVersionNo, lockVersion, archived]
          properties:
            description: { type: string, nullable: true }
            entryCriteria:
              type: array
              items: { $ref: '#/components/schemas/Criterion' }
            exitCriteria:
              type: array
              items: { $ref: '#/components/schemas/Criterion' }
            configurations:
              type: array
              items: { $ref: '#/components/schemas/Configuration' }
            # The plan's scope as STORED, which nothing served before the editor existed:
            # caseCount is an expansion of these ids and cannot be edited, so a client had no
            # way to write back the scope it was shown. §68 found the identical gap on a
            # case's classification — the detail served names, the writer took ids — and the
            # rule it produced is that a field a PATCH accepts must be readable from the GET
            # that precedes it. Sorted, because plan_scope_item has no ordinal column.
            suiteIds:
              type: array
              items: { type: string, format: uuid }
            caseIds:
              type: array
              items: { type: string, format: uuid }
            # The unsectioned tag arm. `suiteIds`/`caseIds`/`tags` together ARE the unsectioned
            # group — every plan created before §97 has only this — and `sections` carries the rest.
            # One place for each item, so there is no overlap to reconcile and no second way to
            # write the same membership.
            tags:
              type: array
              items: { type: string }
            sections:
              type: array
              items: { $ref: '#/components/schemas/PlanSection' }
            scopeText: { type: string, nullable: true }
            outOfScopeText: { type: string, nullable: true }
            currentVersionNo: { type: integer }
            lockVersion: { type: integer }
            archived:
              type: boolean
              description: |
                Whether this plan is out of the working list (`V65`, audit D2).

                A boolean while the row stores `archived_at` — `Project.archived`'s shape,
                copied from it: *when* it was archived, and by whom, are the audit trail's
                (`plan.archived` / `plan.unarchived`).

                Orthogonal to `status`, which archiving never touches, and served on the
                detail as well as the list even though the default list cannot contain an
                archived plan: a plan reached by a bookmark or by a link from a run has to be
                able to say so, and one that looks identical to a live plan on the one screen
                showing it in full is how somebody edits a plan they believe is current.

    PlanArchiveInput:
      type: object
      required: [archived]
      description: |
        Put a plan away, or bring it back. One boolean naming the desired state rather than
        two verbs, which is what makes it idempotent and keeps one permission and one audit
        pair for one fact.
      properties:
        archived:
          type: boolean
          description: |
            `true` takes the plan out of the working list; `false` puts it back.

            Required. Absent is a `400` rather than a default, because both defaults are a
            guess at what should happen to a plan and one of them hides a release's plan from
            its team.

    TestPlanInput:
      type: object
      # ~~Six properties: a plan is named before anybody knows what would make it releasable, so
      # criteria, prose and sections belong to the edit.~~ → **B9: twelve.** The flow that sentence
      # describes is still the usual one and is still what the SPA does — nothing here became
      # required — but it was being enforced by a schema rather than by a form, and the cost was
      # that `POST /plans/{id}/clone` could express a complete plan and `POST /plans` could not.
      # A caller holding `plan:create` holds `plan:edit` in every seeded role, so the narrowness
      # bought a second request rather than a boundary.
      required: [name]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        milestoneName: { type: string, nullable: true }
        milestoneDate: { type: string, format: date, nullable: true }
        suiteIds:
          type: array
          items: { type: string, format: uuid }
        caseIds:
          type: array
          items: { type: string, format: uuid }
        # The six B9 added. Every one of them means exactly what it means on
        # `TestPlanUpdateInput` — the same validators run over both — with one difference that is
        # not a policy: an absent list there means "leave what is stored alone", and on a create
        # there is nothing stored, so absent and `[]` are the same request.
        tags:
          type: array
          items: { type: string }
        sections:
          type: array
          items: { $ref: '#/components/schemas/PlanSectionInput' }
        scopeText: { type: string, nullable: true }
        outOfScopeText: { type: string, nullable: true }
        entryCriteria:
          type: array
          items: { $ref: '#/components/schemas/CriterionInput' }
        exitCriteria:
          type: array
          items: { $ref: '#/components/schemas/CriterionInput' }

    TestPlanUpdateInput:
      type: object
      # Only the name. Every other field is optional because a list left out means "leave it
      # alone" — see the operation's description for the absent/null/empty split.
      required: [name]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        milestoneName: { type: string, nullable: true }
        milestoneDate: { type: string, format: date, nullable: true }
        suiteIds:
          type: array
          items: { type: string, format: uuid }
        caseIds:
          type: array
          items: { type: string, format: uuid }
        # The unsectioned tag arm and the named sections. Absent means "leave alone", `[]` clears —
        # the convention every list on this input already follows.
        tags:
          type: array
          items: { type: string }
        sections:
          type: array
          items: { $ref: '#/components/schemas/PlanSectionInput' }
        # Free prose about what will and will not be tested. NOT to be confused with the plan's
        # SCOPE ITEMS (`suiteIds`/`caseIds`/`tags`/`sections`), which are the cases the plan covers:
        # two meanings of the word "scope" live on this one schema, and only this pair is prose.
        # `null` clears the text; absent leaves it alone.
        scopeText: { type: string, nullable: true }
        outOfScopeText: { type: string, nullable: true }
        # ~~The two fields TestPlanInput deliberately does not have. A plan is named before
        # anybody knows what would make it releasable, so criteria arrive on the edit and
        # nowhere else.~~ → superseded by B9: `TestPlanInput` takes both, and the prose above too.
        # The sentence was right about the usual flow and wrong about where to enforce it — a form
        # asks for exit criteria at the moment somebody has them, and a schema that refuses them
        # makes a complete plan two requests for every caller that is not a form.
        entryCriteria:
          type: array
          items: { $ref: '#/components/schemas/CriterionInput' }
        exitCriteria:
          type: array
          items: { $ref: '#/components/schemas/CriterionInput' }

    CriterionInput:
      type: object
      description: |
        One authored gate. `Criterion` minus `met` and `actual`, and dropping those two is the
        point: both are **derived** — computed from the statistics endpoint's own numbers on
        every response — so accepting them would let a client assert that a release gate was
        met, which is the one claim on this object nobody should be able to make by typing it.

        A client that echoes back the `Criterion` it was served is fine; the two extra fields
        are ignored rather than refused, because they are this server's own computed answer
        and discarding them loses nobody's work.

        `metric` and `op` are **closed vocabularies**, validated on the way in. Unchecked, a
        plan gated on `pass_rte` renders exactly like one gated on `open_critical`: a criterion
        with no verdict. One of those means "we cannot check this yet" and the other is a typo
        that will never be checked at all, and a release meeting cannot tell them apart.
      required: [metric, op, value]
      properties:
        metric:
          type: string
          enum: [pass_rate, coverage, open_critical, cases_approved, build_available]
          example: pass_rate
        # Six canonical spellings. The server also tolerates `==` and `<>` because its
        # evaluator has always applied them and rows seeded by hand carry them — stated here
        # rather than left for somebody to discover, since a client has no reason to send one.
        op:
          type: string
          enum: ['>=', '>', '<=', '<', '=', '!=']
          example: '>='
        value: { type: number }
        # Optional: the server derives "pass_rate >= 95" when it is absent. It exists for the
        # gates whose name the predicate does not carry — "Sign-off from Support".
        label: { type: string, nullable: true }

    PlanSection:
      type: object
      description: |
        A **sub-feature** subdivision of the plan's cases — "Create an object", "Edit",
        "Navigation" — holding the same three kinds of reference the unsectioned group holds.

        **A section is a live selector, not a snapshot.** Its members are resolved on every read, so
        adding a case to a referenced suite, or tagging a case with a referenced tag, changes what
        this section holds without anything writing to the plan. TestNG's `<test>` block is the
        shape: a named subdivision carrying its own class list and its own group filter,
        re-resolved on every run.

        **A section is plan-local and is not a suite.** It has no key, no lifecycle, no versions and
        no existence outside this plan — a suite is reusable project content, a section is this
        plan's narrative structure.

        **The counts do not sum.** A case can be referenced directly in one section and arrive
        through a suite or a tag in another, so the sections' counts exceed the plan's deduped
        `caseCount`. That is the design, and a client that lets a reader subtract will have them
        report a bug in a correct number.
      required: [name, position, caseIds, suiteIds, tags, caseCount]
      properties:
        name: { type: string }
        position:
          type: integer
          description: Author order. Contiguous from 0 as served; a client sends the order it wants.
        caseIds:
          type: array
          items: { type: string, format: uuid }
        suiteIds:
          type: array
          items: { type: string, format: uuid }
        tags:
          type: array
          items: { type: string }
        caseCount:
          type: integer
          description: |
            The live cases this section resolves to right now, deduped across its three arms.

            Served beside the references rather than instead of them: the references are what the
            author wrote and are what a `PATCH` sends back, and the count is what they currently
            catch. A section defined by the tag `smoke` and reporting 12 says both halves of the
            live-selector design on one row.

            **These do not sum to the plan's `caseCount`** — see this schema's own description. A
            section with no references at all reports `0`, which is legal and is not an error.

    PlanSectionInput:
      type: object
      description: |
        **The whole section list is replaced when `sections` is present** — sections have no ids, so
        there is nothing to match a partial update against. Absent means "leave the sections alone";
        `[]` removes them all and leaves their references unsectioned nowhere, i.e. removes them
        from the plan.

        A section with no references at all is legal and is kept: an author names the sub-feature
        before filling it, and dropping empty ones on save would delete the heading they just typed.
      required: [name]
      properties:
        name: { type: string }
        caseIds:
          type: array
          items: { type: string, format: uuid }
        suiteIds:
          type: array
          items: { type: string, format: uuid }
        tags:
          type: array
          items: { type: string }

    TagUsage:
      type: object
      required: [tag, caseCount]
      properties:
        tag: { type: string }
        caseCount:
          type: integer
          description: |
            Live cases carrying this tag in this project. Never zero — a tag with no live case is
            absent from the list rather than present with a zero.

    PlanStatusInput:
      type: object
      required: [status]
      properties:
        # All three values, not only the ones a given plan can reach: which moves are legal is a
        # property of the plan's current state, which the server holds and the client's copy of may
        # be one save behind. A client that filtered this list would be holding a second copy of the
        # ladder.
        #
        # `overrideApprovalGate` was here and was REMOVED on 2026-08-05 (§97, M7): its one
        # meaningful move, DRAFT → ACTIVE, no longer exists, and a boolean that is always ignored is
        # worse than an absent one — a client keeps sending it and the next reader has to prove it
        # does nothing. §6g's override survives on `TestRunInput.overrideApprovalGate`, where its
        # rule does.
        status: { type: string, enum: [DRAFT, IN_REVIEW, APPROVED] }

    Criterion:
      type: object
      description: Machine-evaluable so the plan page is a gate, not prose (plan §6p).
      required: [metric, op, value, label]
      properties:
        metric: { type: string, example: pass_rate }
        op: { type: string, example: '>=' }
        value: { type: number }
        label: { type: string }
        met: { type: boolean, nullable: true }
        actual: { type: number, nullable: true }

    Configuration:
      type: object
      required: [id, name, isDefault, attributes]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: 'Chrome / Windows' }
        isDefault: { type: boolean }
        attributes:
          type: object
          additionalProperties: { type: string }

    # --------------------------------------------------------- ingestion ---
    ReportFormat:
      type: string
      description: |
        Which CI dialect `report` is. **Never inferred** — `application/xml` is true of both
        JUNIT and TESTNG and distinguishes neither, and sniffing the payload would make a
        malformed report of one dialect read as a valid report of another. These four are
        `ingestion_job.format`'s own CHECK, so the set cannot grow without a migration.
      enum: [JUNIT, TESTNG, ALLURE, CUCUMBER]

    IngestedOutcome:
      type: string
      description: |
        What the runner said about one test, before it becomes one of the project's own result
        statuses. Four values mapping to three `StatusKind`s: `ERRORED` is `FAILED`'s kind and is
        kept distinct in the parse because JUnit and TestNG separate `<failure>` (an assertion the
        test made and lost) from `<error>` (the test throwing before it could assert), and the
        messages differ. It is **not** a fifth bucket in a vocabulary the project owns.
      enum: [PASSED, FAILED, ERRORED, SKIPPED]

    IngestionStatus:
      type: string
      description: |
        Where the job got to. ~~**The synchronous lane writes only `COMPLETED`.** A report that
        cannot be parsed leaves no row at all — a `FAILED` row would consume the idempotency key,
        so the *corrected* retry under the key CI generated once would replay the failure.~~ →
        **superseded by B6: it writes `COMPLETED` and `FAILED`.**

        The old reasoning was right about the constraint and wrong about which rows it was for.
        `V60` narrowed the uniqueness to `COMPLETED` rows, so a rejected report is recorded, carries
        its key, and consumes nothing — the corrected retry under the same key still ingests. What
        that buys is the thing the absence cost: `GET …/ingestions` showed every success and was
        silent about every rejection, so a pipeline posting malformed XML for a week was
        indistinguishable from a pipeline nobody had wired up, and the 400 body was the entire
        record of the refusal.

        Two `FAILED` rows may share a key, deliberately: a build that posted rubbish three times
        failed three times, and collapsing them would hide the repetition that is the useful part.

        `PENDING` and `PROCESSING` belong to an asynchronous lane that does not exist yet, and are
        the two values nothing can produce.
      enum: [PENDING, PROCESSING, COMPLETED, FAILED]

    IngestionInput:
      type: object
      required: [format, report]
      properties:
        format: { $ref: '#/components/schemas/ReportFormat' }
        report:
          type: string
          description: |
            The report file, verbatim. Capped at 1 MiB of UTF-8 — this is the only endpoint that
            takes an arbitrary blob into a `JSONB` column, and unbounded it is an out-of-memory
            fault rather than a refusal, taking the instance down for every other company on it.
            The cap is named in the 400 so a caller can split the report.
          maxLength: 1048576
        runId:
          type: string
          format: uuid
          nullable: true
          description: |
            Post into this existing run instead of opening one. When given, the other run fields
            are **ignored rather than refused**: a CI configuration that sets `releaseVersion` on
            every post should not start failing the day somebody adds `runId`, and none of them
            could change a run that already exists.

            A matched case that is **not in that run's checklist** is reported in `unmatched`
            rather than added: silently growing a checklist somebody is working through, and its
            denominator, from a CI job is not this endpoint's to do.
        runName:
          type: string
          nullable: true
          description: |
            The opened run's name. Defaulted rather than required — a CI job has a build number
            and rarely a name, and requiring one produces "run" on every row. Absent, the run is
            named after `buildNumber`.
        configurationId:
          type: string
          format: uuid
          nullable: true
          description: Which environment. The project's default when absent, as for `POST /runs`.
        releaseVersion: { type: string, nullable: true }
        buildNumber:
          type: string
          nullable: true
          description: |
            The CI build. The one field that makes an ingested run traceable back to the job that
            posted it, which is why it is a field rather than left to the name.
        commitSha:
          type: string
          nullable: true
          description: |
            The commit the job built — `git rev-parse HEAD`. See `TestRun.commitSha` for the rule.

            **This is the field the CI caller has and nobody else does**, which is why it was
            declared here first. It was a bound-and-dropped component of the request record for two
            milestones until §170 removed it; the properties are back because the column is now
            written.

            A malformed value **refuses the whole post** rather than being dropped, which costs the
            report on that build. Deliberate: the two honest answers were refuse and store, the
            third — a 2xx with the value discarded — is the one §170 deleted, and a value coming
            straight out of `git rev-parse` fails this on the first build or never.
        branch:
          type: string
          nullable: true
          description: The branch the job built. See `TestRun.branch`.

    UnmatchedTest:
      type: object
      required: [name, normalizedName, outcome]
      description: |
        A test the ladder could not place. **This is what makes declining §6c's auto-created case
        stubs workable**: a person reads this list, decides which case each name means, and posts
        it to `POST /automation-mappings`.
      properties:
        name:
          type: string
          description: The test as the report named it, `className#name`.
        normalizedName:
          type: string
          description: |
            The exact key `POST /automation-mappings` stores. Served rather than left for the
            client to recompute — the normalization rule lives in one place on purpose, and a
            client re-deriving it is a second implementation of the one thing that must agree
            exactly or every mapping silently stops matching.
        outcome:
          allOf: [{ $ref: '#/components/schemas/IngestedOutcome' }]
          description: |
            Present because it changes the urgency: an unmatched **failure** is a red test nobody
            is being told about, where an unmatched pass is only unrecorded coverage.

    IngestionJob:
      type: object
      required:
        [id, status, format, runId, runKey, matchedCount, unmatchedCount, unmatched, reportUrl,
         createdAt]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/IngestionStatus' }
        format: { $ref: '#/components/schemas/ReportFormat' }
        runId:
          type: string
          format: uuid
          nullable: true
          description: |
            The run the results landed in. **Null exactly when nothing matched** — see the
            endpoint on why a report matching nothing opens no run.
        runKey:
          type: string
          nullable: true
          example: TR-4
          description: Beside the id, so a CI log line is something a person can search for.
        matchedCount: { type: integer }
        unmatchedCount:
          type: integer
          description: The true total, so a caller can always tell that `unmatched` was cut.
        unmatched:
          type: array
          description: |
            Capped at 50. A first integration attempt matches nothing, so the unbounded list is
            the *common* case at exactly the moment the response is largest.
          items: { $ref: '#/components/schemas/UnmatchedTest' }
        reportUrl:
          type: string
          nullable: true
          example: /api/v1/projects/4f.../ingestions/9c.../report
          description: |
            `GET` here for the **verbatim file CI posted** — see that endpoint.

            **Null when this job has no stored upload**, which is every job posted before uploads
            were kept and cannot be repaired by a migration. Key a control on this field rather
            than on `status` or on the format: null is the only thing on the wire that tells the
            two eras apart, and it is null precisely when there is nothing to link to.

            Composed by the server, like `ReportJob.downloadUrl` and for the same reason — the
            client holds no copy of this server's routing. It already carries `/api/v1`, so a
            client that prefixes its own base produces `/api/v1/api/v1/…` and a 404 that reads as
            a missing report.

            **The session is a bearer token**, so a plain `<a href>` sends no credential and
            answers `401` while rendering as a working link. Fetch it with the `Authorization`
            header the rest of the API takes.
        createdAt: { type: string, format: date-time }

    IngestionJobSummary:
      type: object
      required: [id, status, format, runId, runKey, matchedCount, unmatchedCount, createdAt]
      description: |
        One row of the ingestion history. **`IngestionJob` without `unmatched`** — see
        `GET /ingestions` on why the names are absent rather than empty here.
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/IngestionStatus' }
        format: { $ref: '#/components/schemas/ReportFormat' }
        runId:
          type: string
          format: uuid
          nullable: true
          description: Null exactly when the report matched nothing, so no run was opened.
        runKey:
          type: string
          nullable: true
          example: TR-4
          description: |
            Null in **two** cases, told apart by `runId`: no run was opened (`runId` null too), or
            the run it opened has since been deleted (`runId` present). The key of a deleted run is
            withheld rather than served, because it would offer a link to a screen that 404s.
        matchedCount: { type: integer }
        unmatchedCount:
          type: integer
          description: |
            The true total. On this shape it is the *only* thing said about the unmatched tests —
            open the job to see which they were.
        createdAt: { type: string, format: date-time }

    AutomationMappingInput:
      type: object
      required: [testName, caseId]
      properties:
        testName:
          type: string
          maxLength: 500
          description: |
            The test as a report names it. Sent **raw** — the server normalizes, because the rule
            has to agree exactly with the one the parser applies. Pasting an `UnmatchedTest`'s
            `normalizedName` back works too; it is already in the canonical form.
        caseId: { type: string, format: uuid }

    AutomationMapping:
      type: object
      required: [id, testName, caseId, caseKey, confirmedBy, confirmedAt]
      properties:
        id: { type: string, format: uuid }
        testName:
          type: string
          description: |
            The normalized key the match is made on. Named `testName` rather than
            `normalizedTestName` because it is the only name a client ever sees or sends — the raw
            form a report used is not stored, and a second field would invite one.
        caseId: { type: string, format: uuid }
        caseKey:
          type: string
          nullable: true
          example: TC-42
          description: |
            Beside the id — a mapping list is read to answer "which case does this point at", and
            an id is not an answer a person can check. Null when the case has since been deleted,
            which is a row somebody has to see in order to remove it.
        confirmedBy:
          type: string
          format: uuid
          nullable: true
          description: Who vouched for it — the whole value of the row.
        confirmedAt: { type: string, format: date-time }

    RunScopeRequest:
      type: object
      required: [planId, caseIds, suiteIds, tags]
      description: |
        **What a run was asked for**, beside what it materialised (B7, `V61`).

        A run's contents are its executions — materialised once, pinned to a case version, never
        re-resolved. That law is unchanged, and what it left unanswerable is *why* a case is on the
        checklist: named directly, filed in a suite that was named, or carrying a tag that was.
        `test_run` kept the plan id and nothing else.

        **The whole object is `null` when nothing was recorded** — every run created before `V61`,
        and every run opened by ingestion, which materialises from a report rather than from a
        request. Render that as *not recorded*, never as "no scope": a run covering two hundred
        cases was not asked for nothing.

        It is the request and not the result. A suite named here may since have been deleted and a
        tag may now match nothing; nothing repairs it, because the value of the record is that it
        says what was asked on the day it was asked.
      properties:
        planId: { type: string, format: uuid, nullable: true }
        caseIds:
          type: array
          items: { type: string, format: uuid }
        suiteIds:
          type: array
          items: { type: string, format: uuid }
        tags:
          type: array
          items: { type: string }

    TestRun:
      type: object
      required: [id, key, name, planId, planKey, configuration, status, releaseVersion, buildNumber, commitSha, branch, source, startedAt, completedAt, counts, scopeRequest]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: TR-1 }
        name: { type: string }
        planId: { type: string, format: uuid, nullable: true }
        planKey: { type: string, nullable: true }
        configuration: { $ref: '#/components/schemas/Configuration' }
        status: { type: string, enum: [NOT_STARTED, IN_PROGRESS, COMPLETED, ABORTED] }
        releaseVersion: { type: string, nullable: true }
        buildNumber: { type: string, nullable: true }
        commitSha:
          type: string
          nullable: true
          example: 4f9c2b1
          description: |
            The exact code this run tested — §6q's third rung, below `releaseVersion` (what) and
            `buildNumber` (which build of it). Git traceability, plan §3 phase 2.

            Refused unless it is a git object name, 7 to 40 hexadecimal characters, on the same
            terms and for the same reason as `ExternalLinkInput.commitSha`: an unchecked value is
            accepted, stored and discovered to be a branch name by the reader who reads it — and
            here `branch` is the field immediately beside it.
        branch:
          type: string
          nullable: true
          example: release/4.3
          description: |
            The branch the code came from. Unchecked beyond a length bound: a ref name is whatever
            the team's git says it is, and this product does not get to decide that.
        source: { type: string, enum: [MANUAL, INGESTED] }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        counts: { $ref: '#/components/schemas/ResultCounts' }
        scopeRequest:
          allOf: [{ $ref: '#/components/schemas/RunScopeRequest' }]
          nullable: true
          description: |
            What this run was asked for — see `RunScopeRequest`. **Null means not
            recorded**, which is every run created before `V61` and every run opened by an
            ingested report.

    TestPlanCloneInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            The new plan's name. **Required** — see the operation for why the server does not
            default it to `Copy of <name>`.

    TestRunCloneInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: The new run's name. **Required**, and not defaulted server-side.
        configurationId:
          type: string
          format: uuid
          nullable: true
          description: Overrides the source's configuration. Omitted keeps it.
        releaseVersion:
          type: string
          nullable: true
          description: |
            Overrides the source's release version — the field this operation mostly exists
            for. Omitted keeps the source's, which is rarely what a re-run wants.
        buildNumber:
          type: string
          nullable: true
          description: Overrides the source's build number. Omitted keeps it.
        # commitSha / branch are deliberately absent, and the clone inherits neither.
        #
        # The three overrides above fall back to the source because a re-run is against the same
        # release until the caller says otherwise. A git coordinate is not the same kind of value:
        # it names the code that RAN, and a fresh clone has run nothing. Inheriting it would ship a
        # run claiming a commit it never tested — and a run has no edit endpoint, so the only way to
        # correct it would be to delete the run. Left null, the clone says it does not know what
        # code its pass covers, which is true of a manual re-run days later.
        assigneeId:
          type: string
          format: uuid
          nullable: true
          description: |
            Assigns the whole new checklist. **There is no fallback to the source**: a run has
            no assignee — the column is on `test_execution`, one per case — so omitting this
            produces an unassigned checklist rather than a copy of somebody's.
        overrideApprovalGate:
          type: boolean
          nullable: true
          description: |
            §6g's documented lead override, for **this** request. It is never inherited from
            the source run: nothing stores it there, and a clone that carried it forward
            would turn a documented one-off into a permanent exemption.
        rescope:
          type: boolean
          nullable: true
          description: |
            **Re-run what the source was asked for, rather than what it materialised** (B7).
            Omitted or `false` is the ordinary clone and stays the default.

            A clone normally re-runs the source's exact case list, which is right: a re-run of *the
            regression pass we did on Friday* is that pass again, and a set that quietly grew would
            make two runs with one name cover different work. What that cannot express is the other
            intention — *run the smoke suite again* — where a case filed into the suite since Friday
            is exactly what should be included. Before this flag the only way to get it was to
            create a new run by hand, losing the link to the source.

            **Refused with a field error when the source has no recorded request** (`scopeRequest`
            is null: a run created before `V61`, or one opened by an ingested report). The two
            clones produce different case sets and look identical afterwards, so falling back
            silently would answer a question nobody asked.

            A source whose scope was a bare list of case ids re-resolves to that same list, so the
            flag is accepted there and changes nothing.

    TestRunInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        planId: { type: string, format: uuid, nullable: true }
        configurationId:
          type: string
          format: uuid
          nullable: true
          description: |
            The environment this pass runs in — one of `GET /configurations`. Omitted or null
            means the project's seeded `Default`, which is why the column can be `NOT NULL`
            while this field is optional.
        releaseVersion: { type: string, nullable: true }
        buildNumber: { type: string, nullable: true }
        commitSha:
          type: string
          nullable: true
          description: |
            The commit this pass tests, if the caller knows it — see `TestRun.commitSha` for the
            rule and its reason. **Accepted on a manual create too, not only on ingestion**: a run
            has no edit endpoint, so this is the only moment it can be recorded, and "a machine may
            say what code ran, a person may not" is a rule with nothing behind it.
        branch:
          type: string
          nullable: true
          description: The branch this pass tests. See `TestRun.branch`.
        caseIds:
          type: array
          items: { type: string, format: uuid }
          description: |
            Named cases. Every id must be a live case *in this project* — one from a sibling
            project satisfies the foreign key, the company column and RLS alike, so only this
            check refuses it, and it is a field error rather than a silent drop.
        suiteIds:
          type: array
          items: { type: string, format: uuid }
          description: |
            Whole suites, resolved through the membership `GET /suites` describes — filed,
            added individually, and matched by the suite's own tag rules. Not "the cases filed
            under it": a suite defined entirely by a tag rule would otherwise resolve to
            nothing and create a run of zero cases, reported as a success.

            Live suites in this project, on `caseIds`' terms and for its reason.
        tags:
          type: array
          items: { type: string, maxLength: 60 }
          description: |
            Every live case carrying **any** of these — union, not intersection; see the
            operation's own description for why this points the opposite way from
            `GET /cases?tag=`.

            Matched exactly, and an unknown tag is not an error: there is no vocabulary to
            check it against, and a run that also names a suite is not wrong because one of
            its tags is unused. What *is* refused is the run resolving to nothing at all.
        assigneeId:
          type: string
          format: uuid
          nullable: true
          description: |
            Assigns the **whole** checklist to one person — every execution this create
            materialises, which is what makes it a starting point rather than a plan. Per-row
            reassignment afterwards is
            `PUT /runs/{runId}/executions/{executionId}/assignee`, which took this column's
            second writer.

            An active member of this company; anything else is a 400 on this field.
        overrideApprovalGate:
          type: boolean
          default: false
          description: |
            §6g's "documented lead override for the 2am release" (§82) — the one property here
            that is not a property of the run. It is a statement about this request, so nothing
            on the run stores it and the audit row does.

            Consulted only where `requireApprovedCaseForRun` would otherwise refuse the create,
            and only for a caller already holding `case:approve` — who could reach this exact
            run today by approving the cases first, which is why no new permission key was
            invented for it. It can never widen reach and never turns an acceptable request
            into a refused one; a caller who sets it without the key gets the same 409.

    TestRunDetail:
      allOf:
        - $ref: '#/components/schemas/TestRun'
        - type: object
          required: [executions]
          properties:
            executions:
              type: array
              items: { $ref: '#/components/schemas/TestExecutionSummary' }

    ResultCounts:
      type: object
      description: Counts, never percentages — the denominator toggle needs both (plan §6p).
      required: [passed, failed, blocked, skipped, notRun, total]
      properties:
        passed: { type: integer }
        failed: { type: integer }
        blocked: { type: integer }
        skipped: { type: integer }
        notRun: { type: integer }
        total: { type: integer }

    TestExecutionSummary:
      type: object
      description: |
        The case x run instance. Deliberately has NO display key (plan §6t): an execution is
        always reached through its run or its case, nobody says "TE-4038" out loud, and a
        per-execution counter would be the highest-volume contention point in the schema for no
        benefit. Identified by its UUID, or by (runId, caseId).
      required: [id, caseId, caseKey, caseTitle, caseVersionNo, status, assignee, executedBy, executedAt, durationMs, defects, quarantined]
      properties:
        id: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        caseKey: { type: string }
        caseTitle: { type: string }
        caseVersionNo: { type: integer }
        status:
          allOf: [{ $ref: '#/components/schemas/CaseStatus' }]
          nullable: true
        # Both nullable, and both were declared as a bare $ref — which openapi-typescript
        # renders non-nullable, so the generated type claimed every execution has an assignee
        # and an executor. `test_execution.assignee_id` and `executed_by` are both nullable
        # columns and both states are ordinary: an unassigned execution, and one ingested from
        # CI where `executed_by_token` is set instead. Same correction §37 made to
        # `EntityVersion.createdBy`, and the same `allOf` + `nullable: true` idiom.
        assignee:
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
        executedBy:
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
        executedAt: { type: string, format: date-time, nullable: true }
        durationMs: { type: integer, nullable: true }
        defects:
          type: array
          items: { $ref: '#/components/schemas/DefectLink' }
        # A property of the CASE, read live, not a property of this execution. True when
        # somebody has quarantined the case — decided its results are not to be trusted —
        # which says nothing about whether this particular result is good. It is here so a
        # tester can see it BEFORE picking the row up: a badge that appeared only after you
        # opened the execution is one you see after you have already chosen it.
        #
        # Never a reason to hide or skip the row. A quarantined case still runs, still takes
        # a verdict, and still counts towards this run's pass rate — the reports print a
        # second rate that excludes it and leave the first one alone (§237).
        quarantined: { type: boolean }

    TestExecution:
      allOf:
        - $ref: '#/components/schemas/TestExecutionSummary'
        - type: object
          required: [comment, releaseVersion, stepFormat, preconditions, postconditions, steps, evidence, lockVersion]
          properties:
            comment: { type: string, nullable: true }
            releaseVersion: { type: string, nullable: true }
            stepFormat: { $ref: '#/components/schemas/StepFormat' }
            preconditions:
              type: array
              items: { $ref: '#/components/schemas/CaseConditionRef' }
            postconditions:
              type: array
              items: { $ref: '#/components/schemas/CaseConditionRef' }
            steps:
              type: array
              items: { $ref: '#/components/schemas/StepResult' }
            evidence:
              type: array
              items: { $ref: '#/components/schemas/Evidence' }
            lockVersion: { type: integer }

    StepResult:
      type: object
      description: |
        One step of the **pinned** case version, with whatever result has been recorded against
        it. The step fields are history and the result fields are current — which is why they
        share a shape rather than being two lists the client has to join by `stepId`.
      required: [stepId, position, keyword, action, testData, expectedResult, statusId, comment, evidence]
      properties:
        stepId: { type: string, format: uuid }
        position: { type: integer }
        keyword: { type: string, nullable: true }
        action: { type: string }
        testData: { type: string, nullable: true }
        expectedResult: { type: string, nullable: true }
        statusId: { type: string, format: uuid, nullable: true }
        comment: { type: string, nullable: true }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/Evidence' }

    Evidence:
      type: object
      required: [id, filename, contentType, sizeBytes, url, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer }
        url: { type: string }
        thumbnailUrl: { type: string, nullable: true }
        caption: { type: string, nullable: true }
        createdBy:
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
          description: |
            **Nullable, and that is load-bearing.** `evidence.created_by` has no `NOT NULL` and no
            foreign key, so a row written before authorship was recorded has no author.

            ~~and `evidence:delete`'s `OWN` qualifier answers such a row **false**: a grant
            covering "your own work" must not stretch to work nobody can attribute … which is the
            arm the whole qualifier turns on.~~ → **superseded: `V51` emptied `OWN`**, and
            `DELETE …/evidence/{evidenceId}` already says so. The field is not load-bearing for a
            permission any more; it is load-bearing for the *screen*, which names who attached a
            file and must be able to say "nobody recorded" rather than inventing an author. A
            non-nullable declaration here would make the SPA collapse "no author" into "some
            author". Same shape as `TestCaseSummary.createdBy` (§66).
        createdAt: { type: string, format: date-time }

    ExecutionResultInput:
      type: object
      description: |
        **No `lockVersion` field.** The version the client read is a precondition, and it
        travels as `If-Match` — see that parameter for why a body field would be a value on an
        input schema that must never be persisted. The SPA sent one in the body for as long as
        no server read it, which is the divergence class this schema exists not to repeat.
      required: [statusId]
      properties:
        statusId:
          type: string
          format: uuid
          description: |
            Required: this endpoint records a verdict. A status outside the project's own
            vocabulary is a 400 on this field.
        comment: { type: string, nullable: true }
        durationMs:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          description: |
            How long the test took, in milliseconds.

            **Optional, and it must stay optional.** `tcms_record_result` (MCP) and `result record`
            (CLI) both write this operation; a required field here breaks both, and
            `writeConformance.test.ts` in each package drives every write arm.

            `null` means **clear it**, on the same terms as `comment` — this body states the desired
            state rather than a patch of it. A tester who reopens a result and saves without touching
            the stopwatch field clears a duration that was there, which is the same rule the comment
            has carried since Phase 1.

            The column is not new. `test_execution.duration_ms` has existed since `V1`, is served on
            `TestExecution`, `TestExecutionSummary` and `CaseHistoryEntry`, is copied into
            `execution_fact` and is summed into the run summary report's "recorded duration".
            **What did not exist was any writer at all** — the ingestion parsers read a duration out
            of a JUnit/TestNG/Cucumber report and put it in the ingestion job's payload JSON, never
            in the column — so every consumer above has answered null since the schema's first day.
            This field is that column's first writer.

            **Milliseconds on the wire, seconds on screen.** The unit is milliseconds because the
            report dialects report milliseconds; the SPA's control is in seconds because a tester
            does not think in milliseconds. The conversion is `frontend/src/lib/format.ts`, one
            implementation, at the boundary.
        stepResults:
          type: array
          description: |
            Optional and partial — a step absent from the list keeps whatever it had. A
            `stepId` that is not a step of the **pinned** case version is a 400 on the field
            rather than an ignored entry: silently dropping it is a save that reports success
            and discards what the tester marked.
          items:
            type: object
            required: [stepId, statusId]
            properties:
              stepId: { type: string, format: uuid }
              statusId: { type: string, format: uuid }
              comment: { type: string, nullable: true }

    ExecutionAssigneeInput:
      type: object
      description: |
        Who is to work this row of the checklist. One field, **required and nullable**: the
        operation states the assignee rather than changing it, so `null` is how it says
        "nobody" and an omitted field is a 400 rather than a quiet no-op.
      required: [assigneeId]
      properties:
        assigneeId:
          type: string
          format: uuid
          nullable: true
          description: |
            An **active member of this company** — the same predicate `POST /runs` applies to
            the same column. `null` leaves the row unassigned, which is the ordinary state of
            a checklist a team picks up from.

    ExecutionBulkOperation:
      type: object
      required: [action, executionIds]
      description: |
        One action, one argument, over a selection of a run's executions. `BulkOperation`'s shape
        for cases, deliberately — the two are one family and a second spelling of "operate on a
        selection" is how one product starts reading like two.
      properties:
        action:
          type: string
          enum: [ASSIGN, DISTRIBUTE]
          description: |
            `ASSIGN` puts every selected row on one person — or on nobody, with a null
            `assigneeId`. There is no separate `UNASSIGN`: the single-row `PUT` already spells
            "nobody" as a null assignee, and two ways to say one thing is two implementations to
            keep agreeing.

            `DISTRIBUTE` round-robins the selection across `assigneeIds`.
        executionIds:
          type: array
          minItems: 1
          maxItems: 500
          description: |
            The selection, as execution ids. Duplicates are collapsed and the result reports each
            distinct id exactly once.

            Capped for `BulkOperation.caseIds`' reason and a stronger version of it: the whole act
            is one transaction, and here it also writes up to 500 audit rows. A run larger than
            this is assigned in two acts, which is two `bulkOperationId`s and reads correctly in
            the trail.

            An id naming no execution **in this run** comes back in `skipped`, not as a 404 — see
            the operation.
          items: { type: string, format: uuid }
        dryRun:
          type: boolean
          default: true
          description: |
            Preview first. The UI must show the preview before committing, and for `DISTRIBUTE`
            that is the whole point: the person about to hand 300 cases to five colleagues sees
            the split before they confirm it.
        payload:
          $ref: '#/components/schemas/ExecutionBulkPayload'

    ExecutionBulkPayload:
      type: object
      description: |
        The argument, typed. Both members are optional here and **exactly the one its action needs
        is required by the server**, which answers 400 naming the field — `BulkPayload`'s
        arrangement, and its reasoning applies unchanged: a `oneOf` discriminated on `action` would
        state the rule in the schema and cost every consumer a narrow to build a payload it
        constructs one field at a time, while the server has to validate the combination either
        way because it is the only side that knows the action.
      properties:
        assigneeId:
          type: string
          format: uuid
          nullable: true
          description: |
            Required by `ASSIGN`; **`null` unassigns every selected row**, which is a value here
            and not an omission — the single-row endpoint's rule, and what makes "take these off
            everybody's plate" expressible.

            Must be an **ACTIVE member of this company** — the predicate `POST /runs` and the
            single-row `PUT` both apply to this column, read from the same place rather than
            re-spelled. Note it is *company* membership and not the narrower "holds a grant on this
            project" that `GET /members` answers, so a picker built from that list can only offer
            people this operation accepts, never the reverse.

            Refused with a 400 for any other action.
        assigneeIds:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, format: uuid }
          description: |
            Required by `DISTRIBUTE`, and refused for `ASSIGN`.

            **Order is the caller's and is load-bearing**: the i-th row of the run-ordered
            selection goes to `assigneeIds[i % assigneeIds.length]`, so this order decides who
            takes the remainder. Duplicates are collapsed keeping the first occurrence. A server
            that sorted this list would silently overrule a coordinator who put the senior tester
            first.

            Every member must be an ACTIVE member of this company, checked before anything is
            written; the 400 names this field and lists the ids that failed.

            More people than rows is legal — the tail simply receives nothing, and the preview
            shows them with a count of zero rather than dropping them, because a person expecting
            work and getting none is the thing worth seeing.

    ExecutionBulkResult:
      type: object
      required: [dryRun, total, changed, unchanged, skipped, bulkOperationId]
      description: |
        Every outcome as a LIST, never a count — `BulkResult`'s rule.

        `changed` carries whole rows rather than keys, which is where this diverges from the case
        result and why: a list of keys says *that* something moved and not *where*, and for
        `DISTRIBUTE` "where" is the entire question the preview exists to answer.
      properties:
        dryRun:
          type: boolean
          description: True when this is a preview. Nothing was written and no audit row exists.
        total:
          type: integer
          description: Size of the requested selection, after duplicates are collapsed.
        changed:
          type: array
          description: |
            The rows that moved — or would move, on a preview. Ordered as the run orders them, so
            the preview reads in the same order as the checklist behind the dialog.
          items:
            type: object
            required: [executionId, caseKey, assigneeId, assigneeName]
            properties:
              executionId: { type: string, format: uuid }
              caseKey: { type: string, example: TC-42 }
              assigneeId:
                type: string
                format: uuid
                nullable: true
                description: Where the row lands. Null when the act unassigns.
              assigneeName:
                type: string
                nullable: true
                description: |
                  Resolved at read time from the company's membership, never stored. Null when the
                  row is being unassigned, and null when the id names a membership that no longer
                  exists at all — the client owns that copy, which is why this is nullable rather
                  than a server-invented placeholder.
        unchanged:
          type: array
          description: |
            Case keys already in the requested state — compliant, not failed. **No audit row is
            written for these**, which is the same rule the single-row endpoint applies: two people
            handing one case to one tester are agreeing, not conflicting.
          items: { type: string, example: TC-43 }
        skipped:
          type: array
          description: Selected ids that could not be assigned, each with a displayable reason.
          items:
            type: object
            required: [executionId, reason]
            properties:
              executionId: { type: string, format: uuid }
              reason:
                type: string
                example: 'That execution is not part of this run.'
        bulkOperationId:
          type: string
          format: uuid
          nullable: true
          description: |
            The id every `audit_event` row this act wrote shares — the join between the result and
            the trail, and the first value ever written into `audit_event.bulk_operation_id`.

            **Null on a preview** (nothing happened) and **null on a commit that changed nothing**
            (no rows were written, so naming a group with no members would be a lie). Otherwise a
            fresh id per act.

    DefectLink:
      type: object
      required: [id, externalKey, provider, url]
      properties:
        id: { type: string, format: uuid }
        externalKey: { type: string, example: 'PAY-991' }
        provider:
          type: string
          example: EXTERNAL
          description: |
            Which tracker holds the key. `EXTERNAL` — *a link a person made* — for every row
            written through this API, because pre-M4 there is no `IssueTracker` port to establish
            anything else against. `V1` defaulted the column to `JIRA` and `V62` dropped that
            default: it named a product the instance does not talk to, and would have left M4
            unable to tell a real Jira row from a defaulted one.
        url:
          type: string
          description: |
            Where the defect lives, `http` or `https`. **Required, and the column was nullable
            until `V62`** — nothing had violated this declaration only because the table had no
            writer.
        statusCache:
          type: string
          nullable: true
          description: |
            The tracker's status as of the last sync — and **`null` for every row until M4**,
            which is a true answer rather than a missing one: nothing has been synced because
            there is nothing to sync. No caller may set it (`DefectLinkInput` has no such field),
            because one person's guess recorded as a tracker's answer is the claim `V62` removed
            from `provider`.

    DefectLinkInput:
      type: object
      description: |
        Two fields, and **the absences are the design.** No `provider`, because a caller cannot
        establish one before the `IssueTracker` port exists and an unverified `JIRA` reads as a
        deliberate statement rather than as an unfilled column. No `statusCache` or `syncedAt`,
        because those are a tracker's answers. No `caseId`, because every reader of `defect_link`
        is execution-scoped and the execution is named by the path.
      required: [externalKey, url]
      properties:
        externalKey:
          type: string
          example: 'PAY-991'
          description: |
            The tracker's own identifier. Free text: this product knows no tracker's key format,
            and refusing a shape it guessed at would reject a real key from a real system.
        url:
          type: string
          example: 'https://tracker.acme.test/browse/PAY-991'
          description: |
            **`http` or `https` only, and this is a security bound rather than tidiness.** Three
            screens render the stored value as an anchor's `href`, where `javascript:` executes in
            the reader's session and `data:` renders attacker-authored HTML on this product's
            origin. Refused at the write, which is the one place it can be refused once.

    # ----------------------------------------------------------- history ---
    CaseHistorySummary:
      type: object
      description: |
        Defaults to the CURRENT version only, and says so — blending results across
        versions reports a number nobody should act on (plan §6p).
      required: [scope, currentVersionNo, executions, passed, failed]
      properties:
        scope: { type: string, example: 'Current version (v7)' }
        currentVersionNo: { type: integer }
        executions: { type: integer }
        passed: { type: integer }
        failed: { type: integer }
        lastExecutedAt: { type: string, format: date-time, nullable: true }
        flakinessScore:
          type: number
          nullable: true
          description: Alternation WITHIN one version and configuration only (plan §6p).
        firstFailedAt: { type: string, format: date-time, nullable: true }
        firstFailedInRelease: { type: string, nullable: true }

    ExecutionHistoryEntry:
      type: object
      required: [executionId, statusKind, statusName, statusColor, caseVersionNo, runId, runKey, runName, runDeleted, configuration, executedBy, source, executedAt, evidenceCount, defects]
      properties:
        executionId: { type: string, format: uuid }
        statusKind: { $ref: '#/components/schemas/StatusKind' }
        statusName: { type: string }
        statusColor: { type: string }
        caseVersionNo: { type: integer }
        releaseVersion: { type: string, nullable: true }
        buildNumber: { type: string, nullable: true }
        runId: { type: string, format: uuid }
        runKey: { type: string }
        runName: { type: string }
        runDeleted:
          type: boolean
          description: |
            The run holding this result has been withdrawn. The entry stays — plan §6p: "deleted
            runs must not orphan history … with the entry marked rather than vanishing", and
            history that quietly loses rows is worse than no history.

            This is the field that makes that rule expressible, and it is required because the
            alternative reading of an absent flag is "not deleted", which is the dangerous default:
            a withdrawn failure would read as a live one. A client MUST mark the entry and MUST NOT
            offer navigation into the run, which answers 404.

            Note the contrast with the plan-statistics endpoint, which EXCLUDES deleted runs
            entirely: that one reports current state, where counting a retracted result would
            restore it. A timeline is the other case.
          example: false
        planKey: { type: string, nullable: true }
        configuration: { type: string }
        executedBy:
          # Nullable for two independent reasons, both reachable: test_execution.executed_by is a
          # nullable column (an execution row nobody has recorded yet has none), and the id has no
          # cascade, so "the account that recorded this has since been removed" is a state real rows
          # reach. The SPA has always guarded this with `entry.executedBy?.displayName` — the type
          # said it could not be null while the only consumer assumed it could.
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
        executedByToken: { type: string, nullable: true }
        source: { type: string, enum: [MANUAL, INGESTED] }
        executedAt: { type: string, format: date-time }
        durationMs: { type: integer, nullable: true }
        evidenceCount: { type: integer }
        defects:
          type: array
          items: { $ref: '#/components/schemas/DefectLink' }

    SuiteHistoryResponse:
      description: |
        A NAMED schema rather than an inline object on the operation, and that is the point of it.
        Inline, the SPA typed its own `{ runs, versionMarkers }` literal at the call site — and
        called the array `runs` while this contract called it `entries`. Nothing compared the two
        spellings, because a hand-written type argument is not generated from anything. Named, the
        SPA imports `SuiteHistoryResponse` and the compiler is the comparison (§52).
      type: object
      # Both arrays are always sent; empty is the answer for a suite with no history, and an
      # absent array would make the page unable to tell "none" from "not loaded".
      required: [entries, versionMarkers, computedAt]
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/SuiteRunSummary' }
        versionMarkers:
          type: array
          items: { $ref: '#/components/schemas/VersionMarker' }
        computedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            When the pre-aggregated `suite_run_summary` rollup these figures come from was last
            written (§6p, §101). **Null means the answer was computed live**, from the executions
            themselves, and is therefore current as of this request — a positive statement, not a
            missing value. A suite whose runs are all newer than the last rollup tick answers null.

            Required rather than optional precisely because the two readings must be
            distinguishable: an absent field would be indistinguishable from a live answer by a
            client that has not been updated, which is the wrong direction to fail in.

    SuiteRunSummary:
      type: object
      required: [runId, runKey, runName, suiteVersionNo, configuration, executedAt, counts, runDeleted]
      properties:
        runId: { type: string, format: uuid }
        runKey: { type: string }
        runName: { type: string }
        suiteVersionNo: { type: integer }
        configuration: { type: string }
        releaseVersion: { type: string, nullable: true }
        executedAt:
          type: string
          format: date-time
          description: |
            The most recent result recorded against this suite in this run, falling back to the
            run's own start when nothing in the suite has been executed yet — a run that has
            opened but recorded nothing is still history ("this suite is in flight"), and the
            page sorts by this field, so it cannot be null.
        counts: { $ref: '#/components/schemas/ResultCounts' }
        runDeleted:
          type: boolean
          description: |
            The run was soft-deleted. §6p: deleted runs must not orphan history — the entry stays
            and is marked, because history that quietly loses rows is worse than no history. Same
            field, same reason, as `ExecutionHistoryEntry.runDeleted` (§49).

    # --------------------------------------------------------- reporting ---
    RepositoryDashboard:
      type: object
      required:
        [generatedAt, lifecycle, health, healthComputedAt, byFeature, byOwner,
         automationCoverage, recentActivity]
      properties:
        generatedAt: { type: string, format: date-time }
        lifecycle:
          type: array
          items: { $ref: '#/components/schemas/DashboardTile' }
        health:
          type: array
          items: { $ref: '#/components/schemas/DashboardTile' }
        healthComputedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            When these signals were last derived, or **null when they never have been**.
            The two are not the same and must not render the same: an empty `health` array
            with a timestamp means "nothing is wrong", while one with `null` means "nobody
            has looked". `case_health` is a read model with no writer yet (plan §6o), so
            this is null in every deployment today — and a "Needs attention" panel that
            renders empty without saying so is the reassuring-but-false screen §6p exists
            to prevent.
        byFeature:
          type: array
          items: { $ref: '#/components/schemas/DashboardBreakdown' }
        byOwner:
          type: array
          items: { $ref: '#/components/schemas/DashboardBreakdown' }
        automationCoverage:
          type: object
          required: [automated, toBeAutomated, manual, notAutomatable, coveragePercent]
          properties:
            automated: { type: integer }
            toBeAutomated: { type: integer }
            manual: { type: integer }
            notAutomatable: { type: integer }
            coveragePercent:
              type: number
              description: automated / (total - notAutomatable) — honestly denominated (plan §6c).
        recentActivity:
          description: |
            Thirty days ending today, UTC, one point per day including days with no
            activity. **There is deliberately no `approved` series.** Nothing in the schema
            records *when* a case was approved — `test_case.lifecycle_status` is current
            state, and `audit_event.changes` carries the version number rather than a field
            diff by design — so the series could only ever be zero, and a flat zero line
            states "nobody approved anything this month" about a client's work rather than
            "this is not measured". It returns when the review workflow (§6g) gives
            approval a timestamp to count.
          type: array
          items:
            type: object
            required: [date, created, modified]
            properties:
              date: { type: string, format: date }
              created: { type: integer }
              modified: { type: integer }

    DashboardTile:
      type: object
      description: |
        `filter` is the query that reproduces this count — the tile is a link into
        a pre-filtered, bulk-actionable case list, not decoration (plan §6o).

        **`key` is the enum constant and there is no `label` (§180).** It is a
        `HealthSignal` on the `health` tiles and a `LifecycleStatus` on the `lifecycle`
        ones, and the client labels it from the same catalogue it labels every other
        occurrence of that enum with. A `label` here was a second set of English words
        for a closed set the client already labels — six of the ten health signals
        disagreed with it, so the tile *"Outdated — spec changed"* opened a case list
        whose chips read *"Linked spec changed"*, on the one navigation where the two
        vocabularies meet. `CaseService.facets` has refused the same duplication since
        M1. What the tile keeps is the property that mattered: `filter` is opaque to the
        client, so a tile whose key it cannot label still renders and still drills.
      required: [key, count, severity, filter]
      properties:
        key: { type: string }
        count: { type: integer }
        # A $ref since §179 rather than this schema's own inline enum: the same vocabulary is on the
        # wire for a bare signal now, and two inline copies of a closed set is the shape nothing
        # compares.
        severity: { $ref: '#/components/schemas/HealthSignalSeverity' }
        filter:
          type: object
          additionalProperties: true

    DashboardBreakdown:
      type: object
      description: |
        One stacked bar — a Feature or a person — split by authoring status.

        `label` here is **data**, not a rendering of an enum: a classification path or a
        person's display name, which only the server can resolve. Its segments carry
        neither a label nor a colour (§180): a segment's `key` is a `LifecycleStatus`,
        so both were presentation for a closed set the client already has a table for —
        and the colour was the sharper of the two, because the server composed
        `var(--color-…)` from the constant's own name while the client kept the identical
        four strings in a map, two mechanisms nothing compared.
      required: [id, label, segments]
      properties:
        id: { type: string }
        label: { type: string }
        segments:
          type: array
          items:
            type: object
            required: [key, count, filter]
            properties:
              key: { type: string }
              count: { type: integer }
              filter:
                type: object
                additionalProperties: true

    PlanStatistics:
      type: object
      required: [planId, planKey, planName, planVersionNo, aggregationPolicy, counts, coveragePercent, stale, computedAt, byConfiguration, bySuite, blockers, notRun, exitCriteria, trend]
      properties:
        planId: { type: string, format: uuid }
        planKey: { type: string }
        planName: { type: string }
        planVersionNo: { type: integer }
        aggregationPolicy: { $ref: '#/components/schemas/AggregationPolicy' }
        counts: { $ref: '#/components/schemas/ResultCounts' }
        coveragePercent:
          type: number
          description: |
            Distinct in-scope cases carrying any result, over every case in scope, times 100.
            A headline figure, not a footnote — 89% pass over 40% coverage is not green
            (plan §6p). Independent of `aggregation`: a case is covered or it is not,
            whichever way its several results resolve to one.
        latestExecutionAt: { type: string, format: date-time, nullable: true }
        stale:
          type: boolean
          description: |
            **Nothing has been executed against this plan in 14 days.** Plan §6p: "a plan page
            showing 94% from three weeks ago, presented as current, is the most dangerous screen
            in the product". False for a plan with no results at all, which is un-started rather
            than stale, and the `counts.total == counts.notRun` branch already says so in
            plainer words.

            ~~Not a freshness warning about the figures themselves, which are computed per
            request.~~ → **superseded 2026-08-06 (§101)**: the figures are no longer always
            computed per request, so the clause that distinguished the two is now `computedAt`
            rather than that sentence. The distinction it drew still holds and is now the reason
            there are two fields — `stale` is about the **executions**, `computedAt` is about the
            **arithmetic**. A plan executed an hour ago and rolled up ten minutes ago is fresh by
            one measure and ten minutes behind by the other, and a client that renders them as one
            signal has reintroduced the ambiguity §6p wrote the sentence to remove.
        computedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            When the pre-aggregated `plan_snapshot` rollup these figures come from was last
            written (§6p, §101). **Null means the answer was computed live** and is current as of
            this request — a positive statement, not a missing value.

            Live is the answer for the `WORST` and `ALL` aggregation policies, which a
            latest-result-per-case rollup **structurally cannot serve**: each needs every
            execution, and this table keeps one row per case per configuration. `LATEST` and
            `LATEST_PER_CONFIG` are served from the rollup. It is also the answer for a plan whose
            rollup has not been written yet, which is every plan for up to one scheduler tick
            after its first result.

            That the same screen answers from two sources depending on a dropdown is exactly why
            this field is required and not inferred: two staleness behaviours with no way to tell
            them apart is §65's two-contradictory-percentages defect with the contradiction hidden.
        byConfiguration:
          type: array
          items:
            type: object
            required: [configuration, counts]
            properties:
              configuration: { type: string }
              counts: { $ref: '#/components/schemas/ResultCounts' }
        bySuite:
          type: array
          items:
            type: object
            required: [suiteId, suiteKey, suiteName, counts]
            # All three are nullable together: one row groups the in-scope cases filed in NO
            # suite. Omitting that row instead would make this breakdown stop summing to the
            # headline counts above it — two numbers on one screen with nothing to identify the
            # wrong one, which is the defect this file already records on the suite tree.
            properties:
              suiteId: { type: string, format: uuid, nullable: true }
              suiteKey: { type: string, nullable: true }
              suiteName: { type: string, nullable: true }
              counts: { $ref: '#/components/schemas/ResultCounts' }
        blockers:
          type: array
          items: { $ref: '#/components/schemas/TestExecutionSummary' }
        notRun:
          # Was TestCaseSummary until M2 slice 3, and narrowing it was the price of keeping
          # the `execution` -> `repository` seam one class wide. TestCaseSummary requires
          # features, tags, healthSignals, automationStatus, owner and updatedAt — none of
          # which this panel renders, and every one of which would have to be re-derived
          # here from case_classification, case_tag, case_health and app_user, duplicating
          # repository.CaseSummaries inside a module forbidden to import it.
          type: array
          items: { $ref: '#/components/schemas/PlanCaseRef' }
        exitCriteria:
          type: array
          items: { $ref: '#/components/schemas/Criterion' }
        trend:
          type: array
          items:
            type: object
            required: [runKey, executedAt, passRate]
            properties:
              runKey: { type: string }
              executedAt: { type: string, format: date-time }
              passRate: { type: number }

    PlanCaseRef:
      type: object
      description: |
        A case named in a plan's scope, carrying only what a plan-level list renders.
        Deliberately not TestCaseSummary: the `execution` module may not read the
        repository's tables except through one seam class (ERD §0.2), and every field
        beyond these six would widen that seam to serve a panel that shows a key, a
        title and a suite name.
      required: [id, key, keySeq, title, suiteId, suiteName]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: TC-1 }
        keySeq:
          type: integer
          description: Sort by this — text keys do not order correctly (TC-10000 < TC-9999).
        title: { type: string }
        # Nullable together — an in-scope case filed in no suite. Required still, because the
        # panel renders a "not filed" label rather than a blank column.
        suiteId: { type: string, format: uuid, nullable: true }
        suiteName: { type: string, nullable: true }

    ReportDefinition:
      type: object
      required: [id, type, name, parameters, owner]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        name: { type: string }
        parameters:
          type: object
          additionalProperties: true
        owner: { $ref: '#/components/schemas/UserRef' }

    ReportDefinitionInput:
      type: object
      required: [type, name]
      properties:
        type:
          type: string
          example: run_summary
          description: |
            One of the types this server can compute — the same open set `generate` takes, checked
            the same way and refused in the same words.
        name:
          type: string
          description: What the person will recognise it by. Required, non-blank; not unique.
        parameters:
          type: object
          additionalProperties: true
          description: |
            The saved selection, defaulting to `{}` when absent. **Not validated against the report
            type**, deliberately: a definition is edited over several releases and a parameter that
            becomes required later would make an existing saved report unsaveable, while the
            *generate* it feeds refuses a bad selection with the report's own sentence at the
            moment it is used.

    ReportCapabilities:
      type: object
      required: [formats]
      description: |
        What this deployment can produce. See `GET …/reports/capabilities` for why it is an answer
        rather than a property of the wire.
      properties:
        formats:
          type: array
          description: |
            Every value of `generate`'s `format` this server can actually render, sorted. A picker
            built from this offers only options that work; the enum stays wider on purpose, so a
            deployment that installs the PDF renderer can be asked for one without a contract
            change. Never empty in a working deployment — `MD` and `HTML` ship in the image — and
            a client should still render an empty list as "this server cannot produce reports"
            rather than as a loading state that never ends.
          items:
            type: string
            enum: [PDF, MD, HTML]

    ReportJob:
      type: object
      # Every field is required, and three of them are nullable — always present, sometimes null.
      # A poller reads `status` to decide whether to keep polling and must not have to null-check
      # the field it polls on, nor guess whether an absent `error` means "no error" or "this server
      # does not send one".
      required: [jobId, type, status, format, requestedAt, downloadUrl, modelUrl, error]
      properties:
        jobId: { type: string, format: uuid }
        type:
          type: string
          description: The report that was asked for, echoed back. See the generate operation.
        status: { type: string, enum: [PENDING, RUNNING, COMPLETED, FAILED] }
        format: { type: string }
        requestedAt:
          type: string
          format: date-time
          description: |
            When the request was made — never null, because a job exists only by having been
            asked for. It is here rather than only in the database because `GET …/reports/jobs`
            serves a list ordered by it, and a list whose order a reader cannot see is one they
            have to take on trust.

            Deliberately not `startedAt`/`finishedAt`: those are the worker's business, and a
            client that renders them starts explaining the queue rather than the report.
        downloadUrl:
          type: string
          nullable: true
          description: |
            Where the rendered artifact is, in the format that was asked for. Null until the job
            reaches COMPLETED, and null for ever on a FAILED one.

            **Server-supplied, never composed by the client.** The route it points at is
            `GET /projects/{projectId}/reports/artifacts/{artifactId}/content`, and a client that
            built that string itself would be holding a second copy of the server's routing —
            which is what makes moving the route a breaking change nothing detects (§67, on
            `Evidence.url`).
        modelUrl:
          type: string
          nullable: true
          description: |
            Where the serialized report **model** is — the same JSON the on-screen view renders,
            written for every job alongside whatever format was asked for.

            This is what makes the screen and the export provably one model rather than two
            computations that can disagree (plan §6e: "the on-screen report view consumes the same
            model via JSON, so what you see is what exports").

            **It points at `GET …/reports/jobs/{jobId}/model`, not at the artifact route**, and the
            two are gated differently on purpose: reading a report costs `report:view` and carrying
            one off costs `report:export`. ~~When `format` is itself JSON both fields point at the
            same artifact.~~ → they no longer point at the same *route* in any case, which is what
            keeps a JSON export from being reachable under the cheaper key.

            **Shape (§88):** `{ header, report }`. `header` is the provenance block §6e makes
            mandatory — report type, company, project scope and what that scope means for the
            numbers, who generated it, when, and the complete selection as it was sent. `report` is
            `{ title, metadata, sections }`. The on-screen view must render the header it finds here
            rather than assembling one from the job row: two assemblies of one header is the drift
            the single-model design exists to prevent.
        error:
          type: string
          nullable: true
          description: |
            Why a FAILED job failed, in a sentence written to be shown to the person who asked.
            Null in every other state.

            Report-specific parameter faults surface here rather than as a 400 — a `runId` naming
            a run in another project cannot be checked without reading the database, and doing so
            on the request path would mean a second copy of every report's parameter rules. What
            the request *can* refuse, it refuses with a 400: see the generate operation.

    # ----------------------------------------------------- documentation ---
    DocPageSummary:
      type: object
      required: [id, key, title, slug, status, updatedAt]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: DOC-1 }
        parentId: { type: string, format: uuid, nullable: true }
        title: { type: string }
        slug: { type: string }
        status: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] }
        updatedAt: { type: string, format: date-time }
        # The page's subject, when it is *about* another artifact rather than free-standing.
        #
        # An opaque pair — no foreign key, and the server joins on it nowhere. That is what lets one
        # page type serve several artifact kinds, and it is the only shape available here: a test
        # plan lives in `execution`, which `documentation` may not depend on and which may not
        # depend on `documentation` either, so neither side can hold a column pointing at the other.
        # `Review`'s subject triple is the same decision for the same reason.
        #
        # Null on an ordinary page, which is nearly all of them.
        subjectType: { type: string, enum: [TEST_PLAN], nullable: true }
        subjectId: { type: string, format: uuid, nullable: true }

    DocPage:
      allOf:
        - $ref: '#/components/schemas/DocPageSummary'
        - type: object
          # `required` does not descend through allOf, so this branch declares its own — the same
          # repair TestCase and TestPlan already carry. Without it `lockVersion` cannot be sent as
          # If-Match without a null check on a value every response has.
          required: [blocks, attachments, currentVersionNo, lockVersion]
          properties:
            blocks:
              type: array
              items: { $ref: '#/components/schemas/DocBlock' }
            attachments:
              type: array
              items: { $ref: '#/components/schemas/Attachment' }
              description: |
                Files on the page — the wireframe, the signed-off mock-up, the data sheet the
                paragraphs describe. `attachment.owner_type = 'DOC_PAGE'`, which `V1` declared
                and nothing wrote until decision round 3's #49.

                **Detail-only**, like `TestCase.attachments`: `DocPageSummary` has no such
                field, because the tree renders every page in the project and none of those
                rows show a file.

                Never null. A page with no files and a page nobody has attached to are the
                same page, so unlike the `flake` on a case there is no third state to express
                and a nullable list would be two spellings of nothing.

                Written and removed through the endpoints below, both costing **`doc:edit`** —
                an attachment is *content*, so whoever may rewrite the paragraphs may attach
                the diagram they describe. Not `doc:publish` ~~, which would leave a Test
                Engineer able to author a specification they could not illustrate~~ → both keys
                are a contributor's since `V52` (§210), so the choice no longer excludes anybody;
                it says which of the two acts this is, and attaching is writing.
            currentVersionNo: { type: integer }
            lockVersion: { type: integer }

    DocPageSearchHit:
      allOf:
        - $ref: '#/components/schemas/DocPageSummary'
        - type: object
          # `required` does not descend through allOf — `DocPage` above carries the same repair for
          # the same reason.
          required: [snippet]
          properties:
            snippet:
              type: string
              nullable: true
              description: |
                The fragment of the page's text the match was found in, as `ts_headline` chose it —
                which is the point of returning it at all: a list of titles is the page tree with
                extra steps, and *where* a word appears is what tells a reader which of four
                specifications mentioning "refund" is the one they meant.

                **Plain text, with no highlight markup**, and that is a decision rather than an
                omission. Emitting `<mark>` would make this endpoint responsible for escaping page
                content the product otherwise stores and renders as text, so one unescaped `<` in
                somebody's specification becomes markup a client is being invited to trust. The
                fragment's *location* carries most of the value; the emphasis is a rendering concern
                and belongs to whoever renders it.

                **Null when the page has no block text** — a page matched on its title alone, which
                is every page created and not yet written into. Present-and-null rather than absent,
                the distinction `DocBlock.coverage` exists to make: a client showing a title with
                nothing under it is showing the true answer, not a field it failed to read.

    DocBlock:
      type: object
      # `links` and `coverage` joined the required set in §168, and the second is why the first
      # could: the server has one rendering path for a block and Jackson's default inclusion emits
      # both keys on every response there has ever been, so this records what is already true rather
      # than promising something new. Both are still *nullable* in the sense that matters —
      # `coverage` is null on a block nothing verifies — and that is precisely the distinction
      # `required` makes machine-checkable: present-and-null is an answer, absent is not.
      required: [id, position, blockType, text, links, coverage]
      properties:
        id:
          type: string
          format: uuid
          description: |
            Immutable, generated at creation, never derived from text. Links target
            this — heading-text anchors break silently when a typo is fixed (plan §6i).
        position: { type: integer }
        blockType: { type: string, enum: [heading, paragraph, list, code, table, image] }
        level:
          type: integer
          nullable: true
          description: |
            Heading depth on a `heading`; **indent depth on a `list`**; null on every other type.
        text: { type: string }
        rows:
          description: |
            A `table` block's cells, row-major. Null on every other type.

            **The first row is the header, always, and there is no flag saying so.** A boolean
            would have two states that look identical in an editor and differ only in what a
            screen reader announces for every cell below — so it gets set wrong and nothing
            reports it. A table in a specification whose columns are unnamed is one where a
            reader cannot tell what a cell means; if a table genuinely has no header, its first
            row names the columns anyway.

            Every row has the same length — the server refuses a ragged one rather than padding
            it, because a padded table cannot say which cell was missing.

            `text` on a `table` is the **caption**, and it is what the coverage matrix reads as
            the block's statement. The cells are data, not requirements.
          type: array
          nullable: true
          items:
            type: array
            items: { type: string }
        attachmentId:
          description: |
            An `image` block's file — an attachment **on this page** (`DocPage.attachments`).
            Null on every other type.

            A block does not carry the bytes or the URL: it names a file the page already
            holds, so the image has one owner, one delete path and one 10 MB ceiling. Removing
            that attachment while a block names it is a `409`, not a broken image.

            `text` on an `image` is its **alt text** and may not be blank — an image in a
            specification is never decorative, and the words are what a reader who cannot see it
            gets.
          type: string
          format: uuid
          nullable: true
        links:
          description: |
            What is linked to this block — the reverse of `TestCase.relatedDocuments`, read from the
            same `doc_link` rows.

            Present and possibly empty, unlike `coverage`. The distinction is deliberate: this array
            says *which cases claim to verify this statement*, which the server knows exactly, and an
            empty one truthfully means nobody has claimed it. `coverage` would say how those cases
            are **doing**, which the server cannot answer here — see below.
          type: array
          items: { $ref: '#/components/schemas/BlockLink' }
        coverage:
          description: |
            Inline coverage marker — what makes people maintain links (plan §6i).

            ~~Still absent … `passed` / `failed` / `notRun` are `test_execution` joined to
            `test_case`, two modules `documentation` may not name~~ → **superseded (§168): it is
            served.** §166 mirrored each case's newest recorded result onto
            `case_health.last_status_kind`, which is one table in `repository` — the module this one
            already reads keys and titles from — so the join the argument named no longer has to
            happen here.

            **Null on a block nothing claims to verify, and never a row of zeros.** A zeroed marker
            does not read as "unknown", it reads as "no test case verifies this statement" — the SPA
            renders those words — so a zero fallback would put a specific and alarming claim on every
            paragraph of every specification. An absent marker is the absence of a claim; `links`,
            which is present and possibly empty, is where "nobody has claimed this" is stated.

            **`VERIFIES` links only**, which is the coverage matrix report's rule over the same rows:
            a block linked only by `REFERENCES` or `DERIVED_FROM` has links and no marker, because
            neither is a claim to verify anything.

            The counts are by `StatusKind` and **always sum to `linkedCases`**. `notRun` is wider
            than "never executed": `BLOCKED`, `SKIPPED`, `RETEST`, `UNTESTED` and `WIP` land there
            too. Three counts for six kinds, and the three that are not a verdict belong with the
            ones never asked for — a roll-up that could go either way must not go the way that makes
            the numbers look better than the truth.

            Freshness is the health recompute's, not this request's: the mirrored result is
            refreshed on `execution.results_changed`, so a just-submitted result reaches this marker
            a projection later. That is also what makes this marker and `TestCase.lastResult`
            incapable of disagreeing — they read the same column.
          type: object
          nullable: true
          required: [linkedCases, passed, failed, notRun, caseKeys]
          properties:
            linkedCases:
              description: |
                Distinct live cases of this project claiming to verify this block. Never `0` — a
                block with none has no marker at all. One case linked twice (two relationships, or a
                double-submit) counts once.
              type: integer
            passed: { type: integer }
            failed: { type: integer }
            notRun: { type: integer }
            caseKeys:
              description: |
                In the same order as `links`, so the marker and the bullets under it read as one
                sequence. Not sorted: `TC-9` sorts after `TC-10` as text.
              type: array
              items: { type: string }

    DocPageInput:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 200 }
        parentId:
          type: string
          format: uuid
          nullable: true
          description: |
            The page this one nests under, or null for a root page. Accepted on create; on a
            `PATCH` it must match the page's current parent — a different value is a `400` rather
            than a silently ignored field, because reparenting rewrites every descendant's `path`
            and a client must not be able to believe a move happened. Same rule, and the same
            reason, as `ClassificationValueInput.parentId`. (It was `SuiteInput.parentId`'s twin
            until §98 flattened suites; the doc tree and the classification tree are unaffected —
            §98 is about suites and nothing else, and a page genuinely nests.)
        blocks:
          type: array
          description: |
            The page's whole content, in array order — `position` is not sent, because two clients
            disagreeing about the numbers is a reordering nobody asked for.

            Omitted on a create means an empty page, which is a real and useful state. Omitted on a
            `PATCH` leaves the blocks alone: that is a retitle, and it must not be a way to empty a
            page by forgetting a field.
          items: { $ref: '#/components/schemas/DocBlockInput' }

    DocBlockInput:
      type: object
      required: [blockType, text]
      properties:
        id:
          type: string
          format: uuid
          nullable: true
          description: |
            The id of an existing block on this page, to edit it **in place**. Absent means a new
            block, whose id the server generates.

            This field is what makes traceability survive editing: a block keeps its id however
            much its text changes, so a link to it does not break when somebody fixes a typo
            (plan §6i/§6m). Sending an id belonging to another page — or to no block — is a `400`.
        blockType: { type: string, enum: [heading, paragraph, list, code, table, image] }
        level:
          type: integer
          nullable: true
          minimum: 1
          maximum: 6
          description: |
            Depth. **Three arms, not two** — required for `heading`, where it is the heading level;
            optional for `list`, where it is the bullet's indent depth and defaults to `1`; refused
            on every other type, because a level on a paragraph means the client believes it is
            sending something else.

            A list's depth is a field rather than markers typed into `text` (`1.` / `a.` / `i.`)
            because a nested test-scenario outline is the shape a test plan is mostly made of, and
            an outline encoded in prose cannot be indented, renumbered, or — the reason that
            settles it — **linked**: a `doc_link` targets a block, so a scenario a case can verify
            has to be its own block rather than a line inside one.
        text: { type: string }
        rows:
          description: |
            Required on a `table` and refused on every other type, for `level`'s reason: rows on
            a paragraph mean the client believes it is sending a table.

            At least one row, at most 100, at most 12 columns, every row the same length, every
            cell present and at most 500 characters. The bounds are product rules rather than
            schema ones — a table wider than a dozen columns is a data extract rather than a
            specification, and a cell longer than a sentence is a paragraph that should have
            been its own block so a case could link to it.

            The first row is the header. See `DocBlock.rows`.
          type: array
          nullable: true
          maxItems: 100
          items:
            type: array
            maxItems: 12
            items: { type: string, maxLength: 500 }
        attachmentId:
          description: |
            Required on an `image` and refused on every other type.

            Must name a file already attached to **this** page. A `400` otherwise, for
            `parentId`'s reason: an unchecked id would let a block reference another page's
            file, which every read then fails to resolve — a block created successfully and
            immediately broken.

            **A create can never carry one.** A page has no attachments until it exists, so an
            image block is added by a second save: create the page, attach the file, reference
            it. The refusal says that rather than reporting the id as unknown.
          type: string
          format: uuid
          nullable: true

    PlanDocumentLinkInput:
      type: object
      required: [pageId]
      properties:
        pageId:
          type: string
          format: uuid
          description: |
            A page **of this project**. One belonging to a sibling project is a `404` for
            `BlockLinkInput.sourceId`'s reason — RLS reaches across the company, so the project
            predicate is what refuses it, and a distinguishing error would confirm the page exists.

    DocPageStatusInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] }

    RunStatusInput:
      type: object
      required: [status]
      properties:
        # All four values, not only the two terminal ones: the live pair is how a run is reopened,
        # and the server normalizes between them rather than trusting which one the client sent.
        status: { type: string, enum: [NOT_STARTED, IN_PROGRESS, COMPLETED, ABORTED] }

    BlockLink:
      type: object
      description: |
        One `doc_link` seen from the **block** end: what claims to verify this statement.

        `DocLink` is the same row seen from the case end, and the two are not merged. Each names the
        thing at the *other* end and omits the thing the reader already has — a case's view carries
        the page and block, a block's view carries the case — so a merged schema would be half-null
        in both directions and would let a client read the field that happens to be populated
        without noticing which end it is standing at.
      required: [id, sourceType, sourceId, sourceKey, sourceTitle, relationship]
      properties:
        id: { type: string, format: uuid }
        # DEFECT and DOC_PAGE are legal in the column and are not offered here: neither has a writer,
        # and enumerating a value nothing can produce makes a client branch on a case it will never
        # see. The column's CHECK stays wider than this enum on purpose.
        sourceType: { type: string, enum: [TEST_CASE, SUITE] }
        sourceId: { type: string, format: uuid }
        sourceKey: { type: string, example: TC-42 }
        sourceTitle: { type: string }
        relationship: { type: string, enum: [VERIFIES, DERIVED_FROM, REFERENCES] }

    BlockLinkInput:
      type: object
      required: [sourceType, sourceId]
      properties:
        sourceType: { type: string, enum: [TEST_CASE, SUITE] }
        sourceId:
          type: string
          format: uuid
          description: |
            A case or suite **of this project**. One belonging to a sibling project is a `404`, not a
            `400`: the row is reachable within the company, so a distinguishing error would answer
            "that case exists, elsewhere" to somebody who cannot see it.
        relationship:
          type: string
          enum: [VERIFIES, DERIVED_FROM, REFERENCES]
          default: VERIFIES
          description: |
            Defaults to `VERIFIES`, which is what a test case linked to a scenario means and what
            the column already defaults to.

    LinkRelabelInput:
      type: object
      # ONE schema for both ends of the act, and one Java record behind it. A block link is
      # corrected under `doc:edit` on the documentation page and an external link under `case:edit`
      # on the case; what is being said is identical, and §173 is the section that paid for letting
      # one act acquire two spellings.
      required: [relationship]
      properties:
        relationship:
          type: string
          enum: [VERIFIES, DERIVED_FROM, REFERENCES]
          description: |
            **Required, and with no default — the one place this differs from the create.**

            An absent `relationship` on a `POST` means "the ordinary one" and resolves to
            `VERIFIES`. On a correction it means the caller did not say what to correct it *to*, and
            defaulting there would have the server invent a claim on somebody's behalf — on the
            field whose entire purpose is to keep *proves it* and *mentions it* apart.

    ExternalLinkInput:
      type: object
      # One body for both external kinds rather than two schemas or a discriminated union. The
      # field that decides is on the wire regardless — targetKind is what the row stores — and a
      # union would surface in the generated TypeScript as an either the caller has to narrow.
      # The invalid combinations are refused per field by the server, which is where a form can act
      # on them; this shape is the wire and not the rule.
      required: [targetKind]
      properties:
        targetKind:
          type: string
          enum: [EXTERNAL_GIT, EXTERNAL_URL]
          description: |
            Required, with no default. Inferring it from which fields are populated is how a
            request carrying both a URL and a path gets silently interpreted rather than refused.
        relationship:
          type: string
          enum: [VERIFIES, DERIVED_FROM, REFERENCES]
          default: VERIFIES
        repo:
          type: string
          example: acme/checkout-service
          description: |
            `EXTERNAL_GIT` only, and **required** for it — which is narrower than the column, whose
            CHECK asks only for a path and a sha. A path with no repository names a file in an
            unnamed project, which is a link nobody can follow.
        path:
          type: string
          example: src/main/java/com/acme/Checkout.java
          description: '`EXTERNAL_GIT` only, and required for it.'
        lineStart:
          type: integer
          minimum: 1
          description: |
            Optional. Both line numbers absent is a link to a whole file, which is a legitimate
            claim; an end without a start is refused.
        lineEnd:
          type: integer
          minimum: 1
          description: 'Optional, and never less than `lineStart`.'
        commitSha:
          type: string
          example: 4f9c2b1
          description: |
            **Required for `EXTERNAL_GIT`** — 7 to 40 hexadecimal characters. A branch or tag name
            is refused: it moves, and an unpinned range points at different code after the next
            push (open question #26, plan §6m). Abbreviated shas are accepted because that is what
            people paste.
        url:
          type: string
          format: uri
          description: |
            **Required for `EXTERNAL_URL`**, `http` or `https` only. The scheme is a security bound
            rather than tidiness — this value is rendered as an anchor's `href`, and a
            `javascript:` URL there runs in the reader's session.

    ExternalLink:
      type: object
      # The create's answer, and neither of the other two link records can be it: BlockLink has no
      # external columns (a link with no block never renders on a page) and DocLink is assembled in
      # `repository`, off a mirror that has not been refreshed yet at the moment this is written.
      # It deliberately does not echo the case — the caller named it in the path (§163).
      required: [id, targetKind, relationship]
      properties:
        id: { type: string, format: uuid }
        targetKind: { type: string, enum: [EXTERNAL_GIT, EXTERNAL_URL] }
        relationship: { type: string, enum: [VERIFIES, DERIVED_FROM, REFERENCES] }
        externalRepo: { type: string, nullable: true }
        externalPath: { type: string, nullable: true }
        externalLineStart: { type: integer, nullable: true }
        externalLineEnd: { type: integer, nullable: true }
        externalCommitSha: { type: string, nullable: true }
        externalUrl: { type: string, nullable: true }

    DocLink:
      type: object
      # SERVED SINCE §167 by repository.DocLinkView, off the case_doc_link read model — and the six
      # external* properties are served too SINCE §169, which gave the other two target kinds their
      # first writer (POST .../cases/{caseId}/external-links). They were pinned CONTRACT-ONLY in
      # ContractConventionTest.MEMBER_DIVERGENCE_BY_DECISION in both directions precisely so that
      # building the capability would fail the build until the entries were deleted; that is what
      # happened, and all six are gone.
      #
      # A row is one kind. A DOC_BLOCK link carries the four page/block properties and nulls the
      # six; an external link does the reverse. `targetKind` is what says which half is populated —
      # never the presence of a value, which is how a client comes to render a git link as an empty
      # page reference.
      required: [id, targetKind, relationship, stale]
      properties:
        id: { type: string, format: uuid }
        targetKind: { type: string, enum: [DOC_BLOCK, EXTERNAL_GIT, EXTERNAL_URL] }
        relationship: { type: string, enum: [VERIFIES, DERIVED_FROM, REFERENCES] }
        pageId: { type: string, format: uuid, nullable: true }
        pageKey: { type: string, nullable: true }
        pageTitle: { type: string, nullable: true }
        blockId: { type: string, format: uuid, nullable: true }
        blockExcerpt: { type: string, nullable: true }
        externalRepo: { type: string, nullable: true }
        externalPath: { type: string, nullable: true }
        externalLineStart: { type: integer, nullable: true }
        externalLineEnd: { type: integer, nullable: true }
        externalCommitSha:
          type: string
          nullable: true
          description: Mandatory for EXTERNAL_GIT — a line number without it is meaningless later.
        externalUrl: { type: string, nullable: true }
        stale:
          type: boolean
          description: |
            True when the target changed after the case was last touched (plan §6i).

            **Always `false` for an external target, and that is an answer rather than a default.**
            An `EXTERNAL_GIT` link is pinned to a commit, so the lines it names cannot change under
            it — that is what the mandatory sha buys. What can fall behind is the pin, and this
            field does not mean that: a marker saying "the spec changed, re-read it" on an
            immutable target would train readers to ignore it where it *is* computed. Answering
            "is the pin current" needs the product to talk to a git host, which is an integration
            and not a column.

            **Both halves are content versions, never `updated_at`** — the newest
            `doc_page_version` against the newest `test_case_version`. `ApprovalFacts` refused the
            timestamp spelling for the same comparison and its reason holds here twice over: a
            save whose content hash is unchanged writes no version and still moves `updated_at`,
            and on a case that column also moves when somebody assigns an owner or changes a
            lifecycle status. Under the timestamp spelling, giving a case an owner would forgive
            every spec change it had accumulated.

            **Page granularity, not block.** `doc_block` carries no timestamp and page versions
            snapshot the whole page, so an edit to an unrelated paragraph raises this too. That is
            the finest granularity the schema supports; closing it is a column on `doc_block`, a
            writer for it, and its own slice.

            **Computed at refresh time and stored**, so this marker and the case's
            `OUTDATED_SPEC_CHANGED` health signal — rendered on the same screen, one panel apart —
            move together. The cost is that editing a case does not clear its markers until the
            next recompute.

    Artifact:
      type: object
      required:
        [id, scope, category, kind, title, status, inherited, writeOnce, updatedBy, updatedAt]
      properties:
        id: { type: string, format: uuid }
        scope: { type: string, enum: [PROJECT, PLAN] }
        category: { type: string }
        kind: { type: string, enum: [FILE, DOC_PAGE_REF, EXTERNAL_URL, GENERATED_REPORT] }
        title: { type: string }
        description: { type: string, nullable: true }
        status:
          type: string
          enum: [ACTIVE, SUPERSEDED, ARCHIVED]
          description: |
            `ACTIVE` is where every registration starts. `ARCHIVED` is chosen, on
            `PUT /projects/{projectId}/artifacts/{artifactId}/status`, and reversible. `SUPERSEDED`
            is neither: it holds exactly when `supersededById` names a replacement, so it is
            written only by registering one and is never left.
        supersededById:
          type: string
          format: uuid
          nullable: true
          description: |
            The newer artifact that replaced this one, and `null` unless `status` is `SUPERSEDED`.

            Here because a status the reader cannot follow is a dead end — "superseded" without
            *by what* sends somebody scanning the register for a title they have to guess. The
            replacement is in the same register and at the same scope by construction, so a client
            resolves it from the rows it already holds rather than fetching it.
        inherited:
          type: boolean
          description: Project-scope artifact shown read-only inside a plan (plan §6n).
        url:
          type: string
          nullable: true
          description: |
            **Where this artifact points, whatever its kind.** The external link for
            `EXTERNAL_URL`, the download path for `FILE` (since that kind got a writer), and —
            since audit C6 — the **report download** for `GENERATED_REPORT`,
            `/projects/{projectId}/reports/artifacts/{artifactId}/content`. `null` only for
            `DOC_PAGE_REF`, which is reached by `docPageId`.

            The server builds it rather than the client composing
            `/projects/{projectId}/artifacts/{artifactId}/content`: a composed path is a second
            place the route is spelled, and a route change then breaks the download with a `404`
            that reads as a missing file.

            **Read `kind` before following it.** These values do three different things — one
            leaves the product for somebody else's site, one downloads the register's own bytes,
            and one downloads a report — and nothing about the string says which.

            **A `GENERATED_REPORT`'s link is gated as a report, not as an artifact**: that route
            costs `report:export`, so a reader holding `artifact:read` and not that key sees the
            entry, the title and the provenance and is refused the bytes. Pinning a report into
            the register records *that it was produced*; it does not re-license carrying it off.
        docPageId:
          type: string
          format: uuid
          nullable: true
          description: |
            Set when `kind` is `DOC_PAGE_REF`, so the register can link through to the page.

            Without it the kind plan §6n steers people toward is the one kind the reader cannot
            open — a row that says "Documentation page" and goes nowhere, while an `EXTERNAL_URL`
            beside it is clickable. That asymmetry would push people back to pasting links.
        filename:
          type: string
          nullable: true
          description: |
            The uploaded name, for `FILE` and `null` for every other kind. It was declared here
            with no writer behind it for three slices — the register renders a name and a size
            column for uploads — so nothing on either side changed shape when
            `POST /projects/{projectId}/artifacts/files` arrived.
        sizeBytes:
          type: integer
          format: int64
          nullable: true
          description: The stored size in bytes, for `FILE` and `null` otherwise.
        writeOnce:
          type: boolean
          description: |
            **A sign-off record — this row cannot be edited or removed** (`409` either way), and
            correcting it means superseding it. Set at registration and never after; see
            `ArtifactInput.writeOnce`.

            On the wire since audit C7, and the reason is §31's disable-don't-hide: the column has
            been enforced by two refusals the client had **no way to predict**, so Correct… and
            Remove… enabled on every sign-off row and the register answered a `409` after the
            user had written the correction. A client renders those controls disabled, with this
            as the reason.
        updatedBy: { $ref: '#/components/schemas/UserRef' }
        updatedAt: { type: string, format: date-time }

    ArtifactFileInput:
      type: object
      required: [scope, category, title]
      description: |
        The register fields beside an uploaded file — the `artifact` part of
        `POST /projects/{projectId}/artifacts/files`.

        **It carries no `kind`, no `url` and no `docPageId`**, and each omission removes a request
        that could otherwise be sent and would have to be refused. The kind is `FILE` by
        construction: there is no field to disagree with the endpoint the payload was sent to. That
        is `ArtifactInput.kind`'s own narrowing argument taken one step further — a client
        generating types from this contract cannot express the contradiction at all.

        Everything the two inputs share is validated by one server-side path, so a rule about
        titles or scopes cannot come out differently depending on which endpoint you reached it
        through.
      properties:
        scope:
          type: string
          enum: [PROJECT, PLAN]
          description: |
            As `ArtifactInput.scope`, including the qualifier: a Test Engineer may upload a cycle's
            sign-off (`PLAN`) and may not upload the project's test strategy (`PROJECT`). Bytes
            change nothing about who may write a row.
        planId:
          type: string
          format: uuid
          nullable: true
          description: Required when `scope` is `PLAN`, and rejected otherwise.
        category:
          type: string
          maxLength: 60
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000, nullable: true }
        supersedes:
          type: string
          format: uuid
          nullable: true
          description: |
            As `ArtifactInput.supersedes`. This is the field this endpoint's own description has
            been pointing at since it shipped — "replacing the document is superseding it" — and
            the replaced artifact need not itself be a `FILE`.
        writeOnce:
          type: boolean
          default: false
          description: |
            As `ArtifactInput.writeOnce`, and **this is the path a sign-off usually arrives by** —
            a countersigned PDF is bytes, not a link. Both creates take the flag because the
            register's promise is about the entry, not about where the document lives.

    ArtifactInput:
      type: object
      required: [scope, category, kind, title]
      description: |
        A registration. Which of `docPageId` / `url` is required is decided by `kind`, and which of
        `planId` is required is decided by `scope` — both are validated server-side and answered as
        a `400` naming the field, because a schema that expressed them as `oneOf` would generate a
        union the SPA has to discriminate before it can render one form.
      properties:
        scope:
          type: string
          enum: [PROJECT, PLAN]
          description: |
            `PLAN` requires `planId`. `PROJECT` requires it to be absent — a project-scope artifact
            is inherited by *every* plan (plan §6n), so a plan id on one would name a relationship
            that does not exist.

            This is also the field the permission qualifier reads. ~~`artifact:edit` is held
            outright by a Test Lead and **plan-scope-only** by a Test Engineer, so a `PROJECT` here
            can be a `403` where a `PLAN` from the same caller is a `201`.~~ → **`V52` (§210)
            de-qualified that grant, so no seeded role is refused by scope today** — the check is
            retained (roles spec §A5), and this field is still what it reads if a migration
            narrows a grant again.
        planId:
          type: string
          format: uuid
          nullable: true
          description: Required when `scope` is `PLAN`, and rejected otherwise.
        category:
          type: string
          maxLength: 60
          description: |
            Strategy · TestData · Environment · SignOff · Compliance · Tooling · Template · Other
            (plan §6n). A free string rather than an enum because the list is described as
            project-configurable, and the register groups by it rather than switching on it.
        kind:
          type: string
          enum: [DOC_PAGE_REF, EXTERNAL_URL, GENERATED_REPORT]
          description: |
            The two **reference** kinds, and — since audit C6 — the **pinned report**. Still
            narrower than `Artifact.kind`: `FILE` is refused here and the operation description
            names the endpoint that takes it.
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000, nullable: true }
        writeOnce:
          type: boolean
          default: false
          description: |
            **A sign-off record: the register keeps it as it was signed.** `true` refuses every
            later edit and every delete on this row with a `409` — corrections *supersede* instead
            (plan §6n), which leaves both documents and the fact that one replaced the other.

            Absent means `false`, and it is **decided here and never again**: there is no field for
            it on `ArtifactEditInput`, and the column is not updatable. Marking an existing row is
            deliberately impossible — a flag that can be set later can be set on somebody else's
            row to freeze it, and the whole value of the promise is that it was made when the
            document was registered.

            `write_once` has been enforced by the delete since §126 and by the edit since §229,
            against a column **nothing could set** (audit C7). Registration is that writer.

            Archiving is still allowed: circulation is not content, and a signed record that is no
            longer in use is exactly what `ARCHIVED` says. So is *being* superseded — that is the
            correction path this flag exists to force people onto.
        reportJobId:
          type: string
          format: uuid
          nullable: true
          description: |
            Required when `kind` is `GENERATED_REPORT`, rejected otherwise. The **job**, not the
            artifact: the job is what carries `projectId`, so it is the only id that can prove the
            report belongs to the project in the path (`report_artifact` has no `project_id` —
            `ReportArtifact`'s header states that and the download route already routes through
            the job for the same reason).

            It must name a `COMPLETED` job of this project. A `PENDING`, `RUNNING` or `FAILED` one
            is a `400`: there are no bytes to pin, and a register entry pointing at a report that
            never rendered is the failure mode plan §6n calls the register's own — an entry that
            claims a document and cannot produce it.

            The row stores the **artifact** the job produced. Regenerating from the same saved
            definition makes a new job and a new artifact and changes nothing here, which is the
            point of pinning: `Artifact.url` on this row answers the same bytes for ever.
        docPageId:
          type: string
          format: uuid
          nullable: true
          description: |
            Required when `kind` is `DOC_PAGE_REF`. Must name a live page **in this project** — a
            page in another project of the same company is a `400`, and one in another company is
            the same `400` rather than a `404`, because distinguishing them would confirm the id
            names something real (§6t).
        url:
          type: string
          maxLength: 2000
          nullable: true
          description: |
            Required when `kind` is `EXTERNAL_URL`. Must be `http` or `https`: the register renders
            this as a link, and a `javascript:` or `data:` URL rendered as one is stored XSS with
            the product's own markup around it.
        supersedes:
          type: string
          format: uuid
          nullable: true
          description: |
            The artifact this registration replaces, or omitted for an ordinary one. **The only
            writer of `SUPERSEDED`** — that row is flipped and its `supersededById` set in the same
            transaction, so a replacement and its effect are never two requests.

            It must sit at the **same scope** and, at `PLAN` scope, in the **same plan**. That is
            what makes the create's own scope-qualified gate cover both rows: the check that
            passed for the new one passed for a row in exactly the same place. Without the rule, a
            Test Engineer registers a plan-scope note that retires the project's test strategy —
            a document they hold read-only.

            Only an `ACTIVE` artifact may be replaced. A second replacement would overwrite
            `supersededById` and lose the middle of the chain; an archived row is already out of
            use, and the `400` says to restore it first.

            The **kinds are free to differ**. What is being recorded is that one document took over
            from another, and a stale uploaded copy replaced by an authored doc page is exactly the
            move plan §6n steers people toward.

    ArtifactEditInput:
      type: object
      required: [title, category]
      description: |
        A correction, for `PATCH /projects/{projectId}/artifacts/{artifactId}` — the register's
        editable metadata, stated whole.

        These three are its **entire** editable surface. Scope, plan, kind and every payload column
        are `updatable = false` on the entity; correcting what an artifact *points at* is
        superseding it (plan §6n), and its status has its own operation.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            Required, because the column is `NOT NULL` — see the operation for why §68's
            null-clears convention makes requiring it the safe reading rather than merely the
            consistent one.
        category:
          type: string
          minLength: 1
          maxLength: 60
          description: |
            Required for `title`'s reason. Same free vocabulary the registration takes: the list is
            project-configurable (plan §6n) and the register groups by it rather than switching on
            it, so there is nothing to validate it against.
        description:
          type: string
          maxLength: 2000
          nullable: true
          description: |
            The one clearable field, and `null` is how it clears. A register entry that once
            carried a note and no longer needs one is an ordinary thing.

    ArtifactStatusInput:
      type: object
      required: [status]
      description: |
        The state the caller wants, for
        `PUT /projects/{projectId}/artifacts/{artifactId}/status`.
      properties:
        status:
          type: string
          enum: [ACTIVE, ARCHIVED]
          description: |
            **A proper subset of `Artifact.status`.** `SUPERSEDED` is missing on purpose rather
            than by omission: it is a fact about another row, so it is written by registering a
            replacement and by nothing else. Declaring it here would offer a value the server
            refuses — a contract disagreeing with itself about the same field.

    # --------------------------------------------------------------- admin ---
    User:
      allOf:
        - $ref: '#/components/schemas/UserRef'
        - type: object
          required: [status, teams]
          properties:
            status: { type: string, enum: [ACTIVE, INVITED, DEACTIVATED] }
            lastLoginAt: { type: string, format: date-time, nullable: true }
            teams:
              type: array
              items: { type: string }

    UserInvitationInput:
      type: object
      required: [email, displayName]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          description: |
            Case-insensitive (`citext`). Matching an account that already exists on the instance
            reuses it silently — see the operation's description for why the answer must not
            differ.
        displayName:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            **This company's** name for the person (§6u), stored on the membership rather than on
            the account. A contractor is legitimately "A. Kotrulev" to one client and
            "Aleks (Vendor)" to another, and neither may see or overwrite the other's.
      description: |
        There is no `companyId` and no role. The company comes from the session's context (ERD
        §0.1 point 2), and what the person may *do* is a separate grant — `POST /role-assignments`
        — so that inviting somebody can never be the act that also gives them access.

    UserInvitation:
      type: object
      required: [user, issued, emailed, expiresAt]
      properties:
        user: { $ref: '#/components/schemas/User' }
        issued:
          type: boolean
          description: |
            Whether **this call minted a fresh activation link**. `false` means there was nothing
            to mint — the person is already an active member, or an unexpired invitation was
            outstanding and was deliberately left alone.

            It carries the same fact as `201` vs `200`, and it is on the body because the two
            reasons a link was not *sent* are not otherwise distinguishable: `emailed: false` with
            `issued: true` is "no relay on this install", and with `issued: false` it is "nothing
            needed sending". A client that infers the first from `emailed` alone tells an
            administrator with a perfectly good relay that their mail is broken, every time they
            click twice.
        emailed:
          type: boolean
          description: |
            Whether the activation link was handed to a configured SMTP relay. `false` means either
            that the instance has none and an operator must deliver the link by hand, or that
            nothing was minted to send — see `issued`. Never that the invitation failed.
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: |
            When the outstanding invitation lapses. **Null when there is nothing to accept** —
            the person is already an active member.
      description: |
        The activation link itself is deliberately **absent**. It is a live single-use secret with
        exactly one legitimate destination (the invitee's inbox); putting it in an API response
        publishes it to devtools, to any proxy log, and to whatever the SPA caches.

    ApiToken:
      type: object
      required:
        [id, name, tokenPrefix, ownerId, roleId, roleName, projectId, expiresAt, lastUsedAt,
         revokedAt, createdAt]
      description: |
        A non-human credential — **everything about it except the credential**. The secret appears
        exactly once, in the response to `POST /api-tokens`, and is unrecoverable afterwards.
      properties:
        id: { type: string, format: uuid }
        name:
          type: string
          description: |
            Unique among the company's **live** tokens. A revoked name is reusable, because the
            name is written into somebody's CI configuration and rotation is issue-then-revoke.
        tokenPrefix:
          type: string
          description: |
            The first 12 characters of the secret, so a row can be matched against a CI
            configuration. A deliberate partial disclosure of a 256-bit secret, and not a
            credential: nothing accepts it.
        ownerId:
          type: string
          format: uuid
          description: |
            The person answerable for it, and a **permission input** rather than provenance —
            their own grants cap what the token can do.
        roleId: { type: string, format: uuid }
        roleName:
          type: string
          description: |
            Expanded because a uuid tells an administrator nothing about what a leaked token could
            do. A label: nothing checks it, and the grant is resolved from `roleId`.
        projectId:
          type: string
          format: uuid
          nullable: true
          description: |
            One project, or null for every project the owner can reach. When set it is a **hard
            scope** — the token is inert on every other project.
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Null for a token that does not expire.
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            **Always null today.** The column exists and has no writer: a write on every
            authenticated request is a write-amplification decision that wants a batching answer,
            not an `UPDATE` inside a filter. On the wire so a client is built against the shape.
        revokedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            When the credential was withdrawn, or null while it is live. Revoked tokens stay in
            the list — see `GET /api-tokens`.
        createdAt: { type: string, format: date-time }

    ApiTokenInput:
      type: object
      required: [name, roleId, projectId, expiresAt]
      description: |
        **There is no `ownerId`.** The owner is the caller — see `POST /api-tokens` for why a
        nominated owner would be an escalation path rather than a convenience.
      properties:
        name:
          type: string
          maxLength: 120
          description: |
            What this token is for, in the issuer's words. A clash with another live token is a
            field error on `name`: two rows called "CI" are two rows nobody can tell apart when
            one has to be revoked in a hurry.
        roleId:
          type: string
          format: uuid
          description: |
            The role the token carries — **not the caller's own**. SYSTEM-scope roles are refused,
            and so is the membership baseline, which is a consequence of membership rather than a
            role anybody chooses.
        projectId:
          type: string
          format: uuid
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Must be in the future when present. Null means it does not expire — **except for an
            `Agent` token, where null is refused**: see the operation description.

    IssuedApiToken:
      type: object
      required: [token, secret]
      description: |
        The creation response, and **the only shape in this API that carries a secret**. Kept as
        its own type rather than a nullable field on `ApiToken`, so that no read path is one
        forgotten null away from serving a credential.
      properties:
        token: { $ref: '#/components/schemas/ApiToken' }
        secret:
          type: string
          description: |
            The plaintext, shown once. Store it in the CI system's secret store immediately; it
            cannot be recovered, and nothing here can show it again.

    SocialProvider:
      type: string
      enum: [GITHUB, GITLAB, GOOGLE]
      description: |
        An instance-level social sign-in authority — for people, not companies, which is why
        this is a closed enum and not an `identity_provider` row.

    SocialProviderList:
      type: object
      required: [providers]
      description: |
        What `GET /auth/social/providers` answers with. Present means configured by the
        operator; absent means the button does not exist. Often empty; never an error.
      properties:
        providers:
          type: array
          items: { $ref: '#/components/schemas/SocialProvider' }

    SocialRedirect:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: The provider's authorization URL; navigate the browser to it.

    SocialIdentity:
      type: object
      required: [provider, linkedAt]
      properties:
        provider: { $ref: '#/components/schemas/SocialProvider' }
        linkedAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        emailAtLink:
          type: string
          nullable: true
          description: What the provider asserted at link time. Provenance, never a key.

    SocialIdentityList:
      type: object
      required: [identities]
      properties:
        identities:
          type: array
          items: { $ref: '#/components/schemas/SocialIdentity' }

    SsoProviderDiscovery:
      type: object
      required: [providers]
      description: |
        What `POST /auth/providers` answers with. **Always present, often empty** — an empty list
        is the answer for an unclaimed domain, a disabled provider and a malformed address alike,
        because a login surface must not be an oracle for which companies exist (§6r).
      properties:
        providers:
          type: array
          items: { $ref: '#/components/schemas/SsoProviderChoice' }

    SsoProviderChoice:
      type: object
      required: [id, displayName, kind]
      description: |
        One sign-in route. **No company id and no company name** — a domain may be claimed by
        several companies, and naming them would publish the client roster this shape exists to
        withhold.
      properties:
        id:
          type: string
          format: uuid
          description: What `GET /auth/sso/{providerId}/authorize` takes.
        displayName:
          type: string
          description: |
            The label, chosen by the client's own administrator — the only string this endpoint
            puts in front of an anonymous caller, and theirs to disclose to somebody who has just
            typed an address at their domain.
        kind:
          allOf: [{ $ref: '#/components/schemas/IdentityProviderKind' }]
          description: |
            Which control the sign-in screen renders: `OIDC` is a button that navigates to the
            issuer, `LDAP` is a password field on this screen. **It is not a company identifier** —
            it says which protocol a route speaks, and nothing about who operates it or how many
            companies claim the domain, so it is disclosed on the same terms as `displayName`.

    IdentityProviderKind:
      type: string
      enum: [OIDC, LDAP]
      description: |
        Which protocol this provider speaks, and therefore **which fields on this schema are
        populated and how a person signs in through it**. `OIDC` redirects the browser to a third
        party that collects the password; `LDAP` collects the directory password here and binds with
        it. **There is no SAML member** — resolved question #40 ruled it out of scope, and a value
        nothing can create is a state the code must branch on for no reason.

    IdentityProvider:
      type: object
      required:
        [id, key, kind, displayName, issuerUri, clientId, clientSecretSet, bindDn, bindPasswordSet,
         startTls, userSearchBase, userSearchFilter, userIdAttribute, emailAttribute,
         displayNameAttribute, jitProvisioning, autoLinkVerifiedEmail, groupClaim, enabled,
         createdAt, updatedAt]
      description: |
        One external authority a company authenticates its own people against — an OIDC issuer or a
        directory, which is what `kind` says and what decides which half of these fields is
        populated.

        **Neither credential appears here or on any other read path** — not the client secret, not
        the bind password. `clientSecretSet` and `bindPasswordSet` are what replace them: a form
        needs to know whether one is stored so it can say "leave blank to keep", and that is a
        boolean, not the value.
      properties:
        id: { type: string, format: uuid }
        key:
          type: string
          description: Stable, unique within the company, set once at registration.
        kind: { $ref: '#/components/schemas/IdentityProviderKind' }
        displayName: { type: string }
        issuerUri:
          type: string
          description: |
            Where the authority lives, and its meaning follows `kind`. For `OIDC` it is the issuer,
            always `https` — the signing keys every assertion is checked against come from it. For
            `LDAP` it is the directory URL, and it is `ldaps://…` or `ldap://…` with `startTls`:
            a plain bind puts the person's own directory password on the wire, and there is no flag
            that permits it.
        clientId:
          type: string
          nullable: true
          description: OIDC only. Null on an `LDAP` provider, which has no relying-party identity.
        clientSecretSet:
          type: boolean
          description: |
            Whether a secret is stored. `false` means a public client using PKCE alone, which is a
            configuration rather than an omission.
        bindDn:
          type: string
          nullable: true
          description: |
            LDAP only. The service account this instance searches as, before the person's own bind.
            Null means an anonymous search, which some directories permit and Active Directory
            does not.
        bindPasswordSet:
          type: boolean
          description: |
            Whether a bind password is stored — `clientSecretSet`'s counterpart, and a boolean for
            the same reason: no read path echoes the value back.
        startTls:
          type: boolean
          description: |
            LDAP only. Whether to upgrade an `ldap://` connection with StartTLS. An `ldaps://` URL
            is already encrypted and does not use it. False on an `OIDC` provider.
        userSearchBase:
          type: string
          nullable: true
          description: LDAP only. The subtree searched for the person signing in — `ou=people,dc=acme,dc=test`.
        userSearchFilter:
          type: string
          nullable: true
          description: |
            LDAP only. **Must contain `{0}`**, which is where the typed address is substituted with
            RFC 4515 escaping applied. A filter that interpolated it any other way would be an
            injection point on an unauthenticated surface.
        userIdAttribute:
          type: string
          nullable: true
          description: |
            LDAP only. Which attribute holds the directory's immutable identifier — `objectGUID` on
            Active Directory, `entryUUID` on OpenLDAP. **Never a DN**: a DN encodes tree position, so
            moving somebody between OUs would orphan their account and their authorship.
        emailAttribute:
          type: string
          nullable: true
          description: LDAP only. Which attribute carries the address — `mail` on both common directories.
        displayNameAttribute:
          type: string
          nullable: true
          description: LDAP only. Which attribute carries the person's name, for the membership this creates.
        jitProvisioning:
          type: boolean
          description: |
            Whether a first-time signer with no invitation gets an account — with exactly what
            accepting an invitation grants and nothing more (roles spec §A7).
        autoLinkVerifiedEmail:
          type: boolean
          description: |
            Whether a **verified** address may bind a new subject to an existing account. An
            unverified one never links, whatever this says.
        groupClaim:
          type: string
          nullable: true
          description: |
            Which claim carries group membership. **Stored and not yet consulted** — claim-to-role
            mapping is its own slice, and the column exists so that slice needs no migration here.
        enabled:
          type: boolean
          description: Whether this is a live sign-in route. Always `false` immediately after registration.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    IdentityProviderInput:
      type: object
      required:
        [key, kind, displayName, issuerUri, clientId, clientSecret, bindDn, bindPassword, startTls,
         userSearchBase, userSearchFilter, userIdAttribute, emailAttribute, displayNameAttribute,
         jitProvisioning, autoLinkVerifiedEmail, groupClaim, enabled]
      description: |
        No `companyId` and no `id`: the company comes from the session's context and the id from
        the path, because request input never selects the tenancy discriminator (ERD §0.1 point 2).

        `key` and `kind` are **ignored on `PUT`** — both are set once.
      properties:
        key:
          type: string
          maxLength: 60
          description: Lowercase letters, digits and hyphens.
        kind: { $ref: '#/components/schemas/IdentityProviderKind' }
        displayName: { type: string, maxLength: 120 }
        issuerUri:
          type: string
          maxLength: 500
          description: |
            Must begin `https://` on an `OIDC` provider, and be `ldaps://` — or `ldap://` with
            `startTls` — on an `LDAP` one.
        clientId:
          type: string
          nullable: true
          maxLength: 500
          description: OIDC only. Null on an `LDAP` provider, which has no relying-party identity.
        clientSecret:
          type: string
          nullable: true
          description: |
            The plaintext, sent when it is set or rotated. **Null or empty keeps the stored
            secret** rather than clearing it — no read path can echo it back, so a caller has
            nothing to resend. Encrypted at rest, never hashed: a token exchange needs it back.
        bindDn: { type: string, nullable: true, maxLength: 500 }
        bindPassword:
          type: string
          nullable: true
          description: |
            The plaintext service-account password, sent when it is set or rotated. **Null or empty
            keeps the stored one** rather than clearing it — `clientSecret`'s rule exactly, for
            `clientSecret`'s reason: no read path can echo it back, so a caller has nothing to
            resend. Encrypted at rest, never hashed.
        startTls: { type: boolean, nullable: true }
        userSearchBase: { type: string, nullable: true, maxLength: 500 }
        userSearchFilter: { type: string, nullable: true, maxLength: 500 }
        userIdAttribute: { type: string, nullable: true, maxLength: 100 }
        emailAttribute: { type: string, nullable: true, maxLength: 100 }
        displayNameAttribute: { type: string, nullable: true, maxLength: 100 }
        jitProvisioning: { type: boolean, nullable: true }
        autoLinkVerifiedEmail: { type: boolean, nullable: true }
        groupClaim: { type: string, nullable: true }
        enabled:
          type: boolean
          nullable: true
          description: Ignored on registration, which always produces a disabled provider.

    EmailDomains:
      type: object
      required: [domains]
      description: |
        The domains one company claims, as a whole set. Both the request and the response shape of
        `PUT /identity-providers/email-domains`.
      properties:
        domains:
          type: array
          items:
            type: string
            description: A bare domain — `acme.test`, not an address. Stored lower-case.

    Team:
      type: object
      required: [id, name, leads, members, projects]
      properties:
        id: { type: string, format: uuid }
        parentTeamId:
          type: string
          format: uuid
          nullable: true
          description: Org-chart structure only — permissions never cascade (plan §6k).
        name: { type: string }
        description: { type: string, nullable: true }
        leads:
          type: array
          items: { $ref: '#/components/schemas/UserRef' }
        members:
          type: array
          items: { $ref: '#/components/schemas/UserRef' }
        projects:
          type: array
          items:
            type: object
            # Same descent rule as CurrentUser.teams, which carries this comment already: a team's
            # project row exists BECAUSE it has a grant, so all three are always populated.
            required: [projectId, projectName, roleName]
            properties:
              projectId: { type: string, format: uuid }
              projectName: { type: string }
              roleName: { type: string }

    # ------------------------------------------------------------ org chart ---
    OrgChart:
      type: object
      # One document, one snapshot. Three queries assembled client-side would render a grid
      # whose axes were read at three different moments — and the matrix cells cannot be
      # derived on the client at all (see GET /org-chart).
      required: [teams, people, projects]
      properties:
        teams:
          type: array
          items: { $ref: '#/components/schemas/Team' }
          description: |
            The EXISTING `Team` shape, unchanged — so the chart and `/admin/teams` cannot draw
            different trees or different project chips. `Team.projects[]` is already clipped to
            what the caller may see.
        people:
          type: array
          items: { $ref: '#/components/schemas/OrgChartPerson' }
        projects:
          type: array
          items: { $ref: '#/components/schemas/OrgChartProject' }
          description: |
            The matrix columns: EXACTLY the projects this caller holds `project:read` on, by
            name. A project the caller cannot open contributes no column, no cell and **no
            count** — an unreachable project and a non-existent one are indistinguishable
            (plan §6t), and a count would be a name-free existence claim about the company's
            portfolio.

    OrgChartProject:
      type: object
      required: [id, key, name, archived]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        archived: { type: boolean }

    OrgChartPerson:
      allOf:
        - $ref: '#/components/schemas/UserRef'
        - type: object
          required: [status, teams, leadsTeams, companyRoles, projects]
          properties:
            status:
              type: string
              enum: [ACTIVE, INVITED, DEACTIVATED]
            teams:
              type: array
              items: { $ref: '#/components/schemas/TeamRef' }
              description: |
                Refs, not names — the chart links a person to a team NODE. `User.teams` is
                `string[]` and stays that way; widening a shipped shape for a screen that can
                have its own is a breaking change, and a new schema is not.
            leadsTeams:
              type: array
              items: { $ref: '#/components/schemas/TeamRef' }
              description: |
                The subset of `teams` where `team_membership.is_lead`. **A Team Lead is not the
                Test Lead role** — that column's own comment says so — and the flag confers no
                permission; it names the default reviewer.
            companyRoles:
              type: array
              items: { type: string }
              description: |
                COMPANY-scope role names held (in practice `Company Admin`, or empty). On the
                PERSON, never smeared across every column: a COMPANY-scope role is authority
                over the company rather than a default for its projects, and is never
                overridden by a project grant (roles spec §A1.1 property 2). Filling every
                column with it is the misreading this placement exists to prevent.

                Visible to every member: a company's administrators are not a secret from its
                members, and omitting the field would render a Company Admin as somebody with
                no assignments at all, which is the opposite of true.

                **SYSTEM scope is absent from this surface entirely.**
                `instance_role_assignment` has no `company_id` and no RLS, and telling a tenant
                which of its members has instance-wide reach is a different disclosure —
                audited in the client's own trail rather than advertised (roles spec §A7).
            projects:
              type: array
              items: { $ref: '#/components/schemas/OrgChartAssignment' }
              description: |
                One entry per project column where this person holds an effective PROJECT-scope
                role. Empty for somebody with no reach into any project the CALLER can see —
                which is not the same claim as "no reach", and the screen must not read it as
                one.
            lastLoginAt:
              type: string
              format: date-time
              nullable: true
              description: |
                **Null for a caller who does not hold `company:members`** — the same rule and
                the same reason as `User.lastLoginAt`. Field-level redaction, not a different
                shape: the field is nullable for everyone.

    OrgChartAssignment:
      type: object
      required: [projectId, roleName, via]
      properties:
        projectId: { type: string, format: uuid }
        roleName:
          type: string
          description: |
            The person's EFFECTIVE PROJECT-scope role here, after roles spec §A1.1's
            replace-don't-union override: a grant naming the project wins, otherwise the
            company-wide PROJECT-scope role applies. **Display only** — nothing may branch on
            this string; code checks permissions, never role names (plan §6b).

            Where a person holds two grants on one project (directly and through a team, or
            through two teams), the winner is the role conferring more permissions — derived
            from `role_permission`, never a hard-coded name ordering.
        via:
          type: string
          enum: [DIRECT, TEAM, INHERITED]
          description: |
            How the role is held. `DIRECT` — a grant naming this person and this project.
            `TEAM` — a grant to a team they belong to, naming this project. `INHERITED` — a
            PROJECT-scope role granted company-wide, applying here because no grant names this
            project.

            A COMPANY-scope reacher (a Company Admin) produces **no assignment row at all**;
            they appear in `companyRoles`. A matrix built from `role_assignment WHERE
            project_id = ?` renders `DIRECT` and `TEAM` identically and omits `INHERITED`
            entirely, which is the completeness bug this enum exists to make visible.
        viaTeam:
          allOf: [{ $ref: '#/components/schemas/TeamRef' }]
          nullable: true
          description: Non-null exactly when `via` is `TEAM`.

    TeamInput:
      type: object
      description: |
        The editable half of a `Team` — everything `POST /teams` and `PUT /teams/{teamId}` decide.

        **The people are deliberately not in here.** Membership has its own URL per person
        (`PUT /teams/{teamId}/members/{userId}`), because the two writes answer to different
        failures: a name clash is about the team, and "that person is not in this company" is about
        one member. Folding a member list in would make a create partially succeed — the team
        exists, one of the five people named did not — with one status code to report it.
      required: [name, description, parentTeamId]
      properties:
        name:
          type: string
          maxLength: 200
          description: |
            Unique within the company, **compared case-insensitively** — "QA" and "qa" are the same
            team to everyone who reads the org chart. A clash is a field error on `name`.
        description:
          type: string
          nullable: true
          maxLength: 2000
        parentTeamId:
          type: string
          format: uuid
          nullable: true
          description: |
            `null` makes this a root team. Org-chart structure only — permissions never cascade
            through it (plan §6k), so this decides where the team is drawn and nothing about what
            anyone can do.

    TeamMemberInput:
      type: object
      description: The membership state being asserted for one person in one team.
      required: [lead]
      properties:
        lead:
          type: boolean
          description: |
            Whether they lead the team. A lead is a member with a flag, not a separate role — it is
            org-chart information, and it grants nothing. Somebody's capability in this product
            comes from a role assignment, never from leading a team.

    Role:
      type: object
      description: |
        A built-in role. There are no custom roles in v1 — not even clone-and-edit
        (plan §6b) — so `builtIn` is always true and there is no create or update
        endpoint. Enforcement is permission-based throughout: nothing in the code
        checks a role NAME, which is what keeps adding a role designer additive.

        A COMPANY-scope grant covers every project in that company, present and future.
        That is what makes Company Admin work, and why nothing else is granted there.

        **Seven names, and only five of them may be granted to a person.** Two are
        capability ceilings a *credential* carries: `Agent` (roles spec §A6a), and
        `Automation Service` (§A6), which has been documented as "attached to API
        tokens, never people" since M0 and was made non-assignable by `V41`. Both are
        listed here because the token-issue form is the only place either is ever
        chosen, and both are refused by `POST /role-assignments`. Filter this list by
        `assignable` when rendering a grant picker — see that field. The eighth seeded
        row, the `Company Member` membership baseline, is filtered out server-side and
        never appears here at all.
      required: [id, name, scope, builtIn, assignable, description, permissions]
      properties:
        id: { type: string, format: uuid }
        name:
          type: string
          enum:
            - Instance Admin
            - Company Admin
            - Test Lead
            - Test Engineer
            - Automation Service
            - Viewer
            - Agent
        scope: { type: string, enum: [SYSTEM, COMPANY, PROJECT] }
        builtIn: { type: boolean }
        assignable:
          type: boolean
          description: |
            Whether `POST /role-assignments` may grant this role to a person or a team.
            False for `Agent` and, since `V41`, for `Automation Service` — both carried by
            a token, neither held by anybody.

            It answers **one** question, and four that used to have the same answer have
            come apart: may a person hold it (this field), may a token carry it (both:
            yes), is it listed (both: yes, which is why you are reading this), and may an
            existing grant be revoked (**yes** — a grant made before the role became
            non-assignable is exactly what an administrator must be able to clean up, so
            those rows stay on `GET /role-assignments` and `DELETE` accepts them). A client
            that hides a role because it is non-assignable must do so in the grant pickers
            only — hiding it in the token form makes it unobtainable, and hiding it in the
            assignment list hides a Revoke somebody needs.

            Client-side filtering here is **affordance, not security**: the server refuses
            the grant regardless.
        description: { type: string }
        permissions:
          type: array
          description: |
            Permission keys, `resource:action`. The authoritative catalogue and the
            per-role grants live in docs/specs/2026-07-30-tcms-roles-permissions-naming.md.
            `OWN`-qualified entries (case:delete, evidence:delete for Test Engineer) are
            resolved server-side against createdBy — they are NOT separate keys.
          items: { $ref: '#/components/schemas/PermissionKey' }

    EffectivePermissions:
      type: object
      # `required` on BOTH fields, deliberately. The server always sends both — projectId
      # echoes the query parameter and is null when there wasn't one — and without the array
      # every generated property is optional, so a consumer must null-check a field that is
      # never absent and cannot tell "no permissions" from "no answer". That distinction is
      # the whole basis of the SPA's disable-don't-hide gate.
      required: [projectId, permissions]
      properties:
        projectId:
          type: string
          format: uuid
          nullable: true
          description: Echoes the query parameter. Null when the caller asked company-wide.
        permissions:
          type: array
          description: |
            Sorted by `key`, and possibly empty — an empty array is a real answer (a company
            member with no grant on this project), not a missing one.

            Entries carry a `qualifier` as well as a key. Until §65 this was an array of bare
            keys, and the omission had a cost the SPA could not work around: a Test Engineer
            held `artifact:edit` at `PLAN_SCOPE`, so a keys-only answer said "held", the
            project-scope control enabled, and the server refused the submit. Disable-don't-hide
            (handoff §31) is not expressible against an answer that cannot say "held, but not
            here".

            **That example is historical since `V52`** (§210): no grant in the shipped catalogue
            carries any qualifier at all — every row is `ALL` — so this field answers `ALL` for
            everything a caller holds today. It stays required, and the mechanism stays wired,
            for the reason roles spec §A5 gives: the qualifier is *data*, so removing the field
            is what would make a future qualified grant fail **open**.
          items: { $ref: '#/components/schemas/HeldPermission' }

    HeldPermission:
      type: object
      # Both required. A held key ALWAYS has a qualifier — `ALL` is what an unqualified grant
      # stores, not an absence — so an optional `qualifier` would invite every consumer to
      # invent a default, and the two plausible defaults grant different things.
      required: [key, qualifier]
      properties:
        key: { $ref: '#/components/schemas/PermissionKey' }
        qualifier: { $ref: '#/components/schemas/PermissionQualifier' }

    PermissionQualifier:
      type: string
      description: |
        WHICH ROWS a held permission covers — roles spec §A5. The key says what the caller may
        do; this says what they may do it to.

        `NONE` is deliberately absent from this enum. A permission the caller does not hold is
        an absent entry in `permissions`, never a present one qualified to nothing — the same
        rule the database follows, where a grant of nothing is an absent row.

        The two restrictive values are NOT comparable: `OWN` restricts by who wrote the row,
        `PLAN_SCOPE` by what scope the row sits at, and neither contains the other. A caller
        cannot receive both for one key — no permission is granted with two different
        restrictive qualifiers, which the server asserts over its own catalogue.
      enum:
        # Every row in scope. What an unqualified grant means, and the great majority.
        - 'ALL'
        # Only rows the caller authored, in any state. Compared against the row's createdBy;
        # a row with no recorded author is NOT the caller's.
        - 'OWN'
        # Only rows belonging to one plan, whoever wrote them. A project-scope row is
        # inherited read-only by every plan, so editing one edits every cycle at once.
        - 'PLAN_SCOPE'

    PermissionKey:
      type: string
      description: |
        The full v1 catalogue. Grouped by area, in the order the spec lists them.
        Six of these are newer than the first UI pass — suite:delete, project:audit,
        case:comment, defect:create, workitem:manage, library:manage — and three split
        a boundary that was previously wrong (suite:delete out of suite:manage,
        project:audit out of audit:view, case:comment below the review tier).
      enum:
        # repository
        - 'suite:manage'
        - 'suite:delete'
        - 'case:read'
        - 'case:create'
        - 'case:edit'
        - 'case:delete'
        - 'library:manage'
        # review — three tiers: comment < review < approve
        - 'case:comment'
        - 'case:review'
        - 'suite:review'
        - 'plan:review'
        - 'case:approve'
        - 'suite:approve'
        - 'plan:approve'
        # execution
        - 'plan:create'
        - 'plan:edit'
        - 'plan:delete'
        - 'run:create'
        - 'run:execute'
        - 'run:close'
        - 'result:submit'
        - 'result:amend'
        - 'evidence:attach'
        - 'evidence:delete'
        # defects & work
        - 'defect:create'
        - 'workitem:manage'
        # reporting
        - 'report:view'
        - 'report:export'
        # documentation
        - 'doc:read'
        - 'doc:edit'
        - 'doc:publish'
        # artifacts
        - 'artifact:read'
        - 'artifact:edit'
        - 'artifact:delete'
        # project
        - 'project:read'
        - 'project:audit'
        - 'project:settings'
        - 'project:members'
        - 'integration:manage'
        # company (COMPANY scope)
        - 'company:read'
        - 'company:settings'
        - 'company:members'
        - 'company:teams'
        - 'company:vocabulary'
        - 'company:idp'
        - 'project:create'
        - 'token:issue'
        - 'audit:view'
        # system (SYSTEM scope)
        - 'company:create'
        - 'company:delete'
        - 'company:suspend'
        - 'user:manage'
        - 'role:manage'
        - 'system:settings'
        - 'instance:audit'

    RoleAssignment:
      type: object
      required: [id, role, user, grantedAt]
      properties:
        id: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/Role' }
        user:
          description: |
            **Null on a team grant.** `ck_role_assignment_subject` is user *xor* team, and
            `POST /role-assignments` takes exactly one of `userId` and `teamId` — so a grant
            made to a team names no user, and the previous non-nullable `$ref` made the
            generated type claim otherwise. Third time this idiom has been needed for the same
            reason: see `EntityVersion.createdBy` and `TestExecutionSummary.executedBy`.
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
        team:
          description: |
            **Null on a user grant**, the other half of `user`'s rule above.

            A `$ref` since §175. It was an inline `{id, name}` object — the same properties as
            `TeamRef` and no relationship to it that anything could check, which is how the
            server came to serve it from a second Java record. The two are one now; see that
            schema for what a field added to it would reach.
          allOf: [{ $ref: '#/components/schemas/TeamRef' }]
          nullable: true
        projectId: { type: string, format: uuid, nullable: true }
        projectName: { type: string, nullable: true }
        grantedAt: { type: string, format: date-time }

    RoleAssignmentInput:
      type: object
      description: |
        `projectId` is what selects the scope of the grant, and therefore which permission
        gates it — see `POST /role-assignments`. It is nullable rather than optional so that
        "grant across the whole company" is something the caller states, not something they
        fall into by omitting a field.
      required: [roleId, projectId]
      properties:
        roleId: { type: string, format: uuid }
        userId: { type: string, format: uuid, nullable: true }
        teamId: { type: string, format: uuid, nullable: true }
        projectId:
          type: string
          format: uuid
          nullable: true
          description: Null grants the role across every project in the company, present and future.

    # ---------------------------------------------------------------- work ---
    WorkItem:
      type: object
      required: [id, derived, kind, title, status, priority, overdue, projectId, projectKey, allowedTransitions]
      properties:
        id: { type: string }
        derived:
          type: boolean
          description: |
            True for projections of an execution, review, or stale case. Derived items
            are NOT stored and their status comes from the source, so a card can never
            diverge from its execution (plan §6l).
        sourceType: { type: string, nullable: true, example: EXECUTION }
        sourceId: { type: string, format: uuid, nullable: true }
        kind:
          type: string
          description: |
            What the card is, which is what the SPA labels and groups by. Six of these
            were declared in §53 ahead of their generators so a new one would need no
            contract change; `QUARANTINE` is the seventh and it needed one, because §6l's
            "quarantined flaky test" is not any of the six.

            **It is deliberately not `CASE_MAINTENANCE`, and that is a rendering fact
            rather than a taxonomy preference.** A `CASE_MAINTENANCE` card's `description`
            is a comma-separated list of raw `HealthSignal` codes that the SPA labels from
            the contract's own enum (`BoardPage.describeCard`). A quarantine card's
            description is a sentence a person wrote. Filed under the same kind it would be
            split on commas and label-looked-up word by word, so "Quarantined by Ana —
            flaky on Firefox, sometimes" renders as its own fragments joined by a middot,
            with nothing failing anywhere.
          enum: [TASK, EXECUTION, REVIEW, DOC_UPDATE, CASE_MAINTENANCE, DEFECT, QUARANTINE]
        title: { type: string }
        description: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/WorkItemStatus' }
        priority: { $ref: '#/components/schemas/Priority' }
        dueDate: { type: string, format: date, nullable: true }
        overdue: { type: boolean }
        assignee:
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
          description: |
            Null for work nobody has taken — an execution in a run nobody has divided up,
            a stale case with no owner. `WorkItemView.assignee` is a record component, so
            the key is always present and the value is what carries the answer.

            **It was a bare `$ref` until §196**, which generates as optional-and-not-null,
            so the one shape this field takes most often was the one the contract could not
            spell. Found from the client end: a board fixture wrote `assignee: null` behind
            an `as WorkItem` cast, and removing the cast is what made the disagreement a
            compile error. Same family as §148 — the contract was wrong and both sides had
            quietly arranged themselves around it.
        projectId: { type: string, format: uuid }
        projectKey: { type: string }
        linkedKey: { type: string, nullable: true, example: TC-42 }
        allowedTransitions:
          type: array
          description: |
            Columns this card may legally move to; others reject the drop. Empty for a
            derived card whose source offers no board-driven action.
          items: { $ref: '#/components/schemas/WorkItemStatus' }

    WorkItemStatus:
      type: string
      description: |
        A board column, as a stable code rather than its English label.

        **It was an unconstrained `string` until §53, and that was the defect.** The SPA
        compared it against display text (`'To do'`), the mock served the same display
        text, and mock mode therefore agreed with itself perfectly — while any server that
        chose `TODO` would have filed every card into no column at all and rendered an
        empty board with no error. Same family as §52's `runs`/`entries`, one level down:
        not a field the two sides spelled differently, but a field whose *vocabulary* the
        contract never fixed, so neither side could be wrong.

        The label lives in `frontend/src/lib/labels.ts`, where a new member is a compile
        error until it is labelled. §6l's per-board configurable columns therefore become
        configuration over this enum rather than a contract change per column.

        **`BLOCKED` arrived in §54 and it is the fifth column, not merely a fifth value.**
        §53 left it out on purpose and said why: the board renders exactly the columns this
        enum names, so a status with no column would be a card that exists, is returned by
        this API, and appears **nowhere on screen** — invisible rather than misplaced, which
        is the worse of the two failures. That made adding it a contract change *plus* a
        label *plus* a grid column, and shipping only the first is how the invisible card
        gets there. All three land together, and since §54 the third piece cannot be
        forgotten separately: `workItemColumns` in `frontend/src/lib/labels.ts` is the keys
        of a map declared `satisfies Record<WorkItemStatus, string>`, so labelling a new
        member gives it a column in the same edit, and `BoardPage.tsx` asserts the result
        still covers the enum. Both are compile errors, not tests — stated that way because
        §205's rule found this sentence naming a ~~boardColumns.test.ts~~ that has never
        existed, while the check it describes had been real in two places all along.

        Ordered as §6l lists them, and the order on the wire is not the display order —
        `BoardPage`'s `COLUMNS` owns that. The enum's job is the vocabulary.
      enum: [TODO, IN_PROGRESS, BLOCKED, IN_REVIEW, DONE]

    WorkItemInput:
      type: object
      required: [projectId, title]
      properties:
        projectId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string, nullable: true }
        priority: { $ref: '#/components/schemas/Priority' }
        dueDate: { type: string, format: date, nullable: true }
        assigneeId:
          type: string
          format: uuid
          nullable: true
          description: |
            Omit to leave the task unassigned. **Unassigned, not "assigned to me"** — a
            board where every task silently belongs to whoever typed it cannot express the
            unclaimed pool §6l calls for, and the correction is invisible once made.
      description: |
        A new task. `status` is absent on purpose: a task starts in `TODO`, and letting a
        create choose its column would allow "create it in Done", which is a move without
        a move ever being recorded.

    WorkItemStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/WorkItemStatus' }

    # ------------------------------------------------------- integration ---
    NotificationChannel:
      type: object
      description: |
        Where one project sends its notices — **without its credential, and there is deliberately
        no property that could carry one.**

        A Slack or Teams incoming-webhook URL *is* the authentication for the room it posts to, so
        a read model carrying it would put a live secret into every response, log and browser
        cache that ever rendered a settings screen. `secretHint` is what replaces it.
      required:
        - id
        - projectId
        - kind
        - name
        - enabled
        - recipients
        - subscriptions
        - createdAt
        - updatedAt
        - lockVersion
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/NotificationChannelKind' }
        name:
          type: string
          description: |
            The administrator's own label. Unique within the project, so two channels posting to
            the same room are told apart by what somebody called them.
        enabled:
          type: boolean
          description: |
            A disabled channel is skipped when the event fires — applied in the query the
            dispatcher runs rather than at a call site, so "switched off" cannot come to mean
            "still delivered, just not shown".
        recipients:
          type: array
          items: { type: string }
          description: |
            Email addresses, for `EMAIL` channels. Empty for the two webhook kinds, which post to
            whatever room their URL names.
        secretHint:
          type: string
          nullable: true
          description: |
            The masked credential — the only part of one that ever leaves the server. **End
            anchored, four characters** (`…AbC1`): the tail of a webhook URL is its
            per-integration part, so it discriminates, where the host and path prefixes are
            identical across every webhook of a kind and would look informative while
            discriminating nothing.

            Showing nothing at all was rejected: it makes "is this the right webhook" unanswerable
            and invites the fix that follows from that — an administrator replaces a working secret
            to be sure, and every replacement is a chance to paste the wrong one.

            **Null for a kind with no credential of its own**, which is how an `EMAIL` channel and
            an unconfigured webhook are told apart on the screen.
        subscriptions:
          type: array
          items: { $ref: '#/components/schemas/NotificationSubscription' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lockVersion:
          type: integer
          format: int64
          description: Send it back as `If-Match` on the `PUT`.

    NotificationChannelInput:
      type: object
      description: |
        A full replacement, with **one field that does not obey that** — see `secret`.
      required: [kind, name, enabled, recipients, subscriptions]
      properties:
        kind:
          allOf: [{ $ref: '#/components/schemas/NotificationChannelKind' }]
          description: |
            Required on both writers and **ignored on the `PUT`** — a channel's transport is not
            editable. Required rather than optional there because a client sending the object it
            read should not have to strip a field, and silently accepting a *different* value
            would be a save that reports success and changes nothing.
        name: { type: string, minLength: 1, maxLength: 200 }
        enabled:
          type: boolean
          description: |
            Required, like `ProjectSettingsUpdate`'s switches and for the same reason: a dropped
            boolean would default to `false`, and a save that silently disabled a channel is a
            project that quietly stops being told anything.
        recipients:
          type: array
          items: { type: string, format: email }
          description: |
            At least one for `EMAIL`, where an empty list is a 400 on this field rather than a
            channel that delivers to nobody. Ignored for the webhook kinds; send `[]`.
        secret:
          type: string
          description: |
            The incoming-webhook URL, in plaintext, **on the way in only**. Encrypted at rest and
            returned by nothing — `NotificationChannel` has no property that could carry it back.

            **Required on the create for a webhook kind. Absent on the `PUT` means unchanged**,
            which inverts this API's usual convention on purpose: the screen never shows a secret,
            so an edit form has nothing to send back, and treating that emptiness as a clear would
            blank the credential of every channel anybody renamed. Send it to rotate; omit it to
            keep.

            Ignored for `EMAIL`, which authenticates as the deployment's mail relay.
        subscriptions:
          type: array
          items: { $ref: '#/components/schemas/NotificationSubscriptionInput' }
          description: |
            The complete set this channel wants, reconciled against what is stored — so an event
            type left out of the array is unsubscribed. `[]` is a legal channel that will never
            fire.

    NotificationSubscription:
      type: object
      description: One event type a channel wants, and the one filter this API ships.
      required: [id, eventType, minFailures]
      properties:
        id: { type: string, format: uuid }
        eventType: { $ref: '#/components/schemas/NotificationEventType' }
        minFailures:
          type: integer
          minimum: 0
          description: |
            Deliver only when at least this many results failed. `0` — the default — is every
            occurrence.

            **Served for every event type, including those that carry no verdicts**, where it is
            inert rather than a filter that never matches. Hiding it per type would put a rule
            about which events carry counts into the client, where it would be a second copy of a
            fact the server owns.

    NotificationSubscriptionInput:
      type: object
      required: [eventType, minFailures]
      properties:
        eventType: { $ref: '#/components/schemas/NotificationEventType' }
        minFailures:
          type: integer
          minimum: 0
          default: 0
          description: |
            Required, because `0` is a meaningful value — every occurrence — and a dropped field
            asserting it silently is the same defect as a dropped boolean.

    NotificationDelivery:
      type: object
      description: |
        One attempt against one channel. The operator's log, and the server's own idempotency
        record — outbox delivery is at-least-once, so without a durable record of what already
        went out one crash between the POST and the settle is a duplicate message.
      required: [id, channelId, eventId, eventType, status, attempt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        channelId: { type: string, format: uuid }
        eventId:
          type: string
          format: uuid
          description: |
            The **occurrence's** id, not the outbox row's. A handler is deliberately not told
            which row it is being delivered from, so the occurrence identifies itself inside the
            payload.
        eventType:
          type: string
          description: |
            Deliberately a bare string and **not `NotificationEventType`**, unlike the
            subscription beside it. This is a historical row: it may name an event this instance
            recorded once and no longer sends, and typing it as the live vocabulary would make an
            honest log fail a client's own parse.
        status: { $ref: '#/components/schemas/NotificationDeliveryStatus' }
        attempt:
          type: integer
          minimum: 0
          description: |
            Attempts against **this channel** for this occurrence — not the outbox row's count,
            which covers the whole event across every subscribed channel. A fan-out of three where
            one webhook is dead makes the two numbers different, and this is the one an operator is
            asking about.
        error:
          type: string
          nullable: true
          description: |
            Why the attempt failed, **already redacted** — a failed POST's message can quote the
            webhook URL, and it is stored redacted rather than masked on the way out, because a
            column an operator browses and a backup copies is the wrong place to rely on a
            rendering step. Null on a `SENT` row, including one that succeeded after failing:
            the previous failure's text no longer describes it.
        createdAt: { type: string, format: date-time }
        updatedAt:
          type: string
          format: date-time
          description: When the latest attempt ended. A retry updates the row rather than adding one.

    NotificationChannelKind:
      type: string
      description: |
        Which transport a channel is. Three from the start rather than one plus a promise: a port
        with a single implementation always leaks that implementation's vocabulary, and Slack's
        block kit and Teams' message card disagree enough to keep it honest — while SMTP disagrees
        with both about whether a message even has a room to be posted into.
      enum: [SLACK, TEAMS, EMAIL]

    NotificationDeliveryStatus:
      type: string
      description: |
        How an attempt ended. Terminal either way — a retry updates the row rather than adding a
        second one, so a channel's history is one line per occurrence and not one per try.
      enum: [SENT, FAILED]

    NotificationEventType:
      type: string
      description: |
        What a channel may subscribe to. Every member is a past-tense **occurrence carrying a
        payload**, which is what makes it deliverable at all: a coalesced event stands for every
        change since the last delivery, so a notification whose entire content is the payload
        cannot be sent from one.

        `execution.run_completed` carries the run, its final status and its pass/fail/blocked
        counts — which is what `NotificationSubscription.minFailures` filters on.
        `work.item_assigned` carries the item and its assignee, and has no counts, so a threshold
        set against it is inert rather than silencing. The same is true of all four `review.*`
        members.

        **The four `review.*` members are facts about a review, and a project with the review
        workflow switched off for an artifact type sends none of them.** Review is opt-in per
        project and per artifact type (`ProjectSettings`); with it off, submitting and approving
        write no review row, so there is nothing to have been asked about, to have a verdict on,
        or to sign off. A channel subscribed to them in such a project is silent, and that is the
        setting rather than a fault.

        - `review.requested` — somebody was asked to look at an artifact. Only a request that was
          actually written: re-asking the same person is idempotent and sends nothing.
        - `review.endorsed` — a peer said it looks good (`LGTM`). **Advisory, and deliberately not
          called an approval**: recording a peer verdict costs `*:review`, signing off costs
          `*:approve`, and one name for both would put a cheaper door to a sign-off on the wire.
        - `review.changes_requested` — a peer asked for changes. Its own member rather than a
          field on one "a peer spoke" event, because the two are opposite requests to act and a
          single name would make every subscriber re-derive which one it wanted.
        - `review.approved` — the sign-off, for a case, a suite or a plan alike; the payload says
          which. **A bulk approval sends one per artifact** — up to 500, the bulk cap — because
          each names a different subject and a single event could name only one of them honestly.
          A channel that does not want per-artifact sign-off notices does not subscribe to this.

        **A "run failed" event is deliberately absent**: it is not an event, it is a predicate on
        `execution.run_completed`, and modelling it as one keeps the producing module from having
        to know what any subscriber considers alarming.

        **`defect created` is absent for a different reason** — it has no producer. Defect filing
        is M4 scope behind an issue-tracker port and is unbuilt, and a name nothing records would
        be a subscription somebody configured that can never fire.
      enum:
        - execution.run_completed
        - work.item_assigned
        - review.requested
        - review.endorsed
        - review.changes_requested
        - review.approved

security:
  - bearerAuth: []
